name: MEN-Update

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      recrawl:
        description: 'إعادة سحب النصوص الكاملة من الصفحات (طويلة)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: men-update
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: تنصيب المكتبات
        run: pip install feedparser

      - name: جمع الأخبار من المصادر
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python aggregate.py

      - name: جلب النص الكامل للخبر
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python fulltext.py 4

      - name: إعادة سحب كل النصوص من الصفحات (بناء على الطلب فقط)
        if: inputs.recrawl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python fulltext.py force

      - name: تنظيف النصوص المخزنة من الضوضاء
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python clean_step.py

      - name: حذف الأخبار الأقدم من 3 أيام
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python prune.py

      - name: بدء دورة التحديث التالية تلقائيًا
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run MEN-Update --repo "${{ github.repository }}"