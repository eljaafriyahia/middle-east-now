سائل إعلام إيرانية أن دوي انفجارات ​سمع اليوم السبت بالقرب من جزيرة خرج الإيرانية في الخليج، وهي محطة رئيسية للنفط، ​وسط ‌تقارير غير مؤكدة تفيد بأن قوات أمريكية استهدفت ناقلة إيرانية على مقربة ‌منها. وذكرت وكالة فارس شبه الرسمية للأنباء أن دوي انفجارات سمع من الخليج، لكن دون ظهور أثر لدخان ​أو", "link": "https://www.france24.com/ar/%D9%81%D9%8A%D8%AF%D9%8A%D9%88/20260905-%D8%AF%D9%88%D9%8A-%D8%A7%D9%86%D9%81%D8%AC%D8%A7%D8%B1%D8%A7%D8%AA-%D9%82%D8%B1%D8%A8-%D8%AC%D8%B2%D9%8A%D8%B1%D8%A9-%D8%AE%D8%B1%D8%AC-%D8%A7%D9%84%D8%A5%D9%8A%D8%B1%D8%A7%D9%86%D9%8A%D8%A9-%D9%88%D8%AA%D9%82%D8%A7%D8%B1%D9%8A%D8%B1-%D8%B9%D9%86-%D8%A7%D8%B3%D8%AA%D9%87%D8%AF%D8%A7%D9%81-%D9%86%D8%A7%D9%82%D9%84%D8%A9", "image": "https://s.france24.com/media/display/96ce9d8e-a904-11f1-a2a3-005056bf30b7/w:1024/p:16x9/AR-20260905-100133-100350-CS.jpg", "category": "أمن", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788591821, "detail": ""}, {"guid": "49f7dc8a-a906-11f1-aad8-79a19839b1c1", "title": "تقدم أوروبي بشأن إقامة \"مركز عودة\" للمهاجرين خارج التكتل", "summary": "قالت خمس دول أوروبية إنها ​تسعى إلى توقيع اتفاقات خلال العام الجاري لإرسال المهاجرين الذين لا يملكون حق الإقامة ​القانونية إلى دول خارج الاتحاد الأوروبي، وذلك خلال اجتماع استضافته الدانمرك الجمعة. وأضافت ألمانيا والنمسا واليونان والدانمرك وهولندا أنها اتفقت على خطوات ملموسة نحو إبرام اتفاق مع ​دولة ", "link": "https://www.france24.com/ar/%D9%81%D9%8A%D8%AF%D9%8A%D9%88/20260905-%D8%AA%D9%82%D8%AF%D9%85-%D8%A3%D9%88%D8%B1%D9%88%D8%A8%D9%8A-%D8%A8%D8%B4%D8%A3%D9%86-%D8%A5%D9%82%D8%A7%D9%85%D8%A9-%D9%85%D8%B1%D9%83%D8%B2-%D8%B9%D9%88%D8%AF%D8%A9-%D9%84%D9%84%D9%85%D9%87%D8%A7%D8%AC%D8%B1%D9%8A%D9%86-%D8%AE%D8%A7%D8%B1%D8%AC-%D8%A7%D9%84%D8%AA%D9%83%D8%AA%D9%84", "image": "https://s.france24.com/media/display/456069da-a906-11f1-a5e7-005056bf30b7/w:1024/p:16x9/AR-20260905-101143-101319-CS.jpg", "category": "أخبار", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788591592, "detail": ""}, {"guid": "CBMiV0FVX3lxTE82TnVVamxqbzd1bEJqZWpsNWhVTjJDNXBpWUoxczYwMTRFRlMzQ1RkTVVybldmc0FqVEN5dmVjc1AzY1hrbFpyZmRmNTlGVXVrT0Q5SVpubw", "title": "فارس: ناقلة نفط إيرانية في جزيرة خارك تتعرض لهجوم صاروخي أمريكي - وكالة الانباء العراقية (واع)", "summary": "فارس: ناقلة نفط إيرانية في جزيرة خارك تتعرض لهجوم صاروخي أمريكي &nbsp;&nbsp; وكالة الانباء العراقية (واع)", "link": "https://news.google.com/rss/articles/CBMiV0FVX3lxTE82TnVVamxqbzd1bEJqZWpsNWhVTjJDNXBpWUoxczYwMTRFRlMzQ1RkTVVybldmc0FqVEN5dmVjc1AzY1hrbFpyZmRmNTlGVXVrT0Q5SVpubw?oc=5", "image": "", "category": "اقتصاد", "source_id": "ina", "source_name": "الوكالة العراقية (العراق)", "source_cat": "وكالة رسمية", "published": 1788591457, "detail": ""}, {"guid": "https://www.bbc.com/arabic/articles/c305dqgn3gpo#0", "title": "متحف في فيينا يحاكي كيف حاول البشر فهم العالم", "summary": "يروي متحف الكرة الأرضية في فيينا، قصة العالم من خلال أكثر من 220 كرة أرضية وسماوية نادرة، وهو المتحف العام الوحيد في العالم المخصص بالكامل للكرات الأرضية.", "link": "https://www.bbc.com/arabic/articles/c305dqgn3gpo?at_medium=RSS&at_campaign=rss", "image": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/8f24/live/9691f890-a907-11f1-bddd-351282998660.png", "category": "أخبار", "source_id": "bbc-arabic", "source_name": "بي بي سي عربي", "source_cat": "دولية", "published": 1788587031, "detail": "BBC News, عربيإذهب الى المحتوىرئيسيةشاهداستمعأقسامرئيسيةأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتمتحف في فيينا يحاكي كيف حاول البشر فهم العالمصدر الصورة، Globe Museum & Pichler\n\nإنه المتحف العام الوحيد المخصص للكرات الأرضية، ويحكي، حرفياً، قصة عالمنا، المتحف الجميل والسريالي والفارغ بشكل مخيف: متحف الكرات الأرضية في فيينا.\n\nفي ظهيرة باردة من أيام فيينا، كانت طوابير الزوار تمتد من أمام باب المكتبة الوطنية النمساوية وتلتف حول ساحة جوزيفسبلاتز، وبعد أن فشلت في العثور على تذاكر دخول في عدد من المعالم القريبة المكتظة، قررت الابتعاد عن الزحام.\n\nوهكذا قادتني المصادفة إلى متحف أصغر وأقل شهرة، يقع داخل قصر بالايس مولارد التاريخي الذي يعود إلى القرن السابع عشر، وهو المتحف العام الوحيد في العالم المخصص بالكامل للكرات الأرضية، ويُعد واحداً من أعظم مفاجآت المدينة.\n\nسرعان ما أدركت أنني أتجول في عالم آخر، أو لأكون أكثر دقة، في عدة عوالم.\n\nففي هذا المكان الهادئ، الواقع على بُعد خطوات قليلة من أشهر معالم المدينة وأكثرها ازدحاماً، يعرض متحف غلوب في فيينا أكثر من 220 كرة أرضية قديمة ونادرة، يعود معظمها إلى ما قبل عام 1850، بدءاً من الكرات الضخمة التي صنعها رسام الخرائط الإيطالي فينتشنزو كورونيللي، وصولاً إلى كرات صغيرة قابلة للطي يمكن حملها في الجيب.\n\nلكن هذه المجموعة من الكرات لا تحكي تاريخ الجغرافيا فحسب، بل تكشف أيضاً الطريقة التي تخيل بها البشر كوكب الأرض والسماء من حولهم عبر القرون.\n\nيقول مدير المتحف، نيكولاوس شوبيسبرغر: \"تُظهر الكرات الأرضية كيف تغير تصورنا لكوكبنا، وهذا هو المكان الوحيد في العالم الذي يمكنك فيه رؤية هذا العدد الكبير منها معاً\".\n\nيبدأ الزائر جولته في ما يعرف بـ\"الخزانة الذهبية\"، وهي قاعة فاخرة تزينها جداريات عمرها قرون تصور مشاهد من الأساطير اليونانية. وتضم القاعة أدوات فلكية وجغرافية، بينها مجسمات توضح دوران الأرض حول الشمس، وكرات سماوية تستخدم لتمثيل حركة الأجرام السماوية."}, {"guid": "https://www.dw.com/ar/أبراج-فوق-الركام-من-يسكن-ماريوبول-اليوم؟/a-78332724?maca=ara-rss-ar-all-1125-rdf", "title": "أبراج فوق الركام.. من يسكن ماريوبول اليوم؟", "summary": "على أنقاض مبان سكنية دمرتها الحرب، تشيد روسيا عشرات الأبراج السكنية الجديدة في مدينة ماريوبول المحتلة. فمن يسكن هذه الأبراج اليوم؟ وأين انتهى المطاف بالسكان الذين عاشوا هنا سابقا؟", "link": "https://www.dw.com/ar/أبراج-فوق-الركام-من-يسكن-ماريوبول-اليوم؟/a-78332724?maca=ara-rss-ar-all-1125-rdf", "image": "", "category": "أخبار", "source_id": "dw-arabic", "source_name": "DW عربي", "source_cat": "دولية", "published": 1788586320, "detail": ""}, {"guid": "https://www.dw.com/ar/يوم-الصداع-النصفي-خطوات-بسيطة-لتخفيف-الألم/a-78983350?maca=ara-rss-ar-all-1125-rdf", "title": "يوم الصداع النصفي: خطوات بسيطة لتخفيف الألم", "summary": "من الكمادات الباردة إلى تمارين الاسترخاء، اكتشف أهم وسائل الرعاية الذاتية التي قد تسهم في الحد من أعراض الصداع النصفي خلال النوبات.", "link": "https://www.dw.com/ar/يوم-الصداع-النصفي-خطوات-بسيطة-لتخفيف-الألم/a-78983350?maca=ara-rss-ar-all-1125-rdf", "image": "", "category": "أخبار", "source_id": "dw-arabic", "source_name": "DW عربي", "source_cat": "دولية", "published": 1788586200, "detail": ""}, {"guid": "CBMiRkFVX3lxTE5TN0YxUWlHQ055VW5JZ3UwZlMxMHRZUHJHNVcwa0FKVkx6cGdyV2ZoU21ncUtrbmJpU0FsOHJFNTZDQUNxLUE", "title": "عام / أكثر من 130 حديقة ومتنزهًا تستقبل مرتاديها بالحدود الشمالية مع اعتدال الأجواء - وكالة الأنباء السعودية", "summary": "عام / أكثر من 130 حديقة ومتنزهًا تستقبل مرتاديها بالحدود الشمالية مع اعتدال الأجواء &nbsp;&nbsp; وكالة الأنباء السعودية", "link": "https://news.google.com/rss/articles/CBMiRkFVX3lxTE5TN0YxUWlHQ055VW5JZ3UwZlMxMHRZUHJHNVcwa0FKVkx6cGdyV2ZoU21ncUtrbmJpU0FsOHJFNTZDQUNxLUE?oc=5", "image": "", "category": "أخبار", "source_id": "spa", "source_name": "واس (السعودية)", "source_cat": "وكالة رسمية", "published": 1788568571, "detail": ""}, {"guid": "https://www.dw.com/ar/أردوغان-يصعّد-ضد-اليونان-جزر-إيجة-تشعل-التوتر/a-79029679?maca=ara-rss-ar-all-1125-rdf", "title": "أردوغان يصعّد ضد اليونان.. جزر إيجة تشعل التوتر", "summary": "صعّد الرئيس التركي رجب طيب أردوغان لهجته تجاه اليونان، محذراً من عسكرة جزر بحر إيجة، ومؤكداً أن صبر أنقرة لا يعني ضعفها، بالتزامن مع تعزيز أثينا قدراتها الدفاعية وشراكاتها العسكرية وسط توتر إقليمي متزايد.", "link": "https://www.dw.com/ar/أردوغان-يصعّد-ضد-اليونان-جزر-إيجة-تشعل-التوتر/a-79029679?maca=ara-rss-ar-all-1125-rdf", "image": "", "category": "أمن", "source_id": "dw-arabic", "source_name": "DW عربي", "source_cat": "دولية", "published": 1788551520, "detail": ""}, {"guid": "https://www.bbc.com/arabic/articles/cj3dxpgv1lyo#7", "title": "كيف يمكن إنهاء الصراع الأمريكي الإيراني؟ ثلاثة خبراء يعرضون وجهات نظرهم", "summary": "بعد تجدد الضربات هذا الأسبوع، هل لدى أي من الطرفين استراتيجية للخروج؟", "link": "https://www.bbc.com/arabic/articles/cj3dxpgv1lyo?at_medium=RSS&at_campaign=rss", "image": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/9a51/live/5d415e40-a7aa-11f1-b78b-6b70b0a83270.jpg", "category": "أمن", "source_id": "bbc-arabic", "source_name": "بي بي سي عربي", "source_cat": "دولية", "published": 1788547609, "detail": "BBC News, عربيإذهب الى المحتوىرئيسيةشاهداستمعأقسامرئيسيةأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتكيف يمكن إنهاء الصراع الأمريكي الإيراني؟ ثلاثة خبراء يعرضون وجهات نظرهمصدر الصورة، Anadolu via Getty Images\n\nيبدو احتمال التوصل إلى اتفاق وشيك لإنهاء الصراع مرة أخرى بين الولايات المتحدة وإيران، غير مرجح في الوقت الحالي، حيث يتبادل الطرفان المتحاربان الضربات ولغة خطاب متشددة.\n\nوتأتي هذه الهجمات بعد أيام من إعلان الولايات المتحدة أنها تنتقل إلى مرحلة جديدة في الصراع، متمثلة في حصار اقتصادي شامل ضد إيران والدول التي تتعامل معها تجارياً.\n\nكان هدف الولايات المتحدة إجبار إيران على التفاوض ووقف هجماتها على الملاحة في مضيق هرمز. وقد أُغلق هذا الممر التجاري الملاحي الرئيسي فعلياً منذ بدء الصراع بين الولايات المتحدة وإسرائيل في فبراير/شباط.\n\nوانتهت صلاحية مذكرة التفاهم التي وقعها الطرفان في يونيو/حزيران الماضي، التي كان من المفترض أن تؤدي إلى وقف دائم لإطلاق النار واتفاق لإنهاء الصراع في غضون 60 يوماً، وهو ما لم يحدث حتى الآن.\n\nمع دخول الصراع شهره السابع، طلبنا من ثلاثة خبراء آراءهم حول احتمالات تطوره.\n\n4 سبتمبر/ أيلول 2026ترامب يقول إن الحملة على إيران \"لن تستمر طويلاً\"، وإيران تصف الضربة التي طالت حفل زفاف بـ\"جريمة حرب\"3 سبتمبر/ أيلول 2026هل استنزفت حرب إيران مخزون واشنطن من الصواريخ؟1 سبتمبر/ أيلول 2026content نهاية\n\nيرى جيسون كامبل، وهو باحث أول في معهد الشرق الأوسط في واشنطن العاصمة، أن المشكلة تكمن في أننا ما زلنا نجهل بشكل قاطع ما هي الأهداف الاستراتيجية الأمريكية للحرب في إيران. ودائماً ما يقدم البيت الأبيض إعادة تقييم لما هو مستعد للقبول به من وجهة نظر سياسية، ويقول:\n\nكان من المفترض أن يكون العنصر العسكري كافياً لتحقيق نصر سريع على إيران، لكن القوة العسكرية لم تحقق التأثير المطلوب.\n\nما نشهده حالياً هي محاولة أمريكية لاستخدام أدوات مختلفة، عسكرية واقتصادية على حد سواء."}, {"guid": "https://www.dw.com/ar/جزّ-العشب-واشنطن-على-شفا-دوامة-استنزاف-في-إيران/a-78880508?maca=ara-rss-ar-all-1125-rdf", "title": "\"جزّ العشب\".. واشنطن على شفا دوامة استنزاف في إيران", "summary": "هاجمت الولايات المتحدة من جديد أهدافًا عسكرية في إيران، لمنع طهران من إعادة بناء قدراتها المدمرة. لكن هذا يهدد باستمرار دوامة استنزاف بلا انتهاء من إعادة الإعمار والهجمات الجديدة.", "link": "https://www.dw.com/ar/جزّ-العشب-واشنطن-على-شفا-دوامة-استنزاف-في-إيران/a-78880508?maca=ara-rss-ar-all-1125-rdf", "image": "", "category": "أخبار", "source_id": "dw-arabic", "source_name": "DW عربي", "source_cat": "دولية", "published": 1788543540, "detail": ""}, {"guid": "CBMirwJBVV95cUxNeV9WVVFwaWhpSkJXbWx1QWVLVVVWWXRDXzFDUzhSaFFzdVA5blJZSVJQZFBnOGZQRF9IMEgzRDZMaktKZlNGQkdrd3Y5RVdkOFdBcFNqS1pfZjhOOVlDZnBicUw2SlBUdWJRUXRNOEd2Szk4TDgweTJsMkhiUEVzY1ZfX2tGb1hzajB0TXl0dndaZ3FRbkxQUjJUeXQtckZHUDAxNnZfbkJVTzRURWxrSThyaFc0NmFrdzZWRTZMSEt4YzJhbk5leWFkaVg3c0lHVDlQNUN4Y3VkVW5LbWhIM1pTLWNRTHU1blg4TXBiMjFXLXg1UTRPdGtkazdNY3lDc1hZNmJZM0x5QUFSVVRnM2haYlhnV2gySUdRcndzZEhGalQzU1dxWTNlQ2gxNG8", "title": "بالفيديو: مجزرة أسماك في السمرلاند! - المركزية", "summary": "بالفيديو: مجزرة أسماك في السمرلاند! &nbsp;&nbsp; المركزية", "link": "https://news.google.com/rss/articles/CBMirwJBVV95cUxNeV9WVVFwaWhpSkJXbWx1QWVLVVVWWXRDXzFDUzhSaFFzdVA5blJZSVJQZFBnOGZQRF9IMEgzRDZMaktKZlNGQkdrd3Y5RVdkOFdBcFNqS1pfZjhOOVlDZnBicUw2SlBUdWJRUXRNOEd2Szk4TDgweTJsMkhiUEVzY1ZfX2tGb1hzajB0TXl0dndaZ3FRbkxQUjJUeXQtckZHUDAxNnZfbkJVTzRURWxrSThyaFc0NmFrdzZWRTZMSEt4YzJhbk5leWFkaVg3c0lHVDlQNUN4Y3VkVW5LbWhIM1pTLWNRTHU1blg4TXBiMjFXLXg1UTRPdGtkazdNY3lDc1hZNmJZM0x5QUFSVVRnM2haYlhnV2gySUdRcndzZEhGalQzU1dxWTNlQ2gxNG8?oc=5", "image": "", "category": "أخبار", "source_id": "nna", "source_name": "الوطنية اللبنانية (لبنان)", "source_cat": "وكالة رسمية", "published": 1788543197, "detail": ""}, {"guid": "https://www.bbc.com/arabic/articles/ce30vq0zedko#5", "title": "فرح يوسف في بلا قيود: الإعلان الدستوري يمنح صلاحيات شبه إلهية للرئيس الانتقالي", "summary": "قالت فرح يوسف الباحثة والناشطة السياسية السورية إنّ الاهتمام الدولي الذي تحظى به الحكومة الانتقالية في سوريا يتعلق بترتيبات تخص إسرائيل ولا علاقة لها بحق الشعب السوري في الحكم", "link": "https://www.bbc.com/arabic/articles/ce30vq0zedko?at_medium=RSS&at_campaign=rss", "image": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/7e64/live/0550bc90-a885-11f1-b109-879e35c24276.png", "category": "سياسة", "source_id": "bbc-arabic", "source_name": "بي بي سي عربي", "source_cat": "دولية", "published": 1788542900, "detail": "BBC News, عربيإذهب الى المحتوىرئيسيةالصفحة الحالية, شاهداستمعأقسامرئيسيةأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتالبث المباشرفيديوبرامجنافرح يوسف في بلا قيود: الإعلان الدستوري يمنح صلاحيات شبه إلهية للرئيس الانتقاليجهازك لا يدعم تشغيل الفيديوالتعليق على الفيديو، فرح يوسف: رفاه الشعب السوري وحقه في الحكم ليس على طاولة المجتمع الدوليفرح يوسف في بلا قيود: الإعلان الدستوري يمنح صلاحيات شبه إلهية للرئيس الانتقاليPublished 4 سبتمبر/ أيلول 2026قالت فرح يوسف الباحثة والناشطة السياسية السورية إنّ السلطة الانتقالية الحالية في سوريا لديها مشاكل بنيوية منها، الإعلان الدستوري الذي يمنح رئيسها صلاحيات شبه إلهية ، هذا إلى جانب تشكيل مجلس انتقالي جرى بالتعيين وليس بالانتخاب.\n\nوترى فرح يوسف أنّ وجود معارضة في الداخل السوري يتطلب إنشاء مؤسسات تقوم بذلك الدور وهو ما لم يتوفّر بعد، مشيرة إلى عدم سنْ قانون جديد للأحزاب في سوريا حتى الآن أو إتاحة حرية تشكيل مثل هذه الأحزاب.\n\nوفيما يتعلق بالدعم الدولي الذي تحظى به الحكومة الانتقالية الحالية في سوريا، أعربت الباحثة والناشطة السياسة السورية عن أسفها بشأن توجهات المجتمع الدولي الذي يصُب جُلَّ اهتمامه على إعادة اللاجئين السوريين في الخارج إلى بلدهم بغض النظر عن التداعيات الي قد تترتب على ذلك. كما ألمحت فرح يوسف إلى وجود ترتيبات معينة تتعلق بإسرائيل تدفع المجتمع الدولي وخاصة الولايات المتحدة الأمريكية إلى دعم السلطة الحالية حسب قولها.\n\nوعن وضع المرأة في سوريا، ترى فرح يوسف أنّ حرية المرأة وحقوقها ومشاركتها السياسية ترتبط بمنظومة الحكم الحالية ولا يمكن فصلها عن حقوق المواطن السوري المنقوصة حسب رأيها.\n\nفما تقييم فرح يوسف الباحثة والناشطة السياسية السورية لما تراه بعض المنظمات الدولية تحسنا في مؤشرات بيئة الإعلام في سوريا اليوم؟ ومالذي يحول دون عودتها لسوريا؟ وكيف تنظر لمستقبل بلادها؟ هذه التساؤلات وغيرها تجدون الأجوبة عليها في برنامج بلا قيود لهذا الأسبوع. تبث الحلقة يوم السبت في الساعة الخامسة والنصف مساء بتوقيت غرينتش .يمكنكم مشاهدة حلقات البرنامج على الرابط التالي"}, {"guid": "https://www.dw.com/ar/اعتقال-الصحفي-التونسي-البارز-محمد-اليوسفي/a-79040229?maca=ara-rss-ar-all-1125-rdf", "title": "اعتقال الصحفي التونسي البارز محمد اليوسفي", "summary": "في مؤشر جديد على تراجع حرية الصحافة والتضييق على الحريات بشكل عام في تونس، اعتقلت السلطات الصحفي محمد اليوسفي وهو من أشرس منتقدي الرئيس قيس سعيد.", "link": "https://www.dw.com/ar/اعتقال-الصحفي-التونسي-البارز-محمد-اليوسفي/a-79040229?maca=ara-rss-ar-all-1125-rdf", "image": "", "category": "أخبار", "source_id": "dw-arabic", "source_name": "DW عربي", "source_cat": "دولية", "published": 1788541740, "detail": ""}, {"guid": "CBMiRkFVX3lxTE5MeTVjclYwbFpvRS1DOUk1UGJzWkoyQmJvbEE3SlNYdEVGMWxMY3pxVlU1RHA3cU9YNDhjakVHbFhWanBTeGc", "title": "ثقافي / معرض \"كنوز غارقة\".. رحلة استكشاف للبحر الأحمر وإرثه المغمور - وكالة الأنباء السعودية", "summary": "ثقافي / معرض \"كنوز غارقة\".. رحلة استكشاف للبحر الأحمر وإرثه المغمور &nbsp;&nbsp; وكالة الأنباء السعودية", "link": "https://news.google.com/rss/articles/CBMiRkFVX3lxTE5MeTVjclYwbFpvRS1DOUk1UGJzWkoyQmJvbEE3SlNYdEVGMWxMY3pxVlU1RHA3cU9YNDhjakVHbFhWanBTeGc?oc=5", "image": "", "category": "أخبار", "source_id": "spa", "source_name": "واس (السعودية)", "source_cat": "وكالة رسمية", "published": 1788530888, "detail": ""}, {"guid": "https://www.dw.com/ar/عيون-الصحافة-ـ-ألمانيا-على-عتبة-أكبر-زلزال-سياسي-منذ-الحرب/a-78896465?maca=ara-rss-ar-all-1125-rdf", "title": "عيون الصحافة ـ ألمانيا على عتبة أكبر زلزال سياسي منذ الحرب", "summary": "تترقب ألمانيا انتخابات برلمان ولاية ساكسونيا-أنهالت بتوجس، في ظل احتمال أن يفرز هذا الاقتراع للمرة الأولى منذ الحرب العالمية الثانية، حكومة و let articles = [];
let activeCat = 'الكل';
let activeSrc = '';

const rel = ts => {
  if (!ts) return '';
  const s = Math.max(0, Math.floor(Date.now()/1000 - ts));
  if (s < 60) return 'الآن';
  const m = Math.floor(s/60);
  if (m < 60) return 'منذ ' + m + ' دقيقة';
  const h = Math.floor(m/60);
  if (h < 24) return 'منذ ' + h + ' ساعة';
  const d = Math.floor(h/24);
  return 'منذ ' + d + ' يوم';
};

const esc = s => (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let activeCat = '';
let activeSrc = '';

const render = () => {
  const q = document.getElementById('q').value.trim();
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  let out = articles.filter(a => {
    if (activeCat && a.category !== activeCat && a.source_cat !== activeCat) return false;
    if (activeSrc && a.source_id !== activeSrc) return false;
    if (q && !(a.title + ' ' + (a.summary||'')).includes(q)) return false;
    return true;
  });
  empty.style.display = out.length ? 'none' : 'block';
  list.innerHTML = out.map(a => `
    <article class="card" data-link="${esc(a.link)}">
      <div class="thumb" style="background-image:url('${a.image ? esc(a.image) : 'linear-gradient(135deg,#1e3a5f,#0f172a)'}')">
        <span class="cat">${esc(a.category)}</span>
      </div>
      <div class="body">
        <h2>${esc(a.source_name)} | ${esc(a.title)}</h2>
        <div class="sum">${esc(a.body || a.summary)}</div>
        <div class="meta">
          <span class="src">${esc(a.source_cat)} — ${esc(a.source_name)}</span>
          <span class="time">${rel(a.published)}</span>
        </div>
      </div>
    </article>`).join('');
};

const buildFilters = data => {
  // Build unique categories from articles
  const categories = [...new Set(data.articles.map(a => a.category).filter(Boolean))].sort();
  const catSel = document.getElementById('cat');
  catSel.innerHTML = '<option value="">كل الأقسام</option>';
  categories.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c;
    catSel.appendChild(o);
  });
  catSel.onchange = e => { activeCat = e.target.value; render(); };

  // Build sources dropdown
  const srcSel = document.getElementById('src');
  srcSel.innerHTML = '<option value="">كل المصادر</option>';
  // Unique sources from articles
  const sources = [...new Map(data.articles.map(a => [a.source_id, {id: a.source_id, name: a.source_name, cat: a.source_cat}])).values()];
  sources.forEach(s => {
    const o = document.createElement('option');
    o.value = s.id; o.textContent = s.name + (s.cat ? ' (' + s.cat + ')' : '');
    srcSel.appendChild(o);
  });
  srcSel.onchange = e => { activeSrc = e.target.value; render(); };
};

const fmtUpd = ts => {
  const d = new Date(ts * 1000);
  return d.toLocaleString('ar-EG', {dateStyle:'medium', timeStyle:'short'});
};

const load = (data, isCloud) => {
  articles = data.articles;

  buildFilters(data);
  render();
};

      if (s && s.length > 10) return Promise.resolve(JSON.parse(s));
    } catch (e) {}
  }
  const q = 'select=guid,title,summary,link,image,category,source_id,source_name,source_cat,published,detail&order=published.desc&limit=300';
  return fetch(CLOUD.url + '/rest/v1/news?' + q, {
    headers: { apikey: CLOUD.key, Authorization: 'Bearer ' + CLOUD.key, 'Content-Type': 'application/json' }
  }).then(r => r.json());
};

const applyRows = rows => {
  if (!Array.isArray(rows) || !rows.length) return false;
  const srcs = {};
  rows.forEach(a => { srcs[a.source_id] = { id: a.source_id, name: a.source_name || a.source_id, name_en: '', category: a.source_cat || '' }; });
  load({ articles: rows, sources: Object.values(srcs), generated: Math.floor(Date.now() / 1000) }, true);
  return true;
};

const loadCloud = () => cloudRows().then(applyRows).catch(() => false);

const toastEl = document.getElementById('toast');
let toastTimer;
const showToast = msg => {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
};

const cloudOnly = async () => {
  const got = await cloudRows().then(applyRows).catch(() => false);
  showToast(got ? '✓ البيانات محدثة من السحابة' : 'تعذر الاتصال بالسحابة');
};

const refreshFromCloud = () => {
  const btn = document.getElementById('reloadBtn');
  const prev = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'جارٍ التحديث...';
  const restore = () => { btn.disabled = false; btn.textContent = prev; };
  return cloudOnly().then(restore, restore);
};

document.getElementById('reloadBtn').onclick = refreshFromCloud;

loadCloud().then(cloudOk => {
  if (cloudOk) return;
  if (typeof INLINE_NEWS !== 'undefined' && INLINE_NEWS) {
    load(INLINE_NEWS);
  } else {
    fetch(DATA_URL).then(r => r.json()).then(load).catch(() => {
      document.getElementById('list').innerHTML = '<div class="placeholder">تعذر تحميل الأخبار. شغّل المحرك أولاً ثم أعد فتح الصفحة.</div>';
    });
  }
});

document.getElementById('q').addEventListener('input', render);
document.getElementById('src').addEventListener('change', e => { activeSrc = e.target.value; render(); });

const openArticle = link => {
  const a = articles.find(x => x.link === link);
  if (!a) return;
  document.getElementById('mImg').src = a.image || 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  document.getElementById('mImg').style.opacity = a.image ? '1' : '0';
  document.getElementById('mCat').textContent = a.category;
  document.getElementById('mTitle').textContent = a.source_name + ' | ' + a.title;
  document.getElementById('mSrc').textContent = (a.source_cat || '') + ' — ' + a.source_name + '  •  ' + rel(a.published);
  const sumEl = document.getElementById('mSum');
  const noteEl = document.getElementById('mNote');
  if (a.detail) {
    sumEl.textContent = a.detail;
    noteEl.textContent = 'النص الكامل منقول كما نشره المصدر (للخبر كاملاً بالتنسيقات الأصلية راجع موقع المصدر).';
  } else {
    sumEl.textContent = a.summary || 'لا يوجد ملخص مختصر لهذا الخبر.';
    noteEl.textContent = 'تعذّر جلب النص الكامل لهذا المصدر — المعروض خلاصة رسمية من خلاصة المصدر.';
  }
  const mo = document.getElementById('mOpen');
  mo.href = a.link;
  mo.target = '_blank';
  document.getElementById('modal').classList.add('open');
};

const closeArticle = () => document.getElementById('modal').classList.remove('open');

document.getElementById('list').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (card) openArticle(card.dataset.link);
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeArticle(); });

const RELOAD_SECONDS = 300;
let remain = RELOAD_SECONDS;
const timerEl = document.getElementById('timer');
setInterval(() => {
  remain -= 1;
  if (remain <= 0) {
    refreshFromCloud();
    remain = RELOAD_SECONDS;
    return;
  }
  const m = Math.floor(remain / 60), s = remain % 60;
  timerEl.textContent = 'تحديث تلقائي خلال ' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}, 1000);
timerEl.textContent = 'تحديث تلقائي خلال 05:00';

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
