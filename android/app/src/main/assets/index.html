ource_name": "RT عربي", "source_cat": "دولية", "published": 1788614029, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nوصلت بعثة نادي النصر إلى مدينة جدة وسط استقبال جماهيري غفير للأسطورة كريستيانو رونالدو، وذلك استعدادا لمواجهة الاتحاد مساء اليوم السبت ضمن الجولة الخامسة من دوري روشن للمحترفين.\n\nوعلى هامش هذا التواجد الحماسي، شهد وصول قائد النصر حادثة غريبة أثارت تفاعلا واسعا، إذ ألقى مشجع هاتفا محمولا باتجاه \"الدون\" لفتا لانتباهه أو طمعا في التقاط صورة، إلا أن النجم البرتغالي لم يتنبه للهاتف ودهسه بقدمه دون قصد لحظة سقوطه أمامه.\n\n🚨🚨🚨🚨🚨🚨🚨🚨🚨شاهد الحب و الولاء من رونالدو اثناء استقبال جماهير #النصر في جدة https://t.co/chgvZ0MCEj pic.twitter.com/74SgoF1Fk5\n\nولم يثن هذا الموقف الغريب رونالدو عن مواصلة طريقه بثبات نحو حافلة الفريق، في حين تحول المقطع المصور للواقعة إلى \"تريند\" متداول بشكل واسع عبر منصات التواصل الاجتماعي.\n\nيخرب بيت الجنون مين الي ذب جواله على رونالدو !يعني بياخذ الجوال ويصور ويرجعه لك 💀 pic.twitter.com/FgrSdWj1Kh\n\nويحتل النصر، حامل اللقب، وصافة ترتيب الدوري السعودي برصيد 12 نقطة، بفارق ثلاث نقاط خلف الهلال المتصدر، بينما يأتي الاتحاد في المركز الثامن برصيد ثماني نقاط."}, {"guid": "https://arabic.rt.com/world/1829082-%D8%B2%D9%84%D8%B2%D8%A7%D9%84-%D8%A8%D9%82%D9%88%D8%A9-60-%D8%AF%D8%B1%D8%AC%D8%A9-%D9%8A%D8%B6%D8%B1%D8%A8-%D8%AC%D8%B2%D8%B1-%D8%B3%D9%84%D9%8A%D9%85%D8%A7%D9%86-%D8%AC%D9%86%D9%88%D8%A8-%D8%A7%D9%84%D9%85%D8%AD%D9%8A%D8%B7-%D8%A7%D9%84%D9%87%D8%A7%D8%AF%D9%89%D8%A1/", "title": "زلزال بقوة 6.0 درجة يضرب جزر سليمان جنوب المحيط الهادىء", "summary": "رصد المركز الأوروبي المتوسطي لرصد الزلازل، اليوم السبت، زلزالا بقوة 6.0 درجات قبالة سواحل جزر سليمان.", "link": "https://arabic.rt.com/world/1829082-%D8%B2%D9%84%D8%B2%D8%A7%D9%84-%D8%A8%D9%82%D9%88%D8%A9-60-%D8%AF%D8%B1%D8%AC%D8%A9-%D9%8A%D8%B6%D8%B1%D8%A8-%D8%AC%D8%B2%D8%B1-%D8%B3%D9%84%D9%8A%D9%85%D8%A7%D9%86-%D8%AC%D9%86%D9%88%D8%A8-%D8%A7%D9%84%D9%85%D8%AD%D9%8A%D8%B7-%D8%A7%D9%84%D9%87%D8%A7%D8%AF%D9%89%D8%A1/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c2f3842360446d64a99c8.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788613872, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nرصد المركز الأوروبي المتوسطي لرصد الزلازل، اليوم السبت، زلزالا بقوة 6.0 درجات قبالة سواحل جزر سليمان.\n\nووفقا للمركز، كان مركز الزلزال على بعد 148 كيلومترا شرق مدينة كوكوبو، التي يقطنها نحو 26 ألف نسمة، وعلى عمق 105 كيلومترات.\n\nأفادت وكالة \"رويترز\" نقلا عن مصادر بأن السلطات النيبالية تخطط لإنشاء نظام إنذار مبكر محسّن على الحدود مع الصين في أعقاب الفيضانات المدمرة التي أودت بحياة أكثر من 1200 شخص.\n\nضرب زلزال بلغت قوته 6 درجات على مقياس ريختر، فجر اليوم الجمعة، منطقة شرقي خليج عدن قبالة السواحل اليمنية.\n\nشارك نحو 1800 شخص في تحريك برج قصر هيروساكي القديم الذي يزن 360 طنا بطريقة \"هيكيا\" اليابانية التقليدية لإعادته إلى موقعه التاريخي بعد الزلزال."}, {"guid": "https://arabic.rt.com/middle_east/1829074-%D8%A8%D8%B9%D8%AF-%D8%A7%D8%B3%D8%AA%D9%8A%D8%A7%D8%A1-%D9%88%D8%A7%D8%B3%D8%B9-%D8%A7%D9%84%D8%B3%D9%8A%D8%B3%D9%8A-%D8%A8%D9%85%D8%B4%D8%B1%D9%88%D8%B9-%D9%83%D8%A8%D9%8A%D8%B1-%D9%8A%D9%84%D8%A8%D9%8A-%D9%85%D8%B7%D8%A7%D9%84%D8%A8-%D8%B4%D8%B9%D8%A8%D9%8A%D8%A9/", "title": "بعد استياء واسع.. السيسي يوجه بمشروع كبير يلبي مطالب شعبية", "summary": "وجه الرئيس المصري عبد الفتاح السيسي، الحكومة بضرورة \"تبني مشروع لـ تخضير القاهرة\" يستهدف تحويل أية مساحة يتم إخلاؤها إلى مسطحات خضراء.", "link": "https://arabic.rt.com/middle_east/1829074-%D8%A8%D8%B9%D8%AF-%D8%A7%D8%B3%D8%AA%D9%8A%D8%A7%D8%A1-%D9%88%D8%A7%D8%B3%D8%B9-%D8%A7%D9%84%D8%B3%D9%8A%D8%B3%D9%8A-%D8%A8%D9%85%D8%B4%D8%B1%D9%88%D8%B9-%D9%83%D8%A8%D9%8A%D8%B1-%D9%8A%D9%84%D8%A8%D9%8A-%D9%85%D8%B7%D8%A7%D9%84%D8%A8-%D8%B4%D8%B9%D8%A8%D9%8A%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c2b9e423604460a18a581.png", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788613790, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nوجه الرئيس المصري عبد الفتاح السيسي، الحكومة بضرورة \"تبني مشروع لـ تخضير القاهرة\" يستهدف تحويل أية مساحة يتم إخلاؤها إلى مسطحات خضراء.\n\nوتأتي توجيهات السيسي بعد استياء واسع ومتزايد في الفترة الأخيرة بشأن قطع الأشجار على نطاق واسع للغاية في مختلف المناطق، سواء لتنفيذ مشروعات أو لأغراض أخرى، وآخرها شارع جامعة الدول العربية؛ ما أثار موجة غضب واسعة واعتذار من وزارة التنمية المحلية التي وعدت بتعويضها.\n\nمصر.. انتقادات برلمانية لحملات إزالة الأشجار واستدعاء لوزيرة البيئة وجاء توجيهات السيسي، خلال اجتماع مع وزير الأوقاف، الدكتور أسامة الأزهري والدكتور إبراهيم صابر محافظ القاهرة، واللواء أمير سيد أحمد مُستشار رئيس الجمهورية للتخطيط العمراني، واللواء أركان حرب وليد عارف رئيس الهيئة الهندسية للقوات المسلحة.\n\nوتابع السيسي، بحسب بيان لرئاسة الجمهورية \"جهود إعادة إحياء معالم القاهرة الإسلامية والتاريخية، حيث اِستعرض وزير الأوقاف الموقف التنفيذي لإعادة إحياء وترميم العديد من المساجد والأضرحة التاريخية، مُشيرا إلى أن ما يتم تنفيذه من جهود تمتد لتشهد فتح المزيد من المسارات السياحية المتكاملة للربط بين العديد من المواقع والمعالم التاريخية والتراثية\".\n\nولفت وزير الأوقاف إلى أنه بالانتهاء من مختلف ما يتم تنفيذه من أعمال تتعلق بإعادة إحياء المعالم التاريخية، سيصبح \"قلب القاهرة\" مزارا مفتوحا يستقطب المزيد من الحركة السياحية.\n\nمن جهته، أشار محافظ القاهرة إلى جهود إعادة إحياء العديد من معالم القاهرة الخديوية والتاريخية والإسلامية، وتأهيل وتطوير البنية التحتية المتواجدة بالمناطق التاريخية والمناطق المحيطة بها.\n\nقد تكون الأشجار البالغة في شوارع المدن مسألة حياة أو موت، واتبع علماء من جامعة شمال الغرب الأمريكية على مدى 11 عاما الغطاء الشجري في مدينة شيكاغو.\n\nعاد ملف إزالة الأشجار إلى الواجهة مجددا في مصر، بعد تحركات برلمانية لمراجعة ما تشهده بعض مناطق القاهرة والجيزة من أعمال قطع للأشجار، وذلك بعد ضجة واسعة بشأن انتشار الظاهرة.\n\nوجه النائب المصري، إيهاب منصور، تساؤولات للحكومة وعدد من الوزراء بشأن \"ظاهرة قطع الأشجار وتقليل المساحات الخضراء\" قائلا ما سبب العداوة للون الأخضر!"}, {"guid": "https://arabic.rt.com/society/1829076-%D8%A7%D9%84%D8%B3%D8%B9%D9%88%D8%AF%D9%8A%D8%A9-%D8%A7%D9%84%D8%AF%D8%A7%D8%AE%D9%84%D9%8A%D8%A9-%D8%AA%D8%B9%D9%84%D9%86-%D8%A5%D8%B9%D8%AF%D8%A7%D9%85-%D9%85%D9%88%D8%A7%D8%B7%D9%86-%D9%82%D8%AA%D9%84-%D8%B2%D9%88%D8%AC%D8%AA%D9%87-%D9%88%D8%A7%D8%  الشمري وابنته، غلا، سعوديتي الجنسية، وذلك بالدخول لغرفتي نومهما وقتلهما بأداة حادة\"، بحسبما أوردت وكالة \"واس\".\n\nوأضافت: \"تمكنت الجهات الأمنية من القبض على الجاني المذكور، وأسفر التحقيق معه عن توجيه الاتهام إليه بارتكاب الجريمة، وبإحالته إلى المحكمة المختصة، حيث صدر بحقه حكم يقضي بثبوت ما نُسب إليه، ولكون ما قام به المذكور كان على وجه يأمنان معه المجني عليهما من غائلته مع سابق إصرار وترصد، فقد تم الحكم عليه بالقتل (حدا) للغيلة، وأصبح الحكم نهائيا بعد استئنافه ثم تأييده من المحكمة العليا، وصدر أمر ملكي بإنفاذ ما تقرر شرعا\".\n\nأعلنت وزارة الداخلية السعودية، السبت، تنفيذ حكم القتل تعزيرا بحق سعودي في منطقة جازان، قالت إنه أقدم على الاشتراك في ترويج الحشيش المخدر بالبيع للمرة الثانية.\n\nأعلنت وزارة الداخلية السعودية تنفيذ حكم الإعدام بحق مقيم مصري، بعد إدانته باقتحام منزل امرأة واغتصابها وقتلها عمدا في منطقة الحدود الشمالية، وذلك عقب استكمال جميع مراحل التقاضي."}, {"guid": "https://arabic.rt.com/world/1829070-%D9%84%D8%A7%D9%81%D8%B1%D9%88%D9%81-%D9%86%D8%A8%D8%B0%D9%84-%D9%82%D8%B5%D8%A7%D8%B1%D9%89-%D8%AC%D9%87%D8%AF%D9%86%D8%A7-%D9%84%D8%B6%D9%85%D8%A7%D9%86-%D8%A3%D9%85%D9%86-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D9%88%D8%A7%D8%B3%D8%AA%D8%B9%D8%A7%D8%AF%D8%A9-%D8%AD%D9%82%D9%88%D9%82-%D8%A7%D9%84%D9%86%D8%A7%D8%B3-%D9%81%D9%8A-%D8%AF%D9%88%D9%86%D8%A8%D8%A7%D8%B3-%D9%88%D9%86%D9%88%D9%81%D9%88%D8%B1%D9%88%D8%B3%D9%8A%D8%A7/", "title": "لافروف: نبذل قصارى جهدنا لضمان أمن روسيا واستعادة حقوق الناس في دونباس ونوفوروسيا", "summary": "صرح وزير الخارجية الروسي سيرغي لافروف، اليوم السبت، بأنه يتم بذل كل ما يلزم لضمان أمن روسيا واستعادة حقوق الشعب الروسي في دونباس ونوفوروسيا.", "link": "https://arabic.rt.com/world/1829070-%D9%84%D8%A7%D9%81%D8%B1%D9%88%D9%81-%D9%86%D8%A8%D8%B0%D9%84-%D9%82%D8%B5%D8%A7%D8%B1%D9%89-%D8%AC%D9%87%D8%AF%D9%86%D8%A7-%D9%84%D8%B6%D9%85%D8%A7%D9%86-%D8%A3%D9%85%D9%86-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D9%88%D8%A7%D8%B3%D8%AA%D8%B9%D8%A7%D8%AF%D8%A9-%D8%AD%D9%82%D9%88%D9%82-%D8%A7%D9%84%D9%86%D8%A7%D8%B3-%D9%81%D9%8A-%D8%AF%D9%88%D9%86%D8%A8%D8%A7%D8%B3-%D9%88%D9%86%D9%88%D9%81%D9%88%D8%B1%D9%88%D8%B3%D9%8A%D8%A7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c25fb4c59b725d0347cba.jpg", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788613349, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nصرح وزير الخارجية الروسي سيرغي لافروف، اليوم السبت، بأنه يتم بذل كل ما يلزم لضمان أمن روسيا واستعادة حقوق الشعب الروسي في دونباس ونوفوروسيا.\n\nوقال لافروف خلال اجتماع بين الرئيس وقادة قائمة حزب روسيا الموحدة لانتخابات مجلس الدوما: \"نبذل قصارى جهدنا لضمان الوفاء بالالتزامات الدستورية، وتأمين أمن روسيا، واستعادة حقوق الشعب الروسي في شبه جزيرة القرم ودونباس ونوفوروسيا\".\n\nبوتين يرد على أنباء حول تعبئة عسكرية جديدة في روسيا بعد انتخابات \"الدوما\" وأضاف: \"نسعى لاستعادة حقوق الشعب الروسي حتى في بقية الأراضي الخاضعة حاليا لسيطرة نظام كييف\".\n\nوأكد لافروف على أن نظام كييف \"انتهك الحقوق اللغوية والدينية للشعب الروسي بشكل صارخ\".\n\nوأفادت وزارة الدفاع الروسية في وقت سابق من اليوم السبت بأن مجموعة قوات \"الجنوبية\" حررت بلدة كورتوفكا في دونيتسك، فيما واصلت القوات الروسية استهداف بنى تحتية حساسة يستخدمها الجيش الأوكراني.\n\nأفادت وزارة الدفاع الروسية اليوم السبت بأن مجموعة قوات \"الجنوبية\" حررت بلدة كورتوفكا في دونيتسك، فيما واصلت القوات الروسية استهداف بنى تحتية حساسة يستخدمها الجيش الأوكراني.\n\nأكد المتحدث الرسمي باسم الكرملين دميتري بيسكوف أن محاولات التدخل في الشؤون الداخلية لروسيا من قبل دول مختلفة كانت وستظل موجودة.\n\nكشفت الاستخبارات الروسية عن تبني الاتحاد الأوروبي ودوائر غربية خطة لتعطيل الانتخابات الروسية وترويج مواد مفبركة تطعن بها، تزامنا مع تشديد نظام كييف إرهابه ضد المدنيين لزعزعة روسيا.\n\nقال سفير المهام الخاصة ونائب رئيس لجنة الخارجية الروسية المعنية بالانتخابات مكسيم رايدر إن دول البلطيق تحاول الضغط على المواطنين الروس لمنعهم من التصويت في انتخابات مجلس الدوما."}, {"guid": "https://arabic.rt.com/world/1829077-%D8%A7%D9%84%D8%B3%D9%81%D8%A7%D8%B1%D8%A9-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D8%A9-%D9%81%D9%8A-%D8%A7%D9%84%D9%85%D9%86%D8%A7%D9%85%D8%A9-%D8%AA%D8%B5%D8%AF%D8%B1-%D8%AA%D8%AD%D8%B0%D9%8A%D8%B1%D8%A7-%D9%84%D9%85%D9%88%D8%A7%D8%B7%D9%86%D9%8A%D9%87%D8%A7-%D9%85%D9%86-%D8%AA%D8%B5%D8%B9%D9%8A%D8%AF-%D9%85%D8%AD%D8%AA%D9%85%D9%84-%D9%81%D9%8A-%D8%A7%D9%84%D8%B4%D8%B1%D9%82-%D8%A7%D9%84%D8%A3%D9%88%D8%B3%D8%B7/", "title": "السفارة الأمريكية في المنامة تصدر تحذيرا لمواطنيها من تصعيد محتمل في الشرق الأوسط", "summary": "أصدرت السفارة الأمريكية لدى البحرين تحذيرا أمنيا للمواطنين الأمريكيين، أكدت فيه أن الوضع الأمني في الشرق الأوسط لا يزال معقدا مع احتمالية حدوث تصعيد غير متوقع.", "link": "https://arabic.rt.com/world/1829077-%D8%A7%D9%84%D8%B3%D9%81%D8%A7%D8%B1%D8%A9-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D8%A9-%D9%81%D9%8A-%D8%A7%D9%84%D9%85%D9%86%D8%A7%D9%85%D8%A9-%D8%AA%D8%B5%D8%AF%D8%B1-%D8%AA%D8%AD%D8%B0%D9%8A%D8%B1%D8%A7-%D9%84%D9%85%D9%88%D8%A7%D8%B7%D9%86%D9%8A%D9%87%D8%A7-%D9%85%D9%86-%D8%AA%D8%B5%D8%B9%D9%8A%D8%AF-%D9%85%D8%AD%D8%AA%D9%85%D9%84-%D9%81%D9%8A-%D8%A7%D9%84%D8%B4%D8%B1%D9%82-%D8%A7%D9%84%D8%A3%D9%88%D8%B3%D8%B7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c36f9423604449f711318.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788613126, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nأصدرت السفارة الأمريكية لدى البحرين تحذيرا أمنيا للمواطنين الأمريكيين، أكدت فيه أن الوضع الأمني في الشرق الأوسط لا يزال معقدا مع احتمالية حدوث تصعيد غير متوقع.\n\nوأشارت السفارة، في تنبيهها، إلى أن إيران استهدفت سابقا البنية التحتية المدنية في البحرين، بما في ذلك الفنادق في العاصمة المنامة، داعية المواطنين الأمريكيين الموجودين حاليا في الشرق الأوسط إلى توخي يقظة متزايدة.\n\nوشدد التحذير على ضرورة إدراك احتمال إلغاء الرحلات الجوية، وإغلاق المجال الجوي، واضطرابات السفر بشكل عام، في ضوء التطورات الأمنية الراهنة، مؤكدا أنه ينبغي على الأمريكيين المسافرين من وإلى المنطقة متابعة المعلومات المتعلقة بعمليات المطارات وشركات الطيران.\n\nولفتت السفارة إلى أن \"منشآت دبلوماسية أمريكية بما في ذلك خارج منطقة الشرق الأوسط استُهدفت.\n\nوحذرت من أنه قد تستهدف إيران والجماعات الداعمة لها مصالح أمريكية أخرى في الخارج أو مواقع مرتبطة بالولايات المتحدة والأمريكيين في جميع أنحاء العالم، بما في ذلك الشركات والمؤسسات الأمريكية الأخرى.\n\nوأشارت إلى أنه لا تزال السفارة الأمريكية مفتوحة أمام المواطنين الأمريكيين لتقديم الخدمات الروتينية وخدمات التأشيرات."}, {"guid": "https://www.dw.com/ar/ألمانيا-تحذيرات-من-هجمات-تصيد-إلكتروني-بعد-تسريب-بيانات-إدارة-برلين/a-79047182?maca=ara-rss-ar-all-1125-rdf", "title": "ألمانيا: تحذيرات من هجمات تصيد إلكتروني بعد تسريب بيانات إدارة برلين", "summary": "بعد انتهاء المهلة المحددة لحكومة برلين لدفع الفدية، نشرت مجموعة القرصنة \"ريسيدا\" مجموعة ضخمة من البيانات التي سرقتها منتصف الشهر الماضي على الإنترنت المظلم. والهيئة الألمانية لأمن المعلومات ت  العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nأكد رئيس الوزراء الإسرائيلي، بنيامين نتنياهو، أن محاولة استهداف نجله يائير كانت واقعة \"حقيقية وخطيرة\".\n\nوأشار إلى أن الأجهزة الأمنية الإسرائيلية تحركت بسرعة فائقة لتحييد الخطر، بل واستعانت بقوات إضافية من الولايات المتحدة لإجلائه من موقعه على وجه السرعة.\n\nوفي تصريح له، شدد نتنياهو على أن هذه الخطوة الأمنية الاستثنائية كانت أمراً \"واقعياً تماماً\" ومبرراً بالكامل، محملاً المسؤولية لعدد من الصحفيين وأطراف أخرى وصف تصرفاتهم بـ\"غير المسؤولة والمتهورة\".\n\nوأوضح أن هذه الأطراف قامت بكشف موقع يائير لحظة بلحظة، حيث نشرت العنوان الدقيق لمكان إقامته، وصورة للشقة، ورقم الطابق، وحتى رقم الشقة بدقة متناهية، مما وفر بيئة خصبة لأي تهديد أمني محتمل.\n\nوجاءت هذه التصريحات لتسلط الضوء على التوتر المتصاعد بين مكتب رئيس الوزراء الإسرائيلي ومنصات الإعلام والنشطاء، حيث يرى نتنياهو أن تجاوزات النشر الإعلامي قد تخطت حدود الحرية الصحفية لتصبح تهديداً مباشراً للأمن الشخصي لعائلته، مما استدعى تدخلاً أمنياً دولياً مشتركاً لضمان سلامة نجله.\n\nويأتي هذا التصريح في ظل جدل متكرر داخل إسرائيل حول مستوى الحماية الأمنية الممنوحة لعائلة رئيس الوزراء، لا سيما لنجله يائير نتنياهو، الذي يُعرف بنشاطه البارز والمثير للجدل على منصات التواصل الاجتماعي، وإقامته المتقطعة بين إسرائيل والخارج (خاصة في الولايات المتحدة وأوروبا).\n\nوعادة ما تخضع تحركات أفراد عائلة رئيس الوزراء الإسرائيلي لبروتوكولات أمنية مشددة من قبل جهاز \"الشاباك\" (جهاز الأمن العام الإسرائيلي)، إلا أن تكرار حالات تسريب المعلومات الشخصية أو مواقع الإقامة عبر وسائل الإعلام أو الشبكات الاجتماعية، أثار مخاوف أمنية عليا في تل أبيب.\n\nويعكس تأكيد نتنياهو على \"الاستعانة بالأجهزة الأمريكية\" في عملية الإجلاء حجم التنسيق الأمني الاستخباراتي بين واشنطن وتل أبيب لحماية شخصيات ذات حساسية سياسية عالية، في وقت تتصاعد فيه حدة الاستقطاب الداخلي والخارجي حول سياسات الحكومة الإسرائيلية.\n\nشكك مسؤول سابق رفيع في \"الشاباك\" الإسرائيلي في رواية الجهاز بشأن خطورة \"التهديد الإيراني\" الذي استهدف يائير نتنياهو وأدى إلى إجلائه من ميامي، متسائلا: \"هل كانت هناك خلية تترصده؟\"\n\nكشفت صحيفة \"معاريف\" العبرية أن عملية إجلاء يائير نتنياهو، نجل رئيس الوزراء الإسرائيلي بنيامين نتنياهو، من مدينة ميامي الأمريكية، تمت من خلال عناصر حماية الرئيس يتسحاق هرتصوغ.\n\nأكد جهاز الشاباك الإسرائيلي أن هناك \"تهديدا خطيرا\" يحدق بيائير نتنياهو، نجل رئيس الوزراء بنيامن نتنياهو، مما استدعى اتخاذ قرار بإجلائه وفريقه الأمني بشكل عاجل من الولايات المتحدة.\n\nكشف عامي درور الرئيس السابق لفريق الحراسة الخاصة برئيس وزراء إسرائيل بنيامين نتنياهو، تفاصيل حادثة اعتداء منسوبة لابنه يائير على والده، أدت إلى إبعاده قسريا إلى ميامي الأمريكية."}, {"guid": "https://arabic.rt.com/world/1829075-%D8%A7%D9%84%D9%82%D9%8A%D8%A7%D8%AF%D8%A9-%D8%A7%D9%84%D9%85%D8%B1%D9%83%D8%B2%D9%8A%D8%A9-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D8%A9-%D8%AA%D8%AF%D9%85%D9%8A%D8%B1-3-%D9%86%D8%A7%D9%82%D9%84%D8%A7%D8%AA-%D9%86%D9%81%D8%B7-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86%D9%8A%D8%A9-%D8%B1%D8%AF%D8%A7-%D8%B9%D9%84%D9%89-%D9%87%D8%AC%D9%85%D8%A7%D8%AA-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A/", "title": "القيادة المركزية الأمريكية: تدمير 3 ناقلات نفط إيرانية ردا على هجمات الحرس الثوري", "summary": "هاجمت قوات القيادة المركزية الأمريكية (سنتكوم) ثلاث ناقلات نفط خام إيرانية، ردا على قيام فيلق الحرس الثوري الإيراني بإطلاق صواريخ باليستية باتجاه مدمرتين تابعتين للبحرية الأمريكية.", "link": "https://arabic.rt.com/world/1829075-%D8%A7%D9%84%D9%82%D9%8A%D8%A7%D8%AF%D8%A9-%D8%A7%D9%84%D9%85%D8%B1%D9%83%D8%B2%D9%8A%D8%A9-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D8%A9-%D8%AA%D8%AF%D9%85%D9%8A%D8%B1-3-%D9%86%D8%A7%D9%82%D9%84%D8%A7%D8%AA-%D9%86%D9%81%D8%B7-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86%D9%8A%D8%A9-%D8%B1%D8%AF%D8%A7-%D8%B9%D9%84%D9%89-%D9%87%D8%AC%D9%85%D8%A7%D8%AA-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c29e9423604447a05e8a1.png", "category": "اقتصاد", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788612743, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nهاجمت قوات القيادة المركزية الأمريكية (سنتكوم) ثلاث ناقلات نفط خام إيرانية، ردا على قيام فيلق الحرس الثوري الإيراني بإطلاق صواريخ باليستية باتجاه مدمرتين تابعتين للبحرية الأمريكية.\n\nوبحسب \"سنتكوم\"، تمكنت حاملة طائرات أمريكية ومدمرة صاروخية موجهة من تفادي عدة هجمات إيرانية غير مبررة، ولم يصب أي من أفراد الطاقم الأمريكي بأذى. وبعد الهجمات الإيرانية الفاشلة، جرت مهاجمة وتعطيل ناقلات النفط الخام التابعة للحرس الثوري الإيراني، وهي \"إم/تي داوني\" قبالة سواحل جزيرة خرج، و\"إم/تي ستارك 1\" بالقرب من جاسك.\n\nكما دمرت القوات الأمريكية بالكامل ناقلة النفط الخام الفارغة \"إم/تي كايلو\" (المعروفة أيضا باسم \"نوكسين\") في خليج عمان.\n\nوأوضحت القيادة المركزية أن \"ناقلات النفط الإيرانية الثلاث هي جزء من شبكة ظل تقدر بمليارات الدولارات تمول الحرس الثوري الإيراني ووكلاءه الإقليميين، وأن إيران ليس لديها أي وسيلة للدفاع عنها\".\n\nوقال الأدميرال براد كوبر، قائد القيادة المركزية الأمريكية: \"لتكن الرسالة إلى الحرس الثوري الإيراني واضحة: إذا أطلقتم النار على اثنتين من سفننا، فسنفرض تكلفة اقتصادية أعلى – بتدمير ثلاث من سفنكم. لن نتردد في الدفاع عن القوات الأمريكية، وإذا لزم الأمر، تدمير الأسطول النفطي الإيراني المحدود والمعرض للخطر\".\n\nكشف مسؤولون أمريكيون مطلعون عن إخضاع نحو 50 من كبار ضباط وموظفي هيئة الأركان المشتركة في الجيش الأمريكي لاختبارات كشف الكذب (بوليغراف) خلال الشهر الماضي.\n\nباتت قوافل ضخمة من الشاحنات والصهاريج المحملة بالنفط تجوب الطرقات الصحراوية السورية، في مشهد يعكس تحولاً استراتيجياً في خريطة تدفق الطاقة بالمنطقة.\n\nبحث وزير الخارجية المصري بدر عبد العاطي مع نظيره العماني بدر بن حمد البوسعيدي مستجدات الأوضاع الإقليمية والجهود الرامية لاحتواء التوتر الراهن واستعادة الهدوء والاستقرار بالمنطقة.\n\nدعا المتحدث باسم الخارجية الإيرانية إسماعيل بقائي الأمريكيين إلى التساؤل عن أسباب طرح وعود بإعفاء أبنائهم من الديون المصرفية مقابل القتال في \"حرب إسرائيل ضد إيران\"."}, {"guid": "https://arabic.rt.com/middle_east/1829073-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7-%D8%A7%D9%84%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%A7%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84%D9%8A-%D9%8A%D8%AA%D9%88%D8%BA%D9%84-%D9%85%D8%AC%D8%AF%D8%AF%D8%A7-%D9%81%D9%8A-%D8%A7%D9%84%D9%82%D9%86%D9%8A%D8%B7%D8%B1%D8%A9-%D9%88%D8%AF%D8%B1%D8%B9%D8%A7-%D9%88%D8%B1%D9%8A%D9%81-%D8%AF%D9%85%D8%B4%D9%82/", "title": "سوريا.. الجيش الاسرائيلي يتوغل مجددا في القنيطرة ودرعا وريف دمشق", "summary": "يواصل الجيش الإسرائيلي انتهاكاته اليومية للأراضي السورية في جنوب البلاد، وخلال أقل من 24 ساعة توغلت قواته في مناطق عديدة في القنيطرة ودرعا وريف دمشق.", "link": "https://arabic.rt.com/middle_east/1829073-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7-%D8%A7%D9%84%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%A7%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84%D9%8A-%D9%8A%D8%AA%D9%88%D8%BA%D9%84-%D9%85%D8%AC%D8%AF%D8%AF%D8%A7-%D9%81%D9%8A-%D8%A7%D9%84%D9%82%D9%86%D9%8A%D8%B7%D8%B1%D8%A9-%D9%88%D8%AF%D8%B1%D8%B9%D8%A7-%D9%88%D8%B1%D9%8A%D9%81-%D8%AF%D9%85%D8%B4%D9%82/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c29614c59b7121f40b0ea.jpg", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788612488, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nيواصل الجيش الإسرائيلي انتهاكاته اليومية للأراضي السورية في جنوب البلاد، وخلال أقل من 24 ساعة توغلت قواته في مناطق عديدة في القنيطرة ودرعا وريف دمشق.\n\nوأفادت مصادر أهلية في درعا لـ RT بقيام قوة عسكرية إسرائيلية مؤلفة من 4 آليات عسكرية اليوم السبت بالتوغل من جديد في منطقة وادي الرقاد بريف درعا الغربي.\n\nووفقاً للمصادر فإن القوة العسكرية الاسرائيلية سلكت طريق \"عين التينة\" باتجاه موقع \"العقربية\"، قبل أن تعود أدراجها في وقت لاحق إلى داخل الأراضي المحتلة دون ورود معلومات عن قيامها بأية عمليات اعتقال بحق المواطنين السوريين في المنطقة.\n\nالجيش الإسرائيلي يتوغل ويقيم حواجز تفتيش داخل الأحياء السكنية في ريف القنيطرة وكانت مصادرنا في القنيطرة قد أفادتنا قبل قليل بقيام قوة عسكرية اسرائيلية مؤلفة من 4 آليات عسكرية بالتوغل في قرية الرومانية بريف القنيطرة انطلاقا من بوابة أبو الغيثار حيث اقتحمت القوة القرية ونصبت حاجزا عسكريا داخل أحد الأحياء السكنية فيها وباشرت بعمليات تفتيش دقيقة للمواطنين قبل أن تنسحب في وقت لاحق دون ورورد معلومات عن قيامها بأية عمليات اعتقال بحق المواطنين في القرية.\n\nويواصل الجيش الاسرائيلي توغلاته العسكرية في مناطق الجنوب السوري بتغطية من الطيران الحربي والمسير حيث يقوم بترهيب المدنيين وإطلاق النار بشكل عشوائي كما يقوم بعمليات اعتقال شبه يومية وينصب الحواجز ويدقق في هويات المارة ويرفع السواتر ويرش المبيدات السامة ويحول دون وصول الفلاحين إلى أراضيهم والرعاة إلى المراعي.\n\nتجددت الاشتباكات اليوم السبت، على محاور القتال شمال غربي محافظة السويداء، جنوب سوريا.\n\nحذر الكاتب الإسرائيلي دان بيري من أن إسرائيل قد لا تصمد حتى عام 2048 إذا لم تتبن الحكومة المقبلة ما وصفه بخطة \"إنقاذ وطني\" تعالج تداعيات الحرب والعزلة والانقسامات الداخلية.\n\nيتواصل التصعيد الإسرائيلي في مناطق متفرقة في الجنوب السوري وخصوصا في المنطقة القريبة من خط الفصل بين الجانبين.\n\nتشهد محافظة السويداء السورية المزيد من الانقسام السياسي حول سلطة المرجعية الروحية للطائفة الدرزية التي يتزعهما الشيخ حكمت الهجري الذي يبدو له الكلمة العليا في المحافظة.\n\nكشف السفير الروسي لدى تل أبيب أناتولي فيكتوروف، عن وجود آلية بين الجيشين الروسي والإسرائيلي لمنع وقوع حوادث غير مرغوب فيها في سوريا.\n\nأعلن الجيش الإسرائيلي أن الفرقة 210 اختتمت تدريبات عسكرية مكثفة في منطقة هضبة الجولان وعلى الحدود السورية، لتعزيز الجاهزية والحفاظ على كفاءة القوات للتعامل مع أحداث مفاجئة ومعقدة."}, {"guid": "https://arabic.rt.com/middle_east/1829069-%D9%85%D8%B3%D8%A4%D9%88%D9%84-%D8%B9%D8%B1%D8%A7%D9%82%D9%8A-%D9%8A%D9%88%D8%B6%D8%AD-%D9%83%D9%8A%D9%81-%D8%AA%D8%B9%D8%A7%D9%85%D9%84%D8%AA-%D8%A8%D8%BA%D8%AF%D8%A7%D8%AF-%D9%85%D8%B9-%D9%82%D9%86%D8%A7%D8%A8%D9%84-%D9%85%D8%AE%D9%8A%D9%85-%D8%A7%D9%84%D9%87%D9%88%D9%84-%D8%A7%D9%84%D8%B3%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D9%85%D9%88%D9%82%D9%88%D8%AA%D8%A9/", "title": "مسؤول عراقي يوضح كيف تعاملت بغداد مع قنابل مخيم الهول السوري \"الموقوتة\"", "summary": "أعلنت وزارة الهجرة والمهجرين العراقية، اليوم السبت، قرب إغلاق مخيم الهول في شمال شرقي سوريا بشكل كامل، بعد إعادة أعداد كبيرة من النازحين العراقيين إلى مناطقهم.", "link": "https://arabic.rt.com/middle_east/1829069-%D9%85%D8%B3%D8%A4%D9%88%D9%84-%D8%B9%D8%B1%D8%A7%D9%82%D9%8A-%D9%8A%D9%88%D8%B6%D8%AD-%D9%83%D9%8A%D9%81-%D8%AA%D8%B9%D8%A7%D9%85%D9%84%D8%AA-%D8%A8%D8%BA%D8%AF%D8%A7%D8%AF-%D9%85%D8%B9-%D9%82%D9%86%D8%A7%D8%A8%D9%84-%D9%85%D8%AE%D9%8A%D9%85-%D8%A7%D9%84%D9%87%D9%88%D9%84-%D8%A7%D9%84%D8%B3%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D9%85%D9%88%D9%82%D9%88%D8%AA%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c26b142360444de658b00.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788612425, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nأعلنت وزارة الهجرة والمهجرين العراقية، اليوم السبت، قرب إغلاق مخيم الهول في شمال شرقي سوريا بشكل كامل، بعد إعادة أعداد كبيرة من النازحين العراقيين إلى مناطقهم.\n\nوقال وكيل الوزارة كريم النوري، في تصريح للوكالة الرسمية، إن مخيم الهول شمال شرقي سوريا كان يمثل قنابل موقوتة يمكن تفجيرها في أي وقت، إلا أن العراق نجح في تفكيكها، ولم يتبقَ فيه سوى أعداد قليلة.\n\nوأضاف النوري أن عدد النازحين العراقيين المتبقين في المخيم يبلغ نحو 1200 شخص، مشيرا إلى أن 21 ألف شخص تمت إعادتهم إلى مناطقهم، ولم تُسجل أي خروقات أمنية في المناطق التي أعيدوا إليها.\n\nوأكد أن عدم تسجيل خروقات أمنية بعد عودة هؤلاء النازحين يؤكد نجاح عملية تأهيلهم مجتمعيا ونفسيا، لافتا إلى أن ملف مخيم الهول سيغلق قريبا وبشكل كامل.\n\nويعد مخيم الهول، الواقع في محافظة الحسكة شمال شرقي سوريا، من أبرز المخيمات التي تؤوي نازحين من جنسيات مختلفة، بينهم عراقيون وسوريون، إضافة إلى عائلات مرتبطة بعناصر تنظيم \"داعش\".\n\nوقد شكل المخيم على مدى السنوات الماضية تحديا أمنيا وإنسانيا، في ظل الكثافة السكانية والظروف المعيشية الصعبة، فيما عمل العراق على إعادة مواطنيه من المخيم إلى البلاد ضمن مراحل متتالية، وإخضاع العائدين لبرامج أمنية وتأهيلية قبل دمجهم مجددا في مناطقهم.\n\nدعت القوى السياسية في العراق فجر اليوم الأحد إلى توحيد الموقف الوطني والحفاظ على استقرار العراق وسيادته ومصالحه العليا.\n\nأعلنت الإدارة الجديدة للأمن الداخلي في مخيم الهول، شمال شرقي سوريا، اعتبار المخيم ومحيطه منطقة عسكرية مغلقة بشكل كامل، يمنع الاقتراب منها أو الدخول إليها تحت أي ظرف.\n\nأصدرت \"قوات سوريا الديمقراطية\" بيانا بشأن التطورات الأخيرة في مخيم الهول وتصريحات وزارة الداخلية السورية، موضحة أن \"دمشق حاولت التنصل من المسؤولية عما جرى في المخيم\".\n\nأدلى المتحدث باسم الداخلية السورية نور الدين البابا في مؤتمر صحفي، بتصريحات حول الأوضاع داخل مخيم الهول، مشيرا إلى العثور على آلاف المحتجزين لسنوات طويلة في ظروف وصفها بالقاسية.\n\nأعلن مدير مخيم الهول فادي القاسم أن السلطات السورية أغلقت المخيم الذي كانت تديره قوات سوريا الديمقراطية وكان يؤوي لسنوات عائلات عناصر تنظيم \"داعش\"، بعد إخلائه من آخر قاطنيه."}, {"guid": "https://arabic.rt.com/world/1829072-%D8%AA%D8%B5%D8%B1%D9%8A%D8%AD%D8%A7%D8%AA-%D8%AA%D8%B1%D8%A7%D9%85%D8%A8-%D8%A7%D9%84%D9%85%D8%B2%D9%84%D8%B2%D9%84%D8%A9-%D8%B9%D9%86-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%8A%D8%B5%D9%84-%D8%B5%D8%AF%D8%A7%D9%87%D8%A7-%D8%A5%D9%84%D9%89-%D8%A3%D9%84%D9%85%D8%A7%D9%86%D9%8A%D8%A7/", "title": "تصريحات ترامب المزلزلة عن بوتين يصل صداها إلى ألمانيا", "summary": "تفاعل قرّاء صحيفة دي فيلت الألمانية بشكل قوي وحيوي مع التصريحات التي أدلى بها الرئيس الأمريكي دونالد ترامب بالأمس عن نظيره الروسي فلاديمير بوتين.", "link": "https://arabic.rt.com/world/1829072-%D8%AA%D8%B5%D8%B1%D9%8A%D8%AD%D8%A7%D8%AA-%D8%AA%D8%B1%D8%A7%D9%85%D8%A8-%D8%A7%D9%84%D9%85%D8%B2%D9%84%D8%B2%D9%84%D8%A9-%D8%B9%D9%86-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%8A%D8%B5%D9%84-%D8%B5%D8%AF%D8%A7%D9%87%D8%A7-%D8%A5%D9%84%D9%89-%D8%A3%D9%84%D9%85%D8%A7%D9%86%D9%8A%D8%A7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c27944c59b710a5581e0d.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788612159, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nتفاعل قرّاء صحيفة دي فيلت الألمانية بشكل قوي وحيوي مع التصريحات التي أدلى بها الرئيس الأمريكي دونالد ترامب بالأمس عن نظيره الروسي فلاديمير بوتين.\n\nوكان ترامب قد صرح يوم أمس، خلال حديثه مع الصحفيين، بأن الرئيس الروسي لا يسعى لمهاجمة دول الناتو، مؤكدا أنه يعرف الرئيس بوتين جيدا ويحافظ على اتصالاته معه.\n\nبوتين يلتقي ويتكوف للمرة السادسة وكتب أحد المعلقين: \"بهذه الطريقة، يتحدى ترامب (المستشار الألماني فريدريش ميرتس)! شكرا لك يا سيادة الرئيس\".\n\nوعلّق قارئ آخر قائلا: \"شكرا لك يا دونالد ترامب لأن هذه الأكذوبة شارفَتْ أخيرا على الانتهاء! لم يعد بإمكاننا تحمل مغامري الحرب هؤلاء في الاتحاد الأوروبي\".\n\nوأضاف معلق ثالث: \"إن إشعال فتيل الحرب وإثارة الذعر من قِبل سياسيينا الكومبارس ليس سوى مناورة لصرف الأنظار، بهدف إبقاء الشعب — هؤلاء المغفلين السذج — تحت السيطرة\".\n\nوقال مستخدم آخر: \"على أقل تقدير، نجح ترامب وبوتين في إرساء أسس الحوار. أما ديمقراطيتنا نحن، فلا يُتوقع منها أي دبلوماسية!\".\n\nوجاء تصريح الرئيس الأمريكي ردا على سؤال حول تصريحاته السابقة، التي أكد فيها أنه طالما بقي على رأس السلطة، فلن يُقدم الرئيس الروسي على مهاجمة أراضي الناتو.\n\nواستفسر الصحفي كذلك من ترامب عما إذا كان يمكن اعتبار الطائرة المسيرة التي عُثر عليها في مطار ليبزيغ الألماني —والتي حمّلت برلين مسؤوليتها لموسكو— بمثابة هجوم على الناتو. ولم يغير ترامب موقفه ولم يتراجع بعد السؤال عن رأيه؛ بل دافع بشكل غير مباشر عن نظيره الروسي، وقال: \"أنا أعرفه جيدا، وبوتين لا يتطلع لمهاجمة أراضي الناتو\".\n\nوهذا الموقف من جانب ترامب، أثار حفيظة الأوساط السياسية في برلين التي رأت في هذا التصريح \"تجاهلا للاتهامات الألمانية الرسمية لموسكو بشن عمليات هجينة داخل أراضيها\".\n\nأكد نائب وزير خارجية روسيا سيرغي ريابكوف أنه ينبغي للإدارة الأمريكية أن تأخذ في الحسبان الحقائق على الأرض في التسوية الأوكرانية، مشيرا إلى أن الوضع يسير نحو الأسوأ بالنسبة لكييف.\n\nكشفت مصادر مطلعة أن الولايات المتحدة طلبت من روسيا وأوكرانيا وقف تبادل الضربات خلال الزيارة المرتقبة للمبعوثين الأمريكيين ستيف ويتكوف، وجاريد كوشنر، إلى موسكو وكييف."}, {"guid": "https://arabic.rt.com/sport/1829068-%D8%A8%D8%AF%D9%85%D9%88%D8%B9-%D8%A7%D9%84%D8%AD%D8%B2%D9%86-%D9%86%D8%AC%D9%85-%D9%85%D9%86%D8%AA%D8%AE%D8%A8-%D8%A7%D9%84%D9%85%D8%BA%D8%B1%D8%A8-%D8%B3%D9%81%D9%8A%D8%A7%D9%86-%D8%B1%D8%AD%D9%8A%D9%85%D9%8A-%D9%8A%D9%88%D8%AF%D8%B9-%D9%88%D8%A7%D9%84%D8%AF%D9%87-%D8%A5%D9%84%D9%89-%D9%85%D8%AB%D9%88%D8%A7%D9%87-%D8%A7%D9%84%D8%A3%D8%AE%D9%8A%D8%B1/", "title": "بدموع الحزن.. نجم منتخب المغرب سفيان رحيمي يودع والده إلى مثواه الأخير", "summary": "بثت وسائل إعلام مغربية مشاهد مؤثرة من مراسم تشييع جثمان والد نجم المنتخب المغربي ونادي العين الإماراتي، سفيان رحيمي، بحضور عدد من الشخصيات الرياضية والأقارب والمحبين.", "link": "https://arabic.rt.com/sport/1829068-%D8%A8%D8%AF%D9%85%D9%88%D8%B9-%D8%A7%D9%84%D8%AD%D8%B2%D9%86-%D9%86%D8%AC%D9%85-%D9%85%D9%86%D8%AA%D8%AE%D8%A8-%D8%A7%D9%84%D9%85%D8%BA%D8%B1%D8%A8-%D8%B3%D9%81%D9%8A%D8%A7%D9%86-%D8%B1%D8%AD%D9%8A%D9%85%D9%8A-%D9%8A%D9%88%D8%AF%D8%B9-%D9%88%D8%A7%D9%84%D8%AF%D9%87-%D8%A5%D9%84%D9%89-%D9%85%D8%AB%D9%88%D8%A7%D9%87-%D8%A7%D9%84%D8%A3%D8%AE%D9%8A%D8%B1/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c2520423604449e459bb4.png", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788611398, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nبثت وسائل إعلام مغربية مشاهد مؤثرة من مراسم تشييع جثمان والد نجم المنتخب المغربي ونادي العين الإماراتي، سفيان رحيمي، بحضور عدد من الشخصيات الرياضية والأقارب والمحبين.\n\nوأظهرت المقاطع المصورة حجم الحزن والتأثر الكبيرين الباديين على وجه سفيان وشقيقه الحسين رحيمي، الذي يلعب أيضا لصفوف نادي العين الإماراتي، وهما يودعان والدهما الحاج محمد رحيمي إلى مثواه الأخير.\n\nببالغ الحزن والأسى، أتقدم بخالص التعازي وصادق المواساة إلى الدولي المغربي #سفيان_رحيمي وشقيقه الحسين، وإلى أفراد عائلة رحيمي كافة، في وفاة والدهم المشمول برحمة الله، الحاج محمد رحيمي «يوعري».نسأل الله تعالى أن يتغمد الفقيد بواسع رحمته ومغفرته، وأن يسكنه فسيح جناته، ويلهم أهله… pic.twitter.com/0BNv0f7NUf\n\n- رحم الله الحاج رحيمي والد سفيان رحيمي والحسين 🤍- الله يرحمه ويصبر أهله وعياله pic.twitter.com/5DicKA2Gbn\n\nويعد الفقيد، المعروف بـ\"اليوعري\"، أحد أبرز وأشهر الوجوه التي ارتبط اسمها بتاريخ نادي الرجاء الرياضي المغربي، حيث قضى أكثر من 60 عاما في خدمة النادي المغربي مسؤولا عن الأمتعة ومرافقا دائما لجيل بعد جيل من لاعبي \"النسور الخضراء\".\n\nيتقدم نادي العين بخالص التعازي وصادق المواساة إلى سفيان رحيمي وشقيقه حسين رحيمي، في وفاة والدهما، سائلين المولى عز وجل أن يتغمد الفقيد بواسع رحمته ومغفرته، وأن يسكنه فسيح جناته، وأن يلهم أسرته وذويه جميل الصبر والسلوان.إنا لله وإنا إليه راجعون. pic.twitter.com/wGvxcy7Abp\n\nوعقب إعلان الوفاة، قدم نادي العين الإماراتي تعازيه الصادقة للشقيقين سفيان وحسين، حيث نشر الحساب الرسمي للنادي على منصة \"إكس\" بيانا جاء فيه: \"يتقدم نادي العين بخالص التعازي وصادق المواساة إلى سفيان رحيمي وشقيقه حسين رحيمي في وفاة والدهما، سائلين المولى عز وجل أن يتغمد الفقيد بواسع رحمته ومغفرته، وأن يسكنه فسيح جناته، ويلهم أسرته وذويه جميل الصبر والسلوان.. إنا لله وإنا إليه راجعون\".\n\nومن جانبه، نعى نادي الرجاء الرياضي أحد أبرز رجالاته الأوفياء عبر بيان رسمي أعرب فيه عن بالغ حزنه، مؤكدا أن الراحل جسد أسمى معاني الوفاء والانتماء للقلعة الخضراء لسنوات طويلة، متقدما بأحر التعازي لأسرة الفقيد ولجميع مكونات العائلة الرجاوية.\n\nوكان سفيان رحيمي قد شارك جماهيره قبل فترة برسالة مؤثرة عبر حسابه الشخصي يعبر فيها عن ألمه لمرض والده، كاتبا: \"لم يكسرني شيء سوى مرض أبي.. يؤلمني قلبي عندما يتألم. يا رب أنت تعلم وترى كم يكسرني مرضه، فارحم ضعفه والطف بحاله، يا رب اشف والدي\"."}, {"guid": "https://arabic.rt.com/world/1829059-%D9%85%D9%82%D8%A7%D8%AA%D9%84%D8%A9-%D9%8A%D9%88%D9%86%D8%A7%D9%86%D9%8A%D8%A9-%D8%AA%D8%AA%D8%AD%D8%B7%D9%85-%D8%AE%D9%84%D8%A7%D9%84-%D8%B9%D8%B1%D8%B6-%D8%AC%D9%88%D9%8A-%D9%82%D8%B1%D8%A8-%D8%A3%D8%AB%D9%8A%D9%86%D8%A7-%D9%81%D9%8A%D8%AF%D9%8A%D9%88/", "title": "مقاتلة يونانية تتحطم خلال عرض جوي قرب أثينا (فيديو)", "summary": "تحطمت طائرة مقاتلة من طراز \"إف-4 فانتوم\" تابعة للقوات الجوية اليونانية اليوم السبت خلال عرض جوي في قاعدة تاناغرا الجوية شمال العاصمة أثينا.", "link": "https://arabic.rt.com/world/1829059-%D9%85%D9%82%D8%A7%D8%AA%D9%84%D8%A9-%D9%8A%D9%88%D9%86%D8%A7%D9%86%D9%8A%D8%A9-%D8%AA%D8%AA%D8%AD%D8%B7%D9%85-%D8%AE%D9%84%D8%A7%D9%84-%D8%B9%D8%B1%D8%B6-%D8%AC%D9%88%D9%8A-%D9%82%D8%B1%D8%A8-%D8%A3%D8%AB%D9%8A%D9%86%D8%A7-%D9%81%D9%8A%D8%AF%D9%8A%D9%88/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c228d42360444010705bc.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788610703, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nتحطمت طائرة مقاتلة من طراز \"إف-4 فانتوم\" تابعة للقوات الجوية اليونانية اليوم السبت خلال عرض جوي في قاعدة تاناغرا الجوية شمال العاصمة أثينا.\n\nوشوهدت أعمدة كثيفة من الدخان الأسود تتصاعد من موقع تحطم الطائرة، وسط حضور آلاف المتفرجين الذين كانوا يتابعون فعاليات أسبوع أثينا للطيران، وهو عرض جوي سنوي.\n\nوقال مسؤولون في القوات الجوية اليونانية إنه لم يتضح حتى الآن ما إذا كان الطياران قد تمكنا من مغادرة الطائرة قبل تحطمها.\n\nولاحقا أفادت تقارير بأنه تم العثور على الطيارين فاقدَيْن للوعي بعيد الساعة الرابعة عصرا.\n\nولا تزال ملابسات الحادث غامضة حتى الآن؛ فوفقا للمعلومات الأولية، فقد سقطت الطائرة من ارتفاع منخفض على مدرج القاعدة قبيل هبوطها.\n\nوبحسب شهود عيان، فقد بدا أن دخانا كان يخرج من الطائرة قبل سقوطها، كما أفاد الشهود أنفسهم بأن الطائرة بدأت تفقد ارتفاعها فجأة قبل أن تتحطم.\n\nولم ترد على الفور تقارير عن وقوع إصابات بين الحاضرين، وأظهرت لقطات فيديو من موقع الحادث مروحية إطفاء تحلق فوق المنطقة، في محاولة للسيطرة على النيران ومنع انتشار الحريق."}, {"guid": "https://arabic.rt.com/business/1829053-%D9%85%D8%A7-%D8%A8%D8%B9%D8%AF-%D9%87%D8%B1%D9%85%D8%B2-%D9%83%D9%8A%D9%81-%D9%8A%D8%AA%D8%AD%D9%88%D9%84-%D8%A7%D9%84%D8%AD%D9%84-%D8%A7%D9%84%D8%B7%D8%A7%D8%B1%D8%A6-%D9%84%D9%86%D9%82%D9%84-%D9%86%D9%81%D8%B7-%D8%A7%D9%84%D8%B9%D8%B1%D8%A7%D9%82-%D8%B9%D8%A8%D8%B1-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7-%D9%84%D9%85%D8%B4%D8%B1%D9%88%D8%B9-%D8%A7%D8%B3%D8%AA%D8%B1%D8%A7%D8%AA%D9%8A%D8%AC%D9%8A-%D9%8A%D8%BA%D9%8A%D8%B1-%D9%85%D9%88%D8%A7%D8%B2%D9%8A%D9%86-%D8%A7%D9%84%D9%82%D9%88%D9%89/", "title": "ما بعد هرمز: كيف يتحول \"الحل الطارئ\" لنقل نفط العراق عبر سوريا لمشروع استراتيجي يغير موازين القوى؟", "summary": "باتت قوافل ضخمة من الشاحنات والصهاريج المحملة بالنفط تجوب الطرقات الصحراوية السورية، في مشهد يعكس تحولاً استراتيجياً في خريطة تدفق الطاقة بالمنطقة.", "link": "https://arabic.rt.com/business/1829053-%D9%85%D8%A7-%D8%A8%D8%B9%D8%AF-%D9%87%D8%B1%D9%85%D8%B2-%D9%83%D9%8A%D9%81-%D9%8A%D8%AA%D8%AD%D9%88%D9%84-%D8%A7%D9%84%D8%AD%D9%84-%D8%A7%D9%84%D8%B7%D8%A7%D8%B1%D8%A6-%D9%84%D9%86%D9%82%D9%84-%D9%86%D9%81%D8%B7-%D8%A7%D9%84%D8%B9%D8%B1%D8%A7%D9%82-%D8%B9%D8%A8%D8%B1-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7-%D9%84%D9%85%D8%B4%D8%B1%D9%88%D8%B9-%D8%A7%D8%B3%D8%AA%D8%B1%D8%A7%D8%AA%D9%8A%D8%AC%D9%8A-%D9%8A%D8%BA%D9%8A%D8%B1-%D9%85%D9%88%D8%A7%D8%B2%D9%8A%D9%86-%D8%A7%D9%84%D9%82%D9%88%D9%89/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c21fb42360446d64a99bb.jpg", "category": "اقتصاد", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788610636, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nباتت قوافل ضخمة من الشاحنات والصهاريج المحملة بالنفط تجوب الطرقات الصحراوية السورية، في مشهد يعكس تحولاً استراتيجياً في خريطة تدفق الطاقة بالمنطقة.\n\nوتنطلق هذه القوافل، التي تحمل لوحات تسجيل عراقية في غالبيتها، من مصافي التكرير في جنوب العراق، لتقطع مسافات طويلة عبر طرق متضررة وازدحامات تمتد لعشرات الكيلومترات، وصولاً إلى ميناء \"بانياس\" على الساحل السوري، حيث يُفرغ النفط في خزانات تخزين ليُعاد تحميله لاحقاً على ناقلات تتجه نحو الأسواق الأوروبية والإفريقية.وبحسب تقارير صحفية دولية، بدأت هذه الحركة كحل طارئ في شهر أبريل الماضي، بعد أن اضطرت شركات تصدير النفط العراقية للبحث عن منافذ بديلة جراء شبه توقف الحركة في مضيق هرمز الاستراتيجي.\n\nبغداد تتحرك لتفادي تداعيات هرمز.. وزير التجارة العراقي يكشف لـRT خطة إمدادات الأسواق لكن هذا الحل السريع ما لبث أن تحول إلى مشروع طموح لإنشاء ممر بري للطاقة يربط حقول النفط الجنوبية في العراق بالبحر الأبيض المتوسط عبر الأراضي السورية.\n\nويأتي هذا التوجه في وقت يعتمد فيه العراق، بوصفه ثاني أكبر منتج للنفط في منظمة \"أوبك\"، بشكل شبه كلي على منافذ التصدير الجنوبية القريبة من البصرة، والتي تمر عبر مضيق هرمز، حيث كانت تمر نحو 3.4 مليون برميل يومياً من أصل 3.6 مليون برميل يتم تصديرها قبل اندلاع الأزمة.وتشير تقديرات إلى أن شركة تسويق النفط العراقية الحكومية \"سومو\" منحت عقوداً لنقل مئات الآلاف من الأطنان من الوقود الثقيل شهرياً عبر سوريا، مع تطلع بغداد إلى توسيع هذا الترتيب ليشمل النفط الخام، بهدف تصدير عشرات الآلاف من البراميل يومياً كمرحلة أولى.\n\nويؤكد مسؤولون في بغداد أن الهدف ليس مجرد تجاوز الأزمة الراهنة فحسب، بل تأمين بديل استراتيجي دائم يحمي الصادرات العراقية من أي عمليات إغلاق مستقبلية للمضيق، مما يبقي هذا المسار فعالاً حتى بعد عودة الملاحة في هرمز إلى طبيعتها الكاملة.إلا أن الاعتماد على الشاحنات كحل دائم يواجه عقبات لوجستية واقتصادية جمّة، نظراً لبطء الحركة، وارتفاع التكاليف، وتردي حالة الطرق في سوريا، فضلاً عن تكرار الحوادث. ولذلك، اتجهت الأنظار نحو حلول أكثر استدامة، حيث وقّع العراق وسوريا مذكرات تفاهم مع كونسورتيوم دولي يضم عملاق الطاقة الأمريكي \"شيفرون\"، وشركة \"TA Capital\" للاستثمارات، وشركة \"UCC\" القطرية.\n\nوتهدف هذه الشراكة إلى إجراء دراسات فنية واقتصادية تمهيداً لإنشاء خط أنابيب جديد، يُنظر إليه كبعث حديث لخط \"كركوك-بانياس\" التاريخي الذي توقف عن العمل منذ عام 2003، لكن بمواصفات وطموحات أكبر بكثير.ويتوقع أن يمتد الخط المقترح ليربط حقول النفط في جنوب العراق، مثل حقل \"غرب القرنة 2\" و\"الناصرية\"، بالبحر الأبيض المتوسط، وبطاقة استيعابية قد تصل إلى مليوني برميل يومياً، مقارنة بـ 300 ألف برميل يومياً فقط كان ينقلها الخط القديم.\n\nومع ذلك، تحيط بالمشروع تحديات جسيمة، أبرزها التكلفة الباهظة التي تُقدر بما يتراوح بين 5 و15 مليار دولار، ومدة تنفيذ قد تمتد لأربع سنوات. كما يحذر خبراء من أن الجدوى الاقتصادية للمشروع قد تكون موضع شك، إذ قد تكون تكاليف العبور عبر مضيق هرمز أقل كلفة من مخاطر وتكاليف إنشاء وتشغيل خط أنابيب بري جديد.ولا تقل التحديات الأمنية خطورة عن العقبات الاقتصادية، فالمنطقة التي سيمر عبرها الخط المقترح في غرب العراق وشرق سوريا تشهد حضوراً لميليشيات مدعومة إيرانياً، وخلايا لتنظيم \"داعش\" الذي سبق أن دمر أجزاء من البنية التحتية للنفط في المنطقة.\n\nويؤكد محللون أن أي هجوم على محطة ضخ واحدة قد يعطل تدفق النفط بالكامل، مما سيرفع تكاليف التأمين والأمن بشكل هائل، ويحول المخاطر من تهديد بحري في مضيق هرمز إلى تهديد بري ممتد على مئات الكيلومترات.وفي النهاية، يخلص خبراء الطاقة إلى أنه لا يوجد خط أنابيب واحد قادر على تعويض أهمية مضيق هرمز بشكل كامل، بل إن الحل الاستراتيجي الأمثل يكمن في بناء شبكة متكاملة من مسارات التصدير البديلة. وتشمل هذه الشبكة المسار المتوسطي، ومسارات محتملة نحو البحر الأحمر، أو نحو خليج عمان، حيث يتجنب كل مسار تهديداً معيناً، لكنه يظل عرضة لمخاطر أخرى، مما يجعل التنويع الجغرافي لتصدير النفط الضمانة الوحيدة لاستقرار الإمدادات في ظل تقلبات المنطقة.\n\nدعت القوى السياسية في العراق فجر اليوم الأحد إلى توحيد الموقف الوطني والحفاظ على استقرار العراق وسيادته ومصالحه العليا.\n\nأعلنت العلاقات العامة للحرس الثوري الإيراني في بيان فجر اليوم الأحد، استهداف حاملة طائرات ومدمرة تابعتين للجيش الأمريكي.\n\nهاجمت قوات القيادة المركزية الأمريكية (سنتكوم) ثلاث ناقلات نفط خام إيرانية، ردا على قيام فيلق الحرس الثوري الإيراني بإطلاق صواريخ باليستية باتجاه مدمرتين تابعتين للبحرية الأمريكية.\n\nقال الرئيس الأمريكي دونالد ترامب إن سوريا باتت تمثل أحد المسارات البديلة لمضيق هرمز، مشيرا إلى عبور شاحنات ضخمة محملة بالنفط عبر الأراضي السورية نحو البحر المتوسط.\n\nأكدت وزارة النفط العراقية، اليوم الأحد، عزمها على المضي قدما في استكمال الإجراءات الفنية والاقتصادية لمشروع أنبوب تصدير النفط الاستراتيجي \"البصرة - حديثة - كركوك – بانياس\".\n\nيزداد عمل مرفأ بانياس بمحافظة طرطوس بوتيرة عالية منذ بداية العام الحالي حيث تشير الإحصائيات إلى استقباله 108 نواقل محملة بنحو 3.23 ملايين طن من مختلف أنواع المشتقات النفطية.\n\nاستقبل مرفأ بانياس البحري في سوريا اليوم ناقلة مازوت محملة بـ64,324 طنا متريا، إلى جانب ناقلة غاز مسال تحمل شحنة بقيمة 5,620.3 طنا متريا."}, {"guid": "https://arabic.rt.com/world/1829060-%D8%A7%D9%84%D8%B3%D9%84%D8%B7%D8%A7%D8%AA-%D8%A7%D9%84%D8%AA%D8%B1%D9%83%D9%8A%D8%A9-%D8%AA%D9%88%D8%B6%D8%AD-%D9%85%D8%B5%D9%8A%D8%B1-%D8%A7%D9%84%D8%AC%D8%B3%D9%88%D8%B1-%D8%A8%D8%B9%D8%AF-%D9%82%D8%B1%D8%A7%D8%B1-%D8%A3%D8%B1%D8%AF%D9%88%D8%BA%D8%A7%D9%86/", "title": "السلطات التركية توضح مصير الجسور بعد قرار أردوغان", "summary": "أعلنت وزارة الخزانة والمالية التركية عدم وجود مخطط لبيع الجسور والطرق السريعة، بل تدرس إمكانية نقل إدارتها إلى شركات خاصة لتقوم باستثمارها لفترة محددة.", "link": "https://arabic.rt.com/world/1829060-%D8%A7%D9%84%D8%B3%D9%84%D8%B7%D8%A7%D8%AA-%D8%A7%D9%84%D8%AA%D8%B1%D9%83%D9%8A%D8%A9-%D8%AA%D9%88%D8%B6%D8%AD-%D9%85%D8%B5%D9%8A%D8%B1-%D8%A7%D9%84%D8%AC%D8%B3%D9%88%D8%B1-%D8%A8%D8%B9%D8%AF-%D9%82%D8%B1%D8%A7%D8%B1-%D8%A3%D8%B1%D8%AF%D9%88%D8%BA%D8%A7%D9%86/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c204942360444de658aef.jpg", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788610566, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nأعلنت وزارة الخزانة والمالية التركية عدم وجود مخطط لبيع الجسور والطرق السريعة، بل تدرس إمكانية نقل إدارتها إلى شركات خاصة لتقوم باستثمارها لفترة محددة.\n\nويشار إلى أن السلطات التركية فتحت الإمكانية لنقل إدارة جسرين في إسطنبول يعبران مضيق البوسفور وعشرة طرق سريعة إلى القطاع الخاص لمدة 30 عاما، حيث وقع الرئيس التركي رجب طيب أردوغان القرار ذي الصلة يوم الجمعة.\n\nإصابة أكثر من عشرة أشخاص في حريق اندلع داخل فندق في إسطنبول (فيديوهات) وجاء في بيان الوزارة التركية: \"لن يتم بيع الطرق السريعة والجسور، بل ستظل مملوكة للدولة، في حين يتم تقييم النموذج الأفضل لنقل حق التشغيل لفترة محددة\".\n\nوأكدت الوزارة أنه لم يتم الإعلان عن مناقصة الخصخصة بعد، مشيرة إلى أن قرار الرئيس التركي الذي نُشر في اليوم السابق يمنح إدارة الخصخصة الصلاحيات فقط لإجراء الإجراءات التحضيرية اللازمة.\n\nكما نفت الوزارة مزاعم تفيد بأن الطرق السريعة التركية، تحقق للدولة أرباحا صافية سنوية بقيمة 600 مليون دولار.\n\nونوهت الوزارة بأن نحو 300 مليون دولار من هذا المبلغ يُوجّه لصيانة وإصلاح الطرق، كما تشمل النفقات أيضا: الاستثمارات، وتحديث البنية التحتية، ورواتب الموظفين، والتكاليف التشغيلية.\n\nوانطلاقا من ذلك، ترى الوزارة التركية أنه من غير الدقيق حساب أن الأرباح السنوية البالغة 600 مليون دولار ستصل إلى 18 مليار دولار على مدى 30 عاما، واعتبار ذلك ضررا محتملا للميزانية. وشددت الوزارة على أنه لم يتم اتخاذ أي قرارات بشأن تحويل الطرق السريعة المجانية إلى طرق مدفوعة الأجر، أو فرض أي زيادة إضافية على رسوم العبور.\n\nووفقا لوكالة بلومبرغ، تدرس شركة Meridiam SAS (وهي مستثمر فرنسي في مجال البنية التحتية)، إمكانية المشاركة في خصخصة جسرين بارزين يعبران مضيق البوسفور في إسطنبول.\n\nوتعبر مئات آلاف السيارات يوميا الجسرين اللذين يمران فوق مضيق البوسفور. ويربط هذان الجسران بين الجزء الأوروبي والجزء الآسيوي من إسطنبول، ويقعان تحت إدارة المديرية العامة للطرق السريعة في تركيا."}, {"guid": "https://www.dw.com/ar/المهاجرون-ساكسونيا-أنهالت-في-مواجهة-حزب-البديل-هذه-بلادنا-أيضا/a-78582702?maca=ara-rss-ar-all-1125-rdf", "title": "المهاجرون ساكسونيا-أنهالت في مواجهة حزب \"البديل\": \"هذه بلادنا أيضا\"", "summary": "قد يفوز حزب البديل من أجل ألمانيا بانتخابات ساكسونيا-أنهالت بوصفه القوة الأكبر، فيما يختار أبناء المهاجرين المشاركة بدل الانسحاب، برسالة واضحة: \"هذه بلادنا أيضا، وهنا موطننا\".", "link": "https://www.dw.com/ar/المهاجرون-ساكسونيا-أنهالت-في-مواجهة-حزب-البديل-هذه-بلادنا-أيضا/a-78582702?maca=ara-rss-ar-all-1125-rdf", "image": "", "category": "سياسة", "source_id": "dw-arabic", "source_name": "DW عربي", "source_cat": "دولية", "published": 1788610560, "detail": ""}, {"guid": "069af91c-a920-11f1-a591-498e4f3d2836", "title": "ريبورتاج - فيضانات نيبال: الناجون بين مخيمات مكتظة ومستقبل مجهول بعد السيول المدمرة", "summary": "فقد آلاف النيباليين منازلهم وممتلكاتهم في دقائق معدودة خلال السيول المفاجئة التي اجتاحت البلاد في 26 أغسطس/آب، مخلفةً قتلى ومفقودين، فيما لا تزال ظروف الإيواء المؤقتة صعبة وسط ازدحام شديد وغياب رؤية واضحة لمستقبل المتضررين. ورغم جهود السلطات والمنظمات الإنسانية، يواجه الناجون تحديات مزدوجة: البحث عن", "link": "https://www.france24.com/ar/%D8%A2%D8%B3%D9%8A%D8%A7/20260905-%D8%B1%D9%8A%D8%A8%D9%88%D8%B1%D8%AA%D8%A7%D8%AC-%D9%81%D9%8A%D8%B6%D8%A7%D9%86%D8%A7%D8%AA-%D9%86%D9%8A%D8%A8%D8%A7%D9%84-%D8%A7%D9%84%D9%86%D8%A7%D8%AC%D9%88%D9%86-%D8%A8%D9%8A%D9%86-%D9%85%D8%AE%D9%8A%D9%85%D8%A7%D8%AA-%D9%85%D9%83%D8%AA%D8%B8%D8%A9-%D9%85%D8%B3%D8%AA%D9%82%D8%A8%D9%84-%D9%85%D8%AC%D9%87%D9%88%D9%84-%D8%A8%D8%B9%D8%AF-%D8%A7%D9%84%D8%B3%D9%8A%D9%88%D9%84-%D8%A7%D9%84%D9%85%D8%AF%D9%85%D8%B1%D8%A9", "image": "https://s.france24.com/media/display/9925c7d4-a90d-11f1-ad14-005056bfb2b6/w:1024/p:16x9/000-C7ET3ZT.jpg", "category": "أخبار", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788610459, "detail": ""}, {"guid": "https://arabic.rt.com/middle_east/1829057-1500-%D9%85%D9%82%D8%A7%D8%AA%D9%84%D8%A9-%D9%83%D8%B1%D8%AF%D9%8A%D8%A9-%D9%8A%D8%B1%D9%81%D8%B6%D9%86-%D8%A7%D9%84%D8%B0%D9%88%D8%A8%D8%A7%D9%86-%D9%88%D9%8A%D8%B7%D9%84%D8%A8%D9%86-%D9%88%D8%AD%D8%AF%D8%A9-%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9-%D9%85%D8%B3%D8%AA%D9%82%D9%84%D8%A9-%D9%81%D9%8A-%D8%A7%D9%84%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%B3%D9%88%D8%B1%D9%8A/", "title": "1500 مقاتلة كردية يرفضن \"الذوبان\" ويطلبن وحدة عسكرية مستقلة في الجيش السوري", "summary": "بعد أن أصبحن أحد أبرز الرموز العالمية للحرب في سوريا، وخضنَ غمار المعارك لسنوات طويلة في الخطوط الأمامية، تجد أكثر من 1500 مقاتلة كردية أنفسهن اليوم أمام مفترق طرق وجودي.", "link": "https://arabic.rt.com/middle_east/1829057-1500-%D9%85%D9%82%D8%A7%D8%AA%D9%84%D8%A9-%D9%83%D8%B1%D8%AF%D9%8A%D8%A9-%D9%8A%D8%B1%D9%81%D8%B6%D9%86-%D8%A7%D9%84%D8%B0%D9%88%D8%A8%D8%A7%D9%86-%D9%88%D9%8A%D8%B7%D9%84%D8%A8%D9%86-%D9%88%D8%AD%D8%AF%D8%A9-%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9-%D9%85%D8%B3%D8%AA%D9%82%D9%84%D8%A9-%D9%81%D9%8A-%D8%A7%D9%84%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%B3%D9%88%D8%B1%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c1f8542360444df6c93db.jpg", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788610295, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nبعد أن أصبحن أحد أبرز الرموز العالمية للحرب في سوريا، وخضنَ غمار المعارك لسنوات طويلة في الخطوط الأمامية، تجد أكثر من 1500 مقاتلة كردية أنفسهن اليوم أمام مفترق طرق وجودي.\n\nفمع تراجع أوار الحرب وإعلان القوى الكردية عن دمجها الرسمي في مؤسسات الدولة، بات مستقبل \"وحدات حماية المرأة\" (YPJ) معلقاً في مهب الريح، في ظل غياب واضح لمسار يضمن لهن الاستمرار في الخدمة العسكرية.\n\nوعملت هذه الوحدات لسنوات كجزء أساسي من \"قوات سوريا الديمقراطية\" (قسد)، التحالف العسكري الذي تقوده الغالبية الكردية وقاد المعركة البرية الحاسمة ضد تنظيم \"داعش\" في مساحات شاسعة من الأراضي السورية.\n\nومع إعلان \"قسد\" مؤخراً عن حلّها واندماجها رسمياً في الجيش السوري، يُتوقع أن يتم استيعاب المقاتلين الرجال في وزارة الدفاع والهياكل العسكرية الجديدة، فيما يظل مستقبل النساء علامة استفهام كبيرة، نظراً لأن الجيش السوري لا يسمح حالياً بانخراط النساء في صفوفه.\n\nوفي هذا السياق، كشفت نوروز أحمد، قائدة \"وحدات حماية المرأة\"، لوكالة \"رويترز\" أنه خلال اللقاءات التي عقدتها مع الرئيس السوري أحمد الشرع، أُبلغت بوضوح أنه لا مكان لمقاتلات الوحدات في الهيكلية الحالية للجيش.\n\nإلا أن المقاتلات لا يستسلمن لهذا الواقع، ويطالبن بالاندماج في المؤسسة العسكرية كوحدة منظمة ومنفصلة، تحافظ على هيكلها الحالي وخبراتها العملياتية المتراكمة. وتؤكد أحمد: \"أردنا الانضمام إلى الجيش لأن قواتنا تمتلك خبرة تمكنها من الدفاع عن نفسها بشكل منظم، ككتيبة أو كوحدة مستقلة\".\n\nوفي محاولة لإيجاد مخرج من هذا المأزق، تخوض المقاتلات حالياً مفاوضات مع وزارة الداخلية السورية، حيث تبرز إحدى الخيارات المطروحة إمكانية دمجهن في قوات العمليات الخاصة التابعة للوزارة.\n\nوتشير أحمد إلى أنها طالبت السلطات بتوضيح ما إذا كان بإمكان جميع المقاتلات، البالغ عددهن أكثر من 1500، الاندماج في هذا الإطار الجديد.\n\nوفي وقت سابق، ترددت أنباء عن عرض حكومي بنقل المقاتلات إلى \"شرطة السياحة\" التي تضم عناصر نسائية، وهو عرض قوبل بالرفض القاطع من قبل المقاتلات اللواتي يصررن على الحصول على أدوار تحافظ على القدرات العسكرية التي اكتسبنها خلال سنوات الحرب، فيما نفى متحدث باسم الوحدات وجود أي عرض رسمي من هذا القبيل.\n\nوتشكل هذه المعضلة أحد أبرز الملفات التي عرقلت لأشهر طويلة استكمال الاتفاق النهائي بين الحكومة السورية و\"قسد\". فمنذ بداية المفاوضات، أصر الممثلون الأكراد على أن مقاتلات \"وحدات حماية المرأة\" هن جنود محترفات خضن المعارك ضد \"داعش\" لسنوات، ويجب أن يستمررن في الخدمة بنفس الصفة.\n\nوبالنسبة لهؤلاء النساء، فإن المعركة الحالية تتجاوز بكثير مجرد البحث عن \"وظيفة\"؛ فخلال الحرب الأهلية السورية، تحولت هذه الوحدات إلى مصدر إلهام ورمز لتمكين المرأة الكردية، في فترة عززت فيها الإدارة الكردية بشمال شرق سوريا دمج النساء في المؤسسات السياسية والأمنية. واليوم، يخشين ليس فقط من تفكيك الإطار الذي عملن ضمنه، بل أيضاً من فقدان المكانة الاجتماعية والعسكرية التي انتزعتها النساء على مدار السنوات الماضية.\n\nوكما تلخص إحدى المقاتلات الشابات (20 عاماً) جوهر هذا التحدي قائلة: \"دائماً ما يُنظر إلى النساء على أنهن ضعيفات، لكن النساء لا يستمددن قوتهن من الرجال، ولا من الدولة\".\n\nتسلمت قوى الأمن الداخلي السورية اليوم الثلاثاء معسكر الطلائع في الحسكة شمال شرقي البلاد من \"قسد\"، في إطار إعادة بسط مؤسسات الدولة وتنفيذ اتفاق دمج القوات الكردية.\n\nوصف توم باراك، السفير الأمريكي في تركيا والمبعوث الأمريكي الخاص إلى سوريا والعراق، اتفاق دمج قوات سوريا الديمقراطية في مؤسسات الدولة السورية بـ\"الحدث التاريخي بكل المقاييس\".\n\nأعلن قائد \"قوات سوريا الديمقراطية\" مظلوم عبدي الدمج العسكري والأمني والإداري بالدولة السورية وعن بدء مرحلة جديدة عنوانها مواصلة العمل السياسي لتثبيت حقوق الكرد في الدستور السوري."}, {"guid": "https://arabic.rt.com/sport/1829058-%D9%85%D8%AF%D8%B1%D8%A8-%D8%A8%D8%B1%D8%B4%D9%84%D9%88%D9%86%D8%A9-%D9%8A%D9%83%D8%B4%D9%81-%D8%B7%D8%A8%D9%8A%D8%B9%D8%A9-%D8%A5%D8%B5%D8%A7%D8%A8%D8%A9-%D9%84%D8%A7%D9%85%D9%8A%D9%86-%D8%AC%D9%85%D8%A7%D9%84-%D9%88%D9%85%D9%88%D9%82%D9%81%D9%87-%D9%85%D9%86-%D9%85%D9%88%D9%82%D8%B9%D8%A9-%D9%81%D8%A7%D9%84%D9%86%D8%B3%D9%8A%D8%A7/", "title": "مدرب برشلونة يكشف طبيعة إصابة لامين جمال وموقفه من موقعة فالنسيا", "summary": "يتجه مدرب برشلونة هانسي فليك لاتخاذ قرار حاسم في اللحظات الأخيرة بشأن مشاركة لامين جمال أمام فالنسيا بالدوري الإسباني، عقب غياب النجم الشاب عن المران الأخير لـ\"البارسا\".", "link": "https://arabic.rt.com/sport/1829058-%D9%85%D8%AF%D8%B1%D8%A8-%D8%A8%D8%B1%D8%B4%D9%84%D9%88%D9%86%D8%A9-%D9%8A%D9%83%D8%B4%D9%81-%D8%B7%D8%A8%D9%8A%D8%B9%D8%A9-%D8%A5%D8%B5%D8%A7%D8%A8%D8%A9-%D9%84%D8%A7%D9%85%D9%8A%D9%86-%D8%AC%D9%85%D8%A7%D9%84-%D9%88%D9%85%D9%88%D9%82%D9%81%D9%87-%D9%85%D9%86-%D9%85%D9%88%D9%82%D8%B9%D8%A9-%D9%81%D8%A7%D9%84%D9%86%D8%B3%D9%8A%D8%A7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c1f084c59b7108277a2cb.png", "category": "رياضة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788609742, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nيتجه مدرب برشلونة هانسي فليك لاتخاذ قرار حاسم في اللحظات الأخيرة بشأن مشاركة لامين جمال أمام فالنسيا بالدوري الإسباني، عقب غياب النجم الشاب عن المران الأخير لـ\"البارسا\".\n\nوقال فليك في مؤتمر صحفي عشية مواجهة فالنسيا المقررة غدا الأحد لحساب المرحلة الرابعة من الدوري الإسباني: \"تدرب لامين بشكل منفصل. حالته جيدة. سيسافر معنا إلى فالنسا. سنرى ما سيحدث\".\n\nوأضاف: \"كان يعاني من ألم نتيجة إصابة طفيفة، ويتدرب بشكل منفصل، لكنه يقول إنه بخير ويمكنه اللعب غدا\".\n\nوتابع المدرب الألماني: \"سنتخذ القرار. لا أعرف ما إذا كان سيحصل على راحة أم لا. إنه يرغب في اللعب. لا يفضل التدريب بشكل منفصل. حالته البدنية ممتازة\".\n\nوأكمل: \"حالته النفسية ومعنوياته في تحسن. في المباراة الأخيرة، كان أداؤه رائعا. بالنسبة له، اللعب أفضل من التدريب\".\n\nتلقى الدولي الإسباني لامين جمال لاعب الفريق الأول لكرة القدم بنادي برشلونة نبأ سارا قبل لقاء فالنسيا ضمن منافسات الدوري الإسباني."}, {"guid": "CBMiTEFVX3lxTE1mWVpKZE1Gd09RTVFKcVRqSXlMbXJpQ3ZXbUtZd3ROT01pQ3k2RHQ3b28xd3NDc0JJNGQzOHkxbFZhM1JJVF9fRzc4bUE", "title": "الأمم المتحدة: نعمل مع العراق لتنويع الاقتصاد ومكافحة الفساد - وكالة الانباء العراقية (واع)", "summary": "الأمم المتحدة: نعمل مع العراق لتنويع الاقتصاد ومكافحة الفساد &nbsp;&nbsp; وكالة الانباء العراقية (واع)", "link": "https://news.google.com/rss/articles/CBMiTEFVX3lxTE1mWVpKZE1Gd09RTVFKcVRqSXlMbXJpQ3ZXbUtZd3ROT01pQ3k2RHQ3b28xd3NDc0JJNGQzOHkxbFZhM1JJVF9fRzc4bUE?oc=5", "image": "", "category": "اقتصاد", "source_id": "ina", "source_name": "الوكالة العراقية (العراق)", "source_cat": "وكالة رسمية", "published": 1788609634, "detail": ""}, {"guid": "https://arabic.rt.com/world/1829054-%D8%A8%D8%B9%D8%AF-%D8%B1%D9%  الذي مثل الادعاء في القضية المرفوعة ضد كاثوليكوس عموم الأرمن غاريغين الثاني و6 أساقفة قد استقال من منصبه.\n\nووفقا للقناة التلفزيونية فإن غالستيان لم يرغب في البداية بتولي القضية خشية من عواقب وخيمة على سمعته.\n\nوأشار مصدر إلى أنه تم إبلاغ المدعي العام بأن القضية لن تصل إلى المحاكمة وسيتم رفضها خلال التحقيق الأولي.\n\nوذكرت القناة أن غالستيان اضطر لاحقا للاختيار بين المشاركة في المحاكمة كمدع عام أو الاستقالة، فاختار الاستقالة.\n\nوبحسب القناة الخامسة فإن نائب المدعي العام الأرميني آرام أراميان سيمثل الادعاء في القضية.\n\nوأكد مكتب المدعي العام استقالة غالستيان، لكنه ذكر أنها لا علاقة لها بقضية كاثوليكوس عموم الأرمن.\n\nوقد حذا المدعي العام غالستيان حذو ثلاثة قضاة رفضوا النظر في القضية المرفوعة ضد الكاثوليكوس والأساقفة.\n\nوبدأت لجنة التحقيق الأرمينية إجراءات جنائية عقب قرار غاريغين الثاني بتجريد الأسقف جيفورك سارويان (اسمه العادي أرمان سارويان) من رتبته الكهنوتية، والذي دعم السلطات وسط الصراع مع الكنيسة الرسولية الأرمنية.\n\nفي تصعيد غير مسبوق بين السلطات السياسية والدينية، أدرج حزب \"العقد المدني\" الذي يتزعمه رئيس الوزراء نيكول باشينيان، بندا صريحا في برنامجه الحكومي يقضي بإقالة كاثوليكوس عموم الأرمن.\n\nأدان رجال الدين في أبرشية روسيا وناخيتشفان الجديدة التابعة للكنيسة الأرمنية الرسولية حملة السلطات الأرمنية المناهضة للكنيسة، معربين عن دعمهم لكاثوليكوس عموم الأرمن غاريغين الثاني.\n\nقال المحامي آرا زوهرابيان، إن سلطات أرمينيا أوقفت شقيق وابن شقيق بطريرك الكنيسة الأرمنية الكاثوليكية غاركين الثاني، بتهم واهية لاتشكل مخالفة أو جريمة، بحسب قوله"}, {"guid": "ca521850-a91f-11f1-9a44-9b25db91abcb", "title": "حزب إصلاح المملكة المتحدة يعقد مؤتمره على وقع فضيحة جديدة", "summary": "سعى زعيم اليمين المتطرف البريطاني نايجل فاراج إلى التقليل من شأن فضيحة التبرعات الجديدة التي أثارها تحقيق إعلامي استقصائي وطغت على المؤتمر السنوي لحزبه \"إصلاح المملكة المتحدة\" الجمعة. وكان فاراج يأمل من خلال المؤتمر في تجاوز الجدل المحيط بهدايا مالية تلقاها من خلال توضيح سياسات حزبه إذا تسنى له تشكي", "link": "https://www.france24.com/ar/%D9%81%D9%8A%D8%AF%D9%8A%D9%88/20260905-%D8%AD%D8%B2%D تهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nقضت محكمة جنايات القاهرة بالإعدام شنقا على المنتجة سارة خليفة و12 متهما آخرين في قضية جلب وتصنيع والاتجار بالمواد المخدرة والسجن المشدد 3 سنوات في قضية هتك عرض شاب داخل مسكنها.\n\nوجاء الحكم في القضيتين بعد أشهر من التحقيقات والمحاكمات التي أثارت اهتماما واسعا، إذ واجهت سارة خليفة اتهامات جنائية منفصلة تتعلق بالمخدرات من جهة، واحتجاز شاب والتعدي عليه وهتك عرضه وتصويره داخل مسكنها من جهة أخرى.\n\nوفي قضية المخدرات كانت محكمة جنايات القاهرة قد أحالت في أغسطس الماضي أوراق سارة خليفة و12 متهما آخرين إلى مفتي الجمهورية لاستطلاع الرأي الشرعي بشأن عقوبة الإعدام، وحددت جلسة 5 سبتمبر للنطق بالحكم، بينما ضمت القضية في إجماليها 28 متهما.\n\nوتعود القضية إلى تحقيقات النيابة العامة التي اتهمت سارة خليفة وآخرين بالانضمام إلى تشكيل إجرامي تخصص في جلب المواد الخام المستخدمة في تصنيع المواد المخدرة، وتصنيعها والاتجار بها داخل مصر، إلى جانب اتهامات أخرى شملتها أوراق القضية.\n\nأما القضية الثانية فتتعلق باتهام سارة خليفة وآخرين باحتجاز شاب، قيل إنه كان يعمل سائقا لها، والتعدي عليه وهتك عرضه وتصويره داخل غرفة نومها في مسكنها، وهي الواقعة التي ظهرت تفاصيلها خلال التحقيقات المرتبطة بقضية المخدرات.\n\nوبحسب ما ورد في التحقيقات، عُثر على مقاطع مصورة داخل هاتف سارة خليفة، تضمنت مشاهد للاعتداء على الشاب وتصويره عاريًا، فيما تمسكت هيئة الدفاع خلال المحاكمة بعدد من الدفوع، من بينها الطعن على إجراءات التفتيش وفحص الهاتف والأدلة الرقمية والمقاطع المصورة.\n\nوكانت المحكمة قد مدت أجل النطق بالحكم في قضية هتك العرض إلى جلسة اليوم، بالتزامن مع الموعد المحدد للحكم في قضية المخدرات، ليصبح 5 سبتمبر محطة حاسمة في القضيتين المنفصلتين.\n\nكشفت هيئة الأرصاد الجوية المصرية أن ظاهرة \"النينيو\" قد تؤثر على أنماط الطقس في مصر، خاصة خلال نهاية الخريف وفصل الشتاء، وفقا لتوقيتها وطبيعة تأثيرها.\n\nتعرض الفنان المصري بهاء سلطان لحادث سير على طريق وادي النطرون الصحراوي في مصر، ما أسفر عن إصابته ونقله إلى مستشفى العلمين لإجراء الفحوصات الطبية اللازمة."}, {"guid": "https://arabic.rt.com/culture/1829051-%D9%82%D9%86%D8%A7%D8%A9-rt-%D8%AA%D8%B9%D8%B1%D8%B6-%D9%81%D9%8A%D9%84%D9%85-%D8%A3%D8%B1%D8%B6-%D8%A7%D9%84%D9%84%D8%A8%D8%A7%D9%86-%D9%86%D8%B3%D8%AE%D8%A9-%D8%B1%D9%88%D8%B3%D9%8A%D8%A9-%D9%81%D9%8A-%D9%82%D8%A7%D8%B2%D8%A7%D9%86/", "title": "\"RT\" تعرض النسخة الروسية من فيلم \"أرض اللبان\" في قازان", "summary": "في إطار فعاليات يوم السينما العربية ضمن مهرجان قازان السينمائي الدولي \"ألتين منبر\"، قدّمت القناة التلفزيونية RT العرض الأول باللغة الروسية للفيلم الوثائقي \"أرض اللبان\".", "link": "https://arabic.rt.com/culture/1829051-%D9%82%D9%86%D8%A7%D8%A9-rt-%D8%AA%D8%B9%D8%B1%D8%B6-%D9%81%D9%8A%D9%84%D9%85-%D8%A3%D8%B1%D8%B6-%D8%A7%D9%84%D9%84%D8%A8%D8%A7%D9%86-%D9%86%D8%B3%D8%AE%D8%A9-%D8%B1%D9%88%D8%B3%D9%8A%D8%A9-%D9%81%D9%8A-%D9%82%D8%A7%D8%B2%D8%A7%D9%86/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c189142360443f45d096a.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788608710, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nفي إطار فعاليات يوم السينما العربية ضمن مهرجان قازان السينمائي الدولي \"ألتين منبر\"، قدّمت القناة التلفزيونية RT العرض الأول باللغة الروسية للفيلم الوثائقي \"أرض اللبان\".\n\nوجرى العرض في الخامس من سبتمبر في دار السينما \"مير\"، وشهد تفاعلا كبيرا من الحاضرين الذين أتيحت لهم أيضا فرصة زيارة معرض الصور الفوتوغرافية المصاحب، والذي نظّمته قناة RT Arabic لاستعراض أبرز اللقطات والمشاهد الجمالية للفيلم. وحققت النسخة الناطقة بالروسية نجاحا ملحوظا في أول ظهور لها أمام الجمهور المحلي بعد النجاح الكبير للنسخة العربي في مدينة صلالة.\n\nوعقب انتهاء العرض، عُقدت جلسة حوارية ولقاء إبداعي مفتوح بين الجمهور والمخرج كريم نجيب، حيث ناقش الحضور تفاصيل صناعة الفيلم، وكواليس التصوير في سلطنة عمان، والروابط الثقافية والعلمية التي يبرزها العمل. ويتناول فيلم \"أرض اللبان\" (إخراج كريم نجيب، ومنتج تنفيذي وكاتبة سيناريو أنيسة مراد) شجرة اللبان، التي تظل رمزاً للتراث الثقافي والعلمي والاقتصادي لعمان عبر القرون. كما يتضمن الفيلم محورا خاصا حول عمل المختبرات الروسية التي تدرس الخصائص البيو كيميائية الفريدة للبان العماني لأغراض علاجية.\n\nويُذكر أن الفيلم، الذي نال ترشيحا سابقا في مهرجان ظفار السينمائي الدولي، بات رسميا من بين الأفلام المرشحة لنيل جوائز مهرجان قازان السينمائي الحالي. كما أعلنت إدارة القناة أنه من المقرّر عرض الفيلم واسع النطاق على شاشات ومنصات تلفزيون RT في منتصف سبتمبر 2026.\n\nويُعتبر فيلم \"أرض اللبان\" خطوة عملية هامة في إطار مذكرة التعاون بين سلطنة عمان وقناة RT Arabic، والتي تم توقيعها في عام 2025 في الكرملين بحضور رئيسي الدولتين، حيث وقعتها رئيسة تحرير RT مارغاريتا سيمونيان وسفير عمان لدى روسيا الاتحادية حمود سالم آل تويه.\n\nتستضيف عاصمة جمهورية تتارستان، في الفترة من 4 إلى 9 سبتمبر الجاري، فعاليات الدورة الثانية والعشرين من مهرجان قازان السينمائي الدولي \"ألتين منبار\" (المنبر الذهبي).\n\nتستعد قناة RT لعرض الفيلم الوثائقي \"أرض اللبان\" أمام الجمهور الروسي لأول مرة، ضمن فعاليات يوم السينما العربية في مهرجان قازان الدولي للسينما \"ألطين منبر\".\n\nأعلن الرئيس الروسي فلاديمير بوتين عن استعداد بلاده لاستضافة النسخة السابعة من ألعاب البدو العالمية عام 2028، على أن تقام المنافسات في مدينة قازان عاصمة جمهورية تترستان الروسية."}, {"guid": "https://arabic.rt.com/sport/1829047-%D8%B1%D9%82%D9%85-%D9%82%D9%8A%D8%A7%D8%B3%D9%8A-%D9%85%D9%85%D9%8A%D8%B2-%D9%8A%D9%86%D8%AA%D8%B8%D8%B1-%D8%B1%D9%88%D8%AF% قاء بمعنويات مرتفعة بعدما حقق فوزا مثيرا على رايو فاليكانو بنتيجة 5-2 في المباراة التي جمعتهما على ملعب \"سبوتيفاي كامب نو\" ليواصل الفريق مشواره في منافسات الدوري الإسباني.\n\nوتحظى مواجهة فالنسيا بأهمية خاصة بالنسبة إلى رودري إذ سيكون اللاعب الإسباني على موعد مع رقم مميز في مسيرته ببطولة \"لا ليغا\" حال مشاركته في المباراة سواء ضمن التشكيل الأساسي أو كبديل.\n\nبقميص برشلونة.. رودري يحتفل بمباراته رقم 100 في الليغا أمام فالنسيا pic.twitter.com/LLkzlRKnoR\n\nووفقا لما أوردته صحيفة \"سبورت\" الإسبانية فإن مباراة الأحد ستكون رقم 100 لرودري في بطولة الدوري الإسباني بعدما خاض 99 مباراة حتى الآن بقميص ثلاثة أندية.\n\nوخاض رودري 63 مباراة في الدوري الإسباني مع فياريال بينما شارك في 34 مباراة بقميص أتلتيكو مدريد إلى جانب مباراتين مع برشلونة ليصبح على بعد مباراة واحدة فقط من الوصول إلى حاجز الـ100 مشاركة في المسابقة.\n\nويأمل لاعب الوسط الإسباني في الاحتفال بهذا الإنجاز من خلال مساعدة برشلونة على تحقيق الفوز أمام فالنسيا ومواصلة الفريق الكتالوني نتائجه القوية خلال الموسم الجديد.\n\nتلقى الدولي الإسباني لامين جمال لاعب الفريق الأول لكرة القدم بنادي برشلونة نبأ سارا قبل لقاء فالنسيا ضمن منافسات الدوري الإسباني.\n\nأعلن الأرجنتيني دييغو سيميوني المدير الفني لفريق أتلتيكو مدريد عن تطور مهم بشأن موقف مواطنه جوليان ألفاريز من المشاركة مع الفريق خلال المباراة المقبلة أمام أتلتيك بلباو."}, {"guid": "https://arabic.rt.com/funny/1829050-%D8%B7%D8%AD%D8%A7%D9%84%D8%A8-%D9%85%D8%B5%D8%B1%D9%8A%D8%A9-%D8%AA%D8%B1%D8%A8%D9%83-%D9%85%D8%AD%D8%B7%D8%A7%D8%AA-%D8%AA%D8%AD%D9%84%D9%8A%D8%A9-%D8%A7%D9%84%D9%85%D9%8A%D8%A7%D9%87-%D9%81%D9%8A-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84-%D9%88%D9%86%D9%82%D9%8A%D8%A8-%D8%A7%D9%84%D9%81%D9%84%D8%A7%D8%AD%D9%8A%D9%86-%D9%8A%D9%83%D8%B4%D9%81-%D8%A7%D9%84%D8%B3%D8%B1/", "title": "\"طحالب مصرية\" تربك محطات تحلية المياه في إسرائيل.. ونقيب الفلاحين يكشف السر", "summary": "وصف نقيب الفلاحين في مصر حسين أبو صدام انتشار الطحالب على السواحل الإسرائيلية بأنه ظاهرة مرتبطة بحركة مياه البحر المتوسط والتغيرات المناخية، مشيرا إلى تأثيرها على محطات التحلية.", "link": "https://arabic.rt.com/funny/1829050-%D8%B7%D8%AD%D8%A7%D9%84%D8%A8-%D9%85%D8%B5%D8%B1%D9%8A%D8%A9-%D8%AA%D8%B1%D8%A8%D9%83-%D9%85%D8%AD%D8%B7%D8%A7%D8%AA-%D8%AA%D8%AD%D9%84%D9%8A%D8%A9-%D8%A7%D9%84%D9%85%D9%8A%D8%A7%D9%87-%D9%81%D9%8A-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84-%D9%88%D9%86%D9%82%D9%8A%D8%A8-%D8%A7%D9%84%D9%81%D9%84%D8%A7%D8%AD%D9%8A%D9%86-%D9%8A%D9%83%D8%B4%D9%81-%D8%A7%D9%84%D8%B3%D8%B1/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c18fd4c59b7120a46d436.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788607932, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nوصف نقيب الفلاحين في مصر حسين أبو صدام انتشار الطحالب على السواحل الإسرائيلية بأنه ظاهرة مرتبطة بحركة مياه البحر المتوسط والتغيرات المناخية، مشيرا إلى تأثيرها على محطات التحلية.\n\nوقال حسين أبو صدام الخبير الزراعي ونقيب الفلاحين في مصر إن انتشار الطحالب الدقيقة أدى إلى ارتفاع عكارة مياه البحر قبالة السواحل الإسرائيلية، ما تسبب في مشكلات فنية داخل عدد من محطات تحلية المياه.\n\nوأوضح أن صغر حجم بعض الطحالب والعوالق النباتية يسمح لها بالنفاذ عبر مراحل الترشيح الأولية، وهو ما يمكن أن يؤدي إلى انسداد أجزاء من منظومة المعالجة والتأثير في كفاءة محطات التحلية، وقد يتسبب في توقفها عن العمل مؤقتا.\n\nوكانت تقارير إسرائيلية قد تحدثت عن اضطراب في عمل عدد من محطات تحلية مياه البحر المتوسط، وربط مسؤولون إسرائيليون الظاهرة بانتشار الطحالب الدقيقة، مع ترجيح أن تكون بعض هذه الطحالب قد جاءت من منطقة دلتا النيل وانتقلت شمالا بفعل حركة المياه والتيارات البحرية.\n\nوأشار أبو صدام إلى أن ارتفاع درجات الحرارة والتغيرات المناخية قد يسهمان في زيادة انتشار الطحالب، موضحا أن ارتفاع حرارة المياه يوفر ظروفًا أكثر ملاءمة لنمو بعض أنواع الطحالب والعوالق النباتية.\n\nوأضاف أن انتقال هذه الكائنات البحرية مع التيارات المائية يمكن أن ينقلها من مناطق إلى أخرى عبر البحر المتوسط، وبالتالي فإن ظهورها على السواحل الإسرائيلية لا يعني بالضرورة وجود مصدر محلي لها.\n\nوتكمن المشكلة بالنسبة إلى محطات التحلية في ارتفاع عكارة مياه البحر، إذ تحتاج المحطات إلى مراحل متعددة لمعالجة المياه قبل وصولها إلى الأغشية المستخدمة في عملية التحلية. ويمكن للزيادة الكبيرة في الطحالب والعوالق أن ترفع الضغط على أنظمة الترشيح والمعالجة وتؤثر في كفاءة التشغيل.\n\nوتكتسب هذه التطورات أهمية خاصة بالنسبة إلى إسرائيل، التي تعتمد بصورة كبيرة على تحلية مياه البحر لتوفير جزء أساسي من احتياجاتها المائية. وأدى اضطراب عمل عدد من المحطات إلى زيادة الضغوط على مصادر المياه الأخرى، خصوصًا في قطاع الزراعة.\n\nوفي محاولة للتعامل مع المشكلة اتجهت السلطات الإسرائيلية إلى اتخاذ إجراءات للحد من انتشار الطحالب وتحسين ظروف تشغيل محطات التحلية، وسط نقاش بشأن الآثار البيئية المحتملة لبعض وسائل المكافحة المستخدمة في البحر.\n\nوحذر أبو صدام من استخدام المواد الكيميائية بصورة عشوائية لمواجهة الطحالب، مؤكدا أن أي تدخل في البيئة البحرية يجب أن يستند إلى دراسات علمية دقيقة، لأن المواد المستخدمة لمكافحة الطحالب قد تؤثر في الأسماك والكائنات البحرية والتوازن البيئي.\n\nوأكد أن انتشار الطحالب ظاهرة بيئية تحتاج إلى تحديد أنواعها ومصادرها والعوامل التي ساعدت على انتشارها قبل اختيار وسائل التعامل معها، مشددا على أهمية الجمع بين الحلول الفنية لمحطات التحلية والحفاظ على البيئة البحرية.\n\nبحث وزير الخارجية المصري بدر عبد العاطي مع نظيره العماني بدر بن حمد البوسعيدي مستجدات الأوضاع الإقليمية والجهود الرامية لاحتواء التوتر الراهن واستعادة الهدوء والاستقرار بالمنطقة.\n\nأكد الخبير العسكري المصري والمستشار بكلية القادة والأركان اللواء أسامة كبير أن اختيار روسيا لمصر للكشف عن منظومات عسكرية حديثة يعكس الثقة في مكانة القاهرة وقوة معرضها الدولي."}, {"guid": "ce2d0b22-a91c-11f1-b879-498e4f3d2836", "title": "السلطات التونسية توقف صحافيا قبيل مشاركته في برنامج إذاعي", "summary": "أوقفت السلطات التونسية الصحافي محمد اليوسفي الجمعة، لدى وصوله إلى مقر إذاعة محلية للمشاركة ضيفا في أحد برامجها، وفق ما أفاد مقدم البرنامج ورئيس نقابة الصحافيين التونسيين. وأعربت منظمات معنية بحرية الصحافة عن قلقها إزاء وضع الحريات المدنية في تونس، حيث واجه صحافيون ومحامون وشخصيات معارضة ونشطاء، الاع", "link": "https://www.france24.com/ar/%D9%81%D9%8A%D8%AF%D9%8A%D9%88/20260905-%D8%A7%D9%84%D8%B3%D9%84%D8%B7%D8%A7%D8%AA-%D8%A7%D9%84%D8%AA%D9%88%D9%86%D8%B3%D9%8A%D8%A9-%D8%AA%D9%88%D9%82%D9%81-%D8%B5%D8%AD%D8%A7%D9%81%D9%8A%D8%A7-%D9%82%D8%A8%D9%8A%D9%84-%D9%85%D8%B4%D8%A7%D8%B1%D9%83%D8%AA%D9%87-%D9%81%D9%8A-%D8%A8%D8%B1%D9%86%D8%A7%D9%85%D8%AC-%D8%A5%D8%B0%D8%A7%D8%B9%D9%8A", "image": "https://s.france24.com/media/display/c9b25624-a91c-11f1-bf47-005056bfb2b6/w:1024/p:16x9/AR-20260905-131739-131912-CS.jpg", "category": "أخبار", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788607914, "detail": ""}, {"guid": "CBMi-AJBVV95cUxOZjJGMkw5VThCWXBPYWZtenZmdVE1N0lOU0Z0LTFONDRfTmFqYmF2em9lY05ZczcxVmhSY0RORTVFN0loMDlXRDdKY0ZWTEFISXBQMVZXRnpGTHBGU2djUEFyQ1pXbTdOamd3VFkyYmU1LWpqbVo3QjRsTllvMWRETTF6bDdrZGdGcUxweWYtMExlcGpjdHI2cTg1OGVUZmRPNFhkYUV6U1hRb1ZkQi1INGFUb1NORjVsY3p5ZllTMWZIaE9TUzdJREJjVkoxVkF3bk9BdHlNUTBUMkdNVi0tYU53eFhYZEw4dUtYR0JUMF9oVFdkRm5TTGJ6YVFRMWJkTlhvaUlZaUZDX0xnY29vLUJMSlNvSTVOS2ZUUnNMZ2hhMWhTSVNGLXZDWWN0NXlnekc2Vnh2dG9QaTcydkpVQmZXZ3BzQmM4aDZnYXlvT2ZvYUNScC15ZW56QUdlMHc1RVdQM2N2UElVVWd2bnpod0k3YlFOb1Jw", "title": "شخبوط بن نهيان يتسلّم دعوة لرئيس الدولة من رئيس سيراليون - وكالة وام", "summary": "شخبوط بن نهيان يتسلّم دعوة لرئيس الدولة من رئيس سيراليون &nbsp;&nbsp; وكالة وام", "link": "https://news.google.com/rss/articles/CBMi-AJBVV95cUxOZjJGMkw5VThCWXBPYWZtenZmdVE1N0lOU0Z0LTFONDRfTmFqYmF2em9lY05ZczcxVmhSY0RO
