النتيجة، توقفت سلسلة النصر عند أربعة انتصارات متتالية، ليتجمد رصيده عند 12 نقطة في المركز الثاني، أمامه الهلال في الصدارة بـ15 نقطة.\n\nأما الاتحاد بطل الدوري في 2025، فقد حافظ على سجله خاليا من الهزائم، ورفع رصيده إلى 11 نقطة في المركز الرابع.\n\nحسم اتحاد جدة لقاء الكلاسيكو السعودي لصالحه بالفوز على ضيفه النصر بنتيجة 2-1 في قمة منافسات الجولة الخامسة من دوري روشن للمحترفين مساء السبت."}, {"guid": "https://arabic.rt.com/world/1829179-nyt-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D8%AA%D8%AE%D8%B7%D8%B7-%D9%84%D8%AA%D9%85%D8%AF%D9%8A%D8%AF-%D8%B5%D8%B1%D8%A7%D8%B9%D9%87%D8%A7-%D9%85%D8%B9-%D9%88%D8%A7%D8%B4%D9%86%D8%B7%D9%86-%D9%84%D8%A3%D8%B4%D9%87%D8%B1-%D9%82%D8%A7%D8%AF%D9%85%D8%A9-%D9%88%D8%AA%D8%AF%D8%B1%D8%B3-%D8%AE%D9%8A%D8%A7%D8%B1%D8%A7%D8%AA-%D8%A7%D9%84%D8%AA%D8%B5%D8%B9%D9%8A%D8%AF/", "title": "NYT: إيران تخطط لإطالة أمد الصراع مع واشنطن لأشهر قادمة وتدرس خيارات التصعيد", "summary": "أفادت صحيفة \"نيويورك تايمز\" نقلا عن تقارير استخباراتية أمريكية، بأن إيران باتت أكثر جرأة خلال ضرب قواعد أمريكية بالشرق الأوسط، وتخطط لمواصلة عملياتها العسكرية لعدة أشهر.", "link": "https://arabic.rt.com/world/1829179-nyt-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D8%AA%D8%AE%D8%B7%D8%B7-%D9%84%D8%AA%D9%85%D8%AF%D9%8A%D8%AF-%D8%B5%D8%B1%D8%A7%D8%B9%D9%87%D8%A7-%D9%85%D8%B9-%D9%88%D8%A7%D8%B4%D9%86%D8%B7%D9%86-%D9%84%D8%A3%D8%B4%D9%87%D8%B1-%D9%82%D8%A7%D8%AF%D9%85%D8%A9-%D9%88%D8%AA%D8%AF%D8%B1%D8%B3-%D8%AE%D9%8A%D8%A7%D8%B1%D8%A7%D8%AA-%D8%A7%D9%84%D8%AA%D8%B5%D8%B9%D9%8A%D8%AF/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c85494c59b759282fed0e.png", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788646711, "detail": "أفادت صحيفة \"نيويورك تايمز\" نقلا عن تقارير استخباراتية أمريكية، بأن إيران باتت أكثر جرأة خلال ضرب قواعد أمريكية بالشرق الأوسط، وتخطط لمواصلة عملياتها العسكرية لعدة أشهر.\n\nووفقا لمعلومات الصحيفة، تُشير البيانات الاستخباراتية إلى أن الحكومة المحافظة في إيران قد تدرس خيار تصعيد واسع النطاق. ونقلت الصحيفة عن مصادر مطلعة على هذه البيانات، أن طهران باتت أكثر إدراكا لنقاط تفوقها العسكري، وأكثر ثقة في تقييم قدراتها الذاتية.\n\nارتفاع أسعار البنزين يبدد فرحة الأمريكيين بعطلة عيد العمال ويرى خبراء ومصادر \"نيويورك تايمز\"، أن هذه البيانات تشير إلى صعوبة التوصل إلى أي اتفاق في المستقبل القريب. كما يعتقد بعض المسؤولين الأمريكيين، بحسب الصحيفة، أن إيران تسعى إلى تطويق الرئيس الأمريكي دونالد ترامب بالأزمات السياسية وعرقلة إمدادات الطاقة قبيل انتخابات التجديد النصفي للكونغرس.\n\nوتفيد تقارير الاستخبارات الأمريكية وفق ما نشرته صحيفة The New York Times بأن إيران تعتزم مواصلة النزاع لعدة أشهر بهدف إحراج الإدارة الأمريكية قبيل انتخابات التجديد النصفي. كما تفيد التقديرات بأن طهران قد تلجأ إلى تصعيد عسكري ميداني وهجمات سيبرانية تستهدف البنى التحتية الحيوية داخل الولايات المتحدة.\n\nفي وقت سابق، صرّح إبراهيم ذو الفقاري، المتحدث باسم قيادة خاتم الأنبياء المركزية، بأن إيران ستُكثّف ضرباتها ضد السفن الحربية الأمريكية إذا لم تُوقف الولايات المتحدة هجماتها على السفن الإيرانية. كما أكّد أن طهران لا تستبعد إمكانية توسيع نطاق هذه الهجمات.\n\nأعلن الحرس الثوري الإيراني مهاجمة زورق أمريكي مسير كان يعتزم دخول المنطقة المحمية في مضيق هرمز.\n\nوصف وزير الدفاع الإيراني بالوكالة العميد مجيد ابن الرضا الرئيس الأمريكي دونالد ترامب بـ\"كثير الثرثرة\"، وذلك ردا على تصريحاته حول مضيق هرمز.\n\nأكد الرئيس الأمريكي دونالد ترامب أن مضيق هرمز لن يكون له في المستقبل نفس الأهمية لإمدادات النفط العالمية كما كان سابقا، وذلك على خلفية زيادة إنتاج وتصدير النفط من الولايات المتحدة."}, {"guid": "https://arabic.rt.com/prg/%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%8A%D8%A8%D8%AD%D8%AB-%D9%85%D8%B9-%D9%85%D8%A8%D8%B9%D9%88%D8%AB%D9%8A-%D8%AA%D8%B1%D8%A7%D9%85%D8%A8-%D8%A3%D8%B2%D9%85%D8%A9-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7-1829181/%D8%A8%D8%A7%D9%84%D8%AA%D9%81%D8%A7%D8%B5%D9%8A%D9%84/", "title": "بوتين يبحث مع مبعوثي ترامب أزمة أوكرانيا", "summary": "", "link": "https://arabic.rt.com/prg/%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%8A%D8%A8%D8%AD%D8%AB-%D9%85%D8%B9-%D9%85%D8%A8%D8%B9%D9%88%D8%AB%D9%8A-%D8%AA%D8%B1%D8%A7%D9%85%D8%A8-%D8%A3%D8%B2%D9%85%D8%A9-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7-1829181/%D8%A8%D8%A7%D9%84%D8%AA%D9%81%D8%A7%D8%B5%D9%8A%D9%84/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c88bc4c59b758277c31a3.png", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788645971, "detail": "أجرى الرئيس الروسي فلاديمير بوتين مباحثات مع المبعوثين الأمريكيين جارد كوشنر وستيف ويتكوف اللذين وصلا إلى العاصمة الروسية موسكو في إطار جولة دبلوماسية جديدة تهدف إلى إحياء مفاوضات السلام المتعثرة، وإنهاء العمليات العسكرية بين روسيا وأوكرانيا، وقد دامت المباحثات بين الجانبين أكثر من 3 ساعات.. ووصف الرئيس الروسي في مستهل اللقاء المحادثات بالصعبة لكنه أشار إلى أن مثل هذه الاتصالات تفيد دائماً و أنه يعتزم مناقشة جميع جوانب الصراع الأوكراني، مشيداً بجهود ترامب المستمرة للتسوية، ومؤكداً أن مستوى الثقة بين موسكو والمبعوثين الأمريكيين مرتفع.. وكان الرئيس الأمريكي دونالد ترامب أعلن أنه أوفد ويتكوف وكوشنر في مهمة لإنجاز اتفاق سلام. وأشار إلى أن الولايات المتحدة تحمل \"مقترحاً جديداً وملموساً\" لإنهاء الحرب التي دخلت عامها الخامس، دون الإفصاح عن تفاصيله.. ومن المقرر أن ينتقل المبعوثان الأمريكيان مباشرة إلى العاصمة الأوكرانية كييف لعقد لقاء مع الرئيس الأوكراني المنتهية شرعيته فولوديمير زيلينسكي، وهي الزيارة الأولى لهما إلى أوكرانيا منذ عودة ترامب للبيت الأبيض.. وقد أقرت موسكو وقفا لإطلاق النار في أجواء كييف لمدة ثلاثة أيام لتأمين الزيارة الدبلوماسية.. بالتفاصيل نقرأ المواقف في مختلف العواصم المعنية بالصراع وماهي أفاق تحقيق السلام في أوكرانيا؟\n\nأكد الرئيس الروسي فلاديمير بوتين خلال لقائه المبعوثين الأمريكيين الخاصين ستيف ويتكوف وجاريد كوشنر، استمرار زعيمي روسيا والولايات المتحدة الحفاظ على اتصالاتهما الشخصية."}, {"guid": "https://arabic.rt.com/middle_east/1829183-%D9%82%D8%A7%D8%A2%D9%86%D9%8A-%D9%82%D9%88%D8%A9-%D8%A7%D9%84%D9%85%D9%82%D8%A7%D9%88%D9%85%D8%A9-%D9%88%D8%AD%D8%B2%D8%A8-%D8%A7%D9%84%D9%84%D9%87-%D8%B3%D8%AA%D8%A4%D8%AF%D9%8A-%D8%A8%D9%84%D8%A7-%D8%B4%D9%83-%D8%A5%D9%84%D9%89-%D8%A5%D8%B2%D8%A7%D9%84%D8%A9-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84-%D9%85%D9%86-%D8%A7%D9%84%D9%85%D9%86%D8%B7%D9%82%D8%A9/", "title": "قاآني: قوة المقاومة وحزب الله ستؤدي بلا شك إلى إزالة إسرائيل من المنطقة", "summary": "صرح قائد قوة القدس في الحرس الثوري الإيراني العميد إسماعيل قاآني، بأن القوة العملياتية والدفاعية للمقاومة وحزب الله ستؤدي بلا شك إلى إزالة إسرائيل من المنطقة.", "link": "https://arabic.rt.com/middle_east/1829183-%D9%82%D8%A7%D8%A2%D9%86%D9%8A-%D9%82%D9%88%D8%A9-%D8%A7%D9%84%D9%85%D9%82%D8%A7%D9%88%D9%85%D8%A9-%D9%88%D8%AD%D8%B2%D8%A8-%D8%A7%D9%84%D9%84%D9%87-%D8%B3%D8%AA%D8%A4%D8%AF%D9%8A-%D8%A8%D9%84%D8%A7-%D8%B4%D9%83-%D8%A5%D9%84%D9%89-%D8%A5%D8%B2%D8%A7%D9%84%D8%A9-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84-%D9%85%D9%86-%D8%A7%D9%84%D9%85%D9%86%D8%B7%D9%82%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c8967423604713e6c32de.jpg", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788645329, "detail": "صرح قائد قوة القدس في الحرس الثوري الإيراني العميد إسماعيل قاآني، بأن القوة العملياتية والدفاعية للمقاومة وحزب الله ستؤدي بلا شك إلى إزالة إسرائيل من المنطقة.\n\nوقال قاآني في تصريح صحفي: \"حزب الله لبنان شجرة باسقة ذات جذور عميقة وإلهية وشعبية وهو واقع لا يتغير في لبنان العزيز\".\n\nالجيش الإسرائيلي: أنهينا تطهير بنى حزب الله في مرتفعات علي الطاهر وأضاف قاآني: \"حزب الله سيضمن كل يوم عزة لبنان واستقلاله وهو ينمو ويزداد رفعة وفخرا أكثر من ذي قبل\".\n\nوختم قائلا: \"وضعت الأزمات العميقة والشاملة العسكرية والأمنية والسياسية والاقتصادية والأخلاقية إسرائيل على أعتاب الانهيار\".\n\nوكانت صحيفة \"نيويورك تايمز\" الأمريكية قد نقلت عن مسؤول في الحرس الثوري الإيراني أن ما بين 70 و100 من مقاتلي حزب الله حوصروا داخل أنفاق تلة \"علي الطاهر\" جنوب لبنان إلى جانب مستشارين عسكريين من فيلق القدس.\n\nأعلن الحرس الثوري الإيراني مهاجمة زورق أمريكي مسير كان يعتزم دخول المنطقة المحمية في مضيق هرمز.\n\nأعلنت العلاقات العامة للحرس الثوري الإيراني في بيان فجر اليوم الأحد، استهداف حاملة طائرات ومدمرة تابعتين للجيش الأمريكي.\n\nأعلن الجيش الإسرائيلي أنه هاجم أمس الجمعة عناصر وبنى تحتية تابعة لـ\"حزب الله\" في جنوب لبنان ردا على إطلاق مسيرة نحو قواته في المنطقة الأمنية.\n\nأعلن الجيش الإسرائيلي عن شن غارات ردا على إطلاق \"حزب الله\" اللبناني طائرة مسيّرة باتجاه قواته المتواجدة في المنطقة الأمنية مؤكدا اعتراض المسيرة دون وقوع إصابات.\n\nنقلت صحيفة \"نيويورك تايمز\" عن مسؤول في الحرس الثوري الإيراني أن ما بين 70 و100 من مقاتلي حزب الله إلى جانب مستشارين عسكريين من فيلق القدس حوصروا داخل أنفاق \"علي الطاهر\" جنوب لبنان.\n\nقال مسؤولون لـ\"رويترز\" إن إيران حذرت الولايات المتحدة من أنها سترد على أي هجوم إسرائيلي على تلة علي الطاهر في جنوب لبنان، حيث ​يتحصن عسكريون إيرانيون إلى جانب مقاتلي \"حزب الله\"."}, {"guid": "https://arabic.rt.com/culture/1829186-%D9%85%D9%88%D8%B1%D9%8A%D9%83%D8%B3-%D8%AF%D9%88%D8%B1-2026-%D8%A8%D9%8A%D8%B1%D9%88%D8%AA-%D8%AA%D8%AD%D8%AA%D9%81%D9%8A-%D8%A8%D9%86%D8%AC%D9%88%D9%85-%D8%A7%D9%84%D9%81%D9%86-%D8%A7%D9%84%D8%B9%D8%B1%D8%A8%D9%8A-%D9%81%D9%8A-%D9%84%D9%8A%D9%84%D8%A9-%D8%AD%D8%A7%D9%81%D9%84%D8%A9-%D8%A8%D8%A7%D9%84%D8%AC%D9%88%D8%A7%D8%A6%D8%B2/", "title": "\"موريكس دور 2026\".. بيروت تحتفي بنجوم الفن العربي في ليلة حافلة بالجوائز", "summary": "احتضنت العاصمة اللبنانية بيروت حفل جوائز \"موريكس دور 2026\" في دورته السادسة والعشرين، وسط حضور واسع لنجوم الفن اللبناني والعربي.", "link": "https://arabic.rt.com/culture/1829186-%D9%85%D9%88%D8%B1%D9%8A%D9%83%D8%B3-%D8%AF%D9%88%D8%B1-2026-%D8%A8%D9%8A%D8%B1%D9%88%D8%AA-%D8%AA%D8%AD%D8%AA%D9%81%D9%8A-%D8%A8%D9%86%D8%AC%D9%88%D9%85-%D8%A7%D9%84%D9%81%D9%86-%D8%A7%D9%84%D8%B9%D8%B1%D8%A8%D9%8A-%D9%81%D9%8A-%D9%84%D9%8A%D9%84%D8%A9-%D8%AD%D8%A7%D9%81%D9%84%D8%A9-%D8%A8%D8%A7%D9%84%D8%AC%D9%88%D8%A7%D8%A6%D8%B2/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c8b854c59b7578c0d2b64.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788644914, "detail": "احتضنت العاصمة اللبنانية بيروت حفل جوائز \"موريكس دور 2026\" في دورته السادسة والعشرين، وسط حضور واسع لنجوم الفن اللبناني والعربي.\n\nوحملت الدورة الحالية مزيجا من الأسماء التي صنعت حضورها على مدى عقود، ونجوما فرضوا أنفسهم في السنوات الأخيرة، فكانت الفنانة المصرية ليلى علوي في مقدمة المحتفى بهم، حيث نالت تكريما عن مجمل مسيرتها الفنية، معربة عن سعادتها بهذا التقدير الذي يستعيد مشوارا حافلا في السينما والتلفزيون.\n\nوامتدت مساحة التكريمات لتشمل أسماء بارزة من لبنان وسوريا ومصر، إذ احتُفي بالفنان والمخرج اللبناني جورج شلهوب تقديرا لمسيرته في التمثيل والإخراج، كما كُرّم السوبر ستار راغب علامة عن مشوار فني يمتد لأكثر من أربعة عقود، إلى جانب الفنانة ماري سليمان التي استُعيدت تجربتها الغنائية خلال الأمسية، حيث قدمت ميدلي من أشهر أغنياتها. وشملت قائمة المحتفى بهم أيضا الفنان ملحم زين، والممثل والمخرج منير معاصري عن مجمل مسيرته، والفنان نقولا دانيال تقديراً لمسيرته الفنية وتميزه في شخصية سليم ضمن مسلسل \"سلمى\".\n\nوحظيت الدراما السورية والعربية بحضور لافت ضمن التكريمات، مع الاحتفاء بالفنانة القديرة منى واصف، والنجم تيم حسن عن دوره في مسلسل \"مولانا\"، والفنان قصي خولي الذي حمل تكريمه إلى مساحة شخصية حين أهدى جائزته إلى ابنه. كما حضرت الفنانة نانسي خوري ضمن فئة الدراما المشتركة عن دور سلمى في مسلسل \"مولانا\".\n\nولم تغب الأسماء المصرية عن المشهد، إذ شملت التكريمات الفنانة مي عمر عن دورها في مسلسل \"الست موناليزا\"، ضمن فئة أفضل ممثلة عربية مصرية في الدراما المصرية، فيما حظيت الفنانة اللبنانية ماغي بوغصن باحتفاء عن دورها في مسرحية \"منتزه الخيران\" ودورها في مسلسل \"بالحرام\".\n\nكما كان للفنان اللبناني جورج خباز أكثر من محطة خلال الأمسية، إذ احتُفي به تقديرا لتجربته، إلى جانب حصوله على تكريم ضمن فئة الانتشار العالمي عن فيلم \"يونان\"، ليضيف إلى رصيده محطة جديدة في مسيرته الفنية.\n\nوعلى مستوى الجوائز، خطف مسلسل \"بالحرام\" جائزة أفضل مسلسل لبناني، وتسلم المنتج جمال سنان، صاحب شركة \"إيغل فيلمز\"، الجائزة عن العمل، فيما واصل المسلسل حضوره من خلال الجوائز الفردية، إذ حصل باسم مغنية على جائزة أفضل ممثل لبناني عن دور أول عن دوره في المسلسل.\n\nوفي المنافسة النسائية، ذهبت جائزة أفضل ممثلة لبنانية إلى رزان جمال، بينما حصدت كارمن بصيبص جائزة أفضل ممثلة لبنانية عن دور أول عن شخصية قدمتها في مسلسل \"ليل\".\n\nأما الموسيقى الدرامية، فكان لها حضورها من خلال فوز الفنانة فرح نخول بجائزة أفضل شارة مسلسل عن أغنية \"يا متعب قلبي\"، شارة مسلسل \"لوبي الغرام\"، لتؤكد الأغنية حضورها إلى جانب نجاح العمل الدرامي.\n\nوفي الغناء، سجل الفنان المصري أحمد سعد حضورا قويا بعدما حصد جائزتي النجم العربي والأغنية الضاربة عن أغنيته \"مكسرات\"، في واحدة من أبرز محطات الجوائز الغنائية خلال الأمسية.\n\nوشهدت بيروت خلال المناسبة تجمعا لافتا لنجوم الفن من لبنان وسوريا ومصر، بينهم باميلا الكيك، عبير نعمة، طلال مارديني، نور علي، جو طراد، ندى كوسا، كارمن بصيبص، إلى جانب ليلى علوي ومنى واصف وعدد من الأسماء التي حضرت لمشاركة زملائها هذه الليلة.\n\nوتولى الفنان معتصم النهار والإعلامية مايا أبو الحسن تقديم الدورة الحالية في تجربة تجمعهما للمرة الأولى، بعدما تولى الفنان والإعلامي وسام حنا تقديم النسخة السابقة منفردا، مع ظهور الإعلامية هيلدا خليفة خلال الأمسية.\n\nفي ظهوره الأول ضمن برنامج \"تحت الضغط\" مع الإعلامية ناديا الزعبي عبر قناة MBC، اختار الفنان السوري باسم ياخور أن يفتح أكثر من ملف، متحدثا بصراحة عن مسيرته وعلاقته بعدد من النجوم.\n\nيستعد الفنان عابد فهد للعودة إلى مواقع التصوير في سوريا بعد غياب نحو سبع سنوات من خلال مسلسل \"آدو وأولادو\"، الذي تتولى إنتاجه شركة \"غولدن لاين\".\n\nاختتم فريق مسلسل \"أعز الناس\" تصوير عمله في دمشق بعد إنجاز مشاهده كاملة لينتقل إلى مراحل المونتاج وما بعد الإنتاج، تمهيدا للكشف عن موعد عرضه والجهة التي ستتولى تقديمه للجمهور."}, {"guid": "https://arabic.rt.com/world/1829180-%D8%A8%D8%AA%D8%B1%D9%8A%D9%88%D8%B3-%D8%AD%D8%B1%D8%A8-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7-%D8%AA%D8%B8%D9%87%D8%B1-%D8%AA%D8%BA%D9%8A%D8%B1%D8%A7-%D8%AC%D8%B0%D8%B1%D9%8A%D8%A7-%D9%81%D9%8A-%D8%B7%D8%A8%D9%8A%D8%B9%D8%A9-%D8%A7%D9%84%D8%AD%D8%B1%D9%88%D8%A8/", "title": "بتريوس: حرب أوكرانيا تظهر تغيرا جذريا في طبيعة الحروب", "summary": "وصف المدير الأسبق لوكالة الاستخبارات المركزية الأمريكية، الجنرال المتقاعد ديفيد بتريوس، النزاع في أوكرانيا بأنه \"أبرز مختبر عسكري\" سيحدد طبيعة العمليات القتالية في القرن الـ 21.", "link": "https://arabic.rt.com/world/1829180-%D8%A8%D8%AA%D8%B1%D9%8A%D9%88%D8%B3-%D8%AD%D8%B1%D8%A8-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7-%D8%AA%D8%B8%D9%87%D8%B1-%D8%AA%D8%BA%D9%8A%D8%B1%D8%A7-%D8%AC%D8%B0%D8%B1%D9%8A%D8%A7-%D9%81%D9%8A-%D8%B7%D8%A8%D9%8A%D8%B9%D8%A9-%D8%A7%D9%84%D8%AD%D8%B1%D9%88%D8%A8/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c89d9423604733605bae4.jpg", "category": "صحة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788644797, "detail": "وصف المدير الأسبق لوكالة الاستخبارات المركزية الأمريكية، الجنرال المتقاعد ديفيد بتريوس، النزاع في أوكرانيا بأنه \"أبرز مختبر عسكري\" سيحدد طبيعة العمليات القتالية في القرن الـ 21.\n\nوقال بتريوس في كلمة له: \"ليست أوكرانيا مجرد أكبر حرب برية في أوروبا منذ الحرب العالمية الثانية، بل هي المختبر العسكري الأبرز في القرن الحادي والعشرين\".\n\nوأضاف: \"أظن أن المؤرخين في المستقبل سيدرسونها كما درست الأجيال السابقة الحرب الأهلية الأمريكية والحربين العالميتين\".\n\nقائد القيادة الاستراتيجية الأمريكية: جميع الصراعات العسكرية الحديثة أصبحت ذات طبيعة عالمية وتابع: \"وذلك ليس لأن كل درس تكتيكي سيدوم، بل لأن تلك الصراعات تكشف أن ماهية الحرب الحديثة قد دخلت حقبة جديدة جذريا. وهذا تحديدا ما تظهره الحرب في أوكرانيا اليوم\".\n\nجدير بالذكر أن الجنرال ديفيد بتريوس كان في حينه قائدا للقوات الأمريكية في العراق وأفغانستان خلال مسيرته العسكرية الطويلة التي استمرت 37 عاما."}, {"guid": "9f450590-a970-11f1-b762-ff8eca04a549", "title": "خمس دول أوروبية تسعى لاتفاق لإقامة مراكز لإعادة المهاجرين خارج الاتحاد", "summary": "تسعى ألمانيا والنمسا واليونان والدنمارك وهولندا إلى التوصل خلال العام الجاري إلى اتفاق مع دولة من خارج الاتحاد الأوروبي لإنشاء مراكز لإعادة المهاجرين الذين لا يملكون حق الإقامة القانونية، وسط انتقادات ومخاوف حقوقية من الخطة. ومن المقرر أن تعقد الدول الخمس اجتماعا جديدا في ميونيخ نهاية أيلول/سبتمبر.", "link": "https://www.france24.com/ar/%D8%A3%D9%88%D8%B1%D9%88%D8%A8%D8%A7/20260905-%D8%AE%D9%85%D8%B3-%D8%AF%D9%88%D9%84-%D8%A3%D9%88%D8%B1%D9%88%D8%A8%D9%8A%D8%A9-%D9%84%D8%A7%D8%AA%D9%81%D8%A7%D9%82-%D8%A5%D9%82%D8%A7%D9%85%D8%A9-%D9%85%D8%B1%D8%A7%D9%83%D8%B2-%D9%84%D8%A5%D8%B9%D8%A7%D8%AF%D8%A9-%D8%A7%D9%84%D9%85%D9%87%D8%A7%D8%AC%D8%B1%D9%8A%D9%86-%D8%AE%D8%A7%D8%B1%D8%AC-%D8%A7%D9%84%D8%A7%D8%AA%D8%AD%D8%A7%D8%AF-%D8%A7%D9%84%D8%A3%D9%88%D8%B1%D9%88%D8%A8%D9%8A-%D9%87%D8%AC%D8%B1%D8%A9-%D9%84%D8%AC%D9%88%D8%A1", "image": "https://s.france24.com/media/display/d1293efe-6d77-11f0-888c-005056bfb2b6/w:1024/p:16x9/000-36ZE288.jpg", "category": "أخبار", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788643658, "detail": ""}, {"guid": "https://arabic.rt.com/middle_east/1829176-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7-%D8%AA%D9%88%D9%85-%D8%A8%D8%A7%D8%B1%D8%A7%D9%83-%D9%8A%D8%AA%D9%87%D9%85-%D8%B9%D8%B5%D8%A7%D8%A8%D8%A7%D8%AA-%D8%AE%D8%A8%D9%8A%D8%AB%D8%A9-%D8%AF%D8%A7%D8%AE%D9%84-%D8%A7%D9%84%D8%B3%D9%88%D9%8A%D8%AF%D8%A7%D8%A1-%D8%A8%D8%A7%D8%B3%D8%AA%D9%87%D8%AF%D8%A7%D9%81-%D8%A3%D8%A8%D9%86%D8%A7%D8%A1-%D8%AC%D9%84%D8%AF%D8%AA%D9%87%D9%85-%D8%A7%D9%84%D8%AF%D8%B1%D9%88%D8%B2-%D9%88%D9%8A%D8%B4%D9%8A%D8%B1-%D8%A5%D9%84%D9%89-%D8%A7%D9%84%D8%AD%D9%84/", "title": "سوريا.. توم باراك يتهم \"عصابات خبيثة\" داخل السويداء باستهداف أبناء جلدتهم الدروز ويشير إلى الحل", "summary": "اتهم المبعوث الرئاسي الأمريكي توم باراك من سماها \"قلة قليلة ذات نوايا خبيثة\" في السويداء السورية باستهداف أبناء جلدتهم الدروز، في إشارة لتهجير عاطف هنيدي من منزله.", "link": "https://arabic.rt.com/middle_east/1829176-%D8%B3%D9%88%D8%B1%D9%8A%D8%A7-%D8%AA%D9%88%D9%85-%D8%A8%D8%A7%D8%B1%D8%A7%D9%83-%D9%8A%D8%AA%D9%87%D9%85-%D8%B9%D8%B5%D8%A7%D8%A8%D8%A7%D8%AA-%D8%AE%D8%A8%D9%8A%D8%AB%D8%A9-%D8%AF%D8%A7%D8%AE%D9%84-%D8%A7%D9%84%D8%B3%D9%88%D9%8A%D8%AF%D8%A7%D8%A1-%D8%A8%D8%A7%D8%B3%D8%AA%D9%87%D8%AF%D8%A7%D9%81-%D8%A3%D8%A8%D9%86%D8%A7%D8%A1-%D8%AC%D9%84%D8%AF%D8%AA%D9%87%D9%85-%D8%A7%D9%84%D8%AF%D8%B1%D9%88%D8%B2-%D9%88%D9%8A%D8%B4%D9%8A%D8%B1-%D8%A5%D9%84%D9%89-%D8%A7%D9%84%D8%AD%D9%84/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c815d4c59b7589044c87b.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788643516, "detail": "اتهم المبعوث الرئاسي الأمريكي توم باراك من سماها \"قلة قليلة ذات نوايا خبيثة\" في السويداء السورية باستهداف أبناء جلدتهم الدروز، في إشارة لتهجير عاطف هنيدي من منزله.\n\nوكتب باراك على حسابه في منصة \"X\": \"قبل عام، وبالاشتراك مع وزير الخارجية السوري أسعد الشيباني ووزير الخارجية الأردني أيمن الصفدي، وقعنا على خارطة طريق ثلاثية للسلام في السويداء، وهي مسار يهدف إلى إعادة دمج المحافظة في سوريا بكرامة، مع تمتع أبناء الطائفة الدرزية بكامل حقوق المواطنة وتحمل كامل التزاماتها. ويظل هذا المسار هو السبيل الوحيد الذي يجنبنا العودة إلى دوامة الأحزان\".\n\nوأضاف: \"يتمتع الدروز في سوريا بتاريخ عريق ومشرف. ومع ذلك، فحيثما يغيب الحكم الرشيد، تملأ العصابات الفراغ، واليوم، تقوم قلة قليلة ذات نوايا خبيثة باستهداف أبناء جلدتها، كما حدث مع أشخاص مثل عاطف هنيدي، الذي تعرض للاعتقال التعسفي والتهجير من منزله. إن فريقنا على تواصل مع السيد هنيدي وغيره ممن طالتهم حملة العنف الداخلي هذه. ولا بد أن يستمر بناء أواصر التعاون بين الدروز والقبائل العربية ودول الجوار المحيطة بالسويداء على أسس من التسامح والتفاهم، ليكونوا أمة واحدة وشعباً واحداً، يضم ثقافات ومعتقدات متنوعة ومحترمة، ويتفاعل أفراده عبر الحوار المجتمعي والتعاطف، مع ترك خيار اللجوء إلى القوة وردود الفعل الانفعالية المتسرعة حيث ينبغي أن يكون حصراً: في يد الدولة الوطنية\".\n\nوتابع: \"لقد بدأت الحكومة السورية في التصدي للجرائم الخطيرة التي ارتكبتها قواتها في شهر يوليو الماضي، وفي محاسبة المسؤولين عنها أمام محاكمها. هذا هو المسار الذي يبعث على الأمل، ويجب المضي قدماً فيه. إن السبيل الوحيد للمضي قدماً هو الحوار الذي يحقق المساءلة، ويعيد الأمن، ويفتح الطريق أمام عودة النازحين وإعادة إعمار ما دُمر\". وختم بالقول: \"إننا نمر بمرحلة حساسة، سواء على مستوى المنطقة أو العالم بأسره. لذا، فإننا نحث جميع الأطراف على التحلي بالسمتين اللتين طالما تطلب السلام من الشجعان التحلي بهما: ضبط النفس في التصرفات، والتواصل الجاد والمخلص. فالبديل عن الحوار ليس الانتصار، بل جولة أخرى من الحداد والأحزان\".\n\nتجددت الاشتباكات اليوم السبت، على محاور القتال شمال غربي محافظة السويداء، جنوب سوريا.\n\nتشهد محافظة السويداء السورية المزيد من الانقسام السياسي حول سلطة المرجعية الروحية للطائفة الدرزية التي يتزعهما الشيخ حكمت الهجري الذي يبدو له الكلمة العليا في المحافظة.\n\nأفادت قناة الإخبارية السورية بارتفاع إصابات الأمن الداخلي في محافظة السويداء جنوب سوريا إلى 10 عناصر في استهداف \"مجموعات خارجة عن القانون\" نقاطا أمنية بمنطقة تل حديد ومحور ولغا.\n\nأعلنت إدارة مكافحة المخدرات في وزارة الداخلية السورية، السبت، إحباط محاولة تهريب دولية لشحنة كبيرة من المواد المخدرة، خلال عملية أمنية نفذتها في الريف الشرقي لمحافظة السويداء."}, {"guid": "https://arabic.rt.com/world/1829162-%D8%A8%D8%B1%D9%84%D9%85%D8%A7%D9%86%D9%8A%D8%A9-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A9-%D8%AA%D8%AF%D8%B9%D9%88-%D8%A7%D9%84%D9%85%D9%88%D8%A7%D8%B7%D9%86%D9%8A%D9%86-%D9%84%D9%85%D8%BA%D8%A7%D8%AF%D8%B1%D8%A9-%D9%83%D9%8A%D9%8A%D9%81-%D9%88%D8%B4%D8%B1%D8%A7%D8%A1-%D8%AD%D8%B7%D8%A8-%D8%A7%D9%84%D8%AA%D8%AF%D9%81%D8%A6%D8%A9/", "title": "استعدادا لشتاء قارس.. برلمانية أوكرانية تدعو المواطنين لمغادرة كييف وشراء الحطب للتدفئة", "summary": "دعت عضو البرلمان الأوكراني، سولوميا بوبروفسكا، مواطني بلادها إلى الاستعداد لشتاء قارس، ونصحت سكان كييف بمغادرة العاصمة، والتزوّد بحطب التدفئة.", "link": "https://arabic.rt.com/world/1829162-%D8%A8%D8%B1%D9%84%D9%85%D8%A7%D9%86%D9%8A%D8%A9-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A9-%D8%AA%D8%AF%D8%B9%D9%88-%D8%A7%D9%84%D9%85%D9%88%D8%A7%D8%B7%D9%86%D9%8A%D9%86-%D9%84%D9%85%D8%BA%D8%A7%D8%AF%D8%B1%D8%A9-%D9%83%D9%8A%D9%8A%D9%81-%D9%88%D8%B4%D8%B1%D8%A7%D8%A1-%D8%AD%D8%B7%D8%A8-%D8%A7%D9%84%D8%AA%D8%AF%D9%81%D8%A6%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c755c42360444c977ad45.jpg", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788643368, "detail": "دعت عضو البرلمان الأوكراني، سولوميا بوبروفسكا، مواطني بلادها إلى الاستعداد لشتاء قارس، ونصحت سكان كييف بمغادرة العاصمة، والتزوّد بحطب التدفئة.\n\nوكان وزير الخارجية الأوكراني السابق، دميتري كوليبا، قد اعترف في وقت سابق -خلال حديثه عن الشتاء المقبل في أوكرانيا- بأنه قام بتخزين المؤن وحطب التدفئة، تحسبا لأسوأ الاحتمالات.\n\nزيلينسكي يحمل عمدة كييف المسؤولية الشخصية عن الاستعدادات لفصل الشتاء وقالت بوبروفسكا في مقابلة مع قناة \"شيلتر\" الأوكرانية على يوتيوب: \"في انتظارنا لاحقا، خريف وشتاء في غاية الصعوبة. يجب إخبار الأوكرانيين بالحقيقة حول ما ينتظرهم في الشتاء بدلا من إطعامهم الوعود الزائفة. لنقل لهم، استعدوا وتزوّدوا بالمؤن، وغادروا كييف، واشتروا الحطب، وافعلوا كل ما يلزم، وتجهّزوا لإرسال أبنائكم إلى المدارس\".\n\nوكان عضو البرلمان الأوكراني، أليكسي كوتشيرينكو، قد دعا في وقت سابق سكان أوكرانيا إلى التزوّد بحطب التدفئة، لضمان توفير مصادر طاقة احتياطية خلال فصل الشتاء.\n\nوكان رئيس الوزراء الأوكراني، سيرغي كوريتسكي، قد صرّح في وقت سابق بأن الشتاء المقبل في البلاد قد يكون أكثر صعوبة من الشتاء الماضي.\n\nوأكد خبير الطاقة الأوكراني، ستانيسلاف إيغناتيف، في نهاية يوليو، أن الشتاء القادم سيكون الأصعب منذ عام 2022، مشيرا إلى أن شبكة الطاقة في البلاد لم تعد قادرة على تحمل الأحمال.\n\nوكانت معظم المناطق الأوكرانية قد واجهت، في الشتاء الماضي، مشكلات في إمدادات الكهرباء والتدفئة، حيث جرى تطبيق جداول زمنية لقطع التيار الكهربائي.\n\nويشار إلى أن منظومة الطاقة والتدفئة في كييف تعاني حاليا، وضعا حرجا وسباقا مع الزمن، حيث تواجه العاصمة الأوكرانية ضغوطا غير مسبوقة لتفادي انهيار كامل للشبكة مع اقتراب شتاء 2026-2027.\n\nقال وزير الطاقة الأوكراني دينيس شميغال، في حديث نقلته قناة \"Novyni.LIVE\" التلفزيونية الأوكرانية، إن الشتاء المقبل سيكون صعبا على البلاد.\n\nقال زيلينسكي إن أوكرانيا لن تنجو من الشتاء المقبل إن لم تحصل من واشنطن على 5% من صواريخها لأنظمة \"باتريوت\"، بعد استنفاد قواته مخزونها منها في الضربات الروسية المستمرة."}, {"guid": "https://www.dw.com/ar/تظاهرة-حاشدة-من-أجل-الديموقراطية-عشية-انتخابات-ساكسونيا-أنهالت-الألمانية/live-78823317?maca=ara-rss-ar-all-1125-rdf", "title": "تظاهرة حاشدة من أجل \"الديموقراطية\" عشية انتخابات ساكسونيا أنهالت الألمانية", "summary": "عشية انتخابات ولاية ساكسونيا أنهالت بشرق ألمانيا، تظاهر الآلاف في ماغدبورغ من أجل \"الديموقراطية\" في وقت تشير الاستطلاعات إلى تقدم حزب البديل اليميني الشعبوي. والحزب من جانبه جدد ثقته بالفوز حتى بما هو أبعد من الولاية.", "link": "https://www.dw.com/ar/تظاهرة-حاشدة-من-أجل-الديموقراطية-عشية-انتخابات-ساكسونيا-أنهالت-الألمانية/live-78823317?maca=ara-rss-ar-all-1125-rdf", "image": "", "category": "سياسة", "source_id": "dw-arabic", "source_name": "DW عربي", "source_cat": "دولية", "published": 1788642180, "detail": ""}, {"guid": "https://arabic.rt.com/sport/1829174-%D8%A7%D9%84%D8%A7%D8%AA%D8%AD%D8%A7%D8%AF-%D9%8A%D8%B3%D9%82%D8%B7-%D8%A7%D9%84%D9%86%D8%B5%D8%B1-%D9%81%D9%8A-%D8%A7%D9%84%D9%83%D9%84%D8%A7%D8%B3%D9%8A%D9%83%D9%88-%D9%88%D9%8A%D8%A8%D8%B9%D8%AF%D9%87-%D8%B9%D9%86-%D8%B5%D8%AF%D8%A7%D8%B1%D8%A9-%D8%A7%D9%84%D8%AF%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D8%B3%D8%B9%D9%88%D8%AF%D9%8A/", "title": "الاتحاد يسقط النصر في الكلاسيكو ويبعده عن صدارة الدوري السعودي", "summary": "حسم اتحاد جدة لقاء الكلاسيكو السعودي لصالحه بالفوز على ضيفه النصر بنتيجة 2-1 في قمة منافسات الجولة الخامسة من دوري روشن للمحترفين مساء السبت.", "link": "https://arabic.rt.com/sport/1829174-%D8%A7%D9%84%D8%A7%D8%AA%D8%AD%D8%A7%D8%AF-%D9%8A%D8%B3%D9%82%D8%B7-%D8%A7%D9%84%D9%86%D8%B5%D8%B1-%D9%81%D9%8A-%D8%A7%D9%84%D9%83%D9%84%D8%A7%D8%B3%D9%8A%D9%83%D9%88-%D9%88%D9%8A%D8%A8%D8%B9%D8%AF%D9%87-%D8%B9%D9%86-%D8%B5%D8%AF%D8%A7%D8%B1%D8%A9-%D8%A7%D9%84%D8%AF%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D8%B3%D8%B9%D9%88%D8%AF%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c7f004c59b7253727ff4a.png", "category": "رياضة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788642122, "detail": "حسم اتحاد جدة لقاء الكلاسيكو السعودي لصالحه بالفوز على ضيفه النصر بنتيجة 2-1 في قمة منافسات الجولة الخامسة من دوري روشن للمحترفين مساء السبت.\n\nوتقدم الاتحاد بهدفي جورج إيكيلينكا في الدقيقتين 3 و22، وقلص النصر حامل اللقب الفارق بهدف وحيد سجله أنجيلو غابرييل في الدقيقة 36 من المباراة التي أقيمت على ملعب \"الإنماء\" في جدة.\n\nثلاثة أهداف حضرت في القمة.. شاهد أهداف مواجهة الاتحاد والنصر كاملة 🔥⚽🎥#الاتحاد_النصر pic.twitter.com/J7uaRBPBQC\n\nوبهذه النتيجة، توقفت سلسلة النصر عند أربعة انتصارات متتالية، ليتجمد رصيده عند 12 نقطة في المركز الثاني، أمامه الهلال في الصدارة بـ15 نقطة.\n\nأما الاتحاد بطل الدوري في 2025، فقد حافظ على سجله خاليا من الهزائم، ورفع رصيده إلى 11 نقطة في المركز الرابع.\n\nوفي الجولة القادمة سيكون النصر مطالبا بالتعويض عندما يستضيف أبها يوم الأربعاء، بينما سيلعب الاتحاد يوم الثلاثاء أمام ضيفه الفيحاء.\n\nلم يكتف نادي اتحاد جدة السعودي بحصد نقاط الفوز الثمينة في \"كلاسيكو\" دوري روشن، بل وجه رسالة ساخرة لنجم نادي النصر وقائده كريستيانو رونالدو عقب نهاية المباراة.\n\nوصلت بعثة نادي النصر إلى مدينة جدة وسط استقبال جماهيري غفير للأسطورة كريستيانو رونالدو، وذلك استعدادا لمواجهة الاتحاد مساء اليوم السبت ضمن الجولة الخامسة من دوري روشن للمحترفين."}, {"guid": "https://arabic.rt.com/world/1829175-%D8%A8%D8%AD%D8%B1%D9%8A%D8%A9-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A-%D8%AA%D8%B3%D8%AA%D9%87%D8%AF%D9%81-%D8%B3%D8%AA-%D8%B3%D9%81%D9%86-%D8%B1%D8%AF%D8%A7-%D8%B9%D9%84%D9%89-%D9%87%D8%AC%D9%88%D9%85-%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A-%D9%88%D8%AA%D8%AD%D8%B0%D8%B1-%D8%A8%D8%A7%D9%82%D9%8A-%D8%A7%D9%84%D8%B3%D9%81%D9%86-%D9%85%D9%86-%D8%AA%D8%AD%D8%B1%D9%83%D8%A7%D8%AA-%D9%85%D8%B4%D8%A8%D9%88%D9%87%D8%A9/", "title": "بحرية الحرس الثوري تستهدف ست سفن ردا على هجوم أمريكي وتحذر باقي السفن من \"تحركات مشبوهة\"", "summary": "أكدت بحرية الحرس الثوري الإيراني، مساء اليوم السبت، استهدافها 3 ناقلات نفط كانت تسلك مسارا غير مصرح به في مضيق هرمز و3 سفن أمريكية في مناطق أخرى، ردا على مهاجمة ناقلات نفط إيرانية.", "link": "https://arabic.rt.com/world/1829175-%D8%A8%D8%AD%D8%B1%D9%8A%D8%A9-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A-%D8%AA%D8%B3%D8%AA%D9%87%D8%AF%D9%81-%D8%B3%D8%AA-%D8%B3%D9%81%D9%86-%D8%B1%D8%AF%D8%A7-%D8%B9%D9%84%D9%89-%D9%87%D8%AC%D9%88%D9%85-%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A-%D9%88%D8%AA%D8%AD%D8%B0%D8%B1-%D8%A8%D8%A7%D9%82%D9%8A-%D8%A7%D9%84%D8%B3%D9%81%D9%86-%D9%85%D9%86-%D8%AA%D8%AD%D8%B1%D9%83%D8%A7%D8%AA-%D9%85%D8%B4%D8%A8%D9%88%D9%87%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c7fd242360444de658b70.png", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788642002, "detail": "أكدت بحرية الحرس الثوري الإيراني، مساء اليوم السبت، استهدافها 3 ناقلات نفط كانت تسلك مسارا غير مصرح به في مضيق هرمز و3 سفن أمريكية في مناطق أخرى، ردا على مهاجمة ناقلات نفط إيرانية.\n\nوقالت بحرية الحرس الثوري في بيان: \"الجيش الأمريكي الإرهابي والمعتدي، هاجم صباح اليوم، وفي خطوة وحشية نابعة من حالة اليأس، ثلاث ناقلات نفط تابعة للجمهورية الإسلامية الإيرانية\".\n\nالقيادة المركزية الأمريكية: تدمير 3 ناقلات نفط إيرانية ردا على هجمات الحرس الثوري وأضاف البيان: \"استهدف مقاتلو القوة البحرية في الحرس الثوري، ثلاث ناقلات نفط كانت تسلك مسارات غير مسموح بها في مضيق هرمز، وثلاث سفن تابعة للولايات المتحدة، في مناطق أخرى\".\n\nووجهت البحرية الإيرانية تحذيرا شديد اللهجة إلى كافة السفن والقطع البحرية المتواجدة في مياه الخليج وبالقرب من مضيق هرمز، طالبتها فيه بتجنب ما وصفته بـ\"التحركات المشبوهة\" أو محاولة العبور عبر ممرات مائية غير مصرح بها.\n\nوشددت على أن \"أي سفينة لا تلتزم بالتعليمات التحذيرية أو تشارك في تحركات تعتبرها إيران تهديدا لأمنها، ستكون هدفا عسكريا مباشرا لقواتها البحرية\".\n\nوكان وزير الحرب الأمريكي بيت هيغسيث، قد وجه مساء السبت، تحذيرا إلى إيران، مشيرا إلى أن الولايات المتحدة ستدمر ناقلات النفط الإيرانية وتغرقها في حال أطلقت إيران النار على السفن الأمريكية.\n\nيأتي هذا التصعيد الميداني في وقت تشهد فيه المنطقة توترا متصاعدا بين واشنطن وطهران، وسط تبادل للتهديدات باستهداف الأساطيل التجارية والعسكرية في الممرات المائية الحيوية.\n\nأعلن الحرس الثوري الإيراني مهاجمة زورق أمريكي مسير كان يعتزم دخول المنطقة المحمية في مضيق هرمز.\n\nصرح المتحدث باسم مقر \"خاتم الأنبياء\" الإيراني إبراهيم ذو الفقاري بأن إيران ستشن ضربات جديدة وأكثر قوة ضد السفن العسكرية الأمريكية إذا استمرت في مضايقة السفن الإيرانية ومهاجمتها.\n\nكشف مسؤولون أمريكيون مطلعون عن إخضاع نحو 50 من كبار ضباط وموظفي هيئة الأركان المشتركة في الجيش الأمريكي لاختبارات كشف الكذب (بوليغراف) خلال الشهر الماضي.\n\nأعلنت وكالة الأنباء الإيرانية، اليوم السبت، مصرع 11 شخصا في انفجار صهريج وقود غرب البلاد.\n\nوجّه وزير الحرب الأمريكي بيت هيغسيث تحذيرا شديد اللهجة إلى إيران، ملوحا بعواقب عسكرية واقتصادية في حال استهداف السفن التابعة للبحرية الأمريكية في المنطقة.\n\nأصدرت السفارة الأمريكية لدى البحرين تحذيرا أمنيا للمواطنين الأمريكيين، أكدت فيه أن الوضع الأمني في الشرق الأوسط لا يزال معقدا مع احتمالية حدوث تصعيد غير متوقع.\n\nبحث وزير الخارجية المصري بدر عبد العاطي مع نظيره العماني بدر بن حمد البوسعيدي مستجدات الأوضاع الإقليمية والجهود الرامية لاحتواء التوتر الراهن واستعادة الهدوء والاستقرار بالمنطقة.\n\nدعا المتحدث باسم الخارجية الإيرانية إسماعيل بقائي الأمريكيين إلى التساؤل عن أسباب طرح وعود بإعفاء أبنائهم من الديون المصرفية مقابل القتال في \"حرب إسرائيل ضد إيران\".\n\nأفادت وكالة \"فارس\" بسماع دوي انفجارات عديدة في جزيرة خارك بالخليج، فيما تداولت وسائل إعلام أنباء حول استهداف أمريكي لناقلة نفط."}, {"guid": "https://arabic.rt.com/business/1829169-%D8%A7%D8%B1%D8%AA%D9%81%D8%A7%D8%B9-%D8%A3%D8%B3%D8%B9%D8%A7%D8%B1-%D8%A7%D9%84%D8%A8%D9%86%D8%B2%D9%8A%D9%86-%D9%8A%D8%A8%D8%AF%D8%AF-%D9%81%D8%B1%D8%AD%D8%A9-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D9%8A%D9%86-%D8%A8%D8%B9%D8%B7%D9%84%D8%A9-%D8%B9%D9%8A%D8%AF-%D8%A7%D9%84%D8%B9%D9%85%D8%A7%D9%84/", "title": "ارتفاع أسعار البنزين يبدد فرحة الأمريكيين بعطلة عيد العمال", "summary": "يواجه الأمريكيون أسعار بنزين قياسية خلال عطلة عيد العمال، مع استمرار رفع تكاليف الطاقة جراء الحرب في الشرق الأوسط، بالتزامن مع انطلاق الحملات لانتخابات التجديد النصفي للكونغرس.", "link": "https://arabic.rt.com/business/1829169-%D8%A7%D8%B1%D8%AA%D9%81%D8%A7%D8%B9-%D8%A3%D8%B3%D8%B9%D8%A7%D8%B1-%D8%A7%D9%84%D8%A8%D9%86%D8%B2%D9%8A%D9%86-%D9%8A%D8%A8%D8%AF%D8%AF-%D9%81%D8%B1%D8%AD%D8%A9-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D9%8A%D9%86-%D8%A8%D8%B9%D8%B7%D9%84%D8%A9-%D8%B9%D9%8A%D8%AF-%D8%A7%D9%84%D8%B9%D9%85%D8%A7%D9%84/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c77e54c59b7578c0d2b4e.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788641844, "detail": "يواجه الأمريكيون أسعار بنزين قياسية خلال عطلة عيد العمال، مع استمرار رفع تكاليف الطاقة جراء الحرب في الشرق الأوسط، بالتزامن مع انطلاق الحملات لانتخابات التجديد النصفي للكونغرس.\n\nوقال باتريك دي هان، المحلل لدى شركة \"GasBuddy\"، إن متوسط سعر البنزين الوطني قد يصل إلى 4.03 دولار للغالون في عيد العمال، متجاوزا الرقم القياسي السابق البالغ 3.83 دولار والمسجل عام 2012. وبلغ السعر نحو 4.13 دولار للغالون يوم الخميس، بزيادة تقارب دولارا عن العام الماضي.\n\nوتعد أسعار البنزين من أكثر المؤشرات تأثيرا في نظرة الأمريكيين إلى الاقتصاد، وقد أصبحت قضية سياسية حساسة للرئيس دونالد ترامب والحزب الجمهوري، خصوصا بعدما تجاوزت الأسعار 4 دولارات خلال جزء كبير من العام. وكان ترامب قد تعهد بخفض تكاليف الطاقة، ووجه انتقادات لشركات التكرير وتجار الوقود بسبب ارتفاع الأسعار.\n\nوتزامن ارتفاع أسعار البنزين مع صعود النفط الخام فوق 90 دولارا للبرميل، بعد تجدد الضربات بين الولايات المتحدة وإيران، ما أثار مخاوف من اضطراب الإمدادات العالمية.\n\nوأجبر ارتفاع الأسعار بعض الأمريكيين على تقليص الإنفاق والسفر خلال عطلة عيد العمال، وقالت إحدى السائقات في كولورادو إنها لا تستطيع تحمل أكثر من 15 دولارا لنفقات البنزين في الوقت الحالي، بينما قالت مواطنة من هيوستن إنها خفضت خطط سفرها بسبب ارتفاع تكاليف المعيشة.\n\nويرى محللون أن ارتفاع أسعار البنزين يعود أساسا إلى محدودية الإمدادات، في ظل المخاوف من اضطراب شحنات الطاقة عبر مضيق هرمز وتراجع مخزونات الوقود الأمريكية. وتعمل المصافي الأمريكية حاليا بنحو 98% من طاقتها، وهو أعلى مستوى منذ 2018، فيما انخفضت مخزونات البنزين إلى 205.7 مليون برميل.\n\nكما سجل الديزل الأمريكي مستوى قياسيا جديدا، فيما يتوقع أن يدفع المسافرون جوا خلال عطلة عيد العمال أسعار تذاكر أعلى بنحو 20% مقارنة بالعام الماضي، ما يزيد الضغوط على ميزانيات الأسر الأمريكية.\n\nيعتزم الرئيس الأمريكي دونالد ترامب الاجتماع الأسبوع المقبل بشركات النفط وتجار الوقود لبحث خفض أسعار البنزين وتخفيف الضغوط الاقتصادية على الأمريكيين قبيل انتخابات التجديد النصفي.\n\nتراجع الاحتياطي الاستراتيجي الأمريكي من النفط إلى أدنى مستوى منذ أربعين عاما، مايثير مخاوف من تداعيات الحصار الاقتصادي الذي أعلنته واشنطن على طهران وتهديد الأخيرة بتوسيع المواجهة..\n\nأكد الرئيس الأمريكي دونالد ترامب أن مضيق هرمز لن يكون له في المستقبل نفس الأهمية لإمدادات النفط العالمية كما كان سابقا، وذلك على خلفية زيادة إنتاج وتصدير النفط من الولايات المتحدة."}, {"guid": "https://arabic.rt.com/features/1829126-%D9%84%D9%86%D8%AF%D9%86-%D8%A7%D9%84%D8%AA%D9%85%D9%88%D9%8A%D9%84-%D8%A7%D9%84%D8%A3%D8%AC%D9%86%D8%A8%D9%8A-%D9%8A%D8%AB%D9%8A%D8%B1-%D8%B9%D8%A7%D8%B5%D9%81%D8%A9-%D8%B3%D9%8A%D8%A7%D8%B3%D9%8A%D8%A9/", "title": "لندن.. التمويل الأجنبي يثير عاصفة سياسية", "summary": "تتفاعل في بريطانيا تداعيات تحقيق صحفي وضع حزب الإصلاح برئاسة /نايجل فاراج/ في قلب عاصفة سياسية وقانونية، وسط تبادل الاتهامات بين الحزب ومعارضيه..", "link": "https://arabic.rt.com/features/1829126-%D9%84%D9%86%D8%AF%D9%86-%D8%A7%D9%84%D8%AA%D9%85%D9%88%D9%8A%D9%84-%D8%A7%D9%84%D8%A3%D8%AC%D9%86%D8%A8%D9%8A-%D9%8A%D8%AB%D9%8A%D8%B1-%D8%B9%D8%A7%D8%B5%D9%81%D8%A9-%D8%B3%D9%8A%D8%A7%D8%B3%D9%8A%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c80c4423604717146d602.jpg", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788641520, "detail": "تتفاعل في بريطانيا تداعيات تحقيق صحفي وضع حزب الإصلاح برئاسة /نايجل فاراج/ في قلب عاصفة سياسية وقانونية، وسط تبادل الاتهامات بين الحزب ومعارضيه..\n\nويكشف التحقيق الصحفي تورط مسؤولين في الحزب في قبول تبرعات مالية أجنبية، ما قد يشكل خرقا لقانون الانتخابات."}, {"guid": "https://www.dw.com/ar/بوتين-يلتقي-بوفد-أمريكي-ـ-موسكو-وكييف-تعلنان-وقف-تبادل-الضربات-مؤقتا/a-79050605?maca=ara-rss-ar-all-1125-rdf", "title": "ب atoday.com/media/pics/2026.09/thumbnail/6a9c7457423604440107061c.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788640650, "detail": "كشفت صحيفة \"الغارديان\" عن قلق واسع يساور المخططين العسكريين في حلف \"الناتو\" إزاء سيناريو محتمل لحرب أوروبية طويلة الأمد مع روسيا، وسط عدم استعداد دول الاتحاد لعمليات قتالية واسعة.\n\nوذكرت الصحيفة نقلا عن مصادر مطلعة، أن خبراء عسكريين يعملون مع الناتو أقنعوا المسؤولين في الاتحاد الأوروبي خلال مؤتمر حول مستقبل التنسيق العسكري الأوروبي، بضرورة تكثيف الهجوم المعلوماتي على روسيا، وذلك في إطار تحضيرات أوسع لمواجهة محتملة.\n\nوعزت \"الغارديان\" أسباب \"التشاؤم العسكري\" لدى مخططي الناتو إلى عدة عوامل رئيسية، أبرزها \"صعود التيارات اليمينية في أوروبا، وهو ما يهدد بتقويض أي تشكيل لمجموعة تنسيق دفاعية أوروبية موحدة\".\n\nبالإضافة إلى \"تراجع الدعم الأمريكي: حيث يشير الانخفاض السريع في مستوى الالتزام الأمريكي تجاه القوات الأوروبية إلى إعادة تقييم جذرية للعلاقات عبر الأطلسي\".\n\nوأشارت \"الغارديان\" إلى أن مقترحات الخبراء وضعت وزراء دول الاتحاد الأوروبي أمام \"مهمة صعبة تتمثل في إقناع الناخبين غير المستعدين لخفض الإنفاق الاجتماعي في سبيل تمويل الدفاع\"، وتأتي هذه التحديات في وقت تعاني فيه اقتصادات أوروبية من تباطؤ النمو وارتفاع التضخم، لاسيما بعد تخليها عن شراء الغاز الروسي \"الرخيص\" مما يجعل زيادة الإنفاق العسكري على حساب برامج الرعاية الاجتماعية قرارا غير شعبي.\n\nحذر سفير الولايات المتحدة لدى \"الناتو\"، ماثيو ويتاكر، الدول الأعضاء في الحلف من عدم التسامح مع الأعمال المتعمدة في إطار الحرب الهجينة، مؤكدا أن واشنطن ستقف إلى جانب الدول المعنية."}, {"guid": "https://arabic.rt.com/world/1829165-%D8%A7%D9%84%D8%B4%D8%B1%D8%B7%D8%A9-%D8%A7%D9%84%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84%D9%8A%D8%A9-%D8%AA%D9%82%D8%AA%D9%84-%D8%AC%D9%86%D8%AF%D9%8A%D8%A7-%D8%B3%D8%A7%D8%A8%D9%82%D8%A7-%D9%81%D9%8A-%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AD%D8%AF%D9%88%D8%AF%D9%8A%D8%B9%D8%A7%D9%86%D9%8A-%D9%85%D9%86-%D9%85%D8%AA%D9%84%D8%A7%D8%B2%D9%85%D8%A9-%D9%85%D8%A7-%D8%A8%D8%B9%D8%AF-%D8%A7%D9%84%D8%B5%D8%AF%D9%85%D8%A9-%D9%81%D9%8A%D8%AF%D9%8A%D9%88%D9%87%D8%A7%D8%AA/", "title": "الشرطة الإسرائيلية تقتل جنديا سابقا في حرس الحدود يعاني من متلازمة \"ما بعد الصدمة\" (فيديوهات)", "summary": "كشفت تقارير إسرائيلية عن أن المشتبه به الذي قُتل بعد إطلاقه النار على قوات الشرطة في مدينة نتانيا، هو مقاتل سابق في حرس الحدود، ويعاني من \"متلازمة ما بعد الصدمة\"جراء خدمته السابقة.", "link": "https://arabic.rt.com/world/1829165-%D8%A7%D9%84%D8%B4%D8%B1%D8%B7%D8%A9-%D8%A7%D9%84%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84%D9%8A%D8%A9-%D8%AA%D9%82%D8%AA%D9%84-%D8%AC%D9%86%D8%AF%D9%8A%D8%A7-%D8%B3%D8%A7%D8%A8%D9%82%D8%A7-%D9%81%D9%8A-%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AD%D8%AF%D9%88%D8%AF%D9%8A%D8%B9%D8%A7%D9%86%D9%8A-%D9%85%D9%86-%D9%85%D8%AA%D9%84%D8%A7%D8%B2%D9%85%D8%A9-%D9%85%D8%A7-%D8%A8%D8%B9%D8%AF-%D8%A7%D9%84%D8%B5%D8%AF%D9%85%D8%A9-%D9%81%D9%8A%D8%AF%D9%8A%D9%88%D9%87%D8%A7%D8%AA/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c776a4c59b757a7594c56.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788640085, "detail": "كشفت تقارير إسرائيلية عن أن المشتبه به الذي قُتل بعد إطلاقه النار على قوات الشرطة في مدينة نتانيا، هو مقاتل سابق في حرس الحدود، ويعاني من \"متلازمة ما بعد الصدمة\"جراء خدمته السابقة.\n\nووقع الحادث في منطقة كريات شارون في نتانيا، حيث قام المشتبه به، الرقيب أول ديفيد هوير عمراني، بإطلاق النار باتجاه دورية شرطية قبل أن يتم تحييده (قتله) من قبل القوات التي ردت على التهديد بسرعة.\n\nوبحسب ما نقلته قناة \"14\" الإسرائيلية، تشير التحقيقات الأولية إلى أن المقاتل السابق كان يعاني من آثار نفسية شديدة، مما أثار تساؤلات فورية حول مدى كفاية آليات الدعم والمتابعة النفسية المقدمة للعائدين من ساحات المعارك.\n\nوفي أعقاب الحادث، أطلق \"عيدان كليمان\"، رئيس منظمة قدامى المحاربين في الجيش الإسرائيلي، صرخة تحذيرية قوية، واصفاً الواقعة بأنها \"جرس إنذار جديد للحكومة\".\n\nوقال كليمان في تصريح له: \"لا يجوز أن نتخلى عن عشرات الآلاف من المقاتلين والمقاتلات الذين يواصلون خوض المعركة النفسية حتى بعد عودتهم من ساحة القتال\".\n\nودعا وزير الأمن القومي الإسرائيلي، إيتمار بن غفير، إلى إصدار أمر فوري بإجراء تحقيق مشترك وعميق بين الجيش الإسرائيلي ووزارة الدفاع، لفحص ظروف الحادث بدقة وتقييم \"المظلة العلاجية\" المقدمة لهؤلاء الجنود، بهدف استخلاص العبر ومنع تكرار مثل هذه الحوادث."}, {"guid": "364c279e-a961-11f1-8e75-cdce68be400e", "title": "تركيا تطرح مبادرة جديدة لضمان عبور سفن الحبوب للبحر الأسود بشكل آمن", "summary": "تسعى أنقرة إلى ضمان عبور سفن الحبوب بشكل آمن للبحر الأسود حتى تصل إلى الأسواق العالمية، بما في ذلك عبر اسطنبول. وقال وزير الخارجية التركي هاكان فيدان إن بلاده أعدت خطة لضمان مرور آمن للحبوب لهذا الممر البحري الحيوي، مشيرًا إلى اتصالات مع كل من روسيا وأوكرانيا بشأنها. لكن استمرار الحرب، يبقي نجاح الم", "link": "https://www.france24.com/ar/%D8%A3%D9%88%D8%B1%D9%88%D8%A8%D8%A7/20260905-%D8%B1%D9%8A%D8%A8%D9%88%D8%B1%D8%AA%D8%A7%D8%AC-%D8%AA%D8%B1%D9%83%D9%8A%D8%A7-%D8%B3%D9%81%D9%86-%D8%A7%D9%84%D8%AD%D8%A8%D9%88%D8%A8-%D8%A7%D9%84%D8%A8%D8%AD%D8%B1-%D8%A7%D9%84%D8%A3%D8%B3%D9%88%D8%AF-%D8%AD%D8%B1%D8%A8-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7", "image": "https://s.france24.com/media/display/cd840b54-a90c-11f1-beda-005056bf30b7/w:1024/p:16x9/AR-20260905-110723-110914-CS.jpg", "category": "أخبار", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788639948, "detail": ""}, {"guid": "ad4cecca-a961-11f1-b4d0-cdce68be400e", "title": "فرق الانقاذ الجزائرية تعلن العثور على الطفل الذي سقط في بئر ارتوازية ميتا", "summary": "فرق الانقاذ الجزائرية تعلن العثور على الطفل الذي سقط في بئر ارتوازية ميتا.", "link": "https://www.france24.com/ar/%D9%81%D9%8A%D8%AF%D9%8A%D9%88/20260905-%D9%81%D8%B1%D9%82-%D8%A7%D9%84%D8%A7%D9%86%D9%82%D8%A7%D8%B0-%D8%A7%D9%84%D8%AC%D8%B2%D8%A7%D8%A6%D8%B1%D9%8A%D8%A9-%D8%AA%D8%B9%D9%84%D9%86-%D8%A7%D9%84%D8%B9%D8%AB%D9%88%D8%B1-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D8%B7%D9%81%D9%84-%D8%A7%D9%84%D8%B0%D9%8A-%D8%B3%D9%82%D8%B7-%D9%81%D9%8A-%D8%A8%D8%A6%D8%B1-%D8%A7%D8%B1%D8%AA%D9%88%D8%A7%D8%B2%D9%8A%D8%A9-%D9%85%D9%8A%D8%AA%D8%A7", "image": "https://s.france24.com/media/display/a8a3c7c0-a961-11f1-a426-005056bf30b7/w:1024/p:16x9/AR-20260905-213126-213541-CS.jpg", "category": "أخبار", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788639875, "detail": ""}, {"guid": "https://arabic.rt.com/world/1829155-%D8%BA%D9%88%D9%8A%D8%A7%D9%86%D8%A7-%D8%AA%D8%B3%D8%AA%D9%82%D8%A8%D9%84-%D8%A3%D9%88%D9%84-%D8%AF%D9%81%D8%B9%D8%A9-%D9%85%D9%86-%D8%A7%D9%84%D9%85%D8%B1%D8%AD%D9%84%D9%8A%D9%86-%D9%85%D9%86-%D8%A7%D9%84%D9%88%D9%84%D8%A7%D9%8A%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%AA%D8%AD%D8%AF%D8%A9-%D8%B6%D9%85%D9%86-%D8%A7%D8%AA%D9%81%D8%A7%D9%82-%D9%85%D8%B9-%D8%A5%D8%AF%D8%A7%D8%B1%D8%A9-%D8%AA%D8%B1%D8%A7%D9%85%D8%A8/", "title": "غويانا تستقبل أول دفعة من المرحّلين من الولايات المتحدة وفق اتفاق مع إدارة ترامب", "summary": "أعلنت حكومة غويانا، السبت، وصول أول مجموعة تضم ستة أشخاص مرحّلين من الولايات المتحدة، في إطار سياسة إدارة الرئيس الأمريكي دونالد ترامب المتعلقة بترحيل مهاجرين إلى دول ثالثة.", "link": "https://arabic.rt.com/world/1829155-%D8%BA%D9%88%D9%8A%D8%A7%D9%86%D8%A7-%D8%AA%D8%B3%D8%AA%D9%82%D8%A8%D9%84-%D8%A3%D9%88%D9%84-%D8%AF%D9%81%D8%B9%D8%A9-%D9%85%D9%86-%D8%A7%D9%84%D9%85%D8%B1%D8%AD%D9%84%D9%8A%D9%86-%D9%85%D9%86-%D8%A7%D9%84%D9%88%D9%84%D8%A7%D9%8A%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%AA%D8%AD%D8%AF%D8%A9-%D8%B6%D9%85%D9%86-%D8%A7%D8%AA%D9%81%D8%A7%D9%82-%D9%85%D8%B9-%D8%A5%D8%AF%D8%A7%D8%B1%D8%A9-%D8%AA%D8%B1%D8%A7%D9%85%D8%A8/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c6a894c59b759282fecfc.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788639480, "detail": "أعلنت حكومة غويانا، السبت، وصول أول مجموعة تضم ستة أشخاص مرحّلين من الولايات المتحدة، في إطار سياسة إدارة الرئيس الأمريكي دونالد ترامب المتعلقة بترحيل مهاجرين إلى دول ثالثة.\n\nوقال وزير خارجية غويانا، روبرت بيرساد، إن المجموعة، التي تضم مواطنين من كوبا وأفغانستان، وصلت إلى البلاد الجمعة، بعد خضوع أفرادها لعملية تدقيق من جانب السلطات، أكدت عدم وجود سوابق جنائية بحقهم.\n\nوأوضح بيرساد أن أسباب ترحيل هؤلاء الستة من الولايات المتحدة ترتبط بشكل أساسي بمخالفات وقضايا تتعلق بالهجرة، مشيرا إلى أن الاتفاق بين واشنطن وبلاده جاء بعد مفاوضات استمرت عدة أشهر.\n\nوأضاف الوزير، في تصريحات لوكالة \"أسوشيتد برس\"، أن الولايات المتحدة لم تقدم حتى الآن أي طلبات إضافية لترحيل أشخاص إلى غويانا. ووفق الاتفاق، ستستضيف البلاد المرحّلين لمدة عام، على أن تكون الإقامة مؤقتة وليست خطوة نحو توطين دائم.\n\nومن المقرر أن يخضع المرحّلون الموجودون في غويانا ضمن برنامج \"العودة الطوعية المدعومة\" لإجراءات لتحديد وضعهم من الناحية القانونية والهجرة. وبناء على نتائج هذه الإجراءات، قد يعود بعضهم إلى بلدانهم الأصلية أو يتم نقلهم إلى دول أخرى.\n\nوأفادت السلطات في غويانا بأن المنظمة الدولية للهجرة التابعة للأمم المتحدة ستتولى تنفيذ البرنامج، مؤكدة أن الحكومة لن تتحمل تكاليف إيواء المرحّلين أو تقديم الدعم لهم.\n\nوتنضم غويانا، العضو المؤسس في الجماعة الكاريبية التي تضم 15 دولة، إلى عدد من دول المنطقة التي بدأت في استقبال مجموعات محدودة من المرحّلين من الولايات المتحدة.\n\nوتشمل قائمة الدول الأخرى التي وافقت على استقبال مرحّلين سانت كيتس ونيفيس وبليز، فيما كان من المقرر أن تستقبل سانت لوسيا أول مجموعة من المرحّلين خلال الأسبوع الجاري، وفقا لمسؤولين.\n\nأكد وزير الخارجية الإيطالي أنطونيو تاياني أن قرار بلاده تمديد تعليق اتفاقية شنغن مع إسبانيا هو إجراء وقائي ضروري لحماية الأمن الوطني، مشيرا إلى أن مدريد نفسها \"تقر بخطر الإرهاب\".\n\nأعلنت الشرطة الإيطالية ترحيل 23 مواطنا مصريا إلى القاهرة على متن رحلة جوية مستأجرة، تبيّن أن لديهم سجلات جنائية تتعلق بجرائم ضد الأشخاص والممتلكات.\n\nتعهد الرئيس الكولومبي أبيلاردو دي لا إسبريلا بترحيل آلاف المهاجرين الموجودين في البلاد من دون تصاريح إقامة ومعظمهم من الفنزويليين."}, {"guid": "https://www.dw.com/ar/حكومة-سانشيز-تسيطر-على-ميناء-سبتة-بعد-خلاف-حول-إيواء-المهاجرين/a-79050292?maca=ara-rss-ar-all-1125-rdf", "title": "حكومة سانشيز تسيطر على ميناء سبتة بعد خلاف حول إيواء المهاجرين", "summary": "فرضت الحكومة الإسبانية سيطرتها على الميناء في جيب سبتة، بعد خلاف بشأن إيواء المهاجرين في المنطقة، فيما أكدت البرتغال أن تدفق المهاجرين إلى سبتة \"لم يشكل تهديدا فوريا لمنطقة شنغن في ذلك الوقت\". لشبونة أشادت بتعاون المغرب.", "link": "https://www.dw.com/ar/حكومة-سانشيز-تسيطر-على-ميناء-سبتة-بعد-خلاف-حول-إيواء-المهاجرين/a-79050292?maca=ara-rss-ar-all-1125-rdf", "image": "", "category": "سياسة", "source_id": "dw-arabic", "source_name": "DW عربي", "source_cat": "دولية", "published": 1788639480, "detail": ""}, {"guid": "https://arabic.rt.com/world/1829160-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D9%82%D8%AA%D9%8A%D9%84-%D9%88%D8%AC%D8%B1%D9%8A%D8%AD-%D9%81%D9%8A-%D9%87%D8%AC%D9%88%D9%85-%D8%A8%D8%B7%D8%A7%D8%A6%D8%B1%D8%A9-%D9%85%D8%B3%D9%8A%D8%B1%D8%A9-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A9-%D8%B9%D9%84%D9%89-%D9%85%D9%82%D8%A7%D8%B7%D8%B9%D8%A9-%D8%A8%D9%8A%D9%84%D8%BA%D9%88%D8%B1%D9%88%D8%AF/", "title": "روسيا.. قتيل وجريح في هجوم بطائرة مسيرة أوكرانية على مقاطعة بيلغورود", "summary": "أفادت غرفة العمليات في مقاطعة بيلغورود الروسية بأن شخصا واحدا لقى حتفه وأصيب آخر، اليوم السبت، بعد هجوم بطائرة مسيرة أطلقتها القوات الأوكرانية.", "link": "https://arabic.rt.com/world/1829160-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D9%82%D8%AA%D9%8A%D9%84-%D9%88%D8%AC%D8%B1%D9%8A%D8%AD-%D9%81%D9%8A-%D9%87%D8%AC%D9%88%D9%85-%D8%A8%D8%B7%D8%A7%D8%A6%D8%B1%D8%A9-%D9%85%D8%B3%D9%8A%D8%B1%D8%A9-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A9-%D8%B9%D9%84%D9%89-%D9%85%D9%82%D8%A7%D8%B7%D8%B9%D8%A9-%D8%A8%D9%8A%D9%84%D8%BA%D9%88%D8%B1%D9%88%D8%AF/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c6ea3423604440107061a.jpeg", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788639445, "detail": "أفادت غرفة العمليات في مقاطعة بيلغورود الروسية بأن شخصا واحدا لقى حتفه وأصيب آخر، اليوم السبت، بعد هجوم بطائرة مسيرة أطلقتها القوات الأوكرانية.\n\nوجاء في بيان غرفة العمليات على منصة \"ماكس\": \"في مقاطعة بيلغورود، خلال هجوم للقوات المسلحة الأوكرانية، توفي شخص واحد وأصيب آخر\".\n\nوأوضح البيان أنه في بلدة أوكتيابرسكي، استهدفت طائرة مسيرة من طراز FPV سيارة، ما أسفر عن مقتل امرأة في مكان الحادث متأثرة بجروحها.\n\nوأشار البيان إلى أن الرجل المصاب نُقل إلى مستشفى أوكتيابرسك المركزي، ويعاني من إصابة دماغية رضحية مغلقة.\n\nيأتي هذا الهجوم في سياق التصعيد المستمر على الحدود الروسية الأوكرانية، حيث تتعرض المناطق الروسية المحاذية لأوكرانيا بين الحين والآخر لقصف وهجمات بالطائرات المسيرة.\n\nأعلنت السلطات الروسية في مقاطعة بيلغورود أن طائرة مسيرة تابعة للقوات الأوكرانية شنت هجوما على سيارة في قرية غولوفتشينو بالمقاطعة، ما أسفر عن مقتل شخص وإصابة آخر.\n\nصرّح الرئيس فلاديمير بوتين في اجتماع مع المفاوضين الأمريكيين، بأن روسيا لم تتفق مع أوكرانيا على وقف إطلاق نار أوسع نطاقا لمدة ثلاثة أيام لوقف الهجمات على العاصمتين.\n\nوجه المبعوث الخاص للرئيس الأمريكي ستيف ويتكوف الشكر إلى الرئيس الروسي فلاديمير بوتين على وقف الضربات لمدة ثلاثة أيام لإجراء المفاوضات، وذلك خلال لقائهما مساء السبت في الكرملين.\n\nأكد الرئيس الروسي فلاديمير بوتين أن موسكو ستبذل قصارى جهدها لضمان أمن المفاوضين الأمريكيين في موسكو، وذلك خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر."}, {"guid": "https://arabic.rt.com/funny/1829164-%D8%A8%D8%B9%D8%AF-%D8%A3%D8%B1%D8%A8%D8%B9%D8%A9-%D8%A3%D9%8A%D8%A7%D9%85-%D9%85%D9%86-%D8%B3%D9%82%D9%88%D8%B7%D9%87-%D9%81%D9%8A-%D8%A8%D8%A6%D8%B1-%D9%86%D9%87%D8%A7%D9%8A%D8%A9-%D9%85%D8%A3%D8%B3%D8%A7%D9%88%D9%8A%D8%A9-%D9%84%D9%84%D8%B7%D9%81%D9%84-%D8%A7%D9%84%D8%AC%D8%B2%D8%A7%D8%A6%D8%B1%D9%8A-%D8%A3%D9%8A%D9%88%D8%A8/", "title": "بعد أربعة أيام من سقوطه في بئر.. نهاية مأساوية للطفل الجزائري أيوب", "summary": "أعلنت مصالح الحماية المدنية الجزائرية مساء اليوم السبت، العثور على الطفل أيوب وانتشاله متوفيا، بعد أربعة أيام من سقوطه في بئر ارتوازية بولاية البيض جنوبي غرب البلاد.", "link": "https://arabic.rt.com/funny/1829164-%D8%A8%D8%B9%D8%AF-%D8%A3%D8%B1%D8%A8%D8%B9%D8%A9-%D8%A3%D9%8A%D8%A7%D9%85-%D9%85%D9%86-%D8%B3%D9%82%D9%88%D8%B7%D9%87-%D9%81%D9%8A-%D8%A8%D8%A6%D8%B1-%D9%86%D9%87%D8%A7%D9%8A%D8%A9-%D9%85%D8%A3%D8%B3%D8%A7%D9%88%D9%8A%D8%A9-%D9%84%D9%84%D8%B7%D9%81%D9%84-%D8%A7%D9%84%D8%AC%D8%B2%D8%A7%D8%A6%D8%B1%D9%8A-%D8%A3%D9%8A%D9%88%D8%A8/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c74484c59b758277c3194.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788639401, "detail": "أعلنت مصالح الحماية المدنية الجزائرية مساء اليوم السبت، العثور على الطفل أيوب وانتشاله متوفيا، بعد أربعة أيام من سقوطه في بئر ارتوازية بولاية البيض جنوبي غرب البلاد.\n\nوأكدت الحماية المدنية، في بيان لها، أنها سخرت، بالتنسيق مع السلطات المحلية ومختلف الهيئات والمتدخلين والخواص، كافة الإمكانيات البشرية والمادية لإنجاح عملية البحث والإنقاذ، قبل أن تنتهي جهود فرقها بالعثور على جثمان الطفل.\n\nوقدمت مصالح الحماية المدنية \"تعازيها الخالصة إلى عائلة الفقيد وذويه، راجية لهم الصبر والسلوان\".\n\nوكان الطفل أيوب، البالغ من العمر 10 سنوات، قد سقط يوم الأربعاء الماضي في بئر ارتوازية جافة، بالمكان المسمى قرية الركنة، في بلدية غسول بولاية البيض.\n\nوفور وقوع الحادثة، باشرت فرق الحماية المدنية المختصة عمليات البحث والإنقاذ، غير أن جهود البحث انتهت، اليوم، بعدما تم العثور على الطفل وانتشاله متوفيا، في مأساة خلفت حزنا واسعا في الجزائر.\n\nأفادت مصالح الحماية المدنية الجزائرية بأنها لا تزال تواصل جهودها المكثفة دون توقف لليوم الثالث لإنقاذ الطفل الذي سقط في بئر جافة بولاية البيض جنوب غرب البلاد."}, {"guid": "https://arabic.rt.com/features/1829130-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A-%D9%86%D8%B3%D9%8A%D8%B7%D8%B1-%D8%B9%D9%84%D9%89-%D9%85%D8%B6%D9%8A%D9%82-%D9%87%D8%B1%D9%85%D8%B2/", "title": "الحرس الثوري: نسيطر على مضيق هرمز", "summary": "أكد الحرس الثوري الإيراني أنه ما زال يسيطر على مضيق هرمز بالكامل، وشدد على أنه لن يسمح بعبور السفن دون تنسيق مع قواته..", "link": "https://arabic.rt.com/features/1829130-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A-%D9%86%D8%B3%D9%8A%D8%B7%D8%B1-%D8%B9%D9%84%D9%89-%D9%85%D8%B
