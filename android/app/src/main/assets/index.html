-ar-all-1125-rdf", "title": "ساكسونيا-أنهالت في اختبار حاسم.. ولاية صغيرة بثقل سياسي كبير", "summary": "تتميز ولاية ساكسونيا أنهالت بضعف بنيتها التحتية وبطابعها الريفي. فهل يمكن أن تصبح أول ولاية اتحادية يحكمها حزب البديل الذي ينتمي جزئيا إلى اليمين المتطرف؟", "link": "https://www.dw.com/ar/ساكسونيا-أنهالت-في-اختبار-حاسم-ولاية-صغيرة-بثقل-سياسي-كبير/a-78545326?maca=ara-rss-ar-all-1125-rdf", "image": "", "category": "سياسة", "source_id": "dw-arabic", "source_name": "DW عربي", "source_cat": "دولية", "published": 1788628680, "detail": ""}, {"guid": "https://arabic.rt.com/world/1829116-%D9%85%D8%B5%D8%B1%D8%B9-11-%D8%B4%D8%AE%D8%B5%D8%A7-%D9%81%D9%8A-%D8%A7%D9%86%D9%81%D8%AC%D8%A7%D8%B1-%D8%B5%D9%87%D8%B1%D9%8A%D8%AC-%D9%88%D9%82%D9%88%D8%AF-%D8%BA%D8%B1%D8%A8-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D9%81%D9%8A%D8%AF%D9%8A%D9%88/", "title": "مصرع 11 شخصا في انفجار صهريج وقود غرب إيران (فيديو)", "summary": "أعلنت وكالة الأنباء الإيرانية، اليوم السبت، مصرع 11 شخصا في انفجار صهريج وقود غرب البلاد.", "link": "https://arabic.rt.com/world/1829116-%D9%85%D8%B5%D8%B1%D8%B9-11-%D8%B4%D8%AE%D8%B5%D8%A7-%D9%81%D9%8A-%D8%A7%D9%86%D9%81%D8%AC%D8%A7%D8%B1-%D8%B5%D9%87%D8%B1%D9%8A%D8%AC-%D9%88%D9%82%D9%88%D8%AF-%D8%BA%D8%B1%D8%A8-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D9%81%D9%8A%D8%AF%D9%8A%D9%88/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c480d42360444ee1c660c.jpg", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788628668, "detail": "وقال رئيس إدارة الإطفاء والسلامة في بلدية سنندج مرتضى كرامي لوكالة \"إرنا\": \"عقب هذا الحادث، تم إرسال العديد من فرق الإطفاء من سنندج إلى الموقع للسيطرة على الحريق ومنع انتشاره\".\n\nوأضاف: \"وقع الحادث قبل دقائق، وفور تلقي البلاغ، تم إرسال فرق إطفاء من مختلف أنحاء مدينة سنندج إلى الموقع\".\n\nوتابع: \"نظرا لأن حمولة الشاحنة هي وقود، فإن عمليات مكافحة الحريق تُجرى بدقة عالية، وتبذل فرق الإطفاء قصارى جهدها للسيطرة على النيران ومنع انتشار الحريق ووقوع حوادث جانبية\".\n\nأكد كرامي أنه \"سيتم الإعلان عن مزيد من التفاصيل حول سبب الحادث ومدى الأضرار المحتملة وحالة الركاب\"، بالإضافة إلى سير عمليات مكافحة الحرائق\".\n\nأعلنت وكالة \"تسنيم\" الإيرانية نقلا عن مصدر، اليوم الأحد، اندلاع حريق على متن سفينة عند مدخل مضيق هرمز.\n\nأعلنت شركة \"أدنوك\" الإماراتية تعرض سفينة تابعة لها للاستهداف بصاروخ أثناء عبورها مضيق هرمز في الساعات الأولى من صباح يوم السبت.\n\nأفادت وسائل إعلام إيرانية اليوم السبت استنادا إلى صور من الأقمار الصناعية بوقوع حريق على متن ناقلة نفط في المسار الجنوبي لمضيق هرمز."}, {"guid": "https://arabic.rt.com/prg/%D9%85%D9%86-%D8%A5%D8%AB%D9%8A%D9%88%D8%A8%D9%8A%D8%A7-%D9%84%D8%BA%D8%B2%D8%A9-%D9%88%D8%B9%D9%88%D8%AF-%D8%AA%D8%B1%D8%A7%D9%85%D8%A8-%D9%84%D9%85%D8%B5%D8%B1-%D8%AA%D8%AA%D8%A3%D8%B1%D8%AC%D8%AD-1829117/%D8%A7%D8%B3%D8%AA%D9%88%D8%AF%D9%8A%D9%88-%D8%A7%D9%84%D9%82%D8%A7%D9%87%D8%B1%D8%A9/", "title": "من إثيوبيا لغزة.. وعود ترامب لمصر تتأرجح", "summary": "", "link": "https://arabic.rt.com/prg/%D9%85%D9%86-%D8%A5%D8%AB%D9%8A%D9%88%D8%A8%D9%8A%D8%A7-%D9%84%D8%BA%D8%B2%D8%A9-%D9%88%D8%B9%D9%88%D8%AF-%D8%AA%D8%B1%D8%A7%D9%85%D8%A8-%D9%84%D9%85%D8%B5%D8%B1-%D8%AA%D8%AA%D8%A3%D8%B1%D8%AC%D8%AD-1829117/%D8%A7%D8%B3%D8%AA%D9%88%D8%AF%D9%8A%D9%88-%D8%A7%D9%84%D9%82%D8%A7%D9%87%D8%B1%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c4a0042360444ee1c6610.png", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788628344, "detail": "بعد أن تحدث الرئيس الأمريكي أكثر من مرة عن دور أمريكي في بناء سد النهضة منتقدا حرمان مصر من حقها العادل في مياه النيل، أبرمت الولايات المتحدة قبل أيام قليلة اتفاق شراكة استراتيجية مع إثيوبيا، ليتساءل البعض عن قدرة الولايات المتحدة على لعب دور الوسيط النزيه بين مصر وإثيوبيا، ويتمادى البعض الآخر ليعتبر الاتفاق تعبيرا عن غضب أمريكي تجاه القاهرة التي تباينت مواقفها مع واشنطن في ملفات عدة، أبرزها الموقف من تهجير الفلسطينيين، وربما زاده التقارب السياسي والعسكري مع الصين الذي توجته مؤخرًا زيارة الرئيس الصيني إلى مصر. فبين الحقيقة والمبالغات؛ كيف يبدو مستقبل العلاقات المصرية الأمريكية التي اتخذت شكلاً خاصاً منذ اتفاقية السلام بين مصر وإسرائيل؟ وكيف توازن مصر علاقاتها بين الشرق والغرب في عالم يبدو أنه يودع سيادة القطب الواحد؟ هذا ما أناقشه مع ضيفنا في الاستديو الدكتور أحمد يوسف أستاذ العلوم السياسية والمدير السابق لمعهد الدراسات العربية التابع لجامعة الدول العربية."}, {"guid": "https://arabic.rt.com/world/1829115-%D9%87%D9%8A%D8%BA%D8%B3%D9%8A%D8%AB-%D9%8A%D8%AD%D8%B0%D8%B1-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D8%A7%D8%B3%D8%AA%D9%87%D8%AF%D8%A7%D9%81-%D8%A7%D9%84%D8%B3%D9%81%D9%86-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D8%A9-%D8%B3%D9%8A%D9%82%D8%A7%D8%A8%D9%84-%D8%A8%D8%B6%D8%B1%D8%A8-%D8%A3%D8%B3%D8%B7%D9%88%D9%84-%D9%86%D8%A7%D9%82%D9%84%D8%A7%D8%AA-%D8%A7%D9%84%D9%86%D9%81%D8%B7-%D8%A7%D9%84%D8%A5%D9%8A%D8%B1%D8%A7%D9%86%D9%8A/", "title": "هيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني", "summary": "وجّه وزير الحرب الأمريكي بيت هيغسيث تحذيرا شديد اللهجة إلى إيران، ملوحا بعواقب عسكرية واقتصادية في حال استهداف السفن التابعة للبحرية الأمريكية في المنطقة.", "link": "https://arabic.rt.com/world/1829115-%D9%87%D9%8A%D8%BA%D8%B3%D9%8A%D8%AB-%D9%8A%D8%AD%D8%B0%D8%B1-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D8%A7%D8%B3%D8%AA%D9%87%D8%AF%D8%A7%D9%81-%D8%A7%D9%84%D8%B3%D9%81%D9%86-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D8%A9-%D8%B3%D9%8A%D9%82%D8%A7%D8%A8%D9%84-%D8%A8%D8%B6%D8%B1%D8%A8-%D8%A3%D8%B3%D8%B7%D9%88%D9%84-%D9%86%D8%A7%D9%82%D9%84%D8%A7%D8%AA-%D8%A7%D9%84%D9%86%D9%81%D8%B7-%D8%A7%D9%84%D8%A5%D9%8A%D8%B1%D8%A7%D9%86%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c4a4642360444df6c9412.jpg", "category": "اقتصاد", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788628076, "detail": "وجّه وزير الحرب الأمريكي بيت هيغسيث تحذيرا شديد اللهجة إلى إيران، ملوحا بعواقب عسكرية واقتصادية في حال استهداف السفن التابعة للبحرية الأمريكية في المنطقة.\n\nوقال هيغسيث، في منشور عبر منصة \"إكس\"، إن الولايات المتحدة سترد باستهداف ناقلات النفط الإيرانية في حال تعرض سفنها لهجوم، مضيفا أن على إيران تجنب إطلاق النار على القطع البحرية الأمريكية.\n\nوأشار وزير الحرب الأمريكي إلى ما وصفه بضعف القدرات الدفاعية للأسطول الإيراني من ناقلات النفط، مدعيا أن هذه السفن تفتقر إلى الحماية الكافية من القوات البحرية والجوية الإيرانية.\n\nوأضاف هيغسيث أن الطائرات والسفن والغواصات الأمريكية قادرة على استهداف ناقلات النفط الإيرانية ضمن نطاق عمليات القيادة المركزية الأمريكية \"سنتكوم\" والقيادة الأمريكية في منطقة المحيطين الهندي والهادئ.\n\nوتزامن منشور هيغسيث مع إعادة نشره بيانا صادرا عن القيادة المركزية الأمريكية، وجه رسالة إلى الحرس الثوري الإيراني، ملوحا بفرض تكلفة اقتصادية على طهران في حال استهداف السفن الأمريكية.\n\nوجاء في الرسالة أن استهداف سفينتين أمريكيتين سيقابله استهداف ثلاث سفن إيرانية، مؤكدة أن القوات الأمريكية لن تتردد في الدفاع عن أفرادها ومصالحها، وأنها مستعدة، إذا اقتضى الأمر، لاستهداف ما وصفته بالأسطول الإيراني المحدود.\n\nكشف مسؤولون أمريكيون مطلعون عن إخضاع نحو 50 من كبار ضباط وموظفي هيئة الأركان المشتركة في الجيش الأمريكي لاختبارات كشف الكذب (بوليغراف) خلال الشهر الماضي.\n\nهاجمت قوات القيادة المركزية الأمريكية (سنتكوم) ثلاث ناقلات نفط خام إيرانية، ردا على قيام فيلق الحرس الثوري الإيراني بإطلاق صواريخ باليستية باتجاه مدمرتين تابعتين للبحرية الأمريكية.\n\nأظهرت بيانات شحن أولية أن أربع سفن لشحن السلع الأولية عبرت مضيق هرمز أمس الخميس، بانخفاض عن تسع ​سفن في اليوم السابق، وبما يقل كثيرا عن متوسط 10 أيام ‌البالغ نحو 15 سفينة.\n\nاقترح الرئيس الأميركي دونالد ترامب تغيير اسم مضيق هرمز إلى \"مضيق ترامب\"، في تعليق ساخر نشره الأربعاء على منصته في تروث سوشيال.\n\nأعلن الحرس الثوري الإيراني فجر اليوم الأربعاء، تنفيذ هجوم صاروخي باليستي مكثف على حظائر الطائرات المسيرة البعيدة المدى من طراز RQ-4 وMQ-9 في قاعدة \"الأمير حسن\" بالأردن."}, {"guid": "https://arabic.rt.com/world/1829108-%D8%A7%D9%84%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%B1%D9%88%D8%B3%D9%8A-%D9%8A%D9%82%D8%B5%D9%81-%D8%B3%D9%81%D9%8A%D9%86%D8%A9-%D8%B4%D8%AD%D9%86-%D8%AA%D8%AD%D9%85%D9%84-%D9%85%D8%B9%D8%AF%D8%A7%D8%AA-%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9-%D9%88%D8%AA%D9%82%D9%86%D9%8A%D8%A9-%D9%84%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7-%D9%81%D9%8A-%D9%85%D9%8A%D9%86%D8%A7%D8%A1-%D8%AA%D8%B4%D9%8A%D8%B1%D9%86%D9%88%D9%85%D9%88%D8%B1%D8%B3%D9%83/", "title": "الجيش الروسي يقصف سفينة شحن تحمل معدات عسكرية وتقنية لأوكرانيا في ميناء تشيرنومورسك", "summary": "أعلنت وزارة الدفاع الروسية أن وحداتها قصفت سفينة شحن جاف محملة بمعدات عسكرية وتقنية من دول غربية للقوات الأوكرانية في ميناء تشيرنومورسك بمقاطعة أوديسا.", "link": "https://arabic.rt.com/world/1829108-%D8%A7%D9%84%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%B1%D9%88%D8%B3%D9%8A-%D9%8A%D9%82%D8%B5%D9%81-%D8%B3%D9%81%D9%8A%D9%86%D8%A9-%D8%B4%D8%AD%D9%86-%D8%AA%D8%AD%D9%85%D9%84-%D9%85%D8%B9%D8%AF%D8%A7%D8%AA-%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9-%D9%88%D8%AA%D9%82%D9%86%D9%8A%D8%A9-%D9%84%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7-%D9%81%D9%8A-%D9%85%D9%8A%D9%86%D8%A7%D8%A1-%D8%AA%D8%B4%D9%8A%D8%B1%D9%86%D9%88%D9%85%D9%88%D8%B1%D8%B3%D9%83/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c44314c59b7106924f36a.jpg", "category": "تكنولوجيا", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788627981, "detail": "أعلنت وزارة الدفاع الروسية أن وحداتها قصفت سفينة شحن جاف محملة بمعدات عسكرية وتقنية من دول غربية للقوات الأوكرانية في ميناء تشيرنومورسك بمقاطعة أوديسا.\n\nوجاء في بيان الوزارة: \"تم في ميناء تشيرنومورسك بمقاطعة أوديسا استهداف سفينة بحرية من طراز (سفينة شحن جاف) محملة بمعدات عسكرية وتقنية، كانت الدول الغربية قد وردتها للقوات المسلحة الأوكرانية\".\n\nالدفاع الروسية: دمرنا مستودعات معدات عسكرية أوكرانية في ميناء أوديسا ووفقا للمعلومات المتوفرة، تم استهداف السفينة باستخدام طائرات مسيرة انتحارية نفاثة من طراز Geran-4 Seeker.\n\nووفقا لبيان الوزارة، لم يقتصر الأمر على سفينة واحدة؛ بل استهدفت الضربات سفينتي شحن جاف وسفينة حاويات داخل ميناء تشيرنومورسك، بالإضافة إلى استهداف سفينة شحن أخرى على رصيف ميناء أوديسا.\n\nبعد استهداف نظام كييف للمرافق الحيوية المدنية والمناطق السكنية في مختلف مناطق روسيا، بدأ الجيش الروسي بتكثيف ضرباته على البنية التحتية للموانئ الأوكرانية في الأسابيع الأخيرة، في محاولة لتعطيل خطوط الإمداد العسكرية وإضعاف القدرات اللوجستية للجيش الأوكراني.\n\nوتأتي هذه الضربات في سياق استراتيجية روسية تهدف إلى تعطيل قدرة أوكرانيا على استقبال الأسلحة والمعدات العسكرية من خلال موانئها الرئيسية. وترى روسيا، أن القوات الأوكرانية تستخدم الطريق البحري كقناة لتوصيل الأسلحة على مدار الساعة، ووفقا للمعلومات المتوفرة، خلال ثلاث سنوات مرت حوالي ثمانية آلاف سفينة محملة بالبضائع العسكرية عبر موانئ أوديسا."}, {"guid": "https://www.bbc.com/arabic/articles/cwyzn0mezleo#0", "title": "لماذا تنقل الدول الأوربية ذهبها من أمريكا الشمالية؟", "summary": "نقلت هولندا 86 طناً من هذا المعدن الثمين البراق، فما الذي يحدث؟", "link": "https://www.bbc.com/arabic/articles/cwyzn0mezleo?at_medium=RSS&at_campaign=rss", "image": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/69ed/live/1f74ae20-a870-11f1-bbad-43eaf67b94b6.jpg", "category": "أخبار", "source_id": "bbc-arabic", "source_name": "بي بي سي عربي", "source_cat": "دولية", "published": 1788627240, "detail": "BBC News, عربيإذهب الى المحتوىرئيسيةشاهداستمعأقسامرئيسيةأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتلماذا تنقل الدول الأوربية ذهبها من أمريكا الشمالية؟صدر الصورة، Getty Images\n\nعندما أعلن المصرف المركزي الهولندي هذا الأسبوع نقل أطنان من احتياطي البلاد من الذهب خارج أمريكا الشمالية، قال إن هذه الخطوة ستجعله \"أكثر استعداداً لمواجهة الأزمات الحادة\".\n\nوأوضح المصرف أنه نقل إلى لندن نحو 86 طناً من أصل قرابة 313 طناً كانت مودعة في الولايات المتحدة وكندا، وذلك \"في ظل تصاعد الاضطرابات الجيوسياسية\"، بما يتيح استخدام الذهب فوراً عند وقوع الأزمات.\n\nوكان من الطبيعي أن يثير هذا الإعلان تساؤلات: لماذا أقدمت هولندا على هذه الخطوة؟ وهل تتوقع صدمة اقتصادية كبرى تلوح في الأفق؟\n\nلا يبدو أن الأمر كذلك. غير أن القرار يعكس بوضوح ما يشهده العالم من اضطراب وضبابية، إذ دفعت الحروب التجارية والعسكرية دولاً عدة إلى اتخاذ مزيد من الاحتياطات وتقريب مخزوناتها من الذهب إلى أراضيها.\n\nوفي وقت سابق من هذا العام، أعلنت فرنسا إعادة احتياطياتها من الذهب من الولايات المتحدة إلى أراضيها. أما المصرف المركزي الألماني، البوندسبانك، فنقل خلال عدة سنوات انتهت في عام 2016 أكثر من 216 طناً من الذهب كانت مودعة في الخارج، منها 111 طناً في نيويورك و105 أطنان في باريس.\n\nوليست هذه الاستراتيجية جديدة، بل سبق اللجوء إليها في فترات الاضطراب العالمي. وقال لينا توماس ودان سترويفن، وهما محللا أبحاث في غولدمان ساكس: \"نقلت بعض المصارف المركزية الأوروبية جزءاً من حيازاتها من الذهب إلى نيويورك خلال الحرب الباردة\".\n\nوقال جوزيف كافاتوني، كبير استراتيجيي السوق في مجلس الذهب العالمي، لبي بي سي، إن الحروب والتوترات التجارية تؤثر في بعض هذه القرارات، لكنها لا تتصدر دوافعها.\n\nوأضاف أن عوامل أخرى تؤدي دوراً في ذلك، من بينها التضخم وأسعار الفائدة، فضلاً عن الحاجة إلى إيداع الذهب في مكان يتيح تداوله سريعاً."}, {"guid": "https://arabic.rt.com/culture/1829103-%D8%B1%D9%85%D8%B3%D9%8A%D8%B3-%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A-%D9%87%D9%88-%D9%81%D8%B1%D8%B9%D9%88%D9%86-%D9%85%D9%88%D8%B3%D9%89-%D9%88%D8%B2%D9%8A%D8%B1-%D8%A2%D8%AB%D8%A7%D8%B1-%D9%85%D8%B5%D8%B1-%D8%A7%D9%84%D8%A3%D8%B3%D8%A8%D9%82-%D9%8A%D8%AA%D8%AD%D8%AF%D8%AB-%D8%B9%D9%86-4-%D8%B4%D9%88%D8%A7%D9%87%D8%AF-%D8%AA%D8%A7%D8%B1%D9%8A%D8%AE%D9%8A%D8%A9/", "title": "\"رمسيس الثاني هو فرعون موسى\".. وزير آثار مصر الأسبق يتحدث عن 4 شواهد تاريخية", "summary": "ما تزال هوية فرعون الذي عاصر النبي موسى واحدة من أكثر القضايا إثارة للجدل في الدراسات التاريخية والأثرية، في ظل عدم وجود نقش أو وثيقة أثرية تحسم بصورة قاطعة اسم الفرعون المقصود.", "link": "https://arabic.rt.com/culture/1829103-%D8%B1%D9%85%D8%B3%D9%8A%D8%B3-%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A-%D9%87%D9%88-%D9%81%D8%B1%D8%B9%D9%88%D9%86-%D9%85%D9%88%D8%B3%D9%89-%D9%88%D8%B2%D9%8A%D8%B1-%D8%A2%D8%AB%D8%A7%D8%B1-%D9%85%D8%B5%D8%B1-%D8%A7%D9%84%D8%A3%D8%B3%D8%A8%D9%82-%D9%8A%D8%AA%D8%AD%D8%AF%D8%AB-%D8%B9%D9%86-4-%D8%B4%D9%88%D8%A7%D9%87%D8%AF-%D8%AA%D8%A7%D8%B1%D9%8A%D8%AE%D9%8A%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c4482423604465c58d70f.png", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788627153, "detail": "ما تزال هوية فرعون الذي عاصر النبي موسى واحدة من أكثر القضايا إثارة للجدل في الدراسات التاريخية والأثرية، في ظل عدم وجود نقش أو وثيقة أثرية تحسم بصورة قاطعة اسم الفرعون المقصود.\n\nوبينما تعددت الترجيحات بين علماء التاريخ والآثار، طرح الدكتور ممدوح الدماطي، وزير الآثار المصري الأسبق، رؤية ترجح أن يكون رمسيس الثاني هو فرعون موسى، مستندا إلى مجموعة من الشواهد الزمنية والجغرافية والدينية والأثرية.\n\nإعلام إسرائيلي: تمثال رمسيس الثاني تربطه علاقة بقصة بني إسرائيل في مصر وأكد الدماطي، في تصريحات تلفزيونية، أن الحديث عن رمسيس الثاني لا يمثل \"دليلا أثريا قاطعا\" على هوية فرعون موسى، وإنما هو ترجيح علمي يقوم على مقارنة الرواية الدينية بالمعطيات التاريخية والأثرية المتاحة، ومحاولة اختبار مدى توافقها مع شخصية أحد أبرز ملوك مصر القديمة.\n\nوأوضح الدماطي أن ترجيحه يستند إلى 4 شواهد رئيسية، يأتي في مقدمتها عامل الزمن وطول فترة حكم الفرعون.\n\nفترة حكم طويلة تتوافق مع التسلسل الزمني للقصة\n\nيرى الدماطي أن التسلسل الزمني لقصة موسى عليه السلام يفرض، وفق قراءته، أن يكون الفرعون الذي عاصره قد حكم مصر فترة طويلة نسبيا.\n\nفالقصة، بحسب هذا التصور، تبدأ بولادة موسى ونشأته في قصر فرعون، ثم خروجه من مصر وإقامته خارجها نحو 10 سنوات، قبل أن يعود إليها ويبدأ دعوته ومواجهته لفرعون. وبالتالي، فإن وجود فرعون واحد في مراحل متعاقبة من القصة يفترض أن يكون صاحب فترة حكم ممتدة.\n\nوعند النظر إلى ملوك الدولة الحديثة الذين امتدت فترات حكمهم لعقود طويلة، يبرز اسمان، هما تحتمس الثالث ورمسيس الثاني.\n\nويشير الدماطي إلى أن فترة حكم تحتمس الثالث امتدت لنحو 54 عاما، إلا أن جزءا كبيرا من بدايتها ارتبط بفترة الحكم المشترك مع الملكة حتشبسوت، وهو ما يجعله، وفق هذا الطرح، أقل توافقا مع التسلسل الزمني للقصة.\n\nفي المقابل، حكم رمسيس الثاني مصر لنحو 66 عاما، وهي واحدة من أطول فترات الحكم في تاريخ مصر القديمة، الأمر الذي يجعله أكثر ملاءمة لهذا التصور الزمني، بحسب قوله.\n\nواعتبر الدماطي أن موقع العاصمة التي ارتبطت برمسيس الثاني يمثل قرينة مهمة في هذا الترجيح.\n\nفقد اتخذ رمسيس الثاني من مدينة \"بر-رمسيس\" عاصمة ومركزا رئيسيا لحكمه في منطقة شرق الدلتا، وهي المنطقة التي ارتبطت بمظاهر مهمة من الوجود المصري القديم في شمال البلاد.\n\nويستند هذا الطرح إلى أن الرواية القرآنية لقصة موسى تتحدث عن مصر بوصفها مملكة ذات أنهار ومياه، وهو ما يتوافق جغرافيا مع طبيعة منطقة الدلتا، حيث تتفرع مياه النيل وتنتشر الفروع والمجاري المائية.\n\nومن هنا يرى الدماطي أن وجود مركز الحكم في منطقة شرق الدلتا خلال عصر رمسيس الثاني يمثل قرينة جغرافية إضافية عند مقارنته بتفاصيل قصة موسى.\n\nأما الشاهد الثالث فيتعلق بصورة الملك ومكانته الدينية في مصر القديمة، وبخاصة مظاهر تأليه رمسيس الثاني لنفسه.\n\nويشير الدماطي إلى أن رمسيس الثاني كان من أكثر ملوك مصر القديمة ارتباطا بفكرة الملك الإله، وأن هذه الصورة تظهر بصورة واضحة في آثاره ومعابده، ومن أبرزها معبد أبو سمبل في جنوب مصر.\n\nويضم المعبد تماثيل ضخمة لرمسيس الثاني، وتظهر مكانته إلى جوار الآلهة المصرية الكبرى، ومنها آمون رع ورع حور آختي وبتاح.\n\nويرى الدماطي أن هذه الصورة الاستثنائية للملك، وارتباطه المباشر بالرموز والممارسات الدينية، تجعل شخصية رمسيس الثاني متوافقة مع الصورة التي تقدمها النصوص الدينية عن فرعون الذي تجاوز حدود السلطة السياسية إلى ادعاء مكانة إلهية.\n\nويضع الدماطي الشاهد الرابع في إطار أكثر ارتباطا بالممارسات الدينية داخل معبد أبو سمبل، مشيرا إلى طقوس مرتبطة بإضفاء صفة إلهية على تمثال الملك.\n\nوتكتسب هذه النقطة أهميتها من طبيعة العقيدة المصرية القديمة التي تعاملت مع الملك باعتباره شخصية ذات مكانة دينية استثنائية، إلى جانب دوره السياسي باعتباره حاكم البلاد.\n\nوأوضح أن معبد أبو سمبل شهد طقوسا أثرية تعرف بـ\"الجب إتن\" أي الاتحاد بأشعة الشمس، والتي تجرى لبعث الحياة الإلهية في تمثال الملك.\n\nوأضاف أن الأغرب أثريا هو وجود نقوش داخل المعبد تصور رمسيس الثاني وهو يقدم القرابين لنفسه كإله جالس على العرش، في تجسيد حي لظاهرة التعالي والتأليه التي وردت في النصوص الدينية.\n\nزعم إعلام إسرائيلي أن اكتشافا أثريا جديدا في دلتا مصر لتمثال ضخم لرمسيس الثاني يعيد إلى الواجهة النقاشات التاريخية والدينية حول هوية الفرعون الذي عاصر النبي موسى.\n\nانتهت البعثة الأثرية الأمريكية التابعة لجامعة نيويورك من أعمال ترميم رأس تمثال جرانيتي للملك رمسيس الثاني داخل معبده بمدينة أبيدوس بمحافظة سوهاج.\n\nكشف عالم المصريات ووزير الآثار الأسبق زاهي حواس كواليس عملية نقل تمثال رمسيس الثاني الضخم من الميدان الذي يحمل اسمه وسط القاهرة إلى المتحف المصري الكبير.\n\nيمكن رؤية الوجه \"الوسيم\" لأقوى فرعون مصر القديمة، رمسيس الثاني، لأول مرة منذ 3200 عام بفضل إعادة بناء علمية جديدة."}, {"guid": "https://arabic.rt.com/middle_east/1829109-%D8%A7%D9%84%D8%B5%D8%AD%D8%A9-%D8%A7%D9%84%D9%84%D8%A8%D9%86%D8%A7%D9%86%D9%8A%D8%A9-%D8%AA%D9%83%D8%B4%D9%81-%D8%AD%D8%B5%D9%8A%D9%84%D8%A9-%D8%B6%D8%AD%D8%A7%D9%8A%D8%A7-%D8%A7%D9%84%D9%87%D8%AC%D9%85%D8%A7%D8%AA-%D8%A7%D9%84%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84%D9%8A%D8%A9-%D8%A7%D9%84%D9%85%D8%B3%D8%AA%D9%85%D8%B1%D8%A9-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D8%A8%D9%84%D8%A7%D8%AF/", "title": "الصحة اللبنانية تكشف حصيلة ضحايا الهجمات الإسرائيلية المستمرة على البلاد", "summary": "كشفت وزارة الصحة اللبنانية في بيان لها اليوم السبت، حصيلة ضحايا العدوان الإسرائيلي على البلاد منذ 2 مارس الماضي.", "link": "https://arabic.rt.com/middle_east/1829109-%D8%A7%D9%84%D8%B5%D8%AD%D8%A9-%D8%A7%D9%84%D9%84%D8%A8%D9%86%D8%A7%D9%86%D9%8A%D8%A9-%D8%AA%D9%83%D8%B4%D9%81-%D8%AD%D8%B5%D9%8A%D9%84%D8%A9-%D8%B6%D8%AD%D8%A7%D9%8A%D8%A7-%D8%A7%D9%84%D9%87%D8%AC%D9%85%D8%A7%D8%AA-%D8%A7%D9%84%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84%D9%8A%D8%A9-%D8%A7%D9%84%D9%85%D8%B3%D8%AA%D9%85%D8%B1%D8%A9-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D8%A8%D9%84%D8%A7%D8%AF/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c44aa42360444026c69c0.jpg", "category": "صحة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788627019, "detail": "الكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nكشفت وزارة الصحة اللبنانية في بيان لها اليوم السبت، حصيلة ضحايا العدوان الإسرائيلي على البلاد منذ 2 مارس الماضي.\n\nوجاء في البيان: \"مقتل 4358 وجرح 12359 من جراء العدوان الإسرائيلي على لبنان منذ 2 مارس الماضي حتى 5 سبتمبر الحالي 2026\".\n\nوأضاف البيان: \"بذلك، ترتفع الحصيلة الإجمالية للعدوان منذ 8 أكتوبر 2023 حتى اليوم إلى 8921 شهيدا و30561 جريحا\".\n\nومنذ الثاني من مارس الماضي، صعدت إسرائيل عدوانها على لبنان مستهدفة البلدات والقرى والمدن اللبنانية والأعيان المدنية، ما أسفر عن مئات القتلى وآلاف الجرحى ونزوح نحو مليون ونصف المليون مواطن لبناني غالبيتهم غير مسجلين في مراكز الإيواء.\n\nقالت وزارة الصحة اللبنانية إن الحصيلة التراكمية لضحايا العدوان الإسرائيلي ارتفعت إلى 16612 شخصا.\n\nحذفت وزارة الخارجية الإسرائيلية، مساء يوم الأحد، خريطة تضم جنوب لبنان إلى الأراضي الإسرائيلية من صفحتها الرسمية الناطقة باللغة الإنجليزية على منصة \"إكس\".\n\nأعلنت وزارة الصحة اللبنانية أن عدد ضحايا الهجمات الإسرائيلية على لبنان منذ 2 مارس بلغ 4329 قتيلا و12233 جريحا، بحسب أحدث الإحصاءات الصادرة عنها."}, {"guid": "https://arabic.rt.com/sport/1829106-%D9%87%D8%A7%D9%84%D8%A7%D9%86%D8%AF-%D9%8A%D9%82%D9%88%D8%AF-%D9%85%D8%A7%D9%86%D8%B4%D8%B3%D8%AA%D8%B1-%D8%B3%D9%8A%D8%AA%D9%8A-%D9%84%D9%84%D9%81%D9%88%D8%B2-%D8%B9%D9%84%D9%89-%D9%83%D9%88%D9%81%D9%86%D8%AA%D8%B1%D9%8A-%D9%88%D8%A7%D8%B9%D8%AA%D9%84%D8%A7%D8%A1-%D9%82%D9%85%D8%A9-%D8%A7%D9%84%D8%AF%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D8%A5%D9%86%D8%AC%D9%84%D9%8A%D8%B2%D9%8A/", "title": "هالاند يقود مانشستر سيتي للفوز على كوفنتري واعتلاء قمة الدوري الإنجليزي", "summary": "واصل فريق مانشستر سيتي سلسلة انتصاراته في الدوري الإنجليزي الممتاز لكرة القدم بعد فوزه الصعب على ضيفه كوفنتري سيتي بنتيجة 1-0 ضمن منافسات الجولة الثالثة من المسابقة، اليوم السبت.", "link": "https://arabic.rt.com/sport/1829106-%D9%87%D8%A7%D9%84%D8%A7%D9%86%D8%AF-%D9%8A%D9%82%D9%88%D8%AF-%D9%85%D8%A7%D9%86%D8%B4%D8%B3%D8%AA%D8%B1-%D8%B3%D9%8A%D8%AA%D9%8A-%D9%84%D9%84%D9%81%D9%88%D8%B2-%D8%B9%D9%84%D9%89-%D9%83%D9%88%D9%81%D9%86%D8%AA%D8%B1%D9%8A-%D9%88%D8%A7%D8%B9%D8%AA%D9%84%D8%A7%D8%A1-%D9%82%D9%85%D8%A9-%D8%A7%D9%84%D8%AF%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D8%A5%D9%86%D8%AC%D9%84%D9%8A%D8%B2%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c43194c59b7133d4bc83d.png", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788626536, "detail": "الكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nواصل فريق مانشستر سيتي سلسلة انتصاراته في الدوري الإنجليزي الممتاز لكرة القدم بعد فوزه الصعب على ضيفه كوفنتري سيتي بنتيجة 1-0 ضمن منافسات الجولة الثالثة من المسابقة، اليوم السبت.\n\nوسجل المهاجم النرويجي إرلينغ هالاند الهدف الوحيد في الدقيقة 26 من المباراة التي أقيمت على ملعب \"الاتحاد\".\n\nوبذلك يحقق السيتي فوزه الثالث تواليا، ليرفع رصيده إلى 9 نقاط، ويعتلي الصدارة مؤقتا، لترتفع معنويات الفريق قبل مواجهة خارج الأرض أمام بورتو البرتغالي يوم الثلاثاء المقبل في دوري أبطال أوروبا.\n\nوبعدها يحل مانشستر سيتي ضيفا على جاره مانشستر يونايتد في ديربي المدينة يوم الأحد المقبل على ملعب \"أولد ترافورد.\"\n\nأما كوفنتري سيتي بقيادة مدربه فرانك لامبارد، فقد تلقى خسارته الثالثة تواليا، ليبقى بلا رصيد في المركز 19 وقبل الأخير، وسيلعب في الجولة القادمة على أرضه أمام برايتون.\n\nحقق ليفربول انتصاره الأول في الدوري الإنجليزي الممتاز لكرة القدم هذا الموسم بتغلبه على مضيفه إيبسويتش تاون بهدفين دون رد مساء الجمعة، في الجولة الثالثة من \"البريميرليغ\"."}, {"guid": "https://arabic.rt.com/world/1829098-%D9%88%D8%B2%D9%8A%D8%B1-%D8%AE%D8%A7%D8%B1%D8%AC%D9%8A%D8%A9-%D9%83%D9%88%D8%A8%D8%A7-%D9%8A%D8%AA%D9%87%D9%85-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84-%D8%A8%D8%A7%D8%B1%D8%AA%D9%83%D8%A7%D8%A8-%D9%81%D8%B8%D8%A7%D8%A6%D8%B9-%D9%88%D8%AD%D8%B4%D9%8A%D8%A9-%D8%A8%D8%AD%D9%82-%D8%A7%D9%84%D8%A3%D8%B7%D9%81%D8%A7%D9%84-%D9%88%D8%A7%D9%84%D9%85%D8%AF%D9%86%D9%8A%D9%8A%D9%86-%D9%81%D9%8A-%D9%84%D8%A8%D9%86%D8%A7%D9%86/", "title": "وزير خارجية كوبا يتهم إسرائيل بارتكاب فظائع وحشية بحق الأطفال والمدنيين في لبنان", "summary": "اتهم وزير الخارجية الكوبي برونو رودريغيز، اليوم، إسرائيل بارتكاب أفعال \"وحشية\" بحق المدنيين في لبنان، مطالبا إياها بوقف قتل الأطفال والقاصرين.", "link": "https://arabic.rt.com/world/1829098-%D9%88%D8%B2%D9%8A%D8%B1-%D8%AE%D8%A7%D8%B1%D8%AC%D9%8A%D8%A9-%D9%83%D9%88%D8%A8%D8%A7-%D9%8A%D8%AA%D9%87%D9%85-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84-%D8%A8%D8%A7%D8%B1%D8%AA%D9%83%D8%A7%D8%A8-%D9%81%D8%B8%D8%A7%D8%A6%D8%B9-%D9%88%D8%AD%D8%B4%D9%8A%D8%A9-%D8%A8%D8%AD%D9%82-%D8%A7%D9%84%D8%A3%D8%B7%D9%81%D8%A7%D9%84-%D9%88%D8%A7%D9%84%D9%85%D8%AF%D9%86%D9%8A%D9%8A%D9%86-%D9%81%D9%8A-%D9%84%D8%A8%D9%86%D8%A7%D9%86/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c3da24c59b7128a42bd29.jpeg", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788626246, "detail": "الكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nاتهم وزير الخارجية الكوبي برونو رودريغيز، اليوم، إسرائيل بارتكاب أفعال \"وحشية\" بحق المدنيين في لبنان، مطالبا إياها بوقف قتل الأطفال والقاصرين.\n\nوكتب رودريغيز في تدوينة على منصة \"إكس\": \"يجب على الكيان الصهيوني الإسرائيلي أن يوقف قتل المدنيين في لبنان، وخاصة الأطفال\"، مستشهدا بحصيلة ضحايا قال إنها سُجلت خلال الأشهر الستة الماضية، وتشمل 257 طفلا قتيلا و1039 جريحا، بمعدل يزيد عن سبعة أطفال يوميا.\n\nوأضاف أن هذه الخسائر تأتي في إطار حصيلة إجمالية بلغت 4348 قتيلا و12300 جريح على يد القوات الإسرائيلية، وفقا للأرقام التي أوردها.\n\nوأكد الوزير الكوبي أن هذه الإحصاءات \"ليست أضرارا جانبية\"، بل تشكل \"جزءا من الوحشية التي تعتزم إسرائيل ارتكابها دون رادع في الشرق الأوسط\".\n\nوتأتي هذه التصريحات في وقت يشهد فيه جنوب لبنان تصعيدا عسكريا ميدانيا، حيث أفادت تقارير باستمرار القصف الإسرائيلي على بلدات في قضاء صور، بالتزامن مع عمليات توغل بري وإنشاء مواقع عسكرية جديدة في المنطقة، في انتهاك لاتفاقيات وقف إطلاق النار السابقة.\n\nكما أشارت منظمة الأمم المتحدة للطفولة (يونيسف) إلى أن النزاع المتصاعد في لبنان يهدد سلامة الأطفال ومستقبلهم، في ظل أوضاع إنسانية متدهورة.\n\nنشر الجيش الإسرائيلي اليوم مشاهد تظهر استهداف قواته لعناصر وبنى تحتية تابعة لـ\"حزب الله\" في جنوب لبنان.\n\nنشرت وسائل الإعلام اللبنانية اليوم لقطات تظهر الدمار الناجم عن غارة إسرائيلية استهدفت محيط بلدة النبطية الفوقا في جنوب لبنان.\n\nأعلن الجيش الإسرائيلي أنه هاجم أمس الجمعة عناصر وبنى تحتية تابعة لـ\"حزب الله\" في جنوب لبنان ردا على إطلاق مسيرة نحو قواته في المنطقة الأمنية.\n\nقتل 3 أشخاص وجرح 23 آخرون بينهم 6 مسعفين و6 سيدات وطفلتان في حصيلة أولية للغارات الإسرائيلية التي استهدفت ليلا عدة بلدات في جنوب لبنان والبقاع الغربي شرقي لبنان.\n\nأعلن الجيش الإسرائيلي عن شن غارات ردا على إطلاق \"حزب الله\" اللبناني طائرة مسيّرة باتجاه قواته المتواجدة في المنطقة الأمنية مؤكدا اعتراض المسيرة دون وقوع إصابات."}, {"guid": "56905572-a941-11f1-a973-df5972d521ba", "title": "الأمم المتحدة تعتمد قرارا لتعديل خرائط العالم... وحجم أفريقيا يتسع على حساب أمريكا", "summary": "اعتمدت الجمعية العامة للأمم المتحدة في نيويورك الجمعة قرارا يهدف إلى تحسين رسم الخرائط العالمية العائدة للحقبة الاستعمارية لتكون أكثر تماشيا مع الحجم الحقيقي للقارات، مع توسيع حجم قارة أفريقيا وتضييق مساحة الولايات المتحدة، في خطوة وصفتها واشنطن بأنها \"تقوض مصداقية\" المنظمة. وأيد القرار 164 دولة مقا", "link": "https://www.france24.com/ar/%D9%81%D9%8A%D8%AF%D9%8A%D9%88/20260905-%D8%A7%D9%84%D8%A3%D9%85%D9%85-%D8%A7%D9%84%D9%85%D8%AA%D8%AD%D8%AF%D8%A9-%D8%AA%D8%B9%D8%AA%D9%85%D8%AF-%D9%82%D8%B1%D8%A7%D8%B1-%D8%AE%D8%B1%D9%8A%D8%B7%D8%A9-%D9%85%D9%86%D8%B5%D9%81%D8%A9-%D9%84%D8%A3%D9%81%D8%B1%D9%8A%D9%82%D9%8A%D8%A7", "image": "https://s.france24.com/media/display/b8def100-a88a-11f1-98da-005056a97e36/w:1024/p:16x9/equal-earth.jpg", "category": "سياسة", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788624584, "detail": ""}, {"guid": "https://www.bbc.com/arabic/articles/c046ee1x5nro#0", "title": "السفير الأمريكي لدى إسرائيل: لا خطة لتهجير الفلسطينيين من غزة", "summary": "السفير الأمريكي في إسرائيل، مايك هاكابي، ينفي وجود خطة لتهجير قسري للفلسطينيين من قطاع غزة، بعدما طرح وزيران إسرائيليان أفكاراً بشأن طرد مليوني نسمة من القطاع المدمر.", "link": "https://www.bbc.com/arabic/articles/c046ee1x5nro?at_medium=RSS&at_campaign=rss", "image": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/a8eb/live/fcc45750-a936-11f1-a24a-1f5107675b0f.png", "category": "أخبار", "source_id": "bbc-arabic", "source_name": "بي بي سي عربي", "source_cat": "دولية", "published": 1788623137, "detail": "BBC News, عربيإذهب الى المحتوىرئيسيةشاهداستمعأقسامرئيسيةأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتالسفير الأمريكي لدى إسرائيل: لا خطة لتهجير الفلسطينيين من غزةصدر الصورة، EPA\n\nنفى السفير الأمريكي لدى إسرائيل، مايك هاكابي، السبت، وجود خطة إسرائيلية لتهجير الفلسطينيين قسراً من قطاع غزة، رغم طرح وزيرين إسرائيليين مقترحات لإخراج سكان القطاع منه.\n\nوقال هاكابي، خلال زيارة لفلسطينيين يحملون الجنسية الأمريكية في الضفة الغربية المحتلة: \"أؤكد لكم بشكل قاطع أنه لا توجد أي خطة لدى الإسرائيليين لتهجير سكان غزة قسراً\".\n\nوأضاف أن إدارة الرئيس دونالد ترامب تؤيد منح الفلسطينيين خيار مغادرة القطاع طوعاً، قائلاً: \"إذا رغب الناس في المغادرة، فينبغي أن يكون لهم الحق في ذلك\"، ووصف عدم السماح لهم بالخروج من غزة بأنه \"عار\".\n\nوتابع: \"لا أحد يقترح تهجيراً قسرياً، لا الإسرائيليون ولا الأمريكيون. ولا أعرف أحداً يؤيد ذلك\".\n\nوكان وزير الأمن القومي الإسرائيلي، إيتمار بن غفير، قد اقترح، الخميس، خطة لمغادرة 250 ألف فلسطيني غزة خلال عام، على أن يغادر بقية سكان القطاع، البالغ عددهم نحو مليوني شخص، خلال السنوات الست التالية.\n\nوجاء مقترحه بعد قول وزير الدفاع الإسرائيلي، يسرائيل كاتس، إن إسرائيل مستعدة لنقل فلسطينيين من غزة براً وبحراً، لكنها تنتظر الولايات المتحدة، التي قال إنها تبحث عن وجهة لهم.\n\nوقال كاتس، من دون تقديم أدلة، إن 80 في المئة من سكان غزة يريدون المغادرة، وإن حماس تمنعهم من ذلك.\n\nويحظر القانون الدولي الإنساني النقل القسري الفردي أو الجماعي للمدنيين من الأراضي المحتلة، ويمكن أن يشكل، في ظروف معينة، جريمة حرب."}, {"guid": "43089642-a93f-11f1-ab94-47729669d57f", "title": "ما رهانات حزب \"البديل من أجل ألمانيا\" في انتخابات ولاية ساكسونيا أنهالت؟", "summary": "نزل الآلاف إلى الشوارع السبت في ماغدبورغ من أجل \"الديمقرطية\"، عشية انتخابات في ولاية ساكسونيا أنهالت بشرق ألمانيا، يتوقع أن يسجل فيها اليمين المتطرف انتصارا تاريخيا. وجمعت التظاهرة التي نظمها تكتل جمعيات يحمل اسم \"ساكسونيا أنهالت. منفتحة على العالم\"، أشخاصاً من مختلف الأعمار توجهوا إلى كاتدرائية الم", "link": "https://www.france24.com/ar/%D9%81%D9%8A%D8%AF%D9%8A%D9%88/20260905-%D9%85%D8%A7-%D8%B1%D9%87%D8%A7%D9%86%D8%A7%D8%AA-%D8%AD%D8%B2%D8%A8-%D8%A7%D9%84%D8%A8%D8%AF%D9%8A%D9%84-%D9%85%D9%86-%D8%A3%D8%AC%D9%84-%D8%A3%D9%84%D9%85%D8%A7%D9%86%D9%8A%D8%A7-%D9%81%D9%8A-%D8%A7%D9%86%D8%AA%D8%AE%D8%A7%D8%A8%D8%A7%D8%AA-%D9%88%D9%84%D8%A7%D9%8A%D8%A9-%D8%B3%D8%A7%D9%83%D8%B3%D9%88%D9%86%D9%8A%D8%A7-%D8%A3%D9%86%D9%87%D8%A7%D9%84%D8%AA", "image": "https://s.france24.com/media/display/3e4edd1e-a93f-11f1-800e-005056bfb2b6/w:1024/p:16x9/AR-20260905-171900-172514-CS.jpg", "category": "سياسة", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788622928, "detail": ""}, {"guid": "55eec120-a93d-11f1-a63f-47729669d57f", "title": "ما دوافع استئناف واشنطن تحركها الدبلوماسي بشأن الحرب في أوكرانيا؟", "summary": "قال ​الرئيس الأوكراني فولوديمير زيلينسكي ​إنه تحدث مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر ​اللذين ‌بدآ بالفعل محادثاتهما في روسيا ‌السبت. ومن المتوقع وصول المبعوثين الأمريكيين إلى كييف الأحد. وألمح الرئيس الأم 8%AF%D9%81%D8%A7%D8%B9-%D8%A7%D9%84%D9%85%D8%AF%D9%86%D9%8A-%D8%A7%D9%84%D9%81%D9%84%D8%B3%D8%B7%D9%8A%D9%86%D9%8A-%D8%A3%D9%83%D8%AB%D8%B1-%D9%85%D9%86-8-%D8%A2%D9%84%D8%A7%D9%81-%D8%AC%D8%AB%D9%85%D8%A7%D9%86-%D9%84%D8%A7-%D8%AA%D8%B2%D8%A7%D9%84-%D8%AA%D8%AD%D8%AA-%D8%A3%D9%86%D9%82%D8%A7%D8%B6-%D8%A7%D9%84%D9%85%D8%A8%D8%A7%D9%86%D9%8A-%D8%A7%D9%84%D9%85%D8%AF%D9%85%D8%B1%D8%A9-%D9%81%D9%8A-%D8%BA%D8%B2%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c35034c59b7108277a2e6.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788618949, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nقال المتحدث باسم الدفاع المدني في قطاع غزة، محمود بصل، إن أكثر من 8 آلاف جثمان لا تزال تحت أنقاض المباني المدمرة في مختلف مناطق القطاع، في ظل صعوبات كبيرة تواجه طواقم الإنقاذ.\n\nوأوضح بصل أن برج المهندسين، الواقع في محيط شارع العشرين شمالي مخيم النصيرات، تعرض للقصف الإسرائيلي خلال الحرب، مشيرا إلى أن البرج كان يؤوي حينها أكثر من 350 مواطنا ونازحا.\n\nوأضاف أن طواقم الدفاع المدني تمكنت منذ بداية الحرب من انتشال نحو 160 جثمانا من موقع البرج، فيما لا تزال عمليات البحث متواصلة للوصول إلى بقية الضحايا الذين يعتقد أنهم ما زالوا تحت أنقاض المبنى.\n\nوبيّن بصل أن الطواقم لا تستطيع تحديد المدة اللازمة لاستكمال عمليات البحث وانتشال رفات الضحايا المتبقين، نظرا إلى حجم الركام وطبيعة الدمار الذي لحق بالموقع، إلى جانب النقص الحاد في المعدات والآليات اللازمة للعمل.\n\nوأكد أن عمليات البحث والانتشال في برج المهندسين تجري بإمكانات بسيطة جدا، موضحا أن الدفاع المدني يعمل في الموقع بواسطة حفار واحد فقط، الأمر الذي يحد من قدرة الطواقم على إزالة كميات كبيرة من الركام والوصول إلى الأماكن التي قد توجد فيها جثامين الضحايا.\n\nوتأتي هذه العمليات في ظل استمرار وجود آلاف الجثامين تحت أنقاض المباني المدمرة في مناطق مختلفة من قطاع غزة، وسط تحديات تواجه فرق الدفاع المدني في الوصول إلى المواقع المتضررة والتعامل مع الركام، ما يجعل عمليات البحث والانتشال شاقة وبطيئة، ويؤخر الوصول إلى الضحايا الذين لا يزالون في عداد المفقودين.\n\nانتشلت طواقم الدفاع المدني الفلسطيني 55 جثمانا من تحت أنقاض مبنى يعود لعائلة \"ملكة\" في حي الزيتون شرقي مدينة غزة، كان يؤوي أكثر من 60 نازحا قبل تعرضه لقصف إسرائيلي قبل نحو عامين.\n\nطرح وزيران إسرائيليان هذا الأسبوع مقترحات تتعلق بالترحيل الجماعي للفلسطينيين من قطاع غزة، وسط أجواء مشحونة تسبق الانتخابات المقررة في أكتوبر، في سعيهما لحشد المؤيدين.\n\nنشرت وسائل الإعلام الفلسطينية اليوم الجمعة مشاهد لقصف إسرائيلي على أحد أحياء خان يونس جنوبي قطاع غزة.\n\nأعلن مكتب الأمم المتحدة لحقوق الإنسان في فلسطين مقتل 24 فلسطينيا، بينهم 4 أطفال وامرأة جراء هجمات إسرائيلية خلال 5 أيام، محذرا من استمرار انعدام الأمان في قطاع غزة.\n\nأعلنت حركة حماس أنها أجرت اتصالات مع الوسطاء وفي مقدمتهم نيكولاي ميلادينوف، الممثل الدولي المكلف بمتابعة وقف إطلاق النار في غزة، احتجاجا على العملية العسكرية الإسرائيلية."}, {"guid": "https://arabic.rt.com/world/1829091-%D8%B3%D9%81%D9%8A%D8%B1-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D9%84%D8%AF%D9%89-%D8%A8%D8%B1%D9%84%D9%8A%D9%86-%D9%86%D9%88%D8%A7%D8%AC%D9%87-%D9%85%D8%B4%D8%A7%D9%83%D9%84-%D9%85%D8%B9-%D8%A8%D8%B9%D8%B6-%D8%A7%D9%84%D8%B3%D9%8A%D8%A7%D8%B3%D9%8A%D9%8A%D9%86-%D8%A7%D9%84%D8%A3%D9%84%D9%85%D8%A7%D9%86-%D9%84%D8%A7-%D9%85%D8%B9-%D8%A7%D9%84%D8%B4%D8%B9%D8%A8/", "title": "سفير روسيا لدى برلين: نواجه مشاكل مع بعض السياسيين الألمان لا مع الشعب", "summary": "أكد السفير الروسي لدى ألمانيا سيرغي نيتشاييف أن روسيا تواجه بعض المشاكل مع بعض السياسيين الألمان، وليس لديها مشاكل مع الشعب الألماني، مؤكدا أن أي صراع بين البلدين سيكون \"كابوسا\".", "link": "https://arabic.rt.com/world/1829091-%D8%B3%D9%81%D9%8A%D8%B1-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D9%84%D8%AF%D9%89-%D8%A8%D8%B1%D9%84%D9%8A%D9%86-%D9%86%D9%88%D8%A7%D8%AC%D9%87-%D9%85%D8%B4%D8%A7%D9%83%D9%84-%D9%85%D8%B9-%D8%A8%D8%B9%D8%B6-%D8%A7%D9%84%D8%B3%D9%8A%D8%A7%D8%B3%D9%8A%D9%8A%D9%86-%D8%A7%D9%84%D8%A3%D9%84%D9%85%D8%A7%D9%86-%D9%84%D8%A7-%D9%85%D8%B9-%D8%A7%D9%84%D8%B4%D8%B9%D8%A8/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c363d42360444de658b0e.jpg", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788618918, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nأكد السفير الروسي لدى ألمانيا سيرغي نيتشاييف أن روسيا تواجه بعض المشاكل مع بعض السياسيين الألمان، وليس لديها مشاكل مع الشعب الألماني، مؤكدا أن أي صراع بين البلدين سيكون \"كابوسا\".\n\nوقال نيتشاييف خلال فعالية تذكارية في المقبرة العسكرية السوفيتية في شتوكينبروك: \"لدينا حاليا بالفعل بعض المشاكل مع بعض السياسيين الألمان. أنا لا أنتقد أحدا. فنحن لا نتدخل في الشؤون الداخلية. هذا شأن الشعب الألماني. لكن ليس لدينا أي مشاكل مع الشعب الألماني\".\n\nوأشار السفير إلى أن الاتصالات مع الحكومة الألمانية أصبحت شبه معدومة حاليا، لكن الاستعداد للحوار كان موضع تقدير في جميع الأوقات، مؤكدا أن رفض الحوار لا يفيد العلاقات الثنائية ولا آفاق حل النزاعات.\n\nوقال نيتشاييف في مقابلة مع صحيفة \"برلينر تسايتونغ\": \"أي صراع جديد بين روسيا وألمانيا سيكون كابوسا، ولا أفهم من يدفئ قلبه هذا الكابوس\". وأضاف أن \"روسيا وألمانيا باقيتان في أوروبا وترتبطان بتاريخ طويل، وكانت فترات الازدهار هي فترات الحوار والتعاون المتبادل، ولن ينجح أحد في عزل روسيا أبدا\".\n\nتأتي هذه التصريحات في ظل تصاعد حاد في التوترات بين موسكو وبرلين، حيث أغلقت ألمانيا القنصلية الروسية في بون وأنهت أنشطة البيت الروسي في برلين متذرعة بحادثة الطائرة المسيرة في مطار لايبزيغ، التي اتهمت روسيا بالضلوع فيها دون تقديم أي دليل واقعي على ذلك.\n\nمن جانبها، وصفت موسكو الإجراءات بأنها \"غير مسبوقة منذ الحرب العالمية الثانية\"، وتوعدت بالرد بالمثل على الإجراءات الألمانية. وفي المقابل، اتهم نيتشاييف ألمانيا بالسير نحو \"التحضير لمواجهة عسكرية مع روسيا\" معتبرا أن برلين تنتهج \"مسارا سياسيا يقوم على الاستعداد لمواجهة عسكرية محتملة\".\n\nوكان المستشار الألماني فريدريش ميرتس قد دعا إلى تعزيز الردع الأوروبي، بينما أشار نيتشاييف إلى أن رفض الحوار \"لا يخدم العلاقات الثنائية ولا يحسّن فرص حل النزاع\".\n\nحذر سفير الولايات المتحدة لدى \"الناتو\"، ماثيو ويتاكر، الدول الأعضاء في الحلف من عدم التسامح مع الأعمال المتعمدة في إطار الحرب الهجينة، مؤكدا أن واشنطن ستقف إلى جانب الدول المعنية.\n\nاتهمت ألمانيا روسيا رسميًا بالوقوف وراء محاولة الهجوم بواسطة الطائرات المسيرة المفخخة في مطار لايبزيغ في شهر آب الماضي، ما فجّر أزمة دبلوماسية بين برلين وموسكو.\n\nصرح السفير الروسي لدى برلين سيرغي نيتشاييف بأن جميع مجالات التعاون الرئيسية بين روسيا وألمانيا، بما في ذلك الاتصالات على المستوى السياسي، قد جُمدت فعليا.\n\nأعلن القنصل العام الروسي في بون، أوليغ كراسنيتسكي، أن ألمانيا طلبت من نحو 70 موظفا من البعثة الدبلوماسية بالإضافة إلى أفراد عائلاتهم مغادرة البلاد على خلفية إغلاق القنصلية في بون.\n\nأكدت الخارجية الروسية والسفير الروسي لدى ألمانيا سيرغي نيتشايف أن إغلاق القنصلية الروسية في بون يدمر العلاقات، وأن الرد سيكون فوريا.\n\nأشار المتحدث باسم الكرملين دميتري بيسكوف إلى أن ألمانيا تتهم روسيا بلا أساس بحادثة المسيرة في مطار لايبزيغ ولكنها لم تقل كلمة واحدة لأوكرانيا بشأن انفجار خط أنابيب \" عدام لـ\"الزعيمة الحسناء\" و12 متهما في قضية المخدرات الكبرى وتعود القضية إلى اتهام 28 شخصا بتكوين تنظيم إجرامي منظم تخصص في جلب المواد الخام المستخدمة في تصنيع المخدرات المخلقة من خارج البلاد، وتصنيعها والاتجار بها، إلى جانب اتهامات بإحراز وحيازة أسلحة نارية وذخائر دون ترخيص.\n\nوكشفت التحقيقات عن حجم كبير من المضبوطات، بعدما اتخذ المتهمون أحد العقارات السكنية مقرا لتخزين المواد الخام وإجراء عمليات التصنيع والتجهيز.\n\nوعثرت الشرطة على كميات من المواد المخدرة، إلى جانب مواد خام وأدوات ومعدات قالت التحقيقات إنها استخدمت في عمليات التصنيع والتجهيز.\n\nولم تقتصر المضبوطات على المواد المخدرة الجاهزة للترويج، بل تضمنت أيضا مكونات ومواد كيميائية لاستخدامها في إنتاج مخدرات اصطناعية، وهو ما دفع جهات التحقيق إلى وصف القضية بأنها من أخطر قضايا المخدرات التي كشف عنها خلال الفترة الأخيرة.\n\nوضبطت الأجهزة الأمنية أكثر من 750 كيلوغراما من المواد المخدرة والمواد الأولية المستخدمة في تصنيعها، إلى جانب معدات وأدوات مرتبطة بعمليات الإنتاج.\n\nوتضمنت المضبوطات، وفق ما نشر عن أوراق التحقيق، 648 كيلوغراما من مشتقات مخدر \"أندازول كاربوكاسميد\"، و51 كيلوغراما من مساحيق ومحاليل كيميائية تدخل في تصنيع المادة، بالإضافة إلى مضبوطات من الحشيش و\"الفينيثيل أمين\" كما عثرت الأجهزة على معدات حماية، بينها قناع واق من الغاز وقفازات.\n\nوشملت المضبوطات أدوات للخلط والتعبئة، وعبوات وميزانا حساسا، فضلا عن مبالغ مالية وهواتف محمولة وأجهزة إلكترونية، قالت جهات التحقيق إنها قد تكشف طبيعة الاتصالات بين أفراد التشكيل ومسارات توزيع المواد المخدرة.\n\nولم تقتصر المضبوطات على المواد المخدرة والخامات، إذ شملت كذلك بندقية خرطوش ومسدسا عيار 9 ملليمترات و44 طلقة حية، بحسب التحقيقات المنشورة.\n\nوأظهرت التحقيقات أن التنظيم لم يكن قائما على شخص واحد، وإنما توزعت الأدوار بين عدد من المتهمين؛ فبعضهم تولى توفير واستيراد المواد الخام من الخارج، بينما تولى آخرون عمليات التصنيع والتعبئة، في حين اضطلع آخرون بعمليات الترويج والتوزيع.\n\nأرجعت التحقيقات إلى تبني سارة خليفة دورا رئيسيا في التنظيم، إذ قالت إن المتهمة تولت ضخ الأموال اللازمة للنشاط الإجرامي والسفر خارج البلاد لعقد لقاءات مع المتهمين الرئيسيين والتنسيق معهم بشأن المواد التي يتم التعاقد على شرائها، بينما تولى متهمون آخرون إدخالها إلى البلاد، ومن بين المتهمين الهاربين شخص عراقي الجنسية.\n\nقضت محكمة جنايات القاهرة بالإعدام شنقا على المنتجة سارة خليفة و12 متهما آخرين في قضية جلب وتصنيع والاتجار بالمواد المخدرة والسجن المشدد 3 سنوات في قضية هتك عرض شاب داخل مسكنها.\n\nتصدر محكمة جنايات القاهرة المنعقدة بالتجمع الخامس اليوم الأربعاء حكمها في قضية سارة خليفة و27 آخرين متهمين بجرائم مخدرات، والاعتداء الجنسي.\n\nقررت محكمة جنايات القاهرة إحالة أوراق المتهمة سارة خليفة وعدد من المتهمين في القضية المعروفة إعلاميا بـ\"عصابة سارة خليفة\" إلى فضيلة مفتي الجمهورية لأخذ الرأي الشرعي في إعدامهم.\n\nشهدت محاكمة المنتجة والإعلامية المصرية سارة خليفة المتهمة في القضية المعروفة إعلاميا بقضية \"المخدرات الكبرى\" تطورات جديدة ومثيرة أمام محكمة جنايات القاهرة بالتجمع الخامس.\n\nكشفت النيابة العامة المصرية مفاجأة كبرى خلال جلسة محاكمة المنتجة سارة خليفة و27 آخرين في القضية المعروفة إعلاميا بـ\"المخدرات الكبرى\"، موجهة اتهاما خطيرا لشقيقها."}, {"guid": "CBMiT0FVX3lxTE93cGQ5Z3lMc2xMNEIxN21GMGNkbWxYRHZaYnlJeWJ1ZWoxZ3M0WFFaWnp1VVhJcjk5WHIyellHUFNvbEk4NVZ0bG5XS3ZyRTQ", "title": "النقل: ميناء الفاو يقترب من استكمال مكوناته الرئيسة وارتفاع حركة السفن في أم قصر 21 بالمئة - وكالة الانباء العراقية (واع)", "summary": "النقل: ميناء الفاو يقترب من استكمال مكوناته الرئيسة وارتفاع حركة السفن في أم قصر 21 بالمئة &nbsp;&nbsp; وكالة الانباء العراقية (واع)", "link": "https://news.google.com/rss/articles/CBMiT0FVX3lxTE93cGQ5Z3lMc2xMNEIxN21GMGNkbWxYRHZaYnlJeWJ1ZWoxZ3M0WFFaWnp1VVhJcjk5WHIyellHUFNvbEk4NVZ0bG5XS3ZyRTQ?oc=5", "image": "", "category": "سياسة", "source_id": "ina", "source_name": "الوكالة العراقية (العراق)", "source_cat": "وكالة رسمية", "published": 1788618448, "detail": ""}, {"guid": "https://arabic.rt.com/world/1829100-%D9%84%D9%8A%D8%AE%D8%A7%D8%AA%D8%B4%D9%8A%D9%88%D9%81-%D9%8A%D8%B9%D9%84%D9%82-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D9%88%D8%B6%D8%B9-%D9%81%D9%8A-%D9%85%D8%AD%D8%B7%D8%A9-%D8%B2%D8%A7%D8%A8%D9%88%D8%B1%D9%88%D8%AC%D9%8A%D9%87-%D8%A7%D9%84% ط لنقل الطاقة الكهربائية (خط ضغط عال) بجهد 330 كيلوفولت. ونوه المدير العام بأن الخط الأخير تعرض للتلف في 20 أغسطس. ومنذ ذلك الحين، أي قبل نحو نصف شهر، وجميع معدات المحطة – بما في ذلك أنظمة السلامة – تعمل بالكهرباء التي توفرها مولدات الديزل الاحتياطية الخاصة بالمحطة النووية.\n\nالوكالة الذرية تعلن بدء وقف إطلاق النار لإصلاح خط محطة زابوروجيه وأصبح نظام التهدئة (وقف إطلاق النار) ممكنا بفضل جهود وزارتي الخارجية والدفاع والحرس الوطني الروسي (روسغفارديا)، كما لعبت الوكالة الدولية للطاقة الذرية دور الوساطة اللازم. ومبدئيا، ستصل مدة وقف إطلاق النار إلى حوالي أسبوع.\n\nوشدد ليخاتشيوف على أن إجراء أعمال الإصلاح الناجحة في خط \"فيروسبلافنايا\"، لا يضمن بتاتا استئناف إمدادات الطاقة الكهربائية للمحطة النووية.\n\nوقال المدير العام: \"منذ 23 يوليو، عندما تم إصلاح الخط الثاني –دنيبروفسكا – لم يتم توصيله بالشبكة حتى الآن بسبب تقاعس السلطات في كييف. ومَن يضمن ألا يتكرر السيناريو نفسه مع خط فيروسبلافنايا؟. نحن سنقوم مجددا بطرح أمام قيادة الوكالة الدولية للطاقة الذرية في القريب العاجل، موضوع استئناف إمدادات الكهرباء عبر خط دنيبروفسكا، باعتباره عنصرا أساسيا لإمداد محطة زابوروجيه بالطاقة بشكل موثوق\".\n\nوأضاف المدير العام: \"على الرغم من جميع المشاكل التي واجهتها محطة زابوروجيه، فإن الوضع تحت السيطرة. ويعود الفضل في ذلك جزئيا إلى العمل الدؤوب والتفاني من قِبل طاقم العمل - من مشغلي غرف التحكم بالمحطات، والمهندسين، والموظفين العاديين، وإدارة المحطة. البطولة، والصمود، والتفاني في العمل - هذه هي الكلمات التي تصف أيام العمل العادية لأولئك الذين يذهبون إلى نوبات عملهم يوميا. إن طاقم العمل، وليس الميزات الهيكلية للمحطة، هو أهم نظام أمان في أي محطة طاقة نووية. وهذا ما يثبته رفاقنا في إينيرغودار على مدار الساعة طوال أيام الأسبوع\".\n\nأكد سفير المهام الخاصة بوزارة الخارجية الروسية لشؤون جرائم نظام كييف، روديون ميروشنيك، أن محطة زابوروجيه النووية تمتلك \"هامش أمان كافيا\" لمواجهة الهجمات المتكررة لقوات كييف.\n\nأعلنت يفغينيا ياشينا مديرة الاتصالات العامة بمحطة زابوروجيه الكهروذرية أنه تم إخطار الوكالة الدولية للطاقة الذرية بفقدان إمدادات الكهرباء الخارجية وانتقال المحطة لكهرباء المولدات."}, {"guid": "https://arabic.rt.com/sport/1829099-%D8%AB%D9%86%D8%A7%D8%A6%D9%8A%D8%A9-%D8%A3%D9%88%D8%A8%D9%84%D9%8A%D8%A7%D9%83%D9%88%D9%81-%D8%AA%D9%85%D9%86%D8%AD-%D8%AA%D8%B3%D9%8A%D8%B3%D9%83%D8%A7-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D8%A7%D9%84%D9%81%D9%88%D8%B2-%D8%B9%D9%84%D9%89-%D8%B2%D9%8A%D9%86%D9%8A%D8%AA-%D9%81%D9%8A-%D8%B9%D9%82%D8%B1-%D8%AF%D8%A7%D8%B1%D9%87-%D8%A8%D8%A7%D9%84%D8%AF%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D8%B1%D9%88%D8%B3%D9%8A/", "title": "ثنائية أوبلياكوف تمنح تسيسكا موسكو الفوز على زينيت في عقر داره بالدوري الروسي", "summary": "حقق نادي تسيسكا موسكو فوزا صعبا وثمينا على حساب مضيفه زينيت سان بطرسبورغ لحساب الجولة السابعة من الدوري الروسي الممتاز لكرة القدم.", "link": "https://arabic.rt.com/sport/1829099-%D8%AB%D9%86%D8%A7%D8%A6%D9%8A%D8%A9-%D8%A3%D9%88%D8%A8%D9%84%D9%8A%D8%A7%D9%83%D9%88%D9%81-%D8%AA%D9%85%D9%86%D8%AD-%D8%AA%D8%B3%D9%8A%D8%B3%D9%83%D8%A7-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D8%A7%D9%84%D9%81%D9%88%D8%B2-%D8%B9%D9%84%D9%89-%D8%B2%D9%8A%D9%86%D9%8A%D8%AA-%D9%81%D9%8A-%D8%B9%D9%82%D8%B1-%D8%AF%D8%A7%D8%B1%D9%87-%D8%A8%D8%A7%D9%84%D8%AF%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D8%B1%D9%88%D8%B3%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c3f4642360444df6c93fe.png", "category": "رياضة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788618215, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nحقق نادي تسيسكا موسكو فوزا صعبا وثمينا على حساب مضيفه زينيت سان بطرسبورغ لحساب الجولة السابعة من الدوري الروسي الممتاز لكرة القدم.\n\nوانتهت المواجهة التي أقيمت في سان بطرسبورغ بفوز الضيوف بنتيجة 2-1، حيث سجل إيفان أوبلياكوف هدفي تسيسكا موسكو في الدقيقتين \"45+7\" من ركلة جزاء و\"90+9\"، بينما أحرز ألكسندر سوبوليف هدف زينيت الوحيد في الدقيقة 84.\n\nوكان حكم اللقاء قد احتسب ركلة الجزاء لصالح تسيسكا موسكو بعد توجيه سوبوليف ضربة بكوعه لوجه مدافع تسيسكا، جمال الدين عبد القادروف.\n\nوبهذا الفوز، حقق تسيسكا انتصاره الأول خارج أرضه على زينيت منذ مايو 2024 (حين فاز بهدف دون رد).\n\nورفع الفريق العاصمي رصيده إلى 15 نقطة ليصعد إلى وصافة جدول الترتيب، في حين تجمد رصيد زينيت عند 12 نقطة في المركز الرابع.\n\nوفي الجولة المقبلة، يستضيف تسيسكا موسكو فريق روبين قازان، بينما يلتقي زينيت مع لوكوموتيف موسكو.\n\nحقق دينامو موسكو فوزه الأول في الدوري الروسي الممتاز لكرة القدم هذا الموسم، بتغلبه على ضيفه دينامو ماخاتشكالا في مباراة جمعتهما ضمن منافسات الجولة الثالثة من المسابقة."}, {"guid": "https://arabic.rt.com/world/1829094-%D8%AD%D9%88%D9%84%D9%86-%D8%A5%D9%84%D9%89-%D8%AF%D9%85%D9%89-%D9%84%D8%A5%D8%B1%D8%B6%D8%A7%D8%A1-%D8%A5%D8%A8%D8%B3%D8%AA%D9%8A%D9%86-%D9%86%D8%A7%D8%AC%D9%8A%D8%A7%D8%AA-%D9%8A%D9%88%D8%AC%D9%87%D9%86-%D8%A7%D8%AA%D9%87%D8%A7%D9%85%D8%A7-%D8%B5%D8%A7%D8%AF%D9%85%D8%A7-%D9%84%D9%85%D8%B5%D9%81%D9%81-%D8%B4%D8%B9%D8%B1-%D8%A7%D9%84%D9%85%D8%B4%D8%A7%D9%87%D9%8A%D8%B1-%D9%81%D9%8A-%D9%81%D8%B6%D9%8A%D8%AD%D8%A9-%D8%AC%D8%AF%D9%8A%D8%AF%D8%A9/", "title": "\"حولن إلى دمى لإرضاء إبستين\".. ناجيات يوجهن اتهاما صادما لمصفف شعر المشاهير في فضيحة جديدة", "summary": "رفعت سبع ناجيات من ضحايا المتحرش الجنسي جيفري إبستين دعوى جديدة أمام المحكمة العليا في نيويورك، يتهمن فيها مصفف الشعر الفرنسي الشهير فريدريك فيكاي بتسهيل ممارسات إبستين المسيئة.", "link": "https://arabic.rt.com/world/1829094-%D8%AD%D9%88%D9%84%D9%86-%D8%A5%D9%84%D9%89-%D8%AF%D9%85%D9%89-%D9%84%D8%A5%D8%B1%D8%B6%D8%A7%D8%A1-%D8%A5%D8%A8%D8%B3%D8%AA%D9%8A%D9%86-%D9%86%D8%A7%D8%AC%D9%8A%D8%A7%D8%AA-%D9%8A%D9%88%D8%AC%D9%87%D9%86-%D8%A7%D8%AA%D9%87%D8%A7%D9%85%D8%A7-%D8%B5%D8%A7%D8%AF%D9%85%D8%A7-%D9%84%D9%85%D8%B5%D9%81%D9%81-%D8%B4%D8%B9%D8%B1-%D8%A7%D9%84%D9%85%D8%B4%D8%A7%D9%87%D9%8A%D8%B1-%D9%81%D9%8A-%D9%81%D8%B6%D9%8A%D8%AD%D8%A9-%D8%AC%D8%AF%D9%8A%D8%AF%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c3b574c59b70fc50584c1.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788617403, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nرفعت سبع ناجيات من ضحايا المتحرش الجنسي جيفري إبستين دعوى جديدة أمام المحكمة العليا في نيويورك، يتهمن فيها مصفف الشعر الفرنسي الشهير فريدريك فيكاي بتسهيل ممارسات إبستين المسيئة.\n\nكما تشمل التهم المشاركة في عمليات \"التجهيز\" للضحايا لجعلهن يبدين \"كالدمى\" لإرضاء ذوق إبستين وآخرين.ووفقاً لما نقلته شبكة \"سي إن إن\"، ووسائل إعلامية أمريكية أخرى، تشير صحيفة الدعوى المكونة من 17 صفحة إلى أن \"فيكاي\" وموظفاً لديه لعبا \"دوراً محورياً\" في مخططات إبستين من خلال تقديم خدمات التجميل بتوجيه منه.\n\nوتزعم الناجيات أن إبستين كان يوجه \"فيكاي\" لصبغ شعر الضحايا باللون الأشقر وتجهيزهن \"مثل الدمى\" لتبدين أصغر سناً قدر الإمكان، بما يتوافق مع رغباته ورغبات آخرين.\n\nكما تصف الدعوى صالون \"فيكاي\" الرئيسي في مانهاتن بأنه كان \"مركزاً لعمليات تجهيز الضحايا\"، حيث كان إبستين يجلب مجموعات من الشابات والقاصرات إلى هناك.\n\nوتطالب الناجيات بتعويضات غير محددة بموجب \"قانون حماية العنف بدافع النوع الاجتماعي\" في ولاية نيويورك، والذي يسمح للضحايا برفع دعاوى مدنية حتى بعد انقضاء مدة التقادم العادية.من جهته، نفى ممثل عن فريدريك فيكاي هذه الاتهامات بشدة. وقال المتحدث باسمه، مارك هير، في تصريح لوسائل الإعلام: \"لم يرتكب فريدريك فيكاي أي خطأ، وهو لم يكن يعرف شيئاً عن فساد إبستين المقيت أو عمليات الاتجار بالبشر\".\n\nوأضاف أن الدعوى \"لا تدعي حتى أن فريدريك التقى بأي من هؤلاء النساء، ناهيك عن أنه لم يلمسهن أو حتى أنه كان يعلم أنهن من بين آلاف النساء اللاتي يقصصن شعرهن في صالوناته يومياً\".وتأتي هذه الدعوى في وقت تتجدد فيه التدقيقات حول ملف إبستين، خاصة بعد أن ذكر النائب الجمهوري توماس ماسي مؤخراً اسم فيكاي داخل أروقة مجلس النواب كأحد المتواطئين المزعومين الذين يجب على وزارة العدل التحقيق معهم.\n\nيشار إلى أن فيكاي سبق له أن نفى أي علاقة غير مهنية بإبستين، مؤكداً أن علاقتهما كانت مهنية بحتة في إطار تطوير أعماله التجارية، وهو ما ينفيه المدعون الذين يزعمون أن إبستين ساعد \"فيكاي\" في تحويل علامته التجارية إلى إمبراطورية تجميل بمليارات الدولارات.\n\nرد قاض فدرالي أمريكي طلبا تقدمت به غيسلين ماكسويل، شريكة المدان بارتكاب جرائم جنسية جيفري إبستين، لإلغاء إدانتها بتهم الاتجار بالبشر لأغراض جنسية فيما تقضي حكما بالسجن لـ20 عاما.\n\nقد تكشف قريبا وثائق جديدة عن أدلة دامغة ضد المجرم الجنسي جيفري إبستين وشريكته غيسلين ماكسويل، بعدما أمرت قاضية فدرالية بالكشف عن كمية كبيرة من ملفات القضية التي ظلت سرية لسنوات.\n\nذكرت صحيفة \"لوموند\" أن منتجع \"سان تروبيه\" الفرنسي كان أحد المواقع الرئيسية التي يتم فيها تجنيد الشابات في شبكة الممول الأمريكي سيئ السمعة جيفري إبستين.\n\nعُثر على الفرنسي دانيال سياد مسؤول التوظيف المحترف في مجال عارضات الأزياء ميتا في منزله بضاحية كولومب شمال غرب باريس.\n\nصرح نائب الرئيس الأمريكي جي دي فانس، خلال ظهوره في برنامج \"تجربة جو روغان\"، بأنه يبدو أن المجرم الجنسي إبستين كان على صلة بعناصر من الدولة العميقة الإسرائيلية ذات ميول يسارية."}, {"guid": "https://arabic.rt.com/middle_east/1829093-%D8%A5%D8%AD%D8%B1%D8%A7%D9%82-%D9%85%D8%B3%D8%AC%D8%AF-%D8%A5%D8%AB%D8%B1-%D8%A7%D8%B4%D8%AA%D8%A8%D8%A7%D9%83%D8%A7%D8%AA-%D8%A8%D8%B3%D8%A8%D8%A8-%D8%AE%D9%84%D8%A7%D9%81-%D8%AD%D9%88%D9%84-%D8%A7%D9%84%D9%85%D9%88%D9%84%D8%AF-%D8%A7%D9%84%D9%86%D8%A8%D9%88%D9%8A-%D9%81%D9%8A-%D8%A7%D9%84%D8%B3%D9%88%D8%AF%D8%A7%D9%86-%D9%81%D9%8A%D8%AF%D9%8A%D9%88/", "title": "إحراق مسجد إثر اشتباكات بسبب خلاف حول المولد النبوي في السودان (فيديو)", "summary": "شهدت سوق جبل البوم للتعدين الأهلي بمحلية عبري شمال السودان أعمال عنف إثر خلاف ديني حول الاحتفال بالمولد النبوي، انتهت بإحراق مسجد وتدمير محتوياته، وفق إفادات متداولة.", "link": "https://arabic.rt.com/middle_east/1829093-%D8%A5%D8%AD%D8%B1%D8%A7%D9%82-%D9%85%D8%B3%D8%AC%D8%AF-%D8%A5%D8%AB%D8%B1-%D8%A7%D8%B4%D8%AA%D8%A8%D8%A7%D9%83%D8%A7%D8%AA-%D8%A8%D8%B3%D8%A8%D8%A8-%D8%AE%D9%84%D8%A7%D9%81-%D8%AD%D9%88%D9%84-%D8%A7%D9%84%D9%85%D9%88%D9%84%D8%AF-%D8%A7%D9%84%D9%86%D8%A8%D9%88%D9%8A-%D9%81%D9%8A-%D8%A7%D9%84%D8%B3%D9%88%D8%AF%D8%A7%D9%86-%D9%81%D9%8A%D8%AF%D9%8A%D9%88/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c38c84c59b725d0347cd6.png", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788617197, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nشهدت سوق جبل البوم للتعدين الأهلي بمحلية عبري شمال السودان أعمال عنف إثر خلاف ديني حول الاحتفال بالمولد النبوي، انتهت بإحراق مسجد وتدمير محتوياته، وفق إفادات متداولة.\n\nوبحسب المعلومات، اندلعت الاشتباكات عقب خلاف حاد حول حكم الاحتفال بالمولد النبوي، بين مؤيدين للاحتفال باعتباره جائزا، وآخرين يرونه من البدع. وتطورت مشادات كلامية وقعت أثناء صلاة الجمعة إلى عراك واشتباكات بالأيدي، قبل أن تمتد المواجهات إلى محيط المسجد.\n\nوأفادت مصادر محلية بأن الاشتباكات شهدت اعتداءات بالضرب على عدد من المصلين الموجودين داخل المسجد وحوله، وسط تصاعد التوتر بين أطراف النزاع، التي ينتمي بعضها إلى الجماعة السلفية والطرق الصوفية، وبين أبناء من قومية الهوسا ومجموعات من مناطق دارفور تعمل في مجال التعدين بالمنطقة.\n\nوأسفرت الأحداث، وفق المعلومات المتداولة، عن أضرار مادية كبيرة في المسجد، بعد إضرام النار فيه وتكسير عدد من مرافقه. كما شملت الخسائر تدمير منظومة للطاقة الشمسية واحتراق نحو 15 مكيفا، إلى جانب أضرار أخرى لحقت بمحتويات المسجد.\n\nوقال شهود عيان إن المجموعة التي أضرمت النار في المسجد أطلقت التكبير والتهليل عقب اندلاع الحريق، في مشهد أثار حالة من الاستنكار والصدمة بين الموجودين في موقع الحادث، وفق روايتهم.\n\nوأثارت الواقعة حالة من التوتر والقلق بين عمال التعدين والأهالي في سوق جبل البوم، في ظل مخاوف من اتساع نطاق الخلاف وتحوله إلى صراع مجتمعي أو ديني داخل منطقة تضم عاملين ينتمون إلى خلفيات قبلية ومناطقية واتجاهات دينية مختلفة.\n\nوطالب أهالي وعمال التعدين في المنطقة السلطات المحلية والأجهزة الأمنية بالتدخل العاجل لاحتواء التوتر، وفرض الأمن، والتحقيق في ملابسات الاعتداء على المسجد ومحاسبة المتورطين، إلى جانب اتخاذ إجراءات تحول دون تجدد الاشتباكات أو تفاقم الخلافات داخل أسواق التعدين.\n\nأعلن حاكم إقليم دارفور، مني أركو مناوي، دعمه وتأييده لخطوة إعلان الحوار السوداني-السوداني، مؤكدا أن مجرد فتح باب للحوار خطوة مهمة.\n\nمع اتساع رقعة القتال في السودان، تتفاقم معاناة المدنيين وسط موجات نزوح متواصلة،، يأتي ذلك في ظل تعثر وصول المساعدات الإنسانية، والمخاطر الصحية المتصاعدة التي تهدد حياة الآلاف.\n\nشهد جنوب كردفان في السودان موجة نزوح جديدة حيث فر 730 شخصا من عدة قرى الأحد الماضي وفق المنظمة الدولية للهجرة وسط انتشار للكوليرا يثير القلق.\n\nأفادت مصادر ميدانية لـRT بأن سلاح الجو السوداني شن غارات دقيقة استهدفت تجمعات لقوات الدعم السريع والحركة الشعبية جناح عبد العزيز الحلو في منطقة الموريب بولاية جنوب كردفان.\n\nاتهم مجلس السيادة السوداني إثيوبيا بالتورط في الصراع السوداني والسماح بانطلاق هجمات لقوات \"الدعم السريع\" من أراضيها، وذلك بالتزامن مع وصول قائدها \"حميدتي\" إلى العاصمة أديس أبابا.\n\nرفعت تشاد مستوى التأهب الأمني والعسكري إلى أقصى درجاته في مناطقها الشرقية المتاخمة للحدود مع السودان، وذلك في أعقاب اتهامها للجيش السوداني باستهداف قافلة عسكرية تشادية داخل أراضيها"}, {"guid": "https://arabic.rt.com/business/1829092-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%8A%D8%B9%D8%B7%D9%8A-%D8%A5%D8%B4%D8%A7%D8%B1%D8%A9-%D8%A8%D8%AF%D8%A1-%D8%AA%D8%AF%D9%81%D9%82-%D8%A3%D9%88%D9%84-%D8%B4%D8%AD%D9%86%D8%A9-%D9%85%D9%86-%D8%A7%D9%84%D9%86%D9%81%D8%B7-%D8%B9%D8%A8%D8%B1-%D9%85%D8%B4%D8%B1%D9%88%D8%B9-%D9%81%D9%88%D8%B3%D8%AA%D9%88%D9%83-%D8%A3%D9%88%D9%8A%D9%84-%D9%84%D9%85%D8%AD%D8%A9-%D8%B9%D9%86-%D8%A7%D9%84%D9%85%D8%B4%D8%B1%D9%88%D8%B9-%D8%A7%D9%84%D8%B9%D9%85%D9%84%D8%A7%D9%82/", "title": "بوتين يعطي إشارة بدء تدفق أول شحنة من النفط عبر مشروع \"فوستوك أويل\".. لمحة عن المشروع العملاق", "summary": "أعطى الرئيس الروسي فلاديمير بوتين، اليوم السبت، الإشارة الرسمية لتشغيل مشروع \"فوستوك أويل\" بشكل فعلي عبر تقنية الفيديو.", "link": "https://arabic.rt.com/business/1829092-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%8A%D8%B9%D8%B7%D9%8A-%D8%A5%D8%B4%D8%A7%D8%B1%D8%A9-%D8%A8%D8%AF%D8%A1-%D8%AA%D8%AF%D9%81%D9%82-%D8%A3%D9%88%D9%84-%D8%B4%D8%AD%D9%86%D8%A9-%D9%85%D9%86-%D8%A7%D9%84%D9%86%D9%81%D8%B7-%D8%B9%D8%A8%D8%B1-%D9%85%D8%B4%D8%B1%D9%88%D8%B9-%D9%81%D9%88%D8%B3%D8%AA%D9%88%D9%83-%D8%A3%D9%88%D9%8A%D9%84-%D9%84%D9%85%D8%AD%D8%A9-%D8%B9%D9%86-%D8%A7%D9%84%D9%85%D8%B4%D8%B1%D9%88%D8%B9-%D8%A7%D9%84%D8%B9%D9%85%D9%84%D8%A7%D9%82/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c3828423604460a18a58e.jpg", "category": "اقتصاد", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788616737, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nأعطى الرئيس الروسي فلاديمير بوتين، اليوم السبت، الإشارة الرسمية لتشغيل مشروع \"فوستوك أويل\" بشكل فعلي عبر تقنية الفيديو.\n\nوأعلن الرئيس بوتين اليوم عن بدء ضخ النفط رسميا في خط الأنابيب الرئيسي التابع للمشروع.\n\nبوتين يعلن قرب انطلاق أولى شحنات نفط \"فوستوك أويل\" إلى الأسواق والحدث الأبرز اليوم كان ربط حقول النفط التابعة للمشروع بخط الأنابيب والميناء الجديد \"خليج سيفير\"، وهو موقع محطة جديدة لشحن وتصدير النفط في روسيا، والذي يُعد جزءا أساسيا من مشروع \"فوستوك أويل\" العملاق في إقليم كراسنويارسك.\n\nومشروع \"فوستوك أويل\" (Vostok Oil) هو أضخم مشروع نفطي في القطب الشمالي الروسي، يمتد عبر خط أنابيب بطول 790 كيلومترا، يبدأ من حقول فانكوربايخا في شمال سيبيريا وينتهي عند ميناء \"خليج سيفير\" (Sever Bay) على شبه جزيرة تايمير. تبلغ الطاقة الاستيعابية القصوى لنقل النفط عبر هذا الخط 100 مليون طن سنويا (ما يعادل مليوني برميل يوميا)، مستهدفا تصدير هذه الإمدادات الهائلة مباشرة إلى الأسواق الآسيوية عبر طريق بحر الشمال."}, {"guid": "https://arabic.rt.com/culture/1829090-%D8%A8%D8%A7%D8%B3%D9%85-%D9%8A%D8%A7%D8%AE%D9%88%D8%B1-%D8%AA%D8%AD%D8%AA-%D8%A7%D9%84%D8%B6%D8%BA%D8%B7-%D8%B3%D8%A7%D9%85%D8%B1-%D8%A7%D9%84%D9%85%D8%B5%D8%B1%D9%8A-%D9%84%D9%85-%D9%8A%D8%AA%D8%AE%D8%B7%D9%87-%D9%88%D8%A8%D8%A7%D8%B3%D9%84-%D8%AE%D9%8A%D8%A7%D8%B7-%D9%88%D8%B1%D8%B7%D9%87-%D9%88%D8%A7%D8%B9%D8%AA%D8%B0%D8%A7%D8%B1-%D9%85%D8%A4%D8%AB%D8%B1-%D9%84%D9%88%D8%A7%D9%84%D8%AF%D8%AA%D9%87/", "title": "باسم ياخور \"تحت الضغط\".. سامر المصري لم يتخطه وباسل خياط \"ورّطه\" واعتذار مؤثر لوالدته", "summary": "في ظهوره الأول ضمن برنامج \"تحت الضغط\" مع الإعلامية ناديا الزعبي عبر قناة MBC، اختار الفنان السوري باسم ياخور أن يفتح أكثر من ملف، متحدثا بصراحة عن مسيرته وعلاقته بعدد من النجوم.", "link": "https://arabic.rt.com/culture/1829090-%D8%A8%D8%A7%D8%B3%D9%85-%D9%8A%D8%A7%D8%AE%D9%88%D8%B1-%D8%AA%D8%AD%D8%AA-%D8%A7%D9%84%D8%B6%D8%BA%D8%B7-%D8%B3%D8%A7%D9%85%D8%B1-%D8%A7%D9%84%D9%85%D8%B5%D8%B1%D9%8A-%D9%84%D9%85-%D9%8A%D8%AA%D8%AE%D8%B7%D9%87-%D9%88%D8%A8%D8%A7%D8%B3%D9%84-%D8%AE%D9%8A%D8%A7%D8%B7-%D9%88%D8%B1%D8%B7%D9%87-%D9%88%D8%A7%D8%B9%D8%AA%D8%B0%D8%A7%D8%B1-%D9%85%D8%A4%D8%AB%D8%B1-%D9%84%D9%88%D8%A7%D9%84%D8%AF%D8%AA%D9%87/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c36194c59b7253727fee2.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788615879, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nفي ظهوره الأول ضمن برنامج \"تحت الضغط\" مع الإعلامية ناديا الزعبي عبر قناة MBC، اختار الفنان السوري باسم ياخور أن يفتح أكثر من ملف، متحدثا بصراحة عن مسيرته وعلاقته بعدد من النجوم.\n\nوكان اسم الفنان سامر المصري حاضرا بقوة عندما جرى توجيه سؤال مباشر إلى ياخور حول الفنان الذي يعتقد أنه سبقه أو تجاوزه في الحضور الجماهيري.\n\nالإجابة جاءت واضحة، إذ أكد ياخور أنه لا يرى أن سامر المصري قد تخطاه فنياً، من دون أن يقلل في المقابل من قيمة التجربة التي حققها المصري، مشيداً بنجاحاته وحضوره اللافت وبصمته في عدد من الأعمال التي تركت أثرا لدى الجمهور.\n\nورأى ياخور أن مسيرته ومسيرة المصري سلكتا مسارين مختلفين، وأن اختلاف الخيارات الفنية والأعمال والجمهور يجعل المقارنة بينهما أمرا غير دقيق. كما أكد أنه لا يعتبر أن أي فنان من أبناء جيله قد تجاوزه فنيا، فيما أشار إلى أن تيم حسن وباسل خياط ينتميان إلى جيل سبقه.\n\nوبعيدا عن لغة المنافسة وحسابات النجومية، انتقل الحديث إلى بدايات ياخور الفنية، ليحضر اسم الفنان جمال سليمان بصورة مختلفة.\n\nواستعاد ياخور الدعم الذي تلقاه من سليمان في بداياته، معبّرا عن تقديره لهذا الدور، ومتوقفاً عند مشاركته في مسلسل \"الثريا\" للمخرج هيثم حقي، وهي تجربة يعتبرها من المحطات المهمة في مشواره، لما حملته من قيمة مهنية وأثر واضح في مسيرته اللاحقة.\n\nومن الملفات التي لطالما أثارت فضول الجمهور، علاقة ياخور بالفنان مكسيم خليل، والتي حسم بشأنها الجدل نافيا وجود خلاف أو توتر بينهما.\n\nواستعاد ياخور فترة جمعتهما في لبنان أثناء تصوير أحد الأعمال، موضحا أنهما كانا يقضيان الوقت معا ويتبادلان الأحاديث بعيدا عن أجواء التصوير، مؤكداً أن العلاقة بينهما جيدة وتقوم على الاحترام المتبادل.\n\nأما أكثر الملفات طرافة وتشويقا، فكان عند الحديث عن الفنان باسل خياط، وتحديداً عن اللقاء الذي جمعهما في برنامج \"أكلناها\".\n\n\"آدو وأولادو\" يعيد عابد فهد إلى الدراما المصوّرة في سوريا بعد 7 سنوات وكشف ياخور أن المزاح الذي دار بينهما خلال الحلقة انتهى بالنسبة إليه إلى \"ورطة\" حقيقية، بعدما تسببت بعض العبارات التي قيلت خلال البرنامج بإشكال استمرت تبعاته لأشهر.\n\nولم يخف ياخور إعجابه بقدرة خياط على التعامل مع المواقف، واصفا إياه بأنه ذكي جدا ويجيد قراءة التفاصيل، لافتا إلى أنه سيكون أكثر حذرا إذا خاض معه تجربة مشابهة مرة أخرى.\n\nلكن اللقاء اتخذ منحى مختلفا تماما عندما وصل الحديث إلى والدة باسم ياخور، إذ ابتعد الفنان عن أجواء النجومية والمنافسة، وظهر الجانب الإنساني في حديثه بوضوح.\n\nووجّه ياخور رسالة اعتذار مؤثرة إلى والدته، كاشفا أنه لم يتمكن من رؤيتها منذ نحو ثلاثة أعوام بسبب إقامتها في كندا، معبّرا عن أسفه لبعده عنها طوال هذه الفترة.\n\nوبين حديث عن النجومية، وذكريات البدايات، وتوضيح لعلاقات أثارت اهتمام الجمهور، وموقف طريف تحوّل إلى مشكلة، انتهى ظهور باسم ياخور في \"تحت الضغط\" عند أكثر نقاط اللقاء حساسية، من فنان يدافع عن مسيرته بثقة، إلى ابن يتحدث عن والدته بكثير من الندم والاشتياق، ليكشف البرنامج وجها أكثر قربا وصدقا من نجم اعتاد الجمهور رؤيته بأدواره خلف الشاشة.\n\nاحتضنت العاصمة اللبنانية بيروت حفل جوائز \"موريكس دور 2026\" في دورته السادسة والعشرين، وسط حضور واسع لنجوم الفن اللبناني والعربي.\n\nاختتم فريق مسلسل \"أعز الناس\" تصوير عمله في دمشق بعد إنجاز مشاهده كاملة لينتقل إلى مراحل المونتاج وما بعد الإنتاج، تمهيدا للكشف عن موعد عرضه والجهة التي ستتولى تقديمه للجمهور.\n\nفي لقاء صريح حمل الكثير من الرسائل السياسية والإنسانية، فتح الفنان السوري مكسيم خليل نافذة واسعة على رؤيته لمستقبل سوريا، متناولا قضايا العدالة والمصالحة والذاكرة الموجعة.\n\nاختتمت بالعاصمة المصرية القاهرة فعاليات \"قمة الإبداع 2026\" وسط حضور واسع لصناع الدراما والإنتاج التلفزيوني والإعلان والمحتوى الرقمي من مختلف الدول العربية."}, {"guid": "https://arabic.rt.com/sport/1829089-%D8%B1%D8%B3%D9%85%D9%8A%D8%A7-%D8%A7%D9%84%D8%A7%D8%AA%D8%AD%D8%A7%D8%AF-%D8%A7%D9%84%D8%AC%D8%B2%D8%A7%D8%A6%D8%B1%D9%8A-%D9%8A%D8%B9%D9%84%D9%86-%D8%B9%D9%86-%D8%A7%D9%84%D9%85%D8%AF%D8%B1%D8%A8-%D8%A7%D9%84%D8%AC%D8%AF%D9%8A%D8%AF-%D9%84%D9%84%D9%85%D9%86%D8%AA%D8%AE%D8%A8-%D8%A7%D9%84%D8%A3%D9%88%D9%84/", "title": "رسميا.. الاتحاد الجزائري يعلن عن المدرب الجديد للمنتخب الأول", "summary": "قرر الاتحاد الجزائري لكرة القدم تكليف المدرب المحلي إبراهيم حمداني، بقيادة الجهاز الفني للمنتخب الأول، خلفا للسويسري فلاديمير بيتكوفيتش، الذي ترك منصبه في أعقاب مونديال 2026.", "link": "https://arabic.rt.com/sport/1829089-%D8%B1%D8%B3%D9%85%D9%8A%D8%A7-%D8%A7%D9%84%D8%A7%D8%AA%D8%AD%D8%A7%D8%AF-%D8%A7%D9%84%D8%AC%D8%B2%D8%A7%D8%A6%D8%B1%D9%8A-%D9%8A%D8%B9%D9%84%D9%86-%D8%B9%D9%86-%D8%A7%D9%84%D9%85%D8%AF%D8%B1%D8%A8-%D8%A7%D9%84%D8%AC%D8%AF%D9%8A%D8%AF-%D9%84%D9%84%D9%85%D9%86%D8%AA%D8%AE%D8%A8-%D8%A7%D9%84%D8%A3%D9%88%D9%84/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c34ff42360444026c69ac.png", "category": "رياضة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788615451, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nقرر الاتحاد الجزائري لكرة القدم تكليف المدرب المحلي إبراهيم حمداني، بقيادة الجهاز الفني للمنتخب الأول، خلفا للسويسري فلاديمير بيتكوفيتش، الذي ترك منصبه في أعقاب مونديال 2026.\n\nوجاء تكليف حمداني، خلال الاجتماع الشهري للمكتب الفيدرالي للاتحاد الجزائري الذي عقد اليوم السبت.\n\nكما تقرر تعيين اللاعبين السابقين للمنتخب، عنتر يحيى، وموسى صايب في منصب المدرب المساعد والمدير العام على الترتيب.\n\nويأتي تعيين حمداني (48 عاما)، الذي لعب 4 مباريات مع \"الخضر\" في 2008، بعد نجاحه في قيادة منتخب الجزائر تحت 21 عاما إلى التتويج بذهبية ألعاب البحر الأبيض المتوسط والتي أقيمت في مدينة تارانتو الإيطالية.\n\nوسيبدأ حمداني، الذي لا يملك سجلا تدريبيا كبيرا، مشواره على رأس الجهاز الفني لمنتخب الجزائر، في المباراتين أمام زامبيا وبوروندي، المقررتين يومي 25 و29 سبتمبر على التوالي، لحساب الجولتين الأولى والثانية من تصفيات المجموعة التاسعة المؤهلة لنهائيات بطولة كأس أمم إفريقيا 2027.\n\nأعلن المدافع الجزائري عيسى ماندي، المنضم حديثا إلى نادي ليفانتي الإسباني لكرة القدم، اعتزال اللعب الدولي مع منتخب بلاده بعد مسيرة حافلة استمرت لنحو 13 عاما منذ بدايتها في 2013."}, {"guid": "https://arabic.rt.com/russia/1829086-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%83%D9%84-%D8%A7%D9%84%D8%B5%D8%B9%D8%A7%D8%A8-%D8%B9%D8%A7%D8%A8%D8%B1%D8%A9-%D9%88%D9%85%D9%88%D8%B3%D9%83%D9%88-%D9%88%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D8%AE%D8%A7%D9%84%D8%AF%D8%AA%D8%A7%D9%86/", "title": "بوتين: كل الصعاب عابرة.. وموسكو وروسيا خالدتان", "summary": "وجّه الرئيس فلاديمير بوتين، بمناسبة الذكرى السنوية لتأسيس موسكو تهنئة حارة لسكان العاصمة وكل مواطني روسيا، مشيدا بمكانة المدينة التاريخية كرمز لقوة الدولة وعزيمتها التي لا تلين.", "link": "https://arabic.rt.com/russia/1829086-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%83%D9%84-%D8%A7%D9%84%D8%B5%D8%B9%D8%A7%D8%A8-%D8%B9%D8%A7%D8%A8%D8%B1%D8%A9-%D9%88%D9%85%D9%88%D8%B3%D9%83%D9%88-%D9%88%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D8%AE%D8%A7%D9%84%D8%AF%D8%AA%D8%A7%D9%86/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c32e6423604449f711310.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788615031, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nوجّه الرئيس فلاديمير بوتين، بمناسبة الذكرى السنوية لتأسيس موسكو تهنئة حارة لسكان العاصمة وكل مواطني روسيا، مشيدا بمكانة المدينة التاريخية كرمز لقوة الدولة وعزيمتها التي لا تلين.\n\nوفي كلمته بمناسبة \"يوم مدينة موسكو\"، شدد الرئيس على أن كل الصعاب عابرة، وموسكو وروسيا خالدتان.\n\nوأعرب الرئيس بوتين عن ثقته بأن الجهود المشتركة لسكان موسكو ومواطني البلاد بأسرها كفيلة بالتغلب على أي صعوبات، مشيرا إلى أن الصعوبات التي تنشأ هي مسألة مؤقتة بطبيعتها، وأن موسكو وروسيا خالدتان.\n\nوفي معرض حديثه عن تطور العاصمة الروسية، أشاد الرئيس بوتين بجهود عمدة موسكو سيرغي سوبيانين وفريقه، وفي المقام الأول بجهود سكان المدينة أنفسهم. وأكد الرئيس بوتين أنه بفضل عملهم، تحولت موسكو إلى أحد المراكز الصناعية والعلمية والثقافية الرائدة في العالم، وأصبحت مدينة تشهد تطورا ديناميكيا متسارعا.\n\nوأشار الرئيس الروسي إلى إنجازات العاصمة في المجال الاجتماعي، وإنشاء المساحات العامة والأماكن الاجتماعية، والتطوير الحضري، والحفاظ على التراث الثقافي. وذكر رئيس الدولة على وجه الخصوص أنه تم خلال السنوات الخمس عشرة الماضية ترميم أكثر من 2500 مبنى أثري وقصر تاريخي وغيرها من المعالم المعمارية في موسكو.\n\nوبحسب تقييم الرئيس بوتين، فإن الجمع بين الحفاظ بعناية على التراث التاريخي والانفتاح على التوجهات الجديدة، والاهتمام بالسكان، والاستعداد لمساعدة الأقاليم الأخرى، يجعل من موسكو مدينة قوية وإنسانية ومضيافة في آنٍ واحد، تلعب دورا محوريا في تنمية روسيا بأسرها.\n\nمنح الرئيس الروسي فلاديمير بوتين عمدة موسكو سيرغي سوبيانين لقب بطل العمل في روسيا، تقديرا لجهوده في معالجة القضايا الاجتماعية والاقتصادية في العاصمة.\n\nنقل موقع \"موسكو 24\" عن عمدة موسكو، سيرغي سوبيانين، اكتمال ترميم أكثر من 30 موقعا للتراث الثقافي في العاصمة خلال النصف الأول من 2026."}, {"guid": "https://arabic.rt.com/russia/1829079-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D8%B6%D9%85%D8%A7%D9%86-%D8%B3%D9%84%D8%A7%D9%85%D8%A9-%D8%A7%D9%84%D8%A3%D8%B7%D9%81%D8%A7%D9%84-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D8%A5%D9%86%D8%AA%D8%B1%D9%86%D8%AA-%D9%85%D8%B3%D8%A3%D9%84%D8%A9-%D8%A8%D8%A7%D9%84%D8%BA%D8%A9-%D8%A7%D9%84%D8%A3%D9%87%D9%85%D9%8A%D8%A9/", "title": "بوتين: ضمان سلامة الأطفال على الإنترنت مسألة بالغة الأهمية", "summary": "وصف الرئيس الروسي فلاديمير بوتين مسألة ضمان سلامة الأطفال الروس على الإنترنت بأنها بالغة الأهمية.", "link": "https://arabic.rt.com/russia/1829079-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D8%B6%D9%85%D8%A7%D9%86-%D8%B3%D9%84%D8%A7%D9%85%D8%A9-%D8%A7%D9%84%D8%A3%D8%B7%D9%81%D8%A7%D9%84-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D8%A5%D9%86%D8%AA%D8%B1%D9%86%D8%AA-%D9%85%D8%B3%D8%A3%D9%84%D8%A9-%D8%A8%D8%A7%D9%84%D8%BA%D8%A9-%D8%A7%D9%84%D8%A3%D9%87%D9%85%D9%8A%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c304e4c59b7133d4bc82a.jpg", "category": "تكنولوجيا", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788614839, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nوصف الرئيس الروسي فلاديمير بوتين مسألة ضمان سلامة الأطفال الروس على الإنترنت بأنها بالغة الأهمية.\n\nواكد بوتين دعمه المقترحات التي ستقدمها المفوضة الرئاسية الروسية لحقوق الطفل، ماريا لفوفا-بيلوفا، إلى أعضاء مجلس الدوما، بشأن تحسين آليات ضمان سلامة الأطفال على الإنترنت.\n\nوقال بوتين: ناقشنا هذا الأمر مع الزملاء مؤخرا، قبل بضعة أيام فقط، خلال أحد منتدياتنا. إن مسألة سلامة الأطفال على الإنترنت بالغة الأهمية، وينبغي التعامل معها بحذر حتى لا ننتقص من حقوق الناس، لكن في الوقت نفسه يجب ضمان سلامة أطفالنا. ولذلك، سيكون هذا الأمر مطروحا أيضا، عليكم بالتأكيد إثارة هذه المسألة خلال تواصلكم مع النواب المستقبليين، وأنا سأدعمكم بكل سرور.\n\nوالتقى بوتين، اليوم السبت، \"الخماسي\" الفيدرالي المتصدر لقائمة مرشحي حزب \"روسيا الموحدة\" في انتخابات مجلس الدوما. وخلال اللقاء، أشارت المفوضة إلى ضرورة تطوير آليات حماية الأطفال وضمان سلامتهم على الإنترنت.\n\nتفاعل قرّاء صحيفة دي فيلت الألمانية بشكل قوي وحيوي مع التصريحات التي أدلى بها الرئيس الأمريكي دونالد ترامب بالأمس عن نظيره الروسي فلاديمير بوتين.\n\nهنأ الرئيس الروسي فلاديمير بوتين اليوم السبت أهالي موسكو بعيدهم \"يوم المدينة\" وأشاد بالإنجازات التي حققتها العاصمة الروسية في مختلف المجالات.\n\nأعلن المتحدث باسم الكرملين دميتري بيسكوف أن الرئيس الروسي فلاديمير بوتين أصدر أمرا بعدم شن أي غارات على العاصمة الأوكرانية كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة.\n\nأعرب الرئيس الأمريكي دونالد ترامب عن ثقته بأن روسيا ليس لديها نية لمهاجمة دول حلف \"الناتو\"، نافيا تقارير إعلامية تحدثت عن قلق واشنطن من احتمال إقدام موسكو على خطوة من هذا القبيل."}, {"guid": "CBMiU0FVX3lxTE01U1NOQTJFSEJfQ3kzVWF2dmt3TEFEbzdOeFUxUUxVQzVPd0R5Q2owZXNIblg3dGExYnl3TXBCVXItbFhXdkk2Y0tVdGVYUkQxOVM4", "title": "رئيس أركان الجيش يتفقد فرقة المشاة الآلية 25 ويطلع على جاهزيتها - وكالة الانباء العراقية (واع)", "summary": "رئيس أركان الجيش يتفقد فرقة المشاة الآلية 25 ويطلع على جاهزيتها &nbsp;&nbsp; وكالة الانباء العراقية (واع)", "link": "https://news.google.com/rss/articles/CBMiU0FVX3lxTE01U1NOQTJFSEJfQ3kzVWF2dmt3TEFEbzdOeFUxUUxVQzVPd0R5Q2owZXNIblg3dGExYnl3TXBCVXItbFhXdkk2Y0tVdGVYUkQxOVM4?oc=5", "image": "", "category": "سياسة", "source_id": "ina", "source_name": "الوكالة العراقية (العراق)", "source_cat": "وكالة رسمية", "published": 1788614771, "detail": ""}, {"guid": "be228b00-a924-11f1-bede-57fb3c282588", "title": "ريبورتاج - ألمانيا: ساكسونيا-أنهالت قد تصبح أول مقاطعة يحكمها اليمين المتطرف منذ عهد النازية", "summary": "كشفت استطلاعات الرأي، أن أولريش سيغموند مرشح حزب \"البديل من أجل ألمانيا\"، قد يفوز بغالبية مطلقة في الانتخابات الإقليمية بمقاطعة ساكسونيا-أنهالت (شرق) المقررة الأحد، ما سيتيح له لأول مرة تأليف حكومة محلية وهو ما سيكون أيضا سابقة لليمين المتطرف في تاريخ البلاد منذ عهد النازية ونهاية الحرب. وراهن الحزب", "link": "https://www.france24.com/ar/%D8%A3%D9%88%D8%B1%D9%88%D8%A8%D8%A7/20260905-%D8%A7%D9%84%D8%A7%D9%86%D8%AA%D8%AE%D8%A7%D8%A8%D8%A7%D8%AA-%D8%A7%D9%84%D8%A5%D9%82%D9%84%D9%8A%D9%85%D9%8A%D8%A9-%D8%A3%D9%84%D9%85%D8%A7%D9%86%D9%8A%D8%A7-%D8%B3%D8%A7%D9%83%D8%B3%D9%88%D9%86%D9%8A%D8%A7-%D8%A3%D9%86%D9%87%D8%A7%D9%84%D8%AA-%D8%AD%D8%B2%D8%A8-%D8%A7%D9%84%D8%A8%D8%AF%D9%8A%D9%84-%D8%A7%D9%84%D9%8A%D9%85%D9%8A%D9%86-%D8%A7%D9%84%D9%85%D8%AA%D8%B7%D8%B1%D9%81-%D8%A7%D9%84%D9%86%D8%A7%D8%B2%D9%8A%D8%A9", "image": "https://s.france24.com/media/display/28db8d ألف بيزو (6.3 آلاف دولار) في محكمة بمدينة كيزون.\n\nوأشارت القناة إلى أنه تم تسديد قيمة الكفالة بعد صدور مذكرة اعتقال بحقها بتهمة التهديد بالقتل.\n\nالفلبين.. صدور مذكرة توقيف بحق نائبة رئيس البلاد وأكد بول لورينس ليم، محامي الدفاع عن نائبة رئيس الفلبين، واقعة دفع الكفالة، ونوه بأن الشرطة لم تقم باعتقال دوتيرتي-كاربيو لأنها توجهت مباشرة إلى المحكمة. وبعد إيداع المبلغ، تم إلغاء مذكرة الاعتقال.\n\nوأصدرت محكمة مدينة كيزون يوم الجمعة مذكرة اعتقال بحق دوتيرتي-كاربيو بناء على توجيه وزارة العدل في الفلبين، في أوائل أغسطس، اتهامات إلى نائبة الرئيس بثلاث تهم تتعلق بالتهديد بالقتل، عندما صرحت علنا أنها استأجرت شخصا للتخلص من الرئيس فرديناند ماركوس الابن، وزوجته ليزا أرانيتا ماركوس، والمتحدث السابق باسم مجلس النواب مارتن روموالديز، وذلك في حال نجاح محاولة اغتيال مفترضة ضدها شخصيا.\n\nوأوصت النيابة العامة بتحديد كفالة قدرها 120 ألف بيزو (2.1 ألف دولار) عن كل تهمة.\n\nمن جانبه، قدم دفاع دوتيرتي-كاربيو التماسا لإسقاط التهم، مستندا إلى قضايا تتعلق بالاختصاص القضائي والحصانة الإجرائية وفقا لحماية بعض المسؤولين بموجب الدستور. وكانت نائبة الرئيس قد صرحت في وقت سابق بأن كلماتها \"أُخرجت بشكل خبيث من سياقها المنطقي\"، وأن تصريحاتها بشأن الاغتيال كانت تهدف فقط إلى تسليط الضوء على التهديد الذي يواجه سلامتها الشخصية. وفي الوقت نفسه، رفضت المحكمة سابقا تهم التحريض على التمرد المتعلقة بالواقعة نفسها.\n\nبدأت اليوم الاثنين في الفلبين مداولات عزل نائبة الرئيس سارة دوتيرتي في قضية ذات أبعاد سياسية، يرى الخبراء أنها قد تؤثر على خطط ترشحها للرئاسة عام 2028."}, {"guid": "CBMihwNBVV95cUxON0lYTDJfSmVTUmVXeWx0S1lrRWhnVzJtRWw0eDZORXFkeUxDMEZzV3B5YmxTV2FqRHE0RzhNUkJobk4tLVJqUEc2YldaT0RuQUZzOHE3dkVJeFg2aTdxcXhpdnRDOVBjdzA2ZWFsNElhekdZQUpGMHVIQ2VTekxwRGpqeHJTTWJES0FwQ01uR2Mza3dncFluYmhDM2tXMjkyTzljdzMzbnJQTVVLUXB0NVptR1VMNDZuQmNpY0hvdklSOU1taEpTQ1pkM2lBMjVRNVpRV2FydkwyQVBLa0ZKLTQ4cGxSYS1UWjRvejIxM1JvQnIzNFJUdTY2cm44NXctdDdqdGZod3BTb1BLbDNxTDBWa3FIX3lkN3pQQXpDcGhGc1ZLaTB1QUZUZjhoMVpTdUZyYnhzTWNKbDM3a1ZPUkRrU05CN2NwTGNWTC1ia2VtWlExQTlOT3p1bGw1aGdneFVMN2RtaXY3QXVtQjdraHljVzVMSHNRcm9GVkNMV1VERzZDUkdF", "ti
