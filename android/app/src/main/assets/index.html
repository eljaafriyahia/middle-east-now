 أن الجانب الأوكراني خفض بشكل كبير كثافة ضرباته على الأراضي الروسية منذ منتصف ليل 5 سبتمبر، مشيرا إلى أن القوات المسلحة الروسية لم تشن ضربات على كييف منذ ذلك الموعد، في خطوة وصفتها موسكو بأنها هدنة \"جزئية\" تم الاتفاق عليها عبر قنوات الأجهزة الأمنية.\n\nوأضاف بوتين أن روسيا تلقت اقتراحا بوقف مؤقت للضربات على كييف عبر القنوات الرسمية لأجهزة الاستخبارات ووزارة الخارجية، لكنه شدد على أن السلطات الأوكرانية نشرت دعوتها لهدنة أوسع لمدة ثلاثة أيام، بينما لم تناقش موسكو ذلك مع الجانب الأوكراني مباشرة.\n\nوكان الرئيس الأمريكي دونالد ترامب قد أشار إلى أن المبعوثين سيقدمان خلال زيارتهما إلى موسكو مقترحات لإنهاء النزاع في أوكرانيا. ويأتي هذا الاجتماع، وهو السادس من نوعه بين بوتين والمفاوضين الأمريكيين، وسط جهود دبلوماسية مكثفة تهدف إلى تحقيق تقدم في الملف الأوكراني، حيث من المقرر أن يتوجه ويتكوف وكوشنر غدا إلى كييف للقاء فلاديمير زيلينسكي.\n\nوكان ويتكوف وكوشنر قد وصلا موسكو السبت، والتقيا مساء بالرئيس الروسي في الكرملين، في إطار الجهود الأمريكية المستمرة للوساطة بين موسكو وكييف.\n\nوتزامنا مع هذه المحادثات، أصدر الرئيس بوتين تعليماته بوقف جميع الضربات الجوية على العاصمة الأوكرانية كييف لمدة ثلاثة أيام، بدءا من منتصف ليل السبت، وهي خطوة مرتبطة بإجراء اتصالات المبعوثين الأمريكيين في كييف. وأوضح المتحدث باسم الكرملين، دميتري بيسكوف، أن الجانب الأوكراني أُبلغ بهذه الخطوة.\n\nأكد الرئيس الروسي فلاديمير بوتين خلال لقائه المبعوثين الأمريكيين الخاصين ستيف ويتكوف وجاريد كوشنر، استمرار زعيمي روسيا والولايات المتحدة الحفاظ على اتصالاتهما الشخصية.\n\nأفادت غرفة العمليات في مقاطعة بيلغورود الروسية بأن شخصا واحدا لقى حتفه وأصيب آخر، اليوم السبت، بعد هجوم بطائرة مسيرة أطلقتها القوات الأوكرانية.\n\nصرّح الرئيس فلاديمير بوتين في اجتماع مع المفاوضين الأمريكيين، بأن روسيا لم تتفق مع أوكرانيا على وقف إطلاق نار أوسع نطاقا لمدة ثلاثة أيام لوقف الهجمات على العاصمتين.\n\nشكر المبعوث الأمريكي الخاص ستيف ويتكوف الرئيس الروسي فلاديمير بوتين على تسليم الولايات المتحدة المدان السابق في مشاة البحرية الأمريكية روبرت غيلمان.\n\nوجه المبعوث الخاص للرئيس الأمريكي ستيف ويتكوف الشكر إلى الرئيس الروسي فلاديمير بوتين على وقف الضربات لمدة ثلاثة أيام لإجراء المفاوضات، وذلك خلال لقائهما مساء السبت في الكرملين.\n\nأعلن الرئيس الروسي فلاديمير بوتين مناقشة \"جميع مكونات وجوانب\" النزاع الأوكراني خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، في الاجتماع السادس من نوعه معهما.\n\nأمضى المبعوثان الأمريكيان ستيف ويتكوف وجاريد كوشنر مع الممثل الخاص للرئيس الروسي كيريل دميترييف أكثر من ثلاث ساعات في غداء عمل بمطعم \"كل شيء من أجل النصر\" في موسكو.\n\nشارك مساعد الرئيس الروسي يوري أوشاكوف والمبعوث الخاص للتعاون الاستثماري والاقتصادي كيريل دميترييف في لقاء الرئيس فلاديمير بوتين مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر."}, {"guid": "https://arabic.rt.com/world/1829142-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D8%AD%D9%88%D8%A7%D8%B1%D9%8A-%D9%85%D8%B9-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%85%D9%86-%D8%A3%D9%83%D8%AB%D8%B1-%D8%A7%D9%84%D9%85%D8%AD%D8%B7%D8%A7%D8%AA-%D8%B1%D8%B3%D9%88%D8%AE%D8%A7-%D9%81%D9%8A-%D8%B0%D8%A7%D9%83%D8%B1%D8%AA%D9%8A/", "title": "ويتكوف: حواري مع بوتين من أكثر المحطات رسوخا في ذاكرتي", "summary": "قال المبعوث الأمريكي الخاص ستيف ويتكوف، في الكرملين اليوم، إنه يعتبر حواره مع الرئيس الروسي فلاديمير بوتين، أكثر المحطات رسوخا في الذاكرة.", "link": "https://arabic.rt.com/world/1829142-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D8%AD%D9%88%D8%A7%D8%B1%D9%8A-%D9%85%D8%B9-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%85%D9%86-%D8%A3%D9%83%D8%AB%D8%B1-%D8%A7%D9%84%D9%85%D8%AD%D8%B7%D8%A7%D8%AA-%D8%B1%D8%B3%D9%88%D8%AE%D8%A7-%D9%81%D9%8A-%D8%B0%D8%A7%D9%83%D8%B1%D8%AA%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c5cb1423604440107060a.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788632700, "detail": "قال المبعوث الأمريكي الخاص ستيف ويتكوف، في الكرملين اليوم، إنه يعتبر حواره مع الرئيس الروسي فلاديمير بوتين، أكثر المحطات رسوخا في الذاكرة.\n\nجاء تصريح ويتكوف اليوم السبت، وذلك خلال الجلسة الافتتاحية للمباحثات الرسمية والجديدة التي جرت في قصر الكرملين بالعاصمة الروسية موسكو.\n\nبوتين يلتقي ويتكوف للمرة السادسة وأضاف ويتكوف مخاطبا الرئيس بوتين: \"كنا نتطلع إلى هذا الاجتماع اليوم، وكنا خارج هذا المكتب - السيد دميترييف [الممثل الخاص لرئيس الاتحاد الروسي للاستثمار والتعاون الاقتصادي مع الدول الأجنبية، رئيس صندوق الاستثمار المباشر الروسي كيريل ديميترييف]، والسيد أوشاكوف،مساعد رئيس الاتحاد الروسي يوري أوشاكوف، وجاريد كوشنر، وأنا. وتحدثنا عما سنتذكره عندما نتقاعد، هناك الكثير من القصص التي سنتذكرها، وستكون محادثاتنا معك واحدة من أفضل المحادثات وأكثرها رسوخا في الذاكرة\".\n\nوالتقى الرئيس الروسي، اليوم السبت، بالمبعوث الأمريكي الخاص ستيف ويتكوف في روسيا للمرة السادسة.\n\nوبحث الرئيس الروسي والمبعوث الرئاسي الأمريكي لأول مرة التسوية الأوكرانية في 11 أبريل 2025 في بطرسبورغ. وعقدت جولة ثانية من المفاوضات بين بوتين والمفاوضين الأمريكيين في 25 أبريل 2025.\n\nوعقب تلك المفاوضات، عُقدت مفاوضات ثلاثية بين روسيا والولايات المتحدة وأوكرانيا في منتصف مايو العام الماضي. وعقد الاجتماع الثالث للرئيس الروسي مع المبعوثين الأمريكيين في 6 أغسطس، قبل لقاء بوتين مع الرئيس الأمريكي دونالد ترامب في أنكوريج.\n\nوفي ألاسكا، شارك كل من ويتكوف وكوشنر في القمة بين الرئيسين ضمن الوفد الأمريكي. والتقى بوتين مع ويتكوف للمرة الرابعة في موسكو في 2 ديسمبر من العام الماضي. أما الاجتماع الخامس والأخير، فقد عُقد في 22 يناير من هذا العام.\n\nأكد الرئيس الروسي فلاديمير بوتين خلال لقائه المبعوثين الأمريكيين الخاصين ستيف ويتكوف وجاريد كوشنر، استمرار زعيمي روسيا والولايات المتحدة الحفاظ على اتصالاتهما الشخصية.\n\nأفاد مصدر في متجر هدايا البيت الأبيض أن العملة التي تركها المبعوث الأمريكي الخاص ستيف ويتكوف في أحد مطاعم موسكو ليست مخصصة للبيع، بل هي قطعة تذكارية شخصية.\n\nشكر المبعوث الأمريكي الخاص ستيف ويتكوف الرئيس الروسي فلاديمير بوتين على تسليم الولايات المتحدة المدان السابق في مشاة البحرية الأمريكية روبرت غيلمان.\n\nوجه المبعوث الخاص للرئيس الأمريكي ستيف ويتكوف الشكر إلى الرئيس الروسي فلاديمير بوتين على وقف الضربات لمدة ثلاثة أيام لإجراء المفاوضات، وذلك خلال لقائهما مساء السبت في الكرملين.\n\nأعلن المتحدث باسم الكرملين دميتري بيسكوف أن الرئيس الروسي فلاديمير بوتين أصدر أمرا بعدم شن أي غارات على العاصمة الأوكرانية كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة."}, {"guid": "https://arabic.rt.com/middle_east/1829129-%D9%85%D8%B5%D8%B1-%D8%AA%D8%A4%D9%83%D8%AF-%D8%B6%D8%B1%D9%88%D8%B1%D8%A9-%D9%88%D9%82%D9%81-%D8%A7%D9%84%D8%AA%D8%AF%D8%AE%D9%84%D8%A7%D8%AA-%D8%A7%D9%84%D8%AE%D8%A7%D8%B1%D8%AC%D9%8A%D8%A9-%D9%81%D9%8A-%D8%AD%D8%B1%D8%A8-%D8%A7%D9%84%D8%B3%D9%88%D8%AF%D8%A7%D9%86/", "title": "مصر تؤكد ضرورة وقف التدخلات الخارجية في حرب السودان", "summary": "أكد وزير الخارجية المصري بدر عبد العاطي ضرورة وقف النزاع في السودان والحفاظ على وحدته، مشددا على ضرورة رفض التدخلات الخارجية التي تطيل أمد الأزمة وتعقد مسارات التسوية.", "link": "https://arabic.rt.com/middle_east/1829129-%D9%85%D8%B5%D8%B1-%D8%AA%D8%A4%D9%83%D8%AF-%D8%B6%D8%B1%D9%88%D8%B1%D8%A9-%D9%88%D9%82%D9%81-%D8%A7%D9%84%D8%AA%D8%AF%D8%AE%D9%84%D8%A7%D8%AA-%D8%A7%D9%84%D8%AE%D8%A7%D8%B1%D8%AC%D9%8A%D8%A9-%D9%81%D9%8A-%D8%AD%D8%B1%D8%A8-%D8%A7%D9%84%D8%B3%D9%88%D8%AF%D8%A7%D9%86/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c5547423604445d7937f8.png", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788632556, "detail": "أكد وزير الخارجية المصري بدر عبد العاطي ضرورة وقف النزاع في السودان والحفاظ على وحدته، مشددا على ضرورة رفض التدخلات الخارجية التي تطيل أمد الأزمة وتعقد مسارات التسوية.\n\nجاء ذلك خلال اتصال مع مسعد بولس، كبير مستشاري الرئيس الأمريكي للشؤون العربية والأفريقية، السبت، قالت الخارجية المصرية إنه يأتي \"في إطار التشاور المستمر بين مصر والولايات المتحدة، وتناول العلاقات الثنائية ومستجدات الأزمة في السودان وتطورات المشهد الليبي، وسبل تحقيق الأمن والاستقرار في البلدين\".\n\nمرتزقة وشحنات درونات وتكنولوجيا عسكرية.. تقرير يكشف أسباب تأجيج حرب السودان وفي الشأن السوداني، ذكر بيان الوزارة أن الجانبين استعرضا التحركات والاتصالات الجارية لوقف التصعيد والتعامل مع التدهور المتواصل في الأوضاع الإنسانية، فيما أكد الوزير المصري ضرورة البناء على الجهود الراهنة لوقف النزاع وضمان وصول المساعدات الإنسانية دون عوائق إلى مستحقيها.\n\nكما جدد عبد العاطي \"أهمية الحفاظ على وحدة السودان وسيادته وسلامة أراضيه، وصون مؤسساته الوطنية، ورفض التدخلات الخارجية التي من شأنها إطالة أمد الأزمة أو تعقيد مسارات تسويتها\".\n\nوأشار إلى أن \"إنهاء الأزمة السودانية يتطلب بالتوازي إطلاق مسار سياسي شامل بملكية وقيادة سودانية، يحفظ مؤسسات الدولة ويستجيب لتطلعات الشعب السوداني\".\n\nوفيما يتعلق بالأوضاع في ليبيا، بحث الطرفان سبل تهيئة الظروف اللازمة لإحراز تقدم في العملية السياسية في ليبيا وإنهاء حالة الانقسام، فيما أكد عبد العاطي أن مصر تنطلق في تحركاتها من أولوية الحفاظ على وحدة ليبيا وسيادتها وسلامة أراضيها ووحدة مؤسساتها الوطنية، مع أهمية أن تظل العملية السياسية ليبية خالصة، وفق البيان.\n\nوأشار الوزير المصري إلى أن إجراء الانتخابات الرئاسية والبرلمانية بالتزامن يمثل خطوة أساسية لاستعادة الاستقرار، مشددا على أهمية تكامل الجهود الإقليمية والدولية الداعمة للمسار السياسي، بما يساعد الليبيين على التوصل إلى تسوية مستدامة تعكس إرادتهم وتحفظ وحدة الدولة ومؤسساتها.\n\nشهدت سوق جبل البوم للتعدين الأهلي بمحلية عبري شمال السودان أعمال عنف إثر خلاف ديني حول الاحتفال بالمولد النبوي، انتهت بإحراق مسجد وتدمير محتوياته، وفق إفادات متداولة.\n\nأكد تقرير بعثة تقصي الحقائق المستقلة التابعة للأمم المتحدة أن تدفق المقاتلين يعزز القدرات العسكرية لأطراف النزاع السوداني، ويمكّنهم من تنفيذ عمليات تطيل أمد الحرب وتعقد المشهد.\n\nبحث وزير الخارجية المصري بدر عبد العاطي ووزير المالية والتخطيط الاقتصادي السوداني جبريل إبراهيم تعزيز التعاون الاقتصادي والتجاري ودعم جهود التعافي المبكر وإعادة إعمار السودان.\n\nكشفت مسودة تقرير أعدها فريق خبراء تابع للأمم المتحدة عن مشاركة مرتزقة كولومبيين في القتال إلى جانب قوات الدعم السريع في السودان، في الحرب الدائرة في البلاد منذ أكثر من ثلاثة أعوام.\n\nشدد مندوب مصر الدائم لدى الأمم المتحدة، السفير إيهاب عوض، على أن أي رهان على الفوضى أو الكيانات الموازية في السودان هو \"رهان خاسر لن يكتب له النجاح\"."}, {"guid": "https://arabic.rt.com/culture/1829138-%D8%A3%D8%B3%D8%B9%D8%A7%D8%B1-%D8%AA%D8%B0%D8%A7%D9%83%D8%B1-%D8%AD%D9%81%D9%84-%D8%A3%D8%B5%D8%A7%D9%84%D8%A9-%D9%86%D8%B5%D8%B1%D9%8A-%D8%AA%D8%AD%D9%84%D9%82-%D9%81%D9%8A-%D8%AF%D9%85%D8%B4%D9%82-%D9%88vvip-%D8%AE%D8%A7%D8%B1%D8%AC-%D8%A7%D9%84%D8%AD%D8%AC%D8%B2-%D8%A7%D9%84%D8%A5%D9%84%D9%83%D8%AA%D8%B1%D9%88%D9%86%D9%8A/", "title": "أسعار تذاكر حفل أصالة نصري تحلق في دمشق.. و\"VVIP\" خارج الحجز الإلكتروني", "summary": "كشفت شركة \"Ugar Events\" الجهة المنظمة لحفل الفنانة السورية أصالة نصري المرتقب في دمشق، عن الأسعار الرسمية لتذاكر الحفل المقرر إقامته في 17 سبتمبر الجاري في صالة الفيحاء الرياضية.", "link": "https://arabic.rt.com/culture/1829138-%D8%A3%D8%B3%D8%B9%D8%A7%D8%B1-%D8%AA%D8%B0%D8%A7%D9%83%D8%B1-%D8%AD%D9%81%D9%84-%D8%A3%D8%B5%D8%A7%D9%84%D8%A9-%D9%86%D8%B5%D8%B1%D9%8A-%D8%AA%D8%AD%D9%84%D9%82-%D9%81%D9%8A-%D8%AF%D9%85%D8%B4%D9%82-%D9%88vvip-%D8%AE%D8%A7%D8%B1%D8%AC-%D8%A7%D9%84%D8%AD%D8%AC%D8%B2-%D8%A7%D9%84%D8%A5%D9%84%D9%83%D8%AA%D8%B1%D9%88%D9%86%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c59304c59b757a7594c2c.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788632355, "detail": "كشفت شركة \"Ugar Events\" الجهة المنظمة لحفل الفنانة السورية أصالة نصري المرتقب في دمشق، عن الأسعار الرسمية لتذاكر الحفل المقرر إقامته في 17 سبتمبر الجاري في صالة الفيحاء الرياضية.\n\nالحجز انطلق اليوم.. وهذه تفاصيل الفئات وبدأ حجز التذاكر رسمياً صباح اليوم السبت 5 سبتمبر عبر منصة Evento، حيث توزعت المقاعد على عدة شرائح سعرية ضمن الفئات المحددة للحفل، وفق الأسعار الموضحة في الصور المرفقة. ولفتت الشركة المنظمة إلى أن بطاقات فئة VVIP لم تظهر ضمن خيارات الحجز عبر التطبيق، بعدما نفدت بالكامل قبل طرح باقي التذاكر إلكترونياً، في مؤشر على الإقبال المبكر على الحفل المنتظر.\n\nأصالة تلتقي جمهورها الدمشقي ويأتي الحفل المنتظر كواحد من أبرز الفعاليات الفنية المرتقبة في دمشق، مع عودة أصالة نصري للقاء جمهورها السوري في أمسية غنائية يُتوقع أن تجمع بين أشهر أغنياتها القديمة وأعمالها الحديثة، وسط اهتمام واسع بالحفل منذ الإعلان عنه. نصف الريع للأعمال الخيرية وكانت الشركة المنظمة قد أعلنت في وقت سابق أن نصف ريع الحفل سيُخصص للجمعيات الخيرية، ليحمل الحدث، إلى جانب طابعه الفني، بُعداً إنسانياً واجتماعياً. وبذلك، بدأت ملامح الحفل تتضح تدريجياً، من موعده ومكانه إلى أسعار تذاكره، فيما يبقى الموعد في 17 سبتمبر هو المحطة المنتظرة للقاء أصالة بجمهورها في دمشق.\n\nبين الحنين إلى المسرح السوري وتداول أخبار غير رسمية، عاد اسم جورج وسوف إلى الواجهة، وسط حديث عبر مواقع التواصل عن حفلات مرتقبة له في سوريا، الأمر الذي نفته مصادر إعلامية مقربة منه.\n\nبعد سنوات من الغياب عن المسرح السوري، تستعد أصالة نصري للعودة إلى جمهورها في دمشق عبر حفلين جماهيريين يومي 17 و19 سبتمبر المقبل في صالة الفيحاء.\n\nفي عمل يجمع دفء العلاقة بين الأم وابنتها بذاكرة المكان، تطل الفنانة السورية أصالة نصري بأغنية جديدة تحمل عنوان الأصالة."}, {"guid": "https://arabic.rt.com/features/1829133-%D8%B3%D9%84%D9%88%D9%81%D8%A7%D9%83%D9%8A%D8%A7-%D8%AA%D8%AD%D8%B0%D8%B1-%D9%85%D9%86-%D8%A3%D8%B2%D9%85%D8%A9-%D8%B7%D8%A7%D9%82%D8%A9-%D8%BA%D9%8A%D8%B1-%D9%85%D8%B3%D8%A8%D9%88%D9%82%D8%A9/", "title": "سلوفاكيا تحذر من أزمة طاقة غير مسبوقة", "summary": "حذر رئيس الحكومة السلوفاكية /روبرت فيتسو/ من تداعيات أزمة طاقة غير مسبوقة، نتيجة ما وصفها بالسياسات الأوروبية الخاطئة..", "link": "https://arabic.rt.com/features/1829133-%D8%B3%D9%84%D9%88%D9%81%D8%A7%D9%83%D9%8A%D8%A7-%D8%AA%D8%AD%D8%B0%D8%B1-%D9%85%D9%86-%D8%A3%D8%B2%D9%85%D8%A9-%D8%B7%D8%A7%D9%82%D8%A9-%D8%BA%D9%8A%D8%B1-%D9%85%D8%B3%D8%A8%D9%88%D9%82%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c5cf0423604445d793809.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788632341, "detail": "حذر رئيس الحكومة السلوفاكية /روبرت فيتسو/ من تداعيات أزمة طاقة غير مسبوقة، نتيجة ما وصفها بالسياسات الأوروبية الخاطئة..\n\nإلى ذلك أعلن وزير الدفاع الإستوني استقالته على خلفية جدل يتعلق بمخاطر شراء ذخائر لأوكرانيا من عوائد الأصول الروسية المجمدة."}, {"guid": "https://www.bbc.com/arabic/articles/c3re8gpe92xo#0", "title": "طهران تهاجم \"سفناً أمريكية\" رداً على استهداف واشنطن ثلاث ناقلات نفط تابعة للحرس الثوري", "summary": "قالت القيادة المركزية الأمريكية \"سنتكوم\" إنها \"عطّلت بشكل دائم\" ناقلة قرب جزيرة خرج، المركز الرئيسي لصادرات النفط الإيرانية، وأخرى قرب مدينة جاسك المطلة على مضيق هرمز، كما \"دمّرت بالكامل\" ناقلة ثالثة فارغة في خليج عُمان.", "link": "https://www.bbc.com/arabic/articles/c3re8gpe92xo?at_medium=RSS&at_campaign=rss", "image": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/0462/live/8127adc0-a938-11f1-aed2-8d6da8d75094.png", "category": "اقتصاد", "source_id": "bbc-arabic", "source_name": "بي بي سي عربي", "source_cat": "دولية", "published": 1788632291, "detail": "BBC News, عربيإذهب الى المحتوىرئيسيةشاهداستمعأقسامرئيسيةأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتطهران تهاجم \"سفناً أمريكية\" رداً على استهداف واشنطن ثلاث ناقلات نفط تابعة للحرس الثوريصدر الصورة، US Central Command\n\nأعلن الحرس الثوري الإيراني، يوم السبت، عن تنفيذ هجمات استهدفت عدة سفن، بينها سفن يزعم ارتباطها بالولايات المتحدة، وذلك رداً على ضربات أمريكية استهدفت ناقلات نفط إيرانية في وقت سابق من اليوم نفسه.\n\nوأوضح البيان الصادر عن البحرية التابعة للحرس الثوري أن قواتها استهدفت ثلاث ناقلات نفط أبحرت عبر ما وصفه بـ \"المسار غير المصرح به\" في مضيق هرمز، بالإضافة إلى ثلاث سفن أخرى مرتبطة بالولايات المتحدة في مناطق مختلفة.\n\nكما تضمن البيان تحذيراً لبقية السفن والناقلات البحرية من محاولة المرور عبر مسارات غير معتمدة في المنطقة.\n\nوكان الجيش الإيراني قد توعّد بشن هجمات \"أشد\" على السفن الحربية الأمريكية في المنطقة، إذا واصلت واشنطن استهداف السفن الإيرانية وفرض الحصار البحري على البلاد. وجاء التهديد بعد ساعات من إعلان الجيش الأمريكي استهداف ثلاث ناقلات نفط قال إنها تابعة للحرس الثوري الإيراني.\n\nوقالت القيادة المركزية لخاتم الأنبياء: \"نحذّر الجيش الأمريكي الإرهابي من أنه إذا استمرت الأعمال العدائية وتهديد الأمن ومضايقة السفن الإيرانية والحصار البحري المفروض على إيران، فستكون ضربات القوات المسلحة الإيرانية ضد السفن العسكرية الأمريكية في المنطقة أشد من السابق، وقد يتسع نطاقها\".\n\nوكانت القيادة المركزية الأمريكية \"سنتكوم\" قد قالت إن قواتها استهدفت الناقلات الثلاث رداً على إطلاق صواريخ باليستية باتجاه سفينتين حربيتين أمريكيتين.\n\nوبحسب \"سنتكوم\"، عطّلت القوات الأمريكية \"بشكل دائم\" الناقلة \"داوني\" قبالة جزيرة خرج، المركز الرئيسي لصادرات النفط الإيرانية، والناقلة \"ستارك 1\" قرب مدينة جاسك المطلة على مضيق هرمز، كما \"دمّرت بالكامل\" الناقلة الفارغة \"كايلو\" في خليج عُمان، بعد أن أمرت طاقمها بمغادرتها.\n\nوأضافت القيادة أن حاملة طائرات ومدمّرة مزودة بصواريخ موجهة أفلتتا من عدة هجمات شنّها الحرس الثوري الإيراني، مؤكدة عدم إصابة أي من أفراد القوات الأمريكية.\n\nوقال قائد \"سنتكوم\"، الأدميرال براد كوبر: \"لتكن الرسالة إلى الحرس الثوري واضحة: إذا أطلقتم النار على سفينتين لنا، فسنفرض عليكم كلفة اقتصادية أكبر باستهداف ثلاث سفن تابعة لكم\".\n\nوأضاف: \"لن نتردد في الدفاع عن القوات الأمريكية، وعند الضرورة، تدمير أسطول النفط الإيراني المحدود والمكشوف\".\n\nوكانت وكالة تسنيم الإيرانية شبه الرسمية قد أفادت بأن ناقلة إيرانية أصيبت بأربعة صواريخ أمريكية أثناء وجودها في مرسى جزيرة خرج، وأن طاقمها أُجلي من دون ورود تقارير عن إصابات.\n\nومن شأن استهداف ناقلات قرب جزيرة خرج أن يزيد الضغوط على قطاع النفط الإيراني واقتصاد البلاد، اللذين يتأثران بالفعل بالحصار البحري الأمريكي المفروض على صادرات النفط الإيرانية.\n\nيستحق الانتباهشرح معمق لأبرز الأحداث والموضوعات، لمساعدتك على فهم أهم المتغيرات حولك وأثرها على حياتك\n\nوكان الرئيس الأمريكي دونالد ترامب قد نشر، في 31 أغسطس/آب، مقطعاً مصوراً منشأً بالذكاء الاصطناعي، أرفقه بعبارة قال فيها إن جزيرة خرج \"تُسوّى بالأرض\"، فيما توعّدت السلطات الإيرانية برد قوي إذا تعرضت الجزيرة لهجوم.\n\nوتأتي الضربات بعد نحو أسبوع من تجدد المواجهات بين الولايات المتحدة وإيران، عقب شهر من الهدوء النسبي في الحرب التي اندلعت إثر الهجوم الأمريكي الإسرائيلي على إيران في 28 فبراير/شباط، في وقت لا يزال فيه المسار الدبلوماسي متعثراً.\n\nوكانت طهران قد أعلنت، الخميس، أن قواتها المسلحة استهدفت \"قواعد عسكرية أمريكية\" في الكويت والإمارات، متوعدة بالثأر لمقتل مدنيين خلال حفل زفاف في غارة نسبتها إلى واشنطن.\n\nوفي موازاة التصعيد، أعلن رئيس مجلس الشورى الإيراني محمد باقر قاليباف ترحيب بلاده بمقترح صيني لإنشاء بنية أمنية جديدة في المنطقة.\n\nوقال قاليباف: \"إن تركيز الصين على تعزيز الأمن المشترك يعكس ما تؤكد عليه إيران منذ سنوات... ينبغي لدول المنطقة أن تصنع مستقبلها بنفسها، فالاستقرار الحقيقي لا يتحقق إلا بإنشاء بنية أمنية إقليمية جديدة ومحلية. وإيران مستعدة لذلك\".\n\nوقالت الوزارة، الجمعة، إنها وافقت على بيع محتمل لذخائر من طراز \"الهجوم المباشر المشترك واسعة المدى\" (JDAM-ER) إلى السعودية، بقيمة تقديرية تبلغ خمسة مليارات دولار، على أن تكون شركة بوينغ المتعاقد الرئيسي.\n\nوتُستخدم هذه الذخائر لتحويل القنابل غير الموجهة إلى قنابل دقيقة التوجيه، فيما تتيح النسخة واسعة المدى منها إصابة أهداف من مسافات أبعد.\n\nكما وافقت الوزارة على صفقة محتملة أخرى مع السعودية، بقيمة 750 مليون دولار، لشراء محركات من طراز \"إيه جي تي 1500\"، تتولى شركة هانيويل تنفيذها. وبذلك تصل القيمة التقديرية للصفقتين إلى 5.75 مليار دولار.\n\nوفي العراق، وافقت الخارجية الأمريكية على بيع محتمل لطائرات هليكوبتر من طراز \"بيل 412 إي بي إكس\" ومعدات مرتبطة بها، بقيمة 150 مليون دولار، على أن تكون شركة بيل تكسترون المتعاقد الرئيسي.\n\nوجاءت الموافقة بعد أيام من إعلان صفقة محتملة أخرى للعراق بقيمة نحو 800 مليون دولار، تشمل طائرات هليكوبتر من طرازي \"بيل 412 إي بي إكس\" و\"بيل 407 إم\"، إلى جانب أسلحة وأجهزة استشعار وتجهيزات وخدمات دعم فني ولوجستي.\n\nوقالت واشنطن إن الصفقة الأوسع تهدف إلى تعزيز قدرات العراق في النقل الجوي والاستطلاع واستهداف الأهداف الأرضية، ومساعدته على مواجهة التهديدات الحالية والمستقبلية.\n\nووافقت الوزارة أيضاً على توفير خدمات محتملة لصيانة طائرات \"إف-16\" ومعدات مرتبطة بها لسلطنة عُمان، بتكلفة تقديرية تبلغ 188 مليون دولار.\n\nولا تعني موافقة وزارة الخارجية إبرام هذه الصفقات بصورة نهائية، إذ تمثل خطوة ضمن إجراءات المبيعات العسكرية الخارجية الأمريكية، وقد تتغير قيمتها أو المعدات المشمولة فيها قبل توقيع العقود.\n\nأنهت أسعار النفط تداولات الجمعة على مكاسب أسبوعية قوية، مدفوعة بتجدد المواجهات بين الولايات المتحدة وإيران واستمرار اضطراب حركة الشحن عبر مضيق هرمز.\n\nوأغلق خام برنت عند 96.28 دولاراً للبرميل، مرتفعاً 76 سنتاً، أو 0.8 في المئة، فيما أنهى خام غرب تكساس الوسيط التداولات عند 91.48 دولاراً، بزيادة 18 سنتاً، أو 0.2 في المئة.\n\nوعلى مدار الأسبوع، ارتفع خام برنت بنسبة 9.3 في المئة، بينما صعد الخام الأمريكي بنحو 9.7 في المئة، وسط مخاوف من تعطل إمدادات الطاقة القادمة من الشرق الأوسط.\n\nولم تنعكس على الأسعار بعد تداعيات إعلان الجيش الأمريكي، السبت، استهداف ثلاث ناقلات نفط قال إنها تابعة للحرس الثوري الإيراني، إذ جاء التطور بعد إغلاق الأسواق الأسبوعية. وقالت القيادة المركزية الأمريكية إنها عطّلت ناقلتين قرب جزيرة خرج ومدينة جاسك، ودمّرت ناقلة ثالثة فارغة في خليج عُمان.\n\nومن المرجح أن يزيد استهداف ناقلات النفط، ولا سيما قرب جزيرة خرج التي تشكل مركزاً رئيسياً للصادرات الإيرانية، المخاوف بشأن الإمدادات وحركة الملاحة عند استئناف التداولات.\n\nورغم قول الحكومة الأمريكية إن تدفقات النفط من الشرق الأوسط عادت خلال الأسابيع الأخيرة إلى مستويات قريبة من المعتاد، تشير بيانات تتبع السفن إلى استمرار الاضطرابات في حركة الشحن.\n\nوأظهرت بيانات أولية أن أربع سفن تجارية فقط عبرت مضيق هرمز، الخميس، مقارنة بمتوسط بلغ نحو 15 سفينة يومياً خلال الأيام العشرة السابقة.\n\nوقال نوربرت روكر، رئيس قسم الاقتصاد وأبحاث الجيل المقبل في بنك \"يوليوس باير\"، إن جمود الصراع وتجدد الأعمال القتالية يعيدان مراراً تنشيط \"علاوة المخاطر\" المضمنة في أسعار النفط.\n\nوأضاف أنه لم تظهر، حتى إغلاق الأسواق الجمعة، مؤشرات على أن تصعيد هذا الأسبوع أدى إلى شح ملموس في سوق النفط أو أثّر بصورة كبيرة في صادرات الشرق الأوسط، معتبراً أن ارتفاع الأسعار كان مدفوعاً أساساً بالمخاوف ومعنويات السوق.\n\nغير أن الضربات الأمريكية للناقلات، السبت، تمثل تصعيداً مباشراً ضد وسائل نقل النفط الإيراني، في وقت تقو"}, {"guid": "https://arabic.rt.com/world/1829139-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%8A%D8%A8%D8%AD%D8%AB-%D8%AA%D8%B3%D9%88%D9%8A%D8%A9-%D8%A7%D9%84%D9%86%D8%B2%D8%A7%D8%B9-%D8%A7%D9%84%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A-%D9%85%D8%B9-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%88%D9%83%D9%88%D8%B4%D9%86%D8%B1-%D9%81%D9%8A-%D9%85%D9%88%D8%B3%D9%83%D9%88/", "title": "بوتين يبحث تسوية النزاع الأوكراني مع ويتكوف وكوشنر في موسكو", "summary": "أعلن الرئيس الروسي فلاديمير بوتين مناقشة \"جميع مكونات وجوانب\" النزاع الأوكراني خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، في الاجتماع السادس من نوعه معهما.", "link": "https://arabic.rt.com/world/1829139-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%8A%D8%A8%D8%AD%D8%AB-%D8%AA%D8%B3%D9%88%D9%8A%D8%A9-%D8%A7%D9%84%D9%86%D8%B2%D8%A7%D8%B9-%D8%A7%D9%84%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A-%D9%85%D8%B9-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%88%D9%83%D9%88%D8%B4%D9%86%D8%B1-%D9%81%D9%8A-%D9%85%D9%88%D8%B3%D9%83%D9%88/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c5a284c59b7253727ff23.jpeg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788632219, "detail": "أعلن الرئيس الروسي فلاديمير بوتين مناقشة \"جميع مكونات وجوانب\" النزاع الأوكراني خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، في الاجتماع السادس من نوعه معهما.\n\nوقال بوتين في مستهل اللقاء الذي عُقد في الكرملين: \"سنناقش اليوم جميع مكونات النزاع وكافة جوانبه. ونحن من جانبنا مستعدون أيضا لإطلاعكم على رؤيتنا للوضع\".\n\nوأكد الرئيس الروسي أن الاتصالات من هذا النوع \"تفيد دائما\"، مشيرا إلى أن المحادثات تأتي في وقت يتوجه فيه المفاوضان لاحقا إلى كييف.\n\nوأشاد بوتين بجهود الرئيس الأمريكي دونالد ترامب، قائلا: \"أتفهم أنه يدخل في وضع صعب بشكل عام، ومع ذلك فهو لا يتوقف عن محاولاته للتسوية، وتقديم مساهمته في حل النزاع الروسي الأوكراني\". وأعرب عن ارتياح موسكو للعمل مع ويتكوف وكوشنر، مؤكدا أن \"مستوى الثقة خلال هذا العمل من جانبنا مرتفع جدا\"، ومشددا على أن \"جودة الوساطة والثقة في ممارسيها\" أمر بالغ الأهمية.\n\nوكان ويتكوف وكوشنر قد وصلا موسكو السبت، والتقيا مساء بالرئيس الروسي في الكرملين، في إطار الجهود الأمريكية المستمرة للوساطة بين موسكو وكييف.\n\nوتزامنا مع هذه المحادثات، أصدر الرئيس بوتين تعليماته بوقف جميع الضربات الجوية على العاصمة الأوكرانية كييف لمدة ثلاثة أيام، بدءا من منتصف ليل السبت، وهي خطوة مرتبطة بإجراء اتصالات المبعوثين الأمريكيين في كييف. وأوضح المتحدث باسم الكرملين، دميتري بيسكوف، أن الجانب الأوكراني أُبلغ بهذه الخطوة.\n\nأكد الرئيس الروسي فلاديمير بوتين خلال لقائه المبعوثين الأمريكيين الخاصين ستيف ويتكوف وجاريد كوشنر، استمرار زعيمي روسيا والولايات المتحدة الحفاظ على اتصالاتهما الشخصية.\n\nصرّح الرئيس فلاديمير بوتين في اجتماع مع المفاوضين الأمريكيين، بأن روسيا لم تتفق مع أوكرانيا على وقف إطلاق نار أوسع نطاقا لمدة ثلاثة أيام لوقف الهجمات على العاصمتين.\n\nشكر المبعوث الأمريكي الخاص ستيف ويتكوف الرئيس الروسي فلاديمير بوتين على تسليم الولايات المتحدة المدان السابق في مشاة البحرية الأمريكية روبرت غيلمان.\n\nوجه المبعوث الخاص للرئيس الأمريكي ستيف ويتكوف الشكر إلى الرئيس الروسي فلاديمير بوتين على وقف الضربات لمدة ثلاثة أيام لإجراء المفاوضات، وذلك خلال لقائهما مساء السبت في الكرملين.\n\nأكد الرئيس الروسي فلاديمير بوتين أن موسكو ستبذل قصارى جهدها لضمان أمن المفاوضين الأمريكيين في موسكو، وذلك خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر.\n\nشارك مساعد الرئيس الروسي يوري أوشاكوف والمبعوث الخاص للتعاون الاستثماري والاقتصادي كيريل دميترييف في لقاء الرئيس فلاديمير بوتين مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر."}, {"guid": "https://arabic.rt.com/sport/1829137-%D8%A8%D8%BA%D8%B1%D8%A7%D8%A8%D8%A9-%D8%B4%D8%AF%D9%8A%D8%AF-%D9%85%D8%B1%D9%85%D9%88%D8%B4-%D9%8A%D9%87%D8%AF%D8%B1-%D9%87%D8%AF%D9%81%D8%A7-%D9%85%D8%AD%D9%82%D9%82%D8%A7-%D9%88%D9%8A%D8%B9%D9%82%D8%AF-%D8%A8%D8%AF%D8%A7%D9%8A%D8%A9-%D8%AA%D9%88%D8%AA%D9%86%D9%87%D8%A7%D9%85-%D9%81%D9%8A-%D8%A7%D9%84%D8%AF%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D8%A5%D9%86%D8%AC%D9%84%D9%8A%D8%B2%D9%8A/", "title": "مرموش يهدر هدفا محققا ويعقد بداية توتنهام في الدوري الإنجليزي", "summary": "خيم التعادل السلبي على مواجهة توتنهام هوتسبير ومضيفه نوتنغهام فورست اليوم السبت، ضمن منافسات الجولة الثالثة من الدوري الإنجليزي الممتاز.", "link": "https://arabic.rt.com/sport/1829137-%D8%A8%D8%BA%D8%B1%D8%A7%D8%A8%D8%A9-%D8%B4%D8%AF%D9%8A%D8%AF-%D9%85%D8%B1%D9%85%D9%88%D8%B4-%D9%8A%D9%87%D8%AF%D8%B1-%D9%87%D8%AF%D9%81%D8%A7-%D9%85%D8%AD%D9%82%D9%82%D8%A7-%D9%88%D9%8A%D8%B9%D9%82%D8%AF-%D8%A8%D8%AF%D8%A7%D9%8A%D8%A9-%D8%AA%D9%88%D8%AA%D9%86%D9%87%D8%A7%D9%85-%D9%81%D9%8A-%D8%A7%D9%84%D8%AF%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D8%A5%D9%86%D8%AC%D9%84%D9%8A%D8%B2%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c597942360444df6c9425.png", "category": "رياضة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788632105, "detail": "خيم التعادل السلبي على مواجهة توتنهام هوتسبير ومضيفه نوتنغهام فورست اليوم السبت، ضمن منافسات الجولة الثالثة من الدوري الإنجليزي الممتاز.\n\nوشهدت المباراة إضاعة المهاجم الدولي المصري عمر مرموش، الوافد الجديد لصفوف توتنهام، فرصة هدف محقق عند الدقيقة 16 من الشوط الأول، بعدما انفرد بالمرمى تماما قبل أن يسدد الكرة بجوار القائم، مهدرا على فريقه فرصة التقدم في لقاء معقد انتهى بالتعادل السلبي.\n\nوبهذه النتيجة، حصد توتنهام أول نقطة له في مشواره بالبريميرليغ هذا الموسم، عقب تلقيه هزيمتين متتاليتين في الجولتين الأولى والثانية، ليواصل الفريق بدايته المتعثرة التي تضع منظومته الهجومية تحت ضغط تدارك الموقف سريعا في الجولات القادمة.\n\nيذكر أن إدارة توتنهام كانت قد حسمت التعاقد مع عمر مرموش قادما من مانشستر سيتي على سبيل الإعارة، مع إدراج بند يتيح أحقية الشراء بنهاية الموسم.\n\nتوصل نادي توتنهام هوتسبير الإنجليزي إلى اتفاق نهائي مع مانشستر سيتي لضم الدولي المصري عمر مرموش."}, {"guid": "https://arabic.rt.com/russia/1829136-%D9%85%D8%A7%D8%B0%D8%A7-%D8%AA%D9%86%D8%A7%D9%88%D9%84-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%88%D9%83%D9%88%D8%B4%D9%86%D8%B1-%D8%A8%D9%85%D8%B7%D8%B9%D9%85-%D9%83%D9%84-%D8%B4%D9%8A%D8%A1-%D9%85%D9%86-%D8%A3%D8%AC%D9%84-%D8%A7%D9%84%D9%86%D8%B5%D8%B1-%D9%81%D9%8A-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D9%82%D8%A8%D9%8A%D9%84-%D9%84%D9%82%D8%A7%D8%A1-%D8%A8%D9%88%D8%AA%D9%8A%D9%86/", "title": "ماذا تناول ويتكوف وكوشنر بمطعم \"كل شيء من أجل النصر\" في موسكو قبيل لقاء بوتين؟", "summary": "أمضى المبعوثان الأمريكيان ستيف ويتكوف وجاريد كوشنر مع الممثل الخاص للرئيس الروسي كيريل دميترييف أكثر من ثلاث ساعات في غداء عمل بمطعم \"كل شيء من أجل النصر\" في موسكو.", "link": "https://arabic.rt.com/russia/1829136-%D9%85%D8%A7%D8%B0%D8%A7-%D8%AA%D9%86%D8%A7%D9%88%D9%84-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%88%D9%83%D9%88%D8%B4%D9%86%D8%B1-%D8%A8%D9%85%D8%B7%D8%B9%D9%85-%D9%83%D9%84-%D8%B4%D9%8A%D8%A1-%D9%85%D9%86-%D8%A3%D8%AC%D9%84-%D8%A7%D9%84%D9%86%D8%B5%D8%B1-%D9%81%D9%8A-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D9%82%D8%A8%D9%8A%D9%84-%D9%84%D9%82%D8%A7%D8%A1-%D8%A8%D9%88%D8%AA%D9%8A%D9%86/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c598842360444c977ad2c.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788632087, "detail": "أمضى المبعوثان الأمريكيان ستيف ويتكوف وجاريد كوشنر مع الممثل الخاص للرئيس الروسي كيريل دميترييف أكثر من ثلاث ساعات في غداء عمل بمطعم \"كل شيء من أجل النصر\" في موسكو.\n\nوكما جرت العادة، قام ويتكوف بجولة في العاصمة الروسية قبل بدء محادثات الكرملين، وخلال رحلته إلى موسكو في ديسمبر الماضي، توقف هو وكوشنر لتناول الغداء في أحد مطاعم موسكو، حيث تذوقا المأكولات الروسية، بما في ذلك طبق \"بوسيكونتشيكي\" (فطائر لحم صغيرة مقلية).\n\nوكان المطعم الذي تناول فيه المفاوضان الأمريكيان غداء عملهما هذه المرة يقدم قائمة أقصر من الأطباق الروسية، ولم تكن أطباق البوسيكونتشيكي متوفرة، ومع ذلك، كان بإمكان الضيوف طلب الأوكروشكا (حساء مصنوع من الكفاس أو اللبن).\n\nوخلال إحدى زياراته السابقة، زار ويتكوف شارع ستاري أربات وحديقة زاريادي، وتذوق طبق \"شيبوريك\" (فطيرة مقرمشة من العجين الرقيق جدا، تحشى باللحم) في أحد مطاعم موسكو.\n\nوفي بطرسبورغ شهر أبريل الماضي، وقبل محادثاته مع الرئيس الروسي فلاديمير بوتين، زار ويتكوف كنيسا وكاتدرائية القديس إسحاق.\n\nوجه المبعوث الخاص للرئيس الأمريكي ستيف ويتكوف الشكر إلى الرئيس الروسي فلاديمير بوتين على وقف الضربات لمدة ثلاثة أيام لإجراء المفاوضات، وذلك خلال لقائهما مساء السبت في الكرملين.\n\nأكد الرئيس الروسي فلاديمير بوتين أن موسكو ستبذل قصارى جهدها لضمان أمن المفاوضين الأمريكيين في موسكو، وذلك خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر.\n\nيلتقي الرئيس الروسي فلاديمير بوتين اليوم بالمبعوث الأمريكي الخاص ستيف ويتكوف في روسيا للمرة السادسة.\n\nوصل المبعوثان الأمريكيان ستيف ويتكوف وجاريد كوشنر إلى العاصمة الروسية موسكو لإجراء مباحثات حول إنهاء النزاع في أوكرانيا."}, {"guid": "https://arabic.rt.com/world/1829135-%D8%A3%D9%88%D8%B4%D8%A7%D9%83%D9%88%D9%81-%D9%88%D8%AF%D9%85%D9%8A%D8%AA%D8%B1%D9%8A%D9%8A%D9%81-%D9%8A%D8%B4%D8%A7%D8%B1%D9%83%D8%A7%D9%86-%D9%81%D9%8A-%D9%85%D8%A8%D8%A7%D8%AD%D8%AB%D8%A7%D8%AA-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%85%D8%B9-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%88%D9%83%D9%88%D8%B4%D9%86%D8%B1/", "title": "أوشاكوف ودميترييف يشاركان في مباحثات بوتين مع ويتكوف وكوشنر", "summary": "شارك مساعد الرئيس الروسي يوري أوشاكوف والمبعوث الخاص للتعاون الاستثماري والاقتصادي كيريل دميترييف في لقاء الرئيس فلاديمير بوتين مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر.", "link": "https://arabic.rt.com/world/1829135-%D8%A3%D9%88%D8%B4%D8%A7%D9%83%D9%88%D9%81-%D9%88%D8%AF%D9%85%D9%8A%D8%AA%D8%B1%D9%8A%D9%8A%D9%81-%D9%8A%D8%B4%D8%A7%D8%B1%D9%83%D8%A7%D9%86-%D9%81%D9%8A-%D9%85%D8%A8%D8%A7%D8%AD%D8%AB%D8%A7%D8%AA-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%85%D8%B9-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%88%D9%83%D9%88%D8%B4%D9%86%D8%B1/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c595b423604449f711334.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788631585, "detail": "شارك مساعد الرئيس الروسي يوري أوشاكوف والمبعوث الخاص للتعاون الاستثماري والاقتصادي كيريل دميترييف في لقاء الرئيس فلاديمير بوتين مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر.\n\nوكان ويتكوف وكوشنر قد وصلا موسكو، اليوم السبت.\n\nبوتين يلتقي ويتكوف للمرة السادسة وأعلن الرئيس الأمريكي دونالد ترامب أن المبعوثين الأمريكيين سيحملان إلى موسكو مقترحات بشأن تسوية النزاع في أوكرانيا.\n\nوتجدر الإشارة إلى أن روسيا كانت قد أعلنت مرارا عن انفتاحها على المفاوضات حول التسوية في أوكرانيا، مشيرة إلى أن أي تسوية يجب أن تأخذ بعين الاعتبار الواقع على الأرض ومصالح روسيا الأمنية.\n\nأكد الرئيس الروسي فلاديمير بوتين خلال لقائه المبعوثين الأمريكيين الخاصين ستيف ويتكوف وجاريد كوشنر، استمرار زعيمي روسيا والولايات المتحدة الحفاظ على اتصالاتهما الشخصية.\n\nوجه المبعوث الخاص للرئيس الأمريكي ستيف ويتكوف الشكر إلى الرئيس الروسي فلاديمير بوتين على وقف الضربات لمدة ثلاثة أيام لإجراء المفاوضات، وذلك خلال لقائهما مساء السبت في الكرملين.\n\nأكد الرئيس الروسي فلاديمير بوتين أن موسكو ستبذل قصارى جهدها لضمان أمن المفاوضين الأمريكيين في موسكو، وذلك خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر.\n\nأعلن الرئيس الروسي فلاديمير بوتين مناقشة \"جميع مكونات وجوانب\" النزاع الأوكراني خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، في الاجتماع السادس من نوعه معهما."}, {"guid": "https://arabic.rt.com/world/1829124-%D9%85%D9%86-22-%D9%8A%D9%88%D9%85%D8%A7-%D8%A5%D9%84%D9%89-1413-%D8%AD%D9%83%D9%88%D9%85%D8%A9-%D9%85%D9%8A%D9%84%D9%88%D9%86%D9%8A-%D8%AA%D8%AD%D8%B7%D9%85-%D8%A7%D9%84%D8%B1%D9%82%D9%85-%D8%A7%D9%84%D9%82%D9%8A%D8%A7%D8%B3%D9%8A-%D9%84%D8%A3%D8%B7%D9%88%D9%84-%D9%85%D8%AF%D8%A9-%D8%A7%D8%B3%D8%AA%D9%85%D8%B1%D8%A7%D8%B1-%D9%81%D9%8A-%D8%AA%D8%A7%D8%B1%D9%8A%D8%AE-%D8%A5%D9%8A%D8%B7%D8%A7%D9%84%D9%8A%D8%A7/", "title": "من 22 يوما إلى 1413: حكومة ميلوني تحطم الرقم القياسي لأطول مدة استمرار في تاريخ إيطاليا", "summary": "أصبحت حكومة رئيسة الوزراء جورجا ميلوني أطول حكومة متواصلة في تاريخ إيطاليا منذ نهاية الحرب العالمية الثانية. وقد بلغت مدة استمراريتها في السلطة 1413 يوما.", "link": "https://arabic.rt.com/world/1829124-%D9%85%D9%86-22-%D9%8A%D9%88%D9%85%D8%A7-%D8%A5%D9%84%D9%89-1413-%D8%AD%D9%83%D9%88%D9%85%D8%A9-%D9%85%D9%8A%D9%84%D9%88%D9%86%D9%8A-%D8%AA%D8%AD%D8%B7%D9%85-%D8%A7%D9%84%D8%B1%D9%82%D9%85-%D8%A7%D9%84%D9%82%D9%8A%D8%A7%D8%B3%D9%8A-%D9%84%D8%A3%D8%B7%D9%88%D9%84-%D9%85%D8%AF%D8%A9-%D8%A7%D8%B3%D8%AA%D9%85%D8%B1%D8%A7%D8%B1-%D9%81%D9%8A-%D8%AA%D8%A7%D8%B1%D9%8A%D8%AE-%D8%A5%D9%8A%D8%B7%D8%A7%D9%84%D9%8A%D8%A7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c5731423604447a05e8e5.jpg", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788631473, "detail": "أصبحت حكومة رئيسة الوزراء جورجا ميلوني أطول حكومة متواصلة في تاريخ إيطاليا منذ نهاية الحرب العالمية الثانية. وقد بلغت مدة استمراريتها في السلطة 1413 يوما.\n\nووفقا لتقارير إخبارية دولية، بلغت حكومة ميلوني المحافظة هذا المعلم البارز في الرابع من سبتمبر 2026، في بلد اشتهر تاريخيا بتقلب تحالفاته السياسية وسرعة انهيار حكوماته.\n\nويعد هذا الاستقرار الاستثنائي مفارقة تاريخية بالنظر إلى أن متوسط عمر الحكومة الإيطالية منذ تأسيس الجمهورية عام 1946 لم يتجاوز 14 شهرا تقريبا، ويعزو مراقبون هذا الصمود إلى تماسك الائتلاف الحاكم، والقدرة على إدارة الملفات الداخلية دون أزمات سياسية حادة تدفع نحو حل البرلمان مبكرا.\n\nالمقارنة التاريخية: شبح \"أقصر حكومة\" في الذاكرة الإيطالية\n\nولإدراك حجم هذا الإنجاز، لا بد من استحضار الطرف الآخر من المعادلة التاريخية. فبينما تتفاخر حكومة ميلوني بالبقاء لأكثر من ثلاث سنوات ونصف السنة، تحتفظ ذاكرة السياسة الإيطالية بذكرى أقصر حكومة في تاريخ الجمهورية، وهي الحكومة الأولى التي ترأسها أمينتوري فانفاني عام 1954، والتي انهارت بعد 22 يوما فقط من تشكيلها بسبب خلافات حادة داخل الائتلاف وعدم القدرة على كسب ثقة البرلمان بشكل مستدام.\n\nوهذه المفارقة الزمنية الصارخة (22 يوما مقابل 1413 يوما) تسلط الضوء على التحول الجذري الذي شهدته روما، حيث كان تغيير الحكومات في العقود الأولى للجمهورية يعد أمرا روتينيا، مما يجعل استمرار حكومة ميلوني لهذه المدة الطويلة ظاهرة استثنائية في السياق الإيطالي المعاصر.\n\nورغم الاحتفاء المحلي بهذا الرقم القياسي، يحذر محللون سياسيون من أن طول مدة الحكومة لا يضمن بالضرورة نجاح سياساتها على المدى الطويل، فحكومة ميلوني لا تزال تواجه تحديات جسيمة، أبرزها إدارة الدين العام الإيطالي الضخم، والضغوط الأوروبية المستمرة بشأن ملفات الهجرة، والتداعيات الاقتصادية العالمية.\n\nومع ذلك، يظل تخطيها عتبة \"1413\" يوما علامة فارقة تثبت أن النظام السياسي الإيطالي قادر، تحت ظروف تحالفية معينة، على تجاوز نمط الحكومات المؤقتة الذي طبع أغلب فترات تاريخ إيطاليا الحديث.\n\nأعلنت رئيسة الوزراء جورجا ميلوني، خلال اجتماع \"تحالف الراغبين\" يوم الاثنين، عن تأييدها لإجراء مفاوضات لتسوية الصراع في أوكرانيا.\n\nأقرت رئيسة الوزراء الإيطالية جورجا ميلوني بأن العلاقات مع الرئيس الأمريكي دونالد ترامب لم تسر كما كانت تتوقع، رغم التقارب بينهما في عدد من الملفات.\n\nأظهرت استطلاعات الرأي أن حكومة رئيسة الوزراء الإيطالية جورجا ميلوني تفقد شعبيتها بشكل متزايد بين الناخبين الشباب في اتجاه قد يكون مكلفا في انتخابات 2027."}, {"guid": "https://www.bbc.com/arabic/articles/c62jn6g5y6go#0", "title": "لماذا غيّرت الأمم المتحدة خريطة العالم؟ وأي الخرائط أدقّ؟", "summary": "فيما تتبنى الأمم المتحدة خريطة جديدة للعالم تعكس الحجم الحقيقي لأفريقيا، نستعرض مزايا أبرز الخرائط المتداولة وأوجه القصور فيها.", "link": "https://www.bbc.com/arabic/articles/c62jn6g5y6go?at_medium=RSS&at_campaign=rss", "image": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/e80e/live/d224a510-a92f-11f1-bb81-8fbd2d2d397c.jpg", "category": "أخبار", "source_id": "bbc-arabic", "source_name": "بي بي سي عربي", "source_cat": "دولية", "published": 1788631251, "detail": "BBC News, عربيإذهب الى المحتوىرئيسيةشاهداستمعأقسامرئيسيةأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتلماذا غيّرت الأمم المتحدة خريطة العالم؟ وأي الخرائط أدقّ؟التعليق على الصورة، خريطة وفق إسقاط الأرض المتساوية (على اليمين) وأخرى وفق إسقاط مركاتور (على اليسار)Article InformationAuthor, ياروسلاف لوكيفPublished 5 سبتمبر/ أيلول 2026مدة القراءة: 4 دقائقدعت الأمم المتحدة مؤخراً إلى استبدال خريطة العالم السائدة بأخرى تعكس على نحو أدق الأحجام الحقيقية للقارات، ومنها أفريقيا.\n\nويهدف قرار \"تصحيح الخريطة\"، الذي اعتمدته الجمعية العامة للأمم المتحدة، إلى معالجة الخلل في خريطة مركاتور، التي تظهر فيها القارة الأفريقية بحجم يقارب غرينلاند، مع أنها أكبر منها بنحو 14 مرة في الواقع.\n\nواعتمد القرار خريطة جديدة تُعرف باسم إسقاط الأرض المتساوية، وهي تمثّل الأحجام الحقيقية للكتل اليابسة بصورة أدق، وإن كانت تنطوي بدورها على بعض أوجه القصور.\n\nوشهدت السنوات الماضية محاولات بارزة عدة لحل معضلة تمثيل سطح كروي بدقة على مستطيل مسطح، ولكل منها مزاياها وعيوبها.\n\nابتكر رسام الخرائط الفلمنكي جيراردوس مركاتور عام 1569 الخريطة التي تحمل اسمه، والتي لا تزال واسعة الانتشار حتى اليوم.\n\nوكان الغرض الأساسي منها مساعدة البحارة الأوروبيين على الإبحار في المحيطات، بحسب ما أوضحه أستاذ رسم الخرائط في كلية لندن الجامعية، جيمس تشيشاير.\n\nوقال تشيشاير لبي بي سي: \"كان يريد للخط المستقيم المرسوم على الخريطة أن يبدو مستقيماً في الواقع عند اتباع اتجاه ثابت للبوصلة. هذا هو الغرض الذي صُممت من أجله، وهي تؤديه ببراعة\".\n\nوللحفاظ على صحة هذه الزوايا على خريطة مسطحة، اضطر مركاتور إلى توسيع المسافات بين خطوط الشبكة كلما ابتعدت عن خط الاستواء في اتجاه القطبين."}, {"guid": "https://arabic.rt.com/funny/1829128-%D8%A7%D9%84%D8%B9%D8%AB%D9%88%D8%B1-%D8%B9%D9%84%D9%89-%D9%85%D9%85%D8%AB%D9%84-%D8%AA%D8%B1%D9%83%D9%8A-%D8%B4%D9%87%D9%8A%D8%B1-%D9%85%D9%8A%D8%AA%D8%A7-%D9%81%D9%8A-%D8%B4%D9%82%D8%AA%D9%87-%D9%81%D9%8A-%D8%A7%D8%B3%D8%B7%D9%86%D8%A8%D9%88%D9%84/", "title": "العثور على ممثل تركي شهير جثة هامدة بمنزله في إسطنبول", "summary": "أفادت صحيفة ميلييت بأنه تم العثور على الممثل التركي الشهير سرحات مصطفى كيليتش، المعروف لدى المشاهدين الروس بمسلسل \"العهد\" وفيلم \"البيات الشتوي\"، ميتا في شقته بإسطنبول.", "link": "https://arabic.rt.com/funny/1829128-%D8%A7%D9%84%D8%B9%D8%AB%D9%88%D8%B1-%D8%B9%D9%84%D9%89-%D9%85%D9%85%D8%AB%D9%84-%D8%AA%D8%B1%D9%83%D9%8A-%D8%B4%D9%87%D9%8A%D8%B1-%D9%85%D9%8A%D8%AA%D8%A7-%D9%81%D9%8A-%D8%B4%D9%82%D8%AA%D9%87-%D9%81%D9%8A-%D8%A7%D8%B3%D8%B7%D9%86%D8%A8%D9%88%D9%84/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c541042360444c977ad1c.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788631213, "detail": "أفادت صحيفة ميلييت بأنه تم العثور على الممثل التركي الشهير سرحات مصطفى كيليتش، المعروف لدى المشاهدين الروس بمسلسل \"العهد\" وفيلم \"البيات الشتوي\"، ميتا في شقته بإسطنبول.\n\nووفقا للصحيفة، تم العثور على الجثة حوالي الساعة 17:00 بالتوقيت المحلي (يتطابق مع توقيت موسكو) في حي نور تبه التابع لمنطقة كاغد خانة في إسطنبول. وقد توجهت صديقة الممثل البالغ من العمر 51 عاما إلى منزله، نظرا لعدم تمكنها من التواصل معه منذ يوم الخميس. وبعد عدم تلقيها أي رد على جرس الباب، فتحت المرأة الشقة باستخدام مفتاح كان بحوزتها، لتعثر على كيليتش جالسا بلا حراك على كرسي في غرفة المعيشة، فقامت على الفور باستدعاء خدمات الطوارئ.\n\nوفاة بطل العالم للتجديف جيرجي بوروش في حادث أليم وأفادت الصحيفة بأن الأطباء الذين وصلوا إلى المكان أعلنوا وفاة الممثل، وقد تم فتح تحقيق لمعرفة ملابسات الوفاة.\n\nويُعرف الممثل المذكور أعلاه، لدى المشاهدين الروس في المقام الأول من خلال المسلسل التركي \"العهد\" (Söz)، حيث جسد شخصية 'تشولاك' — أحد الأشرار الرئيسيين في العمل. كما لعب دور إرغون بلاك في المسلسل الشهير 'الـثمانينيات' (Seksenler)، ودور صالح بوزوك في الدراما التاريخية \"الوداع\" (Veda).\n\nكما شارك كيليتش في فيلم نوري بيلغي جيلان \"البيات الشتوي\" (Kış Uykusu)، الذي نال جائزة السعفة الذهبية في مهرجان كان السينمائي.\n\nكان الفنان الراحل يبلغ من العمر 51 عاماً عند وفاته. وصرحت صديقته للسلطات، وفقا لما نقلته وسائل الإعلام التركية مثل صحيفة سوزجو (Sözcü)، بأن الممثل الراحل كان يعاني من مرض سرطان الغدد الليمفاوية وكان يصارعه منذ فترة. بالإضافة إلى ذلك، أشارت تقارير أخرى إلى أنه اعتذر مؤخرا عن المشاركة في بعض الأعمال الفنية بسبب تدهور حالته الصحية وإصابته بإنزلاق غضروفي عنقي منعه الأطباء بسببه من أداء مشاهد الحركة. وكشفت فحوصات طبية أولية أُجريت في موقع الحادث عن وجود بعض الكدمات والزرقة حول عينيه وفي ذراعيه وساقيه. وبسبب هذه العلامات، صَنفت الشرطة التركية الوفاة مبدئياً على أنها \"وفاة مشبوهة\"، وتم فتح تحقيق جنائي موسع للكشف عما إذا كانت الوفاة طبيعية نتيجة تداعيات مرض السرطان، أم أن هناك شبهة جنائية وراء موته."}, {"guid": "CBMiTEFVX3lxTE82R2xLOGtKNmFnTEZ4TTVOYlh1NXdQX2NfOU9Jb215ZE4wcnBKTllHZUtEc1JHTXVHSXZwZW5abHlnT3lJbG84cHFfZzc", "title": "وزير النفط يعلن رفع الطاقة التصديرية إلى أكثر من ثلاثة ملايين برميل يومياً - وكالة الانباء العراقية (واع)", "summary": "وزير النفط يعلن رفع الطاقة التصديرية إلى أكثر من ثلاثة ملايين برميل يومياً &nbsp;&nbsp; وكالة الانباء العراقية (واع)", "link": "https://news.google.com/rss/articles/CBMiTEFVX3lxTE82R2xLOGtKNmFnTEZ4TTVOYlh1NXdQX2NfOU9Jb215ZE4wcnBKTllHZUtEc1JHTXVHSXZwZW5abHlnT3lJbG84cHFfZzc?oc=5", "image": "", "category": "سياسة",  «4+4» إلى رئاستي مجلس النواب والمجلس الأعلى للدولة في ليبيا.\n\nرحبت جامعة الدول العربية بالتطورات السياسية في ليبيا، وفي مقدمتها توقيع المشاركين في الاجتماع المصغر 4+4 على اتفاق تنفيذ أول محطتين من خارطة الطريق السياسية."}, {"guid": "https://www.dw.com/ar/باحثون-يحذرون-من-تراجع-مخزون-المياه-الجوفية-في-ألمانيا-بسبب-الحر/a-79047647?maca=ara-rss-ar-all-1125-rdf", "title": "باحثون يحذرون من تراجع مخزون المياه الجوفية في ألمانيا بسبب الحر", "summary": "دراسة تكشف عجزًا مائيًا قياسيًا في ألمانيا وأوروبا. مخزون يونيو 2026 دون المتوسط بـ25 غيغاطن، والخبراء يخشون عدم التعافي بنهاية العام حتى مع أمطار خريفية غزيرة.", "link": "https://www.dw.com/ar/باحثون-يحذرون-من-تراجع-مخزون-المياه-الجوفية-في-ألمانيا-بسبب-الحر/a-79047647?maca=ara-rss-ar-all-1125-rdf", "image": "", "category": "أخبار", "source_id": "dw-arabic", "source_name": "DW عربي", "source_cat": "دولية", "published": 1788630780, "detail": ""}, {"guid": "https://arabic.rt.com/middle_east/1829122-%D9%88%D9%83%D8%A7%D9%84%D8%A9-%D8%A7%D9%84%D8%A3%D9%86%D8%A8%D8%A7%D8%A1-%D8%A7%D9%84%D9%8A%D9%85%D9%86%D9%8A%D8%A9-%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%B3%D9%84%D8%AD%D8%A9-%D9%88%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%B4%D8%AA%D8%B1%D9%83%D8%A9-%D8%AA%D8%AD%D8%B1%D8%B1-%D9%85%D8%AF%D9%8A%D8%B1%D9%8A%D8%A9-%D8%AD%D9%8A%D8%B3-%D8%A8%D8%A7%D9%84%D9%83%D8%A7%D9%85%D9%84-%D9%85%D9%86-%D8%B3%D9%8A%D8%B7%D8%B1%D8%A9-%D8%A7%D9%84%D8%AD%D9%88%D8%AB%D9%8A%D9%8A%D9%86/", "title": "وكالة الأنباء اليمنية: القوات المسلحة والمشتركة تحرر مديرية حيس بالكامل من سيطرة الحوثيين", "summary": "أفادت وكالة الأنباء اليمنية بأن القوات المسلحة والقوات المشتركة قامت بتحرير مديرية حيس في الحديدة بالكامل من سيطرة الحوثيين، عقب استعادة المناطق الريفية التابعة للمديرية وتأمينها.", "link": "https://arabic.rt.com/middle_east/1829122-%D9%88%D9%83%D8%A7%D9%84%D8%A9-%D8%A7%D9%84%D8%A3%D9%86%D8%A8%D8%A7%D8%A1-%D8%A7%D9%84%D9%8A%D9%85%D9%86%D9%8A%D8%A9-%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%B3%D9%84%D8%AD%D8%A9-%D9%88%D8%A7%D9%84%D9%82%D9%88%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%B4%D8%AA%D8%B1%D9%83%D8%A9-%D8%AA%D8%AD%D8%B1%D8%B1-%D9%85%D8%AF%D9%8A%D8%B1%D9%8A%D8%A9-%D8%AD%D9%8A%D8%B3-%D8%A8%D8%A7%D9%84%D9%83%D8%A7%D9%85%D9%84-%D9%85%D9%86-%D8%B3%D9%8A%D8%B7%D8%B1%D8%A9-%D8%A7%D9%84%D8%AD%D9%88%D8%AB%D9%8A%D9%8A%D9%86/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c4fab42360443f45d09b9.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788630468, "detail": "أفادت وكالة الأنباء اليمنية بأن القوات المسلحة والقوات المشتركة قامت بتحرير مديرية حيس في الحديدة بالكامل من سيطرة الحوثيين، عقب استعادة المناطق الريفية التابعة للمديرية وتأمينها.\n\nونقلت وكالة الأنباء اليمنية \"سبأ\" عن مصدر عسكري، أن \"مدينة حيس كانت محررة، في حين ظلت أجزاء من أرياف المديرية تحت سيطرة الحوثيين، قبل أن تتمكن القوات اليوم من تحرير كافة المناطق الريفية التابعة للمديرية وتأمينها بالكامل\".\n\n\"مجلس المقاومة اليمنية\" يدعو لإسناد الجيش في معارك تعز ضد \"الحوثيين\" وأوضح المصدر العسكري أن \"القوات المسلحة استعادت المناطق الواقعة في مفرق البرح، وتوغلت باتجاه مواقع الحوثيين، وسط تراجع عناصرها، وسقوط عشرات القتلى والجرحى في صفوفها\".\n\nوأشار المصدر إلى أن \"القوات تواصل تأمين المناطق المحررة وتثبيت مواقعها، عقب استكمال تحرير مديرية حيس بالكامل\".\n\nوتقع حيس في الجزء الجنوبي الشرقي من محافظة الحديدة، وتربط بين الحديدة ومحافظتي تعز وإب، حيث يمر بها الخط الساحلي والشريان الرئيسي الذي يربط بين ميناء المخا ومدينة الحديدة، ما يجعلها موقعا مهما في المنطقة.\n\nاشتدت المواجهات في جبهات غرب تعز والساحل الغربي، إثر هجوم شنته حركة \"أنصار الله\" استهدف مقبنة والكدحة وجبل حبشي، سعيا لقطع الطريق بين تعز والمخا، وفق ما أفادت وسائل إعلام يمنية.\n\nحذر وزير الصناعة والتجارة اليمني محمد حزام الأشول من تداعيات الهجمات الحوثية على مدينة وميناء المخا على أمن التجارة الدولية والاقتصاد العربي، داعيا إلى موقف عربي موحد لمواجهتها.\n\nأعلنت القوات الحكومية اليمنية، أن جماعة \"أنصار الله\" الحوثية، استهدفت مديريات الساحل الغربي بـ14 صاروخا باليستيا، مشيرة إلى أنها أسقطت مسيرات وصدت هجوما بريا على الساحل الغربي.\n\nنشر الإعلام الحربي التابع للحوثيين مشاهد لاستهداف تجمعات وآليات قالوا إنها سعودية بطائرات \"رجوم\" محلية الصنع في عدة جبهات.\n\nأفاد مصدر عسكري يمني اليوم السبت بمقتل جندي وإصابة آخر بهجوم شنه الحوثيون بطائرة مسيرة في محافظة تعز جنوب غربي البلاد.\n\nأعلن الجيش اليمني، الثلاثاء، عن تنفيذ سلسلة غارات جوية بطائرات مسيّرة استهدفت مواقع متقدمة ومراكز قيادة للحوثي في جبهة الصلو جنوب شرقي محافظة تعز.\n\nأفاد مصدر عسكري يمني اليوم الاثنين بأن عناصر حركة \"أنصار الله\" الحوثية أطلقوا خمسة صواريخ باليستية باتجاه منطقة مضيق باب المندب."}, {"guid": "https://arabic.rt.com/features/1829123-%D8%BA%D8%B2%D8%A9-%D8%AA%D8%AA%D8%B5%D8%AF%D8%B1-%D8%A7%D9%84%D8%B3%D8%AC%D8%A7%D9%84-%D8%A7%D9%84%D8%A7%D9%86%D8%AA%D8%AE%D8%A7%D8%A8%D9%8A-%D9%81%D9%8A-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84/", "title": "غزة تتصدر السجال الانتخابي في إسرائيل", "summary": "تتقدم غزة إلى واجهة السجال الانتخابي في إسرائيل، وسط تصعيد ميداني متواصل..", "link": "https://arabic.rt.com/features/1829123-%D8%BA%D8%B2%D8%A9-%D8%AA%D8%AA%D8%B5%D8%AF%D8%B1-%D8%A7%D9%84%D8%B3%D8%AC%D8%A7%D9%84-%D8%A7%D9%84%D8%A7%D9%86%D8%AA%D8%AE%D8%A7%D8%A8%D9%8A-%D9%81%D9%8A-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c542c4c59b75873696452.jpg", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788630122, "detail": "يأتي ذلك وسط مخاوف فلسطينية من أن تتحول الحرب إلى أداة سياسية توظف في رسم ملامح المرحلة المقبلة على حساب السكان ومستقبل القطاع."}, {"guid": "https://arabic.rt.com/world/1829119-%D8%A7%D9%84%D8%A8%D9%86%D8%AA%D8%A7%D8%BA%D9%88%D9%86-%D9%8A%D8%AD%D9%82%D9%82-%D9%81%D9%8A-%D8%AA%D8%B3%D8%B1%D9%8A%D8%A8%D8%A7%D8%AA-%D8%B0%D8%AE%D8%A7%D8%A6%D8%B1-%D8%A7%D9%84%D8%AD%D8%B1%D8%A8-%D9%85%D8%B9-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D9%88%D9%8A%D8%AE%D8%B6%D8%B9-50-%D9%85%D9%86-%D9%83%D8%A8%D8%A7%D8%B1-%D9%82%D8%A7%D8%AF%D8%AA%D9%87-%D9%84%D8%A7%D8%AE%D8%AA%D8%A8%D8%A7%D8%B1%D8%A7%D8%AA-%D9%83%D8%B4%D9%81-%D8%A7%D9%84%D9%83%D8%B0%D8%A8/", "title": "تسريبات عن كمية ذخائر الحرب مع إيران.. البنتاغون يخضع 50 من كبار قادته لاختبارات كشف الكذب", "summary": "كشف مسؤولون أمريكيون مطلعون عن إخضاع نحو 50 من كبار ضباط وموظفي هيئة الأركان المشتركة في الجيش الأمريكي لاختبارات كشف الكذب (بوليغراف) خلال الشهر الماضي.", "link": "https://arabic.rt.com/world/1829119-%D8%A7%D9%84%D8%A8%D9%86%D8%AA%D8%A7%D8%BA%D9%88%D9%86-%D9%8A%D8%AD%D9%82%D9%82-%D9%81%D9%8A-%D8%AA%D8%B3%D8%B1%D9%8A%D8%A8%D8%A7%D8%AA-%D8%B0%D8%AE%D8%A7%D8%A6%D8%B1-%D8%A7%D9%84%D8%AD%D8%B1%D8%A8-%D9%85%D8%B9-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D9%88%D9%8A%D8%AE%D8%B6%D8%B9-50-%D9%85%D9%86-%D9%83%D8%A8%D8%A7%D8%B1-%D9%82%D8%A7%D8%AF%D8%AA%D9%87-%D9%84%D8%A7%D8%AE%D8%AA%D8%A8%D8%A7%D8%B1%D8%A7%D8%AA-%D9%83%D8%B4%D9%81-%D8%A7%D9%84%D9%83%D8%B0%D8%A8/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c4ca74c59b7253727ff0b.jpeg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788629597, "detail": "كشف مسؤولون أمريكيون مطلعون عن إخضاع نحو 50 من كبار ضباط وموظفي هيئة الأركان المشتركة في الجيش الأمريكي لاختبارات كشف الكذب (بوليغراف) خلال الشهر الماضي.\n\nجاء ذلك في إطار تحقيق موسع لتحديد مصدر تسريبات صحفية حساسة تتعلق بمخزونات البلاد من الذخائر المتطورة في ظل الحرب مع إيران.\n\nوتركزت أسئلة المحققين على ما إذا كان المسؤولون المذكورون قد سربوا إلى وسائل الإعلام معلومات سرية، لا سيما حول النقص الحاد في مخزونات صواريخ بعيدة المدى وصواريخ \"باتريوت\" الاعتراضية.\n\nوأشارت ثلاثة مصادر تحدثت لشبكة \"سي بي إس نيوز\" إلى أن الرئيس الأمريكي دونالد ترامب كان غاضبا من هذه التسريبات، نظرا لمحدودية عدد الأشخاص المخولين بالاطلاع على تلك التفاصيل، مما أثار مخاوف أمنية، حيث كان هناك قلق من احتمال وجود عميل استخباراتي أجنبي بينهم.\n\nرغم أن اختبارات كشف الكذب تعد جزءا من الإجراءات الروتينية لتجديد التصاريح الأمنية لكبار المسؤولين، إلا أن عدد ونطاق هذه الاختبارات ووصولها إلى أعلى المستويات العسكرية وُصف بأنه \"غير مسبوق\" في التاريخ الحديث.\n\nونقلت \"نيويورك تايمز\" عن الأدميرال المتقاعد دونالد غوتر قوله: \"لم أر قط استخداما لاختبارات كشف الكذب بهذا الاتساع أو على هذا المستوى الرفيع من الرتب العسكرية\".\n\nوأفاد مصدران مطلعان أنه لم يفشل أي من المسؤولين الذين خضعوا للاختبار في الأسئلة المخصصة لتحديد ما إذا كانوا هم مصدر التسريبات الصحفية. ويجري التحقيق في وقت تسود فيه أجواء من انعدام الثقة والارتياب داخل وزارة الحرب، وسط انتقادات لوزير الحرب بيت هيغسيث، الذي اتهمته بعض المصادر بتعزيز هذه الأجواء وإحاطة نفسه بدائرة ضيقة من الموالين. وأفادت تقارير بأن هيغسيث، منذ بداية العام الماضي، أقال وعرقل ترقيات ما لا يقل عن 80 جنرالا وأميرالا ومسؤولين آخرين.\n\nمن جانبه، قال المتحدث باسم البنتاغون شون بارنيل في بيان لـ\"سي بي إس نيوز\": \"لا تعلق الوزارة على المسائل الداخلية المتعلقة بالأفراد أو التحقيقات، لكنها تأخذ جميع تسريبات معلومات الأمن القومي السرية على محمل الجد وتحقق في الأمر وفقا لذلك. تأمين المعلومات السرية أمر بالغ الأهمية لضمان أمن الولايات المتحدة وقواتنا المنتشرة في جميع أنحاء العالم\".\n\nوجّه وزير الحرب الأمريكي بيت هيغسيث تحذيرا شديد اللهجة إلى إيران، ملوحا بعواقب عسكرية واقتصادية في حال استهداف السفن التابعة للبحرية الأمريكية في المنطقة.\n\nهاجمت قوات القيادة المركزية الأمريكية (سنتكوم) ثلاث ناقلات نفط خام إيرانية، ردا على قيام فيلق الحرس الثوري الإيراني بإطلاق صواريخ باليستية باتجاه مدمرتين تابعتين للبحرية الأمريكية."}, {"guid": "https://arabic.rt.com/sport/1829120-%D8%A3%D8%AA%D9%84%D8%AA%D9%8A%D9%83%D9%88-%D9%85%D8%AF%D8%B1%D9%8A%D8%AF-%D9%8A%D8%B3%D9%82%D8%B7-%D8%A8%D8%AB%D9%84%D8%A7%D8%AB%D9%8A%D8%A9-%D8%A3%D9%85%D8%A7%D9%85-%D8%A8%D9%84%D8%A8%D8%A7%D9%88-%D9%81%D9%8A-%D8%A7%D9%84%D8%AF%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D8%A5%D8%B3%D8%A8%D8%A7%D9%86%D9%8A/", "title": "أتلتيكو مدريد يسقط بثلاثية أمام بلباو في الدوري الإسباني", "summary": "تلقى فريق أتلتيكو مدريد هزيمة ثقيلة خارج ملعبه أمام مضيفه أتلتيك بلباو بثلاثية دون رد ضمن منافسات الجولة الرابعة من الدوري الإسباني لكرة القدم.", "link": "https://arabic.rt.com/sport/1829120-%D8%A3%D8%AA%D9%84%D8%AA%D9%8A%D9%83%D9%88-%D9%85%D8%AF%D8%B1%D9%8A%D8%AF-%D9%8A%D8%B3%D9%82%D8%B7-%D8%A8%D8%AB%D9%84%D8%A7%D8%AB%D9%8A%D8%A9-%D8%A3%D9%85%D8%A7%D9%85-%D8%A8%D9%84%D8%A8%D8%A7%D9%88-%D9%81%D9%8A-%D8%A7%D9%84%D8%AF%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D8%A5%D8%B3%D8%A8%D8%A7%D9%86%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c4ef242360444026c69d3.png", "category": "رياضة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788629270, "detail": "تلقى فريق أتلتيكو مدريد هزيمة ثقيلة خارج ملعبه أمام مضيفه أتلتيك بلباو بثلاثية دون رد ضمن منافسات الجولة الرابعة من الدوري الإسباني لكرة القدم.\n\nوصادف أتلتيكو مدريد حالة من غياب التوفيق، حيث كان الأكثر وصولا لمرمى المنافس والأكثر سيطرة واستحواذا، بنسبة امتلاك للكرة بلغت 61 بالمئة ودقة تمرير بلغت 91 بالمئة مقابل 86 بالمئة لبلباو.\n\nولكن الفريق صاحب الأرض نجح في حسم الأمور لمصلحته في غضون دقيقتين فقط من بداية الشوط الثاني، فبعد شوط أول سلبي، نجح بلباو في أن يبادر بالتقدم، بهجمة سريعة، ومتابعة من نيكو ويليامز لكرة عرضية أمام المرمى في الدقيقة 46، ليتقدم بلباو بهدف أول.\n\nوفي الدقيقة 48، أي بعد نحو دقيقتين فقط من هدف التقدم، عزز بلباو النتيجة بهدف ثان عن طريق روبرت نارفارو، بعدما تسلم تمريرة من إينياكي ويليامز، ليراوغ الدفاع ويسدد كرة رائعة في أقصى الزاوية اليمنى لحارس أتلتيكو.\n\nولم يكتف أصحاب الأرض بالتقدم بهدفين، حيث حملت الدقيقة الأخيرة هدفا ثالثا، عن طريق لاعب خط الوسط الهجومي سانسيت، الذي استغل هجمة مرتدة سريعة ومساحات شاسعة في دفاع أتلتيكو ليتابع كرة ارتدت من الحارس والدفاع ويسكنها الشباك.\n\nورفع هذا الانتصار الكبير رصيد أتلتيك بلباو إلى 6 نقاط في المركز السابع، بفارق نقطة وحيدة عن أتلتيكو مدريد السادس، والذي يتخلف بفارق الأهداف عن ديبورتيفو ألافيس الرابع، وأوساسونا الخامس.\n\nتلقى ريال مدريد الهزيمة الأولى في الموسم الحالي وسقط أمام مضيفه ريال بيتيس بهدف دون رد مساء الجمعة، في الجولة الرابعة من الدوري الإسباني لكرة القدم."}, {"guid": "https://arabic.rt.com/world/1829097-%D8%B3%D9%81%D9%8A%D8%B1-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D9%84%D8%AF%D9%89-%D8%A3%D9%84%D9%85%D8%A7%D9%86%D9%8A%D8%A7-%D9%8A%D9%83%D8%B4%D9%81-%D8%AA%D9%82%D9%8A%D9%8A%D9%85-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D9%84%D8%A7%D9%87%D8%AA%D9%85%D8%A7%D9%85-%D8%AA%D8%B1%D8%A7%D9%85%D8%A8-%D8%A8%D8%AA%D8%AD%D9%82%D9%8A%D9%82-%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85-%D9%81%D9%8A-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7/", "title": "سفير روسيا لدى ألمانيا يكشف تقييم موسكو لاهتمام ترامب بتحقيق السلام في أوكرانيا", "summary": "أكد سفير روسيا لدى ألمانيا سيرغي نيتشاييف أن موسكو ترى اهتماما صادقا من إدارة ترامب بتحقيق السلام في أوكرانيا.", "link": "https://arabic.rt.com/world/1829097-%D8%B3%D9%81%D9%8A%D8%B1-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D9%84%D8%AF%D9%89-%D8%A3%D9%84%D9%85%D8%A7%D9%86%D9%8A%D8%A7-%D9%8A%D9%83%D8%B4%D9%81-%D8%AA%D9%82%D9%8A%D9%8A%D9%85-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D9%84%D8%A7%D9%87%D8%AA%D9%85%D8%A7%D9%85-%D8%AA%D8%B1%D8%A7%D9%85%D8%A8-%D8%A8%D8%AA%D8%AD%D9%82%D9%8A%D9%82-%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85-%D9%81%D9%8A-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c3c8742360444026c69b1.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788629210, "detail": "أكد سفير روسيا لدى ألمانيا سيرغي نيتشاييف أن موسكو ترى اهتماما صادقا من إدارة ترامب بتحقيق السلام في أوكرانيا.\n\nوقال نيتشاييف خلال فعالية تأبينية في مقبرة عسكرية سوفيتية في ستوكنبروك بألمانيا: \"روسيا ترى أن الإدارة الأمريكية بقيادة الرئيس دونالد ترامب مهتمة بصدق بإرساء السلام وحل النزاع الأوكراني\".\n\nوتابع نيتشاييف: \"بحسب ما علمت من التقارير الإعلامية، فإن الوسطاء الأمريكيين موجودون حاليا في موسكو أو في طريقهم إليها\".\n\nتصريحات ترامب المزلزلة عن بوتين يصل صداها إلى ألمانيا وأكد أن موسكو اقتربت من التوصل إلى تسوية عدة مرات، إلا أن العملية تعثرت بفعل قوى خارجية.\n\nوأشار نيتشاييف إلى أن روسيا تسعى إلى سلام دائم طويل الأمد من خلال اتفاقيات مناسبة.\n\nووفقا له، فإن وقف إطلاق النار المؤقت وحده لن يكون كافيا لحل النزاع.\n\nوختم نيتشاييف: \"لقد خُدعنا مرات عديدة من قبل، ولا نريد تكرار ذلك، للأسف عاقبنا التاريخ على ذلك مرارا. لا نريد أن يتكرر هذا الأمر. لكننا نريد سلاما حقيقيا ودائما، ونحن على استعداد للتفاوض وفقا لذلك الإطار\".\n\nيلتقي الرئيس الروسي فلاديمير بوتين اليوم بالمبعوث الأمريكي الخاص ستيف ويتكوف في روسيا للمرة السادسة.\n\nأعلن المتحدث باسم الكرملين دميتري بيسكوف أن الرئيس الروسي فلاديمير بوتين أصدر أمرا بعدم شن أي غارات على العاصمة الأوكرانية كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة.\n\nذكرت مجلة \"Responsible Statecraft\" أن المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر يعتزمان زيارة موسكو وكييف نهاية الأسبوع في محاولة لإحياء المفاوضات لإنهاء النزاع في أوكرانيا.\n\nأكد نائب وزير خارجية روسيا سيرغي ريابكوف أنه ينبغي للإدارة الأمريكية أن تأخذ في الحسبان الحقائق على الأرض في التسوية الأوكرانية، مشيرا إلى أن الوضع يسير نحو الأسوأ بالنسبة لكييف."}, {"guid": "CBMiogNBVV95cUxPLUdrQ2NmakxDa1JUOV9GWjMzQWlHT1AtT1JmSThjWS1uR3ExbXhUVW11OFEzYWlRRjZIemY3cGpTYW5PQUtZU0lFcElMUktVem82d3ZTU0tCdk8taUlMRFNSRUpEcl9kR3N0WGcteVctYkpHT0FLaXY1cFZWVktIeko3bExRZHB1U0NWY3hPcmNfQTdYNHowOE5XMTJnYWQ4NWs0RVJMRXgtdV9SMi1xQmRVV2JfdFlBaGNfLVMwZVBpZU9aUFVURE5lX01ZR29OV1JjQllMX3ljbFpaOTI2UlJiQjZVekRFMXNReFJSOC1DMUZxX2FVYVZlSEpQN19XNTVRZVQ0YXF0SHVnSWZKN002ak1SU0l1cnA5NVJtaWdNX1RKa21HNmtCelF1cl9ZbnBvSU5oRFJ5T0hIaDJMSjdOMzM5UmZXS3pCbHV0ZmVDZXlRSWhZSXE5bzZqLUhiZEtKeXp0OWEyRXJHMS1tTThWdU5adXNPMHZ0UTM5OXhXRkM5TWQwMUEzWEdzU1FVVmZLRi00VWRhWjg4Y2VXaFp3", "title": "حاكم أم القيوين يحضر حفل استقبال أقامه سلطان بن سعيد المنصوري بمناسبة زفاف نجله - وكالة وام", "summary": "حاكم أم القيوين يحضر حفل استقبال أقامه سلطان بن سعيد المنصوري بمناسبة زفاف نجله &nbsp;&nbsp; وكالة وام", "link": "https://news.google.com/rss/articles/CBMiogNBVV95cUxPLUdrQ2NmakxDa1JUOV9GWjMzQWlHT1AtT1JmSThjWS1uR3ExbXhUVW11OFEzYWlRRjZIemY3cGpTYW5PQUtZU0lFcElMUktVem82d3ZTU0tCdk8taUlMRFNSRUpEcl9kR3N0WGcteVctYkpHT0FLaXY1cFZWVktIeko3bExRZHB1U0NWY3hPcmNfQTdYNHowOE5XMTJnYWQ4NWs0RVJMRXgtdV9SMi1xQmRVV2JfdFlBaGNfLVMwZVBpZU9aUFVURE5lX01ZR29OV1JjQllMX3ljbFpaOTI2UlJiQjZVekRFMXNReFJ د يؤدي إلى امتداد الصراع تدريجيا إلى ما وراء حدود أوكرانيا.\n\nوأعلن الرئيس الروسي فلاديمير بوتين، يوم الثلاثاء الماضي، أن عملية التفاوض بشأن أوكرانيا متوقفة حاليا، مؤكدا أن موسكو مستعدة للتفاوض في هذا الشأن مع أي طرف يرغب في ذلك.\n\nقال الرئيس السلوفاكي بيتر بيليغريني إن الاتحاد الأوروبي ليس في أفضل حالاته في الوقت الحالي، وبات يحتاج إلى معالجة عدد من القضايا لإثبات قدرته على البقاء والاستمرار.\n\nأعرب رئيس الوزراء السلوفاكي، روبرت فيتسو، عن قناعته الراسخة بفشل سياسة العقوبات التي يفرضها الاتحاد الأوروبي على روسيا.\n\nأظهرت بيانات وزارة الداخلية السلوفاكية أن نحو 10 آلاف أوكراني هاجروا إلى سلوفاكيا خلال النصف الأول من العام الجاري، وحصل معظمهم على حق اللجوء."}, {"guid": "f7711b0a-a93e-11f1-bb82-df5972d521ba", "title": "الضفة الغربية: السفير الأمريكي يحمل تل أبيب \"مسؤولية\" حماية الفلسطينيين مع تصاعد هجمات المستوطنين", "summary": "أجرى السفير الأمريكي في إسرائيل مايك هاكابي السبت زيارة إلى بلدة ترمسعيا قرب رام الله بوسط الضفة الغربية المحتلة، التي يحمل معظم سكانها الجنسية الأمريكية، وقال إنه يريد الاستماع إلى \"شكاواهم المشروعة\"، بعدما تصاعدت حدة هجمات المستوطنين على الفلسطينيين.", "link": "https://www.france24.com/ar/%D8%A7%D9%84%D8%B4%D8%B1%D9%82-%D8%A7%D9%84%D8%A3%D9%88%D8%B3%D8%B7/20260905-%D8%A7%D9%84%D8%B6%D9%81%D8%A9-%D8%A7%D9%84%D8%BA%D8%B1%D8%A8%D9%8A%D8%A9-%D8%B3%D9%81%D9%8A%D8%B1-%D8%A7%D9%84%D9%88%D9%84%D8%A7%D9%8A%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%AA%D8%AD%D8%AF%D8%A9-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84-%D9%81%D9%84%D8%B3%D8%B7%D9%8A%D9%86-%D9%87%D8%AC%D9%85%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%B3%D8%AA%D9%88%D8%B7%D9%86%D9%8A%D9%86-%D8%BA%D8%B2%D8%A9", "image": "https://s.france24.com/media/display/db43d23e-a924-11f1-b6c3-005056a97e36/w:1024/p:16x9/2026-09-05T065615Z-1057574229-RC2UCNAUVX83-RTRMADP-3-ISRAEL-PALESTINIANS-SETTLERS-USA.jpg", "category": "أخبار", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788628928, "detail": ""}, {"guid": "CBMiugRBVV95cUxPQjFLQTNHV2lzSDNiaGtXSXo2RzN2bHNrLUFpR
