 يقل عن 22 شخصا وإصابة عدد آخر من الأشخاص في حريق اندلع خلال حفل زفاف في العاصمة الكونغولية كينشاسا.\n\nوأصيب عدد آخر من الأشخاص في الحريق الذي شب، ليل الجمعة، واستمر حتى الساعات الأولى من صباح السبت، داخل مبنى في منطقة لينغوالا شمال كينشاسا.\n\nووضع الناس أحياء وأمواتا، على جانب الطريق، بينما حاول الحاضرون مساعدة من كانوا لا يزالون على قيد الحياة، وامتلأت الممرات الضيقة بالأشخاص الذين حاولوا الفرار من الحريق.\n\nوقال عمدة لينغوالا، نوربرت موشينغا، لـ\"وكالة الأنباء الكونغولية\" إن الحصيلة الأولية بلغت 22 قتيلا، مشيرا إلى أنها مرشحة للارتفاع.\n\nويظهر مقطع فيديو تدافعا عند مخرج القاعة، ولم يتأكد بعد السبب الدقيق للحريق، فيما قال جاكمين شاباني، نائب رئيس الوزراء ووزير الداخلية في الكونغو: \"إنها مأساة\" وقد زار الوزير موقع الحريق، صباح السبت.\n\nووفقا لوسائل إعلام محلية، تعد الحرائق المميتة شائعة في المناطق المكتظة بالسكان في كينشاسا، كما تكثر الحرائق خلال موسم الجفاف، وقد اندلع عدد منها، هذا العام.\n\nأعلن المعهد الوطني للصحة العامة بجمهورية الكونغو الديمقراطية أن عدد الإصابات المؤكدة بفيروس إيبولا في البلاد ارتفع إلى 6186 حالة، فيما بلغ عدد الوفيات الناجمة عنه 3007 حالات.\n\nأفاد موقع Actualit بأن ما لا يقل عن 16 شخصا قتلوا وجرى إنقاذ 185 آخرين في حادث غرق سفينة في نهر كاساي في جمهورية الكونغو الديمقراطية."}, {"guid": "https://arabic.rt.com/world/1829157-%D8%A5%D8%AD%D9%8A%D8%A7%D8%A1-%D8%B0%D9%83%D8%B1%D9%89-%D8%A3%D8%B3%D8%B1%D9%89-%D8%A7%D9%84%D8%AD%D8%B1%D8%A8-%D8%A7%D9%84%D8%B3%D9%88%D9%81%D9%8A%D8%AA-%D9%81%D9%8A-%D8%A3%D9%84%D9%85%D8%A7%D9%86%D9%8A%D8%A7/", "title": "إحياء ذكرى أسرى الحرب السوفيت في ألمانيا", "summary": "جرت مراسم إحياء ذكرى أسرى الحرب السوفيت، يوم السبت، في المقبرة التذكارية بمدينة شلوس هولتي شتوكنبروك في ولاية شمال الراين وستفاليا في غرب ألمانيا.", "link": "https://arabic.rt.com/world/1829157-%D8%A5%D8%AD%D9%8A%D8%A7%D8%A1-%D8%B0%D9%83%D8%B1%D9%89-%D8%A3%D8%B3%D8%B1%D9%89-%D8%A7%D9%84%D8%AD%D8%B1%D8%A8-%D8%A7%D9%84%D8%B3%D9%88%D9%81%D9%8A%D8%AA-%D9%81%D9%8A-%D8%A3%D9%84%D9%85%D8%A7%D9%86%D9%8A%D8%A7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c6cda42360446d64a9a0a.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788636941, "detail": "جرت مراسم إحياء ذكرى أسرى الحرب السوفيت، يوم السبت، في المقبرة التذكارية بمدينة شلوس هولتي شتوكنبروك في ولاية شمال الراين وستفاليا في غرب ألمانيا.\n\nوشارك في المراسم السفير الروسي لدى ألمانيا سيرغي نيتشاييف والقنصل العام في بون أوليغ كراسنيتسكي وموظفو البعثة الدبلوماسية الروسية ونحو 300 شخص من أعضاء مختلف المنظمات الاجتماعية، الذين وضعوا أكاليل من الزهور عند النصب التذكاري في المقبرة.\n\nوشاركت في المراسم أيضا منظمات ألمانية معادية للفاشية.\n\nوقدم السفير الروسي الشكر للمواطنين الروس المقيمين في ألمانيا والألمان الذين يقومون برعاية مقابر الجنود السوفيت.\n\nموسكو تنتقد تسييس برلين لموضوع الذاكرة التاريخية وتؤكد تماسك الروابط الشعبية الروسية الألمانية وأكد أن \"روسيا ستدافع دائما عن الحقيقة التاريخية المتعلقة بالأحداث المأسوية لتلك السنوات التي تركت جروحا عميقة في روح كل مواطن في بلادنا\"، مضيفا أن \"القومية الاشتراكية الجديدة لا يجوز أن تطل برأسها من جديد في أي مكان أو زمان\".\n\nيذكر أن المقبرة في مدينة شلوس هولتي شتوكنبروك ترقد فيها رفات 65 ألفا من أسرى الحرب السوفيت الذين لقوا مصرعهم في أحد معتقلات ألمانيا النازية أثناء الحرب العالمية الثانية.\n\nوكان يحتجز في هذا المعتقل نحو 300 ألف شخص من أسرى الحرب، الذين تم إرسالهم إلى غرب ألمانيا للأشغال الشاقة.\n\nوأقيم النصب التذكاري في مكان المعتقل السابق في عام 1945."}, {"guid": "https://arabic.rt.com/middle_east/1829154-%D8%B7%D9%88%D8%A7%D9%82%D9%85-%D8%A7%D9%84%D8%AF%D9%81%D8%A7%D8%B9-%D8%A7%D9%84%D9%85%D8%AF%D9%86%D9%8A-%D9%81%D9%8A-%D9%82%D8%B7%D8%A7%D8%B9-%D8%BA%D8%B2%D8%A9-%D8%AA%D9%86%D8%AA%D8%B4%D9%84-%D8%AC%D8%AB%D8%A7%D9%85%D9%8A%D9%86-%D9%88%D8%B1%D9%81%D8%A7%D8%AA-100-%D9%81%D9%84%D8%B3%D8%B7%D9%8A%D9%86%D9%8A-%D9%85%D9%86-%D8%AA%D8%AD%D8%AA-%D8%A7%D9%84%D8%A3%D9%86%D9%82%D8%A7%D8%B6-%D8%B5%D9%88%D8%B1/", "title": "طواقم الدفاع المدني في قطاع غزة تنتشل جثامين ورفات 100 فلسطيني من تحت الأنقاض (صور)", "summary": "انتشلت طواقم الدفاع المدني في قطاع غزة جثامين ورفات 100 فلسطيني من تحت الأنقاض قتلوا بقصف إسرائيلي سابق على حي الزيتون جنوب شرق مدينة غزة.", "link": "https://arabic.rt.com/middle_east/1829154-%D8%B7%D9%88%D8%A7%D9%82%D9%85-%D8%A7%D9%84%D8%AF%D9%81%D8%A7%D8%B9-%D8%A7%D9%84%D9%85%D8%AF%D9%86%D9%8A-%D9%81%D9%8A-%D9%82%D8%B7%D8%A7%D8%B9-%D8%BA%D8%B2%D8%A9-%D8%AA%D9%86%D8%AA%D8%B4%D9%84-%D8%AC%D8%AB%D8%A7%D9%85%D9%8A%D9%86-%D9%88%D8%B1%D9%81%D8%A7%D8%AA-100-%D9%81%D9%84%D8%B3%D8%B7%D9%8A%D9%86%D9%8A-%D9%85%D9%86-%D8%AA%D8%AD%D8%AA-%D8%A7%D9%84%D8%A3%D9%86%D9%82%D8%A7%D8%B6-%D8%B5%D9%88%D8%B1/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c69c24c59b7584000e951.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788636498, "detail": "انتشلت طواقم الدفاع المدني في قطاع غزة جثامين ورفات 100 فلسطيني من تحت الأنقاض قتلوا بقصف إسرائيلي سابق على حي الزيتون جنوب شرق مدينة غزة.\n\nوودع قطاع غزة في موكب تشييع مهيب جثامين 100 قتيل، غالبيتهم العظمى من الأطفال والنساء، بعد أن تمكنت طواقم الدفاع المدني من انتشال رفاتهم من تحت أنقاض المنازل المدمرة في حي الزيتون جنوب شرق مدينة غزة.\n\nوأعلن جهاز الدفاع المدني في غزة، في وقت سابق، انتشال جثامين ورفات 55 فلسطينيا من تحت أنقاض منزل دمره الجيش الإسرائيلي في حي الزيتون جنوبي مدينة غزة في 19 نوفمبر 2023.\n\nوتأتي العملية ضمن المرحلة الثانية من مشروع \"استعادة جثامين الشهداء\"، الذي أطلقه الدفاع المدني في 19 يوليو الماضي بهدف انتشال رفات المفقودين من تحت أنقاض المباني المدمرة، وسط نقص حاد في المعدات والإمكانات.\n\nوقال مشرف المشروع في الدفاع المدني محمد أبو دان، في بيان، إن طواقم الدفاع المدني تواجه تحديات كبيرة في عمليات الانتشال بسبب \"محدودية الأجهزة والآلات الثقيلة\"، داعيا المنظمات والمؤسسات الإنسانية الدولية إلى تكثيف جهودها لتوفير حفارات وشاحنات متعددة وحديثة، بما يسمح بانتشال أكبر عدد ممكن من جثامين المفقودين تحت المباني المدمرة.\n\nقال المتحدث باسم الدفاع المدني في قطاع غزة، محمود بصل، إن أكثر من 8 آلاف جثمان لا تزال تحت أنقاض المباني المدمرة في مختلف مناطق القطاع، في ظل صعوبات كبيرة تواجه طواقم الإنقاذ.\n\nطرح وزيران إسرائيليان هذا الأسبوع مقترحات تتعلق بالترحيل الجماعي للفلسطينيين من قطاع غزة، وسط أجواء مشحونة تسبق الانتخابات المقررة في أكتوبر، في سعيهما لحشد المؤيدين.\n\nأعلن مكتب الأمم المتحدة لحقوق الإنسان في فلسطين مقتل 24 فلسطينيا، بينهم 4 أطفال وامرأة جراء هجمات إسرائيلية خلال 5 أيام، محذرا من استمرار انعدام الأمان في قطاع غزة.\n\nانتشلت طواقم الدفاع المدني في محافظة غزة 55 جثمانا ورفاتا لضحايا من تحت أنقاض مبنى لعائلة \"ملكة\" وكان مأهولا بأكثر من 60 شخصا لاذوا إليه خوفا من القصف الإسرائيلي قبل نحو عامين."}, {"guid": "https://arabic.rt.com/world/1829156-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D9%84%D9%85-%D8%AA%D9%88%D8%A7%D9%81%D9%82-%D8%B9%D9%84%D9%89-%D9%88%D9%82%D9%81-%D8%A5%D8%B7%D9%84%D8%A7%D9%82-%D9%86%D8%A7%D8%B1-%D8%A3%D9%88%D8%B3%D8%B9-%D9%84%D9%85%D8%AF%D8%A9-%D8%AB%D9%84%D8%A7%D8%AB%D8%A9-%D8%A3%D9%8A%D8%A7%D9%85/", "title": "بوتين: روسيا لم توافق على وقف إطلاق نار يزيد عن ثلاثة أيام", "summary": "صرّح الرئيس فلاديمير بوتين في اجتماع مع المفاوضين الأمريكيين، بأن روسيا لم تتفق مع أوكرانيا على وقف إطلاق نار أوسع نطاقا لمدة ثلاثة أيام لوقف الهجمات على العاصمتين.", "link": "https://arabic.rt.com/world/1829156-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D9%84%D9%85-%D8%AA%D9%88%D8%A7%D9%81%D9%82-%D8%B9%D9%84%D9%89-%D9%88%D9%82%D9%81-%D8%A5%D8%B7%D9%84%D8%A7%D9%82-%D9%86%D8%A7%D8%B1-%D8%A3%D9%88%D8%B3%D8%B9-%D9%84%D9%85%D8%AF%D8%A9-%D8%AB%D9%84%D8%A7%D8%AB%D8%A9-%D8%A3%D9%8A%D8%A7%D9%85/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c695e423604465c58d747.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788636416, "detail": "صرّح الرئيس فلاديمير بوتين في اجتماع مع المفاوضين الأمريكيين، بأن روسيا لم تتفق مع أوكرانيا على وقف إطلاق نار أوسع نطاقا لمدة ثلاثة أيام لوقف الهجمات على العاصمتين.\n\nوأشار الرئيس بوتين، إلى أن روسيا أوقفت الضربات على كييف لمدة ثلاثة أيام ابتداء من 5 سبتمبر، وأن الجانب الأوكراني قلل بشكل كبير خلال ذلك من الضربات على الأراضي الروسية.\n\nويتكوف يشكر بوتين على وقف الضربات لمدة ثلاثة أيام لإجراء المفاوضات وقال بوتين: \"أصدرت السلطات الأوكرانية دعوتها لوقف إطلاق نار أكثر من مدة ثلاثة أيام، لكننا لم نتفق معهم على ذلك قط\".\n\nوأضاف رئيس الدولة مخاطبا المفاوضين الأمريكيين ستيف ويتكوف وجاريد كوشنر: \"لكننا سنبذل قصارى جهدنا لضمان أمن عملية التفاوض والوسطاء، ممثلين بكم وبمن يرافقكم\".\n\nأكد الرئيس الروسي فلاديمير بوتين خلال لقائه المبعوثين الأمريكيين الخاصين ستيف ويتكوف وجاريد كوشنر، استمرار زعيمي روسيا والولايات المتحدة الحفاظ على اتصالاتهما الشخصية.\n\nأفادت غرفة العمليات في مقاطعة بيلغورود الروسية بأن شخصا واحدا لقى حتفه وأصيب آخر، اليوم السبت، بعد هجوم بطائرة مسيرة أطلقتها القوات الأوكرانية.\n\nأكد الرئيس الروسي فلاديمير بوتين أن موسكو ستبذل قصارى جهدها لضمان أمن المفاوضين الأمريكيين في موسكو، وذلك خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر.\n\nأعلن الرئيس الروسي فلاديمير بوتين مناقشة \"جميع مكونات وجوانب\" النزاع الأوكراني خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، في الاجتماع السادس من نوعه معهما."}, {"guid": "https://www.dw.com/ar/الجيش-الأمريكي-يعلن-ضرب-ثلاث-ناقلات-إيرانية-وطهران-تتوعد-بـ-رد-أقوى/live-78568956?maca=ara-rss-ar-all-1125-rdf", "title": "الجيش الأمريكي يعلن ضرب ثلاث ناقلات إيرانية وطهران تتوعد بـ\"رد أقوى\"", "summary": "أعلن الجيش الأمريكي أنه قصف ودمر ثلاث ناقلات نفط تابعة للحرس الثوري الإيراني، وذلك ردا ‌على إطلاق ‌إيران صواريخ باليستية على سفينتين تابعتين للبحرية الأمريكية.وطهران تتوعد بـ\"رد أقوى\" حال تواصل استهداف سفنا.", "link": "https://www.dw.com/ar/الجيش-الأمريكي-يعلن-ضرب-ثلاث-ناقلات-إيرانية-وطهران-تتوعد-بـ-رد-أقوى/live-78568956?maca=ara-rss-ar-all-1125-rdf", "image": "", "category": "أمن", "source_id": "dw-arabic", "source_name": "DW عربي", "source_cat": "دولية", "published": 1788635880, "detail": ""}, {"guid": "https://arabic.rt.com/sport/1829152-%D9%84%D8%A7%D9%88%D8%AA%D8%A7%D8%B1%D9%88-%D9%85%D8%A7%D8%B1%D8%AA%D9%8A%D9%86%D9%8A%D8%B2-%D9%8A%D9%82%D9%88%D8%AF-%D8%A5%D9%86%D8%AA%D8%B1-%D9%85%D9%8A%D9%84%D8%A7%D9%86-%D9%84%D9%81%D9%88%D8%B2-%D9%85%D8%AB%D9%8A%D8%B1-%D8%B9%D9%84%D9%89-%D9%86%D8%A7%D8%A8%D9%88%D9%84%D9%8A/", "title": "لاوتارو مارتينيز يقود إنتر ميلان لفوز مثير على نابولي", "summary": "قاد المهاجم الأرجنتيني لاوتارو مارتينيز فريقه إنتر ميلان لتحقيق فوز مثير على ضيفه نابولي بنتيجة 3-2 في مباراة جمعتهما ضمن منافسات الجولة الثالثة من الدوري الإيطالي لكرة القدم.", "link": "https://arabic.rt.com/sport/1829152-%D9%84%D8%A7%D9%88%D8%AA%D8%A7%D8%B1%D9%88-%D9%85%D8%A7%D8%B1%D8%AA%D9%8A%D9%86%D9%8A%D8%B2-%D9%8A%D9%82%D9%88%D8%AF-%D8%A5%D9%86%D8%AA%D8%B1-%D9%85%D9%8A%D9%84%D8%A7%D9%86-%D9%84%D9%81%D9%88%D8%B2-%D9%85%D8%AB%D9%8A%D8%B1-%D8%B9%D9%84%D9%89-%D9%86%D8%A7%D8%A8%D9%88%D9%84%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c6824423604449f71134c.png", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788635660, "detail": "قاد المهاجم الأرجنتيني لاوتارو مارتينيز فريقه إنتر ميلان لتحقيق فوز مثير على ضيفه نابولي بنتيجة 3-2 في مباراة جمعتهما ضمن منافسات الجولة الثالثة من الدوري الإيطالي لكرة القدم.\n\nوتقدم نابولي في الدقيقة 50 عن طريق ماتيو بوليتانو، وبعده بثلاث دقائق سجل راسموس هويلوند الهدف الثاني.\n\nلكن إنتر ميلان نجح في العودة للمباراة من جديد بتسجيل لاوتارو مارتينيز هدف تقليص الفارق في الدقيقة 58، ثم سجل ماركوس تورام هدف التعادل في الدقيقة 82.\n\nوبينما كانت المباراة تتجه إلى التعادل، عاد لاوتارو مارتينيز ليسجل الهدف الثالث وهدف الفوز لفريقه في الدقيقة الأولى من الوقت بدل الضائع للشوط الثاني.\n\nورفع إنتر ميلان، حامل اللقب، رصيده إلى تسع نقاط في المركز الأول بفارق نقطتين عن كومو صاحب المركز الثاني، وبفارق ثلاث نقاط عن كل من ميلان ويوفنتوس، واللذين يلتقيان غدا ضمن منافسات الجولة ذاتها.\n\nعلى الجانب الآخر، تجمد رصيد نابولي عند ثلاث نقاط في المركز العاشر."}, {"guid": "https://arabic.rt.com/world/1829150-%D8%A7%D9%84%D8%B1%D8%A6%D9%8A%D8%B3-%D8%A7%D9%84%D8%B3%D9%84%D9%88%D9%81%D8%A7%D9%83%D9%8A-%D8%A7%D9%84%D8%A7%D8%AA%D8%AD%D8%A7%D8%AF-%D8%A7%D9%84%D8%A3%D9%88%D8%B1%D9%88%D8%A8%D9%8A-%D9%84%D9%8A%D8%B3-%D9%81%D9%8A-%D8%A3%D9%81%D8%B6%D9%84-%D8%AD%D8%A7%D9%84%D8%A7%D8%AA%D9%87/", "title": "الرئيس السلوفاكي: الاتحاد الأوروبي ليس في أفضل حالاته", "summary": "قال الرئيس السلوفاكي بيتر بيليغريني إن الاتحاد الأوروبي ليس في أفضل حالاته في الوقت الحالي، وبات يحتاج إلى معالجة عدد من القضايا لإثبات قدرته على البقاء والاستمرار.", "link": "https://arabic.rt.com/world/1829150-%D8%A7%D9%84%D8%B1%D8%A6%D9%8A%D8%B3-%D8%A7%D9%84%D8%B3%D9%84%D9%88%D9%81%D8%A7%D9%83%D9%8A-%D8%A7%D9%84%D8%A7%D8%AA%D8%AD%D8%A7%D8%AF-%D8%A7%D9%84%D8%A3%D9%88%D8%B1%D9%88%D8%A8%D9%8A-%D9%84%D9%8A%D8%B3-%D9%81%D9%8A-%D8%A3%D9%81%D8%B6%D9%84-%D8%AD%D8%A7%D9%84%D8%A7%D8%AA%D9%87/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c632a42360444ee1c6631.jpg", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788635390, "detail": "قال الرئيس السلوفاكي بيتر بيليغريني إن الاتحاد الأوروبي ليس في أفضل حالاته في الوقت الحالي، وبات يحتاج إلى معالجة عدد من القضايا لإثبات قدرته على البقاء والاستمرار.\n\nوأضاف رئيس سلوفاكيا في حديث تلفزيوني: \"الاتحاد الأوروبي ليس في وضع جيد في الوقت الحالي: فهو يصطدم بنمو اقتصادي منخفض، وبتراجع في القدرة التنافسية، ولا يستطيع التعامل مع أزمة الطاقة ومعالجة ارتفاع أسعار الطاقة، وبالطبع لدينا مشاكل في ملء مرافق تخزين الغاز لضمان شتاء طبيعي\".\n\nسلوفاكيا تحذر من أزمة طاقة غير مسبوقة ودعا الرئيس السلوفاكي الاتحاد الأوروبي إلى التركيز على حل مشاكله الكثيرة المستعصية كي يتمكن من بث الروح في الاتحاد ويثبت قدرته على الاستمرار.\n\nويشار إلى أن الاتحاد الأوروبي، يواجه تحديات ملحوظة في ملء مرافق تخزين الغاز الطبيعي، حيث تراجعت مستويات التخزين إلى أدنى مستوياتها في مثل هذا الوقت من السنة خلال خمس سنوات. ورغم إعلان المفوضية الأوروبية عدم وجود مخاوف فورية بشأن الإمدادات، إلا أن وتيرة الضخ تشهد تباطؤا مستمرا.\n\nدعا الرئيس السلوفاكي بيتر بيليغريني إلى تكثيف الجهود الغربية لإقامة حوار مباشر مع روسيا.\n\nأعرب رئيس الوزراء السلوفاكي، روبرت فيتسو، عن قناعته الراسخة بفشل سياسة العقوبات التي يفرضها الاتحاد الأوروبي على روسيا."}, {"guid": "https://arabic.rt.com/world/1829153-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%8A%D8%B4%D9%83%D8%B1-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D8%B9%D9%84%D9%89-%D8%AA%D8%B3%D9%84%D9%8A%D9%85-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D9%84%D9%84%D9%85%D8%AF%D8%A7%D9%86-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A-%D8%A7%D9%84%D8%B3%D8%A7%D8%A8%D9%82-%D8%B1%D9%88%D8%A8%D8%B1%D8%AA-%D8%BA%D9%8A%D9%84%D9%85%D8%A7%D9%86/", "title": "ويتكوف يشكر بوتين على تسليم روسيا للمدان الأمريكي السابق روبرت غيلمان", "summary": "شكر المبعوث الأمريكي الخاص ستيف ويتكوف الرئيس الروسي فلاديمير بوتين على تسليم الولايات المتحدة المدان السابق في مشاة البحرية الأمريكية روبرت غيلمان.", "link": "https://arabic.rt.com/world/1829153-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%8A%D8%B4%D9%83%D8%B1-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D8%B9%D9%84%D9%89-%D8%AA%D8%B3%D9%84%D9%8A%D9%85-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D9%84%D9%84%D9%85%D8%AF%D8%A7%D9%86-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A-%D8%A7%D9%84%D8%B3%D8%A7%D8%A8%D9%82-%D8%B1%D9%88%D8%A8%D8%B1%D8%AA-%D8%BA%D9%8A%D9%84%D9%85%D8%A7%D9%86/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c67c04c59b7589044c86a.jpeg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788635302, "detail": "شكر المبعوث الأمريكي الخاص ستيف ويتكوف الرئيس الروسي فلاديمير بوتين على تسليم الولايات المتحدة المدان السابق في مشاة البحرية الأمريكية روبرت غيلمان.\n\nوقال ويتكوف خلال المحادثات مع الرئيس بوتين في الكرملين: \"عائلة غيلمان ممتنة لكم بشكل لا يصدق على مساعدتكم وعلى عودة بوب غيلمان إلى الوطن\".\n\nومن جانبه، رد الرئيس الروسي قائلا: \"يجب عليهم أن يشكروا الرئيس (الأمريكي) دونالد ترامب، هو الذي تدخل\".\n\nوفي 11 أغسطس الماضي، أعلن ترامب أن روبرت غيلمان، الجندي السابق في مشاة البحرية الأمريكية المدان في روسيا بتهمة استخدام القوة المتكرر ضد ضباط إنفاذ القانون، قد أُطلق سراحه وهو في طريقه إلى وطنه. وأعرب الرئيس الأمريكي ووزير الخارجية الأمريكي ماركو روبيو عن امتنانهما للجانب الروسي على هذا القرار.\n\nوكانت محكمة في فورونيج قد أصدرت في أكتوبر 2024 حكما على غيلمان بالسجن لمدة سبع سنوات وشهر واحد، بتهمة استخدام القوة بشكل متكرر ضد ضباط إنفاذ القانون الروس.\n\nوفي أبريل 2025، تم تشديد العقوبة إلى ثماني سنوات وشهر واحد في مستعمرة عقابية شديدة الحراسة، ثم ارتفعت المدة إلى عشر سنوات وشهر واحد بعد قضية أخرى تتعلق بحلقتين من استخدام العنف ضد موظف في دائرة السجون الفيدرالية.\n\nويأتي اللقاء في إطار زيارة المبعوث الخاص للرئيس الأمريكي ستيف ويتكوف وصهر الرئيس الأمريكي جاريد كوشنر إلى موسكو يوم السبت، حيث وصلوا مساء إلى الكرملين لإجراء محادثات مع الرئيس الروسي، في استمرار للجهود الدبلوماسية الأمريكية الروسية لتسوية الأزمة الأوكرانية.\n\nأفاد مصدر في متجر هدايا البيت الأبيض أن العملة التي تركها المبعوث الأمريكي الخاص ستيف ويتكوف في أحد مطاعم موسكو ليست مخصصة للبيع، بل هي قطعة تذكارية شخصية.\n\nصرح مساعد الرئيس الروسي يوري أوشاكوف بأن المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، أجريا استعدادات جادة لزيارتهما إلى موسكو.\n\nوجه المبعوث الخاص للرئيس الأمريكي ستيف ويتكوف الشكر إلى الرئيس الروسي فلاديمير بوتين على وقف الضربات لمدة ثلاثة أيام لإجراء المفاوضات، وذلك خلال لقائهما مساء السبت في الكرملين.\n\nأكد الرئيس الروسي فلاديمير بوتين أن موسكو ستبذل قصارى جهدها لضمان أمن المفاوضين الأمريكيين في موسكو، وذلك خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر.\n\nقال المبعوث الأمريكي الخاص ستيف ويتكوف، في الكرملين اليوم، إنه يعتبر حواره مع الرئيس الروسي فلاديمير بوتين، أكثر المحطات رسوخا في الذاكرة.\n\nأعلن الرئيس الروسي فلاديمير بوتين مناقشة \"جميع مكونات وجوانب\" النزاع الأوكراني خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، في الاجتماع السادس من نوعه معهما.\n\nأعربت الولايات المتحدة عن شكرها للرئيس الروسي فلاديمير بوتين للعفو عن المواطن الأمريكي روبرت غيلمان، مشيرة إلى مشاركته الشخصية في عملية الإفراج عنه."}, {"guid": "https://arabic.rt.com/world/1829132-%D9%88%D8%A7%D8%B4%D9%86%D8%B7%D9%86-%D9%87%D8%AC%D9%85%D8%A7%D8%AA-%D9%84%D8%A7%D9%8A%D8%A8%D8%B2%D9%8A%D8%BA-%D9%88%D8%A8%D9%88%D9%84%D9%86%D8%AF%D8%A7-%D8%A8%D8%A7%D9%84%D9%85%D8%B3%D9%8A%D8%B1%D8%A7%D8%AA-%D8%A7%D9%84%D8%A3%D9%83%D8%AB%D8%B1-%D8%A5%D8%AB%D8%A7%D8%B1%D8%A9-%D9%84%D9%84%D9%82%D9%84%D9%82-%D9%88%D9%8A%D8%AC%D8%A8-%D8%B9%D8%AF%D9%85-%D8%A7%D9%84%D8%AA%D8%B3%D8%A7%D9%85%D8%AD-%D9%85%D8%B9%D9%87%D8%A7/", "title": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها", "summary": "حذر سفير الولايات المتحدة لدى \"الناتو\"، ماثيو ويتاكر، الدول الأعضاء في الحلف من عدم التسامح مع الأعمال المتعمدة في إطار الحرب الهجينة، مؤكدا أن واشنطن ستقف إلى جانب الدول المعنية.", "link": "https://arabic.rt.com/world/1829132-%D9%88%D8%A7%D8%B4%D9%86%D8%B7%D9%86-%D9%87%D8%AC%D9%85%D8%A7%D8%AA-%D9%84%D8%A7%D9%8A%D8%A8%D8%B2%D9%8A%D8%BA-%D9%88%D8%A8%D9%88%D9%84%D9%86%D8%AF%D8%A7-%D8%A8%D8%A7%D9%84%D9%85%D8%B3%D9%8A%D8%B1%D8%A7%D8%AA-%D8%A7%D9%84%D8%A3%D9%83%D8%AB%D8%B1-%D8%A5%D8%AB%D8%A7%D8%B1%D8%A9-%D9%84%D9%84%D9%82%D9%84%D9%82-%D9%88%D9%8A%D8%AC%D8%A8-%D8%B9%D8%AF%D9%85-%D8%A7%D9%84%D8%AA%D8%B3%D8%A7%D9%85%D8%AD-%D9%85%D8%B9%D9%87%D8%A7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c560a42360444c977ad21.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788635186, "detail": "حذر سفير الولايات المتحدة لدى \"الناتو\"، ماثيو ويتاكر، الدول الأعضاء في الحلف من عدم التسامح مع الأعمال المتعمدة في إطار الحرب الهجينة، مؤكدا أن واشنطن ستقف إلى جانب الدول المعنية.\n\nوأشار ويتاكر، في تصريحات على هامش مؤتمر أعمال في إيطاليا، إلى أن محاولة الهجوم بطائرات مسيرة التي وقعت الشهر الماضي في مطار لايبزيغ/هاله الألماني، والتي ألقت برلين بالمسؤولية فيها على روسيا، كانت \"أكثر إثارة للقلق\" من الوقائع الأخرى التي واجهتها الدول الأعضاء مؤخرا بسبب الطائرات المسيرة الروسية التي تستهدف أوكرانيا وتنحرف عن مسارها.\n\nوقال السفير: \"هناك ما أسميها الأعمال الهجينة الأكثر إثارة للقلق، مثل تلك التي شهدناها في لايبزيغ ومثل تلك التي شهدناها في بولندا\". وأضاف أنه ينبغي للدول الأعضاء في الحلف أن تكون مستعدة ويقظة، وأن تبعث برسالة قوية عندما تواجه مثل هذه التحديات.\n\nوشدد السفير الأمريكي على أنه \"إذا تمكنا من تحديد الجهة المسؤولة عن ذلك، وهو ما فعلته ألمانيا، فإننا نحرص على التعبير بقوة بأن هذا الأمر غير مقبول ولن نتسامح معه\". كما أشار إلى أن البنية التحتية الحيوية، بما في ذلك أصول الطاقة، قد تكون هدفا لهذه الأعمال، وينبغي أن تخضع لمراقبة السلطات الوطنية.\n\nوأكد ويتاكر أن الاستجابة لهذه التحديات تقع في المقام الأول على عاتق الدول نفسها، لكن الولايات المتحدة تدعم البلدان عندما تتعامل مع هذه الأفعال.\n\nكشفت صحيفة \"الغارديان\" عن قلق واسع يساور المخططين العسكريين في حلف \"الناتو\" إزاء سيناريو محتمل لحرب أوروبية طويلة الأمد مع روسيا، وسط عدم استعداد دول الاتحاد لعمليات قتالية واسعة.\n\nأكد السفير الروسي لدى ألمانيا سيرغي نيتشاييف أن روسيا تواجه بعض المشاكل مع بعض السياسيين الألمان، وليس لديها مشاكل مع الشعب الألماني، مؤكدا أن أي صراع بين البلدين سيكون \"كابوسا\".\n\nاتهمت ألمانيا روسيا رسميًا بالوقوف وراء محاولة الهجوم بواسطة الطائرات المسيرة المفخخة في مطار لايبزيغ في شهر آب الماضي، ما فجّر أزمة دبلوماسية بين برلين وموسكو.\n\nأكدت الخارجية الروسية والسفير الروسي لدى ألمانيا سيرغي نيتشايف أن إغلاق القنصلية الروسية في بون يدمر العلاقات، وأن الرد سيكون فوريا.\n\nأشار المتحدث باسم الكرملين دميتري بيسكوف إلى أن ألمانيا تتهم روسيا بلا أساس بحادثة المسيرة في مطار لايبزيغ ولكنها لم تقل كلمة واحدة لأوكرانيا بشأن انفجار خط أنابيب \"السيل الشمالي\"."}, {"guid": "https://arabic.rt.com/prg/%D8%AA%D8%B3%D9%88%D9%8A%D8%A9-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7-%D8%AB%D9%88%D8%A7%D8%A8%D8%AA-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D9%88%D8%AA%D8%B9%D9%86%D8%AA-%D8%A3%D9%88%D8%B1%D9%88%D8%A8%D8%A7-1829148/%D8%A7%D8%B3%D8%A3%D9%84-%D8%A3%D9%83%D8%AB%D8%B1/", "title": "تسوية أوكرانيا.. ثوابت موسكو وتعنت أوروبا", "summary": "", "link": "https://arabic.rt.com/prg/%D8%AA%D8%B3%D9%88%D9%8A%D8%A9-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7-%D8%AB%D9%88%D8%A7%D8%A8%D8%AA-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D9%88%D8%AA%D8%B9%D9%86%D8%AA-%D8%A3%D9%88%D8%B1%D9%88%D8%A8%D8%A7-1829148/%D8%A7%D8%B3%D8%A3%D9%84-%D8%A3%D9%83%D8%AB%D8%B1/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c623e42360443f45d09eb.png", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788634915, "detail": "خلال اجتماعه مع مبعوثي الرئيس ترامب أعلن بوتين اعتزام روسية مناقشة كافة طرق تسوية الأزمة الأوكرانية.. موسكو لم تغلق أبواب التسوية.. ولا تبحث تجميد الصراع بل تريد سلاما طويل الأمد يأخذ بالاعتبار الأسباب الجذرية للصراع.. ويضمن أمنا مستداما لروسيا وأوروبا. اليوم تتحرك الدبلوماسية مجددا ويتكوف وكوشنير يحملان مقترحا من ترامب لإنهاء الحرب في لحظة تقول فيها الدبلوماسية الروسية أن فرص التسوية لا تزال قائمة. فهل اقتربت واشنطن هذه المرة من الرؤية الروسية لشروط السلام؟ وهل باتت تدرك أن التسوية لا يمكن أن تقوم على هدنة مؤقتة تعيد إنتاج الصراع؟ والأهم هل تملك واشنطن القدرة على إقناع كييف وحلفائها الأوروبيين بقبول تسوية تأخذ في الاعتبار المصالح الأمنية الروسية والوقائع الجديدة على الأرض؟\n\nأكد الرئيس الروسي فلاديمير بوتين خلال لقائه المبعوثين الأمريكيين الخاصين ستيف ويتكوف وجاريد كوشنر، استمرار زعيمي روسيا والولايات المتحدة الحفاظ على اتصالاتهما الشخصية.\n\nأفادت غرفة العمليات في مقاطعة بيلغورود الروسية بأن شخصا واحدا لقى حتفه وأصيب آخر، اليوم السبت، بعد هجوم بطائرة مسيرة أطلقتها القوات الأوكرانية.\n\nشكر المبعوث الأمريكي الخاص ستيف ويتكوف الرئيس الروسي فلاديمير بوتين على تسليم الولايات المتحدة المدان السابق في مشاة البحرية الأمريكية روبرت غيلمان."}, {"guid": "https://arabic.rt.com/middle_east/1829149-%D9%82%D8%A7%D8%A6%D8%AF-%D9%84%D9%88%D8%A7%D8%A1-%D8%A8%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%A3%D8%B3%D8%AF-%D8%A8%D9%82%D8%A8%D8%B6%D8%A9-%D8%A7%D9%84%D8%A3%D9%85%D9%86-%D8%A7%D9%84%D8%B3%D9%88%D8%B1%D9%8A-%D9%84%D8%AA%D9%88%D8%B1%D8%B7%D9%87-%D8%A8%D8%AC%D8%B1%D8%A7%D8%A6%D9%85-%D8%AD%D8%B1%D8%A8-%D9%88%D8%A7%D8%B9%D8%AA%D9%82%D8%A7%D9%84%D8%A7%D8%AA-%D8%AA%D8%B9%D8%B3%D9%81%D9%8A%D8%A9/", "title": "قائد لواء بجيش الأسد بقبضة الأمن السوري لتورطه بجرائم حرب واعتقالات تعسفية", "summary": "أعلنت قيادة الأمن الداخلي في محافظة اللاذقية، بالتعاون مع إدارة مكافحة الإرهاب، إلقاء القبض على جلال كامل صقر، الذي شغل سابقا منصب قائد اللواء 18 مشاة في قوات النظام السابق.", "link": "https://arabic.rt.com/middle_east/1829149-%D9%82%D8%A7%D8%A6%D8%AF-%D9%84%D9%88%D8%A7%D8%A1-%D8%A8%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%A3%D8%B3%D8%AF-%D8%A8%D9%82%D8%A8%D8%B6%D8%A9-%D8%A7%D9%84%D8%A3%D9%85%D9%86-%D8%A7%D9%84%D8%B3%D9%88%D8%B1%D9%8A-%D9%84%D8%AA%D9%88%D8%B1%D8%B7%D9%87-%D8%A8%D8%AC%D8%B1%D8%A7%D8%A6%D9%85-%D8%AD%D8%B1%D8%A8-%D9%88%D8%A7%D8%B9%D8%AA%D9%82%D8%A7%D9%84%D8%A7%D8%AA-%D8%AA%D8%B9%D8%B3%D9%81%D9%8A%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c63da4c59b757e56a75cd.jpg", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788634414, "detail": "ووفقا لقيادة الأمن الداخلي، ينحدر صقر من قرية بسين في ريف القرداحة، وتشير نتائج التحريات إلى تورطه في جرائم حرب وعمليات اعتقال تعسفي بحق مدنيين خلال سنوات الثورة السورية.\n\nوأضافت القيادة أن الموقوف شارك في عمليات عسكرية استهدفت مدنيين في محافظة دمشق والغوطة الشرقية، كما أشرف، بحسب التحقيقات الأولية، على حملات اعتقال تعسفي في محافظة درعا.\n\nوبحسب المعلومات التي أوردتها قيادة الأمن الداخلي، تولّى صقر لاحقا منصب رئيس أركان الفرقة 14 ونائب قائدها، ثم قائدا للفرقة حتى منتصف عام 2016، قبل انتقاله إلى هيئة العمليات في دمشق، حيث استمر في عمله حتى تسريحه في 1 مايو 2017.\n\nوأكدت قيادة الأمن الداخلي استمرار الإجراءات القانونية والتحقيقات المتعلقة بالاتهامات المنسوبة إليه.\n\nباتت قوافل ضخمة من الشاحنات والصهاريج المحملة بالنفط تجوب الطرقات الصحراوية السورية، في مشهد يعكس تحولاً استراتيجياً في خريطة تدفق الطاقة بالمنطقة.\n\nتشهد بلدة الزر التابعة لناحية البصيرة في ريف دير الزور في سوريا، اشتباكات عنيفة، وسط تصاعد حدة التوتر بين الأهالي.\n\nمن قلب دمشق، رحبت المؤسسة العربية للإعلان بالشاب وسيم الحمام بعبارة \"ابن الحسكة.. نورت الشام\" على شاشة في ساحة الأمويين، دعما له بعد تعرضه للتنمر.\n\nعادت أسعار المحروقات للارتفاع مجددا في سوريا لتزيد من أعباء المواطن السوري بالتوازي مع بدء العام الدراسي الجديد وما سيترتب عليه من تكاليف باهظة وجب على الأسرة السورية تحملها.\n\nأعلن مندوب سوريا لدى الأمم المتحدة إبراهيم علبي عن بدء الحكومة السورية في تدمير مواد كيميائية على الأراضي السورية في أول عملية منذ أكثر من عقد من الزمن."}, {"guid": "https://arabic.rt.com/business/1829143-%D8%B1%D9%88%D8%B3-%D9%86%D9%81%D8%B7-%D8%AA%D8%B9%D8%AA%D8%B2%D9%85-%D8%B4%D8%AD%D9%86-30-%D9%85%D9%84%D9%8A%D9%88%D9%86-%D8%B7%D9%86-%D9%85%D9%86-%D9%86%D9%81%D8%B7-%D9%81%D9%88%D8%B3%D8%AA%D9%88%D9%83-%D8%A3%D9%88%D9%8A%D9%84-%D9%81%D9%8A-%D8%A7%D9%84%D9%86%D8%B5%D9%81-%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A-%D9%85%D9%86-2027/", "title": "\"روس نفط\" تعتزم شحن 30 مليون طن من نفط \"فوستوك أويل\" في النصف الثاني من 2027", "summary": "أعلن إيغور سيتشين، الرئيس التنفيذي لشركة \"روس نفط\"، أن الشركة ستبدأ شحن نحو 30 مليون طن من النفط المنتج ضمن مشروع \"فوستوك أويل\" إلى المستهلكين اعتبارا من النصف الثاني من عام 2027.", "link": "https://arabic.rt.com/business/1829143-%D8%B1%D9%88%D8%B3-%D9%86%D9%81%D8%B7-%D8%AA%D8%B9%D8%AA%D8%B2%D9%85-%D8%B4%D8%AD%D9%86-30-%D9%85%D9%84%D9%8A%D9%88%D9%86-%D8%B7%D9%86-%D9%85%D9%86-%D9%86%D9%81%D8%B7-%D9%81%D9%88%D8%B3%D8%AA%D9%88%D9%83-%D8%A3%D9%88%D9%8A%D9%84-%D9%81%D9%8A-%D8%A7%D9%84%D9%86%D8%B5%D9%81-%D8%A7%D9%84%D8%AB%D8%A7%D9%86%D9%8A-%D9%85%D9%86-2027/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c5e814236044401070610.jpg", "category": "اقتصاد", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788634116, "detail": "أعلن إيغور سيتشين، الرئيس التنفيذي لشركة \"روس نفط\"، أن الشركة ستبدأ شحن نحو 30 مليون طن من النفط المنتج ضمن مشروع \"فوستوك أويل\" إلى المستهلكين اعتبارا من النصف الثاني من عام 2027.\n\nوجاءت تصريحات سيتشين بالتزامن مع بدء تشغيل خط أنابيب النفط الرئيسي المؤدي إلى المحطة الجديدة في خليج \"سيفير\"، ضمن مشروع \"فوستوك أويل\" العملاق في إقليم كراسنويارسك بالقطب الشمالي الروسي.\n\nوقال سيتشين خلال مؤتمر عبر الفيديو بمناسبة تشغيل المشروع إن دخول \"فوستوك أويل\" حيز التشغيل سيتيح شحن 30 مليون طن من النفط للمستهلكين في النصف الثاني من العام المقبل.\n\nوينفذ مشروع \"فوستوك أويل\" من قبل \"روس نفط\" بتكليف من الرئيس الروسي فلاديمير بوتين، ويُنظر إليه باعتباره منطقة نفطية جديدة على مستوى عالمي، إذ تتجاوز قاعدة موارده 7 مليارات طن من النفط عالي الجودة، مع نسبة كبريت تتراوح بين 0.01% و0.1%.\n\nوبحسب بيانات الشركة، يضم المشروع 66 حقلا نفطيا، فيما تجاوز عدد الآبار التي جرى حفرها حتى الآن 2000 بئر. وتستخدم في عمليات الحفر معدات روسية الصنع من طراز \"تايمير\".\n\nوفي إطار تطوير البنية التحتية للمشروع، اكتمل بناء خط أنابيب النفط الرئيسي الذي يربط حقول \"فوستوك أويل\" بالميناء الجديد في خليج \"سيفير\".\n\nويضم الميناء محطة متخصصة لمناولة الشحنات والنفط وتحميله على ناقلات نفط من فئة الجليد، تمهيدا لنقله عبر طريق بحر الشمال.\n\nكما دخل رصيفان للشحن ورصيف مخصص لأسطول الميناء الخدمة بالفعل، فيما تتواصل أعمال بناء رصيف إضافي مخصص لتحميل النفط، ضمن المرحلة النشطة من تطوير المشروع.\n\nأعطى الرئيس الروسي فلاديمير بوتين، اليوم السبت، الإشارة الرسمية لتشغيل مشروع \"فوستوك أويل\" بشكل فعلي عبر تقنية الفيديو.\n\nأعلن الرئيس الروسي فلاديمير بوتين قرب تشغيل خط أنابيب النفط الرئيسي لمشروع \"فوستوك أويل\" في القطب الشمالي، تمهيدا لشحن أولى كميات الخام إلى المشترين عبر الطرق البحرية القطبية.\n\nكشف وزير تنمية الشرق الأقصى والقطب الشمالي الروسي أليكسي تشيكونكوف عن قرب توقيع استراتيجية تنمية الشرق الأقصى الروسي حتى عام 2036."}, {"guid": "CBMilwNBVV95cUxOVVBmUk9WS28zaElUbEZIZldyTXJ3bmd1bEp5VEhtSXhYWmZlc0ZwdGJ5ZzV2b2l5Vm9OalRvSmpFTERrOHFhU0RfUGYzbGpGcXZyZ0NCTTNCZHZqS29NSWJuN3lGNTBETHkzVjUyRnNhaGU4TWRSeDFzUHc1dzQ0UHFYWHk3SHlpRlFRVm41djVWclhWcVUyNUNrWTZ5QjRvNTIwOWE2SEUzZ29MUnBnN0hsR2VWOThtSG9IdVdZYlRwTlB6UWR5UlJIQmNfQ1hQRkwySUNxZFlhemVrVnNUc2VnTEhHNDVxREd2OUxSUnFCcGdUbkVYRWJFMzlpTkRaWXZyLWxDRmJXY19oNmRhWWljVWJjWFhWWlRyT2FMTUVHSksyVWhVNDl0dDVVZ1lZVlRjalBFVUtCeFBISXU3T1IyY2ktbjRPVkFtTTBORWpkLU9JUmtwQm5VcXIxMmhtcjhHcndLdEdKU3pBand3RkpHR0pwbTh5SF82b3ctcExFMWRUMTZIckdYbjFIMkQ4WXBWTzNVYw", "title": "فوز الجزيرة وحتا والشا 2026.09/thumbnail/6a9c61364c59b7579e6fbb83.jpeg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788633852, "detail": "وجه المبعوث الخاص للرئيس الأمريكي ستيف ويتكوف الشكر إلى الرئيس الروسي فلاديمير بوتين على وقف الضربات لمدة ثلاثة أيام لإجراء المفاوضات، وذلك خلال لقائهما مساء السبت في الكرملين.\n\nوخاطب ويتكوف بوتين في بداية الاجتماع قائلا: \"سيدي الرئيس، أود أن أشكركم على موافقة الاتحاد الروسي على وقف إطلاق النار لهذه الأيام الثلاثة، بحيث لا تُشن أي ضربات على كييف ولا على موسكو، مما سمح لنا بالقدوم إلى هنا بأمان خلال هذه الأيام الثلاثة\".\n\nكما نقل المبعوث الخاص للرئيس الأمريكي إلى الرئيس الروسي أطيب تمنيات الرئيس الأمريكي دونالد ترامب، وقال في مستهل اللقاء: \"طلب مني الرئيس ترامب أن أنقل إليكم أطيب تمنياته\".\n\nومن جانبه، أكد الرئيس الروسي فلاديمير بوتين أن موسكو ستبذل قصارى جهدها لضمان أمن المفاوضين الأمريكيين في موسكو، وذلك خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر.\n\nوتزامنا مع هذه المحادثات، أصدر الرئيس بوتين تعليماته بوقف جميع الضربات الجوية على العاصمة الأوكرانية كييف لمدة ثلاثة أيام، بدءا من منتصف ليل السبت، وهي خطوة مرتبطة بإجراء اتصالات المبعوثين الأمريكيين في كييف. وأوضح المتحدث باسم الكرملين، دميتري بيسكوف، أن الجانب الأوكراني أُبلغ بهذه الخطوة.\n\nوكان ويتكوف وكوشنر قد وصلا موسكو السبت، والتقيا مساء بالرئيس الروسي في الكرملين، في إطار الجهود الأمريكية المستمرة للوساطة بين موسكو وكييف.\n\nوأشار الرئيس الأمريكي دونالد ترامب في وقت سابق، إلى أن المبعوثين سيقدمان خلال زيارتهما إلى موسكو مقترحات لإنهاء النزاع في أوكرانيا. ويأتي هذا الاجتماع، وهو السادس من نوعه بين بوتين والمفاوضين الأمريكيين، وسط جهود دبلوماسية مكثفة تهدف إلى تحقيق تقدم في الملف الأوكراني، حيث من المقرر أن يتوجه ويتكوف وكوشنر غدا إلى كييف للقاء فلاديمير زيلينسكي.\n\nأكد الرئيس الروسي فلاديمير بوتين خلال لقائه المبعوثين الأمريكيين الخاصين ستيف ويتكوف وجاريد كوشنر، استمرار زعيمي روسيا والولايات المتحدة الحفاظ على اتصالاتهما الشخصية.\n\nأفاد مصدر في متجر هدايا البيت الأبيض أن العملة التي تركها المبعوث الأمريكي الخاص ستيف ويتكوف في أحد مطاعم موسكو ليست مخصصة للبيع، بل هي قطعة تذكارية شخصية.\n\nصرح مساعد الرئيس الروسي يوري أوشاكوف بأن المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، أجريا استعدادات جادة لزيارتهما إلى موسكو.\n\nأفادت غرفة العمليات في مقاطعة بيلغورود الروسية بأن شخصا واحدا لقى حتفه وأصيب آخر، اليوم السبت، بعد هجوم بطائرة مسيرة أطلقتها القوات الأوكرانية.\n\nشكر المبعوث الأمريكي الخاص ستيف ويتكوف الرئيس الروسي فلاديمير بوتين على تسليم الولايات المتحدة المدان السابق في مشاة البحرية الأمريكية روبرت غيلمان.\n\nأكد الرئيس الروسي فلاديمير بوتين أن موسكو ستبذل قصارى جهدها لضمان أمن المفاوضين الأمريكيين في موسكو، وذلك خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر.\n\nقال المبعوث الأمريكي الخاص ستيف ويتكوف، في الكرملين اليوم، إنه يعتبر حواره مع الرئيس الروسي فلاديمير بوتين، أكثر المحطات رسوخا في الذاكرة.\n\nأعلن الرئيس الروسي فلاديمير بوتين مناقشة \"جميع مكونات وجوانب\" النزاع الأوكراني خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، في الاجتماع السادس من نوعه معهما.\n\nأمضى المبعوثان الأمريكيان ستيف ويتكوف وجاريد كوشنر مع الممثل الخاص للرئيس الروسي كيريل دميترييف أكثر من ثلاث ساعات في غداء عمل بمطعم \"كل شيء من أجل النصر\" في موسكو.\n\nشارك مساعد الرئيس الروسي يوري أوشاكوف والمبعوث الخاص للتعاون الاستثماري والاقتصادي كيريل دميترييف في لقاء الرئيس فلاديمير بوتين مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر."}, {"guid": "https://arabic.rt.com/world/1829146-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A-%D9%8A%D9%87%D8%AF%D8%AF-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D9%8A%D9%86-%D8%A8%D8%B6%D8%B1%D8%A8%D8%A7%D8%AA-%D8%A3%D9%83%D8%AB%D8%B1-%D9%82%D9%88%D8%A9-%D8%A5%D8%B0%D8%A7-%D8%A7%D8%B3%D8%AA%D9%85%D8%B1%D8%AA-%D9%87%D8%AC%D9%85%D8%A7%D8%AA%D9%87%D9%85-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D8%B3%D9%81%D9%86-%D8%A7%D9%84%D8%A5%D9%8A%D8%B1%D8%A7%D9%86%D9%8A%D8%A9/", "title": "الحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية", "summary": "صرح المتحدث باسم مقر \"خاتم الأنبياء\" الإيراني إبراهيم ذو الفقاري بأن إيران ستشن ضربات جديدة وأكثر قوة ضد السفن العسكرية الأمريكية إذا استمرت في مضايقة السفن الإيرانية ومهاجمتها.", "link": "https://arabic.rt.com/world/1829146-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A-%D9%8A%D9%87%D8%AF%D8%AF-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D9%8A%D9%86-%D8%A8%D8%B6%D8%B1%D8%A8%D8%A7%D8%AA-%D8%A3%D9%83%D8%AB%D8%B1-%D9%82%D9%88%D8%A9-%D8%A5%D8%B0%D8%A7-%D8%A7%D8%B3%D8%AA%D9%85%D8%B1%D8%AA-%D9%87%D8%AC%D9%85%D8%A7%D8%AA%D9%87%D9%85-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D8%B3%D9%81%D9%86-%D8%A7%D9%84%D8%A5%D9%8A%D8%B1%D8%A7%D9%86%D9%8A%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c61bf423604449f711342.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788633775, "detail": "صرح المتحدث باسم مقر \"خاتم الأنبياء\" الإيراني إبراهيم ذو الفقاري بأن إيران ستشن ضربات جديدة وأكثر قوة ضد السفن العسكرية الأمريكية إذا استمرت في مضايقة السفن الإيرانية ومهاجمتها.\n\nوقال ذو الفقاري: \"نحذر الجيش الأمريكي من أنه في حال استمرار الأعمال العدائية وانعدام الأمن ومضايقة السفن الإيرانية والحصار البحري من جانب الولايات المتحدة، فإن ضربات القوات المسلحة ضد السفن العسكرية الأميركية في المنطقة ستكون أشد من السابق\".\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني وأشار إلى أنه لا يستبعد إمكانية \"توسيع نطاق الضربات\" ضد السفن العسكرية الأمريكية.\n\nوأفادت وسائل إعلام إيرانية، في وقت سابق، بأن الأصوات التي سمعت في \"جاسك\" و\"قشم\" ناجمة عن \"معاقبة السفن المخالفة\" في مضيق هرمز، مشيرة إلى عدم وقوع أي انفجار في هاتين المنطقتين.\n\nويأتي ذلك في وقت قال فيه وزير الحرب الأمريكي بيت هيغسيث، مساء السبت، إن الولايات المتحدة ستدمر ناقلات النفط الإيرانية وتغرقها في حال أطلقت إيران النار على السفن الأمريكية.\n\nأعلن الحرس الثوري الإيراني مهاجمة زورق أمريكي مسير كان يعتزم دخول المنطقة المحمية في مضيق هرمز.\n\nأعلنت العلاقات العامة للحرس الثوري الإيراني في بيان فجر اليوم الأحد، استهداف حاملة طائرات ومدمرة تابعتين للجيش الأمريكي.\n\nكشف مسؤولون أمريكيون مطلعون عن إخضاع نحو 50 من كبار ضباط وموظفي هيئة الأركان المشتركة في الجيش الأمريكي لاختبارات كشف الكذب (بوليغراف) خلال الشهر الماضي.\n\nوجّه وزير الحرب الأمريكي بيت هيغسيث تحذيرا شديد اللهجة إلى إيران، ملوحا بعواقب عسكرية واقتصادية في حال استهداف السفن التابعة للبحرية الأمريكية في المنطقة.\n\nأصدرت السفارة الأمريكية لدى البحرين تحذيرا أمنيا للمواطنين الأمريكيين، أكدت فيه أن الوضع الأمني في الشرق الأوسط لا يزال معقدا مع احتمالية حدوث تصعيد غير متوقع.\n\nهاجمت قوات القيادة المركزية الأمريكية (سنتكوم) ثلاث ناقلات نفط خام إيرانية، ردا على قيام فيلق الحرس الثوري الإيراني بإطلاق صواريخ باليستية باتجاه مدمرتين تابعتين للبحرية الأمريكية.\n\nباتت قوافل ضخمة من الشاحنات والصهاريج المحملة بالنفط تجوب الطرقات الصحراوية السورية، في مشهد يعكس تحولاً استراتيجياً في خريطة تدفق الطاقة بالمنطقة.\n\nدعا المتحدث باسم الخارجية الإيرانية إسماعيل بقائي الأمريكيين إلى التساؤل عن أسباب طرح وعود بإعفاء أبنائهم من الديون المصرفية مقابل القتال في \"حرب إسرائيل ضد إيران\".\n\nأفادت وكالة \"فارس\" بسماع دوي انفجارات عديدة في جزيرة خارك بالخليج، فيما تداولت وسائل إعلام أنباء حول استهداف أمريكي لناقلة نفط.\n\nأفادت صحيفة \"نيويورك تايمز\" نقلا عن مصادر بأن نحو 50 ضابطا وموظفا في هيئة الأركان المشتركة الأمريكية أمروا بالخضوع لاختبار كشف الكذب على خلفية التسريبات في وسائل الإعلام.\n\nجدد الرئيس الأمريكي دونالد ترامب تأكيده أنه \"لا توجد أي ألغام بحرية حاليا في مضيق هرمز\"، مشيدا بالدور الذي تقوم به القوات الأمريكية هناك بقوله: \"نحن نقوم بعمل كبير جدا\"."}, {"guid": "https://arabic.rt.com/society/1829145-%D8%A5%D9%84%D8%B2%D8%A7%D9%85-%D8%B7%D8%A7%D9%84%D8%A8%D8%A7%D8%AA-%D8%A8%D8%A7%D9%84%D9%86%D9%82%D8%A7%D8%A8-%D9%81%D9%8A-%D9%85%D8%B5%D8%B1-%D9%8A%D8%AB%D9%8A%D8%B1-%D8%AC%D8%AF%D9%84%D8%A7-%D9%88%D8%A7%D8%B3%D8%B9%D8%A7-%D9%88%D9%82%D8%B1%D8%A7%D8%B1%D8%A7%D8%AA-%D8%B5%D8%A7%D8%B1%D9%85%D8%A9-%D8%A8%D8%AD%D9%82-%D9%85%D8%B3%D8%A4%D9%88%D9%84%D9%8A%D9%86/", "title": "إلزام طالبات بالنقاب في مصر يثير جدلا واسعا.. وقرارات صارمة بحق مسؤولين", "summary": "أثار منشور نشرته صفحة مدرسة مصرية على صفحتها بمنصة \"فيسبوك\" يظهر جميع الطالبات في الطابور المدرسي يرتدين النقاب، جدلا واسعا وتدخلا من وزارة التربية والتعليم.", "link": "https://arabic.rt.com/society/1829145-%D8%A5%D9%84%D8%B2%D8%A7%D9%85-%D8%B7%D8%A7%D9%84%D8%A8%D8%A7%D8%AA-%D8%A8%D8%A7%D9%84%D9%86%D9%82%D8%A7%D8%A8-%D9%81%D9%8A-%D9%85%D8%B5%D8%B1-%D9%8A%D8%AB%D9%8A%D8%B1-%D8%AC%D8%AF%D9%84%D8%A7-%D9%88%D8%A7%D8%B3%D8%B9%D8%A7-%D9%88%D9%82%D8%B1%D8%A7%D8%B1%D8%A7%D8%AA-%D8%B5%D8%A7%D8%B1%D9%85%D8%A9-%D8%A8%D8%AD%D9%82-%D9%85%D8%B3%D8%A4%D9%88%D9%84%D9%8A%D9%86/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c5f254c59b757b86c6555.jpg", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788633239, "detail": "أثار منشور نشرته صفحة مدرسة مصرية على صفحتها بمنصة \"فيسبوك\" يظهر جميع الطالبات في الطابور المدرسي يرتدين النقاب، جدلا واسعا وتدخلا من وزارة التربية والتعليم.\n\nوبعد الجدل الواسع، حذفت صفحة مدرسة نجع سعيد الإعدادية المشتركة في محافظة قنا، الصورة والمنشور الذي تضمن إشارة إلى ما وصفه \"الالتزام بالنقاب للطالبات\"، بينما تعرض مسؤوليها لعقوبات من وزارة التربية والتعليم، والتي أكدت بدورها أن الصورة مصنوعة بالذكاء الاصطناعي.\n\n\"رمسيس الثاني هو فرعون موسى\".. وزير آثار مصر الأسبق يتحدث عن 4 شواهد تاريخية وأوضحت وزارة التربية والتعليم، في بيان، أن \"المنشور جاء نتيجة خطأ من مسؤول صفحة الفيسبوك الخاصة بالمدرسة، وتم حذفه على الفور، كما تم إحالة مدير المدرسة ومسؤول الصفحة إلى الشؤون القانونية لاتخاذ الإجراءات اللازمة حيال الواقعة\".\n\nوأضافت الوزارة أن \"الصورة المتداولة ضمن المنشور الخاص بالمدرسة والتي أظهرت طالبات المدرسة بالكامل يرتدين النقاب غير حقيقية وتم توليدها باستخدام تقنية الذكاء الاصطناعي، ولا تعبر عن واقع المدرسة أو الطالبات بها\".\n\nوشددت الوزارة على أن \"جميع مدارس الجمهورية ملتزمة بتطبيق القرار الوزاري رقم 167 لسنة 2023 بشأن مواصفات الزي المدرسي الموحد لجميع الطلاب بالمدارس الرسمية والخاصة\"، مؤكدة أن \"أي منشورات يتم تداولها عبر الصفحات الرسمية للمدارس يجب أن تعكس التعليمات والقرارات المنظمة للعملية التعليمية بدقة ومسؤولية\".\n\nوأشارت الوزارة إلى أن \"الإعلان عن التعامل الفوري مع الواقعة يأتي في إطار حرصها على ضبط المحتوى المنشور عبر الصفحات الرسمية للمدارس، ومنع تداول معلومات غير دقيقة، والحفاظ على انضباط العملية التعليمية والتزام جميع المؤسسات التعليمية بالتعليمات والقرارات الوزارية المنظمة\".\n\nما تزال هوية فرعون الذي عاصر النبي موسى واحدة من أكثر القضايا إثارة للجدل في الدراسات التاريخية والأثرية، في ظل عدم وجود نقش أو وثيقة أثرية تحسم بصورة قاطعة اسم الفرعون المقصود.\n\nوصف نقيب الفلاحين في مصر حسين أبو صدام انتشار الطحالب على السواحل الإسرائيلية بأنه ظاهرة مرتبطة بحركة مياه البحر المتوسط والتغيرات المناخية، مشيرا إلى تأثيرها على محطات التحلية."}, {"guid": "https://arabic.rt.com/world/1829125-%D8%A7%D8%AD%D8%AA%D8%AC%D8%A7%D8%AC%D8%A7-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D9%87%D8%AC%D8%B1%D8%A9-%D9%85%D8%A6%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%AA%D8%B8%D8%A7%D9%87%D8%B1%D9%8A%D9%86-%D8%A7%D9%84%D9%85%D9%84%D8%AB%D9%85%D9%8A%D9%86-%D9%8A%D8%BA%D9%84%D9%82%D9%88%D9%86-%D9%85%D9%8A%D9%86%D8%A7%D8%A1-%D8%AF%D9%88%D9%81%D8%B1-%D8%A7%D9%84%D8%A8%D8%B1%D9%8A%D8%B7%D8%A7%D9%86%D9%8A/", "title": "احتجاجا على الهجرة.. مئات المتظاهرين الملثمين يغلقون طريق ميناء دوفر البريطاني", "summary": "أغلق مئات المتظاهرين الملثمين المناهضين للهجرة، اليوم السبت، الطرق المؤدية إلى ميناء دوفر في جنوب إنجلترا، أحد أكثر الموانئ ازدحاما في بريطانيا، مما تسبب في تعطيل حركة المرور.", "link": "https://arabic.rt.com/world/1829125-%D8%A7%D8%AD%D8%AA%D8%AC%D8%A7%D8%AC%D8%A7-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D9%87%D8%AC%D8%B1%D8%A9-%D9%85%D8%A6%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%AA%D8%B8%D8%A7%D9%87%D8%B1%D9%8A%D9%86-%D8%A7%D9%84%D9%85%D9%84%D8%AB%D9%85%D9%8A%D9%86-%D9%8A%D8%BA%D9%84%D9%82%D9%88%D9%86-%D9%85%D9%8A%D9%86%D8%A7%D8%A1-%D8%AF%D9%88%D9%81%D8%B1-%D8%A7%D9%84%D8%A8%D8%B1%D9%8A%D8%B7%D8%A7%D9%86%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c51c74c59b7128a42bd51.jpeg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788632986, "detail": "أغلق مئات المتظاهرين الملثمين المناهضين للهجرة، اليوم السبت، الطرق المؤدية إلى ميناء دوفر في جنوب إنجلترا، أحد أكثر الموانئ ازدحاما في بريطانيا، مما تسبب في تعطيل حركة المرور.\n\nوأظهرت مقاطع فيديو ونشرت على وسائل التواصل الاجتماعي عشرات الرجال، يُقدّر عددهم بنحو 300 إلى 500 شخص، وهم يرتدون ملابس سوداء وأقنعة تغطي وجوههم، ويشبكون أذرعهم عبر طريق رئيسي قرب الميناء، ويهتفون \"أوقفوا القوارب\". كما رُصدت عبارة \"الدم في أيديكم\" مكتوبة خارج مركز استقبال المهاجرين التابع لوزارة الداخلية في دوفر.\n\nوقالت هيئة ميناء دوفر في بيان إن \"حركة المرور من وإلى الميناء توقفت بسبب حادثة مستمرة تتعلق بالنظام العام\". وأضافت الهيئة أن المحتجين كانوا يغلقون \"جميع الطرق\" المؤدية إلى محطة الميناء وخارجها. وأدى الإغلاق إلى طابور من المركبات بطول أربعة أميال على طول الطريق A20.\n\nوتبنى فصيل يميني متطرف يُدعى \"منصة الوطنية\" (Patriot Platform) مسؤولية الاحتجاجات، وهدد في البداية بإغلاق دوفر لمدة ثلاثة أيام. وأسس هذه المجموعة في يونيو من هذا العام داني توماس (المعروف باسم داني تومو)، وهو مدان سابق بمحاولة اختطاف ومقرب من زعيم اليمين المتطرف تومي روبنسون. وشارك توماس لقطات من الاحتجاج على وسائل التواصل الاجتماعي، وكتب قائلا: \"هذا تحذيرنا\".\n\nوأثارت الاحتجاجات انتقادات واسعة، حيث تساءل النائب العمالي عن دائرة دوفر وديل، مايك تاب، عن كيفية تمكن المظاهرة من مفاجأة الشرطة، قائلا: \"يبدو أن الشرطة لم تعلم بالأمر، وكانت الموارد قليلة جدا على الأرض\". كما انتقد مفتش سابق ما وصفه بـ\"فشل استخباراتي\" من قبل شرطة كنت.\n\nوأدانت الحكومة البريطانية \"السلوك في دوفر والاضطراب في السفر الذي تسبب فيه\"، مؤكدة أن الاحتجاج تجاوز حدود التظاهر السلمي. وقال نايجل فاراج، زعيم حزب الإصلاح، إنه يستنكر ما حدث، وأضاف: \"لا ينبغي السماح لك بأن تكون متنكرا، مرتديا قناعا، وتخرج للاحتجاج في شوارع بلدنا\".\n\nبينما قال روبرت جينريك من حزب الإصلاح إنه \"من المخزي تماما أن تتعطل حياة الشركات والأفراد بسبب هؤلاء الأشخاص\".\n\nوفي المقابل، دافعت شرطة كنت عن تعاملها مع الاحتجاجات، ووصفتها بأنها \"حدث تلقائي وتمت السيطرة عليه وفقا لذلك\". وأكدت الشرطة أنه لم يتم إجراء أي اعتقالات. فبحلول الظهيرة، غادر معظم المتظاهرين البلدة، بعد أن رافقتهم الشرطة إلى محطة دوفر بريوري للسكك الحديدية. وأفاد الميناء في نفس الوقت تقريبا أن الطرق المؤدية أصبحت مفتوحة مرة أخرى وعادت الأمور إلى طبيعتها.\n\nأفادت وسائل إعلام بريطانية، السبت، بأن عشرات الملثمين تسببوا في شل حركة ميناء دوفر، الواقع في مقاطعة كينت جنوب شرق البلاد.\n\nحذر الرئيس الأمريكي دونالد ترامب، من أن بريطانيا على شفا كارثة، معربا عن مخاوفه العميقة بشأن ارتفاع تكاليف الطاقة، وسياسات الحياد الكربوني، وتأثير الهجرة الجماعية على هوية البلاد."}, {"guid": "CBMirgRBVV95cUxOUi1rNGpzSzlrakR2SUhTeVBRM1NKWnY1LWVPWWUzb2s1SlUxQWlVOXhRb0RBN3MxOHhNeTY3YzFNQW1NQ3VrWHFEMDJTWkVUaWJUU1pZdGdabEdDN0xSTi1zVThqdmpCOXVLRTdCV0lNMDFSbnphekQ2aGduRVJSUDVzUHFFMGhQZWhLTnk5cEthZVUxRGNSTEdFc19DRnNhWUJGSEpuV3dic0J3ak1UOGZVa3JhMnFCdlhNVFZQSmljbTIxeTc2ZnJnT1hmQVhuYkY1b3d3T3VjQ1ZKZlVXZDZ4cmJ4ZElhaEYzWWdGRDZfeG5zUVJISGtLcDRObDlkUmdVRjRVNUdlU1dnamI2SDdfa1FJQUJjbF81MWI2TV9TVVFBa2NYZ0t6ck16RG9COG5TNlZKV2NvdUl0bVJ4cUJENGZjYnFuYmVYYXEyTEQyWk1WQmpGNGxESHhwTkI0NndpLWduX0lsV0tmdUhvWll5NHlYSFNsS2JVcGttblJNdVlkMkFuX3hxV3pyMUIta0d5aWdmMDhrc251dldRMElTb0o0Vjkxc2hXTTVsN1JqMnJ6ZWYtT3p4M2dISFh5cURaLXdLcy1yUVAwd0phNEduR24zNWp4UmJVaWN4ektzbmhTaTFFbjlCYkd4dDBpZzFpdGxMdjVfNzRhUWlsQjZRN3dOQTFSXzFhU3k3OVJBcExpX0lqV2ExVndNMTN2eVg0T0x3SmdRZlJYc2c", "title": "قدم.. أتلتيك بلباو يكتسح أتلتيكو مدريد بثلاثية في الدوري الإسباني - Anadolu Ajansı", "summary": "قدم.. أتلتيك بلباو يكتسح أتلتيكو مدريد بثلاثية في الدوري الإسباني &nbsp;&nbsp; Anadolu Ajansı", "link": "https://news.google.com/rss/articles/CBMirgRBVV95cUxOUi1rNGpzSzlrakR2SUhTeVBRM1NKWnY1LWVPWWUzb2s1SlUxQWlVOXhRb0RBN3MxOHhNeTY3YzFNQW1NQ3VrWHFEMDJTWkVUaWJUU1pZdGdabEdDN0xSTi1zVThqdmpCOXVLRTdCV0lNMDFSbnphekQ2aGduRVJSUDVzUHFFMGhQZWhLTnk5cEthZVUxRGNSTEdFc19DRnNhWUJGSEpuV3dic0J3ak1UOGZVa3JhMnFCdlhNVFZQSmljbTIxeTc2ZnJnT1hmQVhuYkY1b3d3T3VjQ1ZKZlVXZDZ4cmJ4ZElhaEYzWWdGRDZfeG5zUVJISGtLcDRObDlkUmdVRjRVNUdlU1dnamI2SDdfa1FJQUJjbF81MWI2TV9TVVFBa2NYZ0t6ck16RG9COG5TNlZK
