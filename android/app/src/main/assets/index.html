تباط بين ارتفاع استهلاك البقوليات وفول الصويا وانخفاض خطر الإصابة بارتفاع ضغط الدم، لكنها لا تثبت أن تناول هذه الأطعمة وحده يمنع الإصابة بالمرض. لذلك تبقى متابعة ضغط الدم واستشارة الطبيب عند ارتفاعه من أهم خطوات الوقاية والسيطرة على الحالة.\n\nكشفت إرشادات طبية جديدة عن توصيات لاختيار أدوية الوقاية من الصداع النصفي، مع مراعاة عدد النوبات وتأثيرها في الحياة اليومية والحالة الصحية للمريض.\n\nتساعد حركة الساقين على تنشيط الدورة الدموية من خلال آلية طبيعية تعمل مع كل خطوة أو حركة للكاحل أو رفع للكعبين.\n\nكشفت دراسة جديدة أن عادة بسيطة يمكن دمجها في الروتين اليومي قد تحمل فوائد مهمة لصحة القلب."}, {"guid": "https://arabic.rt.com/press/1828996-%D9%87%D9%84-%D8%AA%D9%83%D9%88%D9%86-%D9%81%D9%86%D8%B2%D9%88%D9%8A%D9%84%D8%A7-%D8%A7%D9%84%D9%86%D9%85%D9%88%D8%B0%D8%AC-%D8%A7%D9%84%D8%B0%D9%8A-%D8%B3%D8%AA%D8%B7%D9%84%D8%A8%D9%87-%D9%88%D8%A7%D8%B4%D9%86%D8%B7%D9%86-%D9%85%D9%86-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86/", "title": "هل تكون فنزويلا النموذج الذي ستطلبه واشنطن من إيران؟", "summary": "ليس بالضرورة أن تكرر واشنطن تجربة كاراكاس في طهران، لكن اتفاق فنزويلا منح هذه الإدارة سابقة عملية يمكن البناء عليها. شربل أنطون – Politico", "link": "https://arabic.rt.com/press/1828996-%D9%87%D9%84-%D8%AA%D9%83%D9%88%D9%86-%D9%81%D9%86%D8%B2%D9%88%D9%8A%D9%84%D8%A7-%D8%A7%D9%84%D9%86%D9%85%D9%88%D8%B0%D8%AC-%D8%A7%D9%84%D8%B0%D9%8A-%D8%B3%D8%AA%D8%B7%D9%84%D8%A8%D9%87-%D9%88%D8%A7%D8%B4%D9%86%D8%B7%D9%86-%D9%85%D9%86-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9be2a54236041b2110126c.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788661952, "detail": "ليس بالضرورة أن تكرر واشنطن تجربة كاراكاس في طهران، لكن اتفاق فنزويلا منح هذه الإدارة سابقة عملية يمكن البناء عليها. شربل أنطون – Politico\n\nلقد بدا إعلان واشنطن الأسبوع الماضي - الذي أعلنت فيه سيطرتها على 55% من مشروع جديد يمتلك أكثر من 65 مليار برميل من النفط الخام الفنزويلي، بموجب امتيازات حقلية يقول مسؤولون أمريكيون إنها قد تمتد لقرن، كجزء من اتفاقية طاقة أوسع - وكأنه، للوهلة الأولى، خبر إقليمي. صفقة موارد في أعقاب مادورو في الفناء الخلفي لأمريكا.\n\nلكن فنزويلا ليست الحدث الأبرز، بل هي النموذج. وهي تجيب بهدوء على سؤال ظلّ يُخيّم على السياسة تجاه إيران لأشهر: ما الذي تعتبره هذه الإدارة انتصارا حقيقيا؟\n\nتبدأ الإجابة بملاحظة بسيطة: تخوض واشنطن حملتين ضد خصومها المنتجين للنفط، وهما تتشابهان بشكل متزايد مع نسختين من الاستراتيجية نفسها. ففي فنزويلا استخدمت الولايات المتحدة القوة - عملية عسكرية، ورئيس أُسر، وحكومة مؤقتة مستعدة للتنازل عن حق الوصول إلى حقول النفط لقرن كامل في غضون 7 أشهر. أما في إيران، فلم يكن هذا النوع من الحسم واردا أبدا. وبعد 6 أشهر من الصراع المفتوح، استوعبت طهران الضغط ولم تنهار.\n\nلذا، لجأت واشنطن إلى الأداة المتبقية لديها: الخنق الاقتصادي. وتعكس عملية \"المنبوذ الاقتصادي\" التي أطلقها وزير الخزانة سكوت بيسنت، في لهجتها وطموحها، استراتيجية فنزويلا، إذ تعد بقطع \"كل شريان حياة اقتصادي\" يدعم طهران، مع وضع الصين، أكبر مشترٍ للنفط الإيراني، في مرمى النيران.\n\nإن هذا التفصيل هو الرابط الحقيقي بينهما. وتشترك العمليتان في هدف ثانوي لا علاقة له بالأيديولوجيا، بل يتعلق بقوة السوق، إذ أن قطع الصين عن النفط الخام المخفّض السعر، والمرتبط بالعقوبات. ويزيح المشروع المشترك الفنزويلي الصين من صدارة عملاء شركة النفط الحكومية. وتستهدف حملة العقوبات على إيران مكانة بكين كأكبر شريك تجاري لطهران.\n\nوهذه السياسة، أكثر من أي نظرية شاملة \"لعقيدة ترامب\"، تفسّر تحركاته الحالية. ويمكن اختبار هذه الفرضية: راقبوا ما إذا كانت المواعيد النهائية للعقوبات الثانوية المفروضة على المشترين والشاحنين الصينيين ستُطبّق فعليا، أم سيتم تخفيفها بهدوء بمجرد أن تُلمّح بكين إلى رد فعل حقيقي.\n\nإن السؤال الأكثر دلالة هو ما تكشفه فنزويلا عن الشروط التي ستسعى واشنطن للحصول عليها إذا ما أُعيدت إيران إلى طاولة المفاوضات. وعادة ما تُسوَّق العقوبات كوسيلة ضغط لتحقيق نتائج محدودة: إنهاء الحرب، وتقليص البرنامج النووي. لكن فنزويلا تُظهر أنه عندما تمتلك هذه الإدارة نفوذا حقيقيا على دولة منتجة للنفط، فإنها لا تكتفي بتقديم تنازلات سياسية، بل تُحوّل هذا النفوذ إلى سيطرة.\n\nإذا عادت إيران إلى المفاوضات وهي تعاني من استنزاف اقتصادي، فلن يكون النموذج المطروح على واشنطن هو إطار الاتفاق النووي لعام 2015 الذي ينص على تخفيف العقوبات مقابل عمليات التفتيش. بل سيكون أقرب إلى كاراكاس: رأس مال أمريكي وحقوق شراء مُدمجة مباشرة في البنية التحتية للطاقة الإيرانية، تُصوَّر على أنها استثمار في إعادة الإعمار لا غنائم حرب، وتُسوَّق محليا على أنها لا تُكلِّف دافعي الضرائب الأمريكيين شيئا.\n\nإن هذه الرؤية تستحق التشكيك، فإيران ليست فنزويلا. ولا يوجد زعيم أسير، ولا حكومة انتقالية على غرار ديلسي رودريغيز مستعدة لتوقيع تنازلات تمتد لقرن من الزمان. وأي نقل للأسهم سيتطلب إما تسوية شاملة تتجاوز بكثير أي شيء مطروح حاليا أو انهيارا تاما للنظام، وكلاهما ليسا قريبين من السيناريو الأساسي اليوم.\n\nفي الواقع يُعارض التاريخ هذه الفكرة أيضا، فقد عانت الدول الخاضعة للعقوبات، والتي تواجه ضغوطاً حقيقية - كإيران بموجب اتفاق 2015، والعراق في التسعينيات، وروسيا منذ 2022 - من انكماش اقتصادي وتضخم وانخفاض في قيمة الصادرات قبل التنازل عن أصولها الأساسية. ولا يوجد سابقة حقيقية لاتفاقية \"الإنصاف مقابل التخفيف\" في غياب حكومة تابعة مطيعة، وهو ما يتوفر لدى واشنطن في كاراكاس، ولكنه غير متوفر في طهران.\n\nكما أن قطاع النفط الإيراني أقل تدهوراً بكثير من نظيره الفنزويلي، وقد أمضت طهران عقدين من الزمن في بناء بدائل لتقليل اعتمادها على حسن نية واشنطن. وأي اتفاق يشبه اتفاق فنزويلا سيصطدم بعقبة أعمق: إرث تأميم عام 1951 في عهد محمد مصدق، الذي جعل السيادة على الموارد مقدسة سياسيا لدى جميع الفصائل الإيرانية، وهو عائق لا يقاربه النص الدستوري الفنزويلي.\n\nبل إن سابقة فنزويلا نفسها قد لا تصمد. وينص دستورها على منح الدولة الملكية الأساسية للموارد الهيدروكربونية، وامتياز يمتد لقرن من الزمان وقّعته حكومة غير منتخبة هو تحديدا نوع المطالبات التي يمكن لحكومة منتخبة مستقبلا أن تبطلها. كما أن نموذجا قد لا يصمد في كاراكاس، يُعدّ نموذجا هشا يمكن تصديره إلى طهران.\n\nوهذه الاختلافات هي السبب وراء عدم ترجيح حدوث اتفاق مماثل لاتفاق فنزويلا في إيران في أي وقت قريب. لكنها لا تنفي المقارنة، بل تحددها. والجوهر الحقيقي لهذه الحجة ليس أن واشنطن ستكرر تجربة كاراكاس في طهران، بل إن اتفاق فنزويلا قد منح هذه الإدارة سابقة عملية لتحويل النفوذ إلى سيطرة على الموارد عندما تسمح الظروف السياسية بذلك - تم اختبارها مرة واحدة، وبيعت بنجاح في الداخل - وستؤثر هذه السابقة على كيفية تعريف المفاوضين للنتيجة المرجوة في المرة القادمة التي تمتلك فيها واشنطن أوراقا رابحة ضد دولة نفطية، بما في ذلك إيران.\n\nوالسؤال الذي يستحق المتابعة ليس ما إذا كانت طهران ستوقع تنازلا يمتد لقرن من الزمان الشهر المقبل، بل ما إذا كانت لغة \"استثمار إعادة الإعمار\" و\"شراكة تخفيف العقوبات\" ستظهر في أي مسار تفاوضي مستقبلي مع إيران. وإذا حدث ذلك، فستكون فنزويلا هي السبب في أننا نعرف بالفعل ما تعنيه هذه اللغة."}, {"guid": "https://arabic.rt.com/press/1828762-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D8%AA%D8%AA%D8%AD%D9%88%D9%84-%D8%A5%D9%84%D9%89-%D8%A7%D8%B3%D8%AA%D8%AE%D8%AF%D8%A7%D9%85-%D8%A7%D9%84%D8%B7%D8%A7%D8%A6%D8%B1%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%B3%D9%8A%D8%B1%D8%A9-%D8%A7%D9%84%D9%86%D9%81%D8%A7%D8%AB%D8%A9/", "title": "روسيا تتحوّل إلى استخدام الطائرات المسيّرة النفّاثة", "summary": "عن قفزة نوعية في استخدام روسيا للطائرات المسيّرة، كتب سيرغي فالتشينكو، في \"موسكوفسكي كومسوموليتس\":", "link": "https://arabic.rt.com/press/1828762-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D8%AA%D8%AA%D8%AD%D9%88%D9%84-%D8%A5%D9%84%D9%89-%D8%A7%D8%B3%D8%AA%D8%AE%D8%AF%D8%A7%D9%85-%D8%A7%D9%84%D8%B7%D8%A7%D8%A6%D8%B1%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%B3%D9%8A%D8%B1%D8%A9-%D8%A7%D9%84%D9%86%D9%81%D8%A7%D8%AB%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9ac1044c59b71152591bd3.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788661870, "detail": "عن قفزة نوعية في استخدام روسيا للطائرات المسيّرة، كتب سيرغي فالتشينكو، في \"موسكوفسكي كومسوموليتس\":\n\nصرح سيرغي بيسكرستنوفي، المستشار التقني للرئيس زيلينسكي، بأن روسيا استخدمت نحو 1500 طائرة مسيرة نفاثة من طراز غيران-4، وغيران-5 في يوليو/تموز، وأكثر من 2500 طائرة منها في أغسطس/آب.\n\nوارتفعت نسبة الطائرات المسيرة النفاثة من حوالي 30% إلى نصف إجمالي عمليات الإطلاق.\n\nوفي الصدد، قال العضو السابق في البرلمان الأوكراني، أوليغ تساريف: \"ربما هذا التحوّل نجم عن تعزيز أوكرانيا دفاعاتها الجوية بطائرات مسيرة اعتراضية قادرة على اعتراض معظم طائرات غيران التقليدية الأبطأ.. فروسيا مضطرة إلى زيادة سرعة طائراتها المسيّرة وتطويرها للتغلب على الدفاعات الجوية الأوكرانية المعززة\".\n\nوفي أغسطس/آب، لم تكتفِ روسيا بزيادة نسبة طائراتها المسيرة النفاثة من طراز غيران، بل زادت أيضًا متوسط ​​عدد عمليات الإطلاق: بمعدل 166 طائرة مسيرة يوميًا، مقارنةً بـ 158 طائرة في الشهر السابق. وفي الوقت نفسه، ازدادت فاعلية الضربات بشكل ملحوظ.\n\nبالمقابل، لوحظ انخفاض إجمالي عدد عمليات إطلاق الطائرات الأوكرانية المسيّرة، في الأيام العشرة الأخيرة من شهر أغسطس، بحوالي 20%. وهذا قد يكون نتيجة للضربات الروسية على مواقع إنتاج الطائرات المسيرة وتخزينها، أو رغبة كييف في الاحتفاظ رها لشنّ ضربات أوسع نطاقًا في الخريف\".\n\nوأضاف تساريف: \"أصبحت الطائرات المسيرة صيادًا دائمًا للأفراد والمعدات ومواقع إطلاق النار ووسائل النقل، ليس فحسب على خطوط المواجهة، بل وفي المناطق الخلفية. وبات نطاق استخدامها واسعًا إلى درجة أن أي هدف يتم رصده يجذب طائرة مسيرة أو أكثر في آن واحد. تشهد الحرب تقدّمًا تقنيًا كبيرًا\"."}, {"guid": "https://arabic.rt.com/press/1828759-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D8%AA%D9%82%D8%AA%D8%B1%D8%AD-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D8%B5%D9%8A%D9%86-%D9%82%D9%88%D8%A9-%D8%AC%D8%AF%D9%8A%D8%AF%D8%A9/", "title": "روسيا تقترح على الصين \"قوة جديدة\"", "summary": "عن تعديل مسار خط أنابيب الغاز \"قوة سيبيريا-2\" إلى الصين، كتبت أولغا ساموفالوفا، في \"فزغلياد\":", "link": "https://arabic.rt.com/press/1828759-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D8%AA%D9%82%D8%AA%D8%B1%D8%AD-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D8%B5%D9%8A%D9%86-%D9%82%D9%88%D8%A9-%D8%AC%D8%AF%D9%8A%D8%AF%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9abfe34c59b71d773144c6.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788661841, "detail": "عن تعديل مسار خط أنابيب الغاز \"قوة سيبيريا-2\" إلى الصين، كتبت أولغا ساموفالوفا، في \"فزغلياد\":\n\nيُغيّر خط أنابيب الغاز \"قوة سيبيريا-2\" المُتجه إلى الصين، والذي لم يُبنَ بعد، اسمه. فقد أعلن وزير الطاقة الروسي سيرغي تسيفيليف أن الرئيس فلاديمير بوتين غير التسمية من \"قوة سيبيريا\" إلى \"قوة بايكال\".\n\nكان يُعرف خط \"قوة سيبيريا 2\" سابقًا باسم \"خط أنابيب غاز ألتاي\". ونجم تغيير الاسم عن تغيير مسار الخط. في البداية، كان من المُخطط إنشاء خط الأنابيب مباشرةً من جمهورية ألتاي إلى الصين، دون المرور بدولة عبور. إلا أن هذا الأمر كان ينطوي على عيب: وصول الغاز الروسي إلى الصين عبر المنطقة نفسها التي يصل إليها غاز آسيا الوسطى، حيث المنافسة شديدة. لذلك، اتُخذ قرار بتغيير نقطة دخول الغاز إلى السوق الصينية إلى موقع أكثر جدوى، عبر منغوليا، وأُعيدت تسمية المشروع إلى \"قوة سيبيريا-2\".\n\nولكن تغيير نقطة دخول الغاز إلى السوق الصينية هذه المرة ليس مطروحًا للنقاش، فالمسار عبر منغوليا لا يزال قائمًا. إنما التعديلات على مسار خط الأنابيب ستجرى داخل الأراضي الروسية بالقرب من بحيرة بايكال، وهو ما استدعى تسميته الجديدة.\n\nوكان الرئيس بوتين قد حدد سابقًا، لـ \"شركة غازبروم\" الهدف التالي: دمج المناطق الغربية والشرقية من البلاد في نظام نقل غاز واحد.\n\nومن المُخطط له أن يمتد خط \"قوة سيبيريا-2\" نحو الشرق، من منطقة تومسك، مرورًا بمدن كراسنويارسك، وسايانسك، وأنغارسك، وإيركوتسك، قبل أن يتصل بخط أنابيب \"قوة سيبيريا-1\" الذي ينطلق من حقل كوفيكتا في منطقة إيركوتسك. وسيُساهم الجزء الروسي من \"قوة سيبيريا-2\"، أو \"قوة بايكال\"، في تزويد المناطق الواقعة جنوبي بحيرة بايكال بالغاز."}, {"guid": "https://arabic.rt.com/press/1828757-%D8%A7%D9%84%D8%AD%D8%B1%D8%A8-%D9%85%D8%B9-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D9%83%D8%B4%D9%81%D8%AA-%D9%86%D9%82%D8%A7%D8%B7-%D8%B6%D8%B9%D9%81-%D8%A7%D9%84%D8%A8%D8%AD%D8%B1%D9%8A%D8%A9-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D8%A9/", "title": "الحرب مع إيران كشفت نقاط ضعف البحرية الأمريكية", "summary": "عن حال البحرية الأمريكية الراهن، كتب ألكسندر تيموخين، في \"فزغلياد\":", "link": "https://arabic.rt.com/press/1828757-%D8%A7%D9%84%D8%AD%D8%B1%D8%A8-%D9%85%D8%B9-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D9%83%D8%B4%D9%81%D8%AA-%D9%86%D9%82%D8%A7%D8%B7-%D8%B6%D8%B9%D9%81-%D8%A7%D9%84%D8%A8%D8%AD%D8%B1%D9%8A%D8%A9-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9abe524c59b7101d277495.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788661815, "detail": "يوم الأربعاء، الثاني من سبتمبر، رست حاملة الطائرات الأمريكية \"أبراهام لينكولن\"، بعد أن غطّاها الصدأ، في ميناء باتايا بتايلاند، وهو أول ميناء ترسو فيه بعد مهمة استمرت ثمانية أشهر. وقد كانت هذه السفينة محور فضيحة بسبب تقارير عن معاناة بحارتها من الجوع والضغط النفسي الشديد، بل ومحاولات انتحار.\n\nوعلى رأس هذه المشاكل فشل الاستراتيجية البحرية الأمريكية. فالولايات المتحدة لا تعرف كيف تستخدم أسطولها في الحرب الكبرى المقبلة، ولا تستطيع تحديد طبيعة هذا الأسطول بدقة. وبالتالي، فهي لا تستطيع التخطيط لتطويره.\n\nالنقاشات حول مستقبل البحرية الأمريكية مفتوحة ومكثّفة، لكن ليس هناك رؤية واضحة حتى الآن. وكان الأميرال آرثر سيبروفسكي، صاحب نظرية الحرب الشبكية، يردد دائمًا: \"إذا لم تصنع مستقبلك بنفسك، ستصبح ضحية للمستقبل الذي يُصنع لك\". والبحرية الأمريكية تعيش حاليًا هذا الوضع تحديدًا. ولهذا السبب، أدت الحرب مع إيران، التي تُرهق البحرية الأمريكية بشكلٍ يُضاهي الحروب السابقة، إلى وضع مشاكل البحرية الأمريكية على طاولة اهتمام الإعلام والتدقيق البرلماني.\n\nلكن لا جدوى من التشفّي. فظهور كل هذه المشاكل في الولايات المتحدة يهيّئ للتغيير. هناك صراعٌ محتدم على السلطة تدور رحاه في الولايات المتحدة، وقد سلّطت شخصيات من الحزب الديمقراطي الضوء على الحوادث التي وقعت على متن حاملة الطائرات الأمريكية \"لينكولن\". والضغط على ترامب قد يؤدي إلى تفاقم هذه المشاكل، رغم أنها كانت موجودة في عهد الديمقراطيين. لكن في واقع المجتمع الأمريكي، يُشير هذا إلى احتمال كبير لتغيير يُمكن تحقيقه بطرائق مُتعددة."}, {"guid": "https://arabic.rt.com/business/1829158-%D8%A7%D9%82%D8%AA%D8%B5%D8%A7%D8%AF%D9%8A-%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A-%D8%A8%D8%B1%D9%8A%D8%B7%D8%A7%D9%86%D9%8A%D8%A7-%D8%AA%D9%81%D8%B1%D8%B6-%D8%A7%D9%84%D8%B6%D8%B1%D8%A7%D8%A6%D8%A8-%D8%B9%D9%84%D9%89-%D9%86%D9%81%D8%B3%D9%87%D8%A7-%D8%AD%D8%AA%D9%89-%D8%A7%D9%84%D9%85%D9%88%D8%AA/", "title": "اقتصادي أمريكي: بريطانيا تجلد نفسها بالضرائب بسبب ضعف النمو والازدهار", "summary": "حذّر الاقتصادي الأمريكي آرثر لافر من أن بريطانيا تفرض الضرائب على نفسها حتى الموت، وسط تراجع ثقة المستثمرين بقدرة الحكومة على إدارة المالية العامة.", "link": "https://arabic.rt.com/business/1829158-%D8%A7%D9%82%D8%AA%D8%B5%D8%A7%D8%AF%D9%8A-%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A-%D8%A8%D8%B1%D9%8A%D8%B7%D8%A7%D9%86%D9%8A%D8%A7-%D8%AA%D9%81%D8%B1%D8%B6-%D8%A7%D9%84%D8%B6%D8%B1%D8%A7%D8%A6%D8%A8-%D8%B9%D9%84%D9%89-%D9%86%D9%81%D8%B3%D9%87%D8%A7-%D8%AD%D8%AA%D9%89-%D8%A7%D9%84%D9%85%D9%88%D8%AA/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c72594c59b757a7594c4e.jpg", "category": "اقتصاد", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788655240, "detail": "حذّر الاقتصادي الأمريكي آرثر لافر من أن بريطانيا تفرض الضرائب على نفسها حتى الموت، وسط تراجع ثقة المستثمرين بقدرة الحكومة على إدارة المالية العامة.\n\nوقال لافر، المستشار السابق لرونالد ريغان وبيل كلينتون ودونالد ترامب، إن الاقتصاد البريطاني دخل في دوامة موت بسبب ضعف النمو والازدهار، مؤكدا أن المشكلة ليست في نقص الإيرادات الضريبية، بل في ضعف النمو الاقتصادي. وأضاف أن رفع الضرائب أكثر لن يؤدي إلا إلى تفاقم الوضع.\n\nوتأتي تحذيرات لافر قبل الموازنة المقبلة، بينما يستعد وزير الخزانة جون هيلي لعرض خطته للنمو. ومن المتوقع أن يؤكد أن دعم الشركات الخاصة وخلق الثروة ضروريان لتحقيق نمو مستدام، مع التشديد في الوقت نفسه على ضرورة الاستقرار المالي ووجود هامش أمان لمواجهة الأزمات.\n\nوأعربت شركة \"Pimco\"، إحدى أكبر مستثمري السندات في العالم، عن قلقها من فقدان بريطانيا المصداقية الاقتصادية والمالية. كما حذر كينيث روغوف، كبير الاقتصاديين السابق في صندوق النقد الدولي، من أن ارتفاع تكاليف الاقتراض جعل بريطانيا من أكثر الاقتصادات المتقدمة عرضة لأزمة ديون، وربما يضطرها سوء الوضع إلى طلب مساعدة صندوق النقد الدولي.\n\nوقد ارتفعت عوائد السندات الحكومية البريطانية لأجل عشر سنوات إلى أعلى مستوى منذ أغسطس 2007، وكانت بريطانيا صاحبة أكبر ارتفاع في تكاليف الاقتراض بين دول مجموعة السبع، وسط مخاوف بشأن المالية العامة والموازنة المقبلة.\n\nويرى اقتصاديون أن الحكومة قد تحتاج إلى مليارات الجنيهات لإعادة بناء هامش الأمان المالي بعد تآكله بفعل ارتفاع عوائد السندات والتضخم.\n\nودعا مستثمرون الحكومة إلى خفض الإنفاق لسد العجز، لكن رئيس الوزراء لم يستبعد زيادة الضرائب أو الاقتراض مجددا. وحذر مسؤولون ماليون من أن الأسواق ستراقب عن كثب خطط الإنفاق والاقتراض وأي إجراءات لمعالجة العجز.\n\nحذر الرئيس الأمريكي دونالد ترامب، من أن بريطانيا على شفا كارثة، معربا عن مخاوفه العميقة بشأن ارتفاع تكاليف الطاقة، وسياسات الحياد الكربوني، وتأثير الهجرة الجماعية على هوية البلاد.\n\nأعلن مكتب رئيس الوزراء البريطاني أن المملكة المتحدة وفرنسا تعتزمان اتخاذ إجراءات إضافية لمحاربة الهجرة غير الشرعية.\n\nسجلت المملكة المتحدة أعلى معدل لمنح حق الإقامة الدائمة للمهاجرين منذ 16 عاما، حيث بلغ عدد الحاصلين على هذا الحق حوالي 200 ألف مهاجر في الفترة من يونيو 2025 إلى يونيو 2026.\n\nأعلن منظم الطاقة البريطاني Ofgem رفع سقف أسعار الطاقة بنسبة 4% اعتبارا من 1 أكتوبر المقبل، في زيادة تدفع تكاليف الكهرباء للأسرة ذات الاستهلاك المعتاد إلى أعلى مستوى في نحو 3 سنوات."}, {"guid": "https://arabic.rt.com/business/1829171-%D9%86%D8%A7%D8%A6%D8%A8%D8%A9-%D8%AA%D8%B1%D9%83%D9%8A%D8%A9-%D8%A3%D8%B2%D9%85%D8%A9-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D9%88%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D8%A7-%D8%AA%D8%B6%D8%BA%D8%B7-%D8%B9%D9%84%D9%89-%D9%82%D8%B7%D8%A7%D8%B9-%D8%A7%D9%84%D8%B3%D9%8A%D8%A7%D8%AD%D8%A9-%D8%A7%D9%84%D8%AA%D8%B1%D9%83%D9%8A/", "title": "نائبة تركية: الحرب بين إيران وأمريكا تضغط على قطاع السياحة التركي", "summary": "قالت النائبة عن حزب المعارضة التركي \"الحزب الجديد\"، سيدا كايا أوسن، إن الحرب بين إيران والولايات المتحدة بدأت تلقي بظلال سلبية على قطاع السياحة في تركيا.", "link": "https://arabic.rt.com/business/1829171-%D9%86%D8%A7%D8%A6%D8%A8%D8%A9-%D8%AA%D8%B1%D9%83%D9%8A%D8%A9-%D8%A3%D8%B2%D9%85%D8%A9-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D9%88%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D8%A7-%D8%AA%D8%B6%D8%BA%D8%B7-%D8%B9%D9%84%D9%89-%D9%82%D8%B7%D8%A7%D8%B9-%D8%A7%D9%84%D8%B3%D9%8A%D8%A7%D8%AD%D8%A9-%D8%A7%D9%84%D8%AA%D8%B1%D9%83%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c7ac44c59b7253727ff45.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788655219, "detail": "قالت النائبة عن حزب المعارضة التركي \"الحزب الجديد\"، سيدا كايا أوسن، إن الحرب بين إيران والولايات المتحدة بدأت تلقي بظلال سلبية على قطاع السياحة في تركيا.\n\nونقلت صحيفة\" تورِزم أجانسه\" عن أوسن قولها إن الأزمة الإقليمية أثرت سلبا على القطاع السياحي، مشيرة إلى أن الحديث عن تحقيق السياحة أرقاما قياسية لم يعد يعكس بصورة دقيقة واقع السوق.\n\nوأضافت أن قطاع السياحة التركي يواجه دائرة من ارتفاع النفقات وضعف الطلب وانخفاض الربحية، ما دفع العديد من الشركات إلى استنزاف رؤوس أموالها أو اللجوء إلى قروض مرتفعة الفائدة لمواصلة أنشطتها.\n\nوحذرت أوسن من أن الأزمات الإقليمية تزيد من حدة المشكلات الهيكلية التي يعاني منها القطاع، معتبرة أن السياحة التركية باتت أمام تحديات متزايدة تهدد قدرتها على الصمود.\n\nوقالت في وصفها للوضع: السفينة السياحية التي ظلت صامدة 50 عاما بكل إيجابياتها وسلبياتها، بدأت المياه تغمرها الآن.\n\nويأتي ذلك في ظل استمرار التوتر بين إيران والولايات المتحدة، بعد تجدد الضربات المتبادلة بين الجانبين عقب اتفاق سابق لوقف الأعمال القتالية، ولا يزال الصراع من دون تسوية، وسط مخاوف من تداعياته على اقتصادات المنطقة وقطاعاتها الحيوية، ومنها السياحة.\n\nفرضت الولايات المتحدة، الجمعة، عقوبات استهدفت ثلاث كيانات تتخذ من تركيا مقرا لها، في أحدث تحرك لإدارة الرئيس دونالد ترامب لتشديد الضغوط الاقتصادية على طهران وملاحقة شبكاتها المالية\n\nأعلن وزير التجارة التركي عمر بولاط، اليوم الخميس، ارتفاع صادرات بلاده في أغسطس 8.1% على أساس سنوي إلى 23.5 مليار دولار، مسجلة أعلى مستوى لشهر أغسطس في تاريخ تركيا.\n\nتراجعت الصادرات الروسية من القمح إلى تركيا في يوليو الماضي بنحو الثلثين إلى أدنى مستوياتها في 12 شهرا، وفقا لبيانات هيئة الإحصاء التركية.\n\nأكد الرئيس الروسي فلاديمير بوتين أن تركيا تعد من الشركاء المميزين لروسيا في السياسة الخارجية و على الصعيد الاقتصادي لافتا إلى أن مستوى التعاون الاقتصادي بين البلدين لا يزال مرتفعا."}, {"guid": "https://arabic.rt.com/middle_east/1829184-%D8%A7%D9%84%D8%B5%D9%82%D9%88%D8%B1-%D8%A7%D9%84%D8%B3%D8%B9%D9%88%D8%AF%D9%8A%D8%A9-%D8%AA%D8%B8%D9%87%D8%B1-%D9%81%D9%8A-%D9%85%D8%B5%D8%B1-%D9%84%D9%84%D9%85%D8%B1%D8%A9-%D8%A7%D9%84%D8%A3%D9%88%D9%84%D9%89-%D9%88%D8%AA%D8%AB%D9%8A%D8%B1-%D8%AA%D9%81%D8%A7%D8%B9%D9%84%D8%A7/", "title": "\"الصقور السعودية\" تظهر في مصر للمرة الأولى وتثير تفاعلا", "summary": "أعلنت وزارة الدفاع السعودية، مشاركة فريق \"الصقور السعودية\" في معرض العلمين الدولي للطيران والفضاء بجمهورية مصر العربية.", "link": "https://arabic.rt.com/middle_east/1829184-%D8%A7%D9%84%D8%B5%D9%82%D9%88%D8%B1-%D8%A7%D9%84%D8%B3%D8%B9%D9%88%D8%AF%D9%8A%D8%A9-%D8%AA%D8%B8%D9%87%D8%B1-%D9%81%D9%8A-%D9%85%D8%B5%D8%B1-%D9%84%D9%84%D9%85%D8%B1%D8%A9-%D8%A7%D9%84%D8%A3%D9%88%D9%84%D9%89-%D9%88%D8%AA%D8%AB%D9%8A%D8%B1-%D8%AA%D9%81%D8%A7%D8%B9%D9%84%D8%A7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c8ba0423604713e6c32e2.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788655202, "detail": "أعلنت وزارة الدفاع السعودية، مشاركة فريق \"الصقور السعودية\" في معرض العلمين الدولي للطيران والفضاء بجمهورية مصر العربية.\n\nونشر حساب فريق الصقور على منصة \"إكس\" صورا تظهر رحلته في الأجواء المصرية بداية من دخول شبه جزيرة سيناء، مرورا بنهر النيل مستخدمة الدخان الملون بالأبيض والأخضر، وأثارت هذه الصور تفاعلا بين المدونين، وسط احتفاء بالمشاركة السعودية.\n\nمعرض العلمين.. خبراء يفسرون اختيار روسيا مصر لاستعراض قدراتها العسكرية الأحدث ونشر فريق الصقور السعودية، فيديو لرحلته من المملكة إلى مصر وعلق: \"مشاهد من رحلة الصقور السعودية إلى جمهورية مصر العربية الشقيقة، مرورا بخليج العقبة ونهر النيل، للمشاركة في معرض العلمين الدولي للطيران 2026\".\n\nجانب من مغادرة فريق الصقور السعودية إلى جمهورية مصر الشقيقة، للمشاركة في معرض العلمين الدولي للطيران، حيث حظي الفريق بتوديع سعادة قائد جناح الطيران السابع، العميد الطيار الركن عبدالرحمن الشهري، في مشهد يجسّد الدعم والاعتزاز . pic.twitter.com/ChotGQSvgk\n\nوتعد هذه أولى المشاركات الخارجية للفريق بالهوية الجديدة، بطائرة Hawk T-165.\n\nومن المقرر أن ينفذ الفريق استعراضا جويا في معرض العلمين الدولي للطيران والفضاء، والذي سينطلق يوم الثلاثاء المقبل.\n\nأولى المشاركات الخارجية بالهوية الجديدة، بطائرة Hawk T-165. الصقور السعودية إلى معرض العلمين الدولي للطيران والفضاء. First international appearance with the new identity, flying the Hawk T-165. The Saudi Hawks at the El Alamein International Airshow. pic.twitter.com/WC6RlUjhsy\n\nوكان الفريق قد نفذ أول عرض جوي بطائرات T-165 في فبراير 2026 خلال معرض الدفاع العالمي الذي أقيم في الرياض.\n\nوكتب أحد المعلقين: \"شيء جميل مشاركة دول عربية فيما بينها في المعارض.. نرى فريق الصقور في السعودية ينطلق نحو مصر للمشاركة في معرض العلمين\".\n\nشيء جميل مشاركة دول عربية فيما بينها في المعارض نرى فريق الصقور في #السعودية 🇸🇦 ينطلق نحو #مصر 🇪🇬 للمشاركة في معرض العلمين El Alamein الذي سيبدأ 08 سبتمبر يطيرون بطائرات Hawk، يتكون الفريق من طيارين مقاتلات حربية يتم إختيارهم للمشاركة في هذه المناسبات pic.twitter.com/MZr8tqJvOo\n\nفيما علق آخر: \"مشاهد مهيبة من رحلة الصقور السعودية إلى جمهورية مصر العربية للمشاركة في معرض العلمين الدولي للطيران 2026. لقطات من تحليق الصقور فوق خليج العقبة ونهر النيل، في طريقها لتقديم عروضها الجوية والمشاركة في هذا الحدث الدولي\".\n\nمشاهد مهيبة من رحلة #الصقور_السعودية 🇸🇦 إلى جمهورية مصر العربية 🇪🇬 للمشاركة في معرض العلمين الدولي للطيران 2026. لقطات من تحليق الصقور فوق خليج العقبة ونهر النيل، في طريقها لتقديم عروضها الجوية والمشاركة في هذا الحدث الدولي. ✈️ وهنا لقطات لفيديو سابق في مصر سبتمبر 2024 pic.twitter.com/qVgUcYDXz1\n\nتكتسب المشاركة الروسية في معرض العلمين للطيران والفضاء في مصر أهمية تتجاوز مجرد استعراض أحدث المنتجات العسكرية والتكنولوجية، في ظل التطورات الدولية الراهنة.\n\nتلقى الرئيس المصري عبد الفتاح السيسي، اليوم، اتصالا هاتفيا من الأمير محمد بن سلمان، ولي عهد المملكة العربية السعودية ورئيس مجلس الوزراء.\n\nأكد وزير الخارجية المصري بدر عبد العاطي أن العلاقات المصرية السعودية والخليجية علاقات أبدية وتاريخية.\n\nأعلنت مصر تنظيم النسخة الثانية من معرض العلمين الدولي للطيران والفضاء (EIAS 2026) خلال الفترة من 8 إلى 10 سبتمبر بمطار العلمين الدولي تحت رعاية رئيس الجمهورية عبد الفتاح السيسي."}, {"guid": "https://arabic.rt.com/world/1829192-%D8%A7%D9%84%D8%A8%D9%8A%D8%AA-%D8%A7%D9%84%D8%A3%D8%A8%D9%8A%D8%B6-%D9%8A%D9%83%D8%B4%D9%81-%D8%B7%D8%A8%D9%8A%D8%B9%D8%A9-%D8%A7%D9%84%D8%B9%D9%85%D9%84%D8%A9-%D8%A7%D9%84%D8%AA%D9%8A-%D8%AA%D8%B1%D9%83%D9%87%D8%A7-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%81%D9%8A-%D8%A3%D8%AD%D8%AF-%D9%85%D8%B7%D8%A7%D8%B9%D9%85-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D8%B5%D9%88%D8%B1/", "title": "البيت الأبيض يكشف نوع العملة التي تركها ويتكوف في أحد مطاعم موسكو (صور)", "summary": "أفاد مصدر في متجر هدايا البيت الأبيض أن العملة التي تركها المبعوث الأمريكي الخاص ستيف ويتكوف في أحد مطاعم موسكو ليست مخصصة للبيع، بل هي قطعة تذكارية شخصية.", "link": "https://arabic.rt.com/world/1829192-%D8%A7%D9%84%D8%A8%D9%8A%D8%AA-%D8%A7%D9%84%D8%A3%D8%A8%D9%8A%D8%B6-%D9%8A%D9%83%D8%B4%D9%81-%D8%B7%D8%A8%D9%8A%D8%B9%D8%A9-%D8%A7%D9%84%D8%B9%D9%85%D9%84%D8%A9-%D8%A7%D9%84%D8%AA%D9%8A-%D8%AA%D8%B1%D9%83%D9%87%D8%A7-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%81%D9%8A-%D8%A3%D8%AD%D8%AF-%D9%85%D8%B7%D8%A7%D8%B9%D9%85-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D8%B5%D9%88%D8%B1/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c9a0142360471d71bd49d.jpg", "category": "اقتصاد", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788655174, "detail": "أفاد مصدر في متجر هدايا البيت الأبيض أن العملة التي تركها المبعوث الأمريكي الخاص ستيف ويتكوف في أحد مطاعم موسكو ليست مخصصة للبيع، بل هي قطعة تذكارية شخصية.\n\nوأفاد المتجر الرسمي بأن العملة \"تبدو كأنها ميدالية تذكارية، تُمنح تقديرا للخدمة أو لإحياء ذكرى أحداث هامة، وهي غير ممخصصة للبيع\".\n\nوأوضح المصدر أن تشكيلة عملات المتجر تشمل عملات تذكارية تكريما للرئيس هاري ترومان، وميداليات مخصصة للبيت الأبيض نفسه، ومركبات استخدمها كبار المسؤولين.\n\nوأشار المتجر إلى أن تقليد العملات أو الميداليات التذكارية نشأ في القوات المسلحة الأمريكية، حيث كانت تُمنح كدليل على الانتماء إلى وحدة معينة أو لإحياء ذكرى أحداث هامة.\n\nوأكد المتجر أن هذه الميدالية تحديدا لم تكن موجودة لديه مطلقا.\n\nصرح مساعد الرئيس الروسي يوري أوشاكوف بأن المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، أجريا استعدادات جادة لزيارتهما إلى موسكو.\n\nشكر المبعوث الأمريكي الخاص ستيف ويتكوف الرئيس الروسي فلاديمير بوتين على تسليم الولايات المتحدة المدان السابق في مشاة البحرية الأمريكية روبرت غيلمان.\n\nوجه المبعوث الخاص للرئيس الأمريكي ستيف ويتكوف الشكر إلى الرئيس الروسي فلاديمير بوتين على وقف الضربات لمدة ثلاثة أيام لإجراء المفاوضات، وذلك خلال لقائهما مساء السبت في الكرملين.\n\nقال المبعوث الأمريكي الخاص ستيف ويتكوف، في الكرملين اليوم، إنه يعتبر حواره مع الرئيس الروسي فلاديمير بوتين، أكثر المحطات رسوخا في الذاكرة."}, {"guid": "https://arabic.rt.com/world/1829198-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%88%D9%83%D9%88%D8%B4%D9%86%D8%B1-%D9%8A%D8%B5%D9%84%D8%A7%D9%86-%D8%A5%D9%84%D9%89-%D9%85%D8%AF%D9%8A%D9%86%D8%A9-%D8%AC%D9%8A%D8%B4%D9%88%D9%81-%D8%A7%D9%84%D8%A8%D9%88%D9%84%D9%86%D8%AF%D9%8A%D8%A9-%D9%81%D9%8A-%D8%B7%D8%B1%D9%8A%D9%82%D9%87%D9%85%D8%A7-%D8%A5%D9%84%D9%89-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7/", "title": "ويتكوف وكوشنر يصلان مدينة جيشوف البولندية في طريقهما إلى أوكرانيا", "summary": "وصل المبعوثان الأمريكيان ستيف ويتكوف وجاريد كوشنر، إلى مطار مدينة جيشوف البولندية، ومن المقرر متابعة طريقهما إلى العاصمة الأوكرانية كييف اليوم.", "link": "https://arabic.rt.com/world/1829198-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%88%D9%83%D9%88%D8%B4%D9%86%D8%B1-%D9%8A%D8%B5%D9%84%D8%A7%D9%86-%D8%A5%D9%84%D9%89-%D9%85%D8%AF%D9%8A%D9%86%D8%A9-%D8%AC%D9%8A%D8%B4%D9%88%D9%81-%D8%A7%D9%84%D8%A8%D9%88%D9%84%D9%86%D8%AF%D9%8A%D8%A9-%D9%81%D9%8A-%D8%B7%D8%B1%D9%8A%D9%82%D9%87%D9%85%D8%A7-%D8%A5%D9%84%D9%89-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9cb32c4c59b758277c31b1.png", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788655142, "detail": "وصل المبعوثان الأمريكيان ستيف ويتكوف وجاريد كوشنر، إلى مطار مدينة جيشوف البولندية، ومن المقرر متابعة طريقهما إلى العاصمة الأوكرانية كييف اليوم.\n\nوهبطت الطائرة التي تقل المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، في مطار جيشوف في بولندا التي تبعد نحو 100 كيلومتر فقط عن الحدود الأوكرانية، وفقا لبيانات الرحلة التي راجعتها وكالة \"نوفوستي\".\n\nأوشاكوف: ويتكوف وكوشنر أجريا استعدادات جادة لزيارتهما إلى موسكو وبحسب موقع \"فلايت رادار\"، هبطت طائرة بوينغ C-32A في المطار البولندي في حوالي الساعة 02:30 بتوقيت موسكو، وفي وقت سابق، حوالي الساعة 00:30، أقلعت الطائرة من مطار فنوكوفو في العاصمة الروسية.\n\nوسيتوجه ويتكوف وكوشنر، إلى كييف، في أول زيارة لهما إلى العاصمة الأوكرانية منذ عودة ترامب إلى البيت الأبيض العام الماضي.\n\nوكان الرئيس الروسي فلاديمير بوتين قد التقى بالمبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، واستقبلهما في الكرملين، وأشاد بوتين بدور المفاوضين الأمريكيين، شاكرا نظيره الأمريكي دونالد ترامب على جهوده في مسار حل الأزمة الأوكرانية.\n\nواستمرت المحادثات ثلاث ساعات وعشر دقائق، وأكد مساعد الرئيس الروسي يوري أوشاكوف، أنها كانت \"مثمرة وبناءة وصريحة للغاية\".\n\nأفاد مساعد الرئيس الروسي يوري أوشاكوف، بأن الرئيس فلاديمير بوتين، أكد خلال اجتماع مع المبعوثين ستيف ويتكوف وجاريد كوشنر، على ضرورة معالجة جميع الأسباب الجذرية للصراع الأوكراني.\n\nصرح مساعد الرئيس الروسي يوري أوشاكوف بأن المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، أجريا استعدادات جادة لزيارتهما إلى موسكو.\n\nوصف المدير الأسبق لوكالة الاستخبارات المركزية الأمريكية، الجنرال المتقاعد ديفيد بتريوس، النزاع في أوكرانيا بأنه \"أبرز مختبر عسكري\" سيحدد طبيعة العمليات القتالية في القرن الـ 21.\n\nدعا العسكري ألكسندر تودوروف، من القوات الأوكرانية، المواطنين الأوكرانيين إلى الاحتجاج أمام مكتب فلاديمير زيلينسكي في كييف ضد حكومته التي \"تدمر شعبها\".\n\nدعت عضو البرلمان الأوكراني، سولوميا بوبروفسكا، مواطني بلادها إلى الاستعداد لشتاء قارس، ونصحت سكان كييف بمغادرة العاصمة، والتزوّد بحطب التدفئة.\n\nصرّح الرئيس فلاديمير بوتين في اجتماع مع المفاوضين الأمريكيين، بأن روسيا لم تتفق مع أوكرانيا على وقف إطلاق نار أوسع نطاقا لمدة ثلاثة أيام لوقف الهجمات على العاصمتين.\n\nشكر المبعوث الأمريكي الخاص ستيف ويتكوف الرئيس الروسي فلاديمير بوتين على تسليم الولايات المتحدة المدان السابق في مشاة البحرية الأمريكية روبرت غيلمان.\n\nقال الرئيس السلوفاكي بيتر بيليغريني إن الاتحاد الأوروبي ليس في أفضل حالاته في الوقت الحالي، وبات يحتاج إلى معالجة عدد من القضايا لإثبات قدرته على البقاء والاستمرار.\n\nوجه المبعوث الخاص للرئيس الأمريكي ستيف ويتكوف الشكر إلى الرئيس الروسي فلاديمير بوتين على وقف الضربات لمدة ثلاثة أيام لإجراء المفاوضات، وذلك خلال لقائهما مساء السبت في الكرملين.\n\nأكد الرئيس الروسي فلاديمير بوتين أن موسكو ستبذل قصارى جهدها لضمان أمن المفاوضين الأمريكيين في موسكو، وذلك خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر.\n\nقال المبعوث الأمريكي الخاص ستيف ويتكوف، في الكرملين اليوم، إنه يعتبر حواره مع الرئيس الروسي فلاديمير بوتين، أكثر المحطات رسوخا في الذاكرة.\n\nأعلن الرئيس الروسي فلاديمير بوتين مناقشة \"جميع مكونات وجوانب\" النزاع الأوكراني خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، في الاجتماع السادس من نوعه معهما.\n\nأمضى المبعوثان الأمريكيان ستيف ويتكوف وجاريد كوشنر مع الممثل الخاص للرئيس الروسي كيريل دميترييف أكثر من ثلاث ساعات في غداء عمل بمطعم \"كل شيء من أجل النصر\" في موسكو.\n\nشارك مساعد الرئيس الروسي يوري أوشاكوف والمبعوث الخاص للتعاون الاستثماري والاقتصادي كيريل دميترييف في لقاء الرئيس فلاديمير بوتين مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر.\n\nحذر سفير الولايات المتحدة لدى \"الناتو\"، ماثيو ويتاكر، الدول الأعضاء في الحلف من عدم التسامح مع الأعمال المتعمدة في إطار الحرب الهجينة، مؤكدا أن واشنطن ستقف إلى جانب الدول المعنية.\n\nتفاعل قرّاء صحيفة دي فيلت الألمانية بشكل قوي وحيوي مع التصريحات التي أدلى بها الرئيس الأمريكي دونالد ترامب بالأمس عن نظيره الروسي فلاديمير بوتين.\n\nصرح وزير الخارجية الروسي سيرغي لافروف، اليوم السبت، بأنه يتم بذل كل ما يلزم لضمان أمن روسيا واستعادة حقوق الشعب الروسي في دونباس ونوفوروسيا.\n\nأعلن المتحدث باسم الكرملين دميتري بيسكوف أن الرئيس الروسي فلاديمير بوتين أصدر أمرا بعدم شن أي غارات على العاصمة الأوكرانية كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة.\n\nأكد وزير المالية الروسي أنطون سيلوانوف وجود نقاط مشتركة بين روسيا والولايات المتحدة في القضايا المالية، ودعا إلى مناقشتها والوقوف عليها.\n\nكشف المكتب الوطني لمكافحة الفساد في أوكرانيا تورط مسؤول في مكتب المدعي العام في حماية مراكز اتصال احتيالية وغسل 42 مليون غريفنيا أي نحو 941 ألف دولار.\n\nوصل المبعوثان الأمريكيان ستيف ويتكوف وجاريد كوشنر إلى العاصمة الروسية موسكو لإجراء مباحثات حول إنهاء النزاع في أوكرانيا.\n\nذكرت مجلة \"Responsible Statecraft\" أن المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر يعتزمان زيارة موسكو وكييف نهاية الأسبوع في محاولة لإحياء المفاوضات لإنهاء النزاع في أوكرانيا.\n\nأكد نائب وزير خارجية روسيا سيرغي ريابكوف أنه ينبغي للإدارة الأمريكية أن تأخذ في الحسبان الحقائق على الأرض في التسوية الأوكرانية، مشيرا إلى أن الوضع يسير نحو الأسوأ بالنسبة لكييف."}, {"guid": "https://arabic.rt.com/middle_east/1829197-%D9%82%D9%88%D9%89-%D8%B9%D8%B1%D8%A7%D9%82%D9%8A%D8%A9-%D8%AA%D8%AD%D8%B0%D8%B1-%D9%85%D9%86-%D8%B8%D8%B1%D9%81-%D9%85%D8%A7%D9%84%D9%8A-%D8%B5%D8%B9%D8%A8-%D9%8A%D9%85%D8%B1-%D8%A8%D9%87-%D8%A7%D9%84%D8%A8%D9%84%D8%A7%D8%AF/", "title": "قوى عراقية تحذر من ظرف مالي صعب تمر به البلاد", "summary": "دعت القوى السياسية في العراق فجر اليوم الأحد إلى توحيد الموقف الوطني والحفاظ على استقرار العراق وسيادته ومصالحه العليا.", "link": "https://arabic.rt.com/middle_east/1829197-%D9%82%D9%88%D9%89-%D8%B9%D8%B1%D8%A7%D9%82%D9%8A%D8%A9-%D8%AA%D8%AD%D8%B0%D8%B1-%D9%85%D9%86-%D8%B8%D8%B1%D9%81-%D9%85%D8%A7%D9%84%D9%8A-%D8%B5%D8%B9%D8%A8-%D9%8A%D9%85%D8%B1-%D8%A8%D9%87-%D8%A7%D9%84%D8%A8%D9%84%D8%A7%D8%AF/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9cb0a84c59b757be332ff5.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788654896, "detail": "دعت القوى السياسية في العراق فجر اليوم الأحد إلى توحيد الموقف الوطني والحفاظ على استقرار العراق وسيادته ومصالحه العليا.\n\nوأكد بيان للحكومة العراقية في ختام اجتماع لائتلاف إدارة الدولة في القصر الحكومي بحضور رئيس الحكومة علي فالح الزيدي لبحث الملفات الاقتصادية والسياسية والتشريعية \"على ضرورة تجنيب العراق انعكاسات العقوبات الأمريكية التي تُفرض على بعض الدول حيث يمر العراق بظرف مالي صعب لا يحتمل المجازفة\".\n\nوجدد المجتمعون دعم خطوات الحكومة العراقية في حملة مكافحة الفساد وملاحقة الفاسدين، وإجراءات السلطة القضائية في هذا الشأن وفق القانون وإجراءات الحكومة الخاصة بمكافحة الفساد والإصلاح المؤسسي، ومشروع قانون هيئة الرقابة الداخلية الاتحادية، فضلا عن القوانين المهمة التي تحتاجها الحكومة لتنفيذ برامجها\".\n\nأعلنت وزارة الهجرة والمهجرين العراقية، اليوم السبت، قرب إغلاق مخيم الهول في شمال شرقي سوريا بشكل كامل، بعد إعادة أعداد كبيرة من النازحين العراقيين إلى مناطقهم.\n\nباتت قوافل ضخمة من الشاحنات والصهاريج المحملة بالنفط تجوب الطرقات الصحراوية السورية، في مشهد يعكس تحولاً استراتيجياً في خريطة تدفق الطاقة بالمنطقة.\n\nيجتمع وزراء الخارجية العرب في القاهرة الاثنين المقبل، خلال أعمال الدورة الـ166 لمجلس جامعة الدول العربية على المستوى الوزاري، لبحث تطورات المنطقة وعدد من القضايا العربية."}, {"guid": "https://arabic.rt.com/world/1829196-%D8%A3%D9%88%D8%B4%D8%A7%D9%83%D9%88%D9%81-%D8%B3%D9%8A%D9%88%D8%A7%D8%B5%D9%84-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%88%D8%AA%D8%B1%D8%A7%D9%85%D8%A8-%D8%A7%D9%84%D8%AD%D9%81%D8%A7%D8%B8-%D8%B9%D9%84%D9%89-%D8%A7%D8%AA%D8%B5%D8%A7%D9%84%D8%A7%D8%AA-%D8%B4%D8%AE%D8%B5%D9%8A%D8%A9/", "title": "أوشاكوف: بوتين وترامب سيواصلان الحفاظ على اتصالات شخصية", "summary": "أكد الرئيس الروسي فلاديمير بوتين خلال لقائه المبعوثين الأمريكيين الخاصين ستيف ويتكوف وجاريد كوشنر، استمرار زعيمي روسيا والولايات المتحدة الحفاظ على اتصالاتهما الشخصية.", "link": "https://arabic.rt.com/world/1829196-%D8%A3%D9%88%D8%B4%D8%A7%D9%83%D9%88%D9%81-%D8%B3%D9%8A%D9%88%D8%A7%D8%B5%D9%84-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%88%D8%AA%D8%B1%D8%A7%D9%85%D8%A8-%D8%A7%D9%84%D8%AD%D9%81%D8%A7%D8%B8-%D8%B9%D9%84%D9%89-%D8%A7%D8%AA%D8%B5%D8%A7%D9%84%D8%A7%D8%AA-%D8%B4%D8%AE%D8%B5%D9%8A%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9cb06b4c59b758277c31af.jpeg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788654614, "detail": "أكد الرئيس الروسي فلاديمير بوتين خلال لقائه المبعوثين الأمريكيين الخاصين ستيف ويتكوف وجاريد كوشنر، استمرار زعيمي روسيا والولايات المتحدة الحفاظ على اتصالاتهما الشخصية.\n\nجاء ذلك في تصريحات لمساعد الرئيس الروسي، يوري أوشاكوف، الذي قال للصحافة عقب اللقاء: \"تم التأكيد على أن رئيسي البلدين (روسيا والولايات المتحدة) سيواصلان الحفاظ على الاتصالات الشخصية\".\n\nوجرى اللقاء، الذي استمر نحو ثلاث ساعات، مساء السبت في الكرملين، حيث بحث الجانبان خيارات التسوية في أوكرانيا وملفات التعاون المشترك. ووصف أوشاكوف المحادثات بأنها كانت \"جوهرية وبناءة وصريحة للغاية\"، وأشار إلى أن المبعوثين الأمريكيين استعدا جيدا للزيارة وطرحا عددا من الأفكار المتعلقة بإنهاء النزاع.\n\nوأوضح مساعد الرئيس الروسي أن المبعوثين وعدا بنقل تقييمات بوتين بشأن هذه الخيارات خلال اجتماعاتهما المقررة في كييف غدا. وكان الرئيس الأمريكي دونالد ترامب قد صرح في وقت سابق بأن المبعوثين يحملان مقترحات لإنهاء النزاع، ووصفهما بأنهما \"مفاوضان بارعان\".\n\nوشهد اللقاء، الذي حضره الممثل الخاص للرئيس الروسي للتعاون الاستثماري كيريل دميترييف، مناقشة مشاريع روسية-أمريكية كبرى محتملة إلى جانب الملف الأوكراني. وكان ويتكوف قد أشاد في مستهل الاجتماع بقرار بوتين وقف الضربات على كييف لمدة ثلاثة أيام لتأمين أجواء المفاوضات.\n\nوتأتي هذه التطورات بعد أكثر من 12 اتصالا هاتفيا بين بوتين وترامب منذ عودة الأخير إلى البيت الأبيض، مما يعكس وتيرة عالية من التواصل بين الجانبين رغم استمرار النزاع في أوكرانيا.\n\nأفاد مساعد الرئيس الروسي يوري أوشاكوف، بأن الرئيس فلاديمير بوتين، أكد خلال اجتماع مع المبعوثين ستيف ويتكوف وجاريد كوشنر، على ضرورة معالجة جميع الأسباب الجذرية للصراع الأوكراني.\n\nصرح مساعد الرئيس الروسي يوري أوشاكوف بأن المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، أجريا استعدادات جادة لزيارتهما إلى موسكو.\n\nصرّح الرئيس فلاديمير بوتين في اجتماع مع المفاوضين الأمريكيين، بأن روسيا لم تتفق مع أوكرانيا على وقف إطلاق نار أوسع نطاقا لمدة ثلاثة أيام لوقف الهجمات على العاصمتين.\n\nوجه المبعوث الخاص للرئيس الأمريكي ستيف ويتكوف الشكر إلى الرئيس الروسي فلاديمير بوتين على وقف الضربات لمدة ثلاثة أيام لإجراء المفاوضات، وذلك خلال لقائهما مساء السبت في الكرملين.\n\nأكد الرئيس الروسي فلاديمير بوتين أن موسكو ستبذل قصارى جهدها لضمان أمن المفاوضين الأمريكيين في موسكو، وذلك خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر.\n\nقال المبعوث الأمريكي الخاص ستيف ويتكوف، في الكرملين اليوم، إنه يعتبر حواره مع الرئيس الروسي فلاديمير بوتين، أكثر المحطات رسوخا في الذاكرة.\n\nأعلن الرئيس الروسي فلاديمير بوتين مناقشة \"جميع مكونات وجوانب\" النزاع الأوكراني خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، في الاجتماع السادس من نوعه معهما.\n\nشارك مساعد الرئيس الروسي يوري أوشاكوف والمبعوث الخاص للتعاون الاستثماري والاقتصادي كيريل دميترييف في لقاء الرئيس فلاديمير بوتين مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر."}, {"guid": "https://arabic.rt.com/world/1829195-%D8%A3%D9%88%D8%B4%D8%A7%D9%83%D9%88%D9%81-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%8A%D8%A4%D9%83%D8%AF-%D8%B9%D9%84%D9%89-%D8%B6%D8%B1%D9%88%D8%B1%D8%A9-%D9%85%D8%B9%D8%A7%D9%84%D8%AC%D8%A9-%D8%A7%D9%84%D8%A3%D8%B3%D8%A8%D8%A7%D8%A8-%D8%A7%D9%84%D8%AC%D8%B0%D8%B1%D9%8A%D8%A9-%D9%84%D9%84%D8%B5%D8%B1%D8%A7%D8%B9-%D9%81%D9%8A-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7/", "title": "بوتين يؤكد على ضرورة معالجة الأسباب الجذرية للصراع في أوكرانيا", "summary": "أفاد مساعد الرئيس الروسي يوري أوشاكوف، بأن الرئيس فلاديمير بوتين، أكد خلال اجتماع مع المبعوثين ستيف ويتكوف وجاريد كوشنر، على ضرورة معالجة جميع الأسباب الجذرية للصراع الأوكراني.", "link": "https://arabic.rt.com/world/1829195-%D8%A3%D9%88%D8%B4%D8%A7%D9%83%D9%88%D9%81-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%8A%D8%A4%D9%83%D8%AF-%D8%B9%D9%84%D9%89-%D8%B6%D8%B1%D9%88%D8%B1%D8%A9-%D9%85%D8%B9%D8%A7%D9%84%D8%AC%D8%A9-%D8%A7%D9%84%D8%A3%D8%B3%D8%A8%D8%A7%D8%A8-%D8%A7%D9%84%D8%AC%D8%B0%D8%B1%D9%8A%D8%A9-%D9%84%D9%84%D8%B5%D8%B1%D8%A7%D8%B9-%D9%81%D9%8A-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9ca7ad423604722e40ab89.png", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788652154, "detail": "أفاد مساعد الرئيس الروسي يوري أوشاكوف، بأن الرئيس فلاديمير بوتين، أكد خلال اجتماع مع المبعوثين ستيف ويتكوف وجاريد كوشنر، على ضرورة معالجة جميع الأسباب الجذرية للصراع الأوكراني.\n\nوأوضح أوشاكوف، للصحفيين أن الجانب الروسي قدم تقييمات واضحة وشاملة للوضع الذي تطور خلال العملية العسكرية الخاصة، فيما قدم ويتكوف وكوشنر مقترحاتهما لتسوية الأزمة الأوكرانية.\n\nوقال أوشاكوف: \"على وجه الخصوص، تم التنويه بالنجاحات الحقيقية للجيش الروسي في التقدم، وتم التعبير عن الثقة في تحقيق الأهداف المحددة، وبالطبع تم التأكيد على ضرورة القضاء على جميع الأسباب الجذرية للصراع\" .\n\nوأضاف أوشاكوف، أن الرئيس فلاديمير بوتين أكد خلال محادثاته مع ستيف ويتكوف وجاريد كوشنر عزمه مواصلة الحوار البناء مع الولايات المتحدة بشأن التسوية الأوكرانية، مشيرا إلى أن الجانبين أكدا استمرار الاتصالات الشخصية بين الرئيسين الروسي والأمريكي.\n\nوالتقى الرئيس الروسي فلاديمير بوتين بالمبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، واستقبلهما في الكرملين، وأشاد بوتين بدور المفاوضين الأمريكيين، شاكرا نظيره الأمريكي دونالد ترامب على جهوده في مسار حل الأزمة الأوكرانية.\n\nواستمرت المحادثات ثلاث ساعات وعشر دقائق، وأكد أوشاكوف أنها كانت \"مثمرة وبناءة وصريحة للغاية\".\n\nأكد الرئيس الروسي فلاديمير بوتين خلال لقائه المبعوثين الأمريكيين الخاصين ستيف ويتكوف وجاريد كوشنر، استمرار زعيمي روسيا والولايات المتحدة الحفاظ على اتصالاتهما الشخصية.\n\nصرح مساعد الرئيس الروسي يوري أوشاكوف بأن المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، أجريا استعدادات جادة لزيارتهما إلى موسكو.\n\nدعا العسكري ألكسندر تودوروف، من القوات الأوكرانية، المواطنين الأوكرانيين إلى الاحتجاج أمام مكتب فلاديمير زيلينسكي في كييف ضد حكومته التي \"تدمر شعبها\".\n\nكشفت صحيفة \"الغارديان\" عن قلق واسع يساور المخططين العسكريين في حلف \"الناتو\" إزاء سيناريو محتمل لحرب أوروبية طويلة الأمد مع روسيا، وسط عدم استعداد دول الاتحاد لعمليات قتالية واسعة.\n\nصرّح الرئيس فلاديمير بوتين في اجتماع مع المفاوضين الأمريكيين، بأن روسيا لم تتفق مع أوكرانيا على وقف إطلاق نار أوسع نطاقا لمدة ثلاثة أيام لوقف الهجمات على العاصمتين.\n\nشكر المبعوث الأمريكي الخاص ستيف ويتكوف الرئيس الروسي فلاديمير بوتين على تسليم الولايات المتحدة المدان السابق في مشاة البحرية الأمريكية روبرت غيلمان.\n\nوجه المبعوث الخاص للرئيس الأمريكي ستيف ويتكوف الشكر إلى الرئيس الروسي فلاديمير بوتين على وقف الضربات لمدة ثلاثة أيام لإجراء المفاوضات، وذلك خلال لقائهما مساء السبت في الكرملين.\n\nأكد الرئيس الروسي فلاديمير بوتين أن موسكو ستبذل قصارى جهدها لضمان أمن المفاوضين الأمريكيين في موسكو، وذلك خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر.\n\nقال المبعوث الأمريكي الخاص ستيف ويتكوف، في الكرملين اليوم، إنه يعتبر حواره مع الرئيس الروسي فلاديمير بوتين، أكثر المحطات رسوخا في الذاكرة.\n\nأمضى المبعوثان الأمريكيان ستيف ويتكوف وجاريد كوشنر مع الممثل الخاص للرئيس الروسي كيريل دميترييف أكثر من ثلاث ساعات في غداء عمل بمطعم \"كل شيء من أجل النصر\" في موسكو.\n\nيلتقي الرئيس الروسي فلاديمير بوتين اليوم بالمبعوث الأمريكي الخاص ستيف ويتكوف في روسيا للمرة السادسة."}, {"guid": "https://arabic.rt.com/middle_east/1829194-%D8%A7%D9%84%D9%82%D8%A8%D8%B6-%D8%B9%D9%84%D9%89-%D8%AE%D9%84%D9%8A%D8%A9-%D8%AA%D8%AE%D8%B1%D9%8A%D8%A8%D9%8A%D8%A9-%D9%85%D8%AA%D9%88%D8%B1%D8%B7%D8%A9-%D8%A8%D9%87%D8%AC%D9%85%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%B3%D9%8A%D8%B1%D8%A7%D8%AA-%D8%B9%D9%84%D9%89-%D9%85%D9%86%D8%B4%D8%A2%D8%AA-%D8%A7%D9%84%D9%86%D9%81%D8%B7-%D9%88%D8%A7%D9%84%D9%83%D9%87%D8%B1%D8%A8%D8%A7%D8%A1-%D9%81%D9%8A-%D9%84%D9%8A%D8%A8%D9%8A%D8%A7/", "title": "القبض على خلية تخريبية متورطة بهجمات المسيّرات على منشآت النفط والكهرباء في ليبيا", "summary": "أكد مصدر بوزارة الدفاع بحكومة الوحدة الوطنية لـ RT، إلقاء القبض على خلية تخريبية تضم ليبيين وأجانب، يُشتبه بقيامها في سلسلة من الهجمات على منشآت حيوية في البلاد.", "link": "https://arabic.rt.com/middle_east/1829194-%D8%A7%D9%84%D9%82%D8%A8%D8%B6-%D8%B9%D9%84%D9%89-%D8%AE%D9%84%D9%8A%D8%A9-%D8%AA%D8%AE%D8%B1%D9%8A%D8%A8%D9%8A%D8%A9-%D9%85%D8%AA%D9%88%D8%B1%D8%B7%D8%A9-%D8%A8%D9%87%D8%AC%D9%85%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%B3%D9%8A%D8%B1%D8%A7%D8%AA-%D8%B9%D9%84%D9%89-%D9%85%D9%86%D8%B4%D8%A2%D8%AA-%D8%A7%D9%84%D9%86%D9%81%D8%B7-%D9%88%D8%A7%D9%84%D9%83%D9%87%D8%B1%D8%A8%D8%A7%D8%A1-%D9%81%D9%8A-%D9%84%D9%8A%D8%A8%D9%8A%D8%A7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9ca6094236047174657da9.jpg", "category": "اقتصاد", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788651715, "detail": "أكد مصدر بوزارة الدفاع بحكومة الوحدة الوطنية لـ RT، إلقاء القبض على خلية تخريبية تضم ليبيين وأجانب، يُشتبه بقيامها في سلسلة من الهجمات على منشآت حيوية في البلاد.\n\nوبحسب المعلومات الأولية، كشفت اعترافات عدد من عناصر الخلية عن تورطها في التنفيذ أو التخطيط لعمليات أخرى استهدفت منشآت حيوية، بينها محطة كهرباء جنوب طرابلس، ضمن مخطط وصفته المصادر بالمنظم، يهدف إلى ضرب منشآت استراتيجية وإحداث أضرار في قطاعات النفط والطاقة والكهرباء.\n\nوتأتي هذه التطورات بعد سلسلة هجمات بطائرات مسيّرة استهدفت منشآت نفطية وحيوية في المنطقة الغربية، ما أثار مخاوف من اتساع نطاق الاستهداف ليشمل منشآت إضافية ذات أهمية استراتيجية.\n\nوشهدت مدينة الزاوية في أغسطس الماضي سلسلة هجمات بطائرات مسيّرة استهدفت منشآت النفط والطاقة، بدأت بضرب خزانات الوقود في مجمع الزاوية النفطي، الذي يضم أكبر مصفاة عاملة في ليبيا.\n\nليبيا.. مسيرة FPV تستهدف مستودع طرابلس النفطي الهجمات تسببت في اندلاع حرائق داخل عدد من خزانات الوقود، وانهيار خزان بنزين بسعة تقارب 4.5 ملايين لتر، فيما أعلنت المؤسسة الوطنية للنفط حالة الطوارئ القصوى، وحذرت من إمكانية توقف العمليات إذا استمرت الهجمات. ولم تُسجل خسائر بشرية، كما لم يتضرر جسم المصفاة نفسه، لكن الاستهداف أدى مؤقتاً إلى اضطراب في عمليات إمداد الوقود بالمنطقة الغربية.\n\nولم تقتصر الهجمات على المنشآت النفطية، إذ تعرضت أيضاً منشآت كهربائية في الزاوية للاستهداف، ما تسبب في انقطاع واسع للتيار الكهربائي جنوب المدينة، وتعطّل أكثر من 700 ميغاوات من القدرة الإنتاجية لمحطة الزاوية، كما دفعت الظروف الأمنية شركة جنرال إلكتريك إلى تعليق أعمالها وسحب فرقها الفنية من المحطة.\n\nوفي 3 سبتمبر الجاري، انتقل نمط الاستهداف إلى العاصمة طرابلس، حيث تعرض مستودع طرابلس النفطي بطريق المطار لمحاولة استهداف بجسم طائر يُشتبه في كونه طائرة مسيّرة، سقط بجوار أحد خزانات الوقود داخل حرم المستودع، من دون تسجيل إصابات، بحسب شركة البريقة لتسويق النفط.\n\nباشرت فرق الطوارئ التابعة لشركة البريقة لتسويق النفط إجراءات احترازية في مستودع البريقة بطريق المطار في طرابلس، عقب محاولة استهداف خزانات الوقود بمسيرة صباح اليوم الخميس.\n\nوقعت المؤسسة الوطنية ​للنفط في ليبيا اتفاقية لتقاسم الإنتاج ​مع شركة ​شيفرون، ⁠بعد أن ​منحت في ​وقت سابق ترخيصا لاستكشاف النفط ​والغاز للشركة ​نفسها وشركات نفط أجنبية ‌أخرى."}, {"guid": "https://arabic.rt.com/space/1829191-%D8%A5%D8%B7%D9%84%D8%A7%D9%82-%D9%86%D8%A7%D8%AC%D8%AD-%D9%84%D8%A3%D9%88%D9%84-%D8%B5%D8%A7%D8%B1%D9%88%D8%AE-%D8%A3%D9%88%D8%B1%D9%88%D8%A8%D9%8A-%D8%B5%D9%86%D8%B9%D8%AA%D9%87-%D8%B4%D8%B1%D9%83%D8%A9-%D8%AE%D8%A7%D8%B5%D8%A9/", "title": "إطلاق ناجح لأول صاروخ أوروبي صنعته شركة خاصة", "summary": "أعلنت شركة Isar Aerospace الألمانية عن إطلاق ناجح لصاروخ Spectrum، الذي يعتبر أول صاروخ أوروبي صنعته شركة خاصة.", "link": "https://arabic.rt.com/space/1829191-%D8%A5%D8%B7%D9%84%D8%A7%D9%82-%D9%86%D8%A7%D8%AC%D8%AD-%D9%84%D8%A3%D9%88%D9%84-%D8%B5%D8%A7%D8%B1%D9%88%D8%AE-%D8%A3%D9%88%D8%B1%D9%88%D8%A8%D9%8A-%D8%B5%D9%86%D8%B9%D8%AA%D9%87-%D8%B4%D8%B1%D9%83%D8%A9-%D8%AE%D8%A7%D8%B5%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c9b7042360471b76047ac.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788649815, "detail": "أعلنت شركة Isar Aerospace الألمانية عن إطلاق ناجح لصاروخ Spectrum، الذي يعتبر أول صاروخ أوروبي صنعته شركة خاصة.\n\nوانطلق الصاروخ من مطار أندويا الفضائي في النرويج عند الساعة 22:12 مساء السبت بالتوقيت المحلي.\n\nIsar Aerospace تحضر لإطلاق صاروخها الفضائي الجديد وكتبت شركة Isar Aerospace على موقع \"إكس\" للتواصل الاجتماعي بعد الإطلاق الناجح للصاروخ: \"إننا على المدار! لقد دخلنا في التاريخ الأوروبي إذ أنه لأول مرة وصل صاروخ من صنع شركة خاصة إلى المدار من القارة الأوروبية\".\n\nوكانت هذه ثاني عملية إطلاق لصاروخ Spectrum. وقد فشل الإطلاق الأول في مارس عام 2025، حيث سقط الصاروخ في البحر بعد قليل من إطلاقه.\n\nوأصبحت شركة Isar Aerospace التي تأسست في عام 2018 في ميونخ أول شركة ألمانية أطلقت صاروخا فضائيا بنجاح.\n\nكشفت صحيفة European Spaceflight عن موعد عملية الإطلاق الأولى لصاروخ Spectrum الفضائي الجديد."}, {"guid": "https://arabic.rt.com/world/1829193-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A-%D9%8A%D8%B9%D9%84%D9%86-%D8%A7%D8%B3%D8%AA%D9%87%D8%AF%D8%A7%D9%81-%D8%AD%D8%A7%D9%85%D9%84%D8%A9-%D8%B7%D8%A7%D8%A6%D8%B1%D8%A7%D8%AA-%D9%88%D9%85%D8%AF%D9%85%D8%B1%D8%A9-%D8%AA%D8%A7%D8%A8%D8%B9%D8%AA%D9%8A%D9%86-%D9%84%D9%84%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A/", "title": "الحرس الثوري يعلن استهداف حاملة طائرات ومدمرة تابعتين للجيش الأمريكي", "summary": "أعلنت العلاقات العامة للحرس الثوري الإيراني في بيان فجر اليوم الأحد، استهداف حاملة طائرات ومدمرة تابعتين للجيش الأمريكي.", "link": "https://arabic.rt.com/world/1829193-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A-%D9%8A%D8%B9%D9%84%D9%86-%D8%A7%D8%B3%D8%AA%D9%87%D8%AF%D8%A7%D9%81-%D8%AD%D8%A7%D9%85%D9%84%D8%A9-%D8%B7%D8%A7%D8%A6%D8%B1%D8%A7%D8%AA-%D9%88%D9%85%D8%AF%D9%85%D8%B1%D8%A9-%D8%AA%D8%A7%D8%A8%D8%B9%D8%AA%D9%8A%D9%86-%D9%84%D9%84%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c9d66423604733605baf0.jpg", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788649587, "detail": "أعلنت العلاقات العامة للحرس الثوري الإيراني في بيان فجر اليوم الأحد، استهداف حاملة طائرات ومدمرة تابعتين للجيش الأمريكي.\n\nوجاء في البيان: \"استهدفنا بالصواريخ الباليستية حاملة طائرات ومدمرة تابعتين للجيش الأمريكي المعتدي قاتل الأطفال\".\n\nوأضاف البيان: \"السفينتان العسكريتان الأمريكيتان فرتا من منطقة الاشتباك بعد تعرضهما لأضرار\".\n\nبحرية الحرس الثوري تستهدف ست سفن ردا على هجوم أمريكي وتحذر باقي السفن من \"تحركات مشبوهة\" وتابع: \"حاملة الطائرات والمدمرة الأمريكيتان المستهدفتان تسببتا في مضايقات للسفن الإيرانية وشاركتا في الحصار البحري\".\n\nوشدد البيان على أن \"العدو المعتدي ظل لسنوات يتجول في المنطقة بغرور زائف وادعاءات جوفاء اضطر إلى الاعتراف رسميا بذلك\".\n\nوأضاف البيان: \"العدو اضطر إلى الاعتراف رسميا بأن سفينتين حربيتين تابعتين للبحرية الأمريكية تعرضتا للهجوم، ويُعد اعتراف القيادة المركزية الأمريكية (CENTCOM) بتأكيد هذه العملية دليلا قاطعا على الهزيمة الاستراتيجية للعدو، وبرهانا على القوة الهجومية للحرس الثوري\".\n\nوختم البيان: \"إذا استمرت الأعمال العدائية، فعلى النظام الأمريكي أن يتوقع ردودا قوية من القوات المسلحة الإيرانية. نحن أقوى من أي وقت مضى. النصر حليف الأمة الإيرانية الإسلامية الصامدة، والهزيمة والندم هما المصير المحتوم للمعتدين\".\n\nصرح قائد قوة القدس في الحرس الثوري الإيراني العميد إسماعيل قاآني، بأن القوة العملياتية والدفاعية للمقاومة وحزب الله ستؤدي بلا شك إلى إزالة إسرائيل من المنطقة.\n\nصرح المتحدث باسم مقر \"خاتم الأنبياء\" الإيراني إبراهيم ذو الفقاري بأن إيران ستشن ضربات جديدة وأكثر قوة ضد السفن العسكرية الأمريكية إذا استمرت في مضايقة السفن الإيرانية ومهاجمتها.\n\nباتت قوافل ضخمة من الشاحنات والصهاريج المحملة بالنفط تجوب الطرقات الصحراوية السورية، في مشهد يعكس تحولاً استراتيجياً في خريطة تدفق الطاقة بالمنطقة."}, {"guid": "https://www.bbc.com/arabic/articles/cwyzww9y0kno#0", "title": "محادثات بوتين ومبعوثي ترامب تنتهي بعد أكثر من ثلاث ساعات قبيل زيارة مرتقبة لكييف", "summary": "اختتم الرئيس الروسي فلاديمير بوتين محادثات استمرت أكثر من ثلاث ساعات مع مبعوثي الرئيس الأمريكي دونالد ترامب، في إطار مساعٍ لإنهاء الحرب في أوكرانيا. وبينما وصف الكرملين اللقاء بأنه \"بناء وصريح\"، لم يُعلن عن تحقيق اختراق، فيما يستعد المبعوثان لزيارة كييف.", "link": "https://www.bbc.com/arabic/articles/cwyzww9y0kno?at_medium=RSS&at_campaign=rss", "image": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/c766/live/2767d3f0-a95b-11f1-b109-879e35c24276.jpg", "category": "أخبار", "source_id": "bbc-arabic", "source_name": "بي بي سي عربي", "source_cat": "دولية", "published": 1788647801, "detail": "BBC News, عربيإذهب الى المحتوىرئيسيةشاهداستمعأقسامرئيسيةأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتمحادثات بوتين ومبعوثي ترامب تنتهي بعد أكثر من ثلاث ساعات قبيل زيارة مرتقبة لكييفصدر الصورة، EPA\n\nانتهت في الكرملين محادثات الرئيس الروسي فلاديمير بوتين مع مبعوثي الرئيس الأمريكي دونالد ترامب، ستيف ويتكوف وجاريد كوشنر، بعد اجتماع استمر ثلاث ساعات وعشر دقائق وتركز على مساعي إنهاء الحرب في أوكرانيا.\n\nووصف مساعد الرئيس الروسي يوري أوشاكوف المحادثات بأنها \"مثمرة وبناءة وصريحة إلى أقصى حد وتتسم بالثقة\"، قائلاً إنها تناولت الأزمة الأوكرانية إلى جانب قضايا أخرى بين موسكو وواشنطن.\n\nوكان بوتين قد قال في مستهل الاجتماع إن الاتصالات مع الولايات المتحدة \"مثمرة دائماً\"، وأشاد بجهود ترامب للتوصل إلى تسوية للحرب، فيما نقل ويتكوف تحيات الرئيس الأمريكي وشكره لبوتين على الإجراءات المتخذة لضمان سلامة الوفد.\n\nكما أمر القوات الروسية بالامتناع عن استهداف كييف لمدة ثلاثة أيام، اعتباراً من منتصف ليل السبت، في وقت يستعد فيه المبعوثان الأمريكيان للانتقال إلى العاصمة الأوكرانية.\n\nوفي المقابل، أعلن الرئيس الأوكراني فولوديمير زيلينسكي استعداد بلاده للامتناع عن استهداف موسكو حتى نهاية الإثنين، داعياً روسيا إلى اتخاذ خطوة مماثلة تجاه كييف.\n\nوقال: \"من الآن وحتى نهاية السبت، وكذلك يومي الأحد والاثنين، أوكرانيا مستعدة للامتناع عن توجيه ضربات إلى موسكو، ونتوقع أن يفعل الروس الشيء نفسه تجاه كييف\".\n\nولم تعلن موسكو موافقتها على وقف أوسع لإطلاق النار لمدة ثلاثة أيام.\n\nوأضاف زيلينسكي أنه تحدث إلى المبعوثين الأمريكيين اللذين \"بدآ بالفعل العمل مع الجانب الروسي\"، مؤكداً استعداد كييف لإجراء \"محادثات جادة\" لدى وصول الوفد الأمريكي إلى العاصمة الأوكرانية، الأحد."}, {"guid": "c41a790a-a979-11f1-b034-b9bc07de89ff", "title": "طهران وواشنطن تتبادلان استهداف السفن وغارات إسرائيلية توقع قتلى في لبنان", "summary": "تجدد التصعيد بين الولايات المتحدة وإيران بعدما أعلنت واشنطن استهداف ثلاث ناقلات نفط مرتبطة بالحرس الثوري، فيما قالت طهران إنها ردت باستهداف ناقلات وسفن مرتبطة بالولايات المتحدة. وبالتزامن، ارتفعت حصيلة الغارات الإسرائيلية على جنوب لبنان إلى 4 قتلى و32 جريحا، فيما امتدت تداعيات اضطراب الملاحة في مضيق", "link": "https://www.france24.com/ar/%D8%A7%D9%84%D8%B4%D8%B1%D9%82-%D8%A7%D9%84%D8%A3%D9%88%D8%B3%D8%B7/20260905-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D8%A7-%D8%AA%D8%AA%D8%A8%D8%A7%D8%AF%D9%84%D8%A7%D9%86-%D8%A7%D8%B3%D8%AA%D9%87%D8%AF%D8%A7%D9%81-%D8%A7%D9%84%D8%B3%D9%81%D9%86-%D8%BA%D8%A7%D8%B1%D8%A7%D8%AA-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84%D9%8A%D8%A9-%D8%AA%D9%88%D9%82%D8%B9-%D9%82%D8%AA%D9%84%D9%89-%D9%81%D9%8A-%D9%84%D8%A8%D9%86%D8%A7%D9%86-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84-%D9%85%D8%B6%D9%8A%D9%82-%D9%87%D8%B1%D9%85%D8%B2", "image": "https://s.france24.com/media/display/21d5120c-9c1a-11f1-9606-005056a97e36/w:1024/p:16x9/AFP-20260810-C4AZ2JM-v4-MidRes-TopshotIranUsIsraelWar.jpg", "category": "أمن", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788647585, "detail": ""}, {"guid": "https://arabic.rt.com/world/1829173-%D8%B9%D8%B3%D9%83%D8%B1%D9%8A-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A-%D9%8A%D8%AF%D8%B9%D9%88-%D8%A7%D9%84%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D9%8A%D9%86-%D8%A5%D9%84%D9%89-%D8%A7%D9%84%D8%A7%D8%AD%D8%AA%D8%AC%D8%A7%D8%AC-%D8%A3%D9%85%D8%A7%D9%85-%D9%85%D9%83%D8%AA%D8%A8-%D8%B2%D9%8A%D9%84%D9%8A%D9%86%D8%B3%D9%83%D9%8A/", "title": "عسكري أوكراني يدعو المواطنين إلى الاحتجاج في 10 سبتمبر أمام مكتب زيلينسكي", "summary": "دعا العسكري ألكسندر تودوروف، من القوات الأوكرانية، المواطنين الأوكرانيين إلى الاحتجاج أمام مكتب فلاديمير زيلينسكي في كييف ضد حكومته التي \"تدمر شعبها\".", "link": "https://arabic.rt.com/world/1829173-%D8%B9%D8%B3%D9%83%D8%B1%D9%8A-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A-%D9%8A%D8%AF%D8%B9%D9%88-%D8%A7%D9%84%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D9%8A%D9%86-%D8%A5%D9%84%D9%89-%D8%A7%D9%84%D8%A7%D8%AD%D8%AA%D8%AC%D8%A7%D8%AC-%D8%A3%D9%85%D8%A7%D9%85-%D9%85%D9%83%D8%AA%D8%A8-%D8%B2%D9%8A%D9%84%D9%8A%D9%86%D8%B3%D9%83%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c7dc342360444df6c944d.jpg", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788647383, "detail": "دعا العسكري ألكسندر تودوروف، من القوات الأوكرانية، المواطنين الأوكرانيين إلى الاحتجاج أمام مكتب فلاديمير زيلينسكي في كييف ضد حكومته التي \"تدمر شعبها\".\n\nوقال تودوروف في مقطع فيديو نُشر على قناة تلغرام التابعة لعضو البرلمان الأوكراني أرتيوم دميتروك، الذي غادر أوكرانيا: \"اسمي ألكسندر تودوروف، أنا جندي في اللواء 41، بدأت في المشاة وتعرضت للإصابة… والآن أخدم في القوات الصاروخية الثالثة… لقد حان الوقت الذي يجب أن نوجه فيه الأسئلة لهذه السلطة المخزية القائمة على الإبادة الجماعية، والتي تدمر شعبها. لذلك، أدعوكم إلى التجمع في كييف في 10 سبتمبر الساعة 9:00 صباحا للاحتجاج\".\n\nكييف.. انطلاق مسيرة جديدة مؤيدة لوزير الدفاع المقال فيدوروف (فيديو) وذكر العسكري أنه حصل على إجازة لأول مرة منذ 11 شهرا من الخدمة بسبب إصابة. سافر إلى أوديسا وتوجه إلى مستشفى عسكري للحصول على مساعدة طبية، لكن طلبه قوبل بالرفض، بل واتُهم بدفع رشوة للحصول على الإجازة. واستشهد بمثال زملائه الآخرين من ذوي الإعاقة الحركية الذين تُركوا أيضا دون رعاية طبية.\n\nوتابع العسكري: \"دولة تعامل المدافعين عنها بهذه الطريقة محكوم عليها بالهزيمة في الحرب، وبالفناء... إن حالة جيشنا مروعة، فالأموال لا تصل، بل تُقسّم بين القيادات. يُنظر إلينا كدولة إرهابية. عار!\".\n\nكما أقر تودوروف بأنه بعد تصريحاته ودعواته للتجمع، قد يتعرض \"للقمع\" أو حتى \"للإقصاء والتصفية\"، ولهذا قام بشكل مسبق بإلقاء اللوم على أنصار زيلينسكي لو حدث ذلك."}, {"guid": "https://arabic.rt.com/world/1829189-%D8%A3%D9%88%D8%B4%D8%A7%D9%83%D9%88%D9%81-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%88%D9%83%D9%88%D8%B4%D9%86%D8%B1-%D8%A3%D8%AC%D8%B1%D9%88%D8%A7-%D8%A7%D8%B3%D8%AA%D8%B9%D8%AF%D8%A7%D8%AF%D8%A7%D8%AA-%D8%AC%D8%A7%D8%AF%D8%A9-%D9%84%D8%B2%D9%8A%D8%A7%D8%B1%D8%AA%D9%87%D9%85-%D8%A5%D9%84%D9%89-%D9%85%D9%88%D8%B3%D9%83%D9%88/", "title": "أوشاكوف: ويتكوف وكوشنر أجريا استعدادات جادة لزيارتهما إلى موسكو", "summary": "صرح مساعد الرئيس الروسي يوري أوشاكوف بأن المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، أجريا استعدادات جادة لزيارتهما إلى موسكو.", "link": "https://arabic.rt.com/world/1829189-%D8%A3%D9%88%D8%B4%D8%A7%D9%83%D9%88%D9%81-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%88%D9%83%D9%88%D8%B4%D9%86%D8%B1-%D8%A3%D8%AC%D8%B1%D9%88%D8%A7-%D8%A7%D8%B3%D8%AA%D8%B9%D8%AF%D8%A7%D8%AF%D8%A7%D8%AA-%D8%AC%D8%A7%D8%AF%D8%A9-%D9%84%D8%B2%D9%8A%D8%A7%D8%B1%D8%AA%D9%87%D9%85-%D8%A5%D9%84%D9%89-%D9%85%D9%88%D8%B3%D9%83%D9%88/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c93024236047174657d9f.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788647292, "detail": "صرح مساعد الرئيس الروسي يوري أوشاكوف بأن المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، أجريا استعدادات جادة لزيارتهما إلى موسكو.\n\nوأكد أوشاكوف في تصريح صحفي أن \"ويتكوف وكوشنر وضعا عددا من الأفكار بشأن الحلول الممكنة للأزمة الأوكرانية\".\n\nويتكوف: حواري مع بوتين من أكثر المحطات رسوخا في ذاكرتي وأشار مساعد الرئيس الروسي إلى أن ويتكوف وكوشنر \"أخذا بعين الاعتبار تصريحات بوتين حول أن نظام كييف توقف عن إخفاء طبيعته النازية\".\n\nوالتقى الرئيس الروسي فلاديمير بوتين بالمبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، واستقبلهما بوتين في الكرملين، وأشاد بدور المفاوضين الأمريكيين، شاكرا نظيره الأمريكي دونالد ترامب على جهوده في مسار حل الأزمة الأوكرانية.\n\nواستمرت المحادثات ثلاث ساعات وعشر دقائق، وأكد أوشاكوف أنها كانت مثمرة وسرية للغاية.\n\nأكد الرئيس الروسي فلاديمير بوتين خلال لقائه المبعوثين الأمريكيين الخاصين ستيف ويتكوف وجاريد كوشنر، استمرار زعيمي روسيا والولايات المتحدة الحفاظ على اتصالاتهما الشخصية.\n\nأفاد مصدر في متجر هدايا البيت الأبيض أن العملة التي تركها المبعوث الأمريكي الخاص ستيف ويتكوف في أحد مطاعم موسكو ليست مخصصة للبيع، بل هي قطعة تذكارية شخصية.\n\nشكر المبعوث الأمريكي الخاص ستيف ويتكوف الرئيس الروسي فلاديمير بوتين على تسليم الولايات المتحدة المدان السابق في مشاة البحرية الأمريكية روبرت غيلمان.\n\nوجه المبعوث الخاص للرئيس الأمريكي ستيف ويتكوف الشكر إلى الرئيس الروسي فلاديمير بوتين على وقف الضربات لمدة ثلاثة أيام لإجراء المفاوضات، وذلك خلال لقائهما مساء السبت في الكرملين.\n\nيلتقي الرئيس الروسي فلاديمير بوتين اليوم بالمبعوث الأمريكي الخاص ستيف ويتكوف في روسيا للمرة السادسة."}, {"guid": "https://arabic.rt.com/middle_east/1829188-%D8%B3%D8%A7%D8%B9%D8%A9-%D8%B0%D9%87%D8%A8%D9%8A%D8%A9-%D8%AD%D9%81%D9%8A%D8%AF-%D8%AC%D9%85%D8%A7%D9%84-%D8%B9%D8%A8%D8%AF-%D8%A7%D9%84%D9%86%D8%A7%D8%B5%D8%B1-%D8%B3%D8%B1%D9%82-%D8%A5%D8%B1%D8%AB%D8%A7-%D8%AA%D8%A7%D8%B1%D9%8A%D8%AE%D9%8A%D8%A7-%D9%86%D8%A7%D8%AF%D8%B1%D8%A7-%D9%84%D9%84%D8%B2%D8%B9%D9%8A%D9%85/", "title": "ساعة ذهبية.. حفيد جمال عبد الناصر سرق إرثا تاريخيا نادرا للزعيم", "summary": "اتهم عبد الحميد عبد الناصر، نجل الزعيم المصري الراحل، ابن شقيقه خالد بالسرقة بعد بيع ساعة الرئيس المصري السابق في مزاد بمدينة نيويورك الأمريكية.", "link": "https://arabic.rt.com/middle_east/1829188-%D8%B3%D8%A7%D8%B9%D8%A9-%D8%B0%D9%87%D8%A8%D9%8A%D8%A9-%D8%AD%D9%81%D9%8A%D8%AF-%D8%AC%D9%85%D8%A7%D9%84-%D8%B9%D8%A8%D8%AF-%D8%A7%D9%84%D9%86%D8%A7%D8%B5%D8%B1-%D8%B3%D8%B1%D9%82-%D8%A5%D8%B1%D8%AB%D8%A7-%D8%AA%D8%A7%D8%B1%D9%8A%D8%AE%D9%8A%D8%A7-%D9%86%D8%A7%D8%AF%D8%B1%D8%A7-%D9%84%D9%84%D8%B2%D8%B9%D9%8A%D9%85/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c92454c59b75873696494.png", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788647149, "detail": "اتهم عبد الحميد عبد الناصر، نجل الزعيم المصري الراحل، ابن شقيقه خالد بالسرقة بعد بيع ساعة الرئيس المصري السابق في مزاد بمدينة نيويورك الأمريكية.\n\nوكانت الواقعة محل جدل واسع نهاية عام 2024 بعد عرض الساعة الذهبية التي كان يمتلكها عبد الناصر، من نوع \"رولكس\"، للبيع في دار مزادات sothebys الأمريكية.\n\nعرض ساعة ذهبية لجمال عبدالناصر مهداة من السادات في دار مزادات أمريكية وتحمل الساعة مكانة خاصة ليس فقط لصلتها بالزعيم المصري الراحل، بل لكونها أيضا مهداة من رئيس مصري آخر هو محمد أنور السادات عام 1963 والذي كان صديقا مقربا من عبد الناصر.\n\nوكتب عبد الحميد عبد الناصر، على حسابه بمنصة \"فيسبوك\" السبت: \"إلى من يهمه الأمر جمال خالد عبد الناصر ابن أخويا حرامي ساعة أبويا اللي باعها في نيويورك لا يمثل العائلة بأي شكل من الأشكال\".\n\nوبيعت الساعة بنحو 840 ألف دولار أمريكي في ديسمبر 2024، وهي مصنوعة من الذهب الأصفر عيار 18 قيراط، وعلى ظهرها منقوش اسم \"السيد أنور السادات\" وتاريخ \"26-9-1963\" باللغة العربية.\n\nوالساعة من طراز طرح لأول مرة عام 1956 كطراز رائد في كتالوج روليكس، يصنع من المعادن الثمينة فقط، كما أنها تميزت بأنها أول ساعة تعرض اليوم والتاريخ بالكامل، وتتميز كذلك بمقاومة الماء، وكانت الساعة المفضلة لدى المشاهير والرؤساء وقادة الأعمال.\n\nوتعد هذه الساعة هي الشيء الوحيد خارج أي مجموعة متحفية من ممتلكات الرئيس الراحل، وذلك بعدما تبرعت عائلته بكل ممتلكاته المادية، إلى متحف يحمل اسمه.\n\nوفي رسالة قبل بيعها، تمنى حفيد \"عبدالناصر\" أن تذهب الساعة إلى شخص يقدر إرث الزعيم الراحل، وتفانيه في السعي للحرية والسلام الدائمين في المنطقة وخارجها، وبالتالي نشر إرثه.\n\nألقت الأجهزة الأمنية المصرية، الجمعة، القبض على شخص متهم بالشروع في سرقة سيارتين أثريتين (أنتيك) من داخل مخزن بمنطقة العطارين، إحداهما تعود للرئيس الراحل جمال عبد الناصر.\n\nهل كانت هزيمة 1967 نهاية جمال عبد الناصر أم اللحظة التي صنعت أسطورته السياسية ولماذا خرج الملايين إلى الشوارع رفضا لتنحيه رغم واحدة من أقسى الهزائم في التاريخ العربي الحديث؟\n\nأثار بيع ساعة منسوبة إلى الرئيس المصري الراحل جمال عبد الناصر في مزاد دولي جدلا واسعا خلال الساعات الماضية.\n\nقال حفيد الرئيس المصري الراحل جمال عبد الناصر إنه يتمنى أن تنتقل الساعة الذهبية من طراز رولكس، المطروحة في مزاد بنيويورك الأمريكية، إلى شخص يقدر إرث جده.\n\nعرضت دار مزادات sothebys الأمريكية ساعة ذهبية كان يمتلكها الرئيس المصري الراحل جمال عبدالناصر، من نوع \"رولكس\"، للمزاد، والساعة أهداها له الرئيس الراحل محمد أنور السادات عام 1963."}, {"guid": "https://arabic.rt.com/sport/1829190-%D9%87%D8%B0%D8%A7-%D9%85%D8%A7-%D8%AA%D8%B9%D9%84%D9%85%D8%AA%D9%87-%D9%85%D9%86-%D8%A7%D9%84%D8%B1%D9%82%D8%A
