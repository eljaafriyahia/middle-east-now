<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الشرق الأوسط الآن</title>
<meta name="description" content="مجمع أخبار الشرق الأوسط - آخر الأخبار من وكالات الأنباء الرسمية والمواقع الدولية">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --mut:#94a3b8;
    --acc:#38bdf8; --acc2:#2dd4bf; --cat:#f59e0b;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--txt); font-family:"Segoe UI",Tahoma,Arial,sans-serif; min-height:100vh}
  header{
    position:sticky; top:0; z-index:10; background:linear-gradient(135deg,#0f172a,#1e3a5f);
    border-bottom:1px solid var(--line); padding:14px 18px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  .logo{font-size:22px; font-weight:800; letter-spacing:.3px}
  .logo small{color:var(--acc); font-weight:400; font-size:12px; display:block; letter-spacing:1px}
  .updated{color:var(--mut); font-size:12px; margin-right:auto}
  main{max-width:960px; margin:0 auto; padding:16px}
  .bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px}
  input[type=search]{
    flex:1; min-width:200px; padding:10px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--txt); font-size:14px
  }
  
  select{
    padding:9px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--txt); font-size:13px
  }
  #list{display:flex; flex-direction:column; gap:12px}
  .card{
    display:flex; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; cursor:pointer; transition:transform .15s, border-color .15s
  }
  .card:hover{transform:translateY(-2px); border-color:var(--acc)}
  .thumb{width:140px; min-height:100px; background:#0b1220 center/cover no-repeat; flex-shrink:0; position:relative}
  .cat{
    position:absolute; top:8px; right:8px; background:var(--cat); color:#451a03;
    font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px
  }
  .body{padding:12px 14px; display:flex; flex-direction:column; gap:6px; min-width:0}
  h2{font-size:15.5px; line-height:1.5; font-weight:700}
  .sum{color:var(--mut); font-size:12.5px; line-height:1.6; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
  .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--acc2)}
  .meta .src{background:#134e4a; color:#99f6e4; padding:2px 8px; border-radius:999px; font-size:11px}
  .meta .time{color:var(--mut)}
  .placeholder{color:var(--mut); text-align:center; padding:60px 20px}
  #empty{display:none}
  .loading{text-align:center; padding:60px 20px; color:var(--mut)}
  footer{text-align:center; color:var(--mut); font-size:12px; padding:30px 16px}
  @media(max-width:640px){
    .thumb{width:100px} h2{font-size:14px}
    header{justify-content:space-between}
  }
  .hcontrols{display:flex; align-items:center; gap:10px}
  .timer{font-size:11px; color:var(--mut); background:rgba(255,255,255,.06); padding:3px 8px; border-radius:999px; white-space:nowrap}
  .reload{
    border:1px solid var(--line); background:rgba(255,255,255,.06); color:var(--acc2);
    padding:6px 12px; border-radius:999px; cursor:pointer; font-size:12px; font-weight:700
  }
  .reload:hover{background:rgba(255,255,255,.12)}
  #toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:24px; z-index:99;
    background:var(--acc); color:#06283d; font-weight:700; font-size:13px;
    padding:10px 18px; border-radius:999px; box-shadow:0 6px 18px rgba(0,0,0,.35);
    opacity:0; pointer-events:none; transition:opacity .2s; white-space:nowrap
  }
  #toast.show{opacity:1}
  .modal{
    position:fixed; inset:0; background:rgba(2,6,23,.85); z-index:50;
    display:none; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto
  }
  .modal.open{display:flex}
  .modal-box{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    max-width:640px; width:100%; animation:pop .18s ease; margin:auto 0
  }
  @keyframes pop{from{transform:translateY(12px); opacity:0} to{transform:none; opacity:1}}
  .modal-img{width:100%; aspect-ratio:16/9; object-fit:cover; background:#0b1220; display:block}
  .modal-body{padding:18px}
  .modal-head{display:flex; justify-content:space-between; gap:10px; margin-bottom:12px}
  .modal-cat{background:var(--cat); color:#451a03; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px; align-self:flex-start}
  .modal-x{background:none; border:none; color:var(--mut); font-size:26px; cursor:pointer; line-height:1}
  .modal-title{font-size:20px; line-height:1.6; margin-bottom:6px}
  .modal-src{color:var(--acc2); font-size:13px; margin-bottom:14px}
  .modal-sum{color:var(--txt); font-size:14.5px; line-height:2; white-space:pre-line}
  .modal-note{margin-top:12px; font-size:12px; color:var(--mut)}
  .modal-link{
    margin-top:18px; border-top:1px dashed var(--line); padding-top:16px; text-align:center
  }
  .readlink{
    display:inline-block; padding:12px 20px; border-radius:10px; background:var(--acc); color:#06283d;
    font-weight:700; font-size:14px; text-decoration:none
  }
  .readlink:hover{opacity:.9}
</style>
</head>

<script>
const DATA_URL = 'data/news.json';
let INLINE_NEWS = {"articles": [{"guid": "https://arabic.rt.com/world/1829215-%D8%A3%D9%8A-%D8%B1%D9%88%D8%B3%D9%88%D9%81%D9%88%D8%A8%D9%8A%D8%A9-%D8%A3%D9%86%D8%A7-%D8%AC%D8%A7%D8%B1-%D9%83%D8%A7%D9%84%D8%A7%D8%B3-%D8%A7%D9%84%D8%B3%D8%A7%D8%A8%D9%82-%D9%8A%D9%83%D8%B4%D9%81-%D9%85%D9%88%D9%82%D9%81%D9%87%D8%A7-%D9%85%D9%86-%D8%A7%D9%84%D8%B1%D9%88%D8%B3/", "title": "\"أي روسوفوبية أنا؟\".. جار كالاس السابق يكشف موقفها من الروس", "summary": "كشف دميتري لينتر، جار كايا كالاس السابق، أن مسؤولة السياسة الخارجية في الاتحاد الأوروبي لم تكن تعتبر نفسها معادية للروس خلال شبابها، رغم مواقفها الحالية المناهضة لموسكو.", "link": "https://arabic.rt.com/world/1829215-%D8%A3%D9%8A-%D8%B1%D9%88%D8%B3%D9%88%D9%81%D9%88%D8%A8%D9%8A%D8%A9-%D8%A3%D9%86%D8%A7-%D8%AC%D8%A7%D8%B1-%D9%83%D8%A7%D9%84%D8%A7%D8%B3-%D8%A7%D9%84%D8%B3%D8%A7%D8%A8%D9%82-%D9%8A%D9%83%D8%B4%D9%81-%D9%85%D9%88%D9%82%D9%81%D9%87%D8%A7-%D9%85%D9%86-%D8%A7%D9%84%D8%B1%D9%88%D8%B3/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9d006d4c59b7579d46eadd.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788674743, "detail": "كشف دميتري لينتر، جار كايا كالاس السابق، أن مسؤولة السياسة الخارجية في الاتحاد الأوروبي لم تكن تعتبر نفسها معادية للروس خلال شبابها، رغم مواقفها الحالية المناهضة لموسكو.\n\nوقال لينتر في حديث لوكالة \"نوفوستي\" إنه كان يعيش بالقرب من كالاس خلال سنوات دراسته الجامعية، وكانت تربطهما علاقة ودية، مشيرا إلى أنهما كانا يتحدثان كثيرا في قضايا السياسة العالمية.\n\nوأشار إلى أن كالاس كانت تبدي اهتماما كبيرا بالشأن السياسي وتتمسك بقناعاتها، لكنها كانت تتخذ موقفا محايدا في القضايا المتعلقة بالعلاقات بين القوميات، ولم تكن تعتبر نفسها قومية.\n\nوأضاف لينتر أنه كان يقول لها: \"أنتم جميعا معادون للروس\"، في إشارة إلى الإستونيين، فردت عليه: \"ديم، أي روسوفوبية أنا؟ أنا أتحدث معك بشكل طبيعي\".\n\nوتشتهر كالاس حاليا بتصريحاتها ومواقفها المناهضة لروسيا، فيما وصفها عضو البرلمان الأوروبي عن لوكسمبورغ فيرنان كارتايزر، في حديث سابق لـ\"نوفوستي\"، بأنها \"معادية صريحة للروس\"، ولم يستبعد أن يكون تعيينها في منصبها استفزازا متعمدا.\n\nولينتر ناشط سياسي معروف في إستونيا، واشتهر عام 2007 بدفاعه عن نصب \"الجندي البرونزي\" في تالين، بعد قرار السلطات إزالة النصب، ما أثار احتجاجات من السكان الناطقين بالروسية.\n\nواعتقلت السلطات لينتر مع ناشطين آخرين آنذاك، قبل أن تبرئهم المحكمة بعد سبعة أشهر من الاحتجاز، وغادر لاحقا إلى روسيا، ويقيم حاليا في دونيتسك، حيث يعمل بشكل تطوعي على دعم العسكريين.\n\nذكرت صحيفة \"بوليتيكو\"، نقلا عن دبلوماسيين، أن مسؤولة السياسة الخارجية في الاتحاد الأوروبي، كايا كالاس، تقاوم بشدة مبادرة فرنسية-ألمانية تهدف إلى إعادة هيكلة دبلوماسية الاتحاد.\n\nدعت مفوضة السياسة الخارجية في الاتحاد الأوروبي كايا كالاس إلى توحيد الجهود الأوروبية لزيادة الضغط على روسيا، بما يشمل فرض عقوبات جديدة.\n\nقالت مفوضة السياسة الخارجية الأوروبية كايا كالاس إن دولا أوروبية قد تمنح أوكرانيا صواريخ اعتراض تشارف صلاحيتها على الانتهاء، في ظل حاجة كييف الماسة لها ونقصها الحاد لدى أوروبا.\n\nتعهدت رئيسة الدبلوماسية الأوروبية كايا كالاس بتقديم أكبر حزمة عقوبات ضد روسيا منذ بداية الحرب، مشيرة إلى أن قائمة العقوبات الجديدة قد تزيد بنسبة الثلث عن القوائم السابقة.\n\nعلقت الخارجية الروسية على تصريحات مسؤولة السياسة الخارجية الأوروبية كايا كالاس، التي وصفت الاتحاد الأوروبي بأنه \"قوة خير مستقرة في العالم\"."}, {"guid": "https://arabic.rt.com/world/1829219-%D8%A8%D8%AD%D8%B1%D9%8A%D8%A9-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D8%A5%D9%8A%D8%B1%D8%A7%D9%86%D9%8A-%D9%86%D9%88%D8%A7%D8%AC%D9%87-%D8%A7%D9%84%D8%B3%D9%81%D9%86-%D8%A7%D9%84%D9%85%D8%AE%D8%A7%D9%84%D9%81%D8%A9-%D9%88%D9%86%D8%B9%D8%A7%D9%82%D8%A8%D9%87%D8%A7-%D8%B9%D9%86%D8%AF-%D8%A7%D9%84%D8%B6%D8%B1%D9%88%D8%B1%D8%A9/", "title": "بحرية الحرس الثوري الإيراني: نواجه السفن المخالفة في مضيق هرمز كل ليلة", "summary": "أكد نائب قائد القوة البحرية في الحرس الثوري الإيراني للشؤون السياسية علي محمدي أن البحرية لديها القدرة على الإشراف وممارسة الإرادة الحاسمة في مضيق هرمز.", "link": "https://arabic.rt.com/world/1829219-%D8%A8%D8%AD%D8%B1%D9%8A%D8%A9-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D8%A5%D9%8A%D8%B1%D8%A7%D9%86%D9%8A-%D9%86%D9%88%D8%A7%D8%AC%D9%87-%D8%A7%D9%84%D8%B3%D9%81%D9%86-%D8%A7%D9%84%D9%85%D8%AE%D8%A7%D9%84%D9%81%D8%A9-%D9%88%D9%86%D8%B9%D8%A7%D9%82%D8%A8%D9%87%D8%A7-%D8%B9%D9%86%D8%AF-%D8%A7%D9%84%D8%B6%D8%B1%D9%88%D8%B1%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9cfef742360471e0427b57.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788674500, "detail": "أكد نائب قائد القوة البحرية في الحرس الثوري الإيراني للشؤون السياسية علي محمدي أن البحرية لديها القدرة على الإشراف وممارسة الإرادة الحاسمة في مضيق هرمز.\n\nوقال محمدي: \"خلال الأيام العشرة المنتهية في 30 أغسطس، عاقبت البحرية ما بين سفينتين إلى 5 سفن مخالفة كل ليلة، وبعد ذلك، كلما رأت البحرية ضرورة لذلك، واجهت السفن المخالفة وعاقبتها\".\n\nووصف علي محمدي الهجمات الأخيرة التي شنتها القوات الأمريكية الإرهابية على عدة مناطق في البلاد بأنها رد فعل على عملياتنا المقتدرة وسيطرة إيران على مضيق هرمز.\n\nوتابع: \"في الأيام الماضية، ادعى الأمريكيون مرارا أن السيطرة على مضيق هرمز بيد القيادة المركزية الأمريكية، وأن البحرية الإيرانية لا تملك القدرة على الإشراف على المضيق، وأن ناقلات النفط وغيرها من السفن يمكنها المرور عبر الممر الجنوبي غير القانوني\".\n\nوأضاف: \"وفي هذا الإطار، نشروا أيضا أرقاما كاذبة حول كمية النفط التي تمر عبر هذا الممر. ومع ذلك، فإن التدخل الأمريكي المباشر في الاشتباكات أثار تساؤلات مهمة حول مصداقية هذه الرواية\".\n\nوتساءل نائب قائد بحرية الحرس الثوري للشؤون السياسية: \"إذا كانت الرواية الأمريكية حول السيطرة على مضيق هرمز صحيحة، فما الحاجة إلى التدخل المباشر في الاشتباكات؟\"\n\nوأردف محمدي: \"إذا كان الأمريكيون يملكون بالفعل القدرة على إدارة المضيق وتمرير النفط عبر الممر الجنوبي غير الشرعي، فلماذا يضطرون لدفع المزيد من التكاليف والخسائر العسكرية جراء الرد الإيراني على هجومهم؟\".\n\nأعلنت الخارجية الإيرانية أن الوزير عباس عراقجي أجرى اتصالات هاتفية منفصلة مع نظيريه السعودي فيصل بن فرحان والتركي هاكان فيدان تناولت آخر التطورات الإقليمية.\n\nأعلن الحرس الثوري الإيراني مهاجمة زورق أمريكي مسير كان يعتزم دخول المنطقة المحمية في مضيق هرمز.\n\nأظهرت بيانات جديدة أن صادرات الخام من دول رئيسية في الشرق الأوسط انخفضت بنسبة 39% خلال أغسطس 2026، مقارنة بخط الأساس المسجل في يناير وفبراير والبالغ 18.5 مليون برميل يوميا."}, {"guid": "https://www.dw.com/ar/تعفن-المطر-عدوى-جلدية-غامضة-تنتقل-بين-البشر/a-79047743?maca=ara-rss-ar-all-1125-rdf", "title": "\"تعفن المطر\" .. عدوى جلدية غامضة تنتقل بين البشر", "summary": "عدوى جلدية غامضة تجتاح أوروبا، تنتقل من شخص لآخر في أماكن رطبة وخفية. أطباء يحذّرون من طفح. هل نحن أمام وباء جديد يخرج من الظل؟", "link": "https://www.dw.com/ar/تعفن-المطر-عدوى-جلدية-غامضة-تنتقل-بين-البشر/a-79047743?maca=ara-rss-ar-all-1125-rdf", "image": "", "category": "أخبار", "source_id": "dw-arabic", "source_name": "DW عربي", "source_cat": "دولية", "published": 1788674400, "detail": ""}, {"guid": "https://www.dw.com/ar/لماذا-تفقد-الأحزاب-التقليدية-الناخبين-من-ذوي-الأصول-المهاجرة؟/a-78960685?maca=ara-rss-ar-all-1125-rdf", "title": "لماذا تفقد الأحزاب التقليدية الناخبين من ذوي الأصول المهاجرة؟", "summary": "في الانتخابات التي تجري في ألمانيا تزداد أهمية أصوات الأشخاص من أصول مهاجرة بشكل متزايد لكن الأحزاب التقليدية لا تستقطب هذه الفئة من الناخبين إلا نادرا، فما الأسباب؟", "link": "https://www.dw.com/ar/لماذا-تفقد-الأحزاب-التقليدية-الناخبين-من-ذوي-الأصول-المهاجرة؟/a-78960685?maca=ara-rss-ar-all-1125-rdf", "image": "", "category": "أخبار", "source_id": "dw-arabic", "source_name": "DW عربي", "source_cat": "دولية", "published": 1788674040, "detail": ""}, {"guid": "CBMiTEFVX3lxTE02MHVFbEh0cXdHNDhUa2dLcThsN0tIaTZkVUFCTmV3T29FNkdJMGlCR0RjVExpVXQxZjkxdWl4Q0ctbWxWc2RIRGdFLWw", "title": "مجلس القضاء الأعلى يوجه باتخاذ الإجراءات القانونية بحق مثيري الفتن الطائفية - وكالة الانباء العراقية (واع)", "summary": "مجلس القضاء الأعلى يوجه باتخاذ الإجراءات القانونية بحق مثيري الفتن الطائفية &nbsp;&nbsp; وكالة الانباء العراقية (واع)", "link": "https://news.g كي أونور شيمشيك، المطلوب في قضية احتيال مرتبطة بعقود توريد مكونات عسكرية لوزارة الدفاع الأمريكية.\n\nوأدرج المكتب شيمشيك في قائمته المستحدثة لـ\"أبرز المحتالين المطلوبين\"، وقال إن السلطات تعتقد أنه يقيم حالياً في تركيا، فيما صدرت بحقه مذكرة توقيف اتحادية في أكتوبر/تشرين الأول 2023 من محكمة المنطقة الوسطى في ولاية فلوريدا.\n\nوتتهمه السلطات الأمريكية، مع آخرين، باستخدام شركة واجهة في وسط فلوريدا بين أبريل/نيسان 2019 وفبراير/شباط 2022 للحصول على عقود من وكالة لوجستيات الدفاع التابعة للبنتاغون، عبر تقديم معلومات مضللة تفيد بأن المكونات موردة من مصنع أمريكي مؤهل ومعتمد.\n\nوبحسب الاتهامات، كانت القطع تصنع في تركيا ثم تشحن إلى الولايات المتحدة لإعادة تغليفها وإخفاء منشئها، قبل توريدها بوصفها مكونات محلية مطابقة للمواصفات. وقال محققون إن اختبارات لاحقة أظهرت أن بعض القطع لا تفي بالمعايير المطلوبة، وإنها كانت مخصصة لأنظمة عسكرية حساسة تشمل حاملات طائرات وغواصات ومركبات مدرعة تابعة لمشاة البحرية ودبابات \"إم1 أبرامز\".\n\nويواجه شيمشيك اتهامات تشمل التآمر للاحتيال على الحكومة الأمريكية، والاحتيال الإلكتروني، وغسل الأموال، والتآمر لانتهاك ضوابط التصدير، إلى جانب مخالفات لقانون إصلاح مراقبة الصادرات وقانون مراقبة تصدير الأسلحة. وتبقى هذه اتهامات لم تثبت أمام القضاء بعد.\n\nكشف مسؤولون أمريكيون مطلعون عن إخضاع نحو 50 من كبار ضباط وموظفي هيئة الأركان المشتركة في الجيش الأمريكي لاختبارات كشف الكذب (بوليغراف) خلال الشهر الماضي.\n\nيرى الخبير تشارلز ليستر أن سوريا يجب أن تكون ساحة تعاون لا ساحة منافسة، محذرا من انهيار التفاهمات الأمنية بين أنقرة وتل أبيب، وضرورة استعادتها بسرعة لمنع وقوع المواجهة."}, {"guid": "aa5d9782-a9b4-11f1-9076-b91a3278f929", "title": "بوتين يصف محادثات السلام مع مبعوثي ترامب بـأنها \"مفيدة للغاية\"... وزيارة كييف تنتظر زيلينسكي", "summary": "أجرى الرئيس الروسي فلاديمير بوتين في موسكو السبت محادثات استمرت أكثر من ثلاث ساعات مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، وصفها الكرملين بأنها \"مفيدة للغاية\"، لكن دون الإشارة إلى أي تقدم ملموس نحو إنهاء الحرب في أوكرانيا. ويغادر المبعوثان إلى كييف الأحد للقاء الرئيس الأوكراني فولوديمير زي", "link": "https: 83%D9%8A%D8%A9-%D8%B5%D9%88%D8%B1%D8%A9%D9%81%D9%8A%D8%AF%D9%8A%D9%88/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9cf9bf423604717071f635.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788672616, "detail": "أفادت صحيفة \"نيويورك بوست\" الأمريكية بمصرع طفلين وإصابة اثنين آخرين بالغين في حادث تحطم طائرة خاصة صغيرة في ولاية كاليفورنيا الأمريكية.\n\nوذكرت الصحيفة أن \"طفلين لقيا مصرعهما بعد تحطم طائرة صغيرة في منطقة فريسنو يوم السبت... ونُقل شخصان آخران بالغان إلى المستشفى في حالة حرجة\".\n\nوتحطمت الطائرة، التي كانت تقل أربعة أشخاص، بالقرب من نهر سان جواكين قبيل الساعة الثانية ظهرا بالتوقيت المحلي.\n\nوصرح توني بوتي، مسؤول الإعلام في مكتب شرطة مقاطعة فريسنو، لصحيفة \"كاليفورنيا بوست\" بأن السلطات تلقت بلاغا حوالي الساعة 1:50 ظهرا عن تحطم طائرة بالقرب من الطرف الشمالي لشارع بليث، قرب منتزه سييرا سكاي.\n\nوأشارت الصحيفة إلى أن أسباب المأساة غير معروفة حاليا.\n\nتحطمت طائرة مقاتلة من طراز \"إف-4 فانتوم\" تابعة للقوات الجوية اليونانية اليوم السبت خلال عرض جوي في قاعدة تاناغرا الجوية شمال العاصمة أثينا.\n\nأفادت شبكة \"سي بي إس\" بأن طائرة تابعة لخفر السواحل الأمريكي، كانت تقل وزير الأمن الداخلي ماركواي مولين وكبار المسؤولين في الوزارة، اضطرت إلى الهبوط اضطراريا إثر تعطل أحد محركاتها.\n\nأفادت بيانات منصة تتبع الرحلات الجوية \"Flightradar24\" بأن طائرة نقل عسكرية أمريكية أقلعت من ألمانيا، وأرسلت رمز الطوارئ الدولي \"Squawk 7700\" أثناء تحليقها فوق جمهورية التشيك."}, {"guid": "https://arabic.rt.com/world/1829214-%D9%83%D9%84%D8%A7%D9%85-%D9%81%D8%A7%D8%B1%D8%BA-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D8%AA%D8%B9%D9%84%D9%82-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D8%AF%D8%B9%D9%88%D8%A7%D8%AA-%D8%A7%D9%84%D8%A3%D9%88%D8%B1%D9%88%D8%A8%D9%8A%D8%A9-%D9%84%D9%84%D8%B3%D9%84%D8%A7%D9%85-%D9%88%D8%A7%D9%84%D8%AD%D9%88%D8%A7%D8%B1-%D9%85%D8%B9-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7/", "title": "\"كلام فارغ\".. موسكو تعلق على الدعوات الأوروبية للسلام والحوار مع روسيا", "summary": "اعتبر نائب وزير الخارجية الروسي ألكسندر غروشكو أن تصريحات السياسيين الأوروبيين بشأن تسوية النزاع في أوكرانيا والانخراط في حوار مع روسيا غير جدية ولا معنى لها.", "link": "https://arabic.rt.com/world/1829214-%D9%83%D9%84%D8%A7%D9%85-%D9%81%D8%A7%D8%B1%D8%BA-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D8%AA%D8%B9%D9%84%D9%82-%D8%B9%D9%84%D9%89-%D8%A7%D9%84%D8%AF%D8%B9%D9%88%D8%A7%D8%AA-%D8%A7%D9%84%D8%A3%D9%88%D8%B1%D9%88%D8%A8%D9%8A%D8%A9-%D9%84%D9%84%D8%B3%D9%84%D8%A7%D9%85-%D9%88%D8%A7%D9%84%D8%AD%D9%88%D8%A7%D8%B1-%D9%85%D8%B9-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9cf44542360471b76047ca.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788671538, "detail": "اعتبر نائب وزير الخارجية الروسي ألكسندر غروشكو أن تصريحات السياسيين الأوروبيين بشأن تسوية النزاع في أوكرانيا والانخراط في حوار مع روسيا غير جدية ولا معنى لها.\n\nوقال في تصريح لوكالة \"نوفوستي\": \"ما نراه في الاتحاد الأوروبي من دعوات للسلام، وتصريحات حول الحوار مع روسيا - ليس إلا كلاما فارغا، وإثارة ضجيج إعلامي لا طائل منه\".\n\nوأوضح الدبلوماسي أن سياسة الاتحاد الأوروبي في الواقع تتوافق مع سياسة حلف \"الناتو\"، وتتمثل في محاولة إطالة أمد النزاع في أوكرانيا بهدف إلحاق هزيمة استراتيجية بموسكو.\n\nوفي الآونة الأخيرة، تزايدت الدعوات لاستئناف الحوار مع روسيا في الدول الأوروبية. وصرح رئيس المجلس الأوروبي بأنه يناقش هذه المسألة مع أعضاء التكتل، فيما أرسل الرئيس الفرنسي إيمانويل ماكرون مستشارا دبلوماسيا له إلى موسكو.\n\nودعا رئيس الوزراء البلجيكي بارت دي ويفر إلى استئناف الاتصالات مع روسيا من أجل استيراد موارد الطاقة في ظل الأزمة العالمية. وصرح الرئيس الفنلندي ألكسندر ستوب، مرارا بأن الأوروبيين سيضطرون إلى بدء الحوار مع موسكو عاجلا أم آجلا.\n\nوسبق أن أشار مسؤولون روس إلى أن روسيا لا تأخذ تصريحات الاتحاد الأوروبي بشأن إمكانية استئناف الحوار معها على محمل الجد، وأنه لن يكون هناك حوار متكامل بين روسيا والاتحاد الأوروبي إن لم تأخذ بروكسل مصالح موسكو بعين الاعتبار.\n\nوأكدت موسكو مرارا انفتاحها على الحوار مع الاتحاد الأوروبي و\"الناتو\" على أساس متكافئ، إذا تخلى الأوروبيون عن سياساتهم المعادية لروسيا والنهج نحو عسكرة أوروبا.\n\nدعا الرئيس السلوفاكي بيتر بيليغريني إلى تكثيف الجهود الغربية لإقامة حوار مباشر مع روسيا.\n\nأرجع المحلل السياسي والاقتصادي الأمريكي بول كريغ روبرتس سبب التوجّه الأوروبي لاستئناف الحوار مع روسيا إلى نقص مخزونات الوقود مع اقتراب فصل الشتاء."}, {"guid": "https://arabic.rt.com/business/1829204-%D8%B5%D8%A7%D8%AF%D8%B1%D8%A7%D8%AA-%D9%86%D9%81%D8%B7-%D8%A7%D9%84%D8%B4%D8%B1%D9%82-%D8%A7%D9%84%D8%A3%D9%88%D8%B3%D8%B7-%D8%AA%D9%87%D8%A8%D8%B7-39-%D9%81%D9%8A-%D8%A3%D8%BA%D8%B3%D8%B7%D8%B3-%D9%88%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D9%85%D8%B1%D8%B4%D8%AD%D8%A9-%D9%84%D9%84%D8%A8%D9%82%D8%A7%D8%A1-%D8%B9%D9%86%D8%AF-%D8%A7%D9%84%D8%B5%D9%81%D8%B1/", "title": "صادرات نفط الشرق الأوسط تهبط 39% في أغسطس وإيران مرشحة للبقاء عند الصفر", "summary": "أظهرت بيانات جديدة أن صادرات الخام من دول رئيسية في الشرق الأوسط انخفضت بنسبة 39% خلال أغسطس 2026، مقارنة بخط الأساس المسجل في يناير وفبراير والبالغ 18.5 مليون برميل يوميا.", "link": "https://arabic.rt.com/business/1829204-%D8%B5%D8%A7%D8%AF%D8%B1%D8%A7%D8%AA-%D9%86%D9%81%D8%B7-%D8%A7%D9%84%D8%B4%D8%B1%D9%82-%D8%A7%D9%84%D8%A3%D9%88%D8%B3%D8%B7-%D8%AA%D9%87%D8%A8%D8%B7-39-%D9%81%D9%8A-%D8%A3%D8%BA%D8%B3%D8%B7%D8%B3-%D9%88%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D9%85%D8%B1%D8%B4%D8%AD%D8%A9-%D9%84%D9%84%D8%A8%D9%82%D8%A7%D8%A1-%D8%B9%D9%86%D8%AF-%D8%A7%D9%84%D8%B5%D9%81%D8%B1/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9cee044c59b7589044c897.jpg", "category": "اقتصاد", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788670859, "detail": "أظهرت بيانات جديدة أن صادرات الخام من دول رئيسية في الشرق الأوسط انخفضت بنسبة 39% خلال أغسطس 2026، مقارنة بخط الأساس المسجل في يناير وفبراير والبالغ 18.5 مليون برميل يوميا.\n\nووفق منصة \"تانكر تراكرز\" لتتبع حركة ناقلات النفط، فقد بلغ العجز في الصادرات خلال أغسطس نحو 7.2 ملايين برميل يوميا، مقارنة بعجز بلغ 12.4 مليون برميل يوميا في مايو/أيار، الذي سجل أكبر تراجع خلال العام بنسبة 67% عن خط الأساس.\n\nوتشمل البيانات السعودية والعراق وإيران والكويت وسلطنة عمان والإمارات وقطر، وسط توقعات بأن تستعيد معظم هذه الدول جزءا من صادراتها خلال الأشهر المقبلة.\n\nغير أن صادرات إيران، التي يبلغ خط أساسها 1.68 مليون برميل يوميا، قد تبقى عند مستوى الصفر في المدى المنظور، وفق التقديرات، إلى حين التوصل إلى اتفاق يتيح استئناف تدفقات النفط.\n\nوأدى التراجع الحاد في صادرات النفط الإيرانية إلى زيادة الضغوط على أسواق الطاقة والاقتصاد الإيراني، إذ دفع غياب الخام الإيراني المصافي الآسيوية، ولا سيما في الصين، إلى البحث عن بدائل ورفع المنافسة على الإمدادات المتاحة.\n\nوفي المقابل، أظهرت بيانات تتبع الناقلات تفاوتا في قدرة دول المنطقة على استعادة صادراتها خلال أغسطس إذ عادت صادرات الإمارات تقريبا إلى مستويات ما قبل الاضطرابات، بينما سجل العراق والكويت تراجعا بنحو 36% والسعودية وقطر بنحو 48%، في حين بقيت صادرات إيران شبه متوقفة. وتشير تقديرات تتبع الشحنات إلى أن صادرات الخام الإيرانية هبطت إلى نحو 220-255 ألف برميل يوميا في أغسطس، مقارنة بنحو مليوني برميل يوميا في مارس، مع استمرار تعطل عبور الشحنات عبر مضيق هرمز.\n\nأكد الحرس الثوري الإيراني أنه ما زال يسيطر على مضيق هرمز بالكامل، وشدد على أنه لن يسمح بعبور السفن دون تنسيق مع قواته..\n\nباتت قوافل ضخمة من الشاحنات والصهاريج المحملة بالنفط تجوب الطرقات الصحراوية السورية، في مشهد يعكس تحولاً استراتيجياً في خريطة تدفق الطاقة بالمنطقة.\n\nبحث وزير الخارجية المصري بدر عبد العاطي مع نظيره العماني بدر بن حمد البوسعيدي مستجدات الأوضاع الإقليمية والجهود الرامية لاحتواء التوتر الراهن واستعادة الهدوء والاستقرار بالمنطقة."}, {"guid": "https://arabic.rt.com/world/1829212-%D9%85%D9%82%D8%AA%D9%84-%D8%B4%D8%AE%D8%B5-%D9%88%D8%A7%D8%AD%D8%AF-%D9%81%D9%8A-%D9%87%D8%AC%D9%88%D9%85-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A-%D8%B9%D9%84%D9%89-%D9%85%D9%82%D8%A7%D8%B7%D8%B9%D8%A9-%D8%A8%D9%8A%D9%84%D8%BA%D9%88%D8%B1%D9%88%D8%AF-%D8%A7%D9%84%D8%B1%D9%88%D8%B3%D9%8A%D8%A9/", "title": "مقتل مدني وإصابة امرأة في هجوم أوكراني بمسيرة على مقاطعة بيلغورود الروسية", "summary": "أعلنت السلطات الروسية في مقاطعة بيلغورود أن طائرة مسيرة تابعة للقوات الأوكرانية شنت هجوما على سيارة في قرية غولوفتشينو بالمقاطعة، ما أسفر عن مقتل شخص وإصابة آخر.", "link": "https://arabic.rt.com/world/1829212-%D9%85%D9%82%D8%AA%D9%84-%D8%B4%D8%AE%D8%B5-%D9%88%D8%A7%D8%AD%D8%AF-%D9%81%D9%8A-%D9%87%D8%AC%D9%88%D9%85-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A-%D8%B9%D9%84%D9%89-%D9%85%D9%82%D8%A7%D8%B7%D8%B9%D8%A9-%D8%A8%D9%8A%D9%84%D8%BA%D9%88%D8%B1%D9%88%D8%AF-%D8%A7%D9%84%D8%B1%D9%88%D8%B3%D9%8A%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9cf2474236047174657dba.jpg", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788670787, "detail": "أعلنت السلطات الروسية في مقاطعة بيلغورود أن طائرة مسيرة تابعة للقوات الأوكرانية شنت هجوما على سيارة في قرية غولوفتشينو بالمقاطعة، ما أسفر عن مقتل شخص وإصابة آخر.\n\nوجاء في بيان نشرته هيئة العمل الإقليمية على منصة \"ماكس\": \"الليلة، هاجمت طائرة مسيرة سيارة في قرية غولوفتشينو بمنطقة غرايفورون. وقتل الرجل في مكان الحادث متأثرا بجراحه. أما المرأة، فقد أصيبت بجرح كبير في البطن، وكسور في ذراعيها، وعدة جروح بشظايا. وهي في حالة خطيرة في مستشفى بوريسوف الإقليمي المركزي\".\n\nوقد أفاد القائم بأعمال حاكم مقاطعة بيلغورود الروسية ألكسندر شوفاييف أمس بمقتل 5 أشخاص وإصابة 14 آخرين في المقاطعة خلال الـ 24 ساعة الماضية نتيجة هجمات شنتها القوات الأوكرانية.\n\nوتستهدف القوات المسلحة الأوكرانية يوميا الأحياء السكنية والمنشآت المدنية الحيوية والمؤسسات الصناعة ومرافق الطاقة في المناطق الحدودية الروسية وفي العمق، باستخدام الطائرات المسيّرة والصواريخ.\n\nأفادت وزارة الدفاع الروسية بأن جنودا أوكرانيين في محور دوبروبوليه بمقاطعة دونيتسك يستخدمون رموز QR على منشورات روسية للتواصل مع القوات الروسية تمهيدا للاستسلام طوعا.\n\nوصف المدير الأسبق لوكالة الاستخبارات المركزية الأمريكية، الجنرال المتقاعد ديفيد بتريوس، النزاع في أوكرانيا بأنه \"أبرز مختبر عسكري\" سيحدد طبيعة العمليات القتالية في القرن الـ 21.\n\nأفادت غرفة العمليات في مقاطعة بيلغورود الروسية بأن شخصا واحدا لقى حتفه وأصيب آخر، اليوم السبت، بعد هجوم بطائرة مسيرة أطلقتها القوات الأوكرانية."}, {"guid": "https://www.bbc.com/arabic/articles/c0re194zqxno#0", "title": "تبادل الهجمات بين إيران والولايات المتحدة يستهدف سفناً ويهدد إمدادات النفط", "summary": "قال الحرس الثوري الإيراني إنه استهدف \"مسيّرة بحرية أمريكية\"، في وقت تبادلت فيه القوات الإيرانية والأمريكية هجمات على سفن في المياه المحيطة بإيران، بينها ناقلات نفط.", "link": "https://www.bbc.com/arabic/articles/c0re194zqxno?at_medium=RSS&at_campaign=rss", "image": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/a0ef/live/9a74f420-a980-11f1-b109-879e35c24276.jpg", "category": "اقتصاد", "source_id": "bbc-arabic", "source_name": "بي بي سي عربي", "source_cat": "دولية", "published": 1788670768, "detail": "BBC News, عربيإذهب الى المحتوىرئيسيةشاهداستمعأقسامرئيسيةأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتتبادل الهجمات بين إيران والولايات المتحدة يستهدف سفناً ويهدد إمدادات النفطصدر الصورة، Getty Images\n\nقال الحرس الثوري الإيراني، الأحد، إنه استهدف \"مسيّرة بحرية أمريكية كانت تحاول دخول مضيق هرمز\"، وذلك بعد ساعات من تبادل طهران وواشنطن هجمات.\n\nونقلت هيئة الإذاعة والتلفزيون الإيرانية الرسمية ،عن الحرس الثوري قوله إن قواته البحرية استهدفت \"سفينة عسكرية أمريكية مسيّرة، كانت تحاول دخول المنطقة المحمية من مضيق هرمز.\n\nبينما أجرى وزير الخارجية الإيراني، عباس عراقجي، اتصالين هاتفيين منفصلين مع نظيريه السعودي والتركي، بحث خلالهما التطورات الإقليمية والجهود الدبلوماسية الرامية إلى خفض التوترات في المنطقة، وفق رويترز.\n\nونفذت القوات الأمريكية والإيرانية، السبت، هجمات متبادلة استهدفت سفناً في المياه المحيطة بإيران، من بينها ثلاث ناقلات نفط إيرانية قالت الولايات المتحدة إنها استهدفتها، وثلاث ناقلات قالت طهران إنها هاجمتها أثناء إبحارها عبر \"مسارات غير مصرح بها\" في مضيق هرمز.\n\nوقالت القيادة المركزية الأمريكية إنها استهدفت ثلاث سفن إيرانية، من بينها واحدة قبالة ساحل جزيرة خرج، القريبة من مركز رئيسي لصادرات النفط الإيرانية، وذلك بعدما أطلق الحرس الثوري الإيراني صواريخ باليستية باتجاه سفينتين تابعتين للبحرية الأمريكية.\n\nوقال قائد القيادة المركزية الأمريكية، الأدميرال براد كوبر: \"لتكن الرسالة إلى الحرس الثوري واضحة: إذا أطلقتم النار على سفينتين من سفننا، فسنفرض عليكم كلفة اقتصادية أكبر، عبر إخراج ثلاث من سفنكم من الخدمة\".\n\nورد الحرس الثوري بالتهديد بتكثيف الهجمات على السفن العسكرية الأمريكية في المنطقة، وقال لاحقاً إنه استهدف ثلاث ناقلات، بالإضافة إلى ثلاث سفن مرتبطة بالولايات المتحدة في مناطق أخرى.\n\nوقالت بحرية الحرس الثوري، في بيان بثه التلفزيون الإيراني الرسمي: \"لا تنخدعوا بالجيش الأمريكي 'الإرهابي'، وامتنعوا عن أي تحرك مشبوه يهدف إلى المرور عبر ممرات مائية غير مصرح بها\"، مضيفة: \"وإلا فسيتم استهدافكم\"."}, {"guid": "https://arabic.rt.com/sport/1829207-%D8%A8%D8%B9%D9%85%D8%B1-41-%D8%B9%D8%A7%D9%85%D8%A7-%D9%85%D9%88%D8%AF%D8%B1%D9%8A%D8%AA%D8%B4-%D9%8A%D8%AD%D8%B3%D9%85-%D9%85%D8%B5%D9%8A%D8%B1%D9%87-%D9%85%D8%B9-%D9%83%D8%B1%D9%88%D8%A7%D8%AA%D9%8A%D8%A7/", "title": "بعمر 41 عاما.. مودريتش يحسم مصيره مع كرواتيا", "summary": "حسم سلافين بيليتش المدير الفني لمنتخب كرواتيا الجدل بشأن مستقبل لوكا مودريتش مع المنتخب، مؤكدا استمرار قائد الفريق في تمثيل بلاده خلال الفترة المقبلة.", "link": "https://arabic.rt.com/sport/1829207-%D8%A8%D8%B9%D9%85%D8%B1-41-%D8%B9%D8%A7%D9%85%D8%A7-%D9%85%D9%88%D8%AF%D8%B1%D9%8A%D8%AA%D8%B4-%D9%8A%D8%AD%D8%B3%D9%85-%D9%85%D8%B5%D9%8A%D8%B1%D9%87-%D9%85%D8%B9-%D9%83%D8%B1%D9%88%D8%A7%D8%AA%D9%8A%D8%A7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9cf08a423604717071f62e.png", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788670660, "detail": "حسم سلافين بيليتش المدير الفني لمنتخب كرواتيا الجدل بشأن مستقبل لوكا مودريتش مع المنتخب، مؤكدا استمرار قائد الفريق في تمثيل بلاده خلال الفترة المقبلة.\n\nوكانت التكهنات قد أثيرت حول إمكانية اعتزال مودريتش اللعب الدولي عقب خروج منتخب كرواتيا أمام البرتغال من منافسات كأس العالم 2026.\n\nوقال بيليتش في تصريحات نشرها الموقع الرسمي للاتحاد الكرواتي لكرة القدم: \"بالطبع قرار لوكا يسعدني للغاية فنحن جميعا ندرك ما يقدمه لكرواتيا داخل الملعب وخارجه\".\n\nلوكا مودريتش مستمر مع منتخب كرواتيا ولم يعتزل اللعب دوليا سلافين بيليتش في تصريحات نشرها موقع الاتحاد الكرواتي: \"بالطبع، قرار لوكا هذا يسعدني للغاية، فنحن جميعا ندرك ما يقدمه لكرواتيا، داخل الملعب وخارجه\". \"أتطلع للعمل معه مجددا بعد 14 عاما، ونتشارك طموحا قويا للحفاظ على مكانة… pic.twitter.com/WGQil8h896\n\nوأضاف: \"أتطلع للعمل معه مجددا بعد 14 عاما ونتشارك طموحا قويا للحفاظ على مكانة كرواتيا كفريق ناجح ومتميز ينافس أفضل منتخبات العالم\".\n\nويستعد منتخب كرواتيا لخوض 4 مباريات في دوري الأمم الأوروبية أمام منتخبات التشيك وإنجلترا وإسبانيا ذهابا وإيابا خلال شهري سبتمبر وأكتوبر.\n\nأفادت شبكة \"ريليفو\" الإسبانية بأن إدارة نادي ريال مدريد الإسباني تعمل حاليا على خطة توديع أسطورته الكرواتية لوكا مودريتش بأفضل طريقة ممكنه قبل انتهاء عقده الصيف المقبل."}, {"guid": "https://arabic.rt.com/middle_east/1829211-%D8%B9%D8%B1%D8%A7%D9%82%D8%AC%D9%8A-%D9%8A%D8%A8%D8%AD%D8%AB-%D9%85%D8%B9-%D9%86%D8%B8%D9%8A%D8%B1%D9%8A%D9%87-%D8%A7%D9%84%D8%B3%D8%B9%D9%88%D8%AF%D9%8A-%D9%88%D8%A7%D9%84%D8%AA%D8%B1%D9%83%D9%8A-%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%82%D8%B1%D8%A7%D8%B1-%D8%A7%D9%84%D8%A5%D9%82%D9%84%D9%8A%D9%85%D9%8A-%D9%88%D8%A3%D9%85%D9%86-%D8%A7%D9%84%D9%85%D9%84%D8%A7%D8%AD%D8%A9-%D9%81%D9%8A-%D9%87%D8%B1%D9%85%D8%B2/", "title": "عراقجي يبحث مع نظيريه السعودي والتركي الاستقرار الإقليمي وأمن الملاحة في هرمز", "summary": "أعلنت الخارجية الإيرانية أن الوزير عباس عراقجي أجرى اتصالات هاتفية منفصلة مع نظيريه السعودي فيصل بن فرحان والتركي هاكان فيدان تناولت آخر التطورات الإقليمية.", "link": "https://arabic.rt.com/middle_east/1829211-%D8%B9%D8%B1%D8%A7%D9%82%D8%AC%D9%8A-%D9%8A%D8%A8%D8%AD%D8%AB-%D9%85%D8%B9-%D9%86%D8%B8%D9%8A%D8%B1%D9%8A%D9%87-%D8%A7%D9%84%D8%B3%D8%B9%D9%88%D8%AF%D9%8A-%D9%88%D8%A7%D9%84%D8%AA%D8%B1%D9%83%D9%8A-%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%82%D8%B1%D8%A7%D8%B1-%D8%A7%D9%84%D8%A5%D9%82%D9%84%D9%8A%D9%85%D9%8A-%D9%88%D8%A3%D9%85%D9%86-%D8%A7%D9%84%D9%85%D9%84%D8%A7%D8%AD%D8%A9-%D9%81%D9%8A-%D9%87%D8%B1%D9%85%D8%B2/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9cf12342360471d71bd4ad.jpg", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788670614, "detail": "أعلنت الخارجية الإيرانية أن الوزير عباس عراقجي أجرى اتصالات هاتفية منفصلة مع نظيريه السعودي فيصل بن فرحان والتركي هاكان فيدان تناولت آخر التطورات الإقليمية.\n\nوقالت الوزارة إن عراقجي بحث مع الوزيرين القضايا الثنائية، إلى جانب المستجدات الإقليمية، وما وصفته طهران بـ\"انعدام الأمن المفروض\" في مضيق هرمز نتيجة التحركات الأمريكية.\n\nوفي اتصاله مع فيدان، ناقش عراقجي آخر تطورات المفاوضات الجارية مع الولايات المتحدة، بحسب مصادر دبلوماسية تركية نقلتها وكالة الأناضول، من دون الكشف عن مزيد من التفاصيل بشأن مضمون المحادثات.\n\nوتأتي الاتصالات في ظل تصاعد التوتر الإقليمي واستمرار المخاوف المرتبطة بأمن الملاحة وحرية حركة السفن في مضيق هرمز، أحد أبرز الممرات البحرية لتجارة الطاقة العالمية.\n\nأكد الحرس الثوري الإيراني أنه ما زال يسيطر على مضيق هرمز بالكامل، وشدد على أنه لن يسمح بعبور السفن دون تنسيق مع قواته..\n\nرد وزير الخارجية الإيراني عباس عراقجي، على تصريحات نظيره الأردني أيمن الصفدي، متسائلا عن \"المدة التي ينبغي أن تنتظرها إيران للرد على دولة لا تحترم سيادة الدول الأخرى\".\n\nأعلن وزير خارجية إيران عباس عراقجي عن إجراء نقاشات خلاقة مع نظيره القطري محمد بن عبد الرحمن آل ثاني، مؤكدا أن إعادة الدبلوماسية لمسارها يتطلب من واشنطن التخلي عن الضغط."}, {"guid": "CBMiTEFVX3lxTFBmMms5aGFMTTBHT3FHdDhMdEEwRnNsX3NQMU5jUE9CcDBCeWFnZHRZUDBzRlgtNUloc2prV3hMbTUtdEhCRTdzWTFrdlM", "title": "بسبب سوء النتائج.. أليغري وأربيلوا ودي زيربي في خطر - وكالة الانباء العراقية (واع)", "summary": "بسبب سوء النتائج.. أليغري وأربيلوا ودي زيربي في خطر &nbsp;&nbsp; وكالة الانباء العراقية (واع)", "link": "https://news.google.com/rss/articles/CBMiTEFVX3lxTFBmMms5aGFMTTBHT3FHdDhMdEEwRnNsX3NQMU5jUE9CcDBCeWFnZHRZUDBzRlgtNUloc2prV3hMbTUtdEhCRTdzWTFrdlM?oc=5", "image": "", "category": "أخبار", "source_id": "ina", "source_name": "الوكالة العراقية (العراق)", "source_cat": "وكالة رسمية", "published": 1788669733, "detail": ""}, {"guid": "https://arabic.rt.com/world/1829209-%D9%84%D8%A7-%D8%AA%D9%85%D9%84%D9%83-%D8%A3%D9%8A-%D8%B3%D9%8A%D8%B7%D8%B1%D8%A9-%D8%B9%D9%84%D9%89-%D8%AD%D8%AF%D9%88%D8%AF%D9%87%D8%A7-%D8%AA%D8%B1%D8%A7%D9%85%D8%A8-%D9%8A%D8%B5%D9%81-%D9%88%D8%B6%D8%B9-%D8%A5%D8%B3%D8%A8%D8%A7%D9%86%D8%A8%D8%A7-%D8%A8%D8%A7%D9%84%D9%85%D8%AD%D8%B2%D9%86/", "title": "\"لا تملك أي سيطرة على حدودها\".. ترامب يصف وضع إسبانيا بالمحزن", "summary": "شن الرئيس الأمريكي دونالد ترامب هجوما جديدا على إسبانيا بسبب طريقة تعاملها مع قضية الهجرة، واصفا إياها بأنها دولة \"لا تملك أي سيطرة على حدودها\".", "link": "https://arabic.rt.com/world/1829209-%D9%84%D8%A7-%D8%AA%D9%85%D9%84%D9%83-%D8%A3%D9%8A-%D8%B3%D9%8A%D8%B7%D8%B1%D8%A9-%D8%B9%D9%84%D9%89-%D8%AD%D8%AF%D9%88%D8%AF%D9%87%D8%A7-%D8%AA%D8%B1%D8%A7%D9%85%D8%A8-%D9%8A%D8%B5%D9%81-%D9%88%D8%B6%D8%B9-%D8%A5%D8%B3%D8%A8%D8%A7%D9%86%D8%A8%D8%A7-%D8%A8%D8%A7%D9%84%D9%85%D8%AD%D8%B2%D9%86/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9cec6642360471e0427b50.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788669482, "detail": "شن الرئيس الأمريكي دونالد ترامب هجوما جديدا على إسبانيا بسبب طريقة تعاملها مع قضية الهجرة، واصفا إياها بأنها دولة \"لا تملك أي سيطرة على حدودها\".\n\nوفي منشور عبر موقع \"تروث سوشيال\"، كتب ترامب: \"أمر محزن للغاية ما يحدث في إسبانيا، بلد لا يملك أي سيطرة على حدوده\".\n\nوقبل يوم وجه ترامب انتقادات حادة إلى إسبانيا، حيث وصف في حديث لقناة \"جي بي نيوز\" البريطانية تدفق حشود المهاجرين إلى مدينة سبتة في نهاية يوليو الماضي بأنه \"غزو لبلد\"، معتبرا أن ما وقع عند حدود سبتة يعكس فشلا في تدبير ملف الهجرة، وأضاف أن إسبانيا \"ستصبح بلدا مفلسا\".\n\nوفي وقت سابق هذا الشهر شهدت سبتة وعدة مدن إسبانية احتجاجات عارمة شارك فيها مئات الآلاف من المواطنين، مطالبين حكومة بيدرو سانشيز باتخاذ إجراءات ضد الهجرة غير الشرعية، على خلفية تدفق المهاجرين إلى سبتة.\n\nوأثارت أحداث سبتة قلقا شديدا في أوروبا، حيث انتقد عدد من مسؤولي الاتحاد الأوروبي سياسة الهجرة الإسبانية. ويوم الجمعة، دعت السلطات في عدة دول أعضاء في الاتحاد الأوروبي، من بينها إيطاليا وجمهورية التشيك وفنلندا والدنمارك، إلى تعليق عضوية إسبانيا في منطقة شنغن مؤقتا.\n\nمددت الحكومتان الإيطالية والإسبانية الضوابط المفروضة على الحدود الجوية والبحرية بينهما لمدة أسبوعين، في خطوة تعكس استمرار تداعيات أزمة الهجرة التي تشهدها سبتة.\n\nدافعت رئيسة الوزراء الايطالية جورجا ميلوني، عن قرارها تعليق اتفاقية شنغن مع إسبانيا، مؤكدة أن غالبية الدول الأوروبية تتفق مع قرار روما.\n\nحذر الرئيس الأمريكي دونالد ترامب من أن بلاده قد تواجه \"غزوا\" غير مسبوق للمهاجرين غير الشرعيين يفوق ما تشهده إسبانيا إذا لم يفز الجمهوريون في انتخابات التجديد النصفي المقبلة."}, {"guid": "1ada93c4-a993-11f1-b0f1-87b276c17541", "title": "مباشر: ضربات أمريكية على ناقلات إيرانية ورد من الحرس الثوري باستهداف سفن", "summary": "بعد نحو شهر من الهدوء النسبي، عاد التصعيد العسكري بين الولايات المتحدة وإيران مجددا إلى الواجهة، إذ أعلنت واشنطن استهداف 3 ناقلات نفط مرتبطة بالحرس الثوري ردا على محاولة استهداف سفينتين حربيتين أمريكيتين، فيما قال الحرس الثوري إنه رد باستهداف ثلاث ناقلات نفط وثلاث سفن مرتبطة بالولايات المتحدة. ويأتي", "link": "https://www.france24.com/ar/%D8%A7%D9%84%D8%B4%D8%B1%D9%82-%D8%A7%D9%84%D8%A3%D9%88%D8%B3%D8%B7/20260906-%D9%85%D8%A8%D8%A7%D8%B4%D8%B1-%D8%A5%D9%8A%D8%B1%D8%A7%D9%86-%D8%A7%D9%84%D9%88%D9%84%D8%A7%D9%8A%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%AA%D8%AD%D8%AF%D8%A9-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84-%D9%85%D8%B6%D9%8A%D9%82-%D9%87%D8%B1%D9%85%D8%B2-%D8%BA%D8%B2%D8%A9-%D9%84%D8%A8%D9%86%D8%A7%D9%86-%D8%B7%D9%87%D8%B1%D8%A7%D9%86-%D8%AA%D8%B1%D8%A7%D9%85%D8%A8", "image": "https://s.france24.com/media/display/e879df14-a958-11f1-b8b6-005056a90284/w:1024/p:16x9/2026-09-05T151319Z-1338977548-RC22DNA4YL38-RTRMADP-3-IRAN-CRISIS-CENTCOM.jpg", "category": "أخبار", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788669366, "detail": ""}, {"guid": "https://arabic.rt.com/world/1829203-%D8%A7%D9%84%D8%AF%D9%81%D8%A7%D8%B9-%D8%A7%D9%84%D8%B1%D9%88%D8%B3%D9%8A%D8%A9-%D8%AA%D8%B2%D8%A7%D9%8A%D8%AF-%D8%A7%D8%B3%D8%AA%D8%AE%D8%AF%D8%A7%D9%85-%D8%AC%D9%86%D9%88%D8%AF-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D9%8A%D9%86-%D8%B1%D9%85%D9%88%D8%B2-qr-%D9%84%D9%84%D8%AA%D9%88%D8%A7%D8%B5%D9%84-%D9%88%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D8%B3%D9%84%D8%A7%D9%85-%D9%81%D9%8A%D8%AF%D9%8A%D9%88/", "title": "الدفاع الروسية: تزايد استخدام جنود أوكرانيين رموز QR للتواصل والاستسلام (فيديو)", "summary": "أفادت وزارة الدفاع الروسية بأن جنودا أوكرانيين في محور دوبروبوليه بمقاطعة دونيتسك يستخدمون رموز QR على منشورات روسية للتواصل مع القوات الروسية تمهيدا للاستسلام طوعا.", "link": "https://arabic.rt.com/world/1829203-%D8%A7%D9%84%D8%AF%D9%81%D8%A7%D8%B9-%D8%A7%D9%84%D8%B1%D9%88%D8%B3%D9%8A%D8%A9-%D8%AA%D8%B2%D8%A7%D9%8A%D8%AF-%D8%A7%D8%B3%D8%AA%D8%AE%D8%AF%D8%A7%D9%85-%D8%AC%D9%86%D9%88%D8%AF-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D9%8A%D9%86-%D8%B1%D9%85%D9%88%D8%B2-qr-%D9%84%D9%84%D8%AA%D9%88%D8%A7%D8%B5%D9%84-%D9%88%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D8%B3%D9%84%D8%A7%D9%85-%D9%81%D9%8A%D8%AF%D9%8A%D9%88/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9ce83c423604722276d68b.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788669051, "detail": "أفادت وزارة الدفاع الروسية بأن جنودا أوكرانيين في محور دوبروبوليه بمقاطعة دونيتسك يستخدمون رموز QR على منشورات روسية للتواصل مع القوات الروسية تمهيدا للاستسلام طوعا.\n\nوقال قائد فرقة الطائرات المسيرة التابع لقوات \"المركز\" إيليا ميلنيكوف، إن القوات الأوكرانية تستخدم هذه الرموز على نطاق واسع، مشيرا إلى تسجيل حالات استسلام طوعي بعد التواصل عبرها.\n\nوأضاف: \"هناك حالات جماعية من الاستسلام الطوعي في صفوف القوات الأوكرانية وليست فردية حيث ينقل فيها العدو معلومات عبر رمز QR الموجود على المنشور، ثم يستسلم للأسر ويضع سلاحه طوعا\".\n\nوأوضح ميلنيكوف أن العسكريين الروس يوزعون يوميا آلاف المنشورات بواسطة الطائرات المسيرة، مضيفا أن المنشورات تنتشر بكثافة في محور دوبروبوليه وأن القوات الأوكرانية تتفاعل معها.\n\nوأشار إلى أن الوضع في هذا القطاع لا يزال صعبا بالنسبة إلى الوحدات الأوكرانية، في ظل اضطراب خطوط الإمداد واستمرار ارتفاع الخسائر.\n\nبدأ الجيش الروسي في تطهير المنطقة التي حاصر فيها تجمعا كبيرا للقوات الأوكرانية قرب مدينة فولشانسك في مقاطعة خاركوف، حسبما أفادت وكالة \"نوفوستي\" نقلا عن مصدر عسكري.\n\nأكد الخبير العسكري الروسي أندريه ماروتشكو، أن المقاتلين الروس يخترقون يوميا دفاعات القوات الأوكرانية في مدن سلافيانسك وكراماتورسك ودروزكوفكا.\n\nكشفت مصادرعسكرية روسية عن مقتل جنديين أوكرانيين برصاص قناصة أوكرانيين أثناء محاولتهما الاستسلام لقوات \"الشمال\" الروسية في منطقة كودييفكا بمقاطعة خاركوف شرق أوكرانيا.\n\nأكد قائد قوات \"أحمد\" الروسية الخاصة أبتي علاء الدينوف، أن إخراج الأسرى الأوكرانيين من خط الجبهة يكاد يكون مستحيلا، وذلك لأن القوات الأوكرانية تقوم بتصفية كل من يحاول الاستسلام."}, {"guid": "https://arabic.rt.com/world/1829208-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D8%A5%D9%8A%D8%B1%D8%A7%D9%86%D9%8A-%D9%8A%D8%B9%D9%84%D9%86-%D9%85%D9%87%D8%A7%D8%AC%D9%85%D8%A9-%D8%B2%D9%88%D8%B1%D9%82-%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A-%D9%85%D8%B3%D9%8A%D8%B1/", "title": "الحرس الثوري الإيراني يعلن مهاجمة زورق أمريكي مسير", "summary": "أعلن الحرس الثوري الإيراني مهاجمة زورق أمريكي مسير كان يعتزم دخول المنطقة المحمية في مضيق هرمز.", "link": "https://arabic.rt.com/world/1829208-%D8%A7%D9%84%D8%AD%D8%B1%D8%B3-%D8%A7%D9%84%D8%AB%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D8%A5%D9%8A%D8%B1%D8%A7%D9%86%D9%8A-%D9%8A%D8%B9%D9%84%D9%86-%D9%85%D9%87%D8%A7%D8%AC%D9%85%D8%A9-%D8%B2%D9%88%D8%B1%D9%82-%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A-%D9%85%D8%B3%D9%8A%D8%B1/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9ce920423604717146d620.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788668843, "detail": "أعلن الحرس الثوري الإيراني مهاجمة زورق أمريكي مسير كان يعتزم دخول المنطقة المحمية في مضيق هرمز.\n\nوجاء في بيان العلاقات العامة في الحرس الثوري الإيراني: \"قامت البحرية البطلة في الحرس الثوري الإسلامي بمهاجمة زورق مسير تابع للجيش الأمريكي الإرهابي، كان يعتزم دخول المنطقة المحمية في مضيق هرمز\".\n\nوأكد الحرس الثوري أن أي \"حركة يائسة للعدو تخضع لمراقبة الرجال الشجعان في البحرية التابعة لحرس الثورة الإسلامية، وسيتم الرد عليها بحزم وقوة\".\n\nوشدد على أن \"مضيق هرمز، هذا الممر المائي الاستراتيجي، يقع تحت إدارة جمهورية إيران الإسلامية، وسيتم التعامل بحزم مع أي حركة من جانب العدو القاتل للأطفال\".\n\nويأتي هذا البيان بعد ساعات من إعلان العلاقات العامة للحرس الثوري الإيراني، استهداف حاملة طائرات ومدمرة تابعتين للجيش الأمريكي. حيث أشار إلى أن \"السفينتين العسكريتين الأمريكيتين فرتا من منطقة الاشتباك بعد تعرضهما لأضرار\".\n\nوقبل ذلك كان قد صرح المتحدث باسم مقر \"خاتم الأنبياء\" الإيراني إبراهيم ذو الفقاري بأن إيران ستشن ضربات جديدة وأكثر قوة ضد السفن العسكرية الأمريكية إذا استمرت في مضايقة السفن الإيرانية ومهاجمتها.\n\nصرح قائد قوة القدس في الحرس الثوري الإيراني العميد إسماعيل قاآني، بأن القوة العملياتية والدفاعية للمقاومة وحزب الله ستؤدي بلا شك إلى إزالة إسرائيل من المنطقة.\n\nأفادت صحيفة \"نيويورك تايمز\" نقلا عن تقارير استخباراتية أمريكية، بأن إيران باتت أكثر جرأة خلال ضرب قواعد أمريكية بالشرق الأوسط، وتخطط لمواصلة عملياتها العسكرية لعدة أشهر.\n\nأكدت بحرية الحرس الثوري الإيراني، مساء اليوم السبت، استهدافها 3 ناقلات نفط كانت تسلك مسارا غير مصرح به في مضيق هرمز و3 سفن أمريكية في مناطق أخرى، ردا على مهاجمة ناقلات نفط إيرانية.\n\nصرح المتحدث باسم مقر \"خاتم الأنبياء\" الإيراني إبراهيم ذو الفقاري بأن إيران ستشن ضربات جديدة وأكثر قوة ضد السفن العسكرية الأمريكية إذا استمرت في مضايقة السفن الإيرانية ومهاجمتها."}, {"guid": "https://arabic.rt.com/sport/1829206-%D8%A5%D8%B5%D8%A7%D8%A8%D8%A9-%D9%85%D8%B1%D9%88%D8%B9%D8%A9-%D9%84%D8%A3%D9%8A%D9%88%D8%A8-%D8%A7%D9%84%D9%83%D8%B9%D8%A8%D9%8A-%D9%81%D9%8A-%D8%A7%D9%84%D8%AF%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D9%8A%D9%88%D9%86%D8%A7%D9%86%D9%8A-%D9%81%D9%8A%D8%AF%D9%8A%D9%88/", "title": "إصابة مروعة لأيوب الكعبي في الدوري اليوناني (فيديو)", "summary": "تلقى نادي أولمبياكوس اليوناني ضربة موجعة بعد تعرض المهاجم الدولي المغربي أيوب الكعبي لإصابة قوية خلال مباراة فريقه أمام فولوس لحساب الجولة الثالثة من الدوري اليوناني الممتاز.", "link": "https://arabic.rt.com/sport/1829206-%D8%A5%D8%B5%D8%A7%D8%A8%D8%A9-%D9%85%D8%B1%D9%88%D8%B9%D8%A9-%D9%84%D8%A3%D9%8A%D9%88%D8%A8-%D8%A7%D9%84%D9%83%D8%B9%D8%A8%D9%8A-%D9%81%D9%8A-%D8%A7%D9%84%D8%AF%D9%88%D8%B1%D9%8A-%D8%A7%D9%84%D9%8A%D9%88%D9%86%D8%A7%D9%86%D9%8A-%D9%81%D9%8A%D8%AF%D9%8A%D9%88/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9ce6334c59b76a4653e88c.jpg", "category": "رياضة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788668044, "detail": "تلقى نادي أولمبياكوس اليوناني ضربة موجعة بعد تعرض المهاجم الدولي المغربي أيوب الكعبي لإصابة قوية خلال مباراة فريقه أمام فولوس لحساب الجولة الثالثة من الدوري اليوناني الممتاز.\n\nوحسم التعادل الإيجابي 1-1 نتيجة مباراة فولوز وأولمبياكوس حيث سجل غوتا سيلفا هدف رفاق أيوب الكعبي الوحيد بركلة جزاء في الدقيقة 45+1.\n\nجاءت ركلة الجزاء التي سجل منها أولمبياكوس في لقطة سقوط الكعبي حيث انطلق الدولي المغربي لداخل منطقة الجزاء قبل أن يصطدم بماريوس سيامبانيس حارس مرمى فولوز الذي تسبب في إصابته.\n\nوظهر أيوب الكعبي الذي يعد من أفضل لاعبي أولمبياكوس والدوري اليوناني في حالة من الحزن كما بدا يصرخ من الألم قبل أن يتدخل الطاقم الطبي لتقديم الإسعافات اللازمة.\n\nنهاية مسيرة أيوب الكعبي مع الأسف..💔💔 pic.twitter.com/zDG384vTaL\n\nواضطر الكعبي إلى مغادرة أرضية الملعب محمولا على نقالة في مشهد أثار قلق زملائه والجهاز الفني والجماهير وسط ترقب لمعرفة مدى خطورة الإصابة ومدة غيابه عن الملاعب.\n\nوخلال ثلاثة مواسم بقميص أولمبياكوس خاض المهاجم الدولي المغربي 133 مباراة، نجح خلالها في تسجيل 82 هدفا إلى جانب صناعة 14 هدفا لزملائه.\n\nوفي الدوري اليوناني الممتاز سجل الكعبي 54 هدفا بمعدل 18 هدفا في الموسم الواحد كما توج مع أولمبياكوس بلقبي الدوري اليوناني وكأس اليونان عام 2025."}, {"guid": "https://arabic.rt.com/world/1829205-%D9%87%D8%A7%D9%86%D8%AA%D8%B1-%D8%A8%D8%A7%D9%8A%D8%AF%D9%86-%D9%84%D8%A7-%D9%8A%D8%B3%D8%AA%D8%A8%D8%B9%D8%AF-%D8%A7%D9%84%D8%AA%D8%B1%D8%B4%D8%AD-%D9%84%D8%A7%D9%86%D8%AA%D8%AE%D8%A7%D8%A8%D8%A7%D8%AA-%D8%A7%D9%84%D8%B1%D8%A6%D8%A7%D8%B3%D8%A9-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D8%A9/", "title": "هانتر بايدن لا يستبعد الترشح للرئاسة الأمريكية ويحدد الشريحة التي سيمثلها", "summary": "لم يستبعد هانتر، نجل الرئيس الأمريكي السابق جو بايدن، المشاركة في السباق على منصب رئيس الولايات المتحدة، مشيرا إلى أنه يستطيع تمثيل مصالح فئة المدمنين.", "link": "https://arabic.rt.com/world/1829205-%D9%87%D8%A7%D9%86%D8%AA%D8%B1-%D8%A8%D8%A7%D9%8A%D8%AF%D9%86-%D9%84%D8%A7-%D9%8A%D8%B3%D8%AA%D8%A8%D8%B9%D8%AF-%D8%A7%D9%84%D8%AA%D8%B1%D8%B4%D8%AD-%D9%84%D8%A7%D9%86%D8%AA%D8%AE%D8%A7%D8%A8%D8%A7%D8%AA-%D8%A7%D9%84%D8%B1%D8%A6%D8%A7%D8%B3%D8%A9-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9ce0ba423604717146d61b.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788666549, "detail": "لم يستبعد هانتر، نجل الرئيس الأمريكي السابق جو بايدن، المشاركة في السباق على منصب رئيس الولايات المتحدة، مشيرا إلى أنه يستطيع تمثيل مصالح فئة المدمنين.\n\nوقال في مقابلة مع الصحفي جون كاتسيماتيديس عندما سئل عن طموحاته الرئاسية: \"في حال حصلت على دعمكم، فقد أضطر إلى (الترشح في الانتخابات)\".\n\nوأشار بايدن الابن، الذي اعترف بمعاناته من إدمان المخدرات في الماضي، إلى من قد تكون قاعدته الشعبية. وأضاف: \"أكثر ما يقلقني هو 50 مليون أمريكي ما زالوا يعانون من الإدمان\".\n\nوأكد أن تولي منصب الرئاسة الأمريكية يتطلب من الرئيس الاعتراف بسيادة القانون.\n\nوتابع هانتر بايدن، الذي كان لديه سجل جنائي وضمن له والده العفو عند انتهاء ولايته: \"هذا هو شرطي الأساسي لأي مرشح\".\n\nولم يبد نجل الرئيس الأمريكي السابق التزاما قاطعا بالترشح للمنصب، وشدد على أنه يعتقد أن لدى الديمقراطيين العديد من المرشحين الأكفاء.\n\nكشف هانتر بايدن أن والده، الرئيس الأمريكي السابق جو بايدن، كان يزوره في منزله بواشنطن خلال فترة إدمانه، وكان يصل بموكب رسمي يضم سيارات دفع رباعي وعناصر من جهاز الخدمة السرية.\n\nوجه رئيس اللجنة القضائية بمجلس الشيوخ الأمريكي، تشاك غراسلي، اتهاما خطيرا لمكتب التحقيقات الفيدرالي حول إخفاء وثائق تتعلق بالتحقيق في فساد محتمل للرئيس السابق جو بايدن وعائلته.\n\nأكد المبعوث الرئاسي الروسي الخاص كيريل دميترييف، أن دعوته السابقة إلى هانتر بايدن للكشف عن دور عائلته في قضايا الفساد في أوكرانيا أثبتت \"وجاهتها مع مرور الوقت\".\n\nشن هانتر بايدن نجل الرئيس الأمريكي السابق جو بايدن، هجوما حادا على رئيس الوزراء الإسرائيلي بنيامين نتنياهو واصفا إياه بـ \"الشر المتجسد\"."}, {"guid": "https://arabic.rt.com/world/1829201-%D8%A7%D9%84%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84%D9%8A-%D9%8A%D8%AC%D8%B1%D9%8A-%D9%85%D9%86%D8%A7%D9%88%D8%B1%D8%A9-%D9%85%D9%81%D8%A7%D8%AC%D8%A6%D8%A9-%D9%84%D9%84%D8%AA%D8%B9%D8%A7%D9%85%D9%84-%D9%85%D8%B9-%D8%B3%D9%8A%D9%86%D8%A7%D8%B1%D9%8A%D9%88-%D9%85%D8%AA%D8%B9%D8%AF%D8%AF-%D8%A7%D9%84%D8%AC%D8%A8%D9%87%D8%A7%D8%AA/", "title": "الجيش الإسرائيلي يجري مناورة مفاجئة للتعامل مع سيناريو متعدد الجبهات", "summary": "أطلق الجيش الإسرائيلي الأحد، تمرينا مفاجئا على مستوى هيئة الأركان لفحص الجاهزية لحدث واسع ومتعدد الجبهات، حيث جرى استدعاء القادة في جميع الهيئات والأذرع واستنفار قوات الاحتياط.", "link": "https://arabic.rt.com/world/1829201-%D8%A7%D9%84%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84%D9%8A-%D9%8A%D8%AC%D8%B1%D9%8A-%D9%85%D9%86%D8%A7%D9%88%D8%B1%D8%A9-%D9%85%D9%81%D8%A7%D8%AC%D8%A6%D8%A9-%D9%84%D9%84%D8%AA%D8%B9%D8%A7%D9%85%D9%84-%D9%85%D8%B9-%D8%B3%D9%8A%D9%86%D8%A7%D8%B1%D9%8A%D9%88-%D9%85%D8%AA%D8%B9%D8%AF%D8%AF-%D8%A7%D9%84%D8%AC%D8%A8%D9%87%D8%A7%D8%AA/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9cda2542360471d71bd4a5.jpg", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788665750, "detail": "أطلق الجيش الإسرائيلي الأحد، تمرينا مفاجئا على مستوى هيئة الأركان لفحص الجاهزية لحدث واسع ومتعدد الجبهات، حيث جرى استدعاء القادة في جميع الهيئات والأذرع واستنفار قوات الاحتياط.\n\nواصل الجيش الاسرائيلي توغلاته اليومية في مناطق الجنوب السوري وخصوصا عند خط فض الاشتباك.\n\nنشر الجيش الإسرائيلي اليوم مشاهد تظهر استهداف قواته لعناصر وبنى تحتية تابعة لـ\"حزب الله\" في جنوب لبنان."}, {"guid": "https://arabic.rt.com/middle_east/1829202-%D8%A7%D9%84%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84%D9%8A-%D9%8A%D8%B5%D8%AF%D8%B1-%D8%A5%D9%86%D8%B0%D8%A7%D8%B1%D8%A7-%D8%B9%D8%A7%D8%AC%D9%84%D8%A7-%D9%84%D8%B3%D9%83%D8%A7%D9%86-%D8%B9%D8%B1%D8%A8%D8%B5%D8%A7%D9%84%D9%8A%D9%85-%D8%AC%D9%86%D9%88%D8%A8-%D9%84%D8%A8%D9%86%D8%A7%D9%86-%D8%A8%D8%B6%D8%B1%D9%88%D8%B1%D8%A9-%D8%A7%D9%84%D8%A5%D8%AE%D9%84%D8%A7%D8%A1/", "title": "الجيش الإسرائيلي يستهدف بلدة عربصاليم ويشن غارات جنوب لبنان ردا على مسيرتين لحزب الله", "summary": "أصدر الجيش الإسرائيلي الأحد، إنذارا عاجلا لسكان بلدة عربصاليم جنوب لبنان، متهما حزب الله بانتهاك اتفاق وقف النار، وشن غارات على البلدة كما استهدف منطقة النبطية.", "link": "https://arabic.rt.com/middle_east/1829202-%D8%A7%D9%84%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84%D9%8A-%D9%8A%D8%B5%D8%AF%D8%B1-%D8%A5%D9%86%D8%B0%D8%A7%D8%B1%D8%A7-%D8%B9%D8%A7%D8%AC%D9%84%D8%A7-%D9%84%D8%B3%D9%83%D8%A7%D9%86-%D8%B9%D8%B1%D8%A8%D8%B5%D8%A7%D9%84%D9%8A%D9%85-%D8%AC%D9%86%D9%88%D8%A8-%D9%84%D8%A8%D9%86%D8%A7%D9%86-%D8%A8%D8%B6%D8%B1%D9%88%D8%B1%D8%A9-%D8%A7%D9%84%D8%A5%D8%AE%D9%84%D8%A7%D8%A1/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9ceb174c59b757bb739839.png", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788665084, "detail": "أصدر الجيش الإسرائيلي الأحد، إنذارا عاجلا لسكان بلدة عربصاليم جنوب لبنان، متهما حزب الله بانتهاك اتفاق وقف النار، وشن غارات على البلدة كما استهدف منطقة النبطية.\n\nوقال الجيش الإسرائيلي في بيان إنه \"في أعقاب انتهاك لاتفاق وقف إطلاق النار من قبل حزب الله، بعد إطلاق مسيرة مفخخة باتجاه قوات جيش الدفاع، فإن نشاط حزب الله يجبر جيش الدفاع على العمل ضده بقوة. جيش الدفاع لا ينوي المساس بكم\". وأضاف: \"نطالب جميع السكان المتواجدين في المبنى المحدد بالأحمر في الخريطة المرفقة والمباني المجاورة له بضرورة الإخلاء: ‏أنتم تتواجدون بالقرب من منشأة تابعة لحزب الله والتي سيقوم الجيش الإسرائيلي بالعمل ضدها. فحرصا على سلامتكم وسلامة أبناء عائلاتكم، عليكم ترك المبنى والمباني المجاورة له فورا والابتعاد عنها لمسافة لا تقل عن 300 متر. البقاء في منطقة المبنى المحدد بالأحمر يعرضكم للخطر\".\n\nوفي بيان آخر قال الجيش الإسرائيلي إن \"حزب الله أطلق في وقت سابق من صباح اليوم (الأحد)، مسيرتين انتحاريتين باتجاه قوات الجيش التي تسيطر على المنطقة الأمنية في جنوب لبنان. وقد أطلق المقاتلون النار باتجاه إحدى المسيرتين واعترضوها. لا إصابات في صفوف قواتنا، ويهاجم جيش الدفاع في هذه الأثناء في جنوب لبنان ردا على ذلك\". وأضاف: \"يعمل جيش الدفاع في هذه الأثناء، وسيواصل العمل بقوة في مواجهة المحاولات المتكررة لتنظيم حزب الله للمساس بقواتنا\".\n\nولاحقا استهدف الطيران الإسرائيلي المبنى المهدد في بلدة عربصاليم جنوب لبنان والمنطقة المحيطة به.\n\nفي غضون ذلك، أفاد مراسلنا بأن الطيران الإسرائيلي شن غارتين على بلدة النبطية الفوقا ومحيط بلدة كفررمان جنوب لبنان.\n\nوقال مراسلنا إن الغارة الإسرائيلية التي استهدفت بلدة كفررمان في قضاء النبطية جنوب لبنان إلى تدمير مبنى سكني من ثلاث طبقات.\n\nكشفت وزارة الصحة اللبنانية في بيان لها اليوم السبت، حصيلة ضحايا العدوان الإسرائيلي على البلاد منذ 2 مارس الماضي.\n\nأعلن الجيش الإسرائيلي أنه هاجم أمس الجمعة عناصر وبنى تحتية تابعة لـ\"حزب الله\" في جنوب لبنان ردا على إطلاق مسيرة نحو قواته في المنطقة الأمنية."}, {"guid": "22dccf88-a9a2-11f1-bdf1-2d4d0b888b86", "title": "بعد 4 أيام من الترقب.. انتشال جثة الطفل أيوب من بئر في الجزائر", "summary": "أعلنت السلطات الجزائرية انتشال جثة الطفل أيوب البالغ 10 سنوات بعد أربعة أيام من سقوطه في بئر أرتوازية جافة بولاية البيّض جنوب غرب البلاد. وأثارت الحادثة تعاطفا واسعا ومتابعة كبيرة عبر مواقع التواصل، فيما واجهت فرق الحماية المدنية صعوبات كبيرة بسبب عمق البئر وضيق قطرها ووجود الطفل تحت طبقة سميكة من ا", "link": "https://www.france24.com/ar/%D8%A7%D9%84%D8%A3%D8%AE%D8%A8%D8%A7%D8%B1-%D8%A7%D9%84%D9%85%D8%BA%D8%A7%D8%B1%D8%A8%D9%8A%D8%A9/20260906-%D8%A7%D9%84%D8%AC%D8%B2%D8%A7%D8%A6%D8%B1-%D9%86%D9%87%D8%A7%D9%8A%D8%A9-%D9%85%D8%A3%D8%B3%D8%A7%D9%88%D9%8A%D8%A9-%D8%B9%D9%85%D9%84%D9%8A%D8%A9-%D8%A5%D9%86%D9%82%D8%A7%D8%B0-%D8%A7%D9%84%D8%B7%D9%81%D9%84-%D8%A3%D9%8A%D9%88%D8%A8-%D8%B3%D9%82%D9%88%D8%B7-%D9%81%D9%8A-%D8%A8%D8%A6%D8%B1-%D8%A3%D8%B1%D8%AA%D9%88%D8%A7%D8%B2%D9%8A%D8%A9", "image": "https://s.france24.com/media/display/565fa436-a9a0-11f1-b205-005056bfb2b6/w:1024/p:16x9/AFP-20260905-C7EV94F-v2-MidRes-AlgeriaAccident.jpg", "category": "أخبار", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788664924, "detail": ""}, {"guid": "https://arabic.rt.com/world/1829200-%D8%A5%D9%86%D8%AF%D9%88%D9%86%D9%8A%D8%B3%D9%8A%D8%A7-%D8%B1%D9%85%D8%A7%D8%AF-%D8%A8%D8%B1%D9%83%D8%A7%D9%86-%D8%A3%D9%86%D8%A7%D9%83-%D9%83%D8%B1%D8%A7%D9%83%D8%A7%D8%AA%D8%A7%D9%88-%D9%8A%D9%88%D9%82%D9%81-209-%D8%B1%D8%AD%D9%84%D8%A7%D8%AA-%D9%81%D9%8A-%D9%85%D8%B7%D8%A7%D8%B1-%D8%AC%D8%A7%D9%83%D8%B1%D8%AA%D8%A7-%D8%A7%D9%84%D8%B1%D8%A6%D9%8A%D8%B3%D9%8A/", "title": "إندونيسيا: رماد بركان أناك كراكاتاو يوقف 209 رحلات في مطار جاكرتا الرئيسي", "summary": "تسبب ثوران بركان أناك كراكاتاو في إندونيسيا، الأحد، في تعليق عمليات الطيران مؤقتا بمطار سوكارنو-هاتا الدولي، وإلغاء أو تأثر 209 رحلات، بسبب انتشار الرماد البركاني.", "link": "https://arabic.rt.com/world/1829200-%D8%A5%D9%86%D8%AF%D9%88%D9%86%D9%8A%D8%B3%D9%8A%D8%A7-%D8%B1%D9%85%D8%A7%D8%AF-%D8%A8%D8%B1%D9%83%D8%A7%D9%86-%D8%A3%D9%86%D8%A7%D9%83-%D9%83%D8%B1%D8%A7%D9%83%D8%A7%D8%AA%D8%A7%D9%88-%D9%8A%D9%88%D9%82%D9%81-209-%D8%B1%D8%AD%D9%84%D8%A7%D8%AA-%D9%81%D9%8A-%D9%85%D8%B7%D8%A7%D8%B1-%D8%AC%D8%A7%D9%83%D8%B1%D8%AA%D8%A7-%D8%A7%D9%84%D8%B1%D8%A6%D9%8A%D8%B3%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9cd6d14c59b757be332ff7.png", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788664180, "detail": "تسبب ثوران بركان أناك كراكاتاو في إندونيسيا، الأحد، في تعليق عمليات الطيران مؤقتا بمطار سوكارنو-هاتا الدولي، وإلغاء أو تأثر 209 رحلات، بسبب انتشار الرماد البركاني.\n\nوأعلن المطار، عبر حسابه على \"إنستغرام\"، تمديد تعليق الرحلات حتى الساعة 9:30 صباحا بالتوقيت المحلي، بعد أن كان مقرراً انتهاء الإجراء في الساعة 5:30 صباحاً، وذلك لأسباب تتعلق بسلامة الملاحة الجوية. وذكرت السلطات أن الرحلات المتأثرة شملت 160 رحلة داخلية و39 رحلة دولية و10 رحلات شحن.\n\nوقالت وزارة النقل الإندونيسية إن البركان بدأ الثوران في وقت متأخر من الجمعة، فيما رُصد الرماد البركاني في محيط المطار صباح الأحد. وأفادت هيئة الأرصاد الجوية بأن الرماد بلغ ارتفاعات تصل إلى نحو 6 آلاف متر على الجانب المواجه لجزيرة جاوة، بينما وصل عمود الرماد إلى نحو 15 ألف متر في اتجاه سومطرة وأجزاء من إقليم بانتن.\n\nودعت الوكالة الوطنية لتخفيف آثار الكوارث السكان إلى التزام الهدوء ورفع مستوى الحيطة، ونصحت باستخدام الكمامات ووسائل حماية العينين عند تساقط الرماد، وتخفيف الأنشطة الخارجية، وتغطية مصادر المياه، والحذر أثناء القيادة بسبب تدني مستوى الرؤية.\n\nوأفادت وسائل إعلام محلية بتعليق أنشطة في عدد من المدارس، وشكاوى من تهيج العينين لدى سكان وطلاب جراء الرماد، فيما ألغى بعض الصيادين رحلاتهم. وأكدت وكالة الكوارث، السبت، عدم وجود خطر وشيك لوقوع موجات تسونامي ناجمة عن نشاط البركان.\n\nاقترح رئيس إندونيسيا برابوو سوبيانتو على روسيا تعزيز التعاون مع بلاده حيث سرد باللغة الروسية مثلا روسيا يقول إن \"شخصا واحدا في الميدان ليس بمحارب\" (المرء قليل بنفسه كثير بأخويه).\n\nتجددت احتجاجات إندونيسيا المطالبة بمكافحة الفساد وسط انتشار أمني واسع، وأصدرت السفارة الأمريكية إنذارا لمواطنيها بتجنب مناطق التوتر."}, {"guid": "https://arabic.rt.com/world/1829199-%D8%A3%D9%83%D8%B3%D9%8A%D9%88%D8%B3-%D9%85%D8%B3%D8%A4%D9%88%D9%84-%D8%A7%D9%84%D8%B9%D9%82%D9%88%D8%A8%D8%A7%D8%AA-%D9%81%D9%8A-%D8%A7%D9%84%D8%AE%D8%B2%D8%A7%D9%86%D8%A9-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D8%A9-%D8%B1%D8%A7%D9%81%D9%82-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%88%D9%83%D9%88%D8%B4%D9%86%D8%B1-%D8%A5%D9%84%D9%89-%D9%85%D9%88%D8%B3%D9%83%D9%88/", "title": "\"أكسيوس\": مسؤول العقوبات في الخزانة الأمريكية رافق ويتكوف وكوشنر إلى موسكو", "summary": "أفاد موقع \"أكسيوس\" بأن جين لانغ، المسؤول القائم بأعمال ملف العقوبات في وزارة الخزانة الأمريكية، انضم إلى المبعوث الأمريكي ستيف ويتكوف وجاريد كوشنر خلال زيارتهما إلى موسكو.", "link": "https://arabic.rt.com/world/1829199-%D8%A3%D9%83%D8%B3%D9%8A%D9%88%D8%B3-%D9%85%D8%B3%D8%A4%D9%88%D9%84-%D8%A7%D9%84%D8%B9%D9%82%D9%88%D8%A8%D8%A7%D8%AA-%D9%81%D9%8A-%D8%A7%D9%84%D8%AE%D8%B2%D8%A7%D9%86%D8%A9-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A%D8%A9-%D8%B1%D8%A7%D9%81%D9%82-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%88%D9%83%D9%88%D8%B4%D9%86%D8%B1-%D8%A5%D9%84%D9%89-%D9%85%D9%88%D8%B3%D9%83%D9%88/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9cd524423604717071f624.jpeg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788663644, "detail": "أفاد موقع \"أكسيوس\" بأن جين لانغ، المسؤول القائم بأعمال ملف العقوبات في وزارة الخزانة الأمريكية، انضم إلى المبعوث الأمريكي ستيف ويتكوف وجاريد كوشنر خلال زيارتهما إلى موسكو.\n\nوبحسب الموقع، شارك لانغ في اجتماع تمهيدي مع كيريل دميترييف، مبعوث الرئيس الروسي فلاديمير بوتين، لكنه لم يحضر اللقاء الذي جمع ويتكوف وكوشنر ببوتين.\n\nوتشير مشاركة مسؤول من وزارة الخزانة إلى أن ملف العقوبات الأمريكية المفروضة على روسيا كان ضمن الموضوعات التي نوقشت خلال الزيارة، إلى جانب الجهود الرامية إلى التوصل لتسوية للأزمة الأوكرانية.\n\nوقال مسؤول في البيت الأبيض إن ويتكوف وكوشنر التقيا بوتين في إطار مساع لدفع أجندة الرئيس دونالد ترامب للسلام في أوكرانيا، موضحا أن مسؤولين من مجلس الأمن القومي ووزارتي الخارجية والخزانة شاركوا في مناقشة مقترحات لإنهاء النزاع.\n\nوأضاف المسؤول أن الجانبين ناقشا \"خططا جوهرية\" للخطوات المقبلة، من المقرر الإعلان عنها خلال الأسابيع القادمة، مشيرا إلى أن ويتكوف وكوشنر يتطلعان إلى عقد اجتماعات مماثلة في أوكرانيا.\n\nصرّح الرئيس فلاديمير بوتين في اجتماع مع المفاوضين الأمريكيين، بأن روسيا لم تتفق مع أوكرانيا على وقف إطلاق نار أوسع نطاقا لمدة ثلاثة أيام لوقف الهجمات على العاصمتين.\n\nأكد الرئيس الروسي فلاديمير بوتين أن موسكو ستبذل قصارى جهدها لضمان أمن المفاوضين الأمريكيين في موسكو، وذلك خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر.\n\nأعلن الرئيس الروسي فلاديمير بوتين مناقشة \"جميع مكونات وجوانب\" النزاع الأوكراني خلال لقائه مع المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، في الاجتماع السادس من نوعه معهما."}, {"guid": "https://arabic.rt.com/technology/1828315-%D8%A7%D9%84%D8%AE%D8%B5%D9%88%D8%A8%D8%A9-%D8%B1%D8%BA%D8%A8%D8%A9-%D8%A7%D9%84%D9%85%D8%B1%D8%A3%D8%A9-%D8%A7%D9%82%D8%AA%D9%86%D8%A7%D8%A1-%D8%A7%D9%84%D8%B3%D9%84%D8%B9-%D8%A7%D9%84%D9%81%D8%A7%D8%AE%D8%B1%D8%A9/", "title": "دراسة تكشف علاقة بين فترة الإباضة وتفضيل العلامات الفاخرة", "summary": "كشفت دراسة جديدة أن التغيرات الهرمونية المرتبطة بفترة الإباضة قد تزيد ميل النساء إلى استخدام رموز الرفاهية البارزة بهدف لفت انتباه الرجال.", "link": "https://arabic.rt.com/technology/1828315-%D8%A7%D9%84%D8%AE%D8%B5%D9%88%D8%A8%D8%A9-%D8%B1%D8%BA%D8%A8%D8%A9-%D8%A7%D9%84%D9%85%D8%B1%D8%A3%D8%A9-%D8%A7%D9%82%D8%AA%D9%86%D8%A7%D8%A1-%D8%A7%D9%84%D8%B3%D9%84%D8%B9-%D8%A7%D9%84%D9%81%D8%A7%D8%AE%D8%B1%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9959b5423604264f2e2fab.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788662193, "detail": "كشفت دراسة جديدة أن التغيرات الهرمونية المرتبطة بفترة الإباضة قد تزيد ميل النساء إلى استخدام رموز الرفاهية البارزة بهدف لفت انتباه الرجال.\n\nوأجرى الدراسة إيكيونغ كيم من جامعة جيونبوك الوطنية في جمهورية كوريا وزملاؤه، الذين بحثوا ما إذا كانت النساء يبدين تفضيلا أكبر للسلع الفاخرة قرب فترة الإباضة، عندما ترتفع مستويات هرمون الإستروجين وتبلغ الخصوبة ذروتها.\n\nوشملت الدراسة ثلاث تجارب لاختبار هذه الفرضية. ففي التجربة الأولى، طلب الباحثون من 70 طالبة جامعية لا يستخدمن وسائل منع الحمل الهرمونية رسم شعارات علامات فاخرة، مثل غوتشي وشانيل ولويس فويتون. وأظهرت النتائج أن المشاركات رسمن الشعارات بأحجام أكبر قرب فترة الإباضة مقارنة بالفترات الأقل خصوبة.\n\nدراسة: الإجهاد الحراري يضعف الوظيفة التناسلية للذكور وفي التجربة الثانية، سأل الباحثون 1486 امرأة عن نواياهن لشراء منتجات من علامات فاخرة وغير فاخرة. وأظهرت النتائج أن النساء خلال فترة الإباضة كن أكثر ميلا إلى اقتناء السلع الفاخرة التي يمكن استخدامها أو عرضها أمام الآخرين، مقارنة بالمنتجات التي تستخدم في الأماكن الخاصة.\n\nأما التجربة الثالثة، التي شملت 966 مشاركة، فاختبرت ما إذا كان اعتقاد النساء بأن الرجال يلاحظون هذه الإشارات يؤثر في اختياراتهن. وكانت النساء القريبات من فترة الإباضة أكثر ميلا إلى اختيار قسيمة شراء بقيمة 100 دولار من علامة فاخرة، مثل بولو رالف لورين، بدلا من علامة غير فاخرة.\n\nلكن عندما اطلعت المشاركات على معلومات تشير إلى أن الرجال لا يلاحظون ملابس المصممين التي ترتديها النساء، تراجع تفضيلهن للعلامة الفاخرة، حتى لدى القريبات من فترة الإباضة.\n\nويرى الباحثون أن هذه النتائج تشير إلى أن زيادة الميل إلى اقتناء السلع الفاخرة قرب فترة الإباضة قد لا تعكس مجرد تفضيل للمنتجات باهظة الثمن، بل قد تكون مرتبطة بالرغبة في استخدام إشارات اجتماعية واضحة لجذب انتباه الرجال.\n\nومع ذلك، أكد الباحثون أن الدراسة لا تثبت وجود علاقة سببية مباشرة بين الإباضة وتفضيل السلع الفاخرة، وأن النتائج لا تنطبق بالضرورة على جميع المواقف التي تحاول فيها النساء جذب انتباه الرجال.\n\nكشف علماء عن مصدر غير متوقع للتنوع الجيني في الحيوانات المنوية البشرية، يحدث في مرحلة مبكرة من تطورها أكثر مما كان يعتقد سابقا.\n\nتدفع موجة الاهتمام المتزايد بالصحة كثيرا من الناس إلى البحث عن طرق لتحسين النوم والمظهر والأداء البدني والذهني، وحتى مستويات الهرمونات والخصوبة."}, {"guid": "https://arabic.rt.com/technology/1828269-%D8%A7%D9%84%D8%B5%D9%8A%D9%86-%D8%A7%D9%83%D8%AA%D8%B4%D8%A7%D9%81-%D9%85%D9%82%D8%A8%D8%B1%D8%A9-%D8%AE%D9%8A%D9%88%D9%84-%D9%85%D8%AC%D9%86%D8%AD%D8%A9-/", "title": "الصين.. اكتشافات أثرية نادرة عمرها 1300 عام", "summary": "اكتشف علماء الآثار في منطقة شينجيانغ الذاتية الحكم في الصين مقبرة غنية تعود إلى عهد أسرة تانغ، يقدر عمرها بنحو 1300 عام.", "link": "https://arabic.rt.com/technology/1828269-%D8%A7%D9%84%D8%B5%D9%8A%D9%86-%D8%A7%D9%83%D8%AA%D8%B4%D8%A7%D9%81-%D9%85%D9%82%D8%A8%D8%B1%D8%A9-%D8%AE%D9%8A%D9%88%D9%84-%D9%85%D8%AC%D9%86%D8%AD%D8%A9-/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a993ab24c59b7112c468135.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788662162, "detail": "اكتشف علماء الآثار في منطقة شينجيانغ الذاتية الحكم في الصين مقبرة غنية تعود إلى عهد أسرة تانغ، يقدر عمرها بنحو 1300 عام.\n\nومن أبرز الاكتشافات فيها هي رسوم جدارية ملونة فريدة تصور خيولا مرقطة مجنحة، بالإضافة إلى قطع نقدية معدنية بيزنطية وفارسية، وأثاث خشبي نادر، وقطع فاخرة. وقد أُدرجت دراسة مقبرة أطلق عليها \"بادام الشرقي\" ضمن أهم الاكتشافات الأثرية في الصين، وفقا لما أفادت به مجلة \"ميديفالستس\" الإلكترونية.\n\nبعد 165 مليون عام.. باحثون يعيدون إنشاء أصوات حشرات غابات العصر الجوراسي وأُجريت حفريات واسعة النطاق في محيط بلدة تورفان، بالقرب من المدينة القديمة غاوتشانغ، في الفترة من 2022 إلى 2025. وقد فحص الباحثون إجمالي 27 مدفنا تعود لفترات الممالك الست عشرة وأسرة تانغ، واستخرجوا أكثر من 600 قطعة ثمينة تعود إلى الحضارة المادة الصينية.\n\nوأثار قبر (M20) من عهد تانغ أكبر اهتمام المتخصصين. وعلى الرغم من الأضرار التي لحقت بالهيكل، تمكن الباحثون من استخراج قاعدة التابوت الخشبي ونقلها إلى المختبر. وتبيّن أن هذه القطعة الأثرية هي أكثر أسرة التوابيت المطلية من عصر تانغ اكتمالا على الإطلاق.\n\nورسم الفنانون القدماء على اثنتي عشرة لوحة مقوسة مخلوقات أسطورية مجنحة منها الأسود، والنمور، والخيول. وجذب انتباه الخبراء بصورة خاصة حصانان، أحدهما أزرق والآخر أخضر، وتغطي أجسادهما زخارف مميزة. ونُقشت هذه الأشكال ذات الأجنحة العريضة، والعُرف الكثيفة، والذيول المُنطلقة، باستخدام أصباغ معدنية من نوعي الأزوريت والمالاكيت. وعلى الرغم من ظهور صور الخيول المجنحة في فن تانغ (كما هو الحال في كهوف موغاو في دونهوانغ)، إلا أن الخيول بهذا النمط المرقط تُكتشف لأول مرة.\n\nوفي نفس القبر، تم العثور على مجموعة نادرة من الأثاث الخشبي، تشمل أريكة، وطاولة صغيرة، وحامل فرش، ومحبرة، وعناصر من شاشة، وهي تجسيد حي للديكور الجنائزي للنبلاء في ذلك الوقت.\n\nوقدّمت مقبرة \"بادام الشرقي\" أدلة ملموسة على روابط دولية واسعة كانت المنطقة تطورها. وعُثر في المدافن على قطع نقدية معدنية بيزنطية ودراهم فضية ساسانية، وعملات طورغشية، وعملات صينية (تشياني)، بما في ذلك قطعة نادرة للغاية من عملة \"كاي يوان تونغ باو\" المنحوتة من اليشم الصلب.\n\nومن بين القطع الفاخرة، تبرز آنية ثلاثية المقابض ذات طلاء زجاجي أخضر تجمع بين السمات الفارسية والبيزنطية، ومرآة نحاسية مرصعة بالذهب والفضة، وصندوق مطلي بالورنيش، وقارورة فضية مذهبة لحفظ المسك. وتؤكد كل هذه الاكتشافات مكانة (تورفان) بصفتها عقدة تجارية وثقافية رئيسية على طريق الحرير.\n\nأعلنت أكاديمية العلوم الأوزبكية أن علماء آثار من روسيا وأوزبكستان عثروا في أوزبكستان على قطع أثرية حجرية، وتشير التقديرات الأولية إلى أن عمرها يتراوح بين 280 و320 ألف عام.\n\nكشفت جامعة القاهرة عن تجمع حفري استثنائي لأسماك القرش في منطقة أبو طرطور بالصحراء الغربية، يعود إلى أكثر من 70 مليون عام، خلال العصر الكريتاسي المتأخر."}, {"guid": "https://arabic.rt.com/funny/1828636-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D8%B5%D9%8A%D8%A7%D8%AF%D9%88%D9%86-%D8%B3%D9%85%D9%83%D8%A9-%D8%A7%D8%B3%D8%AA%D9%88%D8%A7%D8%A6%D9%8A%D8%A9-%D8%A8%D8%AD%D9%8A%D8%B1%D8%A9-%D8%AC%D9%84%D9%8A%D8%AF%D9%8A%D8%A9/", "title": "سمكة استوائية تثير الحيرة بعد اصطيادها في بحيرة روسية باردة", "summary": "اصطاد صيادون من قرية فزفاد، الواقعة في مقاطعة نوفغورود الروسية، سمكة من نوع \"البلطي\" في إحدى بحيرات المنطقة، وهي سمكة تعيش عادة في إفريقيا والشرق الأوسط وأمريكا الجنوبية.", "link": "https://arabic.rt.com/funny/1828636-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D8%B5%D9%8A%D8%A7%D8%AF%D9%88%D9%86-%D8%B3%D9%85%D9%83%D8%A9-%D8%A7%D8%B3%D8%AA%D9%88%D8%A7%D8%A6%D9%8A%D8%A9-%D8%A8%D8%AD%D9%8A%D8%B1%D8%A9-%D8%AC%D9%84%D9%8A%D8%AF%D9%8A%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9a82294c59b71da93c7812.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788662104, "detail": "اصطاد صيادون من قرية فزفاد، الواقعة في مقاطعة نوفغورود الروسية، سمكة من نوع \"البلطي\" في إحدى بحيرات المنطقة، وهي سمكة تعيش عادة في إفريقيا والشرق الأوسط وأمريكا الجنوبية.\n\nوأفاد دميتري غرافوف، رئيس لجنة الصيد وتربية الأسماك في المنطقة، بأن صيادين من قرية فزفاد بمقاطعة نوفغورود اصطادوا سمكة \"تيليبيا\" الاستوائية في بحيرة إلمين المحلية.\n\nوقال غرافوف في صفحته على شبكة التواصل الاجتماعي الروسية \"فكونتاكتي\": \"وقعت في شباك صيادي فزفاد سمكة أجنبية لم يُرَ لها مثيل هنا من قبل، وهي التيليبيا... فكيف وجدت هذه الحسناء الاستوائية طريقها إلى مياه بحيرة إلمين السلافية العريقة والجليدية؟ إنه أمر لا يزال لغزا للجميع. ربما هربت من بركة خاصة أو حوض أسماك، أو ربما... من يدري ما الأسرار التي تخبئها بحيرة إلمين الأسطورية؟\".\n\nسمكة غريبة تفاجئ الباحثين بحركة \"المشي على سطح القمر\" في قاع البحر (فيديو) وأشار إلى أن هذه السمكة المحبة للحرارة، التي تنتمي إلى فصيلة البلطيات، لا تنتمي إطلاقا إلى البيئة الحيوانية المعتادة للبحيرات القاسية في شمال غرب روسيا. ويعود موطنها الأصلي إلى المياه الدافئة في إفريقيا والشرق الأوسط وأمريكا الجنوبية، بينما يمكن العثور عليها في روسيا داخل مزارع متخصصة بالمناطق الجنوبية فقط.\n\nأظهر مقطع فيديو أنثى دلفين في أستراليا تحمل صغيرها النافق على ظهرها أياما، في سلوك أعاد الجدل حول عواطف الحيوانات."}, {"guid": "https://arabic.rt.com/health/1828696-%D9%88%D8%B3%D9%8A%D9%84%D8%A9-%D8%A8%D8%B3%D9%8A%D8%B7%D8%A9-%D9%84%D8%AE%D9%81%D8%B6-%D8%B6%D8%BA%D8%B7-%D8%A7%D9%84%D8%AF%D9%85-%D9%86%D8%AA%D8%A7%D8%A6%D8%AC-%D9%84%D8%A7%D9%81%D8%AA%D8%A9-%D8%AE%D9%84%D8%A7%D9%84-20-%D9%8A%D9%88%D9%85%D8%A7-%D9%81%D9%82%D8%B7/", "title": "وسيلة بسيطة لخفض ضغط الدم تحقق نتائج لافتة خلال 20 يوما فقط", "summary": "يزيد ارتفاع ضغط الدم من خطر الإصابة بالنوبات القلبية والسكتات الدماغية وأمراض القلب والأوعية الدموية، ما يدفع الباحثين إلى البحث عن وسائل بسيطة وآمنة للمساعدة في السيطرة عليه.", "link": "https://arabic.rt.com/health/1828696-%D9%88%D8%B3%D9%8A%D9%84%D8%A9-%D8%A8%D8%B3%D9%8A%D8%B7%D8%A9-%D9%84%D8%AE%D9%81%D8%B6-%D8%B6%D8%BA%D8%B7-%D8%A7%D9%84%D8%AF%D9%85-%D9%86%D8%AA%D8%A7%D8%A6%D8%AC-%D9%84%D8%A7%D9%81%D8%AA%D8%A9-%D8%AE%D9%84%D8%A7%D9%84-20-%D9%8A%D9%88%D9%85%D8%A7-%D9%81%D9%82%D8%B7/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9aa0d04236041b0771a5fe.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788662079, "detail": "يزيد ارتفاع ضغط الدم من خطر الإصابة بالنوبات القلبية والسكتات الدماغية وأمراض القلب والأوعية الدموية، ما يدفع الباحثين إلى البحث عن وسائل بسيطة وآمنة للمساعدة في السيطرة عليه.\n\nوتشير تجربة سريرية جديدة إلى أن زيت النعناع قد يكون أحد الخيارات الواعدة، بعد أن ارتبط تناوله بانخفاض ملحوظ في ضغط الدم خلال فترة قصيرة.\n\nوأجرى باحثون في المملكة المتحدة تجربة شملت 40 شخصا تتراوح أعمارهم بين 18 و65 عاما، وكان جميع المشاركين إما في مرحلة ما قبل ارتفاع ضغط الدم أو في المرحلة الأولى منه.\n\nوتلقى نصف المشاركين 50 ميكروليترا من زيت النعناع النقي ممزوجا بـ100 ملليلتر من الماء مرتين يوميا لمدة 20 يوما، بينما تناول النصف الآخر دواء وهميا.\n\nوأظهرت النتائج أن المشاركين الذين تناولوا زيت النعناع شهدوا انخفاضا متوسطا في ضغط الدم الانقباضي، وهو الرقم الأعلى في قراءة الضغط، بمقدار 8.48 مليمتر زئبق مقارنة بمجموعة الدواء الوهمي.\n\nكما انخفض ضغط الدم الانبساطي، وهو الرقم الأدنى في القراءة، بمقدار 4.57 مليمتر زئبق في المتوسط، في حين كان معدل ضربات القلب أثناء الراحة أقل بنحو 8.92 نبضة في الدقيقة مقارنة بالمجموعة الأخرى، بعد إجراء التعديلات الإحصائية.\n\nعادة يومية بسيطة قد تقلل خطر الوفاة بأمراض القلب ويرى الباحثون أن أحد التفسيرات المحتملة لهذا التأثير قد يرتبط بالمنثول، وهو مركب موجود في النعناع. ويعتقدون أن المنثول قد يساعد على إرخاء الأوعية الدموية وتحسين تدفق الدم، لكن هذه الآلية لا تزال بحاجة إلى مزيد من البحث للتأكد منها.\n\nوقال جوني سنكلير، عالم الرياضة والصحة من جامعة لانكشاير، إن نتائج الدراسة كانت \"إيجابية للغاية\" وتحمل آثارا سريرية مهمة، مشيرا إلى أن ارتفاع ضغط الدم يعد من أبرز عوامل الخطر القابلة للوقاية المرتبطة بأمراض القلب والأيض والوفاة حول العالم.\n\nوتأتي هذه النتائج في ظل الاهتمام المتزايد بوسائل غير دوائية للمساعدة في خفض ضغط الدم. فالتغييرات في النظام الغذائي وممارسة الرياضة يمكن أن تساعد في السيطرة عليه، لكن الالتزام بهذه الإجراءات قد يكون صعبا بالنسبة لبعض الأشخاص. كما تعد أدوية ضغط الدم فعالة، إلا أن الالتزام بتناولها قد يمثل تحديا لدى بعض المرضى.\n\nومع ذلك، يؤكد الباحثون أن نتائج التجربة لا تكفي حتى الآن للتوصية باستخدام زيت النعناع لعلاج ارتفاع ضغط الدم. فالدراسة شملت عددا محدودا من المشاركين واستمرت 20 يوما فقط، كما استخدمت نوعا محددا من زيت النعناع وبجرعة معينة.\n\nوقال سنكلير إن انخفاض تكلفة زيت النعناع وسهولة استخدامه قد يجعلان منه خيارا مثيرا للاهتمام إذا أثبتت الدراسات المستقبلية فعاليته، مشيرا إلى الحاجة إلى إجراء تجارب أطول وعلى أعداد أكبر من المشاركين، مع متابعة ضغط الدم بصورة منتظمة.\n\nويحذر الخبراء من استخدام زيت النعناع بديلا عن أدوية ضغط الدم الموصوفة من الطبيب، إذ لا تزال الأدلة المتوفرة محدودة، ولا ينبغي تغيير العلاج أو إيقاف الأدوية دون استشارة طبية.\n\nنشرت نتائج الدراسة في مجلة PLOS One.\n\nكشفت دراسة جديدة، نشرت في مجلة \"الطب الانتقالي\"، عن آلية بيولوجية مشتركة قد تفسر الإرهاق المزمن الذي يعاني منه المصابون بخمسة أمراض مختلفة.\n\nكشفت إرشادات طبية جديدة عن توصيات لاختيار أدوية الوقاية من الصداع النصفي، مع مراعاة عدد النوبات وتأثيرها في الحياة اليومية والحالة الصحية للمريض.\n\nأصدرت منظمة الصحة العالمية تحديثا مهما لإرشاداتها المتعلقة بتقليل خطر التدهور المعرفي والإصابة بالخرف، حيث أضافت سبعة عوامل خطر جديدة إلى القائمة السابقة التي كانت تضم 12 عاملا."}, {"guid": "https://arabic.rt.com/health/1828713-%D8%AF%D9%88%D8%A7%D8%A1-%D8%A5%D9%86%D9%82%D8%A7%D8%B5-%D8%A7%D9%84%D9%88%D8%B2%D9%86-%D9%86%D8%AA%D8%A7%D8%A6%D8%AC-%D9%88%D8%A7%D8%B9%D8%AF%D8%A9-%D8%B6%D8%AF-%D8%A7%D9%86%D9%82%D8%B7%D8%A7%D8%B9-%D8%A7%D9%84%D9%86%D9%81%D8%B3-%D8%A7%D9%84%D9%86%D9%88%D9%85%D9%8A/", "title": "دواء لإنقاص الوزن يحقق نتائج واعدة ضد انقطاع النفس النومي", "summary": "أظهرت دراسة جديدة أن دواء \"تيرزيباتايد\"، المعروف باسم \"مونجارو\"، قد يساعد في علاج انقطاع النفس الانسدادي النومي لدى المصابين بالسمنة.", "link": "https://arabic.rt.com/health/1828713-%D8%AF%D9%88%D8%A7%D8%A1-%D8%A5%D9%86%D9%82%D8%A7%D8%B5-%D8%A7%D9%84%D9%88%D8%B2%D9%86-%D9%86%D8%AA%D8%A7%D8%A6%D8%AC-%D9%88%D8%A7%D8%B9%D8%AF%D8%A9-%D8%B6%D8%AF-%D8%A7%D9%86%D9%82%D8%B7%D8%A7%D8%B9-%D8%A7%D9%84%D9%86%D9%81%D8%B3-%D8%A7%D9%84%D9%86%D9%88%D9%85%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9aaf474236041a6c02d6da.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788662037, "detail": "أظهرت دراسة جديدة أن دواء \"تيرزيباتايد\"، المعروف باسم \"مونجارو\"، قد يساعد في علاج انقطاع النفس الانسدادي النومي لدى المصابين بالسمنة.\n\nويعد انقطاع النفس الانسدادي النومي أكثر اضطرابات التنفس شيوعا أثناء النوم. ويحدث عندما ينسد مجرى الهواء بشكل متكرر أثناء النوم، ما يؤدي إلى توقف التنفس وعودته، وقد يسبب الشخير واللهاث والاستيقاظ المتكرر.\n\nوراجع باحثون من المركز الطبي بجامعة بيتسبرغ نتائج تجربتين سريريتين شملتا 469 مريضا يعانون من انقطاع النفس الانسدادي النومي المتوسط إلى الشديد.\n\nالعلاج الأكثر فاعلية للشخير الشديد وفقد المشاركون الذين تلقوا \"تيرزيباتايد\" نحو خمس وزنهم، كما انخفض عدد مرات توقف التنفس لديهم بأكثر من 20 مرة في الساعة. وأظهرت النتائج أن 42 إلى 50% منهم تخلصوا من انقطاع النفس الانسدادي النومي، مقارنة بنسبة أقل بنحو ثلاثة أضعاف بين من تلقوا دواء وهميا.\n\nويرجح الباحثون أن يكون فقدان الوزن العامل الأساسي وراء هذا التحسن، إذ يمكن لتراكم الدهون حول الرقبة أن يضيق مجرى الهواء ويزيد صعوبة التنفس أثناء النوم.\n\nومع ذلك، لا تشير النتائج إلى أن \"تيرزيباتايد\" يمكن أن يحل محل جهاز ضغط مجرى الهواء الإيجابي المستمر (CPAP)، خصوصا لدى المصابين بالحالات الشديدة. ويظل الجهاز من العلاجات الأساسية للحالة، وقد خفض عدد مرات توقف التنفس بأكثر من 30 مرة في الساعة لدى مستخدميه.\n\nكما لا يزال من غير الواضح ما إذا كانت فوائد \"تيرزيباتايد\" تستمر بعد التوقف عن تناوله، في ظل احتمال استعادة الوزن. وأظهرت دراسات سابقة أن استعادة جزء من الوزن بعد التوقف عن أدوية إنقاص الوزن أمر شائع، ما قد يؤدي إلى عودة انقطاع النفس النومي.\n\nنشرت نتائج الدرساة في مجلة JAMA لطب الأذن والأنف والحنجرة وجراحة الرأس والعنق.\n\nيشير الدكتور مكسيم غوبكا، أخصائي الأمراض الباطنية، إلى أن الاستيقاظ المتكرر أثناء الليل لا يكون دائما نتيجة الضوضاء أو الضوء الساطع أو عدم راحة الفراش أو تناول القهوة في وقت متأخر.\n\nحددت الدكتورة يكاتيرينا ديميانوفسكايا، أخصائية طب الأعصاب، عدد ساعات النوم التي يحتاجها الأطفال والمراهقون، موضحة العلامات التي قد تشير إلى عدم حصولهم على قسط كاف من النوم.\n\nتشير دراسات طبية إلى أن النوم لأقل من سبع ساعات يوميا، إلى جانب اضطرابات النوم مثل الأرق والنوم نهارا، قد يرتبط بزيادة خطر الإصابة بمرض ألزهايمر.\n\nطوّر باحثون من جامعة كاليفورنيا في سان دييغو غرسة طبية جديدة قد تُحدث تحولا في علاج انقطاع النفس الانسدادي النومي."}, {"guid": "https://arabic.rt.com/health/1828788-%D8%A3%D8%B7%D8%B9%D9%85%D8%A9-%D8%B4%D8%A7%D8%A6%D8%B9%D8%A9-%D8%AE%D9%81%D8%B6-%D8%B6%D8%BA%D8%B7-%D8%A7%D9%84%D8%AF%D9%85-%D8%A7%D9%84%D9%85%D8%B1%D8%AA%D9%81%D8%B9-%D8%A8%D8%B4%D9%83%D9%84-%D8%B7%D8%A8%D9%8A%D8%B9%D9%8A/", "title": "أطعمة شائعة قد تساعد في خفض ضغط الدم المرتفع بشكل طبيعي", "summary": "يعد ارتفاع ضغط الدم من أكثر المشكلات الصحية شيوعا، وتحدث الحالة عندما يضغط الدم بقوة أكبر من الطبيعي على جدران الشرايين، ما يزيد الضغط على القلب ويرفع خطر الإصابة بأمراض القلب.", "link": "https://arabic.rt.com/health/1828788-%D8%A3%D8%B7%D8%B9%D9%85%D8%A9-%D8%B4%D8%A7%D8%A6%D8%B9%D8%A9-%D8%AE%D9%81%D8%B6-%D8%B6%D8%BA%D8%B7-%D8%A7%D9%84%D8%AF%D9%85-%D8%A7%D9%84%D9%85%D8%B1%D8%AA%D9%81%D8%B9-%D8%A8%D8%B4%D9%83%D9%84-%D8%B7%D8%A8%D9%8A%D8%B9%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9ad6324c59b71da93c7897.jpg", "category": "صحة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788661997, "detail": "يعد ارتفاع ضغط الدم من أكثر المشكلات الصحية شيوعا، وتحدث الحالة عندما يضغط الدم بقوة أكبر من الطبيعي على جدران الشرايين، ما يزيد الضغط على القلب ويرفع خطر الإصابة بأمراض القلب.\n\nوكشفت دراسة حديثة أن تناول كميات أكبر من البقوليات وفول الصويا قد يرتبط بانخفاض خطر الإصابة بارتفاع ضغط الدم، في نتائج تشير إلى أهمية هذه الأطعمة ضمن نظام غذائي صحي للقلب.\n\nواعتمدت الدراسة، التي نشرت في مجلة BMJ، على تحليل بيانات من دراسات تابعت الأنظمة الغذائية للمشاركين لفترات زمنية مختلفة، وشملت مناطق عدة، من بينها الولايات المتحدة وآسيا وأوروبا.\n\nوحلل الباحثون بيانات 10 مجموعات بحثية لدراسة العلاقة بين تناول البقوليات وارتفاع ضغط الدم، وشملت البيانات 309853 مشاركا، من بينهم 86098 حالة إصابة بارتفاع ضغط الدم.\n\nوأظهرت النتائج أن الأشخاص الذين تناولوا أكبر كميات من البقوليات كانوا أقل عرضة للإصابة بارتفاع ضغط الدم بنسبة 16% مقارنة بمن تناولوا أقل كميات منها.\n\nووجد الباحثون، من خلال تحليل العلاقة بين كمية الاستهلاك والفائدة الصحية، أن تناول نحو 140 غراما من البقوليات يوميا ارتبط بأكبر انخفاض في خطر الإصابة بارتفاع ضغط الدم.\n\nوشمل تحليل فول الصويا سبع مجموعات بحثية، بإجمالي 278200 مشارك، من بينهم 93934 حالة إصابة بارتفاع ضغط الدم. وكان الأشخاص الذين تناولوا أكبر كميات من فول الصويا، بما في ذلك أطعمة مثل التوفو والإدامامي، أقل عرضة للإصابة بارتفاع ضغط الدم بنسبة 19% مقارنة بمن تناولوا أقل الكميات.\n\nوبدأت الفائدة المرتبطة باستهلاك فول الصويا في الاستقرار عند نحو 70 غراما يوميا.\n\n5 عادات يومية ترفع ضغط الدم دون أن تشعر لماذا قد تساعد هذه الأطعمة؟\n\nتحتوي البقوليات، مثل الفاصوليا والعدس والبازلاء وفول الصويا، على البوتاسيوم والمغنيسيوم والألياف، وهي عناصر غذائية ترتبط بصحة القلب وتنظيم ضغط الدم.\n\nويساعد البوتاسيوم الجسم على التخلص من الصوديوم الزائد، بينما يشارك المغنيسيوم في وظائف العضلات والأوعية الدموية. كما يمكن لبعض الألياف أن تتحول في الأمعاء إلى مركبات تساعد على تحسين وظيفة الأوعية الدموية.\n\nأما فول الصويا فيحتوي على الإيزوفلافونات، وهي مركبات نباتية قد تساعد في تحسين وظيفة الأوعية الدموية. وتشير أبحاث أخرى إلى أن هذه المركبات قد تقدم فوائد إضافية، مثل المساعدة في الحفاظ على كثافة العظام وتقليل الهبات الساخنة لدى بعض النساء خلال انقطاع الطمث.\n\nوأخذت الدراسات التي اعتمد عليها التحليل في الاعتبار عوامل عدة قد تؤثر في ضغط الدم، من بينها العمر والجنس والتدخين والنشاط البدني والنظام الغذائي.\n\nما الذي يمكن فعله للوقاية؟\n\nلا يعتمد التحكم في ضغط الدم على عنصر غذائي واحد، لكن اتباع نظام غذائي متوازن، إلى جانب النشاط البدني والحفاظ على وزن صحي والابتعاد عن التدخين، يمكن أن يساعد في تقليل المخاطر.\n\nوتشير نتائج الدراسة إلى وجود ار
