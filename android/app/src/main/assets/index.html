 أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nنفت فرنسا على لسان وزير خارجيتها السبت، اتهامات وجهتها النيجر إلى باريس بتحريض جنود متمردين على مهاجمة قاعدة جوية عسكرية رئيسية في العاصمة نيامي الأسبوع الماضي.\n\nوقال بارو لإذاعة فرنسا الدولية \"آر إف آي\": \"لم تكن هناك مطلقا نية، ولا وسائل يمكن أن تحركها فرنسا عسكريا\".\n\nوكانت النيجر قد شهدت في 29 أغسطس/آب هجوما نفذه جنود متمردون استهدف المطار ومقر الرئاسة في نيامي، في أحدث تحد لحكم عبد الرحمن تياني، الذي تولى السلطة إثر انقلاب عسكري عام 2023.\n\nوأفادت تقارير بسماع دوي انفجارات وإطلاق نار في قاعدة جوية عسكرية، قبل أن تعلن السلطات استعادة السيطرة عليها في اليوم التالي بدعم من قوات روسية شبه عسكرية.\n\nوقالت حكومة النيجر، في بيان بثه التلفزيون الرسمي الجمعة، إن مجلس الوزراء خلص إلى أن \"شبكة واسعة من المتواطئين، تقودها فرنسا\"، حرضت على تنفيذ الهجوم.\n\nأكد سفير روسيا في النيجر، فيكتور فوروباييف، إحباط محاولة اقتحام فندق \"برافيا\" في العاصمة نيامي، والذي يضم مقر السفارة الروسية ومساكن موظفيها، خلال محاولة تمرد عسكري شهدتها الدولة.\n\nأعلن التلفزيون الرسمي النيجري مقتل واعتقال عشرات الجنود إثر محاولة تمرد نفذتها مجموعة من الضباط الشباب في العاصمة نيامي، في ما يمثل تحدياً كبيراً للمجلس العسكري الحاكم في البلاد."}, {"guid": "https://arabic.rt.com/russia/1829045-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D8%A3%D8%A8%D8%AF%D9%8A%D8%A9-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%8A%D9%87%D9%86%D8%A6-%D8%A3%D8%A8%D9%86%D8%A7%D8%A1-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D8%A8%D9%8A%D9%88%D9%85-%D8%A7%D9%84%D9%85%D8%AF%D9%8A%D9%86%D8%A9/", "title": "\"موسكو أبدية\".. بوتين يهنئ أبناء موسكو بيوم المدينة", "summary": "هنأ الرئيس الروسي فلاديمير بوتين اليوم السبت أهالي موسكو بعيدهم \"يوم المدينة\" وأشاد بالإنجازات التي حققتها العاصمة الروسية في مختلف المجالات.", "link": "https://arabic.rt.com/russia/1829045-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D8%A3%D8%A8%D8%AF%D9%8A%D8%A9-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%8A%D9%87%D9%86%D8%A6-%D8%A3%D8%A8%D9%86%D8%A7%D8%A1-%D9%85%D9%88%D8%B3%D9%83%D9%88-%D8%A8%D9%8A%D9%88%D9%85-%D8%A7%D9%84%D9%85%D8%AF%D9%8A%D9%86%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c15f142360444010705a2.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788607483, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nهنأ الرئيس الروسي فلاديمير بوتين اليوم السبت أهالي موسكو بعيدهم \"يوم المدينة\" وأشاد بالإنجازات التي حققتها العاصمة الروسية في مختلف المجالات.\n\nوقال بوتين خلال فعالية أقيمت في قاعة \"زارياديه\" للحفلات الموسيقية وسط موسكو: \"الحفاظ على التاريخ والانفتاح على كل ما هو جديد، والاهتمام بكل مواطن في موسكو، والاستعداد لتقديم العون لسكان المناطق الأخرى، يجعل من موسكو مدينة قوية وإنسانية ومضيافة، وهي روح ومحرك التنمية في روسيا بأكملها\".\n\nوأشار الرئيس إلى دور صناعة موسكو في ضمان السيادة التكنولوجية للبلاد، وأشاد بعمل النظام التعليمي فيها، وقال إن العاصمة تضع معايير متقدمة للتنمية في المجال الاجتماعي وتنظيم المساحات العامة وتحسين المرافق والحفاظ على مواقع التراث الثقافي.\n\nوشكر الرئيس عمدة موسكو سيرغي سوبيانين على مساهمته في تنمية العاصمة، وقال: \"أود أن أتوجه بجزيل الشكر لسكان موسكو. معكم، ومع جميع مواطني البلاد، سنتجاوز كل الصعوبات والتحديات، فإن جميعها مؤقتة وعابرة. لكن موسكو، (مثل) روسيا أبدية\".\n\nوأشار أيضا إلى أن العاصمة كباقي أنحاء روسيا، قد حشدت صفوفها للدفاع عن الوطن، حيث يقاتل عشرات الآلاف من سكان موسكو في منطقة العمليات العسكرية الخاصة.\n\nويجري إحياء يوم المدينة في موسكو هذا العام في الخامس والسادس من سبتمبر، حيث تحتفل المدينة بعيد ميلادها الـ879.\n\nاحتفلت موسكو بمرور 8 سنوات على انطلاق الحافلات الكهربائية و13 عاما على تشغيل المسارات الليلية، اللتين أصبحتا جزءا من منظومة النقل اليومية في العاصمة.\n\nشهد أسطول مترو موسكو خلال السنوات العشر الماضية عملية تحديث واسعة، جعلته يتصدر أنظمة النقل تحت الأرض في أوروبا وأمريكا من حيث سرعة وحجم تجديد القطارات.\n\nنقل موقع \"موسكو 24\" عن عمدة موسكو، سيرغي سوبيانين، اكتمال ترميم أكثر من 30 موقعا للتراث الثقافي في العاصمة خلال النصف الأول من 2026.\n\nأعلن عمدة موسكو، سيرغي سوبيانين، عبر قناته على تطبيق \"ماكس\"، عن إعادة افتتاح كنيسة الصعود في محمية كولومينسكويه بموسكو، بعد اكتمال أعمال ترميم استمرت عامين ونصف."}, {"guid": "3e194c90-a91b-11f1-ad24-498e4f3d2836", "title": "جهود دبلوماسية حثيثة لإنهاء الحرب في أوكرانيا", "summary": "وصل مبعوثا دونالد ترامب، جاريد كوشنر وستيف ويتكوف، إلى مطار فنوكوفو في موسكو السبت حاملين بحسب الرئيس الأمريكي مقترحا لإنهاء الحرب في أوكرانيا، وفق ما ذكرت وكالتا الأنباء الروسيتان \"تاس\" و\"ريا نوفوستي\".", "link": "https://www.france24.com/ar/%D9%81%D9%8A%D8%AF%D9%8A%D9%88/20260905-%D8%AC%D9%87%D9%88%D8%AF-%D8%AF%D8%A8%D9%84%D9%88%D9%85%D8%A7%D8%B3%D9%8A%D8%A9-%D8%AD%D8%AB%D9%8A%D8%AB%D8%A9-%D9%84%D8%A5%D9%86%D9%87%D8%A7%D8%A1-%D8%A7%D9%84%D8%AD%D8%B1%D8%A8-%D9%81%D9%8A-%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A%D8%A7", "image": "https://s.france24.com/media/display/3930df22-a91b-11f1-9d7a-005056bf30b7/w:1024/p:16x9/AR-20260905-130706-130942-CS.jpg", "category": "سياسة", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788607055, "detail": ""}, {"guid": "https://arabic.rt.com/world/1829044-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%8A%D9%84%D8%AA%D9%82%D9%8A-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%84%D9%84%D9%85%D8%B1%D8%A9-%D8%A7%D9%84%D8%B3%D8%A7%D8%AF%D8%B3%D8%A9/", "title": "بوتين يلتقي ويتكوف للمرة السادسة", "summary": "يلتقي الرئيس الروسي فلاديمير بوتين اليوم بالمبعوث الأمريكي الخاص ستيف ويتكوف في روسيا للمرة السادسة.", "link": "https://arabic.rt.com/world/1829044-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D9%8A%D9%84%D8%AA%D9%82%D9%8A-%D9%88%D9%8A%D8%AA%D9%83%D9%88%D9%81-%D9%84%D9%84%D9%85%D8%B1%D8%A9-%D8%A7%D9%84%D8%B3%D8%A7%D8%AF%D8%B3%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c14594c59b7253727fec2.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788606922, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nيلتقي الرئيس الروسي فلاديمير بوتين اليوم بالمبعوث الأمريكي الخاص ستيف ويتكوف في روسيا للمرة السادسة.\n\nوبحث الرئيس الروسي والمبعوث الرئاسي الأمريكي لأول مرة التسوية الأوكرانية في 11 أبريل 2025 في بطرسبورغ. وعقدت جولة ثانية من المفاوضات بين بوتين والمفاوضين الأمريكيين في 25 أبريل 2025. وعقب تلك المفاوضات، عُقدت مفاوضات ثلاثية بين روسيا والولايات المتحدة وأوكرانيا في منتصف مايو العام الماضي.\n\nوعقد الاجتماع الثالث للرئيس الروسي مع المبعوثين الأمريكيين في 6 أغسطس، قبل لقاء بوتين مع الرئيس الأمريكي دونالد ترامب في أنكوريج. وفي ألاسكا، شارك كل من ويتكوف وكوشنر في القمة بين الرئيسين ضمن الوفد الأمريكي.\n\nوالتقى بوتين مع ويتكوف للمرة الرابعة في موسكو في 2 ديسمبر من العام الماضي. أما الاجتماع الخامس والأخير، فقد عُقد في 22 من يناير من هذا العام.\n\nووصل ويتكوف وصهر الرئيس الأمريكي جاريد كوشنر إلى موسكو اليوم السبت لعقد مفاوضات مع بوتين بشأن تسوية النزاع في أوكرانيا.\n\nصرح مساعد الرئيس الروسي يوري أوشاكوف بأن المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر، أجريا استعدادات جادة لزيارتهما إلى موسكو.\n\nأكد سفير روسيا لدى ألمانيا سيرغي نيتشاييف أن موسكو ترى اهتماما صادقا من إدارة ترامب بتحقيق السلام في أوكرانيا.\n\nأعلن المتحدث باسم الكرملين دميتري بيسكوف أن الرئيس الروسي فلاديمير بوتين أصدر أمرا بعدم شن أي غارات على العاصمة الأوكرانية كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة.\n\nوصل المبعوثان الأمريكيان ستيف ويتكوف وجاريد كوشنر إلى العاصمة الروسية موسكو لإجراء مباحثات حول إنهاء النزاع في أوكرانيا."}, {"guid": "4267a004-a91a-11f1-a062-1b26b42b7a54", "title": "تواصل عمليات الإنقاذ والبحث عن مفقودين في نيبال بعد الفيضانات المدمرة", "summary": "قالت السلطات النيبالية السبت إنه تم إخراج مواطن صيني على ​قيد ‌الحياة من نفق في البلاد، بعد مرور 10 أيام على تدفق للجليد ‌والصخور والطين عبر واد بجبال الهيمالايا مما أسفر عن مقتل أكثر من 1300 شخص وفقدان أكثر من 5600 آخرين. والجمعة، انتشلت فرق الإنقاذ شخصين من ​نفق آخر في محطة أبر تريشولي 3إيه للطاقة", "link": "https://www.france24.com/ar/%D9%81%D9%8A%D8%AF%D9%8A%D9%88/20260905-%D8%AA%D9%88%D8%A7%D8%B5%D9%84-%D8%B9%D9%85%D9%84%D9%8A%D8%A7%D8%AA-%D8%A7%D9%84%D8%A5%D9%86%D9%82%D8%A7%D8%B0-%D9%88%D8%A7%D9%84%D8%A8%D8%AD%D8%AB-%D8%B9%D9%86-%D9%85%D9%81%D9%82%D9%88%D8%AF%D9%8A%D9%86-%D9%81%D9%8A-%D9%86%D9%8A%D8%A8%D8%A7%D9%84-%D8%A8%D8%B9%D8%AF-%D8%A7%D9%84%D9%81%D9%8A%D8%B6%D8%A7%D9%86%D8%A7%D8%AA-%D8%A7%D9%84%D9%85%D8%AF%D9%85%D8%B1%D8%A9", "image": "https://s.france24.com/media/display/3d9c16cc-a91a-11f1-8138-005056bf30b7/w:1024/p:16x9/AR-20260905-130220-130441-CS.jpg", "category": "أخبار", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788606787, "detail": ""}, {"guid": "https://arabic.rt.com/sport/1829043-%D8%A5%D9%8A%D8%B1%D8%A7%D9%88%D9%84%D8%A7-%D9%8A%D9%83%D9%8A%D9%84-%D8%A7%D9%84%D9%85%D8%AF%D9%8A%D8%AD-%D9%84%D9%86%D8%AC%D9%85%D9%8A-%D9%84%D9%8A%D9%81%D8%B1%D8%A8%D9%88%D9%84-%D8%A8%D8%B9%D8%AF-%D8%A7%D9%84%D9%81%D9%88%D8%B2-%D8%B9%D9%84%D9%89-%D8%A5%D9%8A%D8%A8%D8%B3%D9%88%D9%8A%D8%AA%D8%B4/", "title": "إيراولا يكيل المديح لنجمي ليفربول بعد الفوز على إيبسويتش", "summary": "أكد مدرب ليفربول أندوني إيراولا ثقته في تقديم المهاجم ألكسندر إيزاك موسما جيدا بعد تسجيله هدفين بمرمى إيبسويتش، ليقود \"الريدز\" لفوزه الأول بالدوري الإنجليزي الممتاز هذا الموسم.", "link": "https://arabic.rt.com/sport/1829043-%D8%A5%D9%8A%D8%B1%D8%A7%D9%88%D9%84%D8%A7-%D9%8A%D9%83%D9%8A%D9%84-%D8%A7%D9%84%D9%85%D8%AF%D9%8A%D8%AD-%D9%84%D9%86%D8%AC%D9%85%D9%8A-%D9%84%D9%8A%D9%81%D8%B1%D8%A8%D9%88%D9%84-%D8%A8%D8%B9%D8%AF-%D8%A7%D9%84%D9%81%D9%88%D8%B2-%D8%B9%D9%84%D9%89-%D8%A5%D9%8A%D8%A8%D8%B3%D9%88%D9%8A%D8%AA%D8%B4/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c12ee4c59b712872d238d.png", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788606720, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nأكد مدرب ليفربول أندوني إيراولا ثقته في تقديم المهاجم ألكسندر إيزاك موسما جيدا بعد تسجيله هدفين بمرمى إيبسويتش، ليقود \"الريدز\" لفوزه الأول بالدوري الإنجليزي الممتاز هذا الموسم.\n\nوقد عانى إيزاك من الإصابات خلال موسمه الأول مع ليفربول، حيث سجل أربعة أهداف فقط في 22 مباراة، لكن سجل هدفين في شباك إيبسويتش ليرفع رصيده إلى ثلاثة أهداف خلال ثلاث مباريات هذا الموسم.\n\nوقال إيراولا عقب المباراة \"بالنسبة إلى إيزاك، إذا كان لائقا وجاهزا وفي حالة جيدة، أعتقد أنه سيحقق الأرقام المطلوبة\".\n\nوتابع المدرب الإسباني \"لن تكون مطالبي من إيزاك متعلقة بالأهداف على الأرجح، بل بأمور أخرى. سأطالبه بأشياء أخرى حتى نتمكن من اللعب بشكل جيد، لأنه إذا لعبنا بشكل جيد، سنجد أنفسنا في مراكز جيدة، وعندها ستأتي الأهداف\".\n\nوأردف \"عليه أن يسهم في العمل الجماعي وأن يدرك أنه عندما يساعد الجميع بعضهم بعضا، ستأتي الأهداف والتمريرات الحاسمة بعد ذلك\".\n\nوتألق أيضا بشكل لافت الهولندي كودي جاكبو، الذي صنع هدفي الفوز عل إيبسويتش تاون بعد تكهنات واسعة بشأن إمكانية رحيله عن ليفربول في فترة الانتقالات الصيفية، في ظل اهتمام كل من توتنهام ومانشستر سيتي بالتعاقد معه، لكن ليفربول رفض رحيله، ولم يتفاجأ إيراولا بالمستوى الذي ظهر به اللاعب الدولي.\n\nوأوضح إيراولا \"لم تكن لدي أي شكوك بشأن كودي. لقد كان جيدا للغاية طوال فترة الإعداد للموسم، وبدأ الموسم بشكل جيد للغاية وقدم أرقاما مميزة\".\n\nوأوضح \"بعد تمريرتيه الحاسمتين، لعب كمهاجم صريح ليساعدنا على حسم المباراة، وأعتقد أنه من الجيد امتلاك كودي لأنه يستطيع اللعب في المراكز الثلاثة في خط الهجوم. وجوده معنا في هذه المرحلة من بداية الموسم أمر جيد\".\n\nوختم قائلا \"أعتقد أن كودي يعرف مدى تقديرنا له، ولا يوجد أي شك في ذلك. أنا أقدره كثيرا\".\n\nحقق ليفربول انتصاره الأول في الدوري الإنجليزي الممتاز لكرة القدم هذا الموسم بتغلبه على مضيفه إيبسويتش تاون بهدفين دون رد مساء الجمعة، في الجولة الثالثة من \"البريميرليغ\"."}, {"guid": "https://arabic.rt.com/middle_east/1829019-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D8%AA%D8%B3%D8%AA%D8%B9%D8%B1%D8%B6-%D9%82%D9%88%D8%AA%D9%87%D8%A7-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9-%D9%81%D9%8A-%D9%85%D8%B5%D8%B1-%D8%AE%D8%A8%D9%8A%D8%B1-%D8%B9%D8%B3%D9%83%D8%B1%D9%8A-%D9%8A%D9%83%D8%B4%D9%81-%D9%84%D9%80-rt-%D8%A7%D9%84%D8%B1%D8%B3%D8%A7%D8%A6%D9%84-%D9%88%D8%A7%D9%84%D8%AF%D9%84%D8%A7%D9%84%D8%A7%D8%AA/", "title": "روسيا تستعرض قوتها العسكرية في مصر.. خبير عسكري يكشف لـ RT الرسائل والدلالات", "summary": "أكد الخبير العسكري المصري والمستشار بكلية القادة والأركان اللواء أسامة كبير أن اختيار روسيا لمصر للكشف عن منظومات عسكرية حديثة يعكس الثقة في مكانة القاهرة وقوة معرضها الدولي.", "link": "https://arabic.rt.com/middle_east/1829019-%D8%B1%D9%88%D8%B3%D9%8A%D8%A7-%D8%AA%D8%B3%D8%AA%D8%B9%D8%B1%D8%B6-%D9%82%D9%88%D8%AA%D9%87%D8%A7-%D8%A7%D9%84%D8%B9%D8%B3%D9%83%D8%B1%D9%8A%D8%A9-%D9%81%D9%8A-%D9%85%D8%B5%D8%B1-%D8%AE%D8%A8%D9%8A%D8%B1-%D8%B9%D8%B3%D9%83%D8%B1%D9%8A-%D9%8A%D9%83%D8%B4%D9%81-%D9%84%D9%80-rt-%D8%A7%D9%84%D8%B1%D8%B3%D8%A7%D8%A6%D9%84-%D9%88%D8%A7%D9%84%D8%AF%D9%84%D8%A7%D9%84%D8%A7%D8%AA/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9bff3242360418ed65f5b0.jpg", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788606677, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nأكد الخبير العسكري المصري والمستشار بكلية القادة والأركان اللواء أسامة كبير أن اختيار روسيا لمصر للكشف عن منظومات عسكرية حديثة يعكس الثقة في مكانة القاهرة وقوة معرضها الدولي.\n\nوأعلن المدير العام لشركة \"روس أوبورون إكسبورت\" ألكسندر ميخييف أن الشركة ستعرض خلال مشاركتها في معرض العلمين الدولي للطيران في مصر أحدث الابتكارات الروسية في منظومات الدفاع الجوي.\n\nوأوضح كبير المستشار بكلية القادة والأركان في تصريحات لـ RT Arabic أن معرض العلمين يمثل منصة مهمة لعرض المنتجات العسكرية أمام الخبراء والمتخصصين وممثلي أسواق السلاح العالمية، مشيرا إلى أن المشاركة الروسية تعكس الثقة في قدرة مصر على استضافة فعاليات دفاعية دولية تجمع مختلف القوى والشركات العاملة في هذا المجال.\n\nوأشار إلى أن أهمية المشاركة الروسية لا تقتصر على عرض الخصائص الفنية والتكنولوجية للمنظومات الجديدة، وإنما تمتد إلى توجيه رسائل بشأن تطور الصناعات الدفاعية الروسية وقدرتها على إنتاج أسلحة حديثة، رغم الضغوط والعقوبات الغربية المفروضة على موسكو.\n\nوتعرض شركة \"روس أوبورون إكسبورت\" خلال المعرض عددًا من المنظومات الروسية الحديثة، بينها المنصتان غير المأهولتين \"إس-71 إم\" و\"إس-71 ك\"، ونظام تدمير الأهداف الجوية \"تي كيه بي-1167\"، إضافة إلى المجمع المدفعي المضاد للطائرات \"زاك-30 سيتاديل\" المقرر عرضه للمرة الأولى خارج روسيا.\n\nويرى الخبير العسكري أن طبيعة هذه المنظومات، خصوصا الأنظمة المخصصة لمواجهة الطائرات المسيرة والذخائر المتجولة، تعكس الخبرات التي اكتسبتها الجيوش الحديثة من ساحات الصراع خلال السنوات الأخيرة، بعدما أصبحت المسيّرات أحد أبرز عناصر التهديد في الحروب المعاصرة.\n\nوأضاف أن عرض هذه المنظومات في مصر يمكن أن يحمل رسالة إلى الدول الغربية مفادها أن موسكو لا تزال قادرة على تطوير أسلحة حديثة وتسويقها في الأسواق الدولية، وأن الحرب في أوكرانيا وما ترتب عليها من عقوبات وضغوط لم تمنع روسيا من مواصلة تطوير منتجاتها العسكرية والتواصل مع شركاء وأسواق محتملة.\n\nوأكد كبير أن المعارض العسكرية لا تقتصر على عمليات البيع والشراء، وإنما تمثل أيضا فرصة للدول المنتجة للسلاح لإظهار جانب من قدراتها العسكرية والتكنولوجية، بما يخدم أهدافا تتعلق بالردع وإيصال الرسائل الاستراتيجية.\n\nوأوضح أن الكشف عن منظومة عسكرية جديدة في معرض دولي لا يعني بالضرورة عرض كامل القدرات التي تمتلكها الدولة المنتجة، إذ تكشف الدول عادة ما تريد إظهاره أمام الجمهور الدولي، وهو ما يجعل معادلة \"المعلن وغير المعلن\" أحد عناصر الردع الاستراتيجي.\n\nوأشار إلى أن ظهور منظومة جديدة ومتطورة قد يدفع الأطراف الأخرى إلى التساؤل عما تمتلكه الدولة المنتجة من قدرات إضافية لم تكشف عنها بعد، بما يوسع من التأثير الاستراتيجي للمشاركة في المعارض الدفاعية.\n\nوفيما يتعلق بظهور المقاتلة الروسية \"سوخوي-57\" في مصر، قال كبير إن إدراج مقاتلة من الجيل الخامس إلى جانب طائرات ومنظومات غربية متقدمة يحمل دلالة خاصة، لأنه يتيح عرض التكنولوجيا الروسية أمام خبراء وممثلي شركات ودول مهتمة بسوق السلاح الدولي، كما يوفر فرصة للمقارنة بين منظومات تنتمي إلى مدارس عسكرية وصناعية مختلفة.\n\nوأضاف أن اجتماع \"سوخوي-57\" مع منظومات الدفاع الجوي والأسلحة المضادة للطائرات المسيرة والمنصات غير المأهولة في معرض واحد يمنح المشاركة الروسية بعدًا متكاملًا، إذ لا يتعلق الأمر بعرض مقاتلة منفردة، وإنما بإظهار مجموعة من التقنيات التي تغطي مجالات الحرب الجوية والدفاع الجوي والأنظمة غير المأهولة.\n\nويرى الخبير أن اختيار مصر لاستضافة هذا العرض يحمل أهمية إضافية في ضوء العلاقات المصرية-الروسية الممتدة في عدد من المجالات، موضحا أن القاهرة تتبنى سياسة تقوم على الحفاظ على علاقات متوازنة مع مختلف القوى الدولية، وهو ما يجعلها موقعا مناسبا لاستضافة منتجات عسكرية لدول ذات توجهات ومصالح متباينة.\n\nواعتبر كبير أن مصر تمثل بالنسبة إلى روسيا بوابة مهمة نحو أسواق الشرق الأوسط وأفريقيا، ليس فقط بسبب موقعها الجغرافي، وإنما أيضا بسبب وزنها السياسي والعسكري وعلاقاتها الواسعة مع دول القارة، ما يجعل عرض الأسلحة الروسية الحديثة في العلمين فرصة للوصول إلى جمهور أكبر من المشترين والخبراء وصناع القرار.\n\nأعلن المدير العام لشركة \"روس أوبورون إكسبورت\"، ألكسندر ميخييف، أن الشركة ستعرض خلال مشاركتها في معرض بمصر أحدث الابتكارات الروسية في منظومات الدفاع الجوي.\n\nأعلنت شركة \"روستيخ\" الروسية أن مقاتلة الجيل الخامس الروسية سو-57إي، المزودة بنظام تسليح جديد كليا، سيكشف النقاب عنها لأول مرة في معرض العلمين الدولي للطيران 2026 في مصر."}, {"guid": "https://arabic.rt.com/world/1829014-%D9%85%D8%B3%D8%A4%D9%88%D9%84-%D9%81%D9%8A-%D9%85%D9%83%D8%AA%D8%A8-%D8%A7%D9%84%D9%85%D8%AF%D8%B9%D9%8A-%D8%A7%D9%84%D8%B9%D8%A7%D9%85-%D8%A7%D9%84%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A-%D9%85%D8%AA%D9%87%D9%85-%D8%A8%D8%AD%D9%85%D8%A7%D9%8A%D8%A9-%D9%85%D8%B1%D8%A7%D9%83%D8%B2-%D8%A7%D8%AD%D8%AA%D9%8A%D8%A7%D9%84-%D9%88%D8%BA%D8%B3%D9%84-941-%D8%A3%D9%84%D9%81-%D8%AF%D9%88%D9%84%D8%A7%D8%B1/", "title": "مسؤول في مكتب المدعي العام الأوكراني متهم بحماية مراكز احتيال وغسل 941 ألف دولار", "summary": "كشف المكتب الوطني لمكافحة الفساد في أوكرانيا تورط مسؤول في مكتب المدعي العام في حماية مراكز اتصال احتيالية وغسل 42 مليون غريفنيا أي نحو 941 ألف دولار.", "link": "https://arabic.rt.com/world/1829014-%D9%85%D8%B3%D8%A4%D9%88%D9%84-%D9%81%D9%8A-%D9%85%D9%83%D8%AA%D8%A8-%D8%A7%D9%84%D9%85%D8%AF%D8%B9%D9%8A-%D8%A7%D9%84%D8%B9%D8%A7%D9%85-%D8%A7%D9%84%D8%A3%D9%88%D9%83%D8%B1%D8%A7%D9%86%D9%8A-%D9%85%D8%AA%D9%87%D9%85-%D8%A8%D8%AD%D9%85%D8%A7%D9%8A%D8%A9-%D9%85%D8%B1%D8%A7%D9%83%D8%B2-%D8%A7%D8%AD%D8%AA%D9%8A%D8%A7%D9%84-%D9%88%D8%BA%D8%B3%D9%84-941-%D8%A3%D9%84%D9%81-%D8%AF%D9%88%D9%84%D8%A7%D8%B1/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9bf1714c59b70fc505847e.jpg", "category": "اقتصاد", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788606600, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nكشف المكتب الوطني لمكافحة الفساد في أوكرانيا تورط مسؤول في مكتب المدعي العام في حماية مراكز اتصال احتيالية وغسل 42 مليون غريفنيا أي نحو 941 ألف دولار.\n\nوقال المكتب الوطني لمكافحة الفساد والنيابة المتخصصة لمكافحة الفساد إنهما فككا منظمة إجرامية كان أعضاؤها يحصلون بشكل منهجي على منافع غير مشروعة من مراكز اتصال احتيالية ويغسلون أموالا تقدر بالملايين.\n\nوبحسب المكتب، تبين أن أحد رؤساء الوحدات الهيكلية في مكتب المدعي العام كان منظم المخطط الإجرامي، إذ بدأ منذ منتصف عام 2025 في غسل الأموال.\n\nواستخدم المشاركون في المخطط جزءا من الأموال لشراء عقارات في مجمع سكني شهير بالقرب من جبال الكاربات غربي أوكرانيا.\n\nوأكدت الهيئة أنه تم حتى الآن الكشف عن خمسة من المشاركين في المنظمة الإجرامية، مشيرة إلى أن الإجراءات التحقيقية مستمرة لتحديد هوية مشاركين آخرين.\n\nونقلت صحيفة \"برافدا الأوكرانية\" عن مصادرها في وقت سابق أن رئيس قسم الجرائم الإلكترونية سيرغي كرابيفا قد تم اعتقاله بالفعل في سياق هذه العملية.\n\nوتأتي هذه العملية بعد أيام من عملية خاصة أعلن عنها المكتب الوطني لمكافحة الفساد في 19 أغسطس الماضي، ضد مجموعة متهمة بتنظيم شرعنة الأموال المتحصل عليها بطرق إحتيالية.\n\nضمت هذه المجموعة نائبة رئيس مكتب الرئيس الأوكراني إيرينا مودرايا، والنائب السابق مكسيم ميكيتاس، والنائب في البرلمان فاديم ستولار، ورئيس مجلس إدارة بنك \"سينس\" الحكومي أليكسي ستيوباك، ورئيس مجلس الإشراف على البنك ميكولا غلاديشينكو.\n\nوعلى خلفية هذه الفضيحة، وقع فلاديمير زيلينسكي مرسوما بإقالة مودرايا، فيما بدأ مجلس الوزراء إجراءات لإقالة وإبعاد المسؤولين في بنك \"سينس\"، بالإضافة إلى البدء ببيع البنك الحكومي.\n\nوسبق أن أشارت مجلة \"الإيكونوميست\" إلى أن الفساد والفوضى السياسية يتفشيان في أوكرانيا، حيث كشفت التحقيقات الأخيرة أن تجاوزات السلطات بات ينظر إليها من قبل المسؤولين كظاهرة روتينية وعادية.\n\nأفاد تقرير نشرته مجلة \"فورين بوليسي\" الأمريكية، بأن الرئيس الأوكراني المنتهية ولايته فلاديمير زيلينسكي فقد ثقة الأوكرانيين وسيبعدونه عن السلطة في أول فرصة انتخابية.\n\nأعلن المكتب الوطني الأوكراني والنيابة العامة المتخصصين لمكافحة الفساد عن تنفيذ عملية خاصة لكشف منظمة إجرامية يرأسها مسؤول في مكتب النائب العام، متورطة في التستر على شبكة احتيالية.\n\nنشرت وسائل إعلام أوكرانية لقطات جديدة تُظهر تبادلا لإطلاق النار وقع ليلا وصباحا في منطقة \"بيريزنياكي\" بالعاصمة كييف، بين موظفي جهاز الأمن الأوكراني ومديرية الاستخبارات الرئيسية.\n\nأفادت قناة \"أوبشيتنفيناو\" على \"تلغرام\" بأن محكمة أوكرانية أمرت بحبس إيرينا مودرايا، نائبة مدير مكتب فلاديمير زيلينسكي السابقة، على ذمة التحقيق في قضية تتعلق بمنظمة إجرامية.\n\nأشارت مجلة \"الإيكونوميست\" إلى أن الفساد والفوضى السياسية يتفشيان في أوكرانيا، حيث كشفت التحقيقات الأخيرة أن تجاوزات السلطات باتت تنظر إليها من قبل المسؤولين كظاهرة روتينية وعادية.\n\nقال وزير الدفاع الأوكراني السابق ميخائيل فيدوروف إن مستوى الفساد المتفشي في بلاده سيمنع حل النزاع المسلح ولن يسمح بإعادة بناء البلاد."}, {"guid": "https://arabic.rt.com/middle_east/1829023-%D9%87%D8%A2%D8%B1%D8%AA%D8%B3-%D8%AA%D9%88%D8%AA%D8%B1-%D8%A8%D9%8A%D9%86-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84-%D9%88%D9%85%D8%AC%D9%84%D8%B3-%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85-%D8%A8%D8%B4%D8%A3%D9%86-%D8%BA%D8%B2%D8%A9-%D9%88%D9%85%D8%AD%D8%A7%D9%88%D9%84%D8%A7%D8%AA-%D9%84%D8%AA%D8%B9%D8%AF%D9%8A%D9%84-%D9%81%D8%B1%D9%8A%D9%82-%D8%A7%D9%84%D8%AA%D9%81%D8%A7%D9%88%D8%B6-%D9%85%D8%B9-%D9%86%D8%AA%D9%86%D9%8A%D8%A7%D9%87%D9%88/", "title": "\"هآرتس\": توتر بين إسرائيل و\"مجلس السلام\" بشأن غزة ومحاولات لتعديل فريق التفاوض مع نتنياهو", "summary": "كشفت صحيفة \"هآرتس\" عن خلافات متصاعدة بين الحكومة الإسرائيلية و\"مجلس السلام\" المدعوم من الإدارة الأمريكية بشأن تنفيذ خطة الرئيس دونالد ترامب المؤلفة من 20 بندا لقطاع غزة.", "link": "https://arabic.rt.com/middle_east/1829023-%D9%87%D8%A2%D8%B1%D8%AA%D8%B3-%D8%AA%D9%88%D8%AA%D8%B1-%D8%A8%D9%8A%D9%86-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84-%D9%88%D9%85%D8%AC%D9%84%D8%B3-%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85-%D8%A8%D8%B4%D8%A3%D9%86-%D8%BA%D8%B2%D8%A9-%D9%88%D9%85%D8%AD%D8%A7%D9%88%D9%84%D8%A7%D8%AA-%D9%84%D8%AA%D8%B9%D8%AF%D9%8A%D9%84-%D9%81%D8%B1%D9%8A%D9%82-%D8%A7%D9%84%D8%AA%D9%81%D8%A7%D9%88%D8%B6-%D9%85%D8%B9-%D9%86%D8%AA%D9%86%D9%8A%D8%A7%D9%87%D9%88/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c07474c59b710230537a0.jpg", "category": "سياسة", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788605813, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nكشفت صحيفة \"هآرتس\" عن خلافات متصاعدة بين الحكومة الإسرائيلية و\"مجلس السلام\" المدعوم من الإدارة الأمريكية بشأن تنفيذ خطة الرئيس دونالد ترامب المؤلفة من 20 بندا لقطاع غزة.\n\nيأتي ذلك، وسط حديث عن مساع لتغيير المسؤول الأمريكي المكلف بإدارة الاتصالات مع رئيس الوزراء بنيامين نتنياهو.\n\nونقلت الصحيفة عن مصادر مطلعة أن جاريد كوشنر، صهر الرئيس الأمريكي، ونيكولاي ملادينوف، المفوض السامي لـ\"مجلس السلام\" بشأن غزة، يسعيان إلى تقليص دور أرييه لايتستون، الذي كلفه البيت الأبيض حتى الآن بمتابعة تنفيذ الخطة والتواصل مع إسرائيل.\n\nوقالت المصادر إن كوشنر وملادينوف يريان أن لايتستون \"ليس حازما بما يكفي\" في إدارة المفاوضات مع الجانب الإسرائيلي، وإن رئيس الوزراء البريطاني الأسبق توني بلير أبدى بدوره تحفظات على مستوى اطلاعه على تفاصيل الملف.\n\nوبحسب الصحيفة، يجري تداول اسم جوش هالبيرن، المحامي الخاص للرئيس ترامب والمستشار القانوني لـ\"مجلس السلام\"، لتولي دور أكثر مركزية في المحادثات مع نتنياهو. غير أن مصدرا في المجلس نفى وجود نية لإقصاء لايتستون، واصفا الحديث عن تقليص دوره أو استبداله بأنه \"اختلاق تام\".\n\nوقالت \"هآرتس\" إن التباين لا يقتصر على فريق التفاوض، بل يشمل مؤسسات أمنية إسرائيلية، بينها جهات في مجلس الأمن القومي ووزارة الدفاع والقيادة الجنوبية للجيش، قالت مصادر إن مسؤولين فيها يبدون رفضا علنيا للتعاون مع \"مجلس السلام\".\n\nونقلت الصحيفة عن مصدر مطلع أن مسؤولين إسرائيليين اتهموا الجانب الأمريكي بالتعامل مع إسرائيل كـ\"أمر مسلم به\"، معتبرين أن تطبيق خريطة الطريق المتفق عليها مع حركة حماس قد يترك انطباعا لدى الرأي العام الإسرائيلي بأن الحكومة \"تبيع إسرائيل\".وأشارت الصحيفة إلى أن الخلافات تنعكس على ملفات تنفيذية في غزة، بينها تشغيل جهاز فحص شعاعي متقدم وفرته ألمانيا ووضعته عند معبر إيرز أو معبر بيت حانون، بهدف تسريع تفتيش الشحنات وتوسيع إدخال المساعدات إلى شمال القطاع مع مراعاة المتطلبات الأمنية الإسرائيلية.\n\nلكن تشغيل المعبر للبضائع لا يزال معلقا، بعدما أعلن نتنياهو ووزير الدفاع يسرائيل كاتس أنه لا توجد تعليمات لفتحه، رغم الترتيبات السابقة المتعلقة بوضع الجهاز، وفقا لما نقلته الصحيفة. وتقول مصادر إن ذلك عزز حالة الغموض بشأن الجدول التنفيذي لخطة إدخال المساعدات عبر مسارات إضافية.\n\nوأضافت \"هآرتس\" أن إسرائيل تعرقل، وفق مصادرها، دخول قوة استقرار دولية مقترحة إلى غزة، كما تمنع آلاف العناصر الذين اختيروا للانضمام إلى قوة شرطة فلسطينية جديدة من مغادرة القطاع لتلقي تدريب في مصر.ويتمحور الخلاف الرئيسي حول ترتيب خطوات نزع سلاح حماس وانسحاب الجيش الإسرائيلي من غزة. إذ تتمسك حكومة نتنياهو بأن نزع السلاح الكامل يجب أن يسبق الانسحاب، بينما يقوم التصور الذي يطرحه \"مجلس السلام\" على تنفيذ متبادل وتدريجي: تحقق خطوات لنزع السلاح في منطقة محددة، يتبعها انسحاب إسرائيلي منها وانتشار قوة استقرار دولية، ثم تتكرر العملية في مناطق أخرى.\n\nوبحسب مصدر في \"مجلس السلام\"، فإن أي اتفاق نهائي يفترض أن يتضمن تسليم حماس جميع الأسلحة وإنهاء دورها في إدارة غزة، مع بقاء تفاصيل فنية، بينها الجداول الزمنية، قيد النقاش بين الأطراف.\n\nوقالت الصحيفة إن الأجهزة الاستخباراتية الإسرائيلية عرضت، خلال اجتماع شارك فيه نتنياهو وكوشنر وملادينوف وبلير، مخاوف مرتبطة بإمكان عدم التزام حماس بنزع السلاح، إضافة إلى معلومات قالت إنها تتصل بتمويل تركي. في المقابل، قال مصدر في \"مجلس السلام\" إن هذه المخاوف ليست جديدة، وإن الخطة بنيت أساسا على آلية متبادلة للتحقق والتنفيذ.\n\nوتبرز هذه الخلافات، بحسب \"هآرتس\"، في وقت تواجه فيه الحكومة الإسرائيلية ضغوطا سياسية داخلية مع اقتراب الانتخابات، فيما لا تزال آليات إدخال المساعدات، وانتشار القوة الدولية، وتدريب الشرطة الفلسطينية، والتسلسل العملي للانسحاب ونزع السلاح، من دون حل نهائي.\n\nانتشلت طواقم الدفاع المدني الفلسطيني 55 جثمانا من تحت أنقاض مبنى يعود لعائلة \"ملكة\" في حي الزيتون شرقي مدينة غزة، كان يؤوي أكثر من 60 نازحا قبل تعرضه لقصف إسرائيلي قبل نحو عامين.\n\nطرح وزيران إسرائيليان هذا الأسبوع مقترحات تتعلق بالترحيل الجماعي للفلسطينيين من قطاع غزة، وسط أجواء مشحونة تسبق الانتخابات المقررة في أكتوبر، في سعيهما لحشد المؤيدين.\n\nكشفت مصادر إسرائيلية عن تفاصيل عملية اعتقال نفذها الشاباك والجيش الإسرائيلي في قلب قطاع غزة، أدت لاعتقال معين العربيد، رئيس الأمن الداخلي لحماس، ونقله حياً إلى إسرائيل للاستجواب."}, {"guid": "https://www.bbc.com/arabic/articles/cx2z7qyv703o#0", "title": "محاكمة ليندسي كلانسي: تطورات جديدة في قضية قاتلة أطفالها الثلاثة", "summary": "ستظل الممرضة السابقة، البالغة من العمر 36 عاماً، محتجزة بالتهم نفسها المتعلقة بالقتل، وستواصل الإقامة في منشأة الصحة النفسية الذي توجد فيها حالياً.", "link": "https://www.bbc.com/arabic/articles/cx2z7qyv703o?at_medium=RSS&at_campaign=rss", "image": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/3739/live/849a8800-a925-11f1-b4c6-5d3474716d27.jpg", "category": "أخبار", "source_id": "bbc-arabic", "source_name": "بي بي سي عربي", "source_cat": "دولية", "published": 1788605809, "detail": "BBC News, عربيإذهب الى المحتوىرئيسيةشاهداستمعأقسامرئيسيةأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتمحاكمة ليندسي كلانسي: تطورات جديدة في قضية قاتلة أطفالها الثلاثةصدر الصورة، Getty Images\n\nتحذير: تتضمن هذه القصة تفاصيل مؤلمة وإشارات إلى محاولة انتحار.\n\nأعلن قاضٍ في ولاية ماساتشوستس بطلان محاكمة ليندسي كلانسي في قضية قتل أطفالها الثلاثة الصغار، بعدما أقرت هيئة المحلفين، عقب أسبوع من المداولات، بعدم قدرتها على التوصل بالإجماع إلى قرار بشأن مسؤولية كلانسي الجنائية عن قتل أطفالها.\n\nواستحوذت القضية على اهتمام واسع وأثارت انقساماً حاداً بين الأمريكيين، حتى إنها دفعت الرئيس الأمريكي إلى التعليق عليها.\n\nوسادت قاعة المحكمة حالة من الذهول، بعدما بات مصير القضية ومستقبل كلانسي معلقين.\n\nوقاد محامي كلانسي محاولة أخيرة لوقف إعلان بطلان المحاكمة وإلزام هيئة المحلفين بالتوصل إلى قرار، لكن المحاولة لم تنجح. وقد تُحدد جلسة تُعقد لاحقاً هذا الشهر الخطوة التالية في القضية.\n\nوقال القاضي وليام سوليفان لهيئة المحلفين يوم الجمعة: \"في هذه المرحلة، سأعلن أن هيئة المحلفين وصلت إلى طريق مسدود، وسأعلن بطلان المحاكمة\".\n\nوصرف القاضي أعضاء الهيئة بعد أسابيع من الاستماع إلى الشهادات وسبعة أيام من المداولات بشأن مصير كلانسي، وثلاث إشارات من الهيئة إلى عجزها عن التوصل إلى إجماع.\n\nولا يعني تعذّر اتفاق هيئة المحلفين، وهي الحالة المعروفة باسم \"هيئة المحلفين المعلقة\"، أن الادعاء أثبت قضيته، كما لا يعني أن المتهمة غير مذنبة."}, {"guid": "https://arabic.rt.com/sport/1829037-%D9%84%D9%85%D8%A7%D8%B0%D8%A7-%D9%84%D9%85-%D8%AA%D8%B9%D8%AF-%D8%B1%D9%83%D9%84%D8%A9-%D8%AC%D8%B2%D8%A7%D8%A1-%D9%85%D8%A8%D8%A7%D8%A8%D9%8A-%D8%AA%D9%81%D8%B5%D9%8A%D9%84%D8%A9-%D8%B5%D8%BA%D9%8A%D8%B1%D8%A9-%D9%81%D9%8A-%D8%A7%D9%84%D9%82%D9%88%D8%A7%D9%86%D9%8A%D9%86-%D8%A3%D8%B7%D8%A7%D8%AD%D8%AA-%D8%A8%D8%A2%D9%85%D8%A7%D9%84-%D8%B1%D9%8A%D8%A7%D9%84-%D9%85%D8%AF%D8%B1%D9%8A%D8%AF/", "title": "لماذا لم تعد ركلة جزاء مبابي؟.. تفصيلة صغيرة في القوانين أطاحت بآمال ريال مدريد", "summary": "أثار قرار عدم إعادة ركلة الجزاء التي أهدرها نجم ريال مدريد كيليان مبابي ضد بيتيس جدلا واسعا، بسبب شكوك حول دخول مدافع الفريق الأندلسي مارك بارترا إلى منطقة الجزاء قبل تنفيذ الركلة.", "link": "https://arabic.rt.com/sport/1829037-%D9%84%D9%85%D8%A7%D8%B0%D8%A7-%D9%84%D9%85-%D8%AA%D8%B9%D8%AF-%D8%B1%D9%83%D9%84%D8%A9-%D8%AC%D8%B2%D8%A7%D8%A1-%D9%85%D8%A8%D8%A7%D8%A8%D9%8A-%D8%AA%D9%81%D8%B5%D9%8A%D9%84%D8%A9-%D8%B5%D8%BA%D9%8A%D8%B1%D8%A9-%D9%81%D9%8A-%D8%A7%D9%84%D9%82%D9%88%D8%A7%D9%86%D9%8A%D9%86-%D8%A3%D8%B7%D8%A7%D8%AD%D8%AA-%D8%A8%D8%A2%D9%85%D8%A7%D9%84-%D8%B1%D9%8A%D8%A7%D9%84-%D9%85%D8%AF%D8%B1%D9%8A%D8%AF/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c0ed242360418cd1d1292.png", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788605656, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nأثار قرار عدم إعادة ركلة الجزاء التي أهدرها نجم ريال مدريد كيليان مبابي ضد بيتيس جدلا واسعا، بسبب شكوك حول دخول مدافع الفريق الأندلسي مارك بارترا إلى منطقة الجزاء قبل تنفيذ الركلة.\n\nورغم الحيرة التي سادت الأوساط الرياضية، كشفت اللجنة الفنية للحكام في إسبانيا (CTA)، وفقا لتقرير صحيفة \"موندو ديبورتيفو\"، أن حكم الساحة أليخاندرو هرنانديز وحكم تقنية الفيديو خافيير إغليسياس فيلانويفا اتخذا القرار الصائب تماما بعدم إعادة الركلة، وذلك استنادا إلى نص دقيق في قوانين الاتحاد الدولي لكرة القدم (IFAB) ودليل (CARD) التحكيمي للموسم الحالي.\n\nتنص القواعد المعتمدة على أن موقع اللاعب لحظة تنفيذ ركلة الجزاء يحدد بناء على موقع قدميه، أو أي جزء من جسده يكون ملامسا للأرض بالفعل.\n\nأما في حالة القفز، فتوضح قواعد \"IFAB\" تفصيلة حاسمة: \"يحتسب المسقط العمودي (الافتراضي) لقدمي اللاعب المعلق في الهواء فقط إذا كان جسده بأكمله منفصلا عن الأرض ولا يلامسها بأي جزء\".\n\nوهنا تكمن التفصيلة الصغير التي حسمت الموقف في ركلة جزاء مبابي الضائعة، إذ أظهرت مراجعة اللقطة أن مارك بارترا لم يكن معلقا بالكامل في الهواء، بل كانت إحدى قدميه داخل منطقة الجزاء والأخرى تلامس الأرض خارجها.\n\nهذا التلامس الخارجي منع القوانين من تطبيق مفهوم \"المسقط العمودي الافتراضي\"، واعتبرت وضعية جسده قانونية ولا تستوجب إلغاء اللعبة أو إعادة الركلة.\n\nوتضيف القوانين شرطا آخر لاحتساب مخالفة الاقتحام المبكر لمنطقة الجزاء أثناء تنفيذ ركلة الجزاء، إذ لا يكفي مجرد دخول المدافع للمنطقة، بل يجب أن يؤثر تقدمه بوضوح على منفذ الركلة، أو أن يتنافس على الكرة بعد ارتدادها من الحارس بطريقة تمنع المنافس من التسجيل.\n\nففي حالة مارك بارترا، لو كانت كلتا قدميه معلقتين في الهواء ومسقطهما الافتراضي داخل منطقة الجزاء، لاعتبر ذلك محاولة للتحايل على القانون، ولتوجب إعادة ركلة الجزاء، لكن ثبوت إحدى قدميه على الأرض خارج المنطقة جعل دخوله متوافقا مع النص الصريح للقانون، ليحسم هذا البند الدقيق الجدل المثار ويغلق باب النجاة أمام ريال مدريد الذي خسر المباراة أمام بيتيس بهدف دون رد.\n\nأثار البرازيلي فينيسيوس جونيور جناح ريال مدريد موجة واسعة من الجدل بسبب تصرفه مع مدربه البرتغالي جوزيه مورينيو، عقب الهزيمة أمام ريال بيتيس 0-1 في الدوري الإسباني.\n\nتلقى ريال مدريد الهزيمة الأولى في الموسم الحالي وسقط أمام مضيفه ريال بيتيس بهدف دون رد مساء الجمعة، في الجولة الرابعة من الدوري الإسباني لكرة القدم."}, {"guid": "https://arabic.rt.com/world/1829038-%D8%AA%D9%88%D8%A7%D9%81%D9%82-%D9%81%D9%8A-%D8%AC%D9%86%D9%8A%D9%81-%D9%8A%D9%85%D9%87%D8%AF-%D9%84%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%AF%D9%88%D9%84%D9%8A%D8%A9-%D8%A8%D8%B4%D8%A3%D9%86-%D8%A7%D9%84%D8%B1%D9%88%D8%A8%D9%88%D8%AA%D8%A7%D8%AA-%D8%A7%D9%84%D9%82%D8%A7%D8%AA%D9%84%D8%A9/", "title": "توافق في جنيف يمهد لقواعد دولية بشأن \"الروبوتات القاتلة\"", "summary": "اتفقت 128 دولة، السبت، على وثيقة غير ملزمة تمهد لوضع قواعد دولية لتنظيم الأسلحة ذاتية التشغيل، المعروفة بـ\"الروبوتات القاتلة\".", "link": "https://arabic.rt.com/world/1829038-%D8%AA%D9%88%D8%A7%D9%81%D9%82-%D9%81%D9%8A-%D8%AC%D9%86%D9%8A%D9%81-%D9%8A%D9%85%D9%87%D8%AF-%D9%84%D9%82%D9%88%D8%A7%D8%B9%D8%AF-%D8%AF%D9%88%D9%84%D9%8A%D8%A9-%D8%A8%D8%B4%D8%A3%D9%86-%D8%A7%D9%84%D8%B1%D9%88%D8%A8%D9%88%D8%AA%D8%A7%D8%AA-%D8%A7%D9%84%D9%82%D8%A7%D8%AA%D9%84%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c0ca44c59b725d0347c9d.png", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788605540, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nاتفقت 128 دولة، السبت، على وثيقة غير ملزمة تمهد لوضع قواعد دولية لتنظيم الأسلحة ذاتية التشغيل، المعروفة بـ\"الروبوتات القاتلة\".\n\nويمثل التوافق خطوة مهمة بعد أكثر من عقد من المفاوضات بشأن كيفية تنظيم أنظمة قادرة، بدرجات متفاوتة من الاستقلالية، على تحديد الأهداف واختيارها ومهاجمتها دون تدخل مباشر من مشغّل بشري في كل مرحلة.\n\nوتوصلت الدول المشاركة إلى الاتفاق خلال اجتماعات عقدتها في جنيف هذا الأسبوع في إطار اتفاقية الأسلحة التقليدية التابعة للأمم المتحدة، والتي تنظم أو تحظر أنواعاً من الأسلحة تعد عشوائية الأثر أو مفرطة الضرر. ولا تحمل الوثيقة طابعا ملزما قانونيا، لكنها قد تفتح المجال أمام مفاوضات رسمية لاحقة للتوصل إلى صك دولي أو معاهدة بشأن الأسلحة ذاتية التشغيل.\n\nوقالت المديرة التنفيذية لمنظمة \"أوقفوا الروبوتات القاتلة\" نيكول فان روين إن الصيغة النهائية بدت، من وجهة نظر منظمتها، أضعف من المسودة التي عملت عليها الدول خلال السنوات الثلاث الماضية، لا سيما فيما يتعلق بتعريف الأسلحة ذاتية التشغيل والضمانات الرامية إلى الحد من أضرارها المحتملة على المدنيين.\n\nوقالت فان روين لرويترز: \"من المؤسف حقا أن العمل الذي أنجزته الدول على الوثيقة على مدى السنوات الثلاث الماضية جرى إضعافه بدرجة كبيرة في الساعات الأخيرة\".\n\nوجاء الاتفاق بعد مفاوضات مطولة استمرت حتى ساعات متأخرة لتجاوز خلافات حول الصياغة، في ظل تحفظات على اعتماد قواعد دولية ملزمة قانونيا. وتفضيل الاعتماد وفقا لرويترز، على مبادئ توجيهية وطنية بدلا من معاهدة دولية، كما سعت الولايات المتحدة إلى الإبقاء على مرونة واسعة في النص، بما في ذلك ما يتصل بدرجة السيطرة البشرية على القرارات المتعلقة باستخدام القوة.\n\nويأتي ذلك مع تزايد القلق الدولي من احتمال استخدام الأنظمة الفتاكة ذاتية التشغيل في النزاعات، بما في ذلك الحروب الدائرة في أوكرانيا والسودان والشرق الأوسط، وما قد يترتب عليها من مخاطر على المدنيين والمساءلة القانونية عند اتخاذ الآلات قرارات تمس الحياة والموت.\n\nدمر الروبوت البري القتالي الروسي \"كوريير\" لأول مرة خلال العملية العسكرية الخاصة طائرة مسيرة أوكرانية ثقيلة سداسية المراوح من نوع \"بابا ياغا\".\n\nأفادت قناة \"أوسفيدوميتيل\" على \"تليغرام\" بتزويد مسيرة روسية بعيدة المدى بمسيّرتين انتحاريتين من نوع FPV مما يعزز قدراتها وتتبعها للأهداف."}, {"guid": "https://arabic.rt.com/business/1829032-%D8%B3%D9%8A%D9%84%D9%88%D8%A7%D9%86%D9%88%D9%81-%D9%85%D8%B4%D8%A7%D8%B1%D9%83%D9%88%D9%86-%D9%81%D9%8A-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9-%D9%85%D8%AC%D9%85%D9%88%D8%B9%D8%A9-%D8%A7%D9%84%D8%B9%D8%B4%D8%B1%D9%8A%D9%86-%D8%AF%D8%B9%D9%88%D8%A7-%D8%A5%D9%84%D9%89-%D8%A5%D9%86%D9%87%D8%A7%D8%A1-%D8%A7%D9%84%D9%86%D8%B2%D8%A7%D8%B9-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A-%D8%A7%D9%84%D8%A5%D9%8A%D8%B1%D8%A7%D9%86%D9%8A/", "title": "سيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني", "summary": "ناقش المشاركون في اجتماع وزراء المالية ومحافظي البنوك المركزية لمجموعة العشرين في مدينة آشفيل الأمريكية تأثير أزمة الخليج على الاقتصاد العالمي ودعوا إلى تسويتها في أسرع وقت.", "link": "https://arabic.rt.com/business/1829032-%D8%B3%D9%8A%D9%84%D9%88%D8%A7%D9%86%D9%88%D9%81-%D9%85%D8%B4%D8%A7%D8%B1%D9%83%D9%88%D9%86-%D9%81%D9%8A-%D8%A7%D8%AC%D8%AA%D9%85%D8%A7%D8%B9-%D9%85%D8%AC%D9%85%D9%88%D8%B9%D8%A9-%D8%A7%D9%84%D8%B9%D8%B4%D8%B1%D9%8A%D9%86-%D8%AF%D8%B9%D9%88%D8%A7-%D8%A5%D9%84%D9%89-%D8%A5%D9%86%D9%87%D8%A7%D8%A1-%D8%A7%D9%84%D9%86%D8%B2%D8%A7%D8%B9-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A-%D8%A7%D9%84%D8%A5%D9%8A%D8%B1%D8%A7%D9%86%D9%8A/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c0d464236041b21101293.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788605240, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nناقش المشاركون في اجتماع وزراء المالية ومحافظي البنوك المركزية لمجموعة العشرين في مدينة آشفيل الأمريكية تأثير أزمة الخليج على الاقتصاد العالمي ودعوا إلى تسويتها في أسرع وقت.\n\nلا توازن اقتصاديا لدول الخليج دون مضيق هرمز صرح بذلك وزير المالية الروسي أنطون سيلوانوف في حوار مع وكالة \"تاس\" ردا على سؤال عما إذا كان اجتماع آشفيل الذي عُقد في الفترة من 31 أغسطس إلى 1 سبتمبر، قد تناول الأحداث المتعلقة بإيران.\n\nوقال سيلوانوف: \"هذا الموضوع طرح، بما في ذلك بمبادرة من الدول الغربية، في سياق مناقشة الوضع الاقتصادي العالمي. من الواضح أن الجميع قلقون بشأن الوضع حول مضيق هرمز، وحجم إمدادات النفط من دول الخليج، وأسعار الطاقة\".\n\nوأضاف: \"ناقشنا مدى توافر موارد الطاقة وكذلك الأسمدة التي يعتمد إنتاجها بشكل كبير على موارد الطاقة. بالنسبة للدول المستوردة، فإن أي انقطاع في الإمدادات يشكل خطرا جسيما على الاستقرار الاقتصادي والمالي، فيما تشكل أسعار الطاقة المتزايدة ضغطا إضافيا على الميزانيات الوطنية. لذا دعا المشاركون في الاجتماع إلى إيجاد حل سريع للنزاع\".\n\nبحث وزير الخارجية المصري بدر عبد العاطي مع نظيره العماني بدر بن حمد البوسعيدي مستجدات الأوضاع الإقليمية والجهود الرامية لاحتواء التوتر الراهن واستعادة الهدوء والاستقرار بالمنطقة.\n\nأعلن الرئيس الأمريكي دونالد ترامب أن حجم إمدادات النفط العابرة لمضيق هرمز عادت بشكل شبه كامل إلى مستوياتها التي كانت سائدة قبل اندلاع الصراع مع إيران.\n\nأعلن وزير الخزانة الأمريكي سكوت بيسنت أن واشنطن تعتزم فرض عقوبات جديدة على بنكين إيرانيين، مؤكدا أن بلاده تستخدم الضغوط الاقتصادية لـ\"خنق إيران اقتصاديا وإرغامها على إبرام اتفاق\"."}, {"guid": "https://arabic.rt.com/videoclub/1829031-%D9%86%D9%8A%D8%A8%D8%A7%D9%84-%D8%A5%D9%86%D9%82%D8%A7%D8%B0-%D8%A7%D9%85%D8%B1%D8%A3%D8%A9-%D8%A8%D8%B9%D8%AF-%D9%85%D8%B1%D9%88%D8%B1-11-%D8% "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788603782, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nأعلن نادي ليفربول رحيل ريتشارد هيوز المدير الرياضي \"للريدز\" بعد موسمين قضاهما داخل جدران النادي الإنجليزي حقق خلالهما بعض النجاحات.\n\nوتولى ريتشارد هيوز منصب المدير الرياضي لليفربول في عام 2024 تمكن حينها الريدز من التتويج بلقب الدوري الإنجليزي الممتاز للمرة الـ20 في تاريخه.\n\nوأكد نادي ليفربول أن ريتشارد هيوز تقدم باستقالته من منصب المدير الرياضي للنادي، وتشير التقارير الحالية إلى اقترابه من تولي نفس المنصب لنادي الهلال السعودي.\n\n🚨⚠️ عــاجــل ورســمــيًــا ⚠️🚨 النادي يعلن رحيل ريتشارد هيوز في بيان رسمي. pic.twitter.com/MfxY0zzZ7z\n\nوقال هيوز عبر الموقع الرسمي لليفربول: \"أولا وقبل كل شيء أود أن أؤكد ما قلته عند وصولي هنا لقد كان مصدر فخر كبير لي إتاحة الفرصة لخدمة هذه المؤسسة الرائعة والفريدة من نوعها وهذا شيء سأظل ممتنا له دائما\".\n\nوأكمل: \"يمتد تقديري إلى المالكين لدعمهم وقيادتهم وإلى موظفي النادي على جميع المستويات الذين يبذلون الكثير لجعل نادي ليفربول ما هو عليه الآن وإلى اللاعبين المذهلين وإلى الجماهير التي تدعم الفريق بأعداد كبيرة أينما ومتى أقيمت المباريات\".\n\nواختتم: \"سأظل دائما أتابع وأدعم النادي بكل محبة وأتمنى لكل من له صلة بالنادي كل التوفيق والنجاح في هذا الموسم وما بعده\".\n\nكشف محمد صلاح نجم فريق طرابزون سبور التركي عن هوية اللاعب الذي يتواصل معه باستمرار من صفوف فريقه السابق ليفربول الإنجليزي.\n\nحقق ليفربول انتصاره الأول في الدوري الإنجليزي الممتاز لكرة القدم هذا الموسم بتغلبه على مضيفه إيبسويتش تاون بهدفين دون رد مساء الجمعة، في الجولة الثالثة من \"البريميرليغ\"."}, {"guid": "https://arabic.rt.com/world/1829021-%D8%A8%D8%A7%D9%84%D8%AA%D8%B2%D8%A7%D9%85%D9%86-%D9%85%D8%B9-%D8%AA%D8%B5%D8%A7%D8%B9%D8%AF-%D8%B9%D9%86%D9%81-%D8%A7%D9%84%D9%85%D8%B3%D8%AA%D9%88%D8%B7%D9%86%D9%8A%D9%86-%D8%A7%D9%84%D8%B3%D9%81%D9%8A%D8%B1-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A-%D9%8A%D8%B2%D9%88%D8%B1-%D8%A8%D9%84%D8%AF%D8%A9-%D9%81%D9%84%D8%B3%D8%B7%D9%8A%D9%86%D9%8A%D8%A9-%D9%81%D9%8A-%D8%A7%D9%84%D8%B6%D9%81%D8%A9-%D8%A7%D9%84%D8%BA%D8%B1%D8%A8%D9%8A%D8%A9/", "title": "بالتزامن مع تصاعد عنف المستوطنين.. السفير الأمريكي يزور بلدة فلسطينية في الضفة الغربية", "summary": "التقى السفير الأمريكي في إسرائيل مايك هاكابي اليوم بفلسطينيين، بينهم أسر مواطنين أمريكيين قتلهم مستوطنون إسرائيليون، في بلدة ترمسعيا بالضفة الغربية التي أصبحت هدفا للمستوطنين.", "link": "https://arabic.rt.com/world/1829021-%D8%A8%D8%A7%D9%84%D8%AA%D8%B2%D8%A7%D9%85%D9%86-%D9%85%D8%B9-%D8%AA%D8%B5%D8%A7%D8%B9%D8%AF-%D8%B9%D9%86%D9%81-%D8%A7%D9%84%D9%85%D8%B3%D8%AA%D9%88%D8%B7%D9%86%D9%8A%D9%86-%D8%A7%D9%84%D8%B3%D9%81%D9%8A%D8%B1-%D8%A7%D9%84%D8%A3%D9%85%D8%B1%D9%8A%D9%83%D9%8A-%D9%8A%D8%B2%D9%88%D8%B1-%D8%A8%D9%84%D8%AF%D8%A9-%D9%81%D9%84%D8%B3%D8%B7%D9%8A%D9%86%D9%8A%D8%A9-%D9%81%D9%8A-%D8%A7%D9%84%D8%B6%D9%81%D8%A9-%D8%A7%D9%84%D8%BA%D8%B1%D8%A8%D9%8A%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9bff6b42360419075361fa.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788603726, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nالتقى السفير الأمريكي في إسرائيل مايك هاكابي اليوم بفلسطينيين، بينهم أسر مواطنين أمريكيين قتلهم مستوطنون إسرائيليون، في بلدة ترمسعيا بالضفة الغربية التي أصبحت هدفا للمستوطنين.\n\nوأقيمت عدة مستوطنات ​حول ترمسعيا القريبة من رام الله. ويقول سكانها إن مضايقات المستوطنين الإسرائيليين المسلحين ⁠متكررة وإنهم غير قادرين على منعهم من دخول البلدة وإلحاق الضرر بمنازلهم.\n\nوقال نواف زغلول رئيس ​بلدية ترمسعيا للصحفيين قبل الاجتماع \"إحنا إن شاء الله راح ننقله الصورة والمعاناة اللي بنعيشها بترمسعيا، فيه عندنا ​مواضيع كثيرة راح نطلعه عليها، كل موضوع على حدة، شو الوضع اللي نبعيشه في ترمسعيا من المستوطنين\"، مشيرا إلى أن \"اعتداءات\" المستوطنين متواصلة على مدار اليوم.\n\nوأضاف أن سكان البلدة سيطلبون من السفير المساعدة في ضمان سلامتهم وأمنهم. وأشار إلى أن ​حوالي 80 بالمئة من سكان البلدة الفلسطينيين البالغ عددهم نحو ثلاثة آلاف يحملون الجنسية الأمريكية.\n\nودعا هاكابي، ​وهو قس معمداني وداعم منذ فترة طويلة للمستوطنات الإسرائيلية، إلى محاكمة المستوطنين الذين يرتكبون أعمال عنف. لكنه عبر عن ‌اعتقاده ⁠بأن أفعالهم تمثل أقلية ضمن مجتمع المستوطنين الأوسع نطاقا، الذي يبلغ تعداد أفراده 750 ألف شخص تقريبا.\n\nونادرا ما تتم محاكمة المستوطنين الإسرائيليين المتهمين بشن هجمات تستهدف الفلسطينيين في الضفة الغربية.\n\nوقال سمير حزمة أحد سكان تمرسعيا، قبل الاجتماع مع السفير \"متأملين أن (السفير) يعمل لنا شيء بالنسبة للمستوطنين الخارجين عن القانون هدول اللي ​بييجوا بحماية الجيش\".\n\nوزار هاكابي ​قرية الطيبة، إحدى القرى ⁠المسيحية القليلة المتبقية في الضفة الغربية، في يونيو 2025 بعد تعرض كنيسة هناك لأعمال تخريب. وقال هاكابي حينذاك إن تدنيس مكان للعبادة يعد عملا ​إرهابيا وجريمة.\n\nوتشرف حكومة نتنياهو أيضا على توسيع المستوطنات في أنحاء الضفة الغربية، ​مما يعزز السيطرة ⁠الإسرائيلية على الأراضي التي يسعى الفلسطينيون إلى إقامة دولة عليها في المستقبل.\n\nوتعد المستوطنات الإسرائيلية في الضفة الغربية غير قانونية بموجب القانون الدولي، وتصفها الأمم المتحدة ومعظم الدول بأنها أراض محتلة. وتقول الحكومة الإسرائيلية إن الأراضي ⁠متنازع ​عليها، وليست محتلة.\n\nويشير هاكابي إلى الضفة الغربية باسمها التوراتي، يهودا ​والسامرة، وهو الاسم الذي تستخدمه الحكومة الإسرائيلية لكن الحكومة الأمريكية لم تعتمده رسميا. وزار هاكابي مستوطنة شيلو الواقعة بالقرب من ترمسعيا ​مرتين على الأقل منذ عام 2025.\n\nوتصاعد عنف المستوطنين في الضفة الغربية بشكل حاد منذ أن تولت الحكومة الائتلافية بقيادة رئيس الوزراء بنيامين ​نتنياهو، وهي الأكثر يمينية في تاريخ إسرائيل، السلطة في أواخر عام 2022.\n\nأظهر تقرير نشرته مفوضية الأمم المتحدة السامية لحقوق الإنسان أن القوات الإسرائيلية هجرت قسرا جميع الفلسطينيين في ثلاثة مخيمات للاجئين في الضفة الغربية في 2025 وما زالت تمنع عودتهم.\n\nأعلن وزير المالية الإسرائيلي بتسلئيل سموتريتش يوم الخميس، إقرار بناء 1516 وحدة استيطانية جديدة بالضفة الغربية المحتلة.\n\nدعت صحيفة \"الغارديان\" البريطانية، الحكومة إلى فرض حظر تجاري شامل على المستوطنات الإسرائيلية في الضفة الغربية والقدس الشرقية."}, {"guid": "https://arabic.rt.com/middle_east/1829026-%D9%85%D9%86-%D9%87%D8%B1%D9%85%D8%B2-%D8%A5%D9%84%D9%89-%D9%88%D8%A7%D8%B4%D9%86%D8%B7%D9%86-%D9%88%D8%B7%D9%87%D8%B1%D8%A7%D9%86-%D8%AA%D8%AD%D8%B1%D9%83-%D9%85%D8%B5%D8%B1%D9%8A-%D8%B9%D9%85%D8%A7%D9%86%D9%8A-%D9%84%D8%A7%D8%AD%D8%AA%D9%88%D8%A7%D8%A1-%D8%A7%D9%84%D8%AA%D8%B5%D8%B9%D9%8A%D8%AF/", "title": "من هرمز إلى واشنطن وطهران.. تحرك مصري-عماني لاحتواء التصعيد", "summary": "بحث وزير الخارجية المصري بدر عبد العاطي مع نظيره العماني بدر بن حمد البوسعيدي مستجدات الأوضاع الإقليمية والجهود الرامية لاحتواء التوتر الراهن واستعادة الهدوء والاستقرار بالمنطقة.", "link": "https://arabic.rt.com/middle_east/1829026-%D9%85%D9%86-%D9%87%D8%B1%D9%85%D8%B2-%D8%A5%D9%84%D9%89-%D9%88%D8%A7%D8%B4%D9%86%D8%B7%D9%86-%D9%88%D8%B7%D9%87%D8%B1%D8%A7%D9%86-%D8%AA%D8%AD%D8%B1%D9%83-%D9%85%D8%B5%D8%B1%D9%8A-%D8%B9%D9%85%D8%A7%D9%86%D9%8A-%D9%84%D8%A7%D8%AD%D8%AA%D9%88%D8%A7%D8%A1-%D8%A7%D9%84%D8%AA%D8%B5%D8%B9%D9%8A%D8%AF/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c04094c59b710a5581de3.jpg", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788603686, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nبحث وزير الخارجية المصري بدر عبد العاطي مع نظيره العماني بدر بن حمد البوسعيدي مستجدات الأوضاع الإقليمية والجهود الرامية لاحتواء التوتر الراهن واستعادة الهدوء والاستقرار بالمنطقة.\n\nوأفادت وزارة الخارجية المصرية بأن الاتصال تناول تطورات المشهد الإقليمي، إلى جانب تبادل التقديرات بشأن سبل خفض التصعيد وتهيئة الظروف الملائمة لمعالجة مسببات الأزمات عبر المسارات الدبلوماسية.\n\nوشدد عبد العاطي على أولوية وقف التصعيد والابتعاد عن أي خطوات من شأنها زيادة حدة التوتر أو تهديد أمن واستقرار المنطقة، مؤكدًا ضرورة إفساح المجال أمام الجهود الدبلوماسية باعتبارها المسار الأمثل للتعامل مع الأزمات القائمة.\n\nوأكد وزير الخارجية المصري أهمية العودة إلى المفاوضات بين الولايات المتحدة وإيران، وفقا لمذكرة تفاهم إسلام آباد، والبناء عليها باعتبارها إطارا يمكن من خلاله معالجة القضايا العالقة عبر الحوار والتفاوض.\n\nويأتي التشديد المصري على المسار الدبلوماسي في ظل استمرار التوترات الإقليمية وتداخل تداعياتها الأمنية والاقتصادية، بما يزيد الحاجة إلى قنوات للحوار تحول دون اتساع نطاق التصعيد وانتقال آثاره إلى ملفات إقليمية أخرى.\n\nوتطرق الاتصال المصري-العُماني كذلك إلى التطورات المرتبطة بمضيق هرمز، الذي يمثل أحد أهم الممرات البحرية العالمية لنقل التجارة وإمدادات الطاقة، وما يمكن أن يترتب على أي اضطراب في حركة الملاحة فيه من تداعيات تتجاوز حدود المنطقة.\n\nوأكد الوزيران ضرورة الحفاظ على أمن وسلامة الملاحة البحرية وضمان انسياب حركة التجارة وإمدادات الطاقة، في ظل الأهمية الاستراتيجية للممرات البحرية في المنطقة بالنسبة إلى الاقتصاد الإقليمي والعالمي.\n\nوتعكس المشاورات المصرية-العُمانية استمرار التنسيق بين القاهرة ومسقط بشأن التطورات الإقليمية، ولا سيما في ظل تمسك البلدين بأهمية الحلول السياسية والدبلوماسية واحتواء الأزمات عبر الحوار، بما يسهم في حماية أمن المنطقة واستقرارها.\n\nهاجمت قوات القيادة المركزية الأمريكية (سنتكوم) ثلاث ناقلات نفط خام إيرانية، ردا على قيام فيلق الحرس الثوري الإيراني بإطلاق صواريخ باليستية باتجاه مدمرتين تابعتين للبحرية الأمريكية.\n\nيجتمع وزراء الخارجية العرب في القاهرة الاثنين المقبل، خلال أعمال الدورة الـ166 لمجلس جامعة الدول العربية على المستوى الوزاري، لبحث تطورات المنطقة وعدد من القضايا العربية.\n\nرد المتحدث باسم وزارة الخارجية القطرية ماجد الأنصاري على ما وصفه بـ\"الاقتباس الانتقائي\" من الجانب الإيراني لوثائق تتعلق بالهجمات التي استهدفت دولة قطر."}, {"guid": "https://www.bbc.com/arabic/articles/cwyz3jyvwg7o#0", "title": "التاريخ الخفي وراء \"موزة\" ثمنها 6 ملايين دولار", "summary": "تعرف على تاريخ الموزة التي بيعت مقابل 6 مليون دولار، وما هي قصة هذا النوع من الفنون.", "link": "https://www.bbc.com/arabic/articles/cwyz3jyvwg7o?at_medium=RSS&at_campaign=rss", "image": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/56a2/live/79ab95d0-a8d3-11f1-9a8b-8bbda9270237.jpg", "category": "اقتصاد", "source_id": "bbc-arabic", "source_name": "بي بي سي عربي", "source_cat": "دولية", "published": 1788602972, "detail": "BBC News, عربيإذهب الى المحتوىرئيسيةشاهداستمعأقسامرئيسيةأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتالتاريخ الخفي وراء \"موزة\" ثمنها 6 ملايين دولارصدر الصورة، Getty Images\n\nحين ألصق ماوريتسيو كاتيلان موزة على جدار بشريط لاصق فضي وسمّاها عملاً فنياً، أشعل واحدة من أكبر السجالات الثقافية في السنوات الأخيرة. لكن القصة الكامنة وراء عمل \"كوميديان\" تكشف تاريخاً يمتد قروناً من إثارة الجدل واستخدام الصدمات في الفن.\n\nوكان ليوناردو دي كابريو، ومايكل باي، وترافيس سكوت، من بين المشاهير الذين حضروا الافتتاح الخاص لكبار الشخصيات في معرض \"آرت بازل ميامي بيتش\" في 4 ديسمبر/كانون الأول 2019، وهو اليوم الذي ظهرت فيه ثمرة الموز المسماة \"كوميديان\" للمرة الأولى.\n\nفي ذلك الصباح، أحاطت بطاقات الأسعار الهائلة بالجميع في المعرض الفني الذي كان من بين محتوياته عددُ من الأعمال الفنية باهظة الثمن.\n\nفقد بيعت لوحة لهيلين فرانكنثالر بنحو 1.65 مليون دولار (ما يعادل 2.16 مليون دولار بقيمة اليوم) فيما كانت لوحة لوليام دي كونينغ معروضة مقابل 8 ملايين دولار (ما يعادل اليوم 10.5 مليون دولار).\n\nأما بالنسبة إلى سارة كاسكون، المراسلة في موقع \"آرت نت نيوز\"، فقد كان عامل الجذب الرئيسي هو أحدث أعمال ماوريتسيو كاتيلان الفنية: موزة مثبتة على الحائط بشريط لاصق.\n\nوفي وقت لاحق من ذلك اليوم، كتبت كاسكون أول تقرير إخباري مفصل عنه، وأبلغت القراء أن نسختين من هذا العمل الفني الذي تمثل الفاكهة موضوعه الرئيسي بيعت كل منهما مقابل 120 ألف دولار.\n\nوبعد أيام قليلة، بيعت النسخة الثالثة والأخيرة مقابل 150 ألف دولار. وحصل كل مشتري على شهادة تفيد بأنها عمل فني أصلي وتعليمات حول كيفية عرض العمل، بما في ذلك ضرورة استبدال الموزة بانتظام.\n\nوطوال فترة إقامة معرض \"آرت بازل ميامي بيتش\"، التقط مئات الزوار صوراً للعمل الفني ونشروا ردود فعلهم عبر الإنترنت."}, {"guid": "https://arabic.rt.com/sport/1829025-%D9%87%D9%84-%D9%8A%D8%AA%D9%83%D8%B1%D8%B1-%D8%B3%D9%8A%D9%86%D8%A7%D8%B1%D9%8A%D9%88-%D8%A3%D9%84%D9%88%D9%86%D8%B3%D9%88-%D9%81%D9%8A%D9%86%D9%8A%D8%B3%D9%8A%D9%88%D8%B3-%D9%8A%D8%AB%D9%8A%D8%B1-%D8%A7%D9%84%D8%AC%D8%AF%D9%84-%D8%A8%D8%AA%D8%B5%D8%B1%D9%81%D9%87-%D9%85%D8%B9-%D9%85%D9%88%D8%B1%D9%8A%D9%86%D9%8A%D9%88-%D8%B9%D9%82%D8%A8-%D8%AE%D8%B3%D8%A7%D8%B1%D8%A9-%D8%B1%D9%8A%D8%A7%D9%84-%D9%85%D8%AF%D8%B1%D9%8A%D8%AF-%D9%81%D9%8A%D8%AF%D9%8A%D9%88/", "title": "هل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)", "summary": "أثار البرازيلي فينيسيوس جونيور جناح ريال مدريد موجة واسعة من الجدل بسبب تصرفه مع مدربه البرتغالي جوزيه مورينيو، عقب الهزيمة أمام ريال بيتيس 0-1 في الدوري الإسباني.", "link": "https://arabic.rt.com/sport/1829025-%D9%87%D9%84-%D9%8A%D8%AA%D9%83%D8%B1%D8%B1-%D8%B3%D9%8A%D9%86%D8%A7%D8%B1%D9%8A%D9%88-%D8%A3%D9%84%D9%88%D9%86%D8%B3%D9%88-%D9%81%D9%8A%D9%86%D9%8A%D8%B3%D9%8A%D9%88%D8%B3-%D9%8A%D8%AB%D9%8A%D8%B1-%D8%A7%D9%84%D8%AC%D8%AF%D9%84-%D8%A8%D8%AA%D8%B5%D8%B1%D9%81%D9%87-%D9%85%D8%B9-%D9%85%D9%88%D8%B1%D9%8A%D9%86%D9%8A%D9%88-%D8%B9%D9%82%D8%A8-%D8%AE%D8%B3%D8%A7%D8%B1%D8%A9-%D8%B1%D9%8A%D8%A7%D9%84-%D9%85%D8%AF%D8%B1%D9%8A%D8%AF-%D9%81%D9%8A%D8%AF%D9%8A%D9%88/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c04794c59b7108277a2ac.png", "category": "أخبار", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788602892, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nأثار البرازيلي فينيسيوس جونيور جناح ريال مدريد موجة واسعة من الجدل بسبب تصرفه مع مدربه البرتغالي جوزيه مورينيو، عقب الهزيمة أمام ريال بيتيس 0-1 في الدوري الإسباني.\n\nوتعد هذه الخسارة الأولى للنادي الملكي في \"الليغا\" هذا الموسم، بعد ثلاثة انتصارات متتالية.\n\nوتداول رواد مواقع التواصل الاجتماعي مقطع فيديو يوثق اللقطة المثيرة، وذلك أثناء توجه فينيسيوس نحو نفق الخروج من الملعب بعد نهاية المباراة.\n\nوفي اللقطة، اقترب مورينيو من \"فيني\" لمصافحته ومحاولة التحدث إليه، إلا أن النجم البرازيلي صافحه باقتضاب ودون أن ينظر إليه تقريبا، قبل أن يواصل سيره سريعا متجاوزا مدربه، دون إبداء أي رغبة في التوقف أو الاستماع إليه.\n\nوأعادت هذه المشاهد إلى أذهان الجماهير سيناريو الموسم الماضي، والأزمات التي نشبت عندما أظهر فينيسيوس عدم احترام تجاه مدربه السابق تشابي ألونسو، عقب قرار استبداله في إحدى المباريات.\n\nوعلى إثر ذلك، عاش \"الميرنغي\" موسما كارثيا، حيث لم يتوج النادي بأي لقب تحت قيادة المدرب ألفارو أربيلوا، الذي خلف ألونسو، قبل أن يغادر النادي الملكي مع نهاية الموسم المنصرم.\n\nويرى قطاع عريض من مشجعي ريال مدريد تشابها واضحا في السلوك، ما أثار مخاوفهم من تكرار الأزمة ذاتها مع المدرب البرتغالي المخضرم.\n\nوتأتي هذه اللقطة في وقت غير متوقع، خاصة بعدما كشفت صحيفة \"ماركا\" الإسبانية المقربة من النادي الملكي، أن مورينيو كان أحد الأسباب الرئيسية في تجديد عقد فينيسيوس مع ريال مدريد مؤخرا.\n\nوأشارت إلى أن المدرب البرتغالي عقد جلسة خاصة مع اللاعب البرازيلي، شجعه فيها وأكد له أنه أحد الأركان الأساسية في المشروع الجديد للنادي الملكي.\n\nورغم أن التصرف قد يفسر بأنه رد فعل عابر ناتج عن تأثر اللاعب بمرارة الهزيمة، إلا أن مراقبين يرجحون أن تتسبب هذه اللقطة في هز ثقة مورينيو بانضباط نجمه الأول.\n\nولا يستبعد أن يلجأ مورينيو، المعروف بحزمه، إلى فرض عقوبة رادعة (إدارية أو فنية) بإجلاس الجناح البرازيلي على مقاعد البدلاء في المواجهات القادمة، فرضا للهيبة وحفاظا على استقرار غرفة ملابس الفريق.\n\nأثار قرار عدم إعادة ركلة الجزاء التي أهدرها نجم ريال مدريد كيليان مبابي ضد بيتيس جدلا واسعا، بسبب شكوك حول دخول مدافع الفريق الأندلسي مارك بارترا إلى منطقة الجزاء قبل تنفيذ الركلة.\n\nأكد جوزيه مورينيو المدير الفني لنادي ريال مدريد أن فريقه لم يكن يستحق الخسارة أمام ريال بيتيس رغم سقوطه بالمباراة التي جمعت الفريقين ضمن منافسات الجولة الثالثة من الدوري الإسباني.\n\nتلقى ريال مدريد الهزيمة الأولى في الموسم الحالي وسقط أمام مضيفه ريال بيتيس بهدف دون رد مساء الجمعة، في الجولة الرابعة من الدوري الإسباني لكرة القدم."}, {"guid": "6fd4cb44-a90a-11f1-ad33-456b2dea8570", "title": "الأمم المتحدة تتهم إسرائيل بتهجير 33 ألف فلسطيني من الضفة الغربية وتحذر من \"جرائم ضد الإنسانية وتطهير عرقي\"", "summary": "اتهمت مفوضية الأمم المتحدة السامية لحقوق الإنسان في جنيف الجمعة، إسرائيل بتهجير أكثر من 33 ألف فلسطيني من ثلاثة مخيمات في الضفة الغربية عام 2025، مشيرة إلى أن ذلك يثير مخاوف من \"ارتكاب جرائم ضد الإنسانية وتطهير عرقي\". وجاء ذلك في تقرير جديد خلص إلى أن عملية \"الجدار الحديدي\" التي نفذتها قوات الأمن ال", "link": "https://www.france24.com/ar/%D8%A7%D9%84%D8%B4%D8%B1%D9%82-%D8%A7%D9%84%D8%A3%D9%88%D8%B3%D8%B7/20260905-%D8%A7%D9%84%D8%A3%D9%85%D9%85-%D8%A7%D9%84%D9%85%D8%AA%D8%AD%D8%AF%D8%A9-%D8%AA%D8%AA%D9%87%D9%85-%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84-%D8%AA%D9%87%D8%AC%D9%8A%D8%B1-33-%D8%A3%D9%84%D9%81-%D9%81%D9%84%D8%B3%D8%B7%D9%8A%D9%86%D9%8A-%D9%85%D9%86-%D8%A7%D9%84%D8%B6%D9%81%D8%A9-%D8%A7%D9%84%D8%BA%D8%B1%D8%A8%D9%8A%D8%A9-%D8%AA%D8%AD%D8%B0%D8%B1-%D9%85%D9%86-%D8%AC%D8%B1%D8%A7%D8%A6%D9%85-%D8%B6%D8%AF-%D8%A7%D9%84%D8%A5%D9%86%D8%B3%D8%A7%D9%86%D9%8A%D8%A9-%D8%AA%D8%B7%D9%87%D9%8A%D8%B1-%D8%B9%D8%B1%D9%82%D9%8A", "image": "https://s.france24.com/media/display/c2c9d0c8-a3d4-11f1-9dfa-005056a90284/w:1024/p:16x9/000-C6TD3PD.jpg", "category": "أخبار", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788602076, "detail": ""}, {"guid": "https://arabic.rt.com/world/1829024-%D8%A7%D9%84%D9%83%D8%B1%D9%85%D9%84%D9%8A%D9%86-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D8%A7%D8%B5%D8%AF%D8%B1-%D8%A3%D9%85%D8%B1%D8%A7-%D8%A8%D8%B9%D8%AF%D9%85-%D8%B4%D9%86-%D8%A3%D9%8A-%D8%BA%D8%A7%D8%B1%D8%A7%D8%AA-%D8%B9%D9%84%D9%89-%D9%83%D9%8A%D9%8A%D9%81-%D9%84%D9%85%D8%AF%D8%A9-%D8%AB%D9%84%D8%A7%D8%AB%D8%A9-%D8%A3%D9%8A%D8%A7%D9%85-%D8%AA%D8%A8%D8%AF%D8%A3-%D9%85%D9%86-%D9%85%D9%86%D8%AA%D8%B5%D9%81-%D8%A7%D9%84%D9%84%D9%8A%D9%84%D8%A9/", "title": "الكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة", "summary": "أعلن المتحدث باسم الكرملين دميتري بيسكوف أن الرئيس الروسي فلاديمير بوتين أصدر أمرا بعدم شن أي غارات على العاصمة الأوكرانية كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة.", "link": "https://arabic.rt.com/world/1829024-%D8%A7%D9%84%D9%83%D8%B1%D9%85%D9%84%D9%8A%D9%86-%D8%A8%D9%88%D8%AA%D9%8A%D9%86-%D8%A7%D8%B5%D8%AF%D8%B1-%D8%A3%D9%85%D8%B1%D8%A7-%D8%A8%D8%B9%D8%AF%D9%85-%D8%B4%D9%86-%D8%A3%D9%8A-%D8%BA%D8%A7%D8%B1%D8%A7%D8%AA-%D8%B9%D9%84%D9%89-%D9%83%D9%8A%D9%8A%D9%81-%D9%84%D9%85%D8%AF%D8%A9-%D8%AB%D9%84%D8%A7%D8%AB%D8%A9-%D8%A3%D9%8A%D8%A7%D9%85-%D8%AA%D8%A8%D8%AF%D8%A3-%D9%85%D9%86-%D9%85%D9%86%D8%AA%D8%B5%D9%81-%D8%A7%D9%84%D9%84%D9%8A%D9%84%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9c0d924c59b7121f40b0b8.jpg", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788601955, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nأعلن المتحدث باسم الكرملين دميتري بيسكوف أن الرئيس الروسي فلاديمير بوتين أصدر أمرا بعدم شن أي غارات على العاصمة الأوكرانية كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة.\n\nوقال بيسكوف: \"بالفعل، أصدر الرئيس الروسي والقائد الأعلى للقوات المسلحة فلاديمير بوتين أمرا بعدم شن ضربات على كييف لمدة ثلاثة أيام، بدءا من منتصف هذه الليلة. وهذا مرتبط بالتحضيرات والتنسيقات للاتصالات الأمريكية في كييف\".\n\nوأضاف أن الرئيس الروسي سيلتقي بالمفاوضين الأمريكيين ستيف ويتكوف وجاريد كوشنر اليوم. \"سيُعقد اللقاء مع الرئيس بالفعل. وستكون هناك محادثة. وكما جرت العادة، كانت هذه اللقاءات مطولة. فلننتظر ونرى، وسنُطلعكم على النتائج بالتأكيد\".\n\nوحول الأفكار بشأن التسوية، صرح بيسكوف: \"لا أرغب في الإعلان عن أي شيء أو بحثه دون وجود شيء ملموس\".\n\nوتابع: \"قال ترامب نفسه أمس إنه لا يوجد حديث عن أفكار جديدة (بشأن تسوية النزاع في أوكرانيا)، وكان هذا تصريح الرئيس الأمريكي\".\n\nوتعليقا على تسلسل زيارة ويتكوف وكوشنر اليوم إلى موسكو قبل كييف، قال بيسكوف: \"عليكم أن تسألوا مفاوضي واشنطن عن هذا الأمر\".\n\nوأفادت وسائل الإعلام الأوكرانية في وقت سابق بأن القوات الأوكرانية أعلنت وقف إطلاق النار من منتصف ليل 5 سبتمبر إلى 8 سبتمبر.\n\nقال المبعوث الأمريكي الخاص ستيف ويتكوف، في الكرملين اليوم، إنه يعتبر حواره مع الرئيس الروسي فلاديمير بوتين، أكثر المحطات رسوخا في الذاكرة.\n\nأكد سفير روسيا لدى ألمانيا سيرغي نيتشاييف أن موسكو ترى اهتماما صادقا من إدارة ترامب بتحقيق السلام في أوكرانيا.\n\nيلتقي الرئيس الروسي فلاديمير بوتين اليوم بالمبعوث الأمريكي الخاص ستيف ويتكوف في روسيا للمرة السادسة.\n\nذكرت مجلة \"Responsible Statecraft\" أن المبعوثين الأمريكيين ستيف ويتكوف وجاريد كوشنر يعتزمان زيارة موسكو وكييف نهاية الأسبوع في محاولة لإحياء المفاوضات لإنهاء النزاع في أوكرانيا.\n\nوصل المبعوثان الأمريكيان ستيف ويتكوف وجاريد كوشنر إلى العاصمة الروسية موسكو لإجراء مباحثات حول إنهاء النزاع في أوكرانيا.\n\nأفادت وزارة الدفاع الروسية اليوم السبت بأن مجموعة قوات \"الجنوبية\" حررت بلدة كورتوفكا في دونيتسك، فيما واصلت القوات الروسية استهداف بنى تحتية حساسة يستخدمها الجيش الأوكراني."}, {"guid": "685996c6-a90d-11f1-ae99-15abda15f3a6", "title": "قناة بنما تقلص حركة عبور السفن بسبب ظاهرة \"النينيو\" المناخية", "summary": "بدأت قناة بنما الجمعة تقليص عدد السفن العابرة في مياهها بسبب انخفاض معدلات المتساقطات الناجم عن ظاهرة \"إلنينيو\" المناخية. وأعلنت هيئة قناة بنما أن انخفاض منسوب المياه في بحيرتين اصطناعيتين تغذيان القناة أجبرها على اتخاذ هذا الإجراء.", "link": "https://www.france24.com/ar/%D9%81%D9%8A%D8%AF%D9%8A%D9%88/20260905-%D9%82%D9%86%D8%A7%D8%A9-%D8%A8%D9%86%D9%85%D8%A7-%D8%AA%D9%82%D9%84%D8%B5-%D8%AD%D8%B1%D9%83%D8%A9-%D8%B9%D8%A8%D9%88%D8%B1-%D8%A7%D9%84%D8%B3%D9%81%D9%86-%D8%A8%D8%B3%D8%A8%D8%A8-%D8%B8%D8%A7%D9%87%D8%B1%D8%A9-%D8%A7%D9%84-%D9%86%D9%8A%D9%86%D9%8A%D9%88-%D8%A7%D9%84%D9%85%D9%86%D8%A7%D8%AE%D9%8A%D8%A9", "image": "https://s.france24.com/media/display/63d48354-a90d-11f1-aaa7-005056bf30b7/w:1024/p:16x9/AR-20260905-111229-111351-CS.jpg", "category": "أخبار", "source_id": "france24-arabic", "source_name": "فرانس 24 عربي", "source_cat": "دولية", "published": 1788601938, "detail": ""}, {"guid": "https://arabic.rt.com/middle_east/1829018-%D8%A7%D9%84%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84%D9%8A-%D9%8A%D8%AA%D9%88%D8%BA%D9%84-%D9%88%D9%8A%D9%82%D9%8A%D9%85-%D8%AD%D9%88%D8%A7%D8%AC%D8%B2-%D8%AA%D9%81%D8%AA%D9%8A%D8%B4-%D8%AF%D8%A7%D8%AE%D9%84-%D8%A7%D9%84%D8%A3%D8%AD%D9%8A%D8%A7%D8%A1-%D8%A7%D9%84%D8%B3%D9%83%D9%86%D9%8A%D8%A9-%D9%81%D9%8A-%D8%B1%D9%8A%D9%81-%D8%A7%D9%84%D9%82%D9%86%D9%8A%D8%B7%D8%B1%D8%A9/", "title": "الجيش الإسرائيلي يتوغل ويقيم حواجز تفتيش داخل الأحياء السكنية في ريف القنيطرة", "summary": "واصل الجيش الاسرائيلي توغلاته اليومية في مناطق الجنوب السوري وخصوصا عند خط فض الاشتباك.", "link": "https://arabic.rt.com/middle_east/1829018-%D8%A7%D9%84%D8%AC%D9%8A%D8%B4-%D8%A7%D9%84%D8%A5%D8%B3%D8%B1%D8%A7%D8%A6%D9%8A%D9%84%D9%8A-%D9%8A%D8%AA%D9%88%D8%BA%D9%84-%D9%88%D9%8A%D9%82%D9%8A%D9%85-%D8%AD%D9%88%D8%A7%D8%AC%D8%B2-%D8%AA%D9%81%D8%AA%D9%8A%D8%B4-%D8%AF%D8%A7%D8%AE%D9%84-%D8%A7%D9%84%D8%A3%D8%AD%D9%8A%D8%A7%D8%A1-%D8%A7%D9%84%D8%B3%D9%83%D9%86%D9%8A%D8%A9-%D9%81%D9%8A-%D8%B1%D9%8A%D9%81-%D8%A7%D9%84%D9%82%D9%86%D9%8A%D8%B7%D8%B1%D8%A9/", "image": "https://cdnv.russiatoday.com/media/pics/2026.09/thumbnail/6a9bfb664c59b7253727feb0.jpg", "category": "أمن", "source_id": "rt-arabic", "source_name": "RT عربي", "source_cat": "دولية", "published": 1788600201, "detail": "واشنطن: هجمات لايبزيغ وبولندا بالمسيرات تعتبر \"الأكثر إثارة للقلق\" ويجب عدم التسامح معها\n\nالكرملين: بوتين يصدر أمرا بعدم شن أي غارات على كييف لمدة ثلاثة أيام تبدأ من منتصف الليلة\n\nهل يتكرر سيناريو ألونسو؟.. فينيسيوس يثير الجدل بتصرفه مع مورينيو عقب خسارة ريال مدريد (فيديو)\n\nالحرس الثوري يهدد الأمريكيين بضربات أكثر قوة إذا استمرت هجماتهم على السفن الإيرانية\n\nهيغسيث يحذر إيران: استهداف السفن الأمريكية سيقابل بضرب أسطول ناقلات النفط الإيراني\n\nسيلوانوف: مشاركون في اجتماع مجموعة العشرين دعوا إلى إنهاء النزاع الأمريكي الإيراني\n\nبقائي للأمريكيين: لا تجعلوا أبناءكم \"مرتزقة\" في حرب إسرائيل على إيران مقابل شطب الديون\n\nواصل الجيش الاسرائيلي توغلاته اليومية في مناطق الجنوب السوري وخصوصا عند خط فض الاشتباك.\n\nوأفادت مصادر أهلية في القنيطرة لـRT بقيام قوة عسكرية إسرائيلية مؤلفة من 4 آليات عسكرية بالتوغل صباح اليوم السبت في قرية الرومانية بريف القنيطرة انطلاقا من بوابة أبو الغيثار حيث اقتحمت القوة القرية وأقامت حاجز تفتيش مؤقتاً داخل أحد الأحياء السكنية فيها وباشرت عمليات التفتيش قبل أن تنسحب في وقت لاحق دون ورود معلومات عن قيامها بأية عمليات اعتقال بحق أي من أبناء القرية.\n\nوأفادت مصادرنا كذلك بقيام قوة عسكرية إسرائيلية آخرى بالتوغل داخل قرية الأصبح بريف القنيطرة وأقامت القوة المؤلفة من 5 آليات عسكرية حاجزا مؤقتا لتفتيش المارة دون ورود معلومات عن قيامها بعمليات اعتقال.\n\nويواصل الجيش الاسرائيلي توغلاته العسكرية في مناطق الجنوب السوري بتغطية من الطيران الحربي والمسير حيث يقوم بترهيب المدنيين وإطلاق النار بشكل عشوائي كما يقوم بعمليات اعتقال شبه يومية وينصب الحواجز ويدقق في هويات المارة ويرفع السواتر ويرش المبيدات السامة ويحول دون وصول الفلاحين إلى أراضيهم والرعاة إلى المراعي.\n\nتجددت الاشتباكات اليوم السبت، على محاور القتال شمال غربي محافظة السويداء، جنوب سوريا.\n\nتشهد بلدة الزر التابعة لناحية البصيرة في ريف دير الزور في سوريا، اشتباكات عنيفة، وسط تصاعد حدة التوتر بين الأهالي.\n\nجدد وزير الخارجية الإسرائيلي جدعون ساعر موقف إسرائيل الرافض لوجود قواعد عسكرية تركية في سوريا، محذراً من أن ذلك \"خطاً أحمر\" لا يمكن تجاوزه،."}, {"guid": "https://www.bbc.com/arabic/articles/cdx5vzq222ro#0", "title": "هل يسعى ترامب إلى خسارة انتخابات التجديد النصفي؟ - مقال في الغارديان", "summary": "في جولة الصحافة، نتناول فرص الجمهوريين في الانتخابات النصفية، وتداعيات خفض المساعدات على أفغانستان، وتجربة للوقاية المبكرة من الزهايمر.", "link": "https://www.bbc.com/arabic/articles/cdx5vzq222ro?at_medium=RSS&at_campaign=rss", "image": "https://ichef.bbci.co.uk/ace/ws/240/cpsprodpb/9ee3/live/9c423ce0-a93a-11f1-a24a-1f5107675b0f.jpg", "category": "سياسة", "source_id": "bbc-arabic", "source_name": "بي بي سي عربي", "source_cat": "دولية", "published": 1788597233, "detail": "BBC News, عربيإذهب الى المحتوىرئيسيةشاهداستمعأقسامرئيسيةأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتأخباراقتصادصحة وعلومثقافة وفنونرياضةتحقيقاتهل يسعى ترامب إلى خسارة انتخابات التجديد النصفي؟ - مقال في الغارديانصدر الصورة، Getty Images\n\nفي جولة الصحافة لهذا اليوم، نتناول تحليلاً يتساءل عما إذا كانت سياسات دونالد ترامب، من الحرب على إيران والمواجهة الاقتصادية مع كندا إلى دعم مراكز البيانات، تقود الجمهوريين نحو خسارة انتخابات التجديد النصفي، ونتوقف عند تقرير يرصد وفيات نساء وأطفال في أفغانستان يقول إنها ارتبطت بتخفيض المساعدات الأمريكية، قبل أن نطالع تجربة عالمية تختبر إمكان استخدام دواء للزهايمر وقائياً، قبل ظهور مشكلات الذاكرة.\n\nونبدأ بمقال للكاتب جوناثان فريدلاند في صحيفة الغارديان، يتساءل فيه إن كان الرئيس الأمريكي دونالد ترامب يتصرف كما لو أنه يريد خسارة الحزب الجمهوري انتخابات التجديد النصفي المقبلة، أو أنه لا يكترث على الأقل باحتمال فقدان الحزب أغلبيته في الكونغرس.\n\nويرى فريدلاند أن هذا الطرح لا يبدو نظرية مجنونة تماماً، إذ إن هناك ما يدعو إلى الاعتقاد أن ترامب إما غير مكترث بهزيمة الجمهوريين في نوفمبر/تشرين الثاني، أو راغباً فيها سراً.\n\nووفقاً للكاتب فإن سلسلة من قرارات ترامب تبدو أقرب إلى \"إضرار متعمد\"، وفي مقدمتها الحرب التي اختار خوضها ضد إيران، التي رفعت أسعار الوقود والمواد الغذائية، وزادت من تكلفة اقتراض الحكومة الأمريكية، بما قد ينعكس على فوائد بطاقات الائتمان والرهون العقارية بالتزامن مع توجه الناخبين إلى صناديق الاقتراع.\n\nويضيف أن هذه التداعيات تضعف موقف حزب حاكم وصل إلى السلطة متعهداً بخفض التضخم، كما تهدد بإثارة استياء قاعدة حركة ماغا (لنجعل أمريكا عظيمة مجدداً)، التي كانت ترى في ترامب رئيساً يضع حداً للحروب التي لا تنتهي في الشرق الأوسط.\n\nومع ذلك، قد لا تشكّل إيران حتى أكثر مغامرات ترامب الخارجية إضراراً به انتخابياً، بحسب فريدلاند، فالمواجهة الاقتصادية التي أشعلها ترامب مع كندا دفعت أوتاوا إلى الرد على الرسوم الجمركية بإجراءات مماثلة، أصابت ولايات مثل ميشيغان وأوهايو ومين وتكساس وآيوا، وهي ولايات تشهد سباقات حاسمة على مقاعد مجلس الشيوخ.\n\nويشير إلى أن المرشحين الجمهوريين باتوا مطالبين بتفسير خسارة سوق كانت أساسية لصادرات ولاياتهم.\n\nويتوقف الكاتب عند دعم ترامب لمراكز البيانات، على الرغم من اتساع المعارضة الشعبية لها بسبب استهلاكها الطاقة والمياه وآثارها البيئية والمخاوف المرتبطة بالذكاء الاصطناعي ومستقبل الوظائف."}, {"guid": "CBMiQEFVX3lxTFBEZ0trRFlDd1FQNDhxNVltZVJQbU9UZDZjRnhaNWtnZXVFaWJZZEZRaEhqZVkwMkdwTmsxbTBISXM", "title": "رياضي / \"الخليج\" بطل السوبر السعودي لكرة اليد للمرة الثانية تواليًا والرابعة في تاريخه - وكالة الأنباء السعودية", "summary": "رياضي / \"الخليج\" بطل السوبر السعودي لكرة اليد للمرة الثانية تواليًا والرابعة في تاريخه &nbsp;&nbsp; وكالة الأنباء السعودية", "link": "https://news.google.com/rss/articles/CBMiQEFVX3lxTFBEZ0trRFlDd1FQNDhxNVltZVJQbU9UZDZjRnhaNWtnZXVFaWJZZEZRaEhqZVkwMkdwTmsxbTBISXM?oc=5", "image": "", "category": "رياضة", "source_id": "spa", "source_name": "واس (السعودية)", "source_cat": "وكالة رسمية", "published": 1788596667, "detail": ""}, {"guid": "https://www.dw.com/ar/إنصافاً-لأفريقيا-الأمم-المتحدة-تعتمد-خريطة-أكثر-دقة-للكرة-الأرضية/a-79044428?maca=ara-rss-ar-all-1125-rdf", "title": "إنصافاً لأفريقيا.. الأمم المتحدة تعتمد خريطة أكثر دقة للكرة الأرضية", "summary": "الأمم المتحدة تصوّت لصالح خريطة بديلة لإسقاط ميركاتور الذي رسمَ خريطة العالم لأربع قرون مضت، بعد اعتراضات دول أفريقية على خريطة الكرة الأرضية الحالية التي تشوّه أحجام القارات والدول، لا سيما القارة السمراء.", "link": "https://www.dw.com/ar/إنصافاً-لأفريقيا-الأمم-المتحدة-تعتمد-خريطة-أكثر-دقة-للكرة-الأرضية/a-79044428?maca=ara-rss-ar-all-1125-rdf", "image": "", "category": "رياضة", "source_id": "dw-arabic", "source_name": "DW عربي", "source_cat": "دولية", "published": 1788595380, "detail": ""}, {"guid": "CBMi5AJBVV95cUxPbjV3azlyT0R0WDNQWUw0ZjNyN3ctaW9SbVlNbGIxM3VZd0pBZk5rTm02emNrQll5aVkx
